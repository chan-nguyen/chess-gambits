name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. Any job needing more declares it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    # Must stay on a standard runner: larger runners are always billed, even on a
    # public repository, and this project's budget is $0 (docs/PROJECT-PLAN.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # The content gate (requirement F12). Required: this is the product's only
      # correctness guarantee, so a failure here blocks the merge like any other.
      - name: Validate content
        run: npm run validate:content

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
