name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. Any job needing more declares it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    # Must stay on a standard runner: larger runners are always billed, even on a
    # public repository, and this project's budget is $0 (docs/PROJECT-PLAN.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # The content gate (requirement F12). Required: this is the product's only
      # correctness guarantee, so a failure here blocks the merge like any other.
      - name: Validate content
        run: npm run validate:content

      # The catalogue gates (issue #12). Required for the same reason the content gate is:
      # a previously published id that disappears 404s every shared URL to that gambit in a
      # build that passes every other check (docs/CONTEXT.md, invariant 9).
      - name: Build the catalogue
        run: npm run catalogue
      # ADR-0005. Required, and deliberately *not* the step that finds the mates: this one
      # replays every committed certificate with `chess.js` and nothing else, in
      # milliseconds. `npm run prove:mates` may speak to Stockfish and may search for
      # minutes, so it runs on a schedule and never on a merge path — no engine is ever
      # installed on this job.
      - name: Verify mate certificates
        run: npm run verify:mates

      - name: Build
        run: npm run build

      # The Lighthouse gate (#19, AC 2), on Lighthouse's default profile, which *is* the
      # mid-tier mobile one — a Moto G Power, 4x CPU slowdown and simulated slow 4G.
      #
      # **Both assertions block.** CLS spent from #19 to #57 at `warn`, because the footer
      # shifted a full viewport on `/:locale/gambits` when the route's JSON landed after
      # first paint and the median of three read 0.216. The threshold was never widened to
      # fit; #57 fixed the shift and put the assertion back to `error`, which is what
      # `tools/perf/lighthouse-budget.test.ts` now keeps it at.
      #
      # Lighthouse is not the only CLS instrument, and that is deliberate. It measures one
      # width and whichever side of the paint/fetch race it happens to land on;
      # `e2e/layout-stability.spec.ts` measures 360px and 1280px with the route's data held
      # back so the loading state always paints first. `docs/performance-budgets.md` says why.
      #
      # Thresholds and URLs live in `lighthouserc.json`,
      # which also sets `aggregationMethod: median` — LHCI's default is `optimistic`, which
      # for a `maxNumericValue` assertion takes the **lowest** of the three runs and would
      # pass a budget that two runs in three breach. JSON carries no comments, so the trap
      # is recorded here and in `docs/PROJECT-PLAN.md` §4.
      #
      # **Here rather than in the `e2e` matrix, deliberately.** This job has already built
      # the site, and `ubuntu-latest` ships Google Chrome, so the step costs one Chrome
      # start and no second checkout, install, build or browser download. In the matrix it
      # would run twice — once per base path — to measure the identical `dist/`, for no
      # extra signal at all. It also belongs next to the other things that read `dist/`.
      #
      # **`npx`, not a devDependency, and that is a trade worth knowing about.** `@lhci/cli`
      # pulls Lighthouse and puppeteer, which carry seven `high` advisories today
      # (`extract-zip`, `tmp`) with no fixed version to upgrade to. Installing it would make
      # the audit step below fail, and the only ways to keep it green would be to stop
      # auditing devDependencies or to lower the level — weakening a gate that works in
      # order to land one that does not yet. So the tool is fetched at a pinned version, it
      # never enters the lockfile, and `npm audit --audit-level=high` stays exactly as
      # strict as it was. Nothing Lighthouse touches ships: it reads the built output.
      #
      # It measures against `scripts/static-server.ts`, which gzips like GitHub Pages does.
      # Against an uncompressed stand-in the bundle is 425KB rather than 132KB and LCP
      # measured 4.2s for a site that ships 2.1s — a budget against the wrong host.
      - name: Performance budgets, Lighthouse
        run: npm run perf:lighthouse

      - name: Audit dependencies
        run: npm audit --audit-level=high

  e2e:
    name: e2e (base ${{ matrix.base-path }})
    # Deep links and base-path resolution are claims about what a host answers for a URL,
    # so they are checked against the built output on a static server, at both base paths
    # the site can be published under (ADR-0007, ADR-0009).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base-path: ['/chess-gambits/', '/']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # This step carries the **accessibility gate** as well (#18, requirement N4).
      # `e2e/accessibility.spec.ts` runs axe-core over the home, catalogue, gambit and
      # about routes in all three locales at WCAG 2.2 AA, and a violation fails this job
      # like any other test failure — it reports nothing and passes nothing.
      #
      # It carries **four of #19's five enforced budgets** too, for the same reason and at
      # the same price of nothing:
      #
      # - `e2e/route-budgets.spec.ts` — initial JavaScript under 200KB gzipped and
      #   per-route incremental under 50KB, measured per route in the browser including
      #   that route's data payload (AC 1); and zero third-party requests at runtime,
      #   fonts included (AC 4, requirement N8).
      # - `e2e/catalogue-payload.spec.ts` — the catalogue payload at or under 100KB
      #   gzipped, over the whole shipped file (AC 1).
      # - `e2e/interaction-latency.spec.ts` — INP under 200ms pressing next, from
      #   `PerformanceObserver` on a CPU-throttled context, on the widest branch node in
      #   published content (AC 3). Lighthouse cannot measure INP, so this is not in the
      #   Lighthouse step and never can be.
      # - `e2e/content-security-policy.spec.ts` — the policy is served, the site runs clean
      #   under it, and an inline style or an off-origin script is refused (AC 6).
      #
      # Deliberately not their own job, and not even their own step: `playwright.config.ts`
      # builds the site for its own web server, so either would pay for a second build and
      # a second browser install to check the same `dist/`, on a budget of $0. What that
      # costs is discoverability, which is why they are named here.
      #
      # Running twice, once per base path, is not waste for these: the budgets are measured
      # from what a **host** answered, and `/` and `/chess-gambits/` are two hosts.
      #
      # `docs/design-system.md` §5 states what the accessibility gate does and does not
      # cover — roughly a third of WCAG — and carries the manual checklist for the rest.
      # §6 carries the performance budgets these enforce.
      - name: End-to-end tests, including the accessibility and performance gates
        run: npm run e2e
        env:
          BASE_PATH: ${{ matrix.base-path }}
