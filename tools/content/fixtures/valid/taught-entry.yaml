id: fixture-taught-entry
name: 'Fixture: queen offer after the Damiano king walk'
eco: C40
category: trap
side: white
definingLine: [e4, e5, Nf3, f6, Nxe5, fxe5, Qh5+, Ke7, Qxe5+, Kf7]
soundness:
  value: unsound
  reviewedAt: '2026-09-16'
  basis:
    by: fixture-author
    at: '2026-09-16'
    source: 'Material count only; no engine and no published source.'
judgement:
  by: fixture-author
  at: '2026-09-16'
  source: 'Reply qualities and frequencies here are an author impression, not statistics.'
tree:
  annotation:
    vi: Trắng kém một mã để đổi lấy hai tốt, nhưng vua Đen đã mất quyền nhập thành và đứng ở f7.
    en: White is a knight down for two pawns, but Black has lost castling and the king stands on f7.
    fr: Les Blancs ont un cavalier de moins pour deux pions, mais le roi noir a perdu le roque et se tient en f7.
  children:
    - ply: Qe8+
      annotation:
        vi: Hậu lao vào e8 và chiếu. Đây là một nước thí hậu; Đen có thể ăn hậu bằng hai cách.
        en: The queen goes to e8 with check. It offers the queen, and Black can take it two ways.
        fr: La dame va en e8 avec échec. C'est une offre de dame, et les Noirs peuvent la prendre de deux façons.
      dismissed:
        - ply: Qxe8
          reason: Also takes the queen, reaching the same material balance as Kxe8, which is modelled.
      children:
        - ply: Kxe8
          replyQuality: best
          frequency: common
          annotation:
            vi: Vua ăn hậu. Đen hơn hậu đổi mã và hai tốt.
            en: The king takes the queen. Black is a queen for a knight and two pawns ahead.
            fr: Le roi prend la dame. Les Noirs ont une dame contre un cavalier et deux pions.
          outcome:
            type: position
            evaluation:
              vi: Đen hơn quân quyết định. Trắng không có bù đắp nào.
              en: Black has a decisive material advantage and White has no compensation.
              fr: Les Noirs ont un avantage matériel décisif et les Blancs n'ont aucune compensation.
            plan:
              vi: Đen phát triển nốt quân, đưa vua về chỗ an toàn rồi đổi quân về tàn cuộc.
              en: Black finishes development, tucks the king away, and trades into an endgame.
              fr: Les Noirs achèvent leur développement, mettent le roi à l'abri et échangent vers la finale.
            basis:
              by: fixture-author
              at: '2026-09-16'
        - ply: Kf6
          replyQuality: blunder
          frequency: rare
          annotation:
            vi: Từ chối ăn hậu. Vua đi lên f6 và tiếp tục đứng trong luồng chiếu.
            en: Declining the queen. The king steps to f6 and stays in the firing line.
            fr: Refuser la dame. Le roi monte en f6 et reste exposé.
          children:
            - ply: Qg6+
              annotation:
                vi: Hậu lại chiếu, lần này ở g6, và lại được chào mời.
                en: The queen checks again, this time on g6, and is offered again.
                fr: La dame donne encore échec, cette fois en g6, et s'offre de nouveau.
              dismissed:
                - ply: Kxg6
                  reason: Takes the queen with the king instead of the pawn; same material outcome as hxg6.
                - ply: Ke7
                  reason: Declines a second time; the queen survives and nothing is resolved.
                - ply: Ke5
                  reason: Declines a second time and walks the king further up the board.
              children:
                - ply: hxg6
                  replyQuality: best
                  frequency: common
                  annotation:
                    vi: Tốt h7 ăn hậu. Trắng đã cho đi cả mã lẫn hậu.
                    en: The h-pawn takes the queen. White has now given away both knight and queen.
                    fr: Le pion h prend la dame. Les Blancs ont donné le cavalier et la dame.
                  outcome:
                    type: position
                    evaluation:
                      vi: Đen hơn hậu và mã, chỉ mất hai tốt. Thế cờ đã ngã ngũ.
                      en: Black is a queen and a knight up for two pawns. The game is decided.
                      fr: Les Noirs ont une dame et un cavalier de plus pour deux pions. La partie est jouée.
                    plan:
                      vi: Đen đưa vua về g8 rồi dùng ưu thế quân để đơn giản hoá.
                      en: Black walks the king back to safety and simplifies with the extra material.
                      fr: Les Noirs ramènent le roi en sécurité et simplifient avec le matériel en plus.
                    basis:
                      by: fixture-author
                      at: '2026-09-16'
