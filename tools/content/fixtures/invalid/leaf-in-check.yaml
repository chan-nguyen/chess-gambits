# A line that stops while the learner is in check. After 1.e4 e5 2.f4 Qh4+ every legal white
# move answers the check, so there is no middlegame to plan and the leaf has stopped inside a
# sequence rather than at the end of one (docs/CONTEXT.md, invariant 14).
#
# A check is the one half of the stopping rule `unsettled` may not excuse.
id: leaf-in-check
