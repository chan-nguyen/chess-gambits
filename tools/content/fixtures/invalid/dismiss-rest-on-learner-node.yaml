# `dismissRest` answers the opponent's replies that are not modelled, so it belongs only on
# an opponent node. Here it sits after 4...Ke7, where it is White's turn and White is the
# learner: what the learner plays is the gambit's choice, not a reply that needs covering.
#
# The defining line ends with White's 4.Qh5+, the learner's own ply, so the root is an
# opponent node (docs/CONTEXT.md, invariant 5) and the node one ply below it is a learner
# node. That is the one this fixture puts a catch-all on.
id: dismiss-rest-on-learner-node
name: Adversarial fixture
eco: C40
category: trap
side: white
definingLine: [e4, e5, Nf3, f6, Nxe5, fxe5, Qh5+]
soundness:
  value: unsound
  reviewedAt: '2026-09-16'
  basis: { by: a, at: '2026-09-16' }
judgement: { by: a, at: '2026-09-16' }
tree:
  dismissed:
    - { ply: g6, reason: 'Blocks with the g-pawn; outside what this fixture models.' }
  children:
    - ply: Ke7
      dismissRest:
        reason: { vi: 'Các kế hoạch khác của Trắng không được mô hình hoá.' }
      children:
        - ply: Qxe5+
          outcome: { type: unexplored }
