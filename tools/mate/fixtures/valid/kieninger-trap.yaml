# Fixture, not published content. The Kieninger Trap in the Budapest Gambit.
#
# 8.axb4?? Nd3# is a smothered mate the e2 pawn cannot answer: capturing with exd3 would
# open the e-file onto White's own king, so it is not a legal move at all.
