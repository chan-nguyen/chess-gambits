# Fixture, not published content. Légal's Mate in its h3 form, and the only mate in two in
# this corpus: after 6...Bxd1?? White answers 7.Bxf7+ and Black has exactly one legal reply,
# so the net is a chain rather than a fan.
#
# The defining line ends on White's 6.Nxe5, which is the learner's own ply, so the root is an
# opponent node and 6...Bxd1 is a modelled reply that can carry `blunder` (invariant 5).
