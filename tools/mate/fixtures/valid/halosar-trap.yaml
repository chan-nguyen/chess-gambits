# Fixture, not published content. The Halosar Trap in the Blackmar-Diemer, Ryder Gambit.
#
# Reconstructed by search rather than copied: the line that mates was found by playing the
# Ryder Gambit forward and asking which Bxf3 capture leaves White mate in one. It is
# 8...Bxf3??, answered by 9.Nxc7#, and the king's own pawns on e7 and f7 are what take away
# every flight square.
