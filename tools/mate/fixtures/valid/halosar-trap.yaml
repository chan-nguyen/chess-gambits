    en: White leaves the queen on f3 in exchange for Nxc7. Black has 42 legal moves and only one loses at once.
    fr: Les Blancs laissent la dame en f3 en échange de Nxc7. Les Noirs ont 42 coups légaux, un seul perd sur-le-champ.
