# Fixture, not published content. The Englund Gambit queen trap, and a correction.
#
# The blunder is published almost everywhere as 6.Bc3??. It is not: after 6.Bc3 Bb4 7.Qd2
# Bxc3, White recaptures with **8.Nxc3!** and has no mate against them at all — verified.
# The losing move is 8.Qxc3??, and only that one.
