      en: 8.Nxc3! recaptures with the knight and the queen keeps guarding c1. Black is a pawn up with no mate — verified.
      fr: 8.Nxc3 ! reprend du cavalier et la dame garde c1. Les Noirs ont un pion de plus, sans mat — vérifié.
