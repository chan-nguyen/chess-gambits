    vi: Trắng phải ăn lại trên c3. Ăn bằng mã thì ổn; ăn bằng hậu thì bỏ trống ô c1.
    en: White must recapture on c3. The knight recapture holds; the queen recapture abandons c1.
    fr: Les Blancs doivent reprendre en c3. Avec le cavalier, ça tient ; avec la dame, c1 est abandonnée.
