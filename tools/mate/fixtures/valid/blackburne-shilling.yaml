# Fixture, not published content. The Blackburne Shilling Gambit, and a correction.
#
# The trap is widely published as beginning at 5.Nxf7, which is wrong: at the root of this
# entry White is in check and has exactly **two** legal moves, and one of them holds. 7.Qe2!
# leaves Black no mate at all — verified, not assumed. The trap begins at 7.Be2??.
#
# Two legal replies means `dismissRest` here answers exactly one of them, which is the
# smallest a catch-all can honestly be.
