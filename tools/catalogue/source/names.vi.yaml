# Vietnamese display names.
#
# Vietnamese is the source locale for everything this site *writes*, and the catalogue is
# the one place where it is not: the names come from an English dataset (ADR-0008), so a
# catalogue entry's canonical name is English and this file translates what has an
# established Vietnamese name. Anything absent falls back to the canonical English name.
#
# Coverage is deliberately partial and honest about it. Vietnamese chess writing borrows
# most variation names untranslated, and inventing Vietnamese for six hundred obscure
# nineteenth-century variations would be worse than leaving them in the language they are
# actually published in. Piece letters are never localised (docs/design-system.md §7).

