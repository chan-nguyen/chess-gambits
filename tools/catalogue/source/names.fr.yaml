# French display names.
#
# The dataset is English, so a catalogue entry's canonical name is English and this file
# translates what has an established French name. Anything absent falls back to the
# canonical English name — which is what that field *is* (docs/CONTEXT.md, Gambit), not a
# gap to apologise for. Coverage grows with the content.
#
# Piece letters are never localised: `3.Nxe5` stays `3.Nxe5` in all three locales, because
# a learner reading it here reads the same thing every other chess resource shows them
# (docs/design-system.md §7).

