# Named traps. Hand-entered, one at a time, ECO code included.
#
# This file is the counterweight to `classification.yaml`. Breadth is free for gambits —
# one rule admits a whole family and the dataset supplies the names, the codes and the
# lines. **Breadth is not free for traps**, and the catalogue must not imply otherwise
# (ADR-0008). Every entry below was written out by hand, its ECO looked up, its line
# replayed on a board. Twelve of them took longer than six hundred gambits did.
#
# The reason is not laziness upstream. `lichess-org/chess-openings` is a list of opening
# **variations**, so a trap appears in it only when it is also the name of a variation —
# and when it does, it is filed under the surrounding opening and carries that opening's
# ECO code. "Ruy Lopez: Noah's Ark Trap" is C71 because the Modern Steinitz is C71. That
# is exactly why `category: trap` entries are exempt from the ECO check: the check would
# resolve a trap line to whatever opening it sits inside and be satisfied by the wrong
# answer. Légal's Mate, the Halosar Trap and the Kieninger Trap are not in the dataset in
# any form.
#
# `line` ends with the **learner's own ply**, so the opponent's mistake is always a
# modelled reply carrying a quality (docs/CONTEXT.md, invariant 5). The build checks it.
# Nothing here claims a mate: a forced mate is proved by the build or refused (invariant 4),
# and this file states identity only.

reviewedBy: chan
reviewedAt: '2026-09-16'
basis: >-
  Long-established trap lines from general opening literature, each line replayed on a
  board and each ECO code taken from the surrounding opening in the dataset. These are
  judgements about which traps are worth teaching, not measurements, and no engine was
  consulted.

traps:
  - id: legals-mate
    name: "Légal's Mate"
    family: 'Philidor Defense'
    eco: C41
    side: white
    soundness: sound
    line: [e4, e5, Nf3, d6, Bc4, Bg4, Nc3]
    reason: >-
      The queen sacrifice that ends in mate with three minor pieces. Not in the dataset in
      any form, under any name.

  - id: fishing-pole-trap
    name: 'Fishing Pole Trap'
    family: 'Ruy Lopez'
    eco: C65
    side: black
    soundness: dubious
    line: [e4, e5, Nf3, Nc6, Bb5, Nf6, 'O-O', Ng4]
    reason: >-
      Black hangs the knight on g4 to open the h-file. The dataset does have a "Fishing
      Pole Variation" row, filed under the Berlin Defense and coded C65 with it — an
      opening variation, not a trap, which is the distinction this file exists for.

  - id: elephant-trap
    name: 'Elephant Trap'
    family: "Queen's Gambit Declined"
    eco: D51
    side: black
    soundness: sound
    line: [d4, d5, c4, e6, Nc3, Nf6, Bg5, Nbd7]
    reason: >-
      The oldest trap in the Queen's Gambit Declined: taking on d5 loses a piece to the
      pin-breaking check. Not in the dataset under this or any name.

  - id: lasker-trap
    name: 'Lasker Trap'
    family: "Queen's Gambit Declined"
    eco: D08
    side: black
    soundness: sound
    line: [d4, d5, c4, e5, dxe5, d4, e3, 'Bb4+']
    reason: >-
      The famous underpromotion trap in the Albin. The dataset carries a row named for it,
      as a sub-variation of the Albin Countergambit; that row is excluded in
      `classification.yaml` so this entry is the only one for the trap.

  # The Blackburne Shilling Trap is deliberately **not** here. Its line — 1.e4 e5 2.Nf3 Nc6
  # 3.Bc4 Nd4 — is the same position the dataset calls the Blackburne-Kostić Gambit, which
  # the catalogue already carries as a gambit. Two entries on one defining line would be two
  # URLs for one opening, and the second one to be published would be the one nobody links
  # to. The trap belongs inside that entry as a **trap branch**, which is a property of one
  # branch rather than an entry of its own (docs/CONTEXT.md, "Trap branch").

  - id: noahs-ark-trap
    name: "Noah's Ark Trap"
    family: 'Ruy Lopez'
    eco: C71
    side: black
    soundness: sound
    line: [e4, e5, Nf3, Nc6, Bb5, a6, Ba4, d6, d4, b5, Bb3, Nxd4]
    reason: >-
      The pawns close around the light-squared bishop and it never gets out. The dataset's
      own row for it is C71 — the code of the Modern Steinitz it sits inside.

  - id: mortimer-trap
    name: 'Mortimer Trap'
    family: 'Ruy Lopez'
    eco: C65
    side: black
    soundness: dubious
    line: [e4, e5, Nf3, Nc6, Bb5, Nf6, d3, Ne7]
    reason: >-
      Black retreats the knight and invites a fork that loses a piece to a discovered
      attack. Filed by the dataset under the Anti-Berlin at C65.

  - id: siberian-trap
    name: 'Siberian Trap'
    family: 'Sicilian Defense'
    eco: B21
    side: black
    soundness: sound
    line: [e4, c5, d4, cxd4, c3, dxc3, Nxc3, Nc6, Nf3, e6, Bc4, Qc7, 'O-O', Nf6, Qe2, Ng4]
    reason: >-
      The standard refutation of a careless Smith-Morra: ...Nd4 wins the queen. Its dataset
      row is a Smith-Morra sub-variation and is excluded in `classification.yaml`.

  - id: halosar-trap
    name: 'Halosar Trap'
    family: 'Blackmar-Diemer Gambit Accepted'
    eco: D00
    side: white
    soundness: dubious
    line: [d4, d5, e4, dxe4, Nc3, Nf6, f3, exf3, Qxf3, Qxd4, Be3, Qb4, 'O-O-O']
    reason: >-
      The Ryder Gambit's queen sacrifice trap. Not in the dataset under this name.

  - id: kieninger-trap
    name: 'Kieninger Trap'
    family: 'Indian Defense'
    eco: A52
    side: black
    soundness: sound
    line: [d4, Nf6, c4, e5, dxe5, Ng4, Bf4, Nc6, Nf3, 'Bb4+', Nbd2, Qe7]
    reason: >-
      The smothered finish in the Budapest. Not in the dataset under this name.

  - id: englund-gambit-trap
    name: 'Englund Gambit Trap'
    family: 'Englund Gambit'
    eco: A40
    side: black
    soundness: unsound
    line: [d4, e5, dxe5, Nc6, Nf3, Qe7, Bf4, 'Qb4+']
    reason: >-
      The ...Qb4+ and ...Qxb2 raid that ends in mate on b2 if White grabs the rook. The
      gambit is unsound and the trap is the reason anyone plays it.

  - id: damiano-defence-refutation
    name: 'Damiano Defence, 3.Nxe5 refutation'
    family: "King's Pawn Game"
    eco: C40
    side: white
    soundness: sound
    line: [e4, e5, Nf3, f6, Nxe5]
    reason: >-
      Already authored in `content/damiano-defence-refutation.yaml`, and listed here because
      an authored entry that is in no catalogue source file is unreachable. Its id was
      published before this file existed and is pinned by the frozen map.

  - id: monticelli-trap
    name: 'Monticelli Trap'
    family: 'Bogo-Indian Defense'
    eco: E11
    side: white
    soundness: dubious
    line:
      [
        d4,
        Nf6,
        c4,
        e6,
        Nf3,
        b6,
        g3,
        Bb7,
        Bg2,
        'Bb4+',
        Bd2,
        'Bxd2+',
        Qxd2,
        'O-O',
        Nc3,
        Ne4,
        Qc2,
        Nxc3,
        Ng5,
      ]
    reason: >-
      White ignores the c3 knight hanging to b2 and instead threatens Qxh7# with the g5
      knight guarding the queen's escape. Not in the dataset under this name; #118's source
      lists it as "Bogo-Indian Defense: Monticelli Trap" without a trap-specific ECO, so it
      takes the E11 of the Bogo-Indian it sits inside.

  - id: tarrasch-trap
    name: 'Tarrasch Trap'
    family: 'Ruy Lopez'
    eco: C83
    side: white
    soundness: sound
    line:
      [
        e4,
        e5,
        Nf3,
        Nc6,
        Bb5,
        a6,
        Ba4,
        Nf6,
        'O-O',
        Nxe4,
        d4,
        b5,
        Bb3,
        d5,
        dxe5,
        Be6,
        c3,
        Be7,
        Re1,
        'O-O',
        Nd4,
      ]
    reason: >-
      Chosen over the dataset's other row for this name ("Berlin Defense, Tarrasch Trap",
      C66) because the Open Defence version (C83) is the one with a citable, independently
      checkable line and a documented pedigree — Tarrasch himself is credited with the
      underlying idea against two future World Championship challengers — while the C66
      version has no source found in researching #118 that pins down an exact position. Its
      dataset row is a Ruy Lopez sub-variation excluded in `classification.yaml`.

  - id: rubinstein-trap
    name: 'Rubinstein Trap'
    family: 'Cambridge Springs Defense'
    eco: D52
    side: black
    soundness: sound
    line: [d4, d5, c4, c6, Nf3, Nf6, Nc3, e6, Bg5, Nbd7, e3, Qa5, Nd2, dxc4]
    reason: >-
      The Rubinstein Variation of the Cambridge Springs (7.Nd2, stepping the f3 knight aside
      rather than the c3 one, which cannot reach d2 at all). Moving that knight leaves the g5
      bishop undefended the moment ...dxc4 opens the fifth rank to the queen on a5, which is
      the tactic this entry's tree actually verifies — a different, more direct point than
      the delayed-dxc4 "Bd3?? dxc4! Bxf6 cxd3!" trick some sources describe for a related but
      distinct move order. Its dataset row is a Cambridge Springs sub-variation excluded in
      `classification.yaml`.

  - id: scandinavian-defense-kiel-variation-trap
    name: 'Scandinavian Defense: Kiel Variation Trap'
    family: 'Scandinavian Defense'
    eco: B01
    side: black
    soundness: unsound
    line: [e4, d5, exd5, Nf6, d4, Nxd5, c4, Nb4]
    reason: >-
      Included on request from #118's reference lists, but neither commonly cited threat
      (...Nc2+ or ...Nd3+) survives replay — both squares are defended and the knight is
      simply lost. 5.a3! leaves the knight without a good square; taught so it is recognised
      rather than played with real hope of a trick. Its dataset row is a Scandinavian
      sub-variation excluded in `classification.yaml`.

  - id: indian-defense-budapest-gambit-accepted-fajarowicz-defense
    name: 'Budapest Gambit Accepted: Fajarowicz Defense Trap'
    family: 'Budapest Gambit'
    eco: A51
    side: black
    soundness: dubious
    line: [d4, Nf6, c4, e5, dxe5, Ne4]
    reason: >-
      A separate entry from the Budapest Gambit's own tree, which only mentions 2...Ne4 in
      passing. The popular online "wins the queen" continuation (...Qd4+ or ...Qxg3+ after
      the king walk) does not survive replay — both hang the queen — so this entry models the
      line that does hold up: a real piece sacrifice for two pawns and an exposed king, with
      no proven verdict either way. Its dataset row is a Budapest sub-variation excluded in
      `classification.yaml`.

  - id: vienna-game-wurzburger-trap
    name: 'Würzburger Trap'
    family: 'Vienna Game'
    eco: C29
    side: white
    soundness: dubious
    line: [e4, e5, Nc3, Nf6, f4, d5, fxe5, Nxe4, d3, 'Qh4+', g3, Nxg3, Nf3, Qh5, Nxd5]
    reason: >-
      The sixth trap for #118, picked from `classification.yaml`'s own note (around its
      Vienna Game rows) that the Würzburger was a real trap not yet hand-entered. Black's
      greedy 8...Nxh1 costs the exchange back via 9.Nxc7+ and 10.Nxa8, but replaying the
      final material count by hand found only a one-pawn edge, not the "wins a piece" some
      summaries claim — real, lasting structural damage to Black's queenside rather than a
      proven decisive advantage.

  - id: smith-morra-gambit-accepted-open-d-file-trap
    name: 'Smith-Morra Gambit Accepted: Open d-File Trap'
    family: 'Sicilian Defense'
    eco: B21
    side: white
    soundness: dubious
    line: [e4, c5, d4, cxd4, c3, dxc3, Nxc3, d6, Bc4, Nf6, e5]
    reason: >-
      From #125, a lichess study chapter naming only the players (David L Zardus vs Anthony
      Steventon, 1986), so no borrowed trap name is used. The point is not just "Bxf7+ wins
      the queen" — every early trade on both sides has emptied the d-file since move two, so
      by the time 6...dxe5 7.Bxf7+ arrives, ...Kd7 is illegal (the queen on d1 already covers
      it) and Kxf7 is forced, leaving d8 undefended for 8.Qxd8. Same B21 code as this file's
      Siberian Trap, the Smith-Morra Gambit Accepted's own ECO.

  - id: vienna-game-frankenstein-dracula-qd5-trap
    name: 'Vienna Game: Frankenstein-Dracula Variation, Qd5 Trap'
    family: 'Vienna Game'
    eco: C27
    side: white
    soundness: dubious
    line: [e4, e5, Nc3, Nf6, Bc4, Nxe4, 'Bxf7+', Kxf7, Nxe4, Nc6, 'Qf3+', Kg8, Ng5]
    reason: >-
      From #125's lichess study chapter "Trap in The Vienna" (Kutjanin vs Jakobjuk, 1940),
      which shows the game continuing 7...Qf6 8.Qd5+ Qe6 9.Nxe6, winning material but no
      more than that. Replaying the position after 7.Ng5 with chess.js found something the
      study does not mention: the tempting 7...Qxg5?? — grabbing the knight the study never
      addresses — walks into 8.Qd5#, a genuine forced mate the source never shows. Its
      dataset row is the Frankenstein-Dracula Variation, C27, excluded as a sub-variation in
      `classification.yaml`.

  - id: magnus-smith-trap
    name: 'Magnus Smith Trap'
    family: 'Sicilian Defense'
    eco: B57
    side: white
    soundness: sound
    line:
      [
        e4,
        c5,
        Nf3,
        Nc6,
        d4,
        cxd4,
        Nxd4,
        Nf6,
        Nc3,
        d6,
        Bc4,
        g6,
        Nxc6,
        bxc6,
        e5,
        dxe5,
        'Bxf7+',
        Kxf7,
        Qxd8,
      ]
    reason: >-
      Named for the Canadian champion Magnus Smith. After 7.Nxc6 bxc6 8.e5 the natural
      8...dxe5?? walks into 9.Bxf7+!, deflecting the king off the back rank so 10.Qxd8 wins
      the queen outright — 9...Kxf7 is forced, since declining the bishop or stepping the
      king aside both drop the queen just as fast. Found for #134 by searching the Sicilian
      rows for a "Trap" name this file did not already carry. Its dataset row (Sicilian
      Defense: Magnus Smith Trap, B57) is not imported as a gambit because nobody in the
      main line deliberately offers material — the loss is entirely Black's mistake at move
      8, which is exactly what `category: trap` is for.

  - id: stafford-gambit-rosen-trap
    name: 'Stafford Gambit: Rosen Trap'
    family: "Petrov's Defense"
    eco: C42
    side: black
    soundness: sound
    line: [e4, e5, Nf3, Nf6, Nxe5, Nc6, Nxc6, dxc6, d3, Bc5]
    reason: >-
      Wikipedia's "Stafford Gambit" article names this specific continuation "the Rosen
      Trap" in its Tactical traps section (citing a Kusuma document hosted on Scribd), after
      IM Eric Rosen, whose online play popularised the whole gambit. The natural-looking
      6.Bg5? walks into 6...Nxe4!, and if White grabs the queen with 7.Bxd8?? the reply is
      forced mate: 7...Bxf2+ 8.Ke2 Bg4#. Its dataset row (Petrov's Defense: Stafford Gambit
      Accepted, C42) is folded into the gambit already imported from the shorter "Petrov's
      Defense: Stafford Gambit" row (3...Nc6) by the prefix match in `classification.yaml`,
      so this trap's own line — four plies deeper, ending on Black's own 5...Bc5 — is not a
      second entry for the same defining line.

  - id: petrovs-defense-marshall-trap
    name: "Petrov's Defense: Marshall Trap"
    family: "Petrov's Defense"
    eco: C42
    side: black
    soundness: sound
    line: [e4, e5, Nf3, Nf6, Nxe5, d6, Nf3, Nxe4, d4, d5, Bd3, Bd6, 'O-O', 'O-O', c4, Bg4, cxd5, f5]
    reason: >-
      Wikipedia's dedicated "Petrov's Defence, Marshall Trap" article: the natural-looking
      10.Re1?? (10.Nc3 is correct) walks into 10...Bxh2+! 11.Kxh2 Nxf2, forking the queen,
      and after 12.Qe2 Nxd3 13.Qxd3 Bxf3 14.Qxf3 Qh4+ 15.Kg1 Qxe1+ Black wins the exchange
      and more for a bishop, a clean and decisive material haul rather than mate. Its
      dataset row ("Petrov's Defense: Classical Attack, Marshall Trap", C42) runs one ply
      further, to Black's punishing 10...Bxh2+, so this entry's own line — ending on
      Black's own 9...f5, the last quiet move before White's mistake — is not a second
      entry for that row.

  - id: zukertort-opening-tennison-gambit-briggs-trap
    name: "Tennison Gambit: Brigg's Trap"
    family: 'Tennison Gambit'
    eco: A06
    side: white
    soundness: sound
    line: [e4, d5, Nf3, dxe4, Ng5, Nf6, Nc3, Bf5, Qe2]
    reason: >-
      Documented across multiple independent chess-teaching sources (chess.com's "Weekly
      Opening Exploration" and "Ten Tricky Traps in the Tennison" blogs, chess-teacher.com's
      "Tennison Gambit Trap" and Chessable's Tennison Gambit guide, plus the Chess Wiki
      Fandom page carrying the same name) as the standard punishment for the greedy
      5...Qd4?: 6.Qb5+! forces a block or king move, and after 6...c6 7.Qxb7 the queen
      collects a second pawn while forking the bishop on f5 and the rook on a8, leaving
      Black unable to avoid dropping further material. `classification.yaml` already
      excludes the dataset's own row for this exact name (`Zukertort Opening: Tennison
      Gambit, Brigg's Trap`, A06) as a named trap "not yet hand-entered" — this is that
      entry.

  - id: traxler-counterattack-ke2-trap
    name: 'Traxler Counterattack: Ke2 Trap'
    family: 'Italian Game'
    eco: C57
    side: black
    soundness: sound
    line: [e4, e5, Nf3, Nc6, Bc4, Nf6, Ng5, Bc5, Nxf7, 'Bxf2+']
    reason: >-
      The line of the founding game of the whole opening, J. Reinisch vs Karel Traxler,
      Hostouň 1890, as recorded on Wikipedia's "Traxler Counterattack" page (citing
      Chessgames.com): after 5.Nxf7 Bxf2+, declining correctly with 6.Kf1 or capturing with
      6.Kxf2 both hold for White, but the tempting in-between 6.Ke2?? — keeping the extra
      rook on h8 en prise without shutting down the checks — has no defence at all. Traxler's
      own annotation on the game, quoted on the page, calls the forced finish "pretty":
      6...Nd4+ 7.Kd3 b5!! 8.Bb3 Nxe4!! 9.Nxd8 Nc5+ 10.Kc3 Ne2+ 11.Qxe2 Bd4+ 12.Kb4 a5+
      13.Kxb5 Ba6+ 14.Kxa5 Bd3+ 15.Kb4 Na6+ 16.Ka4 Nb4+ 17.Kxb4 c5#, queen and both knights
      given up to walk the white king to its own side of the board. Its dataset row (Italian
      Game: Two Knights Defense, Traxler Counterattack, C57) is folded into the gambit
      already imported from the shorter defining line (4...Bc5) by the same prefix match, so
      this trap's own line — six plies deeper, ending on Black's own 5...Bxf2+ — is not a
      second entry for that line either.
