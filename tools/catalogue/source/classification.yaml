  # Four rows inside otherwise-included families are named traps rather than gambits. A
  # named trap is `category: trap` and lives in `traps.yaml` with its own hand-entered ECO
  # code (ADR-0008); importing it here would give the same trap a second entry, a second
  # id and the surrounding opening's ECO.
  - match: "Queen's Gambit Declined: Albin Countergambit, Lasker Trap"
    include: false
    code: duplicate-trap
    reason: >-
      A named trap, carried by `traps.yaml` as `lasker-trap` with its own identifying line.
      Importing it as a gambit variation would publish the Lasker Trap twice under two ids.
  - match: 'Sicilian Defense: Smith-Morra Gambit Accepted, Siberian Variation, Siberian Trap'
    include: false
    code: duplicate-trap
    reason: >-
      A named trap, carried by `traps.yaml` as `siberian-trap`. The dataset files it as a
      Smith-Morra sub-variation and codes it B21 with the gambit, which is the ECO problem
      traps are exempt from.
  - match: 'Vienna Game: Vienna Gambit, Wurzburger Trap'
    include: false
