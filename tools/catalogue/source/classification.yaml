      gambits and is not free for traps; this is what that costs.
  # ------------------------------------------------------------------ the #56 review: published entries whose side no board supported
  #
  # Issue #36 proved the side of every row it added and left the rows that were already
  # published untouched. Pointed at those, the same prover found 45 entries whose declared
  # side no ply of their own defining line supports, and 40 of them with a provable offer by
  # the *other* side — ten Van Geet lines under a head rule that says in as many words
  # "Every one is White's", the six Lemberger rows, and every Bird, Bishop's, Vienna and
  # Zukertort line where it is the defender who puts a pawn out.
  #
  # Each rule below names the ply that gives the material away and lets the build read the
  # side off a board, which is the only mechanism this file has for saying which way a board
  # faces. Where the choice was between two plies that both prove — the Anderssen and the
  # Thorold each offer a second pawn after ...b5, the Lasker a second after 1...e5 — the ply
  # named is the one where the material actually leaves, not the one the variation is named
  # after.
  - match: 'Bird Opening: Hobbs Gambit'
    include: true
    sacrifice: { ply: 2, move: g5 }
    soundness: { value: unsound, by: chan, at: '2026-09-17' }
    reason: >-
      1...g5 is Black's pawn and 2.fxg5 simply takes it. The head rule reads 1.f4 as White's
      gambit family; this row is the other side of it.
  - match: 'Bird Opening: Hobbs-Zilbermints Gambit'
    include: true
    sacrifice: { ply: 4, move: g5 }
