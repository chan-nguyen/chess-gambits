# Benoni Defense: Zilbermints-Benoni Gambit. Frozen defining line 1.d4 c5 2.b4, which ends on
# White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). Replayed
# with chess.js through 2...cxb4: Black simply takes the offered pawn, the only piece that
# can capture there. Nothing is hanging at the resulting position. searchMate at 4 moves
# from this position returns no-mate, so no forced mate is claimed anywhere in this entry.
id: benoni-defense-zilbermints-benoni-gambit
name: 'Benoni Defense: Zilbermints-Benoni Gambit'
eco: A43
category: gambit
side: white
definingLine: [d4, c5, b4]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. White offers a wing pawn on the very second move for a diagonal that is
      not even open yet, and Black keeps the pawn without any real concession. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
