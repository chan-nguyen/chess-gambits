# Zukertort Opening: Shabalov Gambit. Frozen defining line 1.Nf3 e6 2.c4 a6 3.Nc3 c5 4.g3
# b5, which ends on Black's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). The line below was replayed with chess.js before being annotated.
id: zukertort-opening-shabalov-gambit
name: 'Zukertort Opening: Shabalov Gambit'
eco: A04
category: gambit
side: black
definingLine: [Nf3, e6, c4, a6, Nc3, c5, g3, b5]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. Black throws in ...b5 to rip open the queenside before finishing
      development, but White simply takes with cxb5 and the pawn stays taken; Black's
      a-pawn is left permanently isolated on a6 with nothing yet to show in return. No
      engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Sau một thế trận kiểu Anh với 1.Nf3 e6 2.c4 a6 3.Nc3 c5 4.g3, Đen tung ra 4...b5!?, thí một tốt cánh hậu để phá vỡ thế trận trước khi hoàn tất phát triển.
    en: After an English-style setup with 1.Nf3 e6 2.c4 a6 3.Nc3 c5 4.g3, Black throws in 4...b5!?, offering a queenside pawn to blow the position open before finishing development.
    fr: Après une mise en place de style anglais avec 1.Nf3 e6 2.c4 a6 3.Nc3 c5 4.g3, les Noirs lancent 4...b5!?, offrant un pion à l'aile dame pour ouvrir la position avant d'avoir terminé leur développement.
  dismissRest:
    reason:
      vi: Trắng không ăn tốt b5. Các nước khác như Bg2 hay d4 để nguyên con tốt ấy, và Đen vẫn phải tự chứng minh ý đồ của mình mà chưa thu được gì thêm.
      en: White does not take the b5 pawn. Anything else, such as Bg2 or d4, leaves that pawn alone, and Black still has to prove the idea without having gained anything yet.
      fr: Les Blancs ne prennent pas le pion b5. Tout le reste, comme Bg2 ou d4, laisse ce pion tranquille, et les Noirs doivent encore prouver leur idée sans avoir rien gagné pour l'instant.
  children:
    - ply: cxb5
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng ăn tốt b5 bằng chính tốt c, cách trực diện nhất để kiểm chứng xem Đen có thật sự bù đắp được hay không.
        en: White simply takes the b5 pawn with the c-pawn, the most direct way to test whether Black really has enough to show for it.
        fr: Les Blancs prennent simplement le pion b5 avec le pion c, la façon la plus directe de tester si les Noirs ont vraiment de quoi compenser.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy — Trắng hơn đúng một tốt sạch. Con tốt a của Đen giờ đứng lẻ loi ở a6, vĩnh viễn không còn tốt b nào để chống lưng, một điểm yếu cấu trúc cộng thêm vào con tốt đã mất, trong khi chưa có gì cụ thể bù lại được cho Đen.
          en: Count the pawns and it is eight for White, seven for Black — White is a clean pawn up. Black's a-pawn now stands alone on a6, permanently without a b-pawn to support it, an added structural weakness on top of the missing pawn, with nothing concrete yet to show in return.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs — les Blancs ont un pion de plus. Le pion a des Noirs se retrouve désormais isolé en a6, à jamais privé d'un pion b pour le soutenir, une faiblesse structurelle qui s'ajoute au pion manquant, sans rien de concret encore à montrer en échange.
        plan:
          vi: Trắng chơi Bg2, nhập thành và d4, hoàn tất phát triển và củng cố con tốt thừa, tính chuyện gây sức ép lên tốt a6 yếu về sau. Đen chơi ...Nf6, ...Bb7 và ...d5, cố mở thế trận và tạo hoạt động cho quân cờ để bù lại hai điểm yếu đang có.
          en: White plays Bg2, castles and follows with d4, completing development and consolidating the extra pawn, looking to press the weak a6 pawn later. Black plays ...Nf6, ...Bb7 and ...d5, trying to open the position and generate piece activity to compensate for the two problems now on the board.
          fr: Les Blancs jouent Bg2, roquent puis enchaînent par d4, achevant leur développement et consolidant le pion supplémentaire, en visant plus tard le pion a6 affaibli. Les Noirs jouent ...Nf6, ...Bb7 et ...d5, essayant d'ouvrir la position et de générer de l'activité pour leurs pièces afin de compenser les deux problèmes désormais sur l'échiquier.
        basis:
          by: chan
          at: '2026-09-25'
