tree:
  annotation:
    vi: 'Trắng vừa chơi 3.g4, hiến một tốt: tốt g4 tấn công tốt f5, vốn không có quân bảo vệ, trong khi chính tốt g4 bị tốt f5 và mã f6 tấn công mà chỉ có tốt h3 bảo vệ.'
    en: 'White has just played 3.g4, offering a pawn: it attacks the pawn on f5, which nothing defends, while the g4 pawn is attacked by the f5 pawn and the knight on f6 and defended only by the h3 pawn.'
    fr: 'Les Blancs viennent de jouer 3.g4, offrant un pion : il attaque le pion f5, que rien ne défend, tandis que le pion g4 est attaqué par le pion f5 et le cavalier f6 et défendu seulement par le pion h3.'
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 3...fxg4. Bài này chỉ đi theo nhánh ăn tốt 3...fxg4; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 3...fxg4 here. This entry follows the capture 3...fxg4 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 3...fxg4. Cette fiche ne suit que la prise 3...fxg4 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: fxg4
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen ăn tốt bằng 3...fxg4. Tốt mới ở g4 bị tốt h3 tấn công và được mã f6 bảo vệ.
        en: Black takes the pawn with 3...fxg4. The new pawn on g4 is attacked by the h3 pawn and defended by the knight on f6.
        fr: Les Noirs prennent le pion par 3...fxg4. Le nouveau pion g4 est attaqué par le pion h3 et défendu par le cavalier f6.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt, và Đen có hai tốt trên cột g, ở g7 và g4. Tốt g4 bị tốt h3 tấn công một lần và được mã f6 bảo vệ một lần. Trắng chưa phát triển quân nào, còn Đen mới có mã f6.'
          en: 'Count the pawns: White seven, Black eight, so White is a pawn down, and Black has two pawns on the g-file, on g7 and g4. The pawn on g4 is attacked once, by the h3 pawn, and defended once, by the knight on f6. White has not developed a piece, and Black only the knight on f6.'
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins, et les Noirs ont deux pions sur la colonne g, en g7 et en g4. Le pion g4 est attaqué une fois, par le pion h3, et défendu une fois, par le cavalier f6. Les Blancs n'ont développé aucune pièce, les Noirs seulement le cavalier f6."
        plan:
          vi: Trắng ăn lại bằng hxg4, mở cột h về phía tốt h7; Đen đáp ...Nxg4 và vẫn hơn một tốt, vì khi đó Trắng có sáu tốt còn Đen có bảy.
          en: White recaptures with hxg4, which opens the h-file toward the h7 pawn; Black answers ...Nxg4 and is still a pawn up, since White then has six pawns to Black's seven.
          fr: Les Blancs reprennent par hxg4, ce qui ouvre la colonne h vers le pion h7 ; les Noirs répondent ...Nxg4 et restent un pion de plus, car les Blancs ont alors six pions contre sept.
        basis:
          by: chan
          at: '2026-09-30'
