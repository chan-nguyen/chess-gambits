# Owen Defense: Matovinsky Gambit. Defining line 1.e4 b6 2.d4 Bb7 3.Bd3 f5 4.exf5 Bxg2
# 5.Qh5+ g6, which ends on Black's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5).
# Part of batch s of round 4 (#182). Every ply below was replayed with chess.js before it
# was annotated; searchMate at 3 moves from the leaf returns no-mate, so no forced mate is
# claimed anywhere in this entry. The leaf leaves a capture going free, which its
# `unsettled` note acknowledges.
id: owen-defense-matovinsky-gambit
name: 'Owen Defense: Matovinsky Gambit'
eco: B00
category: gambit
side: black
definingLine: [e4, b6, d4, Bb7, Bd3, f5, exf5, Bxg2, Qh5+, g6]
soundness:
  value: unsound
  reviewedAt: '2026-10-01'
  basis:
    by: chan
    at: '2026-10-01'
    source: >-
      A judgement, deepened from the frozen listed-tier classification in
      tools/catalogue/source/classification.yaml. At the end of the defining line the pawn
      count is level, seven each, but White's queen on h5 and rook on h1 are both attacked
      and defended by nothing, and with Black's f-pawn gone the diagonal from h5 to e8 has
      only the g6 pawn on it. White's f5 pawn can capture on g6, which removes the attacker
      of the queen. The rating of unsound is the catalogue's. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-10-01'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen vừa chơi 5...g6, nên số tốt đang ngang nhau, mỗi bên bảy. Hậu h5 bị tốt g6 tấn công và không được quân nào bảo vệ, xe h1 bị tượng g2 tấn công và không được quân nào bảo vệ, còn tốt f5 được hậu cùng tượng d3 bảo vệ và tấn công tốt g6.
    en: Black has just played 5...g6, so the pawn count is level, seven each. The queen on h5 is attacked by the g6 pawn and defended by nothing, the rook on h1 is attacked by the bishop on g2 and defended by nothing, and the pawn on f5 is defended by the queen and the bishop on d3 and attacks the pawn on g6.
    fr: Les Noirs viennent de jouer 5...g6, de sorte que le compte des pions est égal, sept de chaque côté. La dame h5 est attaquée par le pion g6 et n'est défendue par aucune pièce, la tour h1 est attaquée par le fou g2 et n'est défendue par aucune pièce, et le pion f5 est défendu par la dame et le fou d3 et attaque le pion g6.
  dismissRest:
    reason:
      vi: Trắng chơi nước khác thay vì 6.fxg6 ở đây, chẳng hạn 6.Qg4 hoặc 6.Qe2. Mục này chỉ mô hình hóa 6.fxg6 và không phân tích các nước kia; sau chúng xe h1 vẫn bị tượng g2 tấn công và không được quân nào bảo vệ.
      en: White plays something other than 6.fxg6 here, for instance 6.Qg4 or 6.Qe2. This entry models only 6.fxg6 and does not analyse those moves; after them the rook on h1 is still attacked by the bishop on g2 and nothing defends it.
      fr: Les Blancs jouent autre chose que 6.fxg6 ici, par exemple 6.Qg4 ou 6.Qe2. Cette entrée ne modélise que 6.fxg6 et n'analyse pas ces coups ; après eux la tour h1 est toujours attaquée par le fou g2 et aucune pièce ne la défend.
  children:
    - ply: fxg6
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng ăn bằng 6.fxg6, loại bỏ con tốt đang tấn công hậu h5, và giờ tốt g6 cùng hậu cùng tấn công tốt h7. Tốt g6 được hậu và tượng d3 bảo vệ.
        en: White takes with 6.fxg6, which removes the pawn that attacked the queen on h5, and the pawn on g6 and the queen now attack the pawn on h7 together. The pawn on g6 is defended by the queen and the bishop on d3.
        fr: Les Blancs prennent par 6.fxg6, ce qui retire le pion qui attaquait la dame h5, et le pion g6 et la dame attaquent maintenant ensemble le pion h7. Le pion g6 est défendu par la dame et le fou d3.
      unsettled: "Bxh1 is going free because nothing of White's can recapture on h1, but it is the greedy capture, not a line to teach: it leaves White's pawn free to capture on h7 with a discovered check from the queen, so the evaluation reads the position before it is played."
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen sáu, nên Đen kém một tốt. Tốt g6 và hậu h5 cùng tấn công h7, ô chỉ có xe h8 bảo vệ, và vì f7 trống nên tốt g6 là thứ duy nhất nằm trên đường chéo từ h5 tới e8, nên nếu nó ăn ở h7 thì hậu chiếu vua, và vua e8 sẽ không còn ô nào để đi, vì hậu, tượng và các tốt của Đen chiếm d8, f8, d7 và e7, còn hậu Trắng khống chế f7. Tượng g2 của Đen tấn công xe h1 của Trắng, quân không được quân nào bảo vệ.'
          en: "Count the pawns: White seven, Black six, so Black is a pawn down. The pawn on g6 and the queen on h5 both attack h7, which only the rook on h8 defends, and because f7 is empty the g6 pawn is the only thing on the diagonal from h5 to e8, so if it captures on h7 the queen gives check, and the king on e8 would have no square to go to, since Black's queen, bishop and pawns occupy d8, f8, d7 and e7 and the queen covers f7. Black's bishop on g2 attacks White's rook on h1, which nothing defends."
          fr: "Comptez les pions : sept pour les Blancs, six pour les Noirs, donc les Noirs ont un pion de moins. Le pion g6 et la dame h5 attaquent tous deux h7, que seule la tour h8 défend, et comme f7 est vide, le pion g6 est la seule chose sur la diagonale de h5 à e8, de sorte que s'il prend en h7 la dame donne échec, et le roi e8 n'aurait aucune case où aller, puisque la dame, le fou et les pions noirs occupent d8, f8, d7 et e7 et que la dame blanche couvre f7. Le fou g2 noir attaque la tour h1 blanche, que rien ne défend."
        plan:
          vi: Trắng chơi gxh7+, một nước chiếu lộ, rồi Bg5 và Ne2 để đưa thêm quân vào cuộc tấn công. Đen chơi ...Bg7 để nhường f8 cho vua, rồi ...Kf8 và ...Nf6.
          en: White plays gxh7+, a discovered check, then Bg5 and Ne2 to bring more pieces into the attack. Black plays ...Bg7 to free f8 for the king, then ...Kf8 and ...Nf6.
          fr: Les Blancs jouent gxh7+, un échec à la découverte, puis Bg5 et Ne2 pour amener d'autres pièces à l'attaque. Les Noirs jouent ...Bg7 pour libérer f8 pour le roi, puis ...Kf8 et ...Nf6.
        basis:
          by: chan
          at: 2026-10-01
