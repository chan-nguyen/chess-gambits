tree:
  annotation:
    vi: Trắng vừa đưa tượng ra c4, Gambit Tượng. Mục này đi sâu riêng vào 3...Nf6, tấn công thẳng vào tốt e4.
    en: White has just played the bishop to c4, the Bishop's Gambit. This entry follows specifically 3...Nf6, attacking the e4 pawn directly.
    fr: Les Blancs viennent de jouer le fou en c4, le Gambit du Fou. Cette entrée suit spécifiquement 3...Nf6, attaquant directement le pion e4.
  dismissRest:
    reason:
      vi: Đen đáp lại 3.Bc4 bằng một nước khác ngoài 3...Nf6 — giữ tốt bằng 3...g5, đánh trung tâm bằng 3...d5, hay chiếu bằng 3...Qh4+. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 3.Bc4 with something other than 3...Nf6 — holding the pawn with 3...g5, striking the centre with 3...d5, or checking with 3...Qh4+. Each is outside the scope of this entry.
      fr: Les Noirs répondent à 3.Bc4 par autre chose que 3...Nf6 — conserver le pion par 3...g5, une frappe centrale par 3...d5, ou un échec par 3...Qh4+. Chacun sort du cadre de cette entrée.
  children:
    - ply: Nf6
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Đen phát triển quân và tấn công thẳng vào tốt e4, buộc Trắng phải phản ứng ngay thay vì tự do dựng trung tâm.
        en: Black develops a piece and attacks the e4 pawn directly, forcing White to react at once instead of freely building the centre.
        fr: Les Noirs développent une pièce et attaquent directement le pion e4, forçant les Blancs à réagir aussitôt plutôt que de bâtir librement le centre.
      children:
        - ply: Nc3
          annotation:
            vi: Biến Bogoljubow. Trắng đỡ tốt e4 bằng mã, phát triển thêm một quân và chưa cần vội quyết định số phận con tốt f4.
            en: The Bogoljubow Variation. White defends e4 with the knight, develops another piece, and is in no hurry to decide the fate of the f4 pawn.
            fr: La Variante Bogoljubow. Les Blancs défendent e4 avec le cavalier, développent une pièce de plus, et ne sont pas pressés de trancher le sort du pion f4.
          outcome:
            type: position
            evaluation:
              vi: Đen vẫn hơn đúng con tốt f4 ban đầu. Cả hai bên đều đã ra được một quân nhẹ, tốt e4 giờ được đỡ chắc chắn, và ván cờ chuyển sang một cuộc đấu phát triển bình thường quanh con tốt thừa ấy.
              en: Black is still exactly one pawn up, the original f4 pawn. Both sides have a minor piece out, the e4 pawn is now solidly held, and the game turns into an ordinary development race around that extra pawn.
              fr: Les Noirs restent exactement un pion devant, le pion f4 initial. Les deux camps ont une pièce mineure en jeu, le pion e4 est désormais solidement tenu, et la partie se transforme en une course de développement ordinaire autour de ce pion supplémentaire.
            plan:
              vi: Trắng chơi Nf3, O-O và d4, xây dựng trung tâm và tìm cách giành lại con tốt f4 bằng áp lực lên nó. Đen chơi c6 hoặc Bc5, hoàn thiện phát triển và giữ con tốt f4 làm vốn liếng lâu dài.
              en: White plays Nf3, castles and pushes d4, building the centre and looking for pressure that wins the f4 pawn back. Black plays c6 or Bc5, completing development and banking the f4 pawn as a long-term asset.
              fr: Les Blancs jouent Nf3, roquent et poussent d4, bâtissant le centre et cherchant une pression qui regagne le pion f4. Les Noirs jouent c6 ou Bc5, achevant leur développement et conservant le pion f4 comme atout durable.
            basis:
              by: chan
              at: '2026-09-25'
