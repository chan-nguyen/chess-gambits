# Ruy Lopez: Morphy Defense, Schliemann Defense Deferred. Frozen defining line 1.e4 e5 2.Nf3 Nc6
# 3.Bb5 a6 4.Ba4 f5, which ends on Black's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). Replayed with chess.js through 5.exf5. searchMate at 3 moves from the resulting
# position returns no-mate, so no forced mate is claimed anywhere in this entry, and no capture is
# left going free at the leaf.
id: ruy-lopez-morphy-defense-schliemann-defense-deferred
name: 'Ruy Lopez: Morphy Defense, Schliemann Defense Deferred'
eco: C70
