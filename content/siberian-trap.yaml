# The Siberian Trap, the standard refutation of a careless Smith-Morra Gambit. The defining
# line is the one frozen in `tools/catalogue/source/traps.yaml` — 1.e4 c5 2.d4 cxd4 3.c3
# dxc3 4.Nxc3 Nc6 5.Nf3 e6 6.Bc4 Qc7 7.O-O Nf6 8.Qe2 Ng4 — and it ends on Black's own ply, so
# the root is an opponent node and White's replies can carry a quality (docs/CONTEXT.md,
# invariant 5).
#
# ECO is B21, matching `traps.yaml` (a trap carries the ECO of the opening it sits inside,
# ADR-0008; the dataset's own row for this trap is excluded there since this entry is the
# only one for it).
#
# Three mates are claimed here, each with `type: trap` and nothing else; the move counts and
# the certificates are produced by `npm run prove:mates` and replayed by
# `npm run verify:mates` (ADR-0005). Replayed with chess.js: the knight on f3 is the only
# thing guarding h2, and Black's queen on c7 already bears on h2 along the completely open
# c7-h2 diagonal, with the knight on g4 also covering that exact square, which is what stops
# the king from ever recapturing there.
#
# Until #175 the tree modelled 9.Ng5?? alone, and its catch-all said that every reply keeping
# the knight on f3 kept the trap from springing. That was false: the textbook Siberian Trap
# is 9.h3?? Nd4!, when the knight has to choose between the queen on e2 and the square h2 —
# 10.Nxd4 Qh2#, 10.hxg4 Nxe2+ and the queen is gone for two knights — and 9.a3?? Nd4 is the
# same story. Both are modelled now, every 10th-move reply is answered (mate proved where it
# is a mate, material counted where it is material), and the catch-all says only what is true
# of the replies it still covers.
id: siberian-trap
name: Siberian Trap
eco: B21
category: trap
side: black
definingLine: [e4, c5, d4, cxd4, c3, dxc3, Nxc3, Nc6, Nf3, e6, Bc4, Qc7, 'O-O', Nf6, Qe2, Ng4]
soundness:
  value: sound
  reviewedAt: '2026-09-30'
  basis:
    by: chan
    at: '2026-09-30'
    source: >-
      A judgement, and the same label `traps.yaml` carries. The mate does not need Black to
      provoke anything further — the queen on c7 and the knight on g4 are already aimed at
      h2 the moment the position is reached, and White simply cannot move the f3 knight
      without losing at once. Leaving the knight alone is not enough either: 9.h3 and 9.a3
      both lose to ...Nd4, which forces that same knight to choose between the queen on e2
      and the square h2. The trap punishes the two most common ways of meeting the position,
      moving the knight and asking the g4 knight a question. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-09-30'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date. The mates are not — they are machine-proved and replayed by CI.
tree:
  annotation:
    vi: Đen vừa chơi Ng4. Nước này trông giống một cách đe doạ tốt f2 bình thường, nhưng thực chất nó đang đóng vai trò thứ hai đứng canh ô h2 cùng với con hậu ở c7 — con hậu ấy đã nhìn thẳng vào h2 suốt từ đường chéo c7-h2 hoàn toàn thông thoáng, và điều duy nhất còn giữ ô đó lại là con mã f3 của Trắng.
    en: Black has just played Ng4. It looks like an ordinary threat against f2, but it is really playing a second role, guarding h2 alongside the queen on c7 — a queen that has been staring straight down the completely open c7-h2 diagonal the whole time, with the only thing still holding that square being White's own knight on f3.
    fr: Les Noirs viennent de jouer Ng4. Cela ressemble à une menace ordinaire contre f2, mais ce coup joue en réalité un second rôle, gardant h2 aux côtés de la dame en c7 — une dame qui fixe depuis le début la diagonale c7-h2 totalement dégagée, la seule chose retenant encore cette case étant le propre cavalier blanc en f3.
  counts:
    legal: { count: legalReplies, expect: 40 }
    mated: { count: matedBy, ply: 'Qxh2#', expect: 5 }
  dismissRest:
    reason:
      vi: Trắng chơi một nước khác. {Mated} trong {legal} nước hợp lệ ở đây đưa con mã f3 rời khỏi ô của nó mà không chắn đường chéo, và mỗi lần như vậy Đen chiếu bí ngay bằng Qxh2#, vì không còn quân nào canh ô ấy và vua g1 không thể ăn hậu do chính con mã g4 cũng nhìn vào h2. Nước 9.Ne5 cũng rời f3 nhưng đứng chắn ngay trên đường chéo c7-h2, đổi lại con mã ấy bị ba quân tấn công — hậu c7 và cả hai con mã Đen — mà không có gì bảo vệ. Mọi nước còn lại đều giữ nguyên con mã trên f3 và ô h2 vẫn được canh, nên chưa có nước chiếu bí nào để chơi ngay — ở đây cái bẫy là một lời đe doạ, chưa phải một điều chắc chắn. Nước ăn duy nhất trong số đó, 9.Bxe6, đổi một con tượng lấy một con tốt. Hai nước tốt trông vô hại, 9.h3 và 9.a3, đáng học riêng vì ...Nd4 trừng phạt chúng, và được dựng thành nhánh bên dưới.
      en: White plays anything else. {Mated} of the {legal} legal replies here move the f3 knight off its square without blocking the diagonal, and each time that happens Black mates at once with Qxh2#, because nothing is left guarding that square and the king on g1 cannot take the queen while the knight on g4 also covers h2. 9.Ne5 leaves f3 too but lands right on the c7-h2 diagonal and blocks it — at the price of a knight that is attacked three times, by the queen on c7 and both black knights, and defended by nothing. Every other reply keeps the knight on f3 and h2 covered, so there is no mate to play at once — here the trap is a threat, not yet a certainty. The one capture among them, 9.Bxe6, gives a bishop for a pawn. The two harmless-looking pawn moves 9.h3 and 9.a3 are worth studying on their own because ...Nd4 punishes them, and they are modelled below.
      fr: Les Blancs jouent autre chose. {Mated} des {legal} réponses légales ici déplacent le cavalier f3 sans boucher la diagonale, et chaque fois les Noirs matent aussitôt par Qxh2#, car plus rien ne garde cette case et le roi g1 ne peut pas prendre la dame tant que le cavalier g4 couvre aussi h2. 9.Ne5 quitte f3 lui aussi mais se pose en plein sur la diagonale c7-h2 et la bouche — au prix d'un cavalier attaqué trois fois, par la dame c7 et les deux cavaliers noirs, et défendu par rien. Toutes les autres réponses gardent le cavalier en f3 et h2 couverte, si bien qu'il n'y a aucun mat à jouer sur-le-champ — ici le piège est une menace, pas encore une certitude. La seule prise du lot, 9.Bxe6, donne un fou pour un pion. Les deux coups de pion d'apparence inoffensive, 9.h3 et 9.a3, méritent une étude à part parce que ...Nd4 les punit, et ils sont modélisés ci-dessous.
  children:
    - ply: Ng5
      replyQuality: blunder
      frequency: common
      annotation:
        vi: Trắng đưa mã ra g5, một nước trông như đang tấn công (nhắm vào f7 hay h7) và hoàn toàn không nghĩ gì đến ô h2 vừa bị bỏ trống. Đây chính là kiểu nước tự nhiên nhất mà cái bẫy Siberia chờ đợi.
        en: White brings the knight to g5, a move that looks aggressive (eyeing f7 or h7) and gives no thought at all to the square h2 it just abandoned. This is exactly the kind of natural-looking move the Siberian Trap is waiting for.
        fr: Les Blancs amènent le cavalier en g5, un coup qui paraît agressif (visant f7 ou h7) et qui ne songe pas du tout à la case h2 qu'il vient d'abandonner. C'est exactement le genre de coup d'apparence naturelle qu'attend le piège sibérien.
      outcome:
        type: trap
    - ply: h3
      replyQuality: blunder
      frequency: common
      annotation:
        vi: Trắng đẩy tốt h3 để hỏi con mã g4, cách phản xạ nhất để đối phó với một con mã đang nhòm ngó f2 và h2. Nhưng con tốt h vừa rời h2, nên nếu con mã f3 biến mất thì Qh2 sẽ là chiếu bí trên một ô trống — và Đen có ngay một nước ép con mã ấy phải chọn.
        en: White pushes h3 to ask the g4 knight the question, the most reflexive way to meet a knight eyeing f2 and h2. But the h-pawn has just left h2, so if the f3 knight ever disappears, Qh2 is mate on an empty square — and Black has a move that forces exactly that choice on the knight.
        fr: Les Blancs poussent h3 pour interroger le cavalier g4, la façon la plus réflexe de traiter un cavalier qui lorgne f2 et h2. Mais le pion h vient de quitter h2, si bien que si le cavalier f3 disparaît, Qh2 est mat sur une case vide — et les Noirs ont un coup qui impose précisément ce choix au cavalier.
      children:
        - ply: Nd4
          annotation:
            vi: Đen phớt lờ con mã g4 đang bị tấn công và nhảy mã c6 vào d4, tấn công hậu e2 và đồng thời con mã f3. Bây giờ mọi nước ăn của Trắng đều có giá, Nxd4 bỏ ô h2 và bị Qh2# ngay, còn hxg4 thì để Nxe2+ lấy hậu.
            en: Black ignores the attacked knight on g4 and jumps the c6 knight into d4, hitting the queen on e2 and the knight on f3 at the same time. Now every capture White has comes at a price, Nxd4 abandons h2 and is met by Qh2# on the spot, while hxg4 allows Nxe2+ to take the queen.
            fr: Les Noirs ignorent le cavalier g4 attaqué et sautent le cavalier c6 en d4, frappant la dame e2 et le cavalier f3 en même temps. Désormais chaque prise blanche a un prix, Nxd4 abandonne h2 et se heurte à Qh2# sur-le-champ, tandis que hxg4 permet Nxe2+ qui gagne la dame.
          counts:
            legal: { count: legalReplies, expect: 41 }
            mated: { count: matedBy, ply: 'Qh2#', expect: 6 }
          dismissRest:
            reason:
              vi: Trắng chơi một nước khác. {Mated} trong {legal} nước hợp lệ ở đây đưa con mã f3 đi chỗ khác và bị hậu Đen chiếu bí ngay trên h2 — 10...Qh2#, hay 10...Qxh2# nếu chính con mã nhảy vào ô ấy — đúng cơ chế như ở gốc nhưng nay trên một ô h2 đã trống. Nước nào để hậu Trắng ở lại e2 thì mất hậu vào tay con mã d4 bằng ...Nxe2, thường kèm chiếu, đổi lấy đúng một con mã. Còn nếu hậu bước đi — Qd3, Qe3, Qd1, Qe1, Qd2 hay Qc2 — thì ...Nxf3+ ăn con mã còn lại kèm chiếu, và dù Trắng ăn lại bằng tốt g, bằng hậu, hay né vua sang h1, con mã g4 lùi về e5 và Đen vẫn giữ ít nhất con tốt thừa của gambit.
              en: White plays anything else. {Mated} of the {legal} legal replies here move the f3 knight elsewhere and are mated at once by the black queen on h2 — 10...Qh2#, or 10...Qxh2# if the knight itself has jumped there — the same mechanism as at the root but now on an empty h2. Any reply that leaves the queen on e2 loses it to the d4 knight with ...Nxe2, usually with check, for just a knight. And if the queen steps away — Qd3, Qe3, Qd1, Qe1, Qd2 or Qc2 — ...Nxf3+ takes the other knight with check, and whether White recaptures with the g-pawn or the queen or steps the king to h1, the g4 knight drops back to e5 and Black keeps at least the gambit's extra pawn.
              fr: Les Blancs jouent autre chose. {Mated} des {legal} réponses légales ici déplacent le cavalier f3 ailleurs et sont matées aussitôt par la dame noire en h2 — 10...Qh2#, ou 10...Qxh2# si le cavalier lui-même y a sauté — le même mécanisme qu'à la racine, mais sur une case h2 désormais vide. Toute réponse qui laisse la dame en e2 la perd sur ...Nxe2 du cavalier d4, le plus souvent avec échec, contre un simple cavalier. Et si la dame s'écarte — Qd3, Qe3, Qd1, Qe1, Qd2 ou Qc2 — ...Nxf3+ prend l'autre cavalier avec échec, et que les Blancs reprennent du pion g ou de la dame, ou glissent le roi en h1, le cavalier g4 recule en e5 et les Noirs conservent au moins le pion de plus du gambit.
