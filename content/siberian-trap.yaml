                en: White takes the d4 knight that is attacking the queen — the most natural capture, and the one that abandons h2. What follows is proved by machine rather than asserted by a person.
                fr: Les Blancs prennent le cavalier d4 qui attaque la dame — la prise la plus naturelle, et celle qui abandonne h2. La suite est prouvée par la machine plutôt qu'affirmée par un humain.
              outcome:
