                        en: White recaptures with the bishop, the only way not to lose more, since the c4 bishop thereby leaves the c-file on which Black's queen could take it. The forced sequence ends here and everything can be counted.
                        fr: Les Blancs reprennent du fou, la seule façon de ne pas perdre davantage, car le fou c4 quitte ainsi la colonne c où la dame noire pouvait le prendre. La séquence forcée s'achève ici et tout peut se compter.
                      outcome:
                        type: position
                        evaluation:
                          vi: Đen đã đổi hai con mã lấy con hậu Trắng và vẫn giữ con tốt thừa của gambit. Trắng còn hai tượng, hai mã, hai xe và sáu tốt; Đen còn hậu, hai tượng, hai xe và bảy tốt. Cả hai vua đều đang an toàn — Trắng đã nhập thành, Đen chưa nhưng không quân Trắng nào nhìn vào e8 — và không quân nào đang bị treo ở cả hai bên.
                          en: Black has given two knights for White's queen and still has the gambit's extra pawn. White has two bishops, two knights, two rooks and six pawns; Black has a queen, two bishops, two rooks and seven pawns. Both kings are safe for now — White has castled, Black has not but no white piece bears on e8 — and nothing is hanging on either side.
                          fr: Les Noirs ont donné deux cavaliers pour la dame blanche et gardent le pion de plus du gambit. Les Blancs ont deux fous, deux cavaliers, deux tours et six pions ; les Noirs une dame, deux fous, deux tours et sept pions. Les deux rois sont en sécurité pour l'instant — les Blancs ont roqué, les Noirs non mais aucune pièce blanche ne vise e8 — et rien n'est en prise d'un côté ni de l'autre.
                        plan:
                          vi: Đen phát triển nốt bằng ...Be7 hoặc ...Bd6, ...O-O và ...d5 để mở đường chéo cho tượng c8 và tạo mục tiêu cho hậu. Con hậu là quân tầm xa duy nhất còn lại để tấn công, nên Đen tránh đổi quân và nhắm nó vào các tốt Trắng ở g4 và b2 cùng vua g1. Bốn quân nhẹ của Trắng phải phối hợp với nhau — Bf4 hay Be3, Rad1 chiếm cột d, Nd4 hoặc Nb5 quấy rối hậu — và tuyệt đối không mở thêm đường nào vào vua của mình.
                          en: Black finishes developing with ...Be7 or ...Bd6, ...O-O and ...d5 to open the c8 bishop's diagonal and give the queen targets. The queen is the only long-range attacking piece left, so Black avoids trades and points it at White's pawns on g4 and b2 and at the king on g1. White's four minor pieces have to work together — Bf4 or Be3, Rad1 to take the d-file, Nd4 or Nb5 to harass the queen — and above all open no further lines towards their own king.
                          fr: Les Noirs achèvent leur développement par ...Be7 ou ...Bd6, ...O-O et ...d5 pour ouvrir la diagonale du fou c8 et donner des cibles à la dame. La dame est la seule pièce à longue portée qui reste pour attaquer, donc les Noirs évitent les échanges et la braquent sur les pions blancs g4 et b2 et sur le roi g1. Les quatre pièces mineures blanches doivent coopérer — Bf4 ou Be3, Rad1 pour prendre la colonne d, Nd4 ou Nb5 pour harceler la dame — et surtout n'ouvrir aucune nouvelle ligne vers leur propre roi.
                        basis:
                          by: chan
                          at: '2026-09-30'
