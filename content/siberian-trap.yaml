              annotation:
                vi: Trắng ăn con mã đang tấn công hậu, và con mã f3 rời khỏi ô canh h2 đúng như cái bẫy mong đợi. Với con tốt vẫn còn ở h2, nước chiếu bí là một nước ăn — và cũng do máy chứng minh.
                en: White takes the knight that is attacking the queen, and the f3 knight leaves its guard on h2 exactly as the trap intends. With the pawn still on h2 the mate is a capture — and it is proved by machine like the others.
                fr: Les Blancs prennent le cavalier qui attaque la dame, et le cavalier f3 quitte sa garde de h2 exactement comme le piège l'entend. Le pion étant encore en h2, le mat est une prise — et il est prouvé par la machine comme les autres.
              outcome:
                type: trap
