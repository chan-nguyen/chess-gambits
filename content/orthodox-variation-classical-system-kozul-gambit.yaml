      annotation:
        vi: Đen ăn tốt bằng 14...Nxc5. Mã c5 bị tượng f2 tấn công và được tốt d6 bảo vệ, còn nó tấn công tốt e4, được mã c3 và tốt f3 bảo vệ.
        en: Black takes the pawn with 14...Nxc5. The knight on c5 is attacked by the bishop on f2 and defended by the d6 pawn, and it attacks the e4 pawn, which the knight on c3 and the f3 pawn defend.
        fr: Les Noirs prennent le pion par 14...Nxc5. Le cavalier c5 est attaqué par le fou f2 et défendu par le pion d6, et il attaque le pion e4, que le cavalier c3 et le pion f3 défendent.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng thiếu một tốt. Mã c5 bị tượng f2 tấn công và được tốt d6 bảo vệ, còn Trắng không còn tốt nào trên cột c, nên cột này nửa mở cho xe c1, nhưng mã c3 đang đứng chắn phía trước con xe đó.'
          en: "Count the pawns: White seven, Black eight, so White is a pawn down. The knight on c5 is attacked by the bishop on f2 and defended by the d6 pawn, and White has no pawn left on the c-file, so the file is half open for White's rook on c1, but the knight on c3 stands in front of that rook."
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins. Le cavalier c5 est attaqué par le fou f2 et défendu par le pion d6, et les Blancs n'ont plus de pion sur la colonne c, si bien que cette colonne est semi-ouverte pour la tour c1, mais le cavalier c3 se tient devant cette tour."
        plan:
          vi: Trắng chơi b4 để đuổi mã và đưa con mã còn lại vòng sang bằng Nd3. Đen đẩy các tốt cánh vua bằng ...h5 và ...g4 và phát triển bằng ...Bd7 và ...a6.
          en: White plays b4 to drive the knight back and brings the other knight round with Nd3. Black pushes the kingside pawns with ...h5 and ...g4 and develops with ...Bd7 and ...a6.
          fr: Les Blancs jouent b4 pour repousser le cavalier et ramènent l'autre cavalier par Nd3. Les Noirs poussent les pions de l'aile roi par ...h5 et ...g4 et se développent par ...Bd7 et ...a6.
