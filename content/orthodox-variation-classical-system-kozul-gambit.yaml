tree:
  annotation:
    vi: Trắng vừa chơi 14.c5, hiến một tốt. Tốt c5 bị tốt d6 và mã d7 tấn công mà chỉ có tượng f2 bảo vệ, còn tốt d6 bị tốt c5 tấn công và được tốt c7 bảo vệ.
    en: White has just played 14.c5, offering a pawn. The c5 pawn is attacked by the d6 pawn and the knight on d7 and defended only by the bishop on f2, and the d6 pawn is attacked by the c5 pawn and defended by the c7 pawn.
    fr: Les Blancs viennent de jouer 14.c5, offrant un pion. Le pion c5 est attaqué par le pion d6 et le cavalier d7 et défendu seulement par le fou f2, et le pion d6 est attaqué par le pion c5 et défendu par le pion c7.
  dismissRest:
