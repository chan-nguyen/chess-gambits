    source: >-
      A judgement. White offers the e4 pawn outright with 5.c3, planning a broad centre with
      d4, but the c3 pawn also takes away the knight's natural developing square, so White's
      compensation is a matter of tempo rather than anything forced yet. No engine was
      consulted and no database was queried.
judgement:
