# Kádas Opening: Schneider Gambit. Frozen defining line 1.h4 g5, which ends on Black's own
# ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). The line below was
# replayed with chess.js before being annotated.
id: kadas-opening-schneider-gambit
name: 'Kádas Opening: Schneider Gambit'
eco: A00
category: gambit
side: black
definingLine: [h4, g5]
soundness:
  value: unsound
  reviewedAt: '2026-09-18'
  basis:
    by: chan
    at: '2026-09-18'
    source: >-
      A judgement. White simply takes the pawn with hxg5 and it stays taken — Black has
      nothing concrete for it beyond a half-open g-file that Black's own king will need to
      hide behind. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đáp lại nước đi lạ 1.h4 của Kádas, Đen chơi luôn 1...g5, một con tốt không được quân nào đỡ, mời Trắng ăn nó để đổi lấy đường chéo mở cho tượng f8 và cột g nửa mở về sau.
    en: Answering the odd 1.h4, Black plays 1...g5 straight away, an undefended pawn, offering it to open a diagonal for the f8 bishop and a half-open g-file later on.
    fr: En réponse au coup insolite 1.h4, les Noirs jouent d'emblée 1...g5, un pion non défendu, l'offrant pour ouvrir une diagonale au fou f8 et une colonne g semi-ouverte plus tard.
  dismissRest:
    reason:
      vi: Trắng không ăn con tốt g5. Các nước khác như d4 hay Nf3 để nguyên con tốt g5 trên bàn cờ, nghĩa là lời mời vẫn chưa hề được nhận.
      en: White does not take the g5 pawn. Anything else, such as d4 or Nf3, leaves the g5 pawn sitting on the board, meaning the offer has still not actually been accepted.
      fr: Les Blancs ne prennent pas le pion g5. Tout le reste, comme d4 ou Nf3, laisse le pion g5 sur l'échiquier, ce qui veut dire que l'offre n'a toujours pas été acceptée.
  children:
    - ply: hxg5
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng ăn con tốt ngay lập tức bằng tốt h, quân duy nhất có thể ăn tại đó. Con tốt g5 không được quân Đen nào đỡ nên đây đơn giản là ăn một tốt miễn phí.
        en: White takes the pawn at once with the h-pawn, the only piece that can capture there. The g5 pawn is defended by nothing of Black's, so this is simply picking up a free pawn.
        fr: Les Blancs prennent aussitôt le pion avec le pion h, la seule pièce pouvant capturer là. Le pion g5 n'est défendu par rien du côté noir, il s'agit donc simplement de ramasser un pion gratuit.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy. Trắng hơn đúng một tốt sạch, con tốt g đã mất ngay từ nước đầu tiên, và chưa có gì đòi lại được nó. Cái Đen có để bù lại chỉ là cột g nửa mở, nhưng chính vua Đen sẽ cần nấp sau hàng tốt cánh vua ấy, nên đây không phải là một sự đền bù thực sự.
          en: Count the pawns and it is eight for White, seven for Black. White is a clean pawn up, the g-pawn lost on the very first move, and nothing has won it back yet. What Black has to show for it is only the half-open g-file, but it is Black's own king that will need to shelter behind that same kingside pawn cover, so this is not real compensation.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs. Les Blancs ont un pion de plus bien réel, le pion g perdu dès le tout premier coup, et rien ne l'a encore récupéré. Ce que les Noirs ont à montrer pour cela n'est que la colonne g semi-ouverte, mais c'est justement le roi noir qui devra s'abriter derrière cette même couverture de pions à l'aile roi, donc ce n'est pas une vraie compensation.
        plan:
          vi: Trắng chơi d4, Nf3 và e4, phát triển nhanh và giữ vững con tốt thừa trước khi Đen kịp khai thác cột g. Đen chơi Bg7, Nc6 và h5, cố mở cột g và tìm cách gây sức ép lên cánh vua Trắng, dù Trắng còn chưa nhập thành về phía đó.
          en: White plays d4, Nf3 and e4, developing quickly and holding the extra pawn before Black can exploit the g-file. Black plays Bg7, Nc6 and h5, trying to open the g-file and pressure White's kingside, even though White has not castled there yet.
          fr: Les Blancs jouent d4, Nf3 et e4, se développant rapidement et gardant le pion supplémentaire avant que les Noirs ne puissent exploiter la colonne g. Les Noirs jouent Bg7, Nc6 et h5, en essayant d'ouvrir la colonne g et de faire pression sur l'aile roi blanche, bien que les Blancs n'y aient pas encore roqué.
        basis:
          by: chan
          at: '2026-09-18'
