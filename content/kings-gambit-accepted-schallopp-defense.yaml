        en: The Schallopp Defense. Black develops a knight and attacks the e4 pawn directly, forcing White to react at once — one of the sound, well-regarded replies to the King's Knight Gambit.
        fr: La Défense Schallopp. Les Noirs développent un cavalier et attaquent directement le pion e4, forçant les Blancs à réagir aussitôt — l'une des réponses solides et bien considérées au Gambit du Cavalier du Roi.
