                evaluation:
                  vi: 'Đếm tốt: Trắng sáu, Đen bảy, nên Trắng thiếu một tốt. Mã e5 tấn công tốt f7, chỉ có vua bảo vệ, và tốt c6, được tốt b7 bảo vệ. Mã e4 của Đen bị mã c3 tấn công và được tượng f5 bảo vệ.'
                  en: "Count the pawns: White six, Black seven, so White is a pawn down. The knight on e5 attacks the f7 pawn, which only the king defends, and the c6 pawn, which the b7 pawn defends. Black's knight on e4 is attacked by the knight on c3 and defended by the bishop on f5."
