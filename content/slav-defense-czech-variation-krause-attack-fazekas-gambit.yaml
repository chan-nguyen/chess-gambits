                vi: Đen chắn đường chéo bằng 8...e6. Tốt f7 giờ chỉ bị mã e5 tấn công và được vua bảo vệ, còn tốt e6 bị tượng c4 tấn công và được tốt f7 và tượng f5 bảo vệ.
                en: Black blocks the diagonal with 8...e6. The f7 pawn is now attacked only by the knight on e5 and defended by the king, and the e6 pawn is attacked by the bishop on c4 and defended by the f7 pawn and the bishop on f5.
                fr: Les Noirs bloquent la diagonale par 8...e6. Le pion f7 n'est plus attaqué que par le cavalier e5 et défendu par le roi, et le pion e6 est attaqué par le fou c4 et défendu par le pion f7 et le fou f5.
              outcome:
