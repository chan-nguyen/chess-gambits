    source: >-
      A judgement. 7.e4 puts a pawn on a square that Black attacks twice and White defends
      once, and it leaves the black pawn on c4, which nothing defends, as White's only
      return. It is a sharp practical try rather than a sound sacrifice, so the label is
      dubious. No engine was consulted and no database was queried.
