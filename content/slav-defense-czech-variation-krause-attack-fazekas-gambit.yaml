                  en: White castles with O-O, plays g4 to hit the bishop on f5 and brings the queen out with Qf3. Black trades on c3 with ...Nxc3, then develops with ...Nc7 and ...Bd6.
                  fr: Les Blancs roquent par O-O, jouent g4 pour frapper le fou f5 et sortent la dame par Qf3. Les Noirs échangent en c3 par ...Nxc3, puis se développent par ...Nc7 et ...Bd6.
