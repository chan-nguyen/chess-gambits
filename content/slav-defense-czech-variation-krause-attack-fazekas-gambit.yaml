tree:
  annotation:
    vi: Trắng vừa chơi 7.e4, hiến một tốt. Tốt e4 bị mã f6 và tượng f5 tấn công và được mã c3 bảo vệ, còn tốt đó tấn công tượng f5, mà không có quân nào bảo vệ. Tốt c4 của Đen bị mã e5 và tượng f1 tấn công và không có quân nào bảo vệ.
    en: White has just played 7.e4, offering a pawn. The e4 pawn is attacked by the knight on f6 and the bishop on f5 and defended by the knight on c3, and that pawn attacks the bishop on f5, which nothing defends. Black's pawn on c4 is attacked by the knight on e5 and the bishop on f1 and defended by nothing.
    fr: Les Blancs viennent de jouer 7.e4, offrant un pion. Le pion e4 est attaqué par le cavalier f6 et le fou f5 et défendu par le cavalier c3, et ce pion attaque le fou f5, que rien ne défend. Le pion noir c4 est attaqué par le cavalier e5 et le fou f1 et rien ne le défend.
  dismissRest:
    reason:
      vi: Đen chơi nước khác thay vì 7...Nxe4 ở đây. Mục này chỉ đi theo 7...Nxe4; các nước còn lại dẫn tới những biến chưa được lập bản đồ ở đây.
      en: Black plays something other than 7...Nxe4 here. This entry follows 7...Nxe4 only; other moves lead to lines that are not mapped here.
