tree:
  annotation:
    vi: Đáp lại cách bố trí kiểu Catalan của Trắng, Đen chơi 3...e5, một con tốt không được quân nào đỡ, mời Trắng ăn nó để đổi lấy nhịp độ phát triển trong khi tượng g2 của Trắng còn chưa lên tiếng.
    en: Answering White's Catalan-style set-up, Black plays 3...e5, an undefended pawn, offering it in exchange for tempo while White's fianchettoed bishop has not spoken yet.
    fr: En réponse à la mise en place catalane des Blancs, les Noirs jouent 3...e5, un pion non défendu, l'offrant en échange de temps pendant que le fou fianchetté blanc ne s'est pas encore fait entendre.
  dismissRest:
    reason:
      vi: Trắng không ăn con tốt e5. Các nước khác như Bg2 hay Nf3 để nguyên con tốt e5 trên bàn cờ, nghĩa là lời mời vẫn chưa hề được nhận.
      en: White does not take the e5 pawn. Anything else, such as Bg2 or Nf3, leaves the e5 pawn sitting on the board, meaning the offer has still not actually been accepted.
      fr: Les Blancs ne prennent pas le pion e5. Tout le reste, comme Bg2 ou Nf3, laisse le pion e5 sur l'échiquier, ce qui veut dire que l'offre n'a toujours pas été acceptée.
  children:
    - ply: dxe5
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng ăn con tốt ngay lập tức bằng tốt d, quân duy nhất có thể ăn tại đó. Con tốt e5 không được quân Đen nào đỡ nên đây đơn giản là ăn một tốt miễn phí.
        en: White takes the pawn at once with the d-pawn, the only piece that can capture there. The e5 pawn is defended by nothing of Black's, so this is simply picking up a free pawn.
        fr: Les Blancs prennent aussitôt le pion avec le pion d, la seule pièce pouvant capturer là. Le pion e5 n'est défendu par rien du côté noir, il s'agit donc simplement de ramasser un pion gratuit.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy. Trắng hơn đúng một tốt sạch, con tốt e của Đen đã mất từ nước 3, và chưa có gì đòi lại được nó. Cái Đen có để bù lại chỉ là một nhịp phát triển, chưa phải điều gì đáng kể so với một tốt sạch.
          en: Count the pawns and it is eight for White, seven for Black. White is a clean pawn up, Black's e-pawn lost since move three, and nothing has won it back yet. What Black has to show for it is only one tempo of development, not much against a clean pawn.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs. Les Blancs ont un pion de plus bien réel, le pion e des Noirs perdu depuis le troisième coup, et rien ne l'a encore récupéré. Ce que les Noirs ont à montrer pour cela n'est qu'un temps de développement, pas grand-chose face à un pion net.
        plan:
          vi: Trắng chơi Bg2, Nf3 và O-O, hoàn tất bố trí Catalan và giữ vững con tốt thừa trước khi Đen kịp gây sức ép. Đen chơi Nc6 hay Bc5, Nf6 và O-O, tìm cách gây sức ép lên con tốt e5 và giành lại nó trước khi Trắng hoàn tất phát triển.
          en: White plays Bg2, Nf3 and O-O, completing the Catalan set-up and holding the extra pawn firmly before Black can build pressure. Black plays Nc6 or Bc5, Nf6 and O-O, trying to pressure the e5 pawn and win it back before White finishes developing.
          fr: Les Blancs jouent Bg2, Nf3 et O-O, achevant la mise en place catalane et gardant fermement le pion supplémentaire avant que les Noirs ne puissent faire pression. Les Noirs jouent Nc6 ou Bc5, Nf6 et O-O, cherchant à faire pression sur le pion e5 et à le regagner avant que les Blancs n'achèvent leur développement.
        basis:
          by: chan
          at: '2026-09-18'
