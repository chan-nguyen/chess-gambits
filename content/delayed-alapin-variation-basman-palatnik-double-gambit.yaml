# Sicilian Defense: Delayed Alapin Variation, Basman-Palatnik Double Gambit. Frozen defining line
# 1.e4 c5 2.Nf3 d6 3.c3 Nf6 4.Be2 Nc6 5.d4 cxd4 6.cxd4 Nxe4 7.d5 Qa5+ 8.Nc3 Nxc3 9.bxc3, which ends
