tree:
  annotation:
    vi:
      Sau khi Đen ăn tốt bằng exf4, Trắng chơi 4.Nf3 thay vì ăn lại ngay, bảo vệ tốt e4 và chuẩn bị
      dựng trung tâm rộng bằng d4.
    en:
      After Black captures with exf4, White plays 4.Nf3 instead of recapturing at once, defending the
      e4 pawn and preparing to build a broad centre with d4.
    fr: Après la prise noire par exf4, les Blancs jouent 4.Nf3 au lieu de reprendre tout de suite,
      défendant le pion e4 et préparant à construire un centre large avec d4.
  dismissRest:
    reason:
      vi:
        Đen chơi nước khác ngoài Be7, ví dụ g5 bảo vệ tốt f4 hoặc d5. Đánh giá chung — Trắng kém một
        tốt, có trung tâm và phát triển bù lại — không đổi nhiều.
      en:
        Black plays something other than Be7, for instance g5 to defend the f4 pawn, or d5. The overall
        assessment — White down a pawn, compensated by the centre and development — does not change
        much.
      fr: Les Noirs jouent autre chose que Be7, par exemple g5 pour défendre le pion f4, ou d5.
        L'évaluation générale — les Blancs à un pion de moins, compensés par le centre et le
        développement — ne change guère.
  children:
    - ply: Be7
      replyQuality: good
      frequency: common
      annotation:
        vi:
          Đen phát triển tượng ra e7 theo lối Cunningham, chuẩn bị Bh4+ chiếu và ghim quân Trắng nếu có cơ
          hội.
        en:
          Black develops the bishop to e7 in Cunningham style, preparing Bh4+ to check and pin a White
          piece if the chance comes.
        fr:
          Les Noirs développent le fou en e7 à la manière Cunningham, préparant Bh4+ pour faire échec et
          clouer une pièce blanche le cas échéant.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 7 còn Đen 8 — Đen hơn đúng một tốt sạch.
          en: Count the pawns and it is 7 for White against 8 for Black — Black is up one clean pawn.
          fr:
            "Comptez les pions : 7 pour les Blancs contre 8 pour les Noirs — les Noirs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng chơi d4 và Bc4, dựng trung tâm rộng và phát triển nhanh để bù cho con tốt đã mất. Đen chơi
            Bh4+ đẩy vua hoặc quân Trắng đi trước, rồi Nf6, hoàn thiện phát triển trong lúc vẫn giữ
            tốt thừa.
          en:
            White plays d4 and Bc4, building a broad centre and developing quickly as compensation for the
            missing pawn. Black plays Bh4+ first to push a White piece or the king around, then Nf6,
            finishing development while holding the extra pawn.
          fr:
            Les Blancs jouent d4 et Bc4, construisant un centre large et se développant rapidement en
            compensation du pion manquant. Les Noirs jouent d'abord Bh4+ pour repousser une pièce
            blanche ou le roi, puis Nf6, achevant leur développement tout en gardant le pion
            supplémentaire.
        basis:
          by: chan
          at: 2026-09-29
