# Pirc Defense: Roscher Gambit. Frozen defining line 1.e4 d6 2.d4 Nf6 3.Nf3, which ends on
# White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
#
# No material has changed hands within this defining line or its first continuation — 4.e5 is
# a pawn push attacking a knight, not yet a sacrifice — and it stays that way at the leaf
# below: material is level and the position is resolved plainly as such (#107) rather than
# left at unexplored, since a level material count with the position's few concrete features
# named is a real answer, not a hedge.
id: pirc-defense-roscher-gambit
name: 'Pirc Defense: Roscher Gambit'
eco: B00
category: gambit
side: white
definingLine: [e4, d6, d4, Nf6, Nf3]
soundness:
  value: dubious
