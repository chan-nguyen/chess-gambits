id: bird-opening-williams-zilbermints-gambit
name: 'Bird Opening: Williams-Zilbermints Gambit'
eco: A03
category: gambit
side: white
definingLine: [f4, d5, e4, dxe4, Nc3, Nf6, Nge2]
soundness:
