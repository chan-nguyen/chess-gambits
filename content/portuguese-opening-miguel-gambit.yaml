tree:
  annotation:
    vi: Sau 2.Bb5 Bc5, Trắng chơi 3.b4 theo đúng ý tưởng Evans Gambit, một con tốt không được quân nào đỡ, mời tượng c5 ăn nó để đổi lấy nhịp độ đuổi tượng và trung tâm rộng hơn.
    en: After 2.Bb5 Bc5, White plays 3.b4 in the Evans Gambit spirit, an undefended pawn, offering it to the c5 bishop in exchange for tempo gained chasing the bishop and a wider centre.
    fr: Après 2.Bb5 Bc5, les Blancs jouent 3.b4 dans l'esprit du Gambit Evans, un pion non défendu, l'offrant au fou c5 en échange d'un temps gagné en chassant le fou et d'un centre plus large.
  dismissRest:
    reason:
      vi: Đen không ăn con tốt b4. Các nước khác như Nf6 hay Bb6 lùi tượng để nguyên con tốt b4 trên bàn cờ, nghĩa là lời mời vẫn chưa hề được nhận.
      en: Black does not take the b4 pawn. Anything else, such as Nf6 or retreating with Bb6, leaves the b4 pawn sitting on the board, meaning the offer has still not actually been accepted.
      fr: Les Noirs ne prennent pas le pion b4. Tout le reste, comme Nf6 ou la retraite Bb6, laisse le pion b4 sur l'échiquier, ce qui veut dire que l'offre n'a toujours pas été acceptée.
  children:
    - ply: Bxb4
      replyQuality: best
      frequency: common
      annotation:
        vi: Tượng ăn con tốt ngay lập tức, quân duy nhất có thể ăn tại đó. Con tốt b4 không được quân Trắng nào đỡ nên đây đơn giản là ăn một tốt miễn phí.
        en: The bishop takes the pawn at once, the only piece that can capture there. The b4 pawn is defended by nothing of White's, so this is simply picking up a free pawn.
        fr: Le fou prend aussitôt le pion, la seule pièce pouvant capturer là. Le pion b4 n'est défendu par rien du côté blanc, il s'agit donc simplement de ramasser un pion gratuit.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy. Đen hơn đúng một tốt sạch, con tốt b đã mất ngay từ nước 3, và chưa có gì đòi lại được nó. Cái Trắng có để bù lại chỉ là trung tâm rộng hơn và khả năng phát triển nhanh, chưa phải điều gì đáng kể so với một tốt sạch.
          en: Count the pawns and it is eight for Black, seven for White. Black is a clean pawn up, the b-pawn lost as early as move three, and nothing has won it back yet. What White has to show for it is only a wider centre and the chance to develop quickly, not much against a clean pawn.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs. Les Noirs ont un pion de plus bien réel, le pion b perdu dès le troisième coup, et rien ne l'a encore récupéré. Ce que les Blancs ont à montrer pour cela n'est qu'un centre plus large et la possibilité de se développer rapidement, pas grand-chose face à un pion net.
        plan:
          vi: Trắng chơi c3 đẩy lùi tượng, d4 mở trung tâm và Nf3, cố dùng trung tâm rộng và sự phát triển nhanh để bù cho con tốt đã mất. Đen chơi Bc5 hoặc Ba5 giữ vững tượng, Nf6 và d6, giữ chắc con tốt thừa và hoàn tất phát triển trước khi Trắng kịp mở hết trung tâm.
          en: White plays c3 to push the bishop back, d4 to open the centre, and Nf3, trying to use the wide centre and quick development to compensate for the lost pawn. Black plays Bc5 or Ba5 to keep the bishop safe, then Nf6 and d6, holding the extra pawn firmly and completing development before White can fully open the centre.
          fr: Les Blancs jouent c3 pour repousser le fou, d4 pour ouvrir le centre, et Nf3, en essayant d'utiliser le large centre et un développement rapide pour compenser le pion perdu. Les Noirs jouent Bc5 ou Ba5 pour garder le fou en sécurité, puis Nf6 et d6, gardant fermement le pion supplémentaire et achevant leur développement avant que les Blancs n'ouvrent complètement le centre.
        basis:
          by: chan
          at: '2026-09-18'
