    at: '2026-09-18'
    source: >-
      A judgement. Black simply takes the pawn with Bxb4 and it stays taken — White's case is
      the Evans-style lead in development and central play, real but not shown to be worth a
      full pawn yet. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
