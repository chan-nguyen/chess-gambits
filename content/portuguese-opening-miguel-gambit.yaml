# The line below was replayed with chess.js before being annotated.
id: portuguese-opening-miguel-gambit
name: 'Portuguese Opening: Miguel Gambit'
eco: C20
category: gambit
side: white
definingLine: [e4, e5, Bb5, Bc5, b4]
soundness:
  value: dubious
  reviewedAt: '2026-09-18'
