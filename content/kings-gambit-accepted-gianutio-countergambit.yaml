    vi: Trắng vừa đưa mã ra f3, Gambit Mã Vua. Mục này đi sâu riêng vào 3...f5, Hậu Gambit Gianutio.
    en: White has just played the knight to f3, the King's Knight Gambit. This entry follows specifically 3...f5, the Gianutio Countergambit.
    fr: Les Blancs viennent de jouer le cavalier en f3, le Gambit du Cavalier du Roi. Cette entrée suit spécifiquement 3...f5, le Contre-gambit Gianutio.
  dismissRest:
    reason:
      vi: Đen đáp lại 3.Nf3 bằng một nước khác ngoài 3...f5 — đánh trung tâm bằng 3...d5, tấn công cánh vua bằng 3...g5, hay phát triển mã bằng 3...Nf6. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 3.Nf3 with something other than 3...f5 — striking the centre with 3...d5, a kingside storm with 3...g5, or developing with 3...Nf6. Each is outside the scope of this entry.
      fr: Les Noirs répondent à 3.Nf3 par autre chose que 3...f5 — une frappe centrale par 3...d5, un assaut à l'aile roi par 3...g5, ou un développement par 3...Nf6. Chacun sort du cadre de cette entrée.
