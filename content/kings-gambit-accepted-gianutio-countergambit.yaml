      annotation:
        vi: Hậu Gambit Gianutio. Đen thí thêm một tốt để mở đường cho hậu và tượng f8, đặt cược vào hoạt động quân thay vì giữ vật chất.
        en: The Gianutio Countergambit. Black offers a second pawn to open lines for the queen and the f8 bishop, betting on piece activity rather than holding on to material.
        fr: Le Contre-gambit Gianutio. Les Noirs offrent un second pion pour ouvrir des lignes à la dame et au fou f8, misant sur l'activité des pièces plutôt que sur la conservation du matériel.
