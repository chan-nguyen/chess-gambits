tree:
  annotation:
    vi: Trắng vừa đưa mã ra f3, Gambit Mã Vua. Mục này đi sâu riêng vào 3...f5, Hậu Gambit Gianutio.
    en: White has just played the knight to f3, the King's Knight Gambit. This entry follows specifically 3...f5, the Gianutio Countergambit.
    fr: Les Blancs viennent de jouer le cavalier en f3, le Gambit du Cavalier du Roi. Cette entrée suit spécifiquement 3...f5, le Contre-gambit Gianutio.
  dismissRest:
    reason:
      vi: Đen đáp lại 3.Nf3 bằng một nước khác ngoài 3...f5 — đánh trung tâm bằng 3...d5, tấn công cánh vua bằng 3...g5, hay phát triển mã bằng 3...Nf6. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 3.Nf3 with something other than 3...f5 — striking the centre with 3...d5, a kingside storm with 3...g5, or developing with 3...Nf6. Each is outside the scope of this entry.
      fr: Les Noirs répondent à 3.Nf3 par autre chose que 3...f5 — une frappe centrale par 3...d5, un assaut à l'aile roi par 3...g5, ou un développement par 3...Nf6. Chacun sort du cadre de cette entrée.
  children:
    - ply: f5
      replyQuality: inaccuracy
      frequency: rare
      annotation:
        vi: Hậu Gambit Gianutio. Đen thí thêm một tốt để mở đường cho hậu và tượng f8, đặt cược vào hoạt động quân thay vì giữ vật chất.
        en: The Gianutio Countergambit. Black offers a second pawn to open lines for the queen and the f8 bishop, betting on piece activity rather than holding on to material.
        fr: Le Contre-gambit Gianutio. Les Noirs offrent un second pion pour ouvrir des lignes à la dame et au fou f8, misant sur l'activité des pièces plutôt que sur la conservation du matériel.
      children:
        - ply: exf5
          annotation:
            vi: Trắng ăn tốt, đưa quân số trở lại ngang bằng — con tốt Đen vừa thí đã bù lại đúng bằng con tốt f4 ban đầu.
            en: White captures the pawn, restoring material to level — the pawn Black just sacrificed pays back exactly the original f4 pawn.
            fr: Les Blancs prennent le pion, ramenant le matériel à l'égalité — le pion que les Noirs viennent de sacrifier rembourse exactement le pion f4 initial.
          outcome:
            type: position
            evaluation:
              vi: Quân số hoàn toàn ngang nhau — con tốt f5 Đen vừa thí đã bù đúng bằng con tốt f4 Trắng mất ở đầu ván. Đã thử tiếp 4...Nf6 (Đen phát triển và chuẩn bị ăn lại tốt f5), vật chất vẫn ngang nhau và cả hai bên đều còn quân chưa phát triển — đây là một thế cờ cân bằng và sắc bén, không phải một lợi thế cho ai.
              en: Material is fully level — the f5 pawn Black just sacrificed pays back exactly the f4 pawn White lost at the start. Continuing with 4...Nf6 (Black develops and prepares to win the f5 pawn back) was tried; material stays level and both sides still have pieces to develop — this is a level, sharp position, not an edge for either side.
              fr: Le matériel est parfaitement égal — le pion f5 que les Noirs viennent de sacrifier rembourse exactement le pion f4 perdu par les Blancs au début. Poursuivre par 4...Nf6 (les Noirs développent et se préparent à regagner le pion f5) a été essayé ; le matériel reste égal et les deux camps ont encore des pièces à développer — c'est une position égale et tranchante, pas un avantage pour l'un ou l'autre.
            plan:
              vi: Trắng chơi Bc4 và O-O, cố giữ con tốt f5 vừa giành được và tận dụng cột f nửa mở. Đen chơi Bd6 hay Nc6, hoàn thiện phát triển nhanh và tìm cách ăn lại tốt f5 hoặc dùng cặp tốt trung tâm để bù lại quân số đã mất công sức để giành.
              en: White plays Bc4 and castles, trying to hold the f5 pawn just won and make use of the half-open f-file. Black plays Bd6 or Nc6, developing quickly and looking to win the f5 pawn back or use the central pawn duo to justify the material already spent reaching it.
              fr: Les Blancs jouent Bc4 et roquent, essayant de conserver le pion f5 tout juste gagné et de profiter de la colonne f semi-ouverte. Les Noirs jouent Bd6 ou Nc6, se développant rapidement et cherchant à regagner le pion f5 ou à utiliser le duo de pions centraux pour justifier le matériel déjà dépensé pour l'obtenir.
            basis:
              by: chan
              at: '2026-09-18'
