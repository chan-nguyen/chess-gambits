# King's Gambit Accepted, Gianutio Countergambit. One of eighteen entries tracked by issue
# #111 (group H), sharing the trunk `1.e4 e5 2.f4 exf4 3.Nf3` with
# `kings-gambit-accepted.yaml` and group G (#110). Defining line ends on White's 3.Nf3
# (invariant 5). Every move replayed with a scratch chess.js script (deleted before commit):
# 3...f5 4.exf5 was confirmed legal, with material back to level (the pawn Black just offered
# pays back the original f4 pawn) and no free capture standing for either side at that point.
#
# 3...f5 is a further, voluntary pawn sacrifice on top of the King's Gambit itself, the
# Nf3-trunk mirror of the Bishop's Gambit's Gianutio Gambit. The tried continuation named in
# the evaluation, 5.Nf6, was also replayed with chess.js. Under the stricter #107 bar the
# position after 4.exf5 restores only material parity, not a two-point edge, and the
# resulting position is genuinely sharp rather than an unambiguous catastrophe for either
# side, so the leaf states that plainly rather than either forcing a false verdict or
# reverting to `unexplored`.
