tree:
  annotation:
    vi: 'Trắng vừa chơi 3.g4 sau 2.Qd3 g6, hiến một tốt: tốt g4 không có quân bảo vệ và bị tốt f5 tấn công, trong khi tốt f5 bị tốt g4 và hậu d3 tấn công và chỉ có tốt g6 bảo vệ.'
    en: 'White has just played 3.g4 after 2.Qd3 g6, offering a pawn: the g4 pawn has no defender and is attacked by the f5 pawn, while the f5 pawn is attacked by the g4 pawn and the queen on d3 and defended only by the g6 pawn.'
    fr: "Les Blancs viennent de jouer 3.g4 après 2.Qd3 g6, offrant un pion : le pion g4 n'a aucun défenseur et est attaqué par le pion f5, tandis que le pion f5 est attaqué par le pion g4 et la dame d3 et défendu seulement par le pion g6."
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 3...fxg4. Bài này chỉ đi theo nhánh ăn tốt 3...fxg4; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 3...fxg4 here. This entry follows the capture 3...fxg4 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 3...fxg4. Cette fiche ne suit que la prise 3...fxg4 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: fxg4
      replyQuality: good
      frequency: common
      annotation:
        vi: 'Đen ăn tốt bằng 3...fxg4. Tốt g6 chặn đường chéo d3–h7 của hậu Trắng: hậu tấn công g6, được tốt h7 bảo vệ.'
        en: "Black takes the pawn with 3...fxg4. The g6 pawn blocks the d3–h7 diagonal of White's queen: the queen attacks g6, which the h7 pawn defends."
        fr: 'Les Noirs prennent le pion par 3...fxg4. Le pion g6 bloque la diagonale d3–h7 de la dame blanche : la dame attaque g6, que le pion h7 défend.'
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt, và Đen có hai tốt trên cột g, ở g6 và g4, trong đó tốt g4 không có quân bảo vệ. Hậu d3 tấn công g6, được tốt h7 bảo vệ. Trắng không còn tốt g nên cột g nửa mở cho quân Trắng.'
          en: "Count the pawns: White seven, Black eight, so White is a pawn down, and Black has two pawns on the g-file, on g6 and g4, of which the g4 pawn has no defender. The queen on d3 attacks g6, which the h7 pawn defends. White has no g-pawn, so the g-file is half open for White's pieces."
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins, et les Noirs ont deux pions sur la colonne g, en g6 et en g4, dont le pion g4 n'a aucun défenseur. La dame d3 attaque g6, que le pion h7 défend. Les Blancs n'ont plus de pion g, si bien que la colonne g est semi-ouverte pour leurs pièces."
        plan:
          vi: Trắng tấn công g4 bằng h3 hoặc phát triển bằng Nc3 và Bf4. Đen bảo vệ g4 bằng ...Nf6 và hoàn tất phát triển, giữ tốt thừa.
          en: White attacks g4 with h3 or develops with Nc3 and Bf4. Black defends g4 with ...Nf6 and completes development, keeping the extra pawn.
          fr: Les Blancs attaquent g4 par h3 ou se développent par Nc3 et Bf4. Les Noirs défendent g4 par ...Nf6 et achèvent leur développement, en gardant le pion en plus.
        basis:
          by: chan
          at: '2026-09-30'
