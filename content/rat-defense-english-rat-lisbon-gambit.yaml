# Rat Defense: English Rat, Lisbon Gambit. Frozen defining line 1.d4 d6 2.c4 e5 3.dxe5 Nc6,
# which ends on Black's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). The line below was replayed with chess.js before being annotated.
id: rat-defense-english-rat-lisbon-gambit
name: 'Rat Defense: English Rat, Lisbon Gambit'
eco: A41
category: gambit
side: black
definingLine: [d4, d6, c4, e5, dxe5, Nc6]
soundness:
  value: dubious
  reviewedAt: '2026-09-18'
  basis:
    by: chan
    at: '2026-09-18'
    source: >-
      A judgement. White simply holds the extra pawn with f4 and it stays held — Black's case
      is a lead in development while White's centre is not yet organised, real but not shown
      to be worth a full pawn yet. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Sau khi đã mất tốt e vào tay Trắng, Đen không vội ăn lại ngay mà chơi 3...Nc6, phát triển và gây áp lực lên con tốt e5, mời Trắng phải quyết định giữ hay trả lại con tốt đó.
    en: Having already lost the e-pawn to White, Black does not rush to recapture and instead plays 3...Nc6, developing while pressuring the e5 pawn, inviting White to decide whether to hold it or give it back.
    fr: Ayant déjà perdu le pion e au profit des Blancs, les Noirs ne se précipitent pas pour reprendre et jouent plutôt 3...Nc6, développant tout en faisant pression sur le pion e5, invitant les Blancs à décider s'ils le gardent ou le rendent.
  dismissRest:
    reason:
      vi: Trắng không chọn cách bảo vệ con tốt e5 bằng f4. Các nước khác như Nf3 phát triển bình thường hay e4 tiếp tục mở trung tâm cũng không trả lại con tốt ngay, nhưng để lại con tốt e5 dễ bị Đen giành lại hơn theo cách khác, nên phần lớn trường hợp cụ thể ấy được gộp vào đây thay vì phân tích riêng.
      en: White does not choose to defend the e5 pawn with f4. Anything else, such as the natural developing Nf3 or the further central push e4, does not give the pawn back immediately either, but leaves the e5 pawn easier for Black to win back some other way, so those specific cases are folded in here rather than analysed separately.
      fr: Les Blancs ne choisissent pas de défendre le pion e5 par f4. Tout le reste, comme le développement naturel Nf3 ou la poussée centrale supplémentaire e4, ne rend pas non plus le pion immédiatement, mais laisse le pion e5 plus facile à regagner pour les Noirs d'une autre façon, donc ces cas précis sont regroupés ici plutôt qu'analysés séparément.
  children:
    - ply: f4
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng bảo vệ con tốt e5 bằng tốt f, quyết định giữ vật chất thay vì trả lại ngay. Đây là cách rõ ràng nhất để giữ con tốt thừa, dù có làm chậm lại việc phát triển các quân nhẹ.
        en: White defends the e5 pawn with the f-pawn, choosing to keep the material rather than give it back at once. This is the most direct way to hold the extra pawn, even though it slows the development of the minor pieces.
        fr: Les Blancs défendent le pion e5 avec le pion f, choisissant de garder le matériel plutôt que de le rendre aussitôt. C'est la façon la plus directe de garder le pion supplémentaire, même si cela retarde le développement des pièces mineures.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy. Trắng hơn đúng một tốt sạch, con tốt e của Đen đã mất từ nước 3, và f4 vừa bảo vệ chắc chắn con tốt ấy. Cái Đen có để bù lại chỉ là một nhịp phát triển với Nc6, chưa phải điều gì đáng kể so với một tốt sạch đã được giữ vững.
          en: Count the pawns and it is eight for White, seven for Black. White is a clean pawn up, Black's e-pawn lost since move three, and f4 has just defended it securely. What Black has to show for it is only one tempo of development with Nc6, not much against a clean pawn that is now held firmly.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs. Les Blancs ont un pion de plus bien réel, le pion e des Noirs perdu depuis le troisième coup, et f4 vient de le défendre solidement. Ce que les Noirs ont à montrer pour cela n'est qu'un temps de développement avec Nc6, pas grand-chose face à un pion net désormais bien tenu.
        plan:
          vi: Trắng chơi Nf3, Nc3 và e4 hay g3, hoàn tất phát triển và giữ vững con tốt thừa trước khi Đen kịp tổ chức áp lực lên nó. Đen chơi Nxe5 nếu con tốt hở ra, hoặc Bg4 và f6, dồn thêm quân tấn công con tốt e5 và cố giành lại nó trước khi Trắng phát triển xong.
          en: White plays Nf3, Nc3 and e4 or g3, completing development and holding the extra pawn before Black can organise pressure on it. Black plays Nxe5 if the pawn ever becomes loose, or Bg4 and f6, piling more pieces onto the e5 pawn and trying to win it back before White finishes developing.
          fr: Les Blancs jouent Nf3, Nc3 et e4 ou g3, achevant leur développement et gardant le pion supplémentaire avant que les Noirs ne puissent organiser une pression dessus. Les Noirs jouent Nxe5 si le pion devient un jour vulnérable, ou Bg4 et f6, amassant davantage de pièces sur le pion e5 pour tenter de le regagner avant que les Blancs n'achèvent leur développement.
        basis:
          by: chan
          at: '2026-09-18'
