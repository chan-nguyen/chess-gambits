# King's Gambit Accepted, Cunningham Defense. One of eighteen entries tracked by issue #111
# (group H), sharing the trunk `1.e4 e5 2.f4 exf4 3.Nf3` with `kings-gambit-accepted.yaml`
# and group G (#110). Defining line ends on White's 3.Nf3 (invariant 5). Every move replayed
# with a scratch chess.js script (deleted before commit).
#
# 3...Be7 is a respected, sharp defense: the bishop develops with the immediate point of
# ...Bh4+ next, forcing concessions. That follow-up leads into genuinely sharp, well-studied
# "Cunningham Gambit" theory (...Bh4+ g3 fxg3 O-O gxh2+ Kh1) whose forced continuation this
# review could not certify by hand to the confidence this project requires without an engine
# — several of the natural-looking tries checked in scratch analysis for this entry turned
# out, on chess.js replay, to lose material rather than win it, so that sharp theory is
# named but not modelled further here. The leaf below instead assesses the calm, real
# position that already exists right after 3...Be7 itself, before either side has committed
# to the sharp continuation — a genuine `position` assessment, not `unexplored`.
