tree:
  annotation:
    vi: Trắng vừa đưa mã ra f3, Gambit Mã Vua. Mục này đi sâu riêng vào 3...Be7, Phòng thủ Cunningham.
    en: White has just played the knight to f3, the King's Knight Gambit. This entry follows specifically 3...Be7, the Cunningham Defense.
    fr: Les Blancs viennent de jouer le cavalier en f3, le Gambit du Cavalier du Roi. Cette entrée suit spécifiquement 3...Be7, la Défense Cunningham.
  dismissRest:
    reason:
      vi: Đen đáp lại 3.Nf3 bằng một nước khác ngoài 3...Be7 — đánh trung tâm bằng 3...d5, tấn công cánh vua bằng 3...g5, hay phát triển mã bằng 3...Nf6. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 3.Nf3 with something other than 3...Be7 — striking the centre with 3...d5, a kingside storm with 3...g5, or developing with 3...Nf6. Each is outside the scope of this entry.
      fr: Les Noirs répondent à 3.Nf3 par autre chose que 3...Be7 — une frappe centrale par 3...d5, un assaut à l'aile roi par 3...g5, ou un développement par 3...Nf6. Chacun sort du cadre de cette entrée.
  children:
    - ply: Be7
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Phòng thủ Cunningham. Đen phát triển tượng với ý đồ cụ thể — nếu Trắng đưa tượng ra c4, Đen có thể chiếu bằng ...Bh4+, buộc Trắng phải nhượng bộ ngay. Đây là một trong những cách đáp trả sắc bén và được đánh giá cao nhất trước Gambit Mã Vua.
        en: The Cunningham Defense. Black develops the bishop with a concrete point — if White plays the bishop to c4, Black can check with ...Bh4+, forcing an immediate concession. This is one of the sharpest and most respected replies to the King's Knight Gambit.
        fr: La Défense Cunningham. Les Noirs développent le fou avec une idée concrète — si les Blancs jouent le fou en c4, les Noirs peuvent enchaîner par ...Bh4+, forçant une concession immédiate. C'est l'une des réponses les plus tranchantes et les plus respectées contre le Gambit du Cavalier du Roi.
      outcome:
        type: unexplored
