tree:
  annotation:
    vi: Trắng vừa đưa mã ra f3, Gambit Mã Vua. Mục này đi sâu riêng vào 3...Nc6, Phòng thủ MacLeod.
    en: White has just played the knight to f3, the King's Knight Gambit. This entry follows specifically 3...Nc6, the MacLeod Defense.
    fr: Les Blancs viennent de jouer le cavalier en f3, le Gambit du Cavalier du Roi. Cette entrée suit spécifiquement 3...Nc6, la Défense MacLeod.
  dismissRest:
    reason:
      vi: Đen đáp lại 3.Nf3 bằng một nước khác ngoài 3...Nc6 — đánh trung tâm bằng 3...d5, tấn công cánh vua bằng 3...g5, hay phát triển mã kia bằng 3...Nf6. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 3.Nf3 with something other than 3...Nc6 — striking the centre with 3...d5, a kingside storm with 3...g5, or developing the other knight with 3...Nf6. Each is outside the scope of this entry.
      fr: Les Noirs répondent à 3.Nf3 par autre chose que 3...Nc6 — une frappe centrale par 3...d5, un assaut à l'aile roi par 3...g5, ou développer l'autre cavalier par 3...Nf6. Chacun sort du cadre de cette entrée.
  children:
    - ply: Nc6
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Phòng thủ MacLeod. Đen phát triển mã một cách tự nhiên, chấp nhận tốt c bị chặn đường tiến sau này để đổi lấy một nước đi hữu ích ngay lập tức.
        en: The MacLeod Defense. Black develops a knight naturally, accepting that the c-pawn's own advance will be blocked later in exchange for a genuinely useful move right now.
        fr: La Défense MacLeod. Les Noirs développent naturellement un cavalier, acceptant que l'avance du pion c soit bloquée plus tard en échange d'un coup réellement utile dès maintenant.
      outcome:
        type: position
        evaluation:
          vi: Đen vẫn hơn đúng con tốt f4 ban đầu. Đã thử tiếp 4.Bc4 (nhắm vào f7) g5 (Đen giữ chắc con tốt theo kiểu Phòng thủ Anderssen), vật chất không đổi và cả hai vua đều chưa nhập thành. Mã c6 giúp Đen kiểm soát trung tâm nhưng con tốt c cũng khó tiến lên c5 để hỗ trợ một đợt phản công sau này — đây là một thế cờ cân bằng, còn nhiều khả năng cho cả hai bên.
          en: Black is still exactly one pawn up, the original f4 pawn. Continuing with 4.Bc4 (aiming at f7) g5 (Black holds the pawn the way the Anderssen Defense does) was tried; material is unchanged and neither king has castled. The knight on c6 helps Black control the centre but also makes it harder for the c-pawn to advance to c5 in support of a later counterattack — this is a level position with real chances for both sides.
          fr: Les Noirs restent exactement un pion devant, le pion f4 initial. Poursuivre par 4.Bc4 (visant f7) g5 (les Noirs conservent le pion à la manière de la Défense Anderssen) a été essayé ; le matériel est inchangé et aucun roi n'a roqué. Le cavalier en c6 aide les Noirs à contrôler le centre mais complique aussi l'avance du pion c vers c5 pour appuyer une contre-attaque ultérieure — c'est une position égale avec de réelles chances pour les deux camps.
        plan:
          vi: Trắng chơi h4 để thách thức chuỗi tốt g5, hoặc O-O trước rồi tìm cách khai thác cột f. Đen chơi Bg7 hay d6, hoàn thiện phát triển và giữ con tốt thừa chừng nào còn an toàn để làm vậy.
          en: White plays h4 to challenge the g5 pawn chain, or castles first and looks for a way to make use of the f-file. Black plays Bg7 or d6, completing development and holding the extra pawn for as long as it stays safe to do so.
          fr: Les Blancs jouent h4 pour défier la chaîne de pions g5, ou roquent d'abord et cherchent un moyen d'exploiter la colonne f. Les Noirs jouent Bg7 ou d6, achevant leur développement et conservant le pion supplémentaire aussi longtemps qu'il reste sûr de le faire.
        basis:
          by: chan
          at: '2026-09-18'
