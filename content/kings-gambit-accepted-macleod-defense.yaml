    vi: Trắng vừa đưa mã ra f3, Gambit Mã Vua. Mục này đi sâu riêng vào 3...Nc6, Phòng thủ MacLeod.
    en: White has just played the knight to f3, the King's Knight Gambit. This entry follows specifically 3...Nc6, the MacLeod Defense.
    fr: Les Blancs viennent de jouer le cavalier en f3, le Gambit du Cavalier du Roi. Cette entrée suit spécifiquement 3...Nc6, la Défense MacLeod.
  dismissRest:
