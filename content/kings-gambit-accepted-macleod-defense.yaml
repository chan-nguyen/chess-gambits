# King's Gambit Accepted, MacLeod Defense. One of eighteen entries tracked by issue #111
# (group H), sharing the trunk `1.e4 e5 2.f4 exf4 3.Nf3` with `kings-gambit-accepted.yaml`
# and group G (#110). Defining line ends on White's 3.Nf3 (invariant 5). Every move replayed
# with a scratch chess.js script (deleted before commit).
#
# 3...Nc6 develops a piece, at the mild cost of blocking the c-pawn's own advance later. The
# tried continuation named in the evaluation, 4.Bc4 g5, was replayed with a scratch chess.js
# script (deleted before commit) confirming legality and material at each ply. Under the
# stricter #107 bar this genuinely does not resolve to a decisive edge for either side at
# this depth, so the leaf states that plainly instead of forcing a verdict or reverting to
# `unexplored`.
