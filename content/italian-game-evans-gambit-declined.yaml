# Italian Game, Evans Gambit Declined. One of a batch of entries authored for issue #148
# (batch h), sharing the trunk `1.e4 e5 2.Nf3 Nc6 3.Bc4 Bc5 4.b4` with
# `italian-game-evans-gambit.yaml`. Defining line ends on White's 4.b4 (invariant 5). Every
# ply below was replayed with chess.js before being written.
id: italian-game-evans-gambit-declined
name: 'Italian Game: Evans Gambit Declined'
eco: C51
category: gambit
side: white
definingLine: [e4, e5, Nf3, Nc6, Bc4, Bc5, b4]
soundness:
  value: sound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      The same judgement the family head `italian-game-evans-gambit.yaml` carries. No engine
      was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng thí tốt b4 ngay dưới mũi tượng c5. Mục này đi sâu riêng vào việc Đen từ chối, lui tượng thay vì ăn.
    en: White offers the b-pawn right under the bishop on c5. This entry follows specifically Black declining, retreating the bishop instead of taking.
    fr: Les Blancs offrent le pion b juste sous le fou en c5. Cette entrée suit spécifiquement le refus des Noirs, qui reculent le fou au lieu de prendre.
  dismissRest:
    reason:
      vi: Đen đáp lại 4.b4 bằng một nước khác ngoài 4...Bb6 — ăn tốt bằng 4...Bxb4 (nhận gambit), hay đẩy tốt lên b5 hoặc d5 (hai phản-gambit). Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 4.b4 with something other than 4...Bb6 — taking the pawn with 4...Bxb4 (accepting), or pushing b5 or d5 (the two countergambits). Each is outside the scope of this entry.
      fr: Les Noirs répondent à 4.b4 par autre chose que 4...Fb6 — prenant le pion par 4...Fxb4 (acceptant), ou poussant b5 ou d5 (les deux contre-gambits). Chacun sort du cadre de cette entrée.
  children:
    - ply: Bb6
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Đen từ chối con tốt và lui tượng về b6, giữ nguyên đường chéo nhắm vào f2 mà không cho Trắng nhịp đuổi tượng thêm lần nữa.
        en: Black declines the pawn and drops the bishop back to b6, keeping the same diagonal aimed at f2 without giving White another tempo to chase it.
        fr: Les Noirs refusent le pion et replient le fou en b6, gardant la même diagonale visant f2 sans offrir aux Blancs un nouveau temps pour le chasser.
      outcome:
        type: position
        evaluation:
          vi: Quân số hoàn toàn ngang nhau, mỗi bên còn đủ tám tốt. Trắng đã có tốt b4 chiếm đất cánh hậu và sẽ chơi tiếp với một trung tâm rộng hơn bình thường, còn con tượng Đen vẫn đứng nguyên trên đường chéo b6-f2 như trước, chỉ lùi lại một ô.
          en: Material is completely level, each side still has all eight pawns. White already has the b4 pawn taking queenside space and will play on with a wider than usual centre, while Black's bishop still sits on the same b6-f2 diagonal as before, just one square back.
          fr: Le matériel est parfaitement égal, chaque camp a encore ses huit pions. Les Blancs ont déjà le pion b4 qui prend de l'espace à l'aile dame et poursuivront avec un centre plus large que d'habitude, tandis que le fou noir reste sur la même diagonale b6-f2 qu'avant, juste une case en arrière.
        plan:
          vi: Trắng chơi Nc3 hoặc d3, rồi a4-a5 đẩy lùi tượng hoặc c3 và d4 dựng trung tâm lớn, tận dụng đất đã chiếm ở cánh hậu. Đen chơi Nf6, d6 và O-O, phát triển bình thường và giữ áp lực lâu dài lên f2 và trung tâm Trắng.
          en: White plays Nc3 or d3, then a4-a5 to push the bishop back or c3 and d4 to build a big centre, using the space already grabbed on the queenside. Black plays Nf6, d6 and O-O, developing normally and keeping long-term pressure on f2 and White's centre.
          fr: Les Blancs jouent Nc3 ou d3, puis a4-a5 pour repousser le fou ou c3 et d4 pour bâtir un grand centre, utilisant l'espace déjà pris à l'aile dame. Les Noirs jouent Nf6, d6 et O-O, se développant normalement et maintenant une pression durable sur f2 et le centre blanc.
        basis:
          by: chan
          at: '2026-09-25'
