tree:
  annotation:
    vi: Đen vừa chơi 3...Qh4, đưa hậu ra ngay. Tốt f2 bị hậu và tượng c5 tấn công hai lần mà chỉ có vua bảo vệ, và tốt e4 cũng bị hậu tấn công mà không có quân bảo vệ.
    en: Black has just played 3...Qh4, bringing the queen out at once. The pawn on f2 is attacked twice, by the queen and the bishop on c5, and defended only by the king, and the pawn on e4 is also attacked by the queen and has no defender.
    fr: Les Noirs viennent de jouer 3...Qh4, sortant aussitôt la dame. Le pion f2 est attaqué deux fois, par la dame et le fou c5, et défendu seulement par le roi, et le pion e4 est aussi attaqué par la dame sans aucun défenseur.
  dismissRest:
    reason:
      vi: Trắng chọn một nước khác thay vì 4.Qf3. Bài này chỉ đi theo nhánh 4.Qf3; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: White plays something other than 4.Qf3 here. This entry follows the reply 4.Qf3 only; other moves lead to lines that are not mapped here.
      fr: Les Blancs jouent autre chose que 4.Qf3. Cette fiche ne suit que la réponse 4.Qf3 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Qf3
      replyQuality: best
      frequency: common
      annotation:
        vi: 'Trắng đáp 4.Qf3, vừa bảo vệ f2 lần thứ hai vừa bảo vệ e4: f2 giờ bị tấn công hai lần và được vua cùng hậu bảo vệ hai lần, còn e4 được hậu bảo vệ.'
        en: 'White answers 4.Qf3, which defends f2 a second time and also defends e4: f2 is now attacked twice and defended twice, by the king and the queen, and e4 is defended by the queen.'
        fr: 'Les Blancs répondent 4.Qf3, qui défend f2 une seconde fois et aussi e4 : f2 est maintenant attaqué deux fois et défendu deux fois, par le roi et la dame, et e4 est défendu par la dame.'
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: mỗi bên tám tốt, nên vật chất cân bằng và chưa ai thắng được gì. Tốt f2 bị hậu và tượng tấn công hai lần và được vua cùng hậu f3 bảo vệ hai lần. Hậu f3 của Trắng tấn công f7, chỉ có vua bảo vệ, còn hậu h4 của Đen có thể bị đuổi bằng g3.'
          en: "Count the pawns: eight each, so material is level and nothing has been won yet. The f2 pawn is attacked twice, by the queen and the bishop, and defended twice, by the king and the queen on f3. White's queen on f3 attacks f7, which only the king defends, and Black's queen on h4 can be driven back by g3."
          fr: "Comptez les pions : huit de chaque côté, donc le matériel est égal et rien n'est encore gagné. Le pion f2 est attaqué deux fois, par la dame et le fou, et défendu deux fois, par le roi et la dame f3. La dame blanche f3 attaque f7, que seul le roi défend, et la dame noire h4 peut être chassée par g3."
        plan:
          vi: Đen phải tìm mục tiêu mới, chẳng hạn ...Nf6 tấn công e4 lần thứ hai trong khi chỉ có hậu f3 bảo vệ nó. Trắng bảo vệ lại e4 bằng Nc3 rồi đuổi hậu bằng g3.
          en: Black has to find a new target, for example ...Nf6, which attacks e4 a second time while only the queen on f3 defends it. White defends e4 again with Nc3 and then chases the queen with g3.
          fr: Les Noirs doivent trouver une nouvelle cible, par exemple ...Nf6, qui attaque e4 une seconde fois alors que seule la dame f3 le défend. Les Blancs défendent de nouveau e4 par Nc3 puis chassent la dame par g3.
        basis:
          by: chan
          at: '2026-09-30'
