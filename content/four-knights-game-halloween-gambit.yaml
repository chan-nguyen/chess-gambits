                  annotation:
                    vi: Trắng đẩy tiếp e5, đuổi con mã thứ hai. Đây là toàn bộ ý tưởng của gambit, hai con tốt trung tâm tiến lên với đe doạ ở mỗi nước, và con mã f6 không có ô lùi nào tốt.
                    en: White pushes e5 and chases the second knight. This is the whole idea of the gambit, two centre pawns marching forward with a threat at every step, and the f6 knight has no good square to go to.
                    fr: Les Blancs poussent e5 et chassent le second cavalier. C'est toute l'idée du gambit, deux pions centraux qui avancent avec une menace à chaque pas, et le cavalier f6 n'a aucune bonne case où aller.
                  dismissRest:
                    reason:
                      vi: Đen làm gì khác với con mã f6. ...Ng4, ...Nh5, ...Nd5 và ...Ne4 đưa nó tới những ô mà nó bị ăn không (Qxg4, Qxh5, Nxd5, Nxe4); ...Nxe5 bằng con mã g6 trả lại con mã lấy con tốt e ngay lập tức (dxe5); ...Qe7 ghim con tốt e5 vào vua Trắng nên exf6 chưa thể chơi ngay nước này, còn ...Ke7 che con mã bằng vua để rồi bị exf6+ kèm chiếu. Mọi nước còn lại đều để con mã đứng nguyên trên f6 cho exf6.
                      en: Black does something else about the f6 knight. ...Ng4, ...Nh5, ...Nd5 and ...Ne4 put it on squares where it is taken for nothing (Qxg4, Qxh5, Nxd5, Nxe4); ...Nxe5 with the g6 knight gives the piece straight back for the e-pawn (dxe5); ...Qe7 pins the e5 pawn against White's king so that exf6 is not possible this very move, and ...Ke7 covers the knight with the king only to be hit by exf6+ with check. Every other reply leaves the knight standing on f6 for exf6.
                      fr: Les Noirs font autre chose du cavalier f6. ...Ng4, ...Nh5, ...Nd5 et ...Ne4 le placent sur des cases où il est pris pour rien (Qxg4, Qxh5, Nxd5, Nxe4) ; ...Nxe5 du cavalier g6 rend aussitôt la pièce contre le pion e (dxe5) ; ...Qe7 cloue le pion e5 sur le roi blanc de sorte que exf6 n'est pas possible ce coup-ci, et ...Ke7 couvre le cavalier avec le roi pour se faire frapper par exf6+ avec échec. Toute autre réponse laisse le cavalier en f6 pour exf6.
                  children:
                    - ply: Ng8
                      replyQuality: best
                      frequency: common
                      annotation:
                        vi: Con mã lùi hẳn về g8. Đen vẫn hơn một con mã, nhưng cả hai con mã đã trở về hàng cuối và không quân Đen nào đã phát triển, trong khi Trắng đã có hai tốt ở d4 và e5 và toàn bộ quân nhẹ sẵn sàng ra trận.
