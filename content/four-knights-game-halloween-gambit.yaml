# Four Knights Game: Halloween Gambit. Frozen defining line 1.e4 e5 2.Nf3 Nc6 3.Nc3 Nf6
# 4.Nxe5, which ends on White's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). Replayed with chess.js: 4...Nxe5 is the only sound recapture (nothing else
# challenges the knight or the point of the gambit), and after it White has given up a
# knight for a pawn with nothing hanging on the board.
#
# Extended for #175 past 4...Nxe5 with 5.d4 and both knight retreats. The 5...Ng6 line
# carries the one trap the gambit is known for — 6.e5 Ng8 7.Bc4 d6 8.Qf3 dxe5?? 9.Qxf7# —
# claimed with `type: trap` and nothing else; the certificate is produced by
# `npm run prove:mates` and replayed by `npm run verify:mates` (ADR-0005). The mate works
# because Black's e-pawn left the board on move 4, so after Qxf7+ the seventh rank is open
# and the king on e8 has no square: d8 and f8 hold its own queen and bishop, d7 and e7 are
# covered along the rank. Every other line here was replayed with chess.js, and every
# `position` leaf sits at a position with no check, no mate in one and no free capture.
id: four-knights-game-halloween-gambit
name: 'Four Knights Game: Halloween Gambit'
eco: C47
category: gambit
side: white
definingLine: [e4, e5, Nf3, Nc6, Nc3, Nf6, Nxe5]
soundness:
  value: unsound
  reviewedAt: '2026-09-18'
  basis:
    by: chan
    at: '2026-09-18'
    source: >-
      A judgement. White gives up a whole knight for one pawn on the promise of a big pawn
      centre and a lead in development, but accurate defence — simply retreating the
      recaptured knight when it is attacked, rather than trying to hold on to every extra
      pawn — leaves Black a piece up with no real compensation. It scores well against
      unprepared opponents, which is not the same thing. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-09-30'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics. The mate is not —
    it is machine-proved and replayed by CI.
tree:
  annotation:
    vi: Trắng chơi 4.Nxe5, hy sinh nguyên một con mã để ăn một tốt trung tâm, đặt cược vào việc dựng được một trung tâm tốt lớn bằng d4 và f4 trước khi Đen kịp phối hợp các quân của mình.
    en: White plays 4.Nxe5, sacrificing an entire knight for one central pawn, betting on building a big pawn centre with d4 and f4 before Black can coordinate its pieces.
    fr: Les Blancs jouent 4.Nxe5, sacrifiant un cavalier entier contre un seul pion central, misant sur la construction d'un grand centre de pions par d4 et f4 avant que les Noirs ne puissent coordonner leurs pièces.
  dismissRest:
    reason:
      vi: Đen không ăn lại bằng mã c6. Việc bỏ qua con mã bị ăn — chẳng hạn chơi d6 trước — chỉ khiến Trắng có thời gian củng cố thêm mà không phải trả lại bất cứ thứ gì, trong khi Nxe5 lấy lại ngay quân đã mất và không có rủi ro nào đi kèm.
      en: Black does not recapture with the c6 knight. Ignoring the missing knight — playing d6 first, for instance — only gives White more time to consolidate without giving anything back, while Nxe5 wins the piece back immediately and carries no risk of its own.
      fr: Les Noirs ne reprennent pas avec le cavalier c6. Ignorer le cavalier manquant — en jouant d6 en premier, par exemple — ne fait que donner aux Blancs plus de temps pour se consolider sans rien rendre, alors que Nxe5 récupère aussitôt la pièce sans aucun risque.
  children:
    - ply: Nxe5
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen ăn lại ngay bằng mã, thu hồi quân đã mất mà không mất thêm tốt hay tempo nào.
        en: Black recaptures at once with the knight, winning back the lost piece without giving up any further pawns or tempo.
        fr: Les Noirs reprennent aussitôt avec le cavalier, récupérant la pièce perdue sans céder de pion ni de temps supplémentaire.
      children:
        - ply: d4
          annotation:
            vi: Trắng đẩy tốt d4 đuổi con mã e5 ngay, bắt đầu dựng trung tâm bằng chính những nước lên tốt có kèm đe doạ. Con mã phải chọn một ô lùi, và mỗi ô lùi lại cho Trắng một nước lên tốt tiếp theo có đe doạ.
            en: White pushes d4 and chases the e5 knight at once, starting to build the centre with pawn moves that each carry a threat. The knight has to pick a retreat square, and each retreat hands White the next pawn push with a threat attached.
            fr: Les Blancs poussent d4 et chassent aussitôt le cavalier e5, commençant à bâtir le centre par des coups de pion qui portent chacun une menace. Le cavalier doit choisir une case de retraite, et chaque retraite offre aux Blancs la poussée de pion suivante, menace comprise.
          dismissRest:
            reason:
              vi: Đen chơi một nước khác với con mã đang bị tấn công, hoặc không đụng đến nó. Ba ô lùi ...Nc4, ...Nd3+ và ...Nf3+ để mất con mã ngay (Bxc4; cxd3, Qxd3 hay Bxd3; gxf3 hay Qxf3), còn ...Neg4 là ô lùi duy nhất còn lại không mất quân, dù h3 hoặc f3 sẽ hỏi nó lần nữa. Mọi nước còn lại đều để con mã đứng nguyên trên e5 cho dxe5 ăn lại quân.
              en: Black does something else with the attacked knight, or nothing at all. The retreats ...Nc4, ...Nd3+ and ...Nf3+ hang the knight on the spot (Bxc4; cxd3, Qxd3 or Bxd3; gxf3 or Qxf3), and ...Neg4 is the only other retreat that does not, though h3 or f3 will ask it the question again. Every other reply leaves the knight standing on e5 for dxe5 to take the piece back.
              fr: Les Noirs font autre chose du cavalier attaqué, ou rien du tout. Les retraites ...Nc4, ...Nd3+ et ...Nf3+ perdent le cavalier sur-le-champ (Bxc4 ; cxd3, Qxd3 ou Bxd3 ; gxf3 ou Qxf3), et ...Neg4 est la seule autre retraite qui ne le perde pas, même si h3 ou f3 lui reposera la question. Toute autre réponse laisse le cavalier en e5, où dxe5 reprend la pièce.
          children:
            - ply: Ng6
              replyQuality: best
              frequency: common
              annotation:
                vi: Con mã lùi về g6, ô lùi tự nhiên nhất và cũng là ô bị đe doạ ít nhất. Nhưng từ g6 nó không còn giúp gì cho con mã f6, và nước lên tốt tiếp theo của Trắng nhắm đúng vào con mã ấy.
                en: The knight drops back to g6, the most natural retreat and the least exposed one. But from g6 it no longer does anything for the knight on f6, and White's next pawn push is aimed at exactly that knight.
                fr: Le cavalier recule en g6, la retraite la plus naturelle et la moins exposée. Mais depuis g6 il ne fait plus rien pour le cavalier f6, et la prochaine poussée de pion blanche vise précisément ce cavalier.
              children:
