                              children:
                                - ply: Qf3
                                  annotation:
                                    vi: Hậu ra f3, và bây giờ f7 bị tấn công hai lần — bởi tượng c4 và hậu f3 — trong khi chỉ có vua canh nó. Qxf7# đang treo trên bàn cờ, và Đen phải làm gì đó về điều ấy ngay lập tức.
                                    en: The queen comes to f3, and now f7 is attacked twice — by the bishop on c4 and the queen on f3 — while only the king defends it. Qxf7# is hanging over the board, and Black has to do something about it right now.
                                    fr: La dame vient en f3, et f7 est désormais attaqué deux fois — par le fou c4 et la dame f3 — alors que seul le roi le défend. Qxf7# plane sur l'échiquier, et les Noirs doivent y répondre immédiatement.
                                  counts:
