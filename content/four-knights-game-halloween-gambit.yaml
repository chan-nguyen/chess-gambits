                      children:
                        - ply: Bc4
                          annotation:
                            vi: Trắng đưa tượng ra c4, nhắm vào f7 — ô mà chỉ còn vua Đen canh giữ, vì con tốt e đã biến mất từ nước 4. Đây là nước chuẩn bị cho cái bẫy, không phải là cái bẫy.
                            en: White develops the bishop to c4, aimed at f7 — a square only Black's king still guards, because the e-pawn has been gone since move 4. This sets the trap up; it is not the trap itself.
                            fr: Les Blancs développent le fou en c4, braqué sur f7 — une case que seul le roi noir garde encore, le pion e ayant disparu depuis le 4e coup. Ce coup prépare le piège ; ce n'est pas le piège lui-même.
