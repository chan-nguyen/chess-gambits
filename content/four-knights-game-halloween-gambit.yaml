                vi: Con mã lùi về c6, nơi nó đứng lúc đầu. Ô này giữ được ảnh hưởng lên trung tâm hơn g6, nhưng nó cũng cho Trắng nước d5 kèm đe doạ ngay lập tức.
                en: The knight drops back to c6, where it started. This square keeps more influence on the centre than g6 does, but it also gives White d5 with an immediate threat.
                fr: Le cavalier recule en c6, d'où il était parti. Cette case conserve plus d'influence sur le centre que g6, mais elle offre aussi aux Blancs d5 avec une menace immédiate.
              children:
                - ply: d5
                  annotation:
                    vi: Trắng đẩy tiếp d5, đuổi con mã lần thứ hai. Con mã c6 lại phải đi, và mỗi nước đi của nó là một nhịp nữa cho Trắng dựng trung tâm.
                    en: White pushes d5 and chases the knight a second time. The c6 knight has to move again, and every move it makes is another tempo for White's centre.
                    fr: Les Blancs poussent d5 et chassent le cavalier une deuxième fois. Le cavalier c6 doit encore bouger, et chacun de ses coups est un temps de plus pour le centre blanc.
                  dismissRest:
                    reason:
                      vi: Đen làm gì khác với con mã c6 đang bị tấn công, hoặc không đụng đến nó. Các ô lùi ...Nb8, ...Ne7, ...Na5 và ...Nb4 cũng giữ được con mã thừa, và Trắng dựng trung tâm y như vậy bằng f4 và e5; ...Nd4 thì để mất con mã vào Qxd4. Với con mã kia, ...Nxd5 và ...Nxe4 ném nó đi lấy một tốt (exd5 hay Nxd5; Nxe4), còn ...Nh5 và ...Ng4 treo nó cho hậu (Qxh5, Qxg4). Mọi nước còn lại để con mã đứng nguyên trên c6 cho dxc6 ăn lại quân.
                      en: Black does something else with the attacked c6 knight, or nothing at all. The retreats ...Nb8, ...Ne7, ...Na5 and ...Nb4 keep the extra piece as well, and White builds the same centre with f4 and e5; ...Nd4 drops the knight to Qxd4. With the other knight, ...Nxd5 and ...Nxe4 throw it away for a pawn (exd5 or Nxd5; Nxe4), and ...Nh5 and ...Ng4 hang it to the queen (Qxh5, Qxg4). Every other reply leaves the knight standing on c6 for dxc6 to take the piece back.
                      fr: Les Noirs font autre chose du cavalier c6 attaqué, ou rien du tout. Les retraites ...Nb8, ...Ne7, ...Na5 et ...Nb4 conservent aussi la pièce de plus, et les Blancs bâtissent le même centre par f4 et e5 ; ...Nd4 perd le cavalier sur Qxd4. Avec l'autre cavalier, ...Nxd5 et ...Nxe4 le jettent contre un pion (exd5 ou Nxd5 ; Nxe4), et ...Nh5 et ...Ng4 le laissent en prise à la dame (Qxh5, Qxg4). Toute autre réponse laisse le cavalier en c6, où dxc6 reprend la pièce.
                  children:
                    - ply: Ne5
                      replyQuality: best
                      frequency: common
                      annotation:
                        vi: Con mã quay lại e5, ô trung tâm nó vừa rời. Nó lại đứng đẹp — nhưng nó cũng lại là mục tiêu, và Trắng có sẵn một con tốt để hỏi nó.
                        en: The knight returns to e5, the central square it just left. It stands well there again — but it is a target again too, and White has a pawn ready to ask it the question.
                        fr: Le cavalier revient en e5, la case centrale qu'il vient de quitter. Il y est de nouveau bien placé — mais il redevient aussi une cible, et les Blancs ont un pion prêt à l'interroger.
                      children:
                        - ply: f4
                          annotation:
                            vi: Trắng đuổi con mã lần thứ ba bằng con tốt f. Bây giờ Trắng có ba tốt ở d5, e4 và f4 đứng cạnh nhau, và một khi con mã lùi thì e5 sẽ là nước lên tốt tiếp theo có đe doạ.
                            en: White chases the knight a third time, with the f-pawn. White now has three pawns side by side on d5, e4 and f4, and once the knight retreats e5 is the next pawn push with a threat.
                            fr: Les Blancs chassent le cavalier une troisième fois, avec le pion f. Les Blancs ont maintenant trois pions côte à côte en d5, e4 et f4, et dès que le cavalier recule, e5 est la prochaine poussée de pion avec menace.
                          dismissRest:
                            reason:
                              vi: Đen làm gì khác với con mã e5 đang bị tấn công, hoặc không đụng đến nó. ...Nc6 quay về đúng chỗ con tốt d5 đang đánh (dxc6); ...Nc4, ...Nd3+ và ...Nf3+ để mất con mã ngay (Bxc4; cxd3, Qxd3 hay Bxd3; gxf3 hay Qxf3); ...Neg4 là ô lùi duy nhất còn lại không mất quân. Mọi nước còn lại để con mã đứng nguyên trên e5 cho fxe5, và nơi một quân Đen ăn lại được trên e5 — sau ...Qe7, ...Bd6, ...d6 hay ...Nfg4 — thì con mã cũng đã đổi lấy đúng một con tốt.
                              en: Black does something else with the attacked e5 knight, or nothing at all. ...Nc6 walks back into the d5 pawn (dxc6); ...Nc4, ...Nd3+ and ...Nf3+ hang the knight on the spot (Bxc4; cxd3, Qxd3 or Bxd3; gxf3 or Qxf3); ...Neg4 is the only other retreat that keeps it. Every other reply leaves the knight standing on e5 for fxe5, and where a black piece then takes back on e5 — after ...Qe7, ...Bd6, ...d6 or ...Nfg4 — the knight has still gone for exactly one pawn.
                              fr: Les Noirs font autre chose du cavalier e5 attaqué, ou rien du tout. ...Nc6 revient droit sous le pion d5 (dxc6) ; ...Nc4, ...Nd3+ et ...Nf3+ perdent le cavalier sur-le-champ (Bxc4 ; cxd3, Qxd3 ou Bxd3 ; gxf3 ou Qxf3) ; ...Neg4 est la seule autre retraite qui le conserve. Toute autre réponse laisse le cavalier en e5 pour fxe5, et là où une pièce noire reprend ensuite en e5 — après ...Qe7, ...Bd6, ...d6 ou ...Nfg4 — le cavalier n'en est pas moins parti contre un seul pion.
                          children:
                            - ply: Ng6
                              replyQuality: best
                              frequency: common
                              annotation:
                                vi: Con mã lùi về g6, ô lùi duy nhất vừa an toàn vừa không tự nhảy vào một con tốt Trắng khác. Nhưng cũng như trong nhánh 5...Ng6, từ đây nó không còn giúp gì cho con mã f6.
                                en: The knight drops back to g6, the only retreat that is both safe and does not walk into another white pawn. But just as in the 5...Ng6 line, from here it does nothing for the knight on f6.
                                fr: Le cavalier recule en g6, la seule retraite qui soit à la fois sûre et ne se jette pas sous un autre pion blanc. Mais tout comme dans la ligne 5...Ng6, depuis cette case il ne fait rien pour le cavalier f6.
                              children:
                                - ply: e5
                                  annotation:
                                    vi: Trắng đẩy e5, đuổi con mã thứ hai — nước lên tốt thứ tư liên tiếp có kèm đe doạ. Con mã f6 không có ô nào tốt để đi.
                                    en: White pushes e5 and chases the second knight — the fourth pawn push in a row with a threat attached. The f6 knight has no good square.
                                    fr: Les Blancs poussent e5 et chassent le second cavalier — la quatrième poussée de pion consécutive assortie d'une menace. Le cavalier f6 n'a aucune bonne case.
                                  dismissRest:
                                    reason:
                                      vi: Đen làm gì khác với con mã f6. ...Nh5, ...Ng4 và ...Ne4 đưa nó tới ô bị ăn không (Qxh5, Qxg4, Nxe4), ...Nxd5 ném nó đi lấy một tốt (Nxd5 hay Qxd5); ...Nxe5 bằng con mã g6 trả lại con mã lấy con tốt e (fxe5), còn ...Nxf4 cùng con mã ấy để mất nó vào Bxf4. ...Qe7 ghim con tốt e5 vào vua Trắng nên exf6 chưa thể chơi ngay nước này, và ...Ke7 che con mã bằng vua để rồi bị exf6+ kèm chiếu. Mọi nước còn lại — kể cả các nước khác của con mã g6 — đều để con mã f6 đứng nguyên cho exf6.
                                      en: Black does something else about the f6 knight. ...Nh5, ...Ng4 and ...Ne4 put it where it is taken for nothing (Qxh5, Qxg4, Nxe4), and ...Nxd5 throws it away for a pawn (Nxd5 or Qxd5); ...Nxe5 with the g6 knight gives the piece back for the e-pawn (fxe5), and ...Nxf4 with that same knight loses it to Bxf4. ...Qe7 pins the e5 pawn against White's king so that exf6 is not possible this very move, and ...Ke7 covers the knight with the king only to be hit by exf6+ with check. Every other reply — the g6 knight's other moves included — leaves the f6 knight standing for exf6.
                                      fr: Les Noirs font autre chose du cavalier f6. ...Nh5, ...Ng4 et ...Ne4 le placent où il est pris pour rien (Qxh5, Qxg4, Nxe4), et ...Nxd5 le jette contre un pion (Nxd5 ou Qxd5) ; ...Nxe5 du cavalier g6 rend la pièce contre le pion e (fxe5), et ...Nxf4 du même cavalier le perd sur Bxf4. ...Qe7 cloue le pion e5 sur le roi blanc de sorte que exf6 n'est pas possible ce coup-ci, et ...Ke7 couvre le cavalier avec le roi pour se faire frapper par exf6+ avec échec. Toute autre réponse — les autres coups du cavalier g6 compris — laisse le cavalier f6 en place pour exf6.
                                  children:
                                    - ply: Ng8
                                      replyQuality: best
                                      frequency: common
                                      annotation:
                                        vi: Con mã lùi hẳn về g8, và bàn cờ đã ngừng chuyển động — không quân nào bị treo và không bên nào đang bị chiếu. Đây là hình mẫu của gambit Halloween khi Đen phòng thủ chính xác.
                                        en: The knight goes all the way back to g8, and the board has stopped moving — nothing is hanging and nobody is in check. This is the Halloween Gambit's textbook picture when Black defends accurately.
                                        fr: Le cavalier rentre tout à fait en g8, et l'échiquier a cessé de bouger — rien n'est en prise et personne n'est en échec. C'est l'image d'école du gambit Halloween quand les Noirs se défendent avec précision.
                                      outcome:
                                        type: position
                                        evaluation:
                                          vi: Trắng có tám tốt, một mã và cặp tượng; Đen có bảy tốt, hai mã và cặp tượng — Trắng vẫn kém một con mã đổi một tốt. Đổi lại Trắng có ba tốt ở d5, e5 và f4 chiếm trọn trung tâm, trong khi cả hai con mã Đen đã trở về g8 và g6 và không một quân Đen nào khác đã đi. Chưa bên nào nhập thành, và cột e không mở vì con tốt e5 của Trắng đang đứng trên đó.
                                          en: White has eight pawns, one knight and the bishop pair; Black has seven pawns, two knights and the bishop pair — White is still a knight down for a pawn. In return White has three pawns on d5, e5 and f4 owning the whole centre, while both black knights are back on g8 and g6 and not one other black piece has moved. Neither side has castled, and the e-file is not open because White's e5 pawn stands on it.
                                          fr: Les Blancs ont huit pions, un cavalier et la paire de fous ; les Noirs sept pions, deux cavaliers et la paire de fous — les Blancs ont toujours un cavalier de moins contre un pion. En échange les Blancs ont trois pions en d5, e5 et f4 qui tiennent tout le centre, tandis que les deux cavaliers noirs sont revenus en g8 et g6 et qu'aucune autre pièce noire n'a bougé. Aucun camp n'a roqué, et la colonne e n'est pas ouverte puisque le pion blanc e5 s'y trouve.
                                        plan:
                                          vi: Trắng phát triển với đe doạ, Bc4 nhắm f7, Qf3 hoặc Qg4 hướng vào f7 và g7, rồi O-O và Ne4 hay Nb5 — mục tiêu là tấn công trước khi Đen kịp đưa quân ra, vì mọi nhịp Đen dùng để phát triển đều thu hẹp khoảng cách. Đen chơi ...Bb4 hoặc ...Bc5, ...d6 để phá trung tâm, ...N8e7 và ...O-O; một khi vua an toàn và trung tâm Trắng bị bào mòn, con mã thừa sẽ quyết định ván cờ.
                                          en: White develops with threats, Bc4 at f7, Qf3 or Qg4 towards f7 and g7, then O-O and Ne4 or Nb5 — the aim is to attack before Black's pieces come out, because every tempo Black spends on development narrows the gap. Black plays ...Bb4 or ...Bc5, ...d6 to break the centre up, ...N8e7 and ...O-O; once the king is safe and White's centre has been chipped away, the extra knight decides the game.
                                          fr: Les Blancs se développent avec des menaces, Bc4 sur f7, Qf3 ou Qg4 vers f7 et g7, puis O-O et Ne4 ou Nb5 — le but est d'attaquer avant que les pièces noires ne sortent, car chaque temps que les Noirs consacrent au développement réduit l'écart. Les Noirs jouent ...Bb4 ou ...Bc5, ...d6 pour rompre le centre, ...N8e7 et ...O-O ; une fois le roi en sécurité et le centre blanc grignoté, le cavalier de plus décide de la partie.
                                        basis:
                                          by: chan
