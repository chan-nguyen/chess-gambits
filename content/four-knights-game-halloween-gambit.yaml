                                  dismissRest:
                                    reason:
                                      vi: Đen chơi một nước khác. {Mated} trong {legal} nước hợp lệ ở đây để Qxf7# xảy ra ngay, vì hậu và tượng cùng đánh f7 mà chỉ có vua canh, và khi con tốt e đã mất từ lâu thì hàng bảy mở toang — vua không chạy được sang d7 hay e7, còn d8 và f8 thì chính hậu và tượng Đen đang chiếm. Những nước còn lại đều chặn được nước chiếu bí ấy theo cách này hay cách khác — canh thêm f7 (...Qd7, ...Nh6, ...Nxe5), chắn một trong hai đường vào nó (...Be6, ...Bf5, ...Nf6, ...Nf4, ...d5), đẩy con tốt rời khỏi f7 (...f6, ...f5), hay cho vua một lối thoát (...Kd7, ...Be7, ...N8e7, ...N6e7, ...Qg5, ...Qh4) — và Trắng khi ấy vẫn kém một con mã đổi một tốt như trước, với trung tâm và cặp tượng. Cách tự nhiên nhất trong số đó, ...Qe7, được dựng thành nhánh riêng bên dưới.
                                      en: Black plays something else. {Mated} of the {legal} legal replies here allow Qxf7# on the spot, because the queen and the bishop both hit f7 while only the king defends it, and with the e-pawn long gone the seventh rank is wide open — the king cannot run to d7 or e7, and d8 and f8 are taken by Black's own queen and bishop. The remaining replies all stop that mate one way or another — by covering f7 again (...Qd7, ...Nh6, ...Nxe5), by blocking one of the two lines to it (...Be6, ...Bf5, ...Nf6, ...Nf4, ...d5), by moving the pawn off f7 (...f6, ...f5), or by giving the king a way out (...Kd7, ...Be7, ...N8e7, ...N6e7, ...Qg5, ...Qh4) — and White is then, as before, a knight down for a pawn with the centre and the bishop pair. The most natural of them, ...Qe7, is modelled below.
                                      fr: Les Noirs jouent autre chose. {Mated} des {legal} réponses légales ici laissent passer Qxf7# sur-le-champ, car la dame et le fou frappent tous deux f7 alors que seul le roi le défend, et le pion e ayant disparu depuis longtemps, la septième rangée est grande ouverte — le roi ne peut fuir ni en d7 ni en e7, et d8 et f8 sont occupées par la propre dame et le propre fou des Noirs. Les autres réponses empêchent toutes ce mat d'une façon ou d'une autre — en couvrant f7 de nouveau (...Qd7, ...Nh6, ...Nxe5), en bouchant l'une des deux lignes qui y mènent (...Be6, ...Bf5, ...Nf6, ...Nf4, ...d5), en ôtant le pion de f7 (...f6, ...f5), ou en donnant une issue au roi (...Kd7, ...Be7, ...N8e7, ...N6e7, ...Qg5, ...Qh4) — et les Blancs restent alors, comme avant, un cavalier de moins contre un pion, avec le centre et la paire de fous. La plus naturelle d'entre elles, ...Qe7, est modélisée ci-dessous.
