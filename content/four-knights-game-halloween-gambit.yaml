                              fr: Les Noirs jouent autre chose. Dans chacune de ces réponses les Noirs gardent pour l'instant le cavalier de plus, et certaines rendent aussitôt du matériel — ...Qg5 sur Bxg5, ...Nf4 sur Bxf4, ...Nxe5 sur dxe5, ...Bc5 sur dxc5, ...Ba3 sur bxa3, ...b5 sur Bxb5 ou Nxb5. Les autres — ...d5, ...Bb4, ...c6, ...Nh6, ...N8e7 et consorts — se développent simplement ; le piège ci-dessous est la ligne 7...d6 8.Qf3 dxe5, et aucune d'elles n'est cette ligne.
