                                        evaluation:
                                          vi: Trắng có tám tốt, một mã và cặp tượng; Đen có bảy tốt, hai mã và cặp tượng — Trắng vẫn kém một con mã đổi một tốt. Nhưng nhìn vào vị trí quân thì hai con mã Đen đứng ở g8 và g6, tượng c8 và f8 chưa đi, và con hậu e7 đang đứng chắn ngay trước tượng f8, nên Đen chưa thể nhập thành ngắn cho tới khi giải quyết được cả tượng lẫn mã trên cánh vua. Trắng có tốt d4 và e5 ở trung tâm, tượng c4 nhìn vào f7, và có thể nhập thành ngay nước sau.
                                          en: White has eight pawns, one knight and the bishop pair; Black has seven pawns, two knights and the bishop pair — White is still a knight down for a pawn. But look where the pieces stand, Black's knights sit on g8 and g6, the bishops on c8 and f8 have not moved, and the queen on e7 is standing right in front of the f8 bishop, so Black cannot castle short until both the bishop and the knight on the kingside have been sorted out. White has pawns on d4 and e5 in the centre, the bishop on c4 looking at f7, and can castle next move.
                                          fr: Les Blancs ont huit pions, un cavalier et la paire de fous ; les Noirs sept pions, deux cavaliers et la paire de fous — les Blancs ont toujours un cavalier de moins contre un pion. Mais regardez où se trouvent les pièces, les cavaliers noirs sont en g8 et g6, les fous c8 et f8 n'ont pas bougé, et la dame e7 se tient juste devant le fou f8, si bien que les Noirs ne peuvent pas faire le petit roque avant d'avoir réglé à la fois le fou et le cavalier de l'aile roi. Les Blancs ont les pions d4 et e5 au centre, le fou c4 qui regarde f7, et peuvent roquer dès le coup suivant.
                                        plan:
                                          vi: Trắng nhập thành, chơi Nd5 để đuổi hậu khỏi e7 và tiếp tục cản Đen phát triển, rồi Re1 và Bf4 hoặc Bg5 giữ chặt con tốt e5 và khai thác việc vua Đen còn ở giữa bàn. Đen phải trả lại nhịp bằng ...Be6 hay ...Bg4 để đổi con tượng c4, ...dxe5 rồi ...Nf6 và ...O-O càng sớm càng tốt; một khi vua Đen an toàn và các quân đã ra, con mã thừa sẽ quyết định.
                                          en: White castles, plays Nd5 to chase the queen off e7 and keep Black from developing, then Re1 and Bf4 or Bg5 to hold the e5 pawn and make the most of Black's king still standing in the centre. Black has to spend tempi on ...Be6 or ...Bg4 to trade off the c4 bishop, ...dxe5 and then ...Nf6 and ...O-O as soon as possible; once the king is safe and the pieces are out, the extra knight decides.
                                          fr: Les Blancs roquent, jouent Nd5 pour chasser la dame de e7 et empêcher les Noirs de se développer, puis Re1 et Bf4 ou Bg5 pour tenir le pion e5 et tirer parti du roi noir encore au centre. Les Noirs doivent dépenser des temps en ...Be6 ou ...Bg4 pour échanger le fou c4, ...dxe5 puis ...Nf6 et ...O-O le plus vite possible ; une fois le roi en sécurité et les pièces sorties, le cavalier de plus décide.
