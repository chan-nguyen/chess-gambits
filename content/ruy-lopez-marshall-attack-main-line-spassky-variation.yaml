tree:
  annotation:
    vi: 'Đen vừa chơi 18...Qh5. Đen vẫn kém một tốt, sáu so với bảy, và đền lại bằng các quân hoạt động: hậu h5 tấn công tốt h2, tượng d6 tấn công tốt g3, còn mã d5 và xe e6 cùng tấn công tượng e3 của Trắng.'
    en: "Black has just played 18...Qh5. Black is still a pawn down, six pawns to seven, and pays for it with active pieces: the queen on h5 attacks the h2 pawn, the bishop on d6 attacks the g3 pawn, and the knight on d5 and the rook on e6 both attack White's bishop on e3."
    fr: 'Les Noirs viennent de jouer 18...Qh5. Les Noirs ont toujours un pion de moins, six contre sept, et le paient par des pièces actives : la dame h5 attaque le pion h2, le fou d6 attaque le pion g3, et le cavalier d5 et la tour e6 attaquent tous deux le fou e3 des Blancs.'
  dismissRest:
    reason:
      vi: Trắng chọn nước khác thay vì 19.f3, chẳng hạn 19.Bxd5 hoặc 19.axb5. Đánh giá trong mục này dành cho nhánh Trắng tấn công tượng g4 bằng f3.
      en: White plays something other than 19.f3, for example 19.Bxd5 or 19.axb5. The assessment in this entry is for the line where White attacks the bishop on g4 with f3.
      fr: Les Blancs jouent autre chose que 19.f3, par exemple 19.Bxd5 ou 19.axb5. L'évaluation de cette fiche porte sur la ligne où les Blancs attaquent le fou g4 par f3.
  children:
    - ply: f3
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng chơi f3, tấn công tượng g4. Tốt f3 có mã d2 bảo vệ, còn tượng g4 của Đen có hậu h5 bảo vệ.
        en: White plays f3, attacking the bishop on g4. The f3 pawn is defended by the knight on d2, and Black's bishop on g4 is defended by the queen on h5.
        fr: Les Blancs jouent f3, attaquant le fou g4. Le pion f3 est défendu par le cavalier d2, et le fou g4 noir est défendu par la dame h5.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen sáu — con tốt Marshall chưa lấy lại được. Bù lại, tượng d6 của Đen tấn công tốt g3, nơi chỉ có tốt h2 bảo vệ, và hậu h5 tấn công tốt h2, nơi chỉ có vua g1 bảo vệ.'
          en: "Count the pawns: White seven, Black six — the Marshall pawn has not come back. In return Black's bishop on d6 attacks the g3 pawn, which only the h2 pawn defends, and the queen on h5 attacks the h2 pawn, which only the king on g1 defends."
          fr: "Comptons les pions : sept pour les Blancs, six pour les Noirs — le pion Marshall n'est pas revenu. En contrepartie, le fou d6 noir attaque le pion g3, que seul le pion h2 défend, et la dame h5 attaque le pion h2, que seul le roi g1 défend."
        plan:
          vi: Trắng đe dọa fxg4, ăn tượng Đen bằng một tốt, và tìm cách đổi bớt quân tấn công của Đen bằng Bxd5 cxd5, giữ tốt thừa. Đen phải xử lý tượng g4 trước, chẳng hạn bằng ...Bxf3, vì sau Nxf3 Qxf3 Đen đã lấy lại tốt, hoặc bằng ...Bf5.
          en: White threatens fxg4, which would win the bishop for a pawn, and looks to trade off Black's attackers with Bxd5 cxd5, keeping the extra pawn. Black has to deal with the bishop on g4 first, for example with ...Bxf3, which regains the pawn after Nxf3 Qxf3, or with ...Bf5.
          fr: Les Blancs menacent fxg4, qui gagnerait le fou contre un pion, et cherchent à échanger les attaquants noirs par Bxd5 cxd5, en gardant le pion supplémentaire. Les Noirs doivent d'abord s'occuper du fou g4, par exemple par ...Bxf3, qui regagne le pion après Nxf3 Qxf3, ou par ...Bf5.
        basis:
          by: chan
