tree:
  annotation:
    vi:
      Sau khi đổi tượng và đẩy d4, Bd6 rồi, Trắng vẫn chưa đưa được mã b1 hay tượng c1 vào cuộc — Đen
      đã thí tốt để giữ nguyên tình trạng chậm phát triển ấy càng lâu càng tốt.
    en:
      After the bishop trade and the d4, Bd6 exchanges, White still has not brought the knight on b1
      or the bishop on c1 into play — Black has given up a pawn to keep that slow development going
      for as long as possible.
    fr:
      Après l'échange des fous et les coups d4, Bd6, les Blancs n'ont toujours pas fait entrer en jeu
      le cavalier b1 ni le fou c1 — les Noirs ont cédé un pion pour prolonger le plus possible ce
      retard de développement.
  dismissRest:
    reason:
      vi:
        Trắng lui xe theo cách khác, ví dụ Re1 hay Re2. Ý tưởng phòng thủ và đánh giá chung — Đen kém
        một tốt nhưng có thế công kéo dài — không đổi nhiều theo ô xe lui về.
      en:
        White retreats the rook some other way, for instance Re1 or Re2. The defensive idea and the
        overall assessment — Black down a pawn but with a lasting attack — do not change much
        depending on which square the rook retreats to.
      fr:
        Les Blancs replient la tour autrement, par exemple Re1 ou Re2. L'idée défensive et l'évaluation
        générale — les Noirs à un pion de moins mais avec une attaque durable — ne changent guère
        selon la case de repli de la tour.
  children:
    - ply: Re3
      replyQuality: good
      frequency: occasional
      annotation:
        vi:
          Trắng lui xe về e3 thay vì rút thẳng về e1, giữ xe hoạt động trên hàng ngang thứ ba để phòng thủ
          cánh hậu.
        en:
          White pulls the rook back to e3 instead of retreating it all the way to e1, keeping it active
          along the third rank to help defend the queenside.
        fr:
          Les Blancs replient la tour en e3 plutôt que de la reculer jusqu'en e1, la gardant active sur la
          troisième rangée pour aider à défendre l'aile dame.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 7 còn Đen 6 — Trắng hơn đúng một tốt sạch.
          en: Count the pawns and it is 7 for White against 6 for Black — White is up one clean pawn.
          fr:
            "Comptez les pions : 7 pour les Blancs contre 6 pour les Noirs — les Blancs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng dùng xe e3 để phòng thủ ngang, tranh thủ đưa mã b1 và tượng c1 vào cuộc trong lúc vẫn giữ
            tốt thừa. Đen chơi Qh4 hoặc Qf6, đưa xe a8 về e8, và tiếp tục dồn quân vào nhà vua Trắng
            còn chưa hoàn thiện.
          en:
            White uses the rook on e3 for lateral defence while trying to bring the knight on b1 and the
            bishop on c1 into the game, all while keeping the extra pawn. Black plays Qh4 or Qf6,
            swings the rook from a8 to e8, and keeps piling pieces up against a White king whose
            defenders have not arrived yet.
          fr:
            Les Blancs utilisent la tour e3 pour une défense latérale tout en essayant de faire entrer en
            jeu le cavalier b1 et le fou c1, tout en gardant le pion supplémentaire. Les Noirs
            jouent Qh4 ou Qf6, amènent la tour a8 en e8, et continuent d'entasser leurs pièces
            contre un roi blanc dont les défenseurs ne sont pas encore arrivés.
        basis:
          by: chan
          at: 2026-09-29
