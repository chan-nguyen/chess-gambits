tree:
  annotation:
    vi: Đen vừa chơi 11...c6, củng cố mã d5. Mã d5 bị xe e5 và tượng b3 tấn công, nhưng có hậu d8 và tốt c6 bảo vệ. Đen đang kém một tốt, sáu so với bảy.
    en: Black has just played 11...c6, shoring up the knight on d5. The knight is attacked by the rook on e5 and the bishop on b3 and defended by the queen on d8 and the c6 pawn. Black is a pawn down, six to seven.
    fr: Les Noirs viennent de jouer 11...c6, consolidant le cavalier d5. Le cavalier est attaqué par la tour e5 et le fou b3 et défendu par la dame d8 et le pion c6. Les Noirs ont un pion de moins, six contre sept.
  dismissRest:
    reason:
      vi: Trắng chọn nước khác thay vì 12.d4, chẳng hạn 12.d3 hoặc 12.Re1. Đánh giá trong mục này dành cho nhánh Trắng chơi d4 ngay.
      en: White plays something other than 12.d4, for example 12.d3 or 12.Re1. The assessment in this entry is for the line where White plays d4 at once.
      fr: Les Blancs jouent autre chose que 12.d4, par exemple 12.d3 ou 12.Re1. L'évaluation de cette fiche porte sur la ligne où les Blancs jouent d4 tout de suite.
  children:
    - ply: d4
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng chơi d4, dùng tốt này bảo vệ xe e5 và mở đường cho tượng c1.
        en: White plays d4, using the pawn to defend the rook on e5 and opening the diagonal for the bishop on c1.
        fr: Les Blancs jouent d4, utilisant le pion pour défendre la tour e5 et ouvrant la diagonale du fou c1.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen sáu — con tốt Marshall chưa lấy lại được. Bù lại, mã d5 của Đen bị xe e5 và tượng b3 tấn công nhưng có hậu d8 và tốt c6 bảo vệ, còn mã b1, tượng c1 và xe a1 của Trắng vẫn chưa rời ô xuất phát.'
          en: "Count the pawns: White seven, Black six — the Marshall pawn has not come back. In return Black's knight on d5 is attacked by the rook on e5 and the bishop on b3 but defended by the queen on d8 and the c6 pawn, and White's knight on b1, bishop on c1 and rook on a1 have not yet left their starting squares."
          fr: "Comptons les pions : sept pour les Blancs, six pour les Noirs — le pion Marshall n'est pas revenu. En contrepartie, le cavalier d5 noir est attaqué par la tour e5 et le fou b3 mais défendu par la dame d8 et le pion c6, et le cavalier b1, le fou c1 et la tour a1 des Blancs n'ont pas encore quitté leur case de départ."
        plan:
          vi: Trắng chơi Re1 khi tượng d6 tấn công xe, rồi Nd2 và Be3 để phát triển nốt. Đen chơi ...Bd6, ...Qh4 và ...Bg4 để dồn quân vào cánh vua Trắng.
          en: White plays Re1 once the bishop on d6 attacks the rook, then Nd2 and Be3 to finish developing. Black plays ...Bd6, ...Qh4 and ...Bg4, bringing the pieces towards White's kingside.
          fr: Les Blancs jouent Re1 lorsque le fou d6 attaque la tour, puis Nd2 et Be3 pour achever leur développement. Les Noirs jouent ...Bd6, ...Qh4 et ...Bg4, amenant les pièces vers l'aile roi blanche.
        basis:
          by: chan
          at: '2026-09-30'
