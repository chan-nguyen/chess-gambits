# Philidor Defense: Lion Variation, Shirov Gambit. Frozen defining line 1.e4 e5 2.Nf3 d6 3.d4
# Nd7 4.Nc3 Ngf6 5.g4 ends on White's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Part of batch t of round 4 (#182). Every ply below was
# replayed with chess.js before it was annotated; searchMate at 3 moves from the leaf returns
# no-mate, so no forced mate is claimed anywhere in this entry, and no capture is left going
# free at the leaf.
id: 'philidor-defense-lion-variation-shirov-gambit'
name: 'Philidor Defense: Lion Variation, Shirov Gambit'
eco: 'C41'
category: 'gambit'
side: 'white'
definingLine:
  - 'e4'
  - 'e5'
