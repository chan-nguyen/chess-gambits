soundness:
  value: 'dubious'
  reviewedAt: '2026-10-01'
  basis:
    by: 'chan'
    at: '2026-10-01'
    source: "A judgement. At the end of the defining line the pawns are level, eight each, and the pawn on g4 is attacked by the knight on f6 and defended by nothing, so Black can take it at once. After the capture White's main return is the half-open g-file and some quick development, which does not make up for the pawn, so the line is judged dubious. No engine was consulted and no database was queried."
judgement:
  by: 'chan'
  at: '2026-10-01'
  source: "Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement on one date, not engine output and not database statistics."
tree:
  annotation:
    vi: 'Trắng vừa chơi 5.g4, đẩy tốt g lên g4. Số tốt hai bên bằng nhau, mỗi bên tám. Tốt g4 bị mã f6 tấn công và không có gì bảo vệ.'
    en: 'White has just played 5.g4, pushing the g-pawn to g4. The pawns are level, eight each. The pawn on g4 is attacked by the knight on f6 and nothing defends it.'
    fr: 'Les Blancs viennent de jouer 5.g4, poussant le pion g en g4. Les pions sont à égalité, huit de chaque côté. Le pion g4 est attaqué par le cavalier f6 et rien ne le défend.'
  dismissRest:
    reason:
      vi: 'Đen chơi nước khác 5...Nxg4 ở đây. Mục này đi theo nước ăn tốt g4.'
      en: 'Black plays something other than 5...Nxg4 here. This entry follows the capture of the pawn on g4.'
      fr: 'Les Noirs jouent autre chose que 5...Nxg4 ici. Cette entrée suit la capture du pion g4.'
  children:
    - ply: 'Nxg4'
      replyQuality: 'good'
      frequency: 'common'
      annotation:
        vi: 'Đen ăn tốt g4 bằng mã f6. Mã g4 giờ tấn công các tốt f2 và h2.'
        en: 'Black takes the pawn on g4 with the knight from f6. The knight on g4 now attacks the pawns on f2 and h2.'
        fr: 'Les Noirs prennent le pion g4 avec le cavalier de f6. Le cavalier g4 attaque maintenant les pions f2 et h2.'
      outcome:
        type: 'position'
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nghĩa là con tốt đã thí chưa lấy lại được. Tốt h của Trắng bị cô lập vì tốt g đã mất, và cột g bán mở cho Trắng, với tốt g7 của Đen còn nằm trên đó. Mã g4 của Đen tấn công các tốt f2 và h2. dxe5 chỉ đổi tốt, còn Nxe5 sẽ mất một mã lấy một tốt.'
          en: "Count the pawns: White seven, Black eight, so the sacrificed pawn has not come back. White's h-pawn is isolated now that the g-pawn is gone, and the g-file is half-open for White, with Black's g7 pawn still on it. Black's knight on g4 attacks the pawns on f2 and h2. dxe5 would only trade pawns, and Nxe5 would give a knight for a pawn."
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs, donc le pion sacrifié n'est pas revenu. Le pion h blanc est isolé depuis que le pion g a disparu, et la colonne g est semi-ouverte pour les Blancs, le pion g7 noir s'y trouvant encore. Le cavalier g4 des Noirs attaque les pions f2 et h2. dxe5 ne ferait qu'échanger des pions, et Nxe5 donnerait un cavalier pour un pion."
        plan:
          vi: 'Trắng tấn công mã bằng Rg1 và phát triển bằng Bc4. Đen lùi mã bằng ...Ngf6 và chơi ...h6 để lấy ô g5 khỏi các quân Trắng.'
          en: "White attacks the knight with Rg1 and develops with Bc4. Black retreats the knight with ...Ngf6 and plays ...h6 to take the g5 square away from White's pieces."
          fr: 'Les Blancs attaquent le cavalier par Rg1 et se développent par Bc4. Les Noirs replient le cavalier par ...Ngf6 et jouent ...h6 pour retirer la case g5 aux pièces blanches.'
        basis:
          by: 'chan'
          at: '2026-10-01'
