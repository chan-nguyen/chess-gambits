# King's Gambit Accepted, Bishop's Gambit, Gianutio Gambit. One of eighteen entries tracked
# by issue #111 (group H), sharing the trunk `1.e4 e5 2.f4 exf4 3.Bc4` with
# `kings-gambit-accepted.yaml` and group G (#110). Defining line ends on White's 3.Bc4
# (invariant 5). Every move replayed with a scratch chess.js script (deleted before commit):
# 3...f5 4.exf5 Nf6 was confirmed legal, with material returning to level (White has now
# recaptured the pawn Black gave with 3...f5, leaving the original gambit pawn as the only
# outstanding imbalance) and no free capture standing for either side at that point.
#
# 3...f5 is a further, voluntary pawn sacrifice on top of the King's Gambit itself. Even so,
# under the stricter #107 bar the position after 4.exf5 does not show a two-point material
# edge or an unambiguous structural catastrophe for Black — it restores material parity and
# leaves a genuinely sharp position — so rather than dressing that up as decisive, the line
# stops at `unexplored`, honestly short of the depth bar.
