tree:
  annotation:
    vi: Trắng vừa đưa tượng ra c4, Gambit Tượng. Mục này đi sâu riêng vào 3...f5, Gambit Gianutio.
    en: White has just played the bishop to c4, the Bishop's Gambit. This entry follows specifically 3...f5, the Gianutio Gambit.
    fr: Les Blancs viennent de jouer le fou en c4, le Gambit du Fou. Cette entrée suit spécifiquement 3...f5, le Gambit Gianutio.
  dismissRest:
    reason:
      vi: Đen đáp lại 3.Bc4 bằng một nước khác ngoài 3...f5 — giữ tốt bằng 3...g5, đánh trung tâm bằng 3...d5, hay phát triển bằng 3...Nf6. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 3.Bc4 with something other than 3...f5 — holding the pawn with 3...g5, striking the centre with 3...d5, or developing with 3...Nf6. Each is outside the scope of this entry.
      fr: Les Noirs répondent à 3.Bc4 par autre chose que 3...f5 — conserver le pion par 3...g5, une frappe centrale par 3...d5, ou un développement par 3...Nf6. Chacun sort du cadre de cette entrée.
  children:
    - ply: f5
      replyQuality: inaccuracy
      frequency: rare
      annotation:
        vi: Gambit Gianutio. Đen thí thêm một tốt nữa để mở đường cho hậu và tượng f8, đặt cược vào hoạt động quân thay vì giữ vật chất.
        en: The Gianutio Gambit. Black offers a second pawn to open lines for the queen and the f8 bishop, betting on piece activity rather than holding on to material.
        fr: Le Gambit Gianutio. Les Noirs offrent un second pion pour ouvrir des lignes à la dame et au fou f8, misant sur l'activité des pièces plutôt que sur la conservation du matériel.
      children:
        - ply: exf5
          annotation:
            vi: Trắng ăn tốt, đưa quân số trở lại ngang bằng — con tốt Đen vừa thí đã bù lại đúng bằng con tốt f4 ban đầu.
            en: White captures the pawn, restoring material to level — the pawn Black just sacrificed pays back exactly the original f4 pawn.
            fr: Les Blancs prennent le pion, ramenant le matériel à l'égalité — le pion que les Noirs viennent de sacrifier rembourse exactement le pion f4 initial.
          outcome:
            type: position
            evaluation:
              vi: Quân số hoàn toàn ngang nhau — con tốt f5 Đen vừa thí đã bù đúng bằng con tốt f4 Trắng mất ở đầu ván. Đã thử tiếp 5.Nc3 (phát triển, chuẩn bị O-O hoặc d4) d5 (Đen thách thức tượng c4 và trung tâm ngay), vật chất vẫn ngang nhau sau đó và cả hai bên đều còn quân chưa phát triển — đây là một thế cờ cân bằng và sắc bén, không phải một lợi thế cho ai.
              en: Material is fully level — the f5 pawn Black just sacrificed pays back exactly the f4 pawn White lost at the start. Continuing with 5.Nc3 (developing, preparing O-O or d4) d5 (Black challenges the c4 bishop and the centre at once) was tried; material stays level afterward and both sides still have pieces to develop — this is a level, sharp position, not an edge for either side.
              fr: Le matériel est parfaitement égal — le pion f5 que les Noirs viennent de sacrifier rembourse exactement le pion f4 perdu par les Blancs au début. Poursuivre par 5.Nc3 (développement, préparant O-O ou d4) d5 (les Noirs défient aussitôt le fou c4 et le centre) a été essayé ; le matériel reste égal ensuite et les deux camps ont encore des pièces à développer — c'est une position égale et tranchante, pas un avantage pour l'un ou l'autre.
            plan:
              vi: Trắng lui tượng về b3 hay b5, rồi chơi Nf3 và O-O, tận dụng cột f nửa mở còn lại từ hai lần đổi tốt f. Đen chơi Bd6 hay Nf6, hoàn thiện phát triển nhanh chóng và cố dùng cặp tốt trung tâm để bù lại quân số đã mất công sức để giành.
              en: White retreats the bishop to b3 or b5, then plays Nf3 and castles, making use of the half-open f-file left over from the two f-pawn trades. Black plays Bd6 or Nf6, developing quickly and trying to use the central pawn duo to justify the material already spent reaching it.
              fr: Les Blancs replient le fou en b3 ou b5, puis jouent Nf3 et roquent, profitant de la colonne f semi-ouverte héritée des deux échanges de pions f. Les Noirs jouent Bd6 ou Nf6, se développant rapidement et cherchant à utiliser le duo de pions centraux pour justifier le matériel déjà dépensé pour l'obtenir.
            basis:
              by: chan
              at: '2026-09-18'
