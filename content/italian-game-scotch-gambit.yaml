judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa nhập thành, chưa vội đòi lại con tốt d4 ngay. Vua đã an toàn, và con tốt d4 vẫn còn đó chờ Đen quyết định giữ hay không.
    en: White has just castled, in no hurry to win the d4 pawn back yet. The king is already safe, and the d4 pawn is still sitting there for Black to decide whether to hold.
    fr: Les Blancs viennent de roquer, sans se presser de regagner le pion d4. Le roi est déjà en sécurité, et le pion d4 reste en place, aux Noirs de décider s'ils le gardent.
  dismissRest:
    reason:
      vi: Đen không ăn thêm tốt e4 — phát triển bằng 5...Bc5 hay Be7, hay chơi 5...d6. Mỗi lựa chọn để nguyên con tốt e4 trên bàn cờ, nghĩa là lời mời thứ hai vẫn chưa hề được nhận.
      en: Black does not grab the e4 pawn too — developing with 5...Bc5 or Be7, or playing 5...d6. Each leaves the e4 pawn sitting on the board, meaning the second invitation has still not actually been accepted.
      fr: Les Noirs ne prennent pas aussi le pion e4 — développant par 5...Fc5 ou Be7, ou jouant 5...d6. Chacun laisse le pion e4 sur l'échiquier, ce qui veut dire que la seconde invitation n'a toujours pas été acceptée.
  children:
    - ply: Nxe4
      replyQuality: inaccuracy
      frequency: occasional
      annotation:
        vi: Đen ăn thêm con tốt e4 thứ hai, giờ hơn hai tốt tính riêng về số lượng. Nhưng con mã ấy đứng khá xa và Trắng vẫn còn cả cột e mở lẫn nhịp phát triển để bù lại.
        en: Black grabs the second e4 pawn too, now two pawns up by count alone. But that knight stands rather far out, and White still has the open e-file and the development tempo to show for both pawns.
        fr: Les Noirs ramassent aussi le second pion e4, désormais deux pions d'avance en nombre seulement. Mais ce cavalier se retrouve plutôt isolé, et les Blancs ont toujours la colonne e ouverte et le temps de développement à montrer pour les deux pions.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng sáu — hơn hẳn hai tốt tính riêng, nhưng vua Trắng đã an toàn sau khi nhập thành còn vua Đen thì chưa, và con mã e4 vừa ăn được vẫn chưa có tốt nào của Đen che chắn. Đây là vật chất tạm thời chứ chưa phải bức tranh cuối cùng.
          en: Count the pawns and it is eight for Black, six for White — a full two pawns up by count alone, but White's king is already safe after castling while Black's is not, and the knight that just captured on e4 is shielded by no Black pawn yet. This is temporary material, not the final picture.
          fr: Comptez les pions, huit pour les Noirs, six pour les Blancs — deux pions d'avance en nombre seulement, mais le roi blanc est déjà en sécurité après le roque alors que celui des Noirs ne l'est pas, et le cavalier qui vient de capturer en e4 n'est protégé par aucun pion noir. C'est un matériel provisoire, pas l'image finale.
        plan:
          vi: Trắng chơi Re1 ghim con mã e4 vào vua Đen chưa nhập thành, rồi Bd3 hay Nc3 đuổi nó, tận dụng cột e mở và vua an toàn để tấn công. Đen chơi d5 chống đỡ trung tâm, hoặc Be7 và O-O gấp, cố giữ vững hai con tốt đã ăn được trước khi Trắng kịp dồn quân.
          en: White plays Re1 to pin the e4 knight against Black's uncastled king, then Bd3 or Nc3 to chase it, using the open e-file and the safe king to attack. Black plays d5 to prop up the centre, or Be7 and castles urgently, trying to hold on to both captured pawns before White can mass an attack.
          fr: Les Blancs jouent Re1 pour clouer le cavalier e4 contre le roi noir qui n'a pas roqué, puis Bd3 ou Cc3 pour le chasser, exploitant la colonne e ouverte et la sécurité du roi pour attaquer. Les Noirs jouent d5 pour étayer le centre, ou Be7 et roquent d'urgence, essayant de garder les deux pions gagnés avant que les Blancs ne rassemblent une attaque.
        basis:
          by: chan
          at: '2026-09-25'
