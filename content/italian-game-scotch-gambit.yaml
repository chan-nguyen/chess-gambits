# Italian Game, Scotch Gambit. One entry in a batch authored for issue #148 (batch h).
# Defining line ends on White's 5.O-O (invariant 5) — the dataset's own shortest line for
# this name already ends there, on White's own ply, so no ply needs to be trimmed out into a
# modelled reply. The single child below is this author's own choice of the sharpest,
# best-known reply (matching what the dataset separately names the Double Gambit Accepted
# one ply deeper) rather than a further named sub-variation of its own, and it was replayed
# with chess.js like every other ply. Every ply below was replayed with chess.js before
# being written.
id: italian-game-scotch-gambit
name: 'Italian Game: Scotch Gambit'
eco: C56
category: gambit
side: white
definingLine: [e4, e5, Nf3, Nc6, Bc4, Nf6, d4, exd4, 'O-O']
soundness:
  value: sound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. White has a full tempo and an open centre for the pawn, king already
