                vi: Trắng không đổi tốt mà đỡ luôn con tốt e5 bằng tốt d, giữ chặt phần thưởng vật chất và không cho con tượng f8 cơ hội ra ô d6 với nhịp. Đây được xem là cách thử nghiêm túc nhất chống lại Gambit From.
                en: White does not trade pawns and instead supports the e5 pawn with the d-pawn, holding on to the material gain and denying the f8 bishop the chance to come out to d6 with tempo. This is regarded as the most serious test of From's Gambit.
                fr: Les Blancs n'échangent pas les pions et soutiennent au contraire le pion e5 avec le pion d, conservant le gain matériel et refusant au fou f8 la possibilité de sortir en d6 avec gain de temps. C'est considéré comme le test le plus sérieux contre le Gambit From.
              children:
                - ply: dxe5
                  annotation:
                    vi: Đen ăn lại ngay, vì để nguyên con tốt e5 đứng đó chỉ giúp Trắng thêm thời gian củng cố. Sau nước này quân số trở lại ngang bằng tạm thời, và ván cờ sẽ được quyết định bởi việc Trắng có ăn lại đúng cách hay không.
                    en: Black recaptures at once, since leaving the e5 pawn standing only gives White more time to consolidate. After this move material is briefly level again, and the game will be decided by whether White recaptures correctly.
                    fr: Les Noirs reprennent aussitôt, car laisser le pion e5 en place ne ferait que donner aux Blancs plus de temps pour se consolider. Après ce coup, le matériel est brièvement à nouveau égal, et la partie se décidera selon que les Blancs reprennent correctement ou non.
                  dismissRest:
                    reason:
                      vi: Trắng không ăn lại ở e5 ngay. Nước 4.d5 đẩy qua và bỏ hẳn con tốt e5 cho Đen giữ vĩnh viễn, khiến Trắng chẳng còn gì bù cho con tốt đã mất ở nước hai. Mọi nước phát triển hay đi tốt khác — Nf3, Nc3, Nd2, Bd2, Be3, Bf4, Bg5, Bh6, Qd2, Qd3, Kd2, Kf2, Na3, Nh3, cùng các nước tốt a3, a4, b3, b4, c3, c4, e3, e4, g3, g4, h3, h4 — đều để mặc con tốt e5 đứng đó không ai đỡ và có thể bị ăn ở một nước sau bất cứ lúc nào, nên trong mọi trường hợp này Trắng cuối cùng vẫn kém tốt mà không được gì cả. Ăn lại ngay bằng dxe5 là cách duy nhất giữ được thế cân bằng quân số mà nước 3.d4 nhắm tới.
                      en: White does not recapture on e5 at once. 4.d5 pushes past and gives up the e5 pawn to Black for good, leaving White with nothing at all to show for the pawn lost on move two. Every other developing or pawn move — Nf3, Nc3, Nd2, Bd2, Be3, Bf4, Bg5, Bh6, Qd2, Qd3, Kd2, Kf2, Na3, Nh3, and pawn moves such as a3, a4, b3, b4, c3, c4, e3, e4, g3, g4, h3, h4 — all leave the e5 pawn standing undefended and available to be captured on some later move anyway, so in every one of these lines White ends up a pawn down for nothing. Recapturing at once with dxe5 is the only way to keep the material balance that 3.d4 was played for.
                      fr: Les Blancs ne reprennent pas en e5 tout de suite. 4.d5 pousse et abandonne définitivement le pion e5 aux Noirs, laissant les Blancs sans la moindre compensation pour le pion perdu au deuxième coup. Tout autre coup de développement ou de pion — Nf3, Nc3, Nd2, Bd2, Be3, Bf4, Bg5, Bh6, Qd2, Qd3, Kd2, Kf2, Na3, Nh3, ou des coups de pions comme a3, a4, b3, b4, c3, c4, e3, e4, g3, g4, h3, h4 — laisse le pion e5 sans défenseur et capturable à tout moment plus tard, si bien que dans chacun de ces cas, les Blancs finissent avec un pion de moins pour rien. Reprendre aussitôt par dxe5 est la seule façon de conserver l'équilibre matériel que 3.d4 cherchait à obtenir.
                  children:
                    - ply: dxe5
                      replyQuality: best
                      frequency: common
                      annotation:
                        vi: Trắng ăn lại bằng tốt d, đúng như nước 3.d4 đã nhắm tới. Đây là cách duy nhất giữ được phần tốt hơn mà không mất thêm gì.
                        en: White recaptures with the d-pawn, exactly what 3.d4 was played for. This is the only way to keep the extra pawn without losing anything else.
                        fr: Les Blancs reprennent avec le pion d, exactement ce pour quoi 3.d4 avait été joué. C'est la seule façon de garder le pion supplémentaire sans rien perdre d'autre.
                      outcome:
                        type: position
                        evaluation:
                          vi: Trắng hơn một tốt, và lần này khác hẳn nhánh chính — con tượng f8 của Đen vẫn còn ở nhà, chưa có nước phát triển nào kèm nhịp, và Trắng chưa hề mất khả năng che chắn cho vua về sau vì con tốt biến mất là con tốt e của Đen bỏ ra từ nước một, chứ không phải một con tốt trước mặt vua Trắng. Đen chỉ còn lại một quân số kém hơn mà không có sự đền bù rõ ràng nào để bám vào, đúng là lý do khiến gambit này bị coi là đáng ngờ một khi Trắng tìm ra 3.d4.
                          en: White is a pawn up, and this time it is very different from the main line — Black's f8 bishop is still at home with no developing move to show for it, and White has not lost any ability to shelter the king later, because the pawn that is missing is the e-pawn Black gave up on move one, not a pawn in front of White's own king. Black is simply left a pawn down with no clear compensation to point to, which is exactly why this gambit is rated dubious once White finds 3.d4.
                          fr: Les Blancs ont un pion de plus, et cette fois c'est très différent de la ligne principale — le fou f8 noir est encore chez lui, sans aucun coup de développement à montrer, et les Blancs n'ont perdu aucune capacité à abriter leur roi plus tard, car le pion manquant est le pion e cédé par les Noirs au premier coup, pas un pion devant leur propre roi. Les Noirs se retrouvent simplement avec un pion de moins et sans compensation claire à quoi se raccrocher, ce qui explique précisément pourquoi ce gambit est jugé douteux une fois que les Blancs trouvent 3.d4.
                        plan:
                          vi: Đen chơi Nf6, Be7 hoặc Bc5, O-O và c5 hoặc Nc6, cố gắng dùng cặp tượng và sự linh hoạt của quân nhẹ để bù lại con tốt đã mất, nhưng phải chấp nhận rằng đây là một cuộc chơi khó khăn hơn hẳn so với khi Trắng ăn ở d6. Trắng chơi Nf3, Bd3 hoặc Bc4, O-O, và đơn giản hoá bằng cách đổi quân khi có thể, vì mỗi lần đổi quân đều làm giảm cơ hội bù đắp của Đen trong khi con tốt thừa vẫn còn nguyên.
                          en: Black plays Nf6, Be7 or Bc5, castles, and c5 or Nc6, trying to use the bishop pair and piece activity to make up for the missing pawn, but has to accept that this is a much harder game than the one after White captures on d6. White plays Nf3, Bd3 or Bc4, castles, and simplifies by trading pieces whenever possible, since every trade reduces Black's chances of compensation while the extra pawn stays on the board.
                          fr: Les Noirs jouent Nf6, Be7 ou Bc5, roquent, puis c5 ou Nc6, en essayant d'utiliser la paire de fous et l'activité des pièces pour compenser le pion manquant, mais doivent admettre que la partie est bien plus difficile qu'après une prise en d6. Les Blancs jouent Nf3, Bd3 ou Bc4, roquent, et simplifient en échangeant les pièces dès que possible, car chaque échange réduit les chances de compensation noires alors que le pion supplémentaire reste sur l'échiquier.
