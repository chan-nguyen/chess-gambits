      annotation:
        vi: Trắng ăn con tốt. Đây là cách kiểm tra gambit một cách trực diện nhất, vì từ chối ăn thì Đen chưa hề mất gì và Trắng cũng chẳng được lợi thêm.
        en: White takes the pawn. This is the most direct way to test the gambit — declining costs Black nothing yet and gives White nothing extra either.
        fr: Les Blancs prennent le pion. C'est la façon la plus directe de tester le gambit — refuser ne coûte encore rien aux Noirs et n'apporte rien de plus aux Blancs.
      children:
        - ply: d6
          annotation:
            vi: Nước đi làm nên Gambit From. Đen không vội lấy lại con tốt bằng cách khác mà chuẩn bị đổi nó lấy nhịp — nếu Trắng ăn ở d6 thì con tượng f8 sẽ ra được ô d6 bằng một nước phát triển nhắm thẳng vào cánh vua.
            en: The move that makes it From's Gambit. Black is in no hurry to win the pawn back some other way, and instead prepares to trade it for tempo — if White captures on d6, the f8 bishop comes out to d6 with a developing move aimed straight at White's kingside.
            fr: Le coup qui fait le Gambit From. Les Noirs ne sont pas pressés de regagner le pion autrement et se préparent au contraire à l'échanger contre un temps de développement — si les Blancs prennent en d6, le fou f8 sort en d6 par un coup de développement braqué droit sur l'aile roi blanche.
          dismissRest:
            reason:
              vi: Trắng không ăn ở d6 và cũng không chơi d4 để đỡ tốt e5. Nước 3.e6 đẩy tốt xuyên qua tuyến phòng ngự nhưng bỏ nó lại một mình giữa bàn cờ, Đen ăn lại dễ dàng bằng fxe6 và có một cấu trúc tốt khoẻ cùng cột f mở y như trong đường chính. Mọi nước còn lại — các nước phát triển như Nf3, Nc3, Na3, Nh3 và Kf2, cùng mọi nước tốt như d3, e3, e4, c3, c4, g3, g4, a3, a4, b3, b4, h3, h4 — đều bỏ mặc con tốt e5 đang bị tốt d6 đánh trực tiếp, nên Đen ăn lại ngay bằng dxe5, lấy lại quân số ngang bằng và giữ nguyên thế phát triển thoải mái.
              en: White neither captures on d6 nor plays d4 to support the e5 pawn. 3.e6 pushes the pawn through the defensive line but leaves it alone in the middle of the board, and Black recaptures comfortably with fxe6, getting a healthy pawn structure and the same open f-file the main line offers. Everything else — developing moves such as Nf3, Nc3, Na3, Nh3 and Kf2, and every pawn move such as d3, e3, e4, c3, c4, g3, g4, a3, a4, b3, b4, h3, h4 — simply abandons the e5 pawn to the attack of the d6 pawn, so Black recaptures at once with dxe5, restores material equality and keeps a comfortable, effortless development.
              fr: Les Blancs ne prennent pas en d6 et ne jouent pas non plus d4 pour soutenir le pion e5. 3.e6 pousse le pion à travers la ligne de défense mais le laisse seul au milieu de l'échiquier, et les Noirs reprennent facilement par fxe6, obtenant une structure de pions saine et la même colonne f ouverte que dans la ligne principale. Tout le reste — les coups de développement comme Nf3, Nc3, Na3, Nh3 et Kf2, et tous les coups de pions comme d3, e3, e4, c3, c4, g3, g4, a3, a4, b3, b4, h3, h4 — abandonne simplement le pion e5 à l'attaque du pion d6, si bien que les Noirs reprennent aussitôt par dxe5, rétablissent l'égalité matérielle et gardent un développement confortable et sans effort.
          children:
            - ply: exd6
