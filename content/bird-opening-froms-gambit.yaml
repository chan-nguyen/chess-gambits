# Bird Opening: From's Gambit. Frozen defining line 1.f4 e5, which ends on Black's own
# ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
#
# No mate is claimed anywhere in this entry: every leaf below is an assessment (ADR-0005).
# The danger around White's missing f-pawn after 2.fxe5 d6 3.exd6 Bxd6 is real, but nothing
# in either branch modelled here is a forced mate, and none was invented to make the story
# tidier.
id: bird-opening-froms-gambit
name: "Bird Opening: From's Gambit"
eco: A02
category: gambit
side: black
definingLine: [f4, e5]
soundness:
  value: dubious
  reviewedAt: '2026-09-18'
  basis:
    by: chan
    at: '2026-09-18'
    source: >-
      A genuine, respected surprise weapon rather than a curiosity — it has been played by
      strong players as a practical try, and it is dangerous if White simply grabs pawns
      without care. But White has a clear antidote in 3.d4, holding the extra pawn while
      denying Black the f8 bishop's developing recapture that makes the main line dangerous;
      without that recapture Black is just a pawn down with nothing concrete to point to.
      That is enough to keep the label at dubious rather than sound. No engine was consulted
      and no database was queried.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen đáp lại Khai cuộc Bird bằng chính một gambit khác, thí ngay con tốt e vừa tiến lên. Đây là Gambit From, một phản gambit hiếm khi được Trắng chuẩn bị kỹ, và nếu Trắng ăn tốt một cách vô tư thì Đen sẽ đổi con tốt đó lấy một nhịp phát triển lớn và một cuộc tấn công thẳng vào cánh vua Trắng.
    en: Black meets the Bird's Opening with a gambit of its own, immediately offering the e-pawn that has just advanced. This is From's Gambit, a countergambit White rarely prepares for, and if White simply takes the pawn, Black trades it for a large lead in development and a direct attack on White's kingside.
    fr: Les Noirs répondent à l'Ouverture Bird par un gambit de leur côté, offrant aussitôt le pion qui vient d'avancer. C'est le Gambit From, un contre-gambit que les Blancs préparent rarement, et si les Blancs se contentent de prendre le pion, les Noirs l'échangent contre une grosse avance de développement et une attaque directe sur l'aile roi blanche.
  dismissRest:
    reason:
      vi: Trắng không ăn tốt e5 ngay. Nước 2.f5 chỉ đẩy qua mà không ăn gì, con tốt e5 của Đen vẫn đứng nguyên và Đen được một nhịp miễn phí. Các nước phát triển hay đi tốt khác — a3, a4, b3, b4, c3, c4, d3, d4, e3, e4, g3, g4, h3, h4, Na3, Nc3, Kf2, Nf3, Nh3 — cũng đều bỏ qua cơ hội ăn tốt ngay lập tức; ván cờ sẽ sớm quay lại thế bình thường của Khai cuộc Bird một khi Trắng ăn tốt ở một nước sau, và cho tới lúc đó Đen chưa hề mất gì vì chưa có gì bị hy sinh cả.
      en: White does not take the e5 pawn at once. 2.f5 simply pushes past without capturing, so Black's e5 pawn stays exactly where it is and Black gets a free move. Every other developing or pawn move — a3, a4, b3, b4, c3, c4, d3, d4, e3, e4, g3, g4, h3, h4, Na3, Nc3, Kf2, Nf3, Nh3 — likewise passes up the immediate capture; the game simply returns to an ordinary Bird's Opening once White does capture on some later move, and until then Black has lost nothing, because nothing has actually been sacrificed yet.
      fr: Les Blancs ne prennent pas le pion e5 tout de suite. 2.f5 avance simplement sans prendre, si bien que le pion e5 noir reste exactement où il est et les Noirs gagnent un coup gratuit. Tout autre coup de développement ou de pion — a3, a4, b3, b4, c3, c4, d3, d4, e3, e4, g3, g4, h3, h4, Na3, Nc3, Kf2, Nf3, Nh3 — renonce lui aussi à la prise immédiate ; la partie redevient simplement une Ouverture Bird ordinaire dès que les Blancs prennent à un coup ultérieur, et jusque-là les Noirs n'ont rien perdu, puisque rien n'a réellement été sacrifié.
