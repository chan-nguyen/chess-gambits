                      annotation:
                        vi: Trắng phát triển mã ra f3, nước tự nhiên nhất trên bàn cờ — nó canh giữ ô h2, ngăn Đen ăn hoặc chiếu ngay ở đó. Nhưng con mã ở f3 không hề đứng trên đường chéo d6-h2 của con tượng; đường chéo ấy hoàn toàn thông thoáng và ô g3 trên đó, khác với h2, chưa hề có ai canh giữ. Từ #127, kiểm tra lại bằng chess.js cho thấy đây chính là chỗ hở mà sách vở gọi là "Bẫy Lasker" của Gambit From.
                        en: White develops the knight to f3, the most natural move on the board — it guards h2, stopping Black from capturing or checking there at once. But the knight on f3 does not actually sit on the bishop's d6-h2 diagonal; that diagonal is completely open, and the g3 square on it, unlike h2, is not guarded by anything yet. From #127, replaying this with chess.js confirms this is exactly the gap the literature calls From's Gambit's "Lasker trap".
                        fr: Les Blancs développent le cavalier en f3, le coup le plus naturel de l'échiquier — il garde h2, empêchant les Noirs d'y capturer ou d'y faire échec immédiatement. Mais le cavalier en f3 ne se trouve pas réellement sur la diagonale d6-h2 du fou ; cette diagonale est totalement dégagée, et la case g3 qui s'y trouve, contrairement à h2, n'est encore gardée par rien. D'après le #127, rejouer cette position avec chess.js confirme qu'il s'agit exactement de la faille que la littérature appelle le « piège Lasker » du Gambit From.
