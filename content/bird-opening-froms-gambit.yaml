                        en: White develops the knight to c3, an ordinary move with nothing to do with the h-file or the g3 square.
                        fr: Les Blancs développent le cavalier en c3, un coup ordinaire n'ayant rien à voir avec la colonne h ou la case g3.
                      outcome:
                        type: position
                        evaluation:
                          vi: Trắng hơn một tốt, nhưng con tốt f đã biến mất hoàn toàn khỏi bàn cờ, nghĩa là một khi vua Trắng nhập thành ngắn thì không còn con tốt nào có thể đứng lại che chắn ở f2 hay hỗ trợ g3 nữa. Con tượng d6 đã nhắm sẵn vào đường chéo tới h2, hậu Đen có thể ra h4 để hỏi thẳng ô f2 và g3, còn mọi quân nhẹ và hậu của Trắng vẫn còn nguyên ở hàng một. Một tốt là một tốt, nhưng ở đây nó là cái giá của một cuộc tấn công có thật chứ không phải một lời hứa suông.
                          en: White is a pawn up, but the f-pawn has vanished from the board entirely, which means that once White's king castles short there is no pawn left that can ever stand on f2 again to shelter it or support g3. The bishop on d6 already points down the diagonal towards h2, the queen can swing to h4 to question f2 and g3 directly, and every one of White's minor pieces and the queen are still sitting on the back rank. A pawn is a pawn, but here it is the price of a real attack rather than an empty promise.
                          fr: Les Blancs ont un pion de plus, mais le pion f a complètement disparu de l'échiquier, ce qui signifie qu'une fois les Blancs roqués du petit côté, plus aucun pion ne pourra jamais se tenir en f2 pour l'abriter ou soutenir g3. Le fou en d6 vise déjà la diagonale menant à h2, la dame peut se rendre en h4 pour interroger directement f2 et g3, et toutes les pièces mineures et la dame des Blancs sont encore sur la rangée de départ. Un pion reste un pion, mais ici c'est le prix d'une attaque bien réelle, non d'une simple promesse.
                        plan:
                          vi: Đen chơi Nf6 rồi O-O, Qe7 hoặc Nc6, và tìm thời điểm cho Ng4 hay Qh4 để ép f2 và g3 trong khi Trắng còn chưa kịp phát triển xong. Nếu Trắng nhập thành ngắn một cách vội vàng thì g3 và f2 là chỗ để nhắm vào; nếu Trắng nhập thành dài thì Đen chuyển hướng sang cánh hậu bằng a5 và b5. Trắng nên chơi Nf3 sớm để che ô h2 và ô g4 hoặc che nước Qh4, tránh nhập thành ngắn cho tới khi phát triển xong, và tìm cách đổi bớt quân nhẹ của Đen — nhất là con tượng d6 — để giảm sức ép trước khi tính đến việc thu hồi con tốt đã bỏ ra. Nhưng như nhánh 4.Nf3 dưới đây cho thấy, riêng nước Nf3 vẫn chưa đủ — con tốt h2 mới thực sự là quân canh giữ ô g3.
                          en: Black plays Nf6, then castles, Qe7 or Nc6, and looks for a moment for Ng4 or Qh4 to press f2 and g3 while White is still behind in development. If White castles short too quickly, g3 and f2 are the squares to aim at; if White castles long, Black switches to the queenside with a5 and b5. White should play Nf3 early to cover h2 and g4 or to guard against Qh4, avoid castling short until fully developed, and look to trade off Black's minor pieces — especially the bishop on d6 — to ease the pressure before thinking about winning the pawn back. But as the 4.Nf3 branch below shows, Nf3 by itself is not enough — the h2 pawn is what actually guards g3.
                          fr: Les Noirs jouent Nf6, puis roquent, Qe7 ou Nc6, et cherchent le bon moment pour Ng4 ou Qh4 afin de peser sur f2 et g3 pendant que les Blancs sont encore en retard de développement. Si les Blancs roquent du petit côté trop vite, g3 et f2 sont les cases à viser ; s'ils roquent du grand côté, les Noirs basculent à l'aile dame avec a5 et b5. Les Blancs devraient jouer Nf3 tôt pour couvrir h2 et g4 ou pour se prémunir contre Qh4, éviter de roquer du petit côté tant qu'ils ne sont pas développés, et chercher à échanger les pièces mineures noires — en particulier le fou en d6 — pour soulager la pression avant de songer à regagner le pion cédé. Mais comme le montre la branche 4.Nf3 ci-dessous, Nf3 seul ne suffit pas — c'est le pion h2 qui garde réellement la case g3.
