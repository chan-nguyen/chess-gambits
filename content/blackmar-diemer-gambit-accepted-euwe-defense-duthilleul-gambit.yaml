tree:
  annotation:
    vi: Trắng vừa chơi 6.Bd3, nhắm tượng vào h7, vốn được xe và mã bảo vệ. Tượng cũng đứng chắn trước hậu trên cột d, nên tốt d4 chỉ còn mã f3 bảo vệ trong khi hậu Đen tấn công nó.
    en: White has just played 6.Bd3, aiming the bishop at h7, which the rook and the knight defend. The bishop also stands in front of the queen on the d-file, so the pawn on d4 is defended only by the knight on f3 while Black's queen attacks it.
    fr: "Les Blancs viennent de jouer 6.Bd3, dirigeant le fou vers h7, que la tour et le cavalier défendent. Le fou se place aussi devant la dame sur la colonne d : le pion d4 n'est donc défendu que par le cavalier f3 tandis que la dame noire l'attaque."
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 6...c5. Bài này chỉ đi theo nhánh 6...c5; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 6...c5 here. This entry follows the reply 6...c5 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 6...c5. Cette fiche ne suit que la réponse 6...c5 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: c5
      replyQuality: good
      frequency: common
      annotation:
        vi: 'Đen đánh vào tốt d4 bằng 6...c5: tốt này giờ bị hậu và tốt c5 tấn công hai lần mà chỉ có mã f3 bảo vệ một lần.'
        en: 'Black strikes at the d4 pawn with 6...c5: it is now attacked twice, by the queen and the c5 pawn, and defended once, by the knight on f3.'
        fr: 'Les Noirs attaquent le pion d4 par 6...c5 : il est désormais attaqué deux fois, par la dame et le pion c5, et défendu une fois, par le cavalier f3.'
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng sáu, Đen bảy, nên Trắng kém một tốt. Tốt d4 bị hậu và tốt c5 tấn công hai lần mà chỉ có mã f3 bảo vệ một lần, vì tượng d3 chắn đường của hậu. Tượng d3 vẫn nhắm vào h7, được xe h8 và mã f6 bảo vệ.'
          en: "Count the pawns: White six, Black seven, so White is a pawn down. The d4 pawn is attacked twice, by the queen and the c5 pawn, and defended once, by the knight on f3, because the bishop on d3 blocks the queen's line. The bishop still aims at h7, which the rook on h8 and the knight on f6 defend."
          fr: 'Comptez les pions : six pour les Blancs, sept pour les Noirs ; les Blancs sont donc un pion en moins. Le pion d4 est attaqué deux fois, par la dame et le pion c5, et défendu une fois, par le cavalier f3, car le fou d3 bloque la ligne de la dame. Le fou vise toujours h7, que la tour h8 et le cavalier f6 défendent.'
        plan:
          vi: Trắng thêm quân bảo vệ d4 bằng Be3 hoặc giải tỏa căng thẳng bằng dxc5, trong khi tượng d3 vẫn nhắm vào h7. Đen thêm quân tấn công bằng ...Nc6 hoặc ăn thẳng bằng ...cxd4.
          en: White adds a defender to d4 with Be3 or releases the tension with dxc5, while the bishop on d3 keeps eyeing h7. Black adds another attacker with ...Nc6 or simply takes with ...cxd4.
          fr: Les Blancs ajoutent un défenseur à d4 par Be3 ou relâchent la tension par dxc5, tandis que le fou d3 continue de viser h7. Les Noirs ajoutent un attaquant par ...Nc6 ou prennent simplement par ...cxd4.
