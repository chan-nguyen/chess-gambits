tree:
  annotation:
    vi: Cả hai vua đều đã nhập thành ngắn và Trắng vừa chơi 8.Kh1. Trắng không còn tốt e hay tốt f, nên các cột e và f là cột nửa mở cho quân Trắng; tượng c4 nhắm vào f7, được xe và vua bảo vệ.
    en: Both kings have castled short and White has just played 8.Kh1. White has no e- or f-pawn, so the e- and f-files are half open for White's pieces; the bishop on c4 eyes f7, which the rook and the king defend.
    fr: Les deux rois ont roqué et les Blancs viennent de jouer 8.Kh1. Les Blancs n'ont plus de pion e ni de pion f, si bien que les colonnes e et f sont semi-ouvertes pour leurs pièces ; le fou c4 vise f7, que la tour et le roi défendent.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 8...Nc6. Bài này chỉ đi theo nhánh 8...Nc6; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 8...Nc6 here. This entry follows 8...Nc6 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 8...Nc6. Cette fiche ne suit que 8...Nc6 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Nc6
      replyQuality: good
      frequency: common
      annotation:
        vi: 'Đen phát triển bằng 8...Nc6, tấn công tốt d4 lần thứ hai: tốt này giờ bị hậu và mã tấn công, và được mã f3 cùng hậu d1 bảo vệ.'
        en: 'Black develops with 8...Nc6, attacking the d4 pawn a second time: it is now attacked by the queen and the knight, and defended by the knight on f3 and the queen on d1.'
        fr: 'Les Noirs se développent par 8...Nc6, attaquant le pion d4 une seconde fois : il est désormais attaqué par la dame et le cavalier, et défendu par le cavalier f3 et la dame d1.'
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng sáu, Đen bảy, nên Trắng kém một tốt. Trắng không còn tốt ở cột e và f nên hai cột này nửa mở cho quân Trắng, và tượng c4 nhắm vào f7, được xe f8 và vua g8 bảo vệ. Cả hai vua đã nhập thành nên không bên nào còn quyền nhập thành.'
          en: "Count the pawns: White six, Black seven, so White is a pawn down. White has no pawn on the e- or f-file, so both files are half open for White's pieces, and the bishop on c4 bears on f7, which the rook on f8 and the king on g8 defend. Both kings have already castled, so neither side has any castling right left."
          fr: "Comptez les pions : six pour les Blancs, sept pour les Noirs ; les Blancs sont donc un pion en moins. Les Blancs n'ont aucun pion sur les colonnes e et f, qui sont donc semi-ouvertes pour leurs pièces, et le fou c4 vise f7, que la tour f8 et le roi g8 défendent. Les deux rois ont déjà roqué : aucun camp n'a plus de droit de roque."
        plan:
          vi: Trắng đưa thêm quân sang cánh vua bằng Bg5 hoặc Ne5, cố tận dụng các cột nửa mở trước khi Đen phát triển xong. Đen hoàn tất phát triển bằng ...Bg4 hoặc ...Bf5 và tìm cách đổi quân trong khi giữ tốt thừa.
          en: White brings more pieces to the kingside with Bg5 or Ne5, trying to use the half-open files before Black finishes developing. Black completes development with ...Bg4 or ...Bf5 and aims to trade pieces while holding the extra pawn.
          fr: Les Blancs amènent davantage de pièces sur l'aile roi par Bg5 ou Ne5, cherchant à exploiter les colonnes semi-ouvertes avant que les Noirs n'aient fini de se développer. Les Noirs achèvent leur développement par ...Bg4 ou ...Bf5 et cherchent à échanger les pièces en gardant le pion en plus.
