# Dutch Defense: Staunton Gambit. Frozen defining line 1.d4 f5 2.e4, which ends on White's
# own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). Replayed with
# chess.js through 2...e6: Black declines the pawn and closes the centre instead, sidestepping
# every trick the accepted lines are built around. Nothing is hanging at the resulting
# position. searchMate at 4 moves from this position returns no-mate, so no forced mate is
# claimed anywhere in this entry.
id: dutch-defense-staunton-gambit
name: 'Dutch Defense: Staunton Gambit'
eco: A82
category: gambit
side: white
definingLine: [d4, f5, e4]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. White offers the e-pawn to rip open the diagonal to h5 and the f-file
      before Black's king finds cover, real compensation that is not proven to outweigh a
      clean pawn against accurate defence. No engine was consulted and no database was
      queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
