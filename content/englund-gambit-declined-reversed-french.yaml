tree:
  annotation:
    vi: Đen mời Trắng ăn tốt e5 ngay từ nước đầu tiên. Ở đây Trắng chơi 2.e3, mở đường chéo cho tượng f1 và chuẩn bị ăn tốt e5 bằng dxe5 vào nước sau, gợi nhớ đến một thế Phòng thủ Pháp đảo màu và dư một nhịp.
    en: Black offers the e5 pawn as early as the first reply. Here White plays 2.e3, opening the diagonal for the f1 bishop and preparing to take on e5 with dxe5 next move, echoing a French Defense structure with colours reversed and a spare tempo.
    fr: Les Noirs offrent le pion e5 dès la première réponse. Ici, les Blancs jouent 2.e3, ouvrant la diagonale du fou f1 et préparant à prendre en e5 par dxe5 au coup suivant, rappelant une structure de Défense française avec les couleurs inversées et un temps de plus.
  dismissRest:
    reason:
      vi: Trắng không chơi 2.e3. Ăn tốt bằng 2.dxe5 dẫn vào các nhánh Englund Gambit đã được chấp nhận, còn 2.Nf3 hay 2.d5 từ chối theo cách khác, mỗi cách có trang riêng của nó.
      en: White does not play 2.e3. Taking the pawn with 2.dxe5 leads into the accepted Englund Gambit branches, while 2.Nf3 or 2.d5 decline in a different way, each with its own page.
      fr: Les Blancs ne jouent pas 2.e3. Prendre le pion par 2.dxe5 mène vers les branches acceptées du Gambit Englund, tandis que 2.Nf3 ou 2.d5 refusent d'une autre façon, chacun avec sa propre page.
  children:
    - ply: e3
      replyQuality: good
      frequency: rare
      annotation:
        vi: Trắng chơi một nước tốt khiêm tốn, mở đường cho tượng f1 và để dành việc ăn tốt e5 cho nước sau, không cần vội vàng vì con tốt ấy chưa đi đâu được.
        en: White plays a modest pawn move, opening a line for the f1 bishop and saving the capture on e5 for next move, with no need to hurry since that pawn is not going anywhere.
        fr: Les Blancs jouent un modeste coup de pion, ouvrant une ligne pour le fou f1 et gardant la prise en e5 pour le coup suivant, sans devoir se presser puisque ce pion ne va nulle part.
      outcome:
        type: position
        evaluation:
          vi: Quân số ngang nhau, tám tốt mỗi bên, và con tốt e5 vẫn còn nguyên trên bàn cờ. Trắng đã mở đường cho tượng f1 và sẵn sàng ăn tốt bất cứ lúc nào bằng dxe5, còn Đen phải quyết định ngay giữa việc đỡ tốt hay đẩy tiếp trước khi bị ăn.
          en: Material is level, eight pawns each, and the e5 pawn is still on the board. White has opened a line for the f1 bishop and is ready to take the pawn at any moment with dxe5, while Black must decide at once between defending it or pushing on before it is taken.
          fr: Le matériel est égal, huit pions de chaque côté, et le pion e5 est toujours sur l'échiquier. Les Blancs ont ouvert une ligne pour le fou f1 et sont prêts à prendre le pion à tout moment par dxe5, tandis que les Noirs doivent trancher aussitôt entre le défendre ou pousser avant qu'il ne soit pris.
        plan:
          vi: Đen chơi Nc6 và d6 để đỡ chắc con tốt, hoặc e4 đẩy tiếp để tránh bị ăn, rồi Nf6 và Be7 hoàn tất phát triển. Trắng chơi dxe5 nếu Đen bỏ mặc con tốt, hoặc Bd3 và Nf3 nếu Đen giữ được nó, rồi c4 và Nc3 để chiếm không gian.
          en: Black plays ...Nc6 and ...d6 to defend the pawn firmly, or ...e4 to push on and avoid being taken, then ...Nf6 and ...Be7 to finish developing. White plays dxe5 if Black neglects the pawn, or Bd3 and Nf3 if Black holds onto it, then c4 and Nc3 for space.
          fr: Les Noirs jouent ...Nc6 et ...d6 pour défendre fermement le pion, ou ...e4 pour pousser et éviter d'être pris, puis ...Nf6 et ...Be7 pour achever leur développement. Les Blancs jouent dxe5 si les Noirs négligent le pion, ou Bd3 et Nf3 s'ils le conservent, puis c4 et Nc3 pour l'espace.
        basis:
          by: chan
          at: '2026-09-25'
