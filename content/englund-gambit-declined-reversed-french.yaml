    source: >-
      A judgement. A quiet pawn move that simply prepares to take on e5 next, echoing a
      French Defense structure with colours reversed and a spare tempo, is at least as safe
      for White as the ordinary accepted lines. No engine was consulted and no database was
      queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
