# Englund Gambit Declined: Reversed French. Frozen defining line 1.d4 e5, which ends on
# Black's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). Replayed
# with chess.js through 2.e3: White simply supports a future dxe5 while opening the diagonal
# for the f1 bishop. Nothing is hanging at the resulting position. searchMate at 4 moves
# from this position returns no-mate, so no forced mate is claimed anywhere in this entry.
id: englund-gambit-declined-reversed-french
name: 'Englund Gambit Declined: Reversed French'
eco: A40
category: gambit
side: black
definingLine: [d4, e5]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
