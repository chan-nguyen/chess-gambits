tree:
  annotation:
    vi:
      Qua thứ tự nước đi 4.Bc4 Nf6, Trắng chơi 5.d4, hiến con tốt trung tâm để mở đường cho quân và đe
      doạ trực tiếp vào e5 cùng f7.
    en:
      Via the move order 4.Bc4 Nf6, White plays 5.d4, offering the central pawn to open lines for the
      pieces and threaten e5 and f7 directly.
    fr:
      Par l'ordre de coups 4.Bc4 Nf6, les Blancs jouent 5.d4, offrant le pion central pour ouvrir des
      lignes à leurs pièces et menacer directement e5 et f7.
  dismissRest:
    reason:
      vi:
        Đen chơi nước khác ngoài exd4, ví dụ Bb4+ hay Nxe4 ngay. Đánh giá chung thay đổi theo lựa chọn,
        nhưng ý tưởng của Trắng — mở trung tâm lấy phát triển — luôn giữ nguyên.
      en: Black plays something other than exd4, for instance Bb4+ or Nxe4 right away. The overall
        assessment shifts with the choice, but White's idea — opening the centre for development —
        stays the same.
      fr: Les Noirs jouent autre chose que exd4, par exemple Bb4+ ou Nxe4 directement. L'évaluation
        générale varie selon le choix, mais l'idée des Blancs — ouvrir le centre contre du
        développement — reste la même.
  children:
    - ply: exd4
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen ăn tốt d4, nhận lời thí và đi vào Scotch Gambit qua đường Hai Mã.
        en: Black takes the d4 pawn, accepting the gambit reached through the Two Knights move order.
        fr: Les Noirs prennent le pion d4, acceptant le gambit atteint par l'ordre de coups des Deux
          Cavaliers.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 7 còn Đen 8 — Đen hơn đúng một tốt sạch.
          en: Count the pawns and it is 7 for White against 8 for Black — Black is up one clean pawn.
          fr:
            "Comptez les pions : 7 pour les Blancs contre 8 pour les Noirs — les Noirs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng chơi e5 đuổi mã f6 hoặc O-O trước, tranh thủ nhịp độ để đe doạ f7. Đen chơi Nxe4 hoặc d5,
            thí lại hoặc phản kích trung tâm để giữ thăng bằng.
          en:
            White plays e5 to chase the knight on f6, or castles first, using the tempo to threaten f7.
            Black plays Nxe4 or d5, giving material back or striking the centre to keep the balance.
          fr:
            Les Blancs jouent e5 pour chasser le cavalier f6, ou roquent d'abord, utilisant le temps gagné
            pour menacer f7. Les Noirs jouent Nxe4 ou d5, rendant du matériel ou frappant le centre
            pour garder l'équilibre.
        basis:
          by: chan
          at: 2026-09-29
