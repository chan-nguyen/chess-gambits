tree:
  annotation:
    vi:
      Thay vì ăn lại tốt d4 ngay bằng Nxd4, Trắng chơi 5.Bc4, hiến con tốt để phát triển nhanh và nhắm
      vào f7.
    en:
      Instead of recapturing the d4 pawn at once with Nxd4, White plays 5.Bc4, giving up the pawn to
      develop quickly and eye f7.
    fr:
      Au lieu de reprendre immédiatement le pion d4 par Nxd4, les Blancs jouent 5.Bc4, cédant le pion
      pour se développer rapidement et viser f7.
  dismissRest:
    reason:
      vi:
        Đen chơi nước khác ngoài Bc5, ví dụ Nf6 trả lại tốt ngay hoặc Bb4+. Đánh giá chung thay đổi theo
        lựa chọn, nhưng đây luôn là câu hỏi giữ tốt hay trả lại đổi lấy phát triển.
      en:
        Black plays something other than Bc5, for instance Nf6 giving the pawn straight back, or Bb4+.
        The overall assessment shifts with the choice, but it is always the same question of keeping
        the pawn or giving it back for development.
      fr: Les Noirs jouent autre chose que Bc5, par exemple Nf6 rendant aussitôt le pion, ou Bb4+.
        L'évaluation générale varie selon le choix, mais il s'agit toujours de garder le pion ou de
        le rendre contre du développement.
  children:
    - ply: Bc5
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen phát triển tượng lên c5, chấp nhận giữ con tốt d4 thay vì trả lại ngay bằng Nf6.
        en:
          Black develops the bishop to c5, opting to keep the d4 pawn rather than giving it straight back
          with Nf6.
        fr:
          Les Noirs développent le fou en c5, choisissant de garder le pion d4 plutôt que de le rendre
          aussitôt par Nf6.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 7 còn Đen 8 — Đen hơn đúng một tốt sạch.
          en: Count the pawns and it is 7 for White against 8 for Black — Black is up one clean pawn.
          fr:
            "Comptez les pions : 7 pour les Blancs contre 8 pour les Noirs — les Noirs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng chơi c3 hoặc Ng5 tuỳ ý, nhắm ăn lại tốt d4 hoặc tấn công trực tiếp vào f7 trong lúc Đen
            chưa nhập thành. Đen chơi Nf6 hoặc d6, hoàn thiện phát triển và cố giữ con tốt thừa.
          en:
            White plays c3 or Ng5 depending on taste, aiming to win the d4 pawn back or to attack f7
            directly while Black has not castled yet. Black plays Nf6 or d6, finishing development
            and trying to hold the extra pawn.
          fr:
            Les Blancs jouent c3 ou Ng5 selon les goûts, cherchant à regagner le pion d4 ou à attaquer
            directement f7 tant que les Noirs n'ont pas roqué. Les Noirs jouent Nf6 ou d6, achevant
            leur développement et tentant de garder le pion supplémentaire.
        basis:
