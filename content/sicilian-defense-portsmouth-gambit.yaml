# Sicilian Defense: Portsmouth Gambit. Frozen defining line 1.e4 c5 2.Nf3 Nc6 3.b4, which ends
# on White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
id: sicilian-defense-portsmouth-gambit
name: 'Sicilian Defense: Portsmouth Gambit'
eco: B30
category: gambit
side: white
definingLine: [e4, c5, Nf3, Nc6, b4]
soundness:
  value: unsound
  reviewedAt: '2026-09-18'
  basis:
