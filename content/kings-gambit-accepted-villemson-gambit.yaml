# King's Gambit Accepted, Villemson Gambit: 1.e4 e5 2.f4 exf4 3.d4. Every ply below was
# replayed with chess.js before being written (see docs/CONTEXT.md, invariant 1). The leaf
# is a decisive stop under the #107 bar: a clean extra pawn plus a king permanently stuck
# on e2 with BOTH the d2 and f2 squares bare of any pawn shield.
id: kings-gambit-accepted-villemson-gambit
name: Villemson Gambit
eco: C33
category: gambit
side: white
definingLine: [e4, e5, f4, exf4, d4]
soundness:
  value: unsound
  reviewedAt: '2026-09-18'
  basis:
    by: chan
    at: '2026-09-18'
    source: >-
      A judgement. 3.d4 grabs the centre but pushes the d-pawn away from its king at the
      exact moment 3...Qh4+ is about to force that king from e1 — the resulting king walk
      is even more exposed than in sister lines that do not touch the d-pawn. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng chơi 3.d4, chiếm trung tâm rộng rãi nhưng lại đẩy tốt d đi xa khỏi vua đúng vào lúc Đen sắp buộc vua phải rời khỏi e1.
    en: White plays 3.d4, grabbing a broad centre but pushing the d-pawn away from its own king at the exact moment Black is about to force that king off e1.
    fr: Les Blancs jouent 3.d4, s'emparant d'un large centre mais éloignant le pion d de leur propre roi juste au moment où les Noirs s'apprêtent à forcer ce roi à quitter e1.
  dismissRest:
    reason:
      vi: Đen chơi một nước phát triển khác thay vì chiếu ngay. Bất kỳ nước nào cũng giữ nguyên một tốt hơn cho Đen, nhưng 3...Qh4+ là cách trực tiếp nhất buộc vua Trắng phải rời vị trí ban đầu ngay khi tốt d đã rời khỏi hàng ngang thứ hai.
      en: Black plays some other developing move instead of checking at once. Any of them keeps Black's extra pawn intact, but 3...Qh4+ is the most direct way to force White's king from its starting square right while the d-pawn has already left the second rank.
      fr: Les Noirs jouent un autre coup de développement au lieu de mettre en échec immédiatement. Chacun d'eux conserve le pion supplémentaire des Noirs, mais 3...Qh4+ est le moyen le plus direct de forcer le roi blanc à quitter sa case de départ juste au moment où le pion d a déjà quitté la deuxième rangée.
  children:
    - ply: Qh4+
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen chiếu ngay bằng Qh4+. Trắng có ba lựa chọn — 4.g3 mất thêm một tốt nữa sau fxg3, còn 4.Kd2 sẽ dính chiếu Bb4+ ngay sau đó. 4.Ke2 là lựa chọn thực dụng nhất, tránh mất thêm quân.
        en: Black checks at once with Qh4+. White has three options — 4.g3 drops a further pawn to fxg3, while 4.Kd2 runs straight into a further check with Bb4+. 4.Ke2 is the most practical choice, avoiding any further material loss.
        fr: Les Noirs mettent en échec immédiatement par Qh4+. Les Blancs ont trois options — 4.g3 cède un pion supplémentaire après fxg3, tandis que 4.Kd2 se heurte aussitôt à un nouvel échec par Bb4+. 4.Ke2 est le choix le plus pragmatique, évitant toute perte de matériel supplémentaire.
      children:
        - ply: Ke2
          annotation:
            vi: Trắng buộc phải đi Ke2, tránh mất thêm tốt nhưng từ bỏ quyền nhập thành vĩnh viễn. Vì tốt d đã tiến lên d4, cả hai ô d2 lẫn f2 quanh vua đều trống — vua Trắng còn lộ hơn cả những nhánh khác trong lô này, nơi ít nhất tốt d vẫn còn tại chỗ.
            en: White is forced into Ke2, avoiding a further pawn loss but giving up castling for good. Because the d-pawn has already advanced to d4, both the d2 and f2 squares around the king are empty — White's king is even more exposed than in sister lines in this batch where the d-pawn at least stayed put.
            fr: Les Blancs sont contraints de jouer Ke2, évitant une perte de pion supplémentaire mais abandonnant le roque pour de bon. Le pion d ayant déjà avancé en d4, les cases d2 et f2 autour du roi sont toutes deux vides — le roi blanc est encore plus exposé que dans les variantes sœurs de ce lot où le pion d restait au moins en place.
          dismissRest:
            reason:
              vi: Đen chơi một nước khác thay vì giữ lại con tốt f4 bằng g5. Bất kỳ lựa chọn nào cũng để lại vị trí tương tự có lợi cho Đen, nhưng 4...g5 là cách đơn giản nhất để khóa chặt cả hai lợi thế mà không mở thêm đường cho quân Trắng.
              en: Black plays something other than locking in the f4 pawn with g5. Any choice leaves a broadly similar position in Black's favour, but 4...g5 is the simplest way to lock in both advantages without opening any more lines for White's pieces.
              fr: Les Noirs jouent autre chose que de verrouiller le pion f4 par g5. Tout autre choix laisse une position globalement semblable en faveur des Noirs, mais 4...g5 est le moyen le plus simple de verrouiller les deux avantages sans ouvrir davantage de lignes pour les pièces blanches.
          children:
            - ply: g5
              replyQuality: best
              frequency: common
              annotation:
                vi: Đen củng cố con tốt f4 bằng g5, khóa chặt cấu trúc tốt cánh vua. Thế cờ giờ đã ổn định hoàn toàn có lợi cho Đen.
                en: Black shores up the f4 pawn with g5, locking the kingside pawn structure. The position is now fully settled in Black's favour.
                fr: Les Noirs consolident le pion f4 par g5, verrouillant la structure de pions à l'aile roi. La position est désormais pleinement stabilisée en faveur des Noirs.
              outcome:
                type: position
                evaluation:
                  vi: Đen hơn đúng một tốt (f4, được g5 bảo vệ vĩnh viễn) mà không có bù đắp nào cho Trắng. Vua Trắng đứng tại e2 — mất quyền nhập thành vĩnh viễn — với cả hai ô d2 và f2 hai bên đều hoàn toàn trống, không một tốt nào che chắn ở đó.
                  en: Black is a clean pawn up (the f4 pawn, permanently guarded by g5) with no compensation for White at all. White's king stands on e2 — castling gone for good — with both the d2 and f2 squares on either side of it completely bare of any pawn.
                  fr: Les Noirs ont un pion d'avance net (le pion f4, défendu à jamais par g5) sans la moindre compensation pour les Blancs. Le roi blanc se tient en e2 — le roque perdu pour de bon — avec les cases d2 et f2, de part et d'autre, totalement vides de tout pion.
                plan:
                  vi: Đen phát triển bình thường với Nc6, Nf6, Bb4 hoặc Bg7 sau khi chơi thêm d6, nhắm quân vào vua Trắng đang mắc kẹt và lộ liễu ở giữa bàn cờ, và không có gì phải vội vì lợi thế đã vững chắc và lâu dài.
                  en: Black develops normally with Nc6, Nf6, and Bb4 or a Bg7 fianchetto after a further d6, aiming pieces at White's exposed, stranded king in the middle of the board, with nothing to rush since the advantage is solid and lasting.
                  fr: Les Noirs se développent normalement par Nc6, Nf6, et Bb4 ou un fianchetto Bg7 après un futur d6, en dirigeant leurs pièces vers le roi blanc exposé et bloqué au milieu de l'échiquier, sans rien à précipiter puisque l'avantage est solide et durable.
                basis:
                  by: chan
                  at: '2026-09-18'
