# Budapest Gambit Accepted: Fajarowicz Defense, Steiner Variation. Frozen defining line
# 1.d4 Nf6 2.c4 e5 3.dxe5 Ne4, which ends on Black's own ply, so the root is an opponent
# node (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 4.Qc2: White develops
# the queen to hit the e4 knight directly. Nothing is hanging at the resulting position.
# searchMate at 4 moves from this position returns no-mate, so no forced mate is claimed
# anywhere in this entry.
id: budapest-gambit-accepted-fajarowicz-defense-steiner-variation
name: 'Budapest Gambit Accepted: Fajarowicz Defense, Steiner Variation'
eco: A51
category: gambit
