tree:
  annotation:
    vi: Trắng vừa chơi 5.Nd5, tấn công hậu f6 và tốt c7, vốn không có quân bảo vệ. Hậu g4 của Trắng tấn công tốt g7 và d7. Vật chất cân bằng, mỗi bên tám tốt.
    en: White has just played 5.Nd5, attacking the queen on f6 and the pawn on c7, which has no defender. White's queen on g4 attacks the pawns on g7 and d7. Material is level, with eight pawns each.
    fr: Les Blancs viennent de jouer 5.Nd5, attaquant la dame f6 et le pion c7, qui n'a aucun défenseur. La dame blanche g4 attaque les pions g7 et d7. Le matériel est égal, huit pions de chaque côté.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 5...Qxf2+. Bài này chỉ đi theo nhánh ăn tốt có chiếu 5...Qxf2+; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 5...Qxf2+ here. This entry follows the capture with check 5...Qxf2+ only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 5...Qxf2+. Cette fiche ne suit que la prise avec échec 5...Qxf2+ ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Qxf2+
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen ăn tốt f2 bằng hậu, 5...Qxf2+, vừa thoát khỏi đòn của mã vừa chiếu. Hậu được tượng c5 bảo vệ nên vua không ăn được; Trắng chỉ còn nước đi Kd1.
        en: Black takes the f2 pawn with the queen, 5...Qxf2+, which steps out of the knight's attack with check. The queen is defended by the bishop on c5, so the king cannot take it; White has only one legal move, Kd1.
        fr: "Les Noirs prennent le pion f2 avec la dame, 5...Qxf2+, ce qui l'enlève à l'attaque du cavalier avec échec. La dame est défendue par le fou c5 : le roi ne peut pas la prendre ; les Blancs n'ont qu'un seul coup légal, Kd1."
      children:
        - ply: Kd1
          annotation:
            vi: Trắng chỉ còn nước đi 6.Kd1, mất quyền nhập thành. Mã d5 vẫn tấn công c7 và hậu g4 vẫn tấn công g7.
            en: White's only move is 6.Kd1, which costs the right to castle. The knight on d5 still attacks c7 and the queen on g4 still attacks g7.
            fr: Le seul coup des Blancs est 6.Kd1, qui coûte le droit de roquer. Le cavalier d5 attaque toujours c7 et la dame g4 attaque toujours g7.
          outcome:
            type: position
            evaluation:
              vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt, và vua Trắng ở d1 đã mất quyền nhập thành. Hai tốt Đen không có quân bảo vệ: c7 bị mã d5 tấn công và g7 bị hậu g4 tấn công. Nxc7+ sẽ là nước chiếu đồng thời tấn công xe a8.'
              en: 'Count the pawns: White seven, Black eight, so White is a pawn down, and the king on d1 has lost the right to castle. Two Black pawns have no defender: c7 is attacked by the knight on d5 and g7 by the queen on g4. Nxc7+ would be a check that also attacks the rook on a8.'
              fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins, et le roi en d1 a perdu le droit de roquer. Deux pions noirs n'ont aucun défenseur : c7 est attaqué par le cavalier d5 et g7 par la dame g4. Nxc7+ serait un échec qui attaquerait aussi la tour a8."
            plan:
              vi: 'Trắng nhắm tới Nxc7+ và Qxg7. Đen phải đối phó với cả hai: ...Kd8 tránh đòn chiếu của mã nhưng Qxg7 vẫn là nước ăn không ai ăn lại được, còn ...Qf6 bảo vệ g7 nhưng Nxc7+ vẫn là nước ăn không ai ăn lại được.'
              en: "White is aiming at Nxc7+ and Qxg7. Black has to meet both: ...Kd8 steps out of the knight's check, but Qxg7 is then a capture nothing can recapture, while ...Qf6 defends g7, but Nxc7+ is then a capture nothing can recapture."
              fr: "Les Blancs visent Nxc7+ et Qxg7. Les Noirs doivent parer les deux : ...Kd8 évite l'échec du cavalier, mais Qxg7 est alors une prise que rien ne peut reprendre, tandis que ...Qf6 défend g7, mais Nxc7+ est alors une prise que rien ne peut reprendre."
            basis:
              by: chan
              at: '2026-09-30'
