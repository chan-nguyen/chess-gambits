tree:
  annotation:
    vi:
      Sau khi Trắng thí tốt f4 rồi chơi d4, Đen chiếu bằng Qh4+ buộc vua Trắng phải tự đi Ke2 — vị trí
      vua kỳ lạ nhưng nổi tiếng của toàn bộ Steinitz Gambit.
    en:
      After White sacrifices the f4 pawn and plays d4, Black checks with Qh4+, forcing the White king
      to walk to e2 by hand — the odd but famous king position of the whole Steinitz Gambit.
    fr: Après le sacrifice du pion f4 par les Blancs et le coup d4, les Noirs font échec par Qh4+,
      forçant le roi blanc à marcher lui-même en e2 — la position de roi étrange mais célèbre de
      tout le Gambit Steinitz.
  dismissRest:
    reason:
      vi:
        'Đen chọn cách phòng thủ khác ở đây. Đánh giá chung không đổi: Trắng kém một tốt và vua đã mất
        quyền nhập thành, đổi lại có trung tâm rộng và ý định dùng chính con vua ấy che chắn, bất kể
        Đen chọn cách phòng thủ nào.'
      en:
        'Black chooses a different defence here. The overall assessment does not change: White is down a
        pawn and has lost the right to castle, in exchange for a broad centre and the plan of using
        that very king as a shield, whichever defence Black picks.'
      fr:
        "Les Noirs choisissent ici une autre défense. L'évaluation générale ne change pas : les Blancs
        sont à un pion de moins et ont perdu le droit de roquer, en échange d'un centre large et du
        projet d'utiliser ce roi même comme bouclier, quelle que soit la défense choisie par les
        Noirs."
  children:
    - ply: g5
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Đen chơi g5 theo lối Sörensen, bảo vệ chắc tốt f4 đã ăn được và mở đường chéo cho tượng f8.
        en:
          Black plays g5 in Sörensen style, firmly holding on to the captured f4 pawn and opening the
          diagonal for the bishop on f8.
        fr:
          Les Noirs jouent g5 à la manière Sörensen, tenant fermement le pion f4 capturé et ouvrant la
          diagonale du fou f8.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 7 còn Đen 8 — Đen hơn đúng một tốt sạch.
          en: Count the pawns and it is 7 for White against 8 for Black — Black is up one clean pawn.
          fr:
            "Comptez les pions : 7 pour les Blancs contre 8 pour les Noirs — les Noirs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng chơi Nf3 đuổi hậu và Bxf4 lấy lại tốt, chấp nhận vua đứng giữa bàn để đổi lấy trung tâm
            rộng và phát triển nhanh. Đen hoàn thiện phát triển và tìm cách mở đường tấn công thẳng
            vào vị trí vua bất thường ấy.
          en:
            White plays Nf3 to chase the queen and Bxf4 to win the pawn back, accepting a king stuck in the
            centre in exchange for a broad centre and quick development. Black finishes developing
            and looks to open lines straight at that unusual king position.
          fr:
            Les Blancs jouent Nf3 pour chasser la dame et Bxf4 pour regagner le pion, acceptant un roi resté
            au centre en échange d'un centre large et d'un développement rapide. Les Noirs achèvent
            leur développement et cherchent à ouvrir des lignes droit vers cette position de roi
            inhabituelle.
        basis:
          by: chan
          at: 2026-09-29
