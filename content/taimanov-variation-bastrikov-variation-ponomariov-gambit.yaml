# Sicilian Defense: Taimanov Variation, Bastrikov Variation, Ponomariov Gambit. Frozen defining line
# 1.e4 c5 2.Nf3 e6 3.d4 cxd4 4.Nxd4 Nc6 5.Nc3 Qc7 6.Ndb5 Qb8 7.Be3 a6 8.Bb6, which ends on White's own
# ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). Replayed with chess.js through
# 8...axb5 9.Nxb5. The leaf has Black to move, but every capture open to Black there is answered by a
# recapture. searchMate at 3 moves from the resulting position returns no-mate, so no forced mate is
# claimed anywhere in this entry.
