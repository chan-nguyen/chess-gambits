                            - ply: Nxc3
                              replyQuality: best
                              frequency: occasional
                              annotation:
                                vi: Trắng ăn lại bằng mã, và đây là nước đúng trong số những nước đã thua. Nó tránh được chiếu bí, nhưng nó đưa con mã ra khỏi b1 và con xe a1 thì lập tức trơ trọi.
                                en: White recaptures with the knight, which is the right move among losing ones. It avoids the mate, but it takes the knight off b1 and leaves the rook on a1 completely bare.
                                fr: Les Blancs reprennent avec le cavalier, ce qui est le bon coup parmi des coups perdants. Cela évite le mat, mais retire le cavalier de b1 et laisse la tour a1 entièrement à nu.
                              outcome:
                                type: position
                                evaluation:
                                  vi: Quân số ngang nhau, nhưng chỉ trong đúng một nước. Con hậu Đen ở b2 đang đánh con xe a1 mà không quân nào đỡ, và lần này Qxa1 còn là nước chiếu, vì hậu Trắng đã rời d1. Sau 8...Qxa1+ 9.Qd1 Qxd1+ 10.Kxd1 thì Đen hơn hẳn một con xe. Đây là kết cục tốt nhất mà Trắng còn có sau nước 7.Qd2.
                                  en: Material is level, but only for one move. Black's queen on b2 attacks the rook on a1 and nothing defends it, and this time ...Qxa1 comes with check, because the white queen has left d1. After 8...Qxa1+ 9.Qd1 Qxd1+ 10.Kxd1 Black is a whole rook up. This is the best outcome still available to White after 7.Qd2.
                                  fr: Le matériel est égal, mais pour un coup seulement. La dame noire en b2 attaque la tour a1 que rien ne défend, et cette fois ...Qxa1 arrive avec échec, car la dame blanche a quitté d1. Après 8...Qxa1+ 9.Qd1 Qxd1+ 10.Kxd1, les Noirs ont une tour entière de plus. C'est le meilleur résultat qui reste aux Blancs après 7.Qd2.
                                plan:
                                  vi: Đen chơi Qxa1+ ngay, đổi hậu nếu Trắng mời, rồi Nxe5 hoặc d6 để lấy lại con tốt và phát triển nốt với Nf6, Be7 và O-O. Với một con xe hơn thì kế hoạch là đổi hết quân và không làm gì phức tạp. Trắng chỉ còn cách giữ hậu trên bàn cờ và tìm cơ hội quấy rối, nhưng thế cờ đã hỏng từ nước thứ bảy.
                                  en: Black plays ...Qxa1+ at once, trades queens if White offers, then takes the pawn back with ...Nxe5 or ...d6 and finishes developing with ...Nf6, ...Be7 and ...O-O. A rook up, the plan is to trade everything and do nothing clever. White's only try is to keep the queens on and hope for harassment, but the position was ruined on move seven.
                                  fr: Les Noirs jouent ...Qxa1+ aussitôt, échangent les dames si les Blancs le proposent, puis reprennent le pion par ...Nxe5 ou ...d6 et achèvent leur développement par ...Nf6, ...Be7 et ...O-O. Avec une tour de plus, le plan est de tout échanger et de ne rien tenter d'astucieux. Le seul espoir blanc est de garder les dames et de harceler, mais la position est perdue depuis le septième coup.
                                basis:
                                  by: chan
                                  at: '2026-09-17'
                    - ply: Bxb4
