              frequency: occasional
              annotation:
                vi: Trắng phát triển mã và đó là nước đúng. Con xe a1 bây giờ vẫn chưa ai đỡ, nhưng ô b1 đã trống, nên nếu Đen chơi Qxa1 thì Qxa1 ăn lại con hậu ngay. Con tượng thì ở yên tại d2 và không bao giờ tới c3.
                en: White develops the knight, and this is the move. The rook on a1 is still undefended, but b1 is now empty, so if Black plays ...Qxa1 then Qxa1 simply takes the queen. The bishop stays on d2 and never goes to c3.
                fr: Les Blancs développent le cavalier, et c'est le bon coup. La tour a1 reste sans défense, mais b1 est désormais vide, si bien que si les Noirs jouent ...Qxa1, Qxa1 reprend simplement la dame. Le fou reste en d2 et ne va jamais en c3.
              children:
                - ply: Bb4
                  annotation:
                    vi: Đen ghim con mã c3 và giữ con hậu ở b2 thêm một chút. Đây là nhánh chính của cả khai cuộc, và nó là chỗ mà Englund kết thúc một cách tỉnh táo chứ không phải bằng một nước chiếu bí.
                    en: Black pins the knight on c3 and keeps the queen on b2 a little longer. This is the main line of the whole opening, and it is where the Englund ends soberly rather than with a mate.
                    fr: Les Noirs clouent le cavalier c3 et maintiennent la dame en b2 un peu plus longtemps. C'est la ligne principale de toute l'ouverture, et c'est là que l'Englund se termine sobrement plutôt que par un mat.
                  outcome:
                    type: position
                    evaluation:
                      vi: Quân số ngang nhau, vì con tốt b2 của Đen bù lại con tốt e5 mà Trắng ăn ở nước hai. Vấn đề của Đen là con hậu, nó đứng ở b2 và không có đường về dễ dàng. Trắng chơi 7.Rb1 đuổi nó, con hậu phải đi a3 và ở đó nó đứng ngoài cuộc chơi trong nhiều nước. Trắng phát triển nhanh hơn, vua an toàn hơn, và đây chính là lý do Englund bị gọi là không vững.
                      en: Material is level, because Black's capture on b2 balances the e5 pawn White took on move two. Black's problem is the queen — it sits on b2 with no easy route home. White plays 7.Rb1 to chase it, the queen has to go to a3, and there it is out of the game for several moves. White develops faster, the white king is safer, and this is precisely why the Englund is called unsound.
                      fr: Le matériel est égal, car la prise noire en b2 compense le pion e5 pris par les Blancs au deuxième coup. Le problème des Noirs est la dame, posée en b2 sans chemin facile pour rentrer. Les Blancs jouent 7.Rb1 pour la chasser, la dame doit aller en a3, et elle y reste hors jeu plusieurs coups. Les Blancs se développent plus vite, leur roi est plus sûr, et c'est précisément pourquoi l'Englund est dit incorrect.
                    plan:
                      vi: Đen phải tìm đường về cho con hậu, nghĩa là Qa3 sau Rb1 rồi Qa5 hoặc Qb6 khi có dịp, và trong lúc đó chơi Nxe5 hay Qxe5 để lấy lại tốt, rồi Nf6, d6 và O-O càng nhanh càng tốt. Trắng chơi Rb1 đuổi hậu, rồi Nd5 hoặc a3 để hỏi con tượng b4, e3, Be2 và O-O, và tìm cách nhốt con hậu ở a3 bằng Rb3 với Nd5. Nếu Trắng bắt được con hậu thì ván cờ kết thúc, còn nếu không thì Trắng vẫn đứng dễ chịu hơn.
                      en: Black has to find a road home for the queen — ...Qa3 after Rb1, and then ...Qa5 or ...Qb6 when the chance comes — and meanwhile recover the pawn with ...Nxe5 or ...Qxe5 and play ...Nf6, ...d6 and ...O-O as quickly as possible. White plays Rb1 to chase the queen, then Nd5 or a3 to question the bishop on b4, e3, Be2 and castles, and looks to shut the queen in on a3 with Rb3 and Nd5. If White catches the queen the game is over; if not, White is still the more comfortable side.
                      fr: Les Noirs doivent trouver un chemin de retour pour la dame — ...Qa3 après Rb1, puis ...Qa5 ou ...Qb6 dès que possible — et entre-temps récupérer le pion par ...Nxe5 ou ...Qxe5 et jouer ...Nf6, ...d6 et ...O-O au plus vite. Les Blancs jouent Rb1 pour chasser la dame, puis Nd5 ou a3 pour interroger le fou b4, e3, Be2 et roquent, en cherchant à enfermer la dame en a3 par Rb3 et Nd5. Si les Blancs attrapent la dame, la partie est finie ; sinon, ils restent le camp le plus à l'aise.
                    basis:
                      by: chan
                      at: '2026-09-17'
    - ply: Qd2
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Trắng chắn bằng hậu và mời đổi luôn. Đây là cách chơi thực dụng, vì không có hậu thì không có đột kích nào cả, và Đen mất luôn thứ duy nhất khai cuộc này có.
        en: White blocks with the queen and offers the trade straight away. It is the practical approach — with no queens there is no raid, and Black loses the only thing this opening has.
        fr: Les Blancs bloquent avec la dame et proposent aussitôt l'échange. C'est l'approche pratique — sans dames, pas de raid, et les Noirs perdent la seule chose que possède cette ouverture.
      children:
        - ply: Qxb2
          annotation:
            vi: Đen vẫn ăn con tốt b2 chứ không đổi hậu, vì đổi hậu là thừa nhận đã hỏng. Con xe a1 lại một lần nữa không ai đỡ, và đó là điều Trắng phải xử lý ngay.
            en: Black takes the b2 pawn rather than trading queens, because trading is an admission that the opening has failed. Once again the rook on a1 has no defender, and that is what White has to deal with immediately.
            fr: Les Noirs prennent le pion b2 plutôt que d'échanger les dames, car échanger reviendrait à reconnaître l'échec de l'ouverture. De nouveau la tour a1 n'a aucun défenseur, et c'est ce dont les Blancs doivent s'occuper immédiatement.
          outcome:
            type: position
            evaluation:
              vi: Quân số ngang nhau. Con xe a1 đang bị hậu b2 đánh và không ai đỡ, nên Trắng chỉ có đúng một nước thoải mái, đó là 6.Qc3, vừa đánh con hậu vừa mời đổi. Sau 6...Qxc3+ 7.Nxc3 thì hậu rời bàn cờ, cánh hậu của Trắng yên ổn, và thế cờ cân bằng với cấu trúc lành cho cả hai. Điều Trắng không được làm là chơi một nước chậm, vì Qxa1 đang chờ.
              en: Material is level. The rook on a1 is attacked by the queen on b2 and defended by nothing, so White has exactly one comfortable move — 6.Qc3, which attacks the queen and offers the trade. After 6...Qxc3+ 7.Nxc3 the queens are off, White's queenside is safe and the position is level with a sound structure for both sides. What White must not do is play something slow, because ...Qxa1 is waiting.
              fr: Le matériel est égal. La tour a1 est attaquée par la dame b2 et défendue par rien, si bien que les Blancs n'ont qu'un coup confortable — 6.Qc3, qui attaque la dame et propose l'échange. Après 6...Qxc3+ 7.Nxc3, les dames quittent l'échiquier, l'aile dame blanche est en sûreté et la position est égale avec une structure saine des deux côtés. Ce que les Blancs ne doivent pas faire, c'est jouer lentement, car ...Qxa1 attend.
            plan:
              vi: Đen tránh đổi hậu nếu còn tránh được, chơi Qb6 hoặc Qc3+ tuỳ thế, rồi Nxe5 lấy lại tốt, Nf6, d6, Be7 và O-O. Nếu buộc phải đổi hậu thì tàn cuộc cân bằng và đó vẫn là kết quả chấp nhận được cho một khai cuộc thí tốt. Trắng chơi Qc3 ngay, đổi hậu, rồi Nc3 hoặc Nbd2, e3, Be2 và O-O, và về sau dùng cột b nửa mở cùng đôi tượng nếu còn.
              en: Black avoids the queen trade while that is still possible, playing ...Qb6 or ...Qc3+ as the position allows, then recovers the pawn with ...Nxe5 and plays ...Nf6, ...d6, ...Be7 and ...O-O. If the trade is forced, the endgame is level, which is still an acceptable result for a pawn sacrifice. White plays Qc3 at once, trades queens, then Nc3 or Nbd2, e3, Be2 and castles, and later uses the half-open b-file and the bishop pair if it survives.
              fr: Les Noirs évitent l'échange des dames tant que c'est possible, en jouant ...Qb6 ou ...Qc3+ selon la position, puis récupèrent le pion par ...Nxe5 et jouent ...Nf6, ...d6, ...Be7 et ...O-O. Si l'échange est forcé, la finale est égale, ce qui reste acceptable pour un sacrifice de pion. Les Blancs jouent Qc3 tout de suite, échangent les dames, puis Nc3 ou Nbd2, e3, Be2 et roquent, et exploitent ensuite la colonne b semi-ouverte et la paire de fous si elle subsiste.
            basis:
              by: chan
              at: '2026-09-17'
    - ply: Nbd2
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Trắng chắn bằng con mã cánh hậu. Nước này có một ưu điểm cụ thể mà hai nước kia không có, đó là ô b1 được dọn trống cho con xe.
        en: White blocks with the queenside knight. This has one concrete point the other blocks do not — it clears b1 for the rook.
        fr: Les Blancs bloquent avec le cavalier de l'aile dame. Cela présente un avantage concret que les autres interpositions n'ont pas — la case b1 est dégagée pour la tour.
      children:
        - ply: Qxb2
          annotation:
            vi: Đen ăn con tốt b2 như thường lệ. Lần này con hậu sẽ bị đuổi ngay bằng Rb1, vì con mã đã rời b1, nên cuộc đột kích ngắn hơn hẳn.
            en: Black takes on b2 as usual. This time the queen will be chased at once by Rb1, because the knight has left b1, so the raid is a good deal shorter.
            fr: Les Noirs prennent en b2 comme d'habitude. Cette fois la dame sera chassée aussitôt par Rb1, puisque le cavalier a quitté b1, si bien que le raid est nettement plus court.
          outcome:
            type: position
            evaluation:
              vi: Quân số ngang nhau. Con xe a1 không ai đỡ, nhưng chính vì con mã đã rời b1 mà Trắng có nước 6.Rb1, vừa đuổi con hậu vừa đưa xe ra cột nửa mở. Đó là lý do nước chắn này hợp lý. Con hậu Đen sẽ phải đi và mỗi nước hậu đi là một nhịp cho Trắng. Thế cờ cân bằng về vật chất và dễ chơi hơn cho Trắng.
              en: Material is level. The rook on a1 has no defender, but precisely because the knight has left b1 White has 6.Rb1, which chases the queen and puts the rook on a half-open file in the same move. That is what justifies this block. Black's queen has to move and every queen move is a tempo for White. Materially balanced, easier to play for White.
              fr: Le matériel est égal. La tour a1 n'a aucun défenseur, mais c'est justement parce que le cavalier a quitté b1 que les Blancs disposent de 6.Rb1, qui chasse la dame et place la tour sur une colonne semi-ouverte dans le même coup. C'est ce qui justifie cette interposition. La dame noire doit bouger, et chaque coup de dame est un temps pour les Blancs. Matériellement équilibré, plus facile à jouer pour les Blancs.
            plan:
              vi: Đen chơi Qc3 hoặc Qa3 khi bị đuổi, tìm đường đưa hậu về qua a5 hoặc b6, đồng thời Nxe5 để lấy lại tốt rồi Nf6, d6 và O-O. Đừng để hậu bị nhốt. Trắng chơi Rb1 đuổi hậu, rồi e3, Be2, O-O và Rb3 hoặc Nb3 để tiếp tục quấy con hậu, và dùng nhịp thừa để chiếm trung tâm bằng c4 hay e4.
              en: Black plays ...Qc3 or ...Qa3 when chased, looks for a way home via a5 or b6, and meanwhile takes the pawn back with ...Nxe5 and plays ...Nf6, ...d6 and ...O-O. The queen must not get shut in. White plays Rb1 to chase the queen, then e3, Be2, O-O and Rb3 or Nb3 to keep harassing it, and uses the spare tempi to take the centre with c4 or e4.
              fr: Les Noirs jouent ...Qc3 ou ...Qa3 quand ils sont chassés, cherchent un retour par a5 ou b6, et entre-temps reprennent le pion par ...Nxe5 puis jouent ...Nf6, ...d6 et ...O-O. La dame ne doit pas se faire enfermer. Les Blancs jouent Rb1 pour chasser la dame, puis e3, Be2, O-O et Rb3 ou Nb3 pour continuer de la harceler, et emploient les temps gagnés à prendre le centre par c4 ou e4.
            basis:
              by: chan
              at: '2026-09-17'
