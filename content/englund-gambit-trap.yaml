                      annotation:
                        vi: Trắng đổi con tượng đi thay vì cố giữ nó. Đây là cách xử lý đúng, vì nó xoá cả con tượng đang bị đánh hai lần lẫn cái ghim sắp tới trên đường chéo b4-e1.
                        en: White exchanges the bishop off instead of trying to hold it. This is the correct handling, because it removes both the twice-attacked bishop and the pin that was about to appear on the b4-e1 diagonal.
                        fr: Les Blancs échangent le fou au lieu de chercher à le conserver. C'est le traitement correct, car il supprime à la fois le fou attaqué deux fois et le clouage qui s'annonçait sur la diagonale b4-e1.
                      children:
                        - ply: Nxb4
                          annotation:
                            vi: Đen ăn lại bằng mã. Con mã ở b4 nhắm vào c2 và a2, và con hậu b2 vẫn đang đánh xe a1 cùng mã b1. Cả cánh hậu của Trắng đang dính vào nhau và Trắng phải gỡ nó ra.
                            en: Black recaptures with the knight. On b4 it eyes c2 and a2, and the queen on b2 is still attacking the rook on a1 and the knight on b1. White's entire queenside is tangled and has to be untangled.
                            fr: Les Noirs reprennent avec le cavalier. En b4 il vise c2 et a2, et la dame b2 attaque toujours la tour a1 et le cavalier b1. Toute l'aile dame blanche est emmêlée et doit être démêlée.
                          outcome:
                            type: position
                            evaluation:
                              vi: Quân số ngang nhau. Đen đã đổi mất con tượng đen ô nhưng con hậu vẫn ở b2 và con xe a1 vẫn không ai đỡ, còn mã b4 thì thêm một mũi nhắm vào c2. Trắng phải mất ít nhất một nhịp để gỡ, đơn giản nhất là 8.Nc3, vì sau đó 8...Qxa1 mất hậu do 9.Qxa1. Khi Trắng gỡ xong thì phần phát triển nhiều hơn của Trắng mới có tiếng nói. Thế cờ cân bằng, nhưng Trắng có nhiều cách đi sai hơn.
                              en: Material is level. Black has traded off the dark-squared bishop but the queen is still on b2, the rook on a1 is still undefended, and the knight on b4 adds a hit on c2. White has to spend at least a move untangling, most simply with 8.Nc3, after which 8...Qxa1 loses the queen to 9.Qxa1. Once White is untangled the extra development starts to count. The position is balanced, but White has more ways to go wrong.
                              fr: Le matériel est égal. Les Noirs ont échangé le fou de cases noires mais la dame est toujours en b2, la tour a1 toujours sans défense, et le cavalier b4 ajoute une frappe sur c2. Les Blancs doivent consacrer au moins un coup à se démêler, le plus simplement par 8.Nc3, après quoi 8...Qxa1 perd la dame après 9.Qxa1. Une fois démêlés, leur avance de développement commence à compter. La position est équilibrée, mais les Blancs ont plus de façons de se tromper.
                            plan:
                              vi: Đen chơi Qc3+ hoặc Qb6 để rút hậu về an toàn đúng lúc, rồi Nxe5 hay Qxe5 lấy lại con tốt và phát triển với Nf6, d6 và O-O. Đừng để con hậu bị nhốt ở góc. Trắng chơi Nc3 để đỡ a1, rồi Rb1 đuổi hậu, e3, Be2 và O-O, và sau khi con hậu Đen phải rút thì Trắng hơn về phát triển với cấu trúc lành.
                              en: Black plays ...Qc3+ or ...Qb6 to get the queen back to safety at the right moment, then ...Nxe5 or ...Qxe5 to recover the pawn and develops with ...Nf6, ...d6 and ...O-O. The one thing to avoid is letting the queen be shut in the corner. White plays Nc3 to cover a1, then Rb1 to chase the queen, e3, Be2 and castles, and once the black queen has had to retreat White is ahead in development with a sound structure.
                              fr: Les Noirs jouent ...Qc3+ ou ...Qb6 pour ramener la dame en sécurité au bon moment, puis ...Nxe5 ou ...Qxe5 pour reprendre le pion et se développent par ...Nf6, ...d6 et ...O-O. La seule chose à éviter est de laisser la dame enfermée dans le coin. Les Blancs jouent Nc3 pour couvrir a1, puis Rb1 pour chasser la dame, e3, Be2 et roquent, et une fois la dame noire contrainte de reculer, les Blancs sont en avance de développement avec une structure saine.
