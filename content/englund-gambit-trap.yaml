                                en: White recaptures with the queen and restores the material. This is the losing move, and what follows is proved by machine rather than asserted by a person.
                                fr: Les Blancs reprennent avec la dame et rétablissent le matériel. C'est le coup perdant, et la suite est prouvée par la machine plutôt qu'affirmée par un humain.
                              outcome:
