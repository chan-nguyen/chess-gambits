# The Englund Gambit Trap. The defining line is the one the catalogue has frozen for this id
# — 1.d4 e5 2.dxe5 Nc6 3.Nf3 Qe7 4.Bf4 Qb4+ — and it ends on Black's own ply, so the root is
# an opponent node and White's losing recapture can carry `blunder` (invariant 5).
#
# ECO is A40 and category is `trap`, which is what `tools/catalogue/source/traps.yaml`
# records. The mate after 8.Qxc3 is claimed with `type: trap` and nothing else; the move
# count, the line and the certificate come from `npm run prove:mates` and are replayed by
# `npm run verify:mates` (ADR-0005). Every other line here was replayed with chess.js.
id: englund-gambit-trap
name: Englund Gambit Trap
eco: A40
category: trap
side: black
definingLine: [d4, e5, dxe5, Nc6, Nf3, Qe7, Bf4, 'Qb4+']
soundness:
  value: unsound
  reviewedAt: '2026-09-17'
  basis:
    by: chan
    at: '2026-09-17'
    source: >-
      A judgement, and the same label `traps.yaml` carries. It is about the Englund Gambit
      that produces the position, not about the trap springing — after 5.Bd2 Qxb2 6.Nc3
      White is simply a pawn up with the better game, and Black's queen is stranded. The
      mate itself is not a judgement; it is proved. No engine was consulted and no database
      was queried.
judgement:
  by: chan
  at: '2026-09-17'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date. The mate is not — it is machine-proved and replayed by CI.
tree:
  counts:
    legal: { count: legalReplies, expect: 6 }
  annotation:
    vi: Đen vừa chiếu ở b4 và Trắng chỉ có {legal} nước hợp lệ, tất cả đều là chắn. Nước chiếu này không phải để ăn con tốt e5 mà để ăn con tốt b2, và quan trọng hơn là để dụ con tượng Trắng đi tới c3. Nếu tượng đến c3 thì cả một lưới chiếu bí xuất hiện chỉ sau bốn nước nữa.
    en: Black has just checked on b4 and White has exactly {legal} legal answers, all of them blocks. The check is not about the e5 pawn but about the b2 pawn, and more than that about luring White's bishop to c3. If the bishop goes there, a whole mating net appears four moves later.
    fr: Les Noirs viennent de faire échec en b4 et les Blancs n'ont que {legal} réponses légales, toutes des interpositions. Cet échec ne vise pas le pion e5 mais le pion b2, et surtout il cherche à attirer le fou blanc en c3. Si le fou s'y rend, tout un filet de mat apparaît quatre coups plus tard.
  dismissRest:
    reason:
      vi: Trắng chắn chiếu bằng một trong ba cách còn lại. Nước 5.c3 chắn và đánh luôn con hậu b4, đó là cách gọn gàng nhất. Nước 5.Nc3 chắn bằng một quân mà con tốt b2 đỡ, nên Qxc3 chỉ mất hậu sau bxc3. Nước 5.Nfd2 chắn bằng chính con mã vừa phát triển và đi lùi một nhịp. Trong cả ba trường hợp con tượng Trắng không bao giờ tới c3, nên lưới chiếu bí bên dưới không hình thành, và Đen chỉ còn một ván Englund bình thường, kém một tốt.
      en: White blocks the check in one of the other three ways. 5.c3 blocks and attacks the queen on b4 at the same time, which is the tidiest of them. 5.Nc3 blocks with a piece the b2 pawn defends, so ...Qxc3 merely loses the queen to bxc3. 5.Nfd2 blocks with the knight that had just developed and takes a step backwards. In all three cases White's bishop never reaches c3, so the mating net below never forms, and Black is left with an ordinary Englund, a pawn down.
      fr: Les Blancs parent l'échec de l'une des trois autres façons. 5.c3 bloque et attaque en même temps la dame en b4, ce qui est le plus net. 5.Nc3 bloque avec une pièce que le pion b2 défend, si bien que ...Qxc3 ne fait que perdre la dame après bxc3. 5.Nfd2 bloque avec le cavalier qui venait de se développer et recule d'un pas. Dans les trois cas, le fou blanc n'atteint jamais c3, le filet de mat ci-dessous ne se forme pas, et les Noirs se retrouvent avec un Englund ordinaire, un pion de moins.
  children:
    - ply: Bd2
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng chắn bằng tượng, và đây là nước tự nhiên nhất vì nó giữ con tốt b2 được một quân đỡ và không làm hỏng cấu trúc. Nó cũng là nước đưa con tượng tới gần ô c3, tức là đúng chỗ Đen muốn nó tới.
        en: White blocks with the bishop, which is the most natural answer because it keeps a defender near b2 and spoils no pawns. It is also the move that brings the bishop within one step of c3, which is exactly where Black wants it.
        fr: Les Blancs bloquent avec le fou, la réponse la plus naturelle car elle garde un défenseur près de b2 et n'abîme aucun pion. C'est aussi le coup qui amène le fou à un pas de c3, précisément là où les Noirs le veulent.
      children:
        - ply: Qxb2
          annotation:
            vi: Hậu ăn con tốt b2 và lao vào góc bàn cờ. Từ b2 nó đánh xe a1 và mã b1 cùng lúc, và con xe a1 thì không ai đỡ. Đây là nước làm cho cả gambit có lý do tồn tại, dù về khách quan nó vẫn không đủ.
            en: The queen takes on b2 and dives into the corner. From b2 it attacks the rook on a1 and the knight on b1 at once, and the rook on a1 has no defender. This is the move that gives the whole gambit a reason to exist, even though objectively it is still not enough.
            fr: La dame prend en b2 et plonge dans le coin. De b2 elle attaque à la fois la tour a1 et le cavalier b1, et la tour a1 n'a aucun défenseur. C'est le coup qui donne au gambit entier sa raison d'être, même s'il reste objectivement insuffisant.
          dismissRest:
            reason:
              vi: Trắng chơi một nước khác, và gần như nước nào cũng mất con xe a1. Con hậu Đen đã nhắm vào nó và không quân nào đỡ, nên 6.e3, 6.e4 hay 6.Qc1 đều bị 6...Qxa1, và vì con mã vẫn còn ở b1 nên hậu Trắng không tới được góc để trừng phạt. Hai nước thật sự giữ được a1 là 6.Bc1, tức là trả con tượng về chỗ cũ, và 6.Na3. Nước duy nhất giải quyết vấn đề một cách đàng hoàng là 6.Nc3 ở dưới, vì sau đó 6...Qxa1 mất hậu vì 7.Qxa1.
              en: White plays something else, and nearly all of it drops the rook on a1. Black's queen already attacks it and nothing defends it, so 6.e3, 6.e4 and 6.Qc1 are all met by 6...Qxa1 — and with the knight still on b1 White's queen cannot reach the corner to punish it. The two moves that really do hold a1 are 6.Bc1, putting the bishop back where it started, and 6.Na3. The only move that solves the problem properly is 6.Nc3 below, after which 6...Qxa1 loses the queen to 7.Qxa1.
              fr: Les Blancs jouent autre chose, et presque tout perd la tour a1. La dame noire l'attaque déjà et rien ne la défend, si bien que 6.e3, 6.e4 et 6.Qc1 se heurtent tous à 6...Qxa1 — et, le cavalier étant encore en b1, la dame blanche ne peut atteindre le coin pour punir. Les deux coups qui tiennent réellement a1 sont 6.Bc1, qui remet le fou à son point de départ, et 6.Na3. Le seul coup qui règle vraiment le problème est 6.Nc3 ci-dessous, après quoi 6...Qxa1 perd la dame après 7.Qxa1.
          children:
            - ply: Bc3
              replyQuality: mistake
              frequency: common
              annotation:
                vi: Trắng đuổi con hậu bằng tượng và đồng thời đỡ con xe a1. Nhìn thì hợp lý đến mức khó tin là nó sai. Vấn đề là con tượng ở c3 chỉ có mã b1 đỡ, và Đen có đúng một nước để khai thác chuyện đó.
                en: White chases the queen with the bishop and defends the rook on a1 at the same time. It looks so reasonable that it is hard to believe it is wrong. The problem is that the bishop on c3 has only the knight on b1 defending it, and Black has exactly one move that exploits that.
                fr: Les Blancs chassent la dame avec le fou tout en défendant la tour a1. Cela paraît si raisonnable qu'on peine à croire que ce soit une erreur. L'ennui est que le fou c3 n'a que le cavalier b1 pour le défendre, et les Noirs disposent d'un coup exactement pour en profiter.
              children:
                - ply: Bb4
                  annotation:
                    vi: Đen đưa con tượng ra và đánh con tượng c3 lần thứ hai. Bây giờ c3 bị đánh hai lần, bởi tượng b4 và hậu b2, mà chỉ được đỡ một lần bởi mã b1. Con hậu Đen không hề chạy, nó chỉ đứng yên và gọi thêm quân.
                    en: Black develops the bishop and attacks the one on c3 a second time. Now c3 is attacked twice, by the bishop on b4 and the queen on b2, and defended once, by the knight on b1. Black's queen has not run anywhere; it has stood still and called for help.
                    fr: Les Noirs développent le fou et attaquent une seconde fois celui de c3. Désormais c3 est attaquée deux fois, par le fou b4 et la dame b2, et défendue une seule, par le cavalier b1. La dame noire n'a pas fui, elle est restée en place et a appelé du renfort.
                  dismissRest:
                    reason:
                      vi: Trắng chơi một nước khác. Con tượng c3 đang bị đánh hai lần và chỉ được đỡ một lần, nên nó không thể cứ đứng đó. Nước 7.Bd2 lui về và thừa nhận rằng nước trước là sai, đó là cách rẻ nhất. Các nước 7.a3, 7.e3 hay 7.h3 để mặc con tượng và mất nó sau Bxc3 rồi Nxc3 Qxc3+, tức là Đen hơn một quân. Nước 7.Bxb4 là cách xử lý đúng và được dựng thành nhánh riêng, còn 7.Qd2 là nước đi thua và cũng ở dưới.
                      en: White plays something else. The bishop on c3 is attacked twice and defended once, so it cannot simply stay there. 7.Bd2 retreats and admits the previous move was wrong, which is the cheapest way out. 7.a3, 7.e3 and 7.h3 leave the bishop and lose it after ...Bxc3 Nxc3 ...Qxc3+, a clear piece. 7.Bxb4 is the correct handling and has a branch of its own, and 7.Qd2 is the losing move, also below.
                      fr: Les Blancs jouent autre chose. Le fou c3 est attaqué deux fois et défendu une seule, il ne peut donc pas rester là. 7.Bd2 recule et reconnaît que le coup précédent était mauvais, c'est la sortie la moins coûteuse. 7.a3, 7.e3 et 7.h3 abandonnent le fou et le perdent après ...Bxc3 Nxc3 ...Qxc3+, soit une pièce nette. 7.Bxb4 est le traitement correct et dispose de sa propre branche, et 7.Qd2 est le coup perdant, également ci-dessous.
                  children:
                    - ply: Qd2
                      replyQuality: blunder
                      frequency: occasional
                      annotation:
                        vi: Trắng đỡ con tượng c3 bằng hậu. Bây giờ c3 bị đánh hai lần và được đỡ hai lần, nên về số học thì ổn. Về chiến thuật thì không, vì con hậu ở d2 đứng đúng trên đường chéo b4-e1 và nó sẽ bị ghim ngay ở nước sau.
                        en: White defends the bishop on c3 with the queen. Now c3 is attacked twice and defended twice, so the arithmetic works. The tactics do not, because the queen on d2 has placed itself on the b4-e1 diagonal and will be pinned there next move.
                        fr: Les Blancs défendent le fou c3 avec la dame. Désormais c3 est attaquée deux fois et défendue deux fois, l'arithmétique tient donc. La tactique, non, car la dame en d2 s'est placée sur la diagonale b4-e1 et s'y trouvera clouée dès le coup suivant.
                      children:
                        - ply: Bxc3
                          annotation:
                            vi: Đen ăn con tượng. Bây giờ con tượng Đen đứng ở c3 và nó ghim con hậu d2 vào vua e1, nên con hậu Trắng không đi đâu được ngoài việc ăn lại ở c3. Trong mười tám nước hợp lệ của Trắng, chỉ có đúng một nước hậu, và đó chính là cái bẫy.
                            en: Black takes the bishop. The black bishop now stands on c3 and pins the queen on d2 against the king on e1, so the white queen cannot go anywhere except back to c3. Of White's eighteen legal moves exactly one is a queen move, and that is the trap.
                            fr: Les Noirs prennent le fou. Le fou noir se tient désormais en c3 et cloue la dame d2 sur le roi e1, si bien que la dame blanche ne peut aller nulle part sinon reprendre en c3. Des dix-huit coups légaux blancs, un seul est un coup de dame, et c'est là le piège.
                          dismissRest:
                            reason:
                              vi: Trắng chơi một nước khác, và nước nào cũng để Đen hơn hẳn một quân, vì con tượng ở c3 vừa ăn một con tượng và chưa bị ăn lại. Con hậu d2 bị ghim nên không có nước hậu nào khác ngoài Qxc3. Nước 8.Kd1 bước ra khỏi ghim và nhường luôn con tượng, còn mọi nước phát triển khác cũng vậy.
                              en: White plays something else, and every one of them leaves Black a clear piece up, because the bishop on c3 has just taken a bishop and has not been taken back. The queen on d2 is pinned, so there is no queen move other than Qxc3. 8.Kd1 steps out of the pin and concedes the piece; every other developing move concedes it just the same.
                              fr: Les Blancs jouent autre chose, et chacun de ces coups laisse les Noirs avec une pièce nette de plus, car le fou en c3 vient de prendre un fou sans être repris. La dame d2 est clouée, il n'existe donc aucun coup de dame hormis Qxc3. 8.Kd1 sort du clouage et concède la pièce ; tout autre coup de développement la concède tout autant.
                          children:
