tree:
  annotation:
    vi: Đen vừa chơi 5...Bf5, tấn công mã b1, được xe a1 bảo vệ. Trắng hơn một tốt với con tốt trên e5, bị mã c6 tấn công và được mã f3 bảo vệ.
    en: Black has just played 5...Bf5, attacking the knight on b1, which the rook on a1 defends. White is a pawn up with the pawn on e5, which the knight on c6 attacks and the knight on f3 defends.
    fr: Les Noirs viennent de jouer 5...Bf5, attaquant le cavalier b1, que la tour a1 défend. Les Blancs ont un pion de plus avec le pion e5, attaqué par le cavalier c6 et défendu par le cavalier f3.
