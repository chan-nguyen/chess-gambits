      annotation:
        vi: Trắng chơi 6.Bg2, hoàn tất thế fianchetto và sẵn sàng nhập thành.
        en: White completes the fianchetto with 6.Bg2 and is ready to castle.
        fr: Les Blancs achèvent le fianchetto par 6.Bg2 et sont prêts à roquer.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng tám, Đen bảy, nên Trắng vẫn giữ tốt hơn trên e5, và các tốt Trắng ở e5 và e2 bị chồng. Tốt e5 bị tấn công một lần và được bảo vệ một lần; mã b1 bị tượng f5 tấn công và được xe a1 bảo vệ; còn tốt d4 của Đen bị mã f3 và hậu d1 tấn công, và được hậu d8 và mã c6 bảo vệ.'
          en: "Count the pawns: White eight, Black seven, so White still holds the extra pawn on e5, and White's pawns on e5 and e2 are doubled. The e5 pawn is attacked once and defended once, the knight on b1 is attacked by the bishop on f5 and defended by the rook on a1, and Black's pawn on d4 is attacked by the knight on f3 and the queen on d1 and defended by the queen on d8 and the knight on c6."
          fr: 'Comptez les pions : huit pour les Blancs, sept pour les Noirs ; les Blancs gardent donc le pion en plus en e5, et les pions blancs e5 et e2 sont doublés. Le pion e5 est attaqué une fois et défendu une fois ; le cavalier b1 est attaqué par le fou f5 et défendu par la tour a1 ; et le pion noir d4 est attaqué par le cavalier f3 et la dame d1 et défendu par la dame d8 et le cavalier c6.'
        plan:
          vi: Đen phát triển bằng ...Qd7 và nhập thành dài bằng ...O-O-O, rồi đưa con mã còn lại ra bằng ...Nge7. Trắng nhập thành bằng O-O và phát triển mã b1 bằng Nbd2.
          en: Black develops with ...Qd7 and castles long with ...O-O-O, then brings the other knight out with ...Nge7. White castles with O-O and develops the knight on b1 with Nbd2.
          fr: Les Noirs se développent par ...Qd7 et roquent côté dame par ...O-O-O, puis sortent l'autre cavalier par ...Nge7. Les Blancs roquent par O-O et développent le cavalier b1 par Nbd2.
        basis:
