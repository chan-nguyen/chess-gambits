# King's Gambit Declined: Falkbeer Countergambit, Charousek Gambit, Main Line, taught.
# Frozen defining line 1.e4 e5 2.f4 d5 3.exd5 e4 4.d3 Nf6 5.dxe4 Nxe4 6.Nf3 Bc5 7.Qe2 Bf5
# ends on Black's own 7...Bf5, so the root is an opponent node (docs/CONTEXT.md, invariant
# 5). The modelled line is 8.Nc3 Bb4, so the leaf has White to move. Every ply was replayed
# with chess.js; searchMate at 3 moves from the leaf returns no-mate, the leaf is not in
# check and no capture is going free.
id: falkbeer-countergambit-charousek-gambit-main-line
name: "King's Gambit Declined: Falkbeer Countergambit, Charousek Gambit, Main Line"
eco: C32
category: gambit
side: black
definingLine: [e4, e5, f4, d5, exd5, e4, d3, Nf6, dxe4, Nxe4, Nf3, Bc5, Qe2, Bf5]
soundness:
  value: dubious
  reviewedAt: '2026-09-30'
  basis:
    by: chan
    at: '2026-09-30'
    source: >-
      A judgement. Black has two active bishops and a centralised knight for the pawn on d5, but
      after 8.Nc3 Bb4 the pin on c3 is the only concrete gain, and it can be broken with Bd2.
      No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-30'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement
    on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen vừa chơi 7...Bf5, bảo vệ mã e4 và đưa tượng ra hoạt động. Tốt d5 của Trắng bị hậu tấn công mà không có ai bảo vệ, còn Đen đang kém một tốt nhưng có tượng c5, mã e4 và tượng f5 đều hoạt động.
    en: Black has just played 7...Bf5, defending the knight on e4 and bringing the bishop into play. White's pawn on d5 is attacked by the queen and defended by nothing, and Black is a pawn down with the bishop on c5, the knight on e4 and the bishop on f5 all active.
    fr: Les Noirs viennent de jouer 7...Bf5, défendant le cavalier e4 et mettant le fou en jeu. Le pion d5 des Blancs est attaqué par la dame et défendu par rien, et les Noirs sont en moins un pion avec le fou c5, le cavalier e4 et le fou f5 tous actifs.
  dismissRest:
    reason:
      vi: Trắng không chơi 8.Nc3, chẳng hạn chơi 8.c4, bảo vệ d5 bằng tốt, hoặc 8.Qd3. Phần lớn các nước khác để tốt d5 cho Qxd5 ăn.
      en: White plays something other than 8.Nc3, for example 8.c4, which defends d5 with a pawn, or 8.Qd3. Most other moves leave the pawn on d5 to Qxd5.
      fr: Les Blancs jouent autre chose que 8.Nc3, par exemple 8.c4, qui défend d5 avec un pion, ou 8.Qd3. La plupart des autres coups laissent le pion d5 à Qxd5.
  children:
    - ply: Nc3
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng bảo vệ tốt d5 bằng mã và tấn công mã e4 lần thứ hai. Mã c3 chỉ có tốt b2 bảo vệ.
        en: White defends the pawn on d5 with the knight and attacks the knight on e4 a second time. The knight on c3 is defended only by the pawn on b2.
        fr: Les Blancs défendent le pion d5 avec le cavalier et attaquent le cavalier e4 une seconde fois. Le cavalier c3 n'est défendu que par le pion b2.
      children:
        - ply: Bb4
          annotation:
            vi: Đen ghim mã c3 vào vua bằng tượng. Mã bị tượng b4 tấn công và chỉ được bảo vệ một lần, bởi tốt b2. Mã e4 cũng nhắm vào nó về lý thuyết, nhưng chính mã e4 bị hậu e2 ghim vào vua nên không ăn được.
            en: Black pins the knight on c3 to the king with the bishop. The knight is attacked by the bishop on b4 and defended once, by the pawn on b2. The knight on e4 also attacks it on paper, but it is pinned to the king by the queen on e2 and cannot capture.
            fr: Les Noirs clouent le cavalier c3 contre le roi avec le fou. Le cavalier est attaqué par le fou b4 et défendu une fois, par le pion b2. Le cavalier e4 l'attaque aussi sur le papier, mais il est lui-même cloué contre le roi par la dame e2 et ne peut pas prendre.
          outcome:
            type: position
            evaluation:
              vi: 'Đếm tốt: Trắng bảy, Đen sáu, nên Trắng hơn một tốt, đó là tốt d5. Nhưng mã c3 của Trắng bị tượng b4 ghim vào vua nên không ăn lại được trên d5 và không ăn được e4, và Đen đe dọa ...Qxd5.'
              en: "Count the pawns: White seven, Black six, so White is a pawn up, the extra pawn being the one on d5. But White's knight on c3 is pinned to the king by the bishop on b4, so it cannot recapture on d5 and cannot take on e4, and Black threatens ...Qxd5."
              fr: "Comptez les pions : sept pour les Blancs, six pour les Noirs, si bien que les Blancs ont un pion d'avance, le pion d5. Mais le cavalier c3 des Blancs est cloué contre le roi par le fou b4, si bien qu'il ne peut ni reprendre en d5 ni prendre en e4, et les Noirs menacent ...Qxd5."
            plan:
              vi: Trắng phá thế ghim bằng Bd2, nhờ đó mã c3 lại bảo vệ được d5. Đen thêm sức ép bằng cách nhập thành.
              en: White breaks the pin with Bd2, after which the knight on c3 guards d5 again. Black adds pressure by castling.
              fr: Les Blancs brisent le clouage par Bd2, après quoi le cavalier c3 garde de nouveau d5. Les Noirs renforcent la pression en roquant.
            basis:
              by: chan
              at: '2026-09-30'
