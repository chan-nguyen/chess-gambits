# King's Gambit Accepted: Rosentreter Gambit, Bird Gambit, taught. Frozen defining line 1.e4
# e5 2.f4 exf4 3.Nf3 g5 4.d4 g4 5.Ne5 Qh4+ 6.g3 ends on White's own 6.g3, so the root is an
# opponent node (docs/CONTEXT.md, invariant 5). Black's 6...Qg5 is modelled as the root's
# single reply, so the leaf has White to move. Every ply was replayed with chess.js;
# searchMate at 3 moves from the leaf returns no-mate, the leaf is not in check and no
# capture is going free in the machine's sense (every capture on the board can be
# recaptured).
id: kings-gambit-accepted-rosentreter-gambit-bird-gambit
name: "King's Gambit Accepted: Rosentreter Gambit, Bird Gambit"
eco: C37
category: gambit
side: white
definingLine: [e4, e5, f4, exf4, Nf3, g5, d4, g4, Ne5, Qh4+, g3]
soundness:
  value: dubious
  reviewedAt: '2026-09-30'
  basis:
    by: chan
    at: '2026-09-30'
    source: >-
      A judgement. 6.g3 attacks the queen, but after 6...Qg5 Black still holds an extra pawn, and
      the queen defends both advanced pawns, f4 and g4, each of which is attacked twice. No engine
      was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-30'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement
    on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa chơi 6.g3, dùng tốt tấn công hậu h4. Hậu không có ai bảo vệ, còn tốt g3 bị tốt f4 và hậu tấn công; mã e5 thì đánh vào f7, d7 và tốt g4.
    en: White has just played 6.g3, attacking the queen on h4 with a pawn. The queen is defended by nothing, the pawn on g3 is attacked by the pawn on f4 and the queen, and the knight on e5 attacks f7, d7 and the pawn on g4.
    fr: Les Blancs viennent de jouer 6.g3, attaquant la dame h4 avec un pion. La dame n'est défendue par rien, le pion g3 est attaqué par le pion f4 et la dame, et le cavalier e5 attaque f7, d7 et le pion g4.
  dismissRest:
    reason:
      vi: 'Đen chơi một nước khác thay vì 6...Qg5, chẳng hạn 6...fxg3 hoặc 6...Qf6. Mọi nước đều phải xử lý đòn tấn công vào hậu: phần lớn các nước không đưa hậu đi hay ăn g3 sẽ mất hậu vì gxh4.'
      en: 'Black plays something other than 6...Qg5, for example 6...fxg3 or 6...Qf6. Every reply has to deal with the attack on the queen: most moves that neither move it nor capture on g3 lose it to gxh4.'
      fr: "Les Noirs jouent autre chose que 6...Qg5, par exemple 6...fxg3 ou 6...Qf6. Toute réponse doit régler l'attaque sur la dame : la plupart des coups qui ne la déplacent pas et ne prennent pas en g3 la perdent après gxh4."
  children:
    - ply: Qg5
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen lùi hậu về g5, nơi nó tấn công mã e5 và bảo vệ cả hai con tốt đã đẩy xa, f4 và g4.
        en: Black retreats the queen to g5, where it attacks the knight on e5 and defends both advanced pawns, f4 and g4.
        fr: Les Noirs replient la dame en g5, où elle attaque le cavalier e5 et défend les deux pions avancés, f4 et g4.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Đen hơn một tốt. Nhưng cả hai tốt đã đẩy xa của Đen, f4 và g4, đều bị đánh hai lần và chỉ được một quân bảo vệ, là hậu g5. Mã e5 của Trắng bị hậu đánh và được tốt d4 bảo vệ.'
          en: "Count the pawns: White seven, Black eight, so Black is a pawn up. But both of Black's advanced pawns, f4 and g4, are attacked twice and defended once, by the queen on g5. White's knight on e5 is attacked by the queen and defended by the pawn on d4."
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs, si bien que les Noirs ont un pion d'avance. Mais les deux pions avancés des Noirs, f4 et g4, sont attaqués deux fois et défendus une seule fois, par la dame g5. Le cavalier e5 des Blancs est attaqué par la dame et défendu par le pion d4."
        plan:
          vi: Trắng có thể ăn f4 bằng gxf4, đánh luôn hậu g5, hoặc ăn g4 bằng Nxg4. Đen phải giữ cả hai tốt có quân bảo vệ, chẳng hạn bằng ...Nf6, rồi thách thức mã e5 bằng ...d6.
          en: White can take on f4 with gxf4, attacking the queen on g5, or on g4 with Nxg4. Black has to keep both pawns defended, for example with ...Nf6, and then challenges the knight on e5 with ...d6.
          fr: Les Blancs peuvent prendre en f4 par gxf4, en attaquant la dame g5, ou en g4 par Nxg4. Les Noirs doivent garder les deux pions défendus, par exemple par ...Nf6, puis contestent le cavalier e5 par ...d6.
        basis:
          by: chan
          at: '2026-09-30'
