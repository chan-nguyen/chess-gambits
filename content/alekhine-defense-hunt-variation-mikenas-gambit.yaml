# Alekhine Defense: Hunt Variation, Mikenas Gambit. Frozen defining line 1.e4 Nf6 2.e5 Nd5 3.c4
# Nb6 4.c5 Nd5 5.Bc4 e6 6.Nc3 d6 7.Nxd5 exd5 8.Bxd5, which ends on White's own ply, so the root is
# an opponent node (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 8...dxe5 9.Bb3
# Bxc5. searchMate at 3 moves from the resulting position returns no-mate, so no forced mate is
# claimed anywhere in this entry, and no capture is left going free at the leaf.
id: alekhine-defense-hunt-variation-mikenas-gambit
name: 'Alekhine Defense: Hunt Variation, Mikenas Gambit'
eco: B02
category: gambit
side: white
definingLine: [e4, Nf6, e5, Nd5, c4, Nb6, c5, Nd5, Bc4, e6, Nc3, d6, Nxd5, exd5, Bxd5]
soundness:
  value: unsound
  reviewedAt: '2026-09-30'
  basis:
    by: chan
