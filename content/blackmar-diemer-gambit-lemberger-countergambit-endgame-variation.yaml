tree:
  annotation:
    vi: Trắng vừa ăn tốt e5 bằng 4.dxe5, đáp lại nước phản công 3...e5 của Đen. Tốt d đã đi khỏi, nên cột d mở từ d1 đến d8 và hai hậu đứng đối mặt nhau trên cột này.
    en: White has just captured on e5 with 4.dxe5, answering Black's 3...e5 counter-thrust by taking the pawn. With the d-pawn gone, the d-file is open from d1 to d8 and the two queens stand face to face on it.
    fr: Les Blancs viennent de prendre en e5 par 4.dxe5, en réponse à la contre-poussée 3...e5 des Noirs. Le pion d ayant quitté la colonne, celle-ci est ouverte de d1 à d8 et les deux dames s'y font face.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 4...Qxd1+. Bài này chỉ đi theo nhánh đổi hậu; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 4...Qxd1+ here. This entry follows the queen trade only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 4...Qxd1+. Cette fiche ne suit que l'échange des dames ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Qxd1+
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen đổi hậu ngay bằng 4...Qxd1+ trên cột d mở. Đây là nước chiếu nên Trắng buộc phải ăn lại, bằng vua hoặc bằng mã từ c3.
        en: Black trades the queens at once with 4...Qxd1+ down the open d-file. It is check, so White must recapture, either with the king or with the knight from c3.
        fr: "Les Noirs échangent aussitôt les dames par 4...Qxd1+ sur la colonne d ouverte. C'est un échec : les Blancs doivent reprendre, avec le roi ou avec le cavalier de c3."
      children:
        - ply: Kxd1
          annotation:
            vi: Trắng ăn lại bằng vua, 5.Kxd1, giữ mã ở c3 để tiếp tục tấn công tốt e4. Cái giá là mất quyền nhập thành; cách ăn lại khác, 5.Nxd1, còn giữ được nhập thành nhưng đưa mã rời khỏi c3.
            en: White recaptures with the king, 5.Kxd1, which keeps the knight on c3 attacking the e4 pawn. The price is the right to castle; the other recapture, 5.Nxd1, would keep castling but take the knight away from c3.
            fr: Les Blancs reprennent avec le roi, 5.Kxd1, ce qui garde le cavalier en c3 face au pion e4. Le prix est la perte du droit de roquer ; l'autre reprise, 5.Nxd1, conserverait le roque mais éloignerait le cavalier de c3.
          outcome:
            type: position
            evaluation:
              vi: 'Đếm tốt: mỗi bên bảy tốt, nên con tốt Trắng đã hiến đã được lấy lại và vật chất cân bằng. Hai hậu đã rời bàn cờ, vua Trắng đứng ở d1 và mất quyền nhập thành, còn Đen vẫn giữ cả hai quyền nhập thành. Tốt e4 của Đen bị mã c3 tấn công mà không quân nào bảo vệ, nên Đen phải bảo vệ nó hoặc để mất.'
              en: "Count the pawns: seven each, so the pawn White gave up has been won back and material is level. The queens are off, White's king stands on d1 and has lost the right to castle, while Black still has both castling rights. Black's pawn on e4 is attacked by the knight on c3 and defended by nothing, so Black must either defend it or let it go."
              fr: "Comptez les pions : sept de chaque côté, donc le pion cédé par les Blancs est récupéré et le matériel est égal. Les dames ont disparu, le roi blanc se trouve en d1 et a perdu le droit de roquer, tandis que les Noirs gardent les deux roques. Le pion e4 noir est attaqué par le cavalier c3 et n'est défendu par rien : les Noirs doivent le défendre ou le laisser tomber."
            plan:
              vi: Trắng muốn ăn tốt e4 bằng Nxe4 để hơn một tốt, đồng thời dùng Bf4 hoặc Nf3 để giữ tốt e5, hiện chưa có quân nào bảo vệ. Đen bảo vệ e4 bằng ...Bf5 rồi thêm ...Nc6 tấn công e5, dựa vào việc còn quyền nhập thành trong khi vua Trắng vẫn ở d1.
              en: White wants to win the e4 pawn with Nxe4 to go a pawn up, using Bf4 or Nf3 to keep hold of the e5 pawn, which nothing defends yet. Black defends e4 with ...Bf5 and adds ...Nc6 to attack e5, relying on the castling rights while White's king stays on d1.
              fr: Les Blancs veulent prendre le pion e4 par Nxe4 pour gagner un pion, en s'appuyant sur Bf4 ou Nf3 pour garder le pion e5, qu'aucune pièce ne défend encore. Les Noirs défendent e4 par ...Bf5 puis ajoutent ...Nc6 pour attaquer e5, en comptant sur leurs droits de roque tant que le roi blanc reste en d1.
            basis:
              by: chan
              at: '2026-09-30'
