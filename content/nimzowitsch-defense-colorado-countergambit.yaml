# Nimzowitsch Defense: Colorado Countergambit. Frozen defining line 1.e4 Nc6 2.Nf3 f5,
# which ends on Black's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). The line below was replayed with chess.js before being annotated.
# searchMate from the leaf FEN, bounded to 3 moves, returns no-mate.
id: nimzowitsch-defense-colorado-countergambit
name: 'Nimzowitsch Defense: Colorado Countergambit'
eco: B00
category: gambit
side: black
definingLine: [e4, Nc6, Nf3, f5]
soundness:
  value: unsound
  reviewedAt: '2026-09-22'
  basis:
    by: chan
    at: '2026-09-22'
    source: >-
      A judgement. Black offers the f-pawn for quick central influence and open lines, but
      the knight already sitting on c6 blocks Black's own c-pawn and does nothing to
      support the centre or the king's safety after ...fxe5-style ideas. White simply takes
      the pawn and keeps a comfortable, safe extra pawn, which is why this is judged
      unsound. No engine was consulted and no database was queried.
