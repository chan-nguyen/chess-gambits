      en: 'White does not take the f5 pawn at once. Moves such as d4 or Nc3, developing and holding the centre, are both fine, but they leave that pawn on the board for Black.'
      fr: "Les Blancs ne prennent pas immédiatement le pion f5. Des coups comme d4 ou Nc3, développant et tenant le centre, sont tous deux corrects, mais laissent ce pion sur l'échiquier pour les Noirs."
