                    reason:
                      vi: Đen không ăn lại mã g4, nên Trắng cứ giữ con tượng đã thắng được. Nước nào trong số này cũng để Trắng hơn ít nhất một quân.
                      en: Black does not take back on g4, so White simply keeps the bishop it has won. Each of these replies leaves White at least a piece ahead.
                      fr: Les Noirs ne reprennent pas en g4, les Blancs gardent donc simplement le fou gagné. Chacune de ces réponses laisse les Blancs au moins une pièce devant.
                  children:
                    - ply: Nxg4
                      replyQuality: best
                      frequency: common
                      annotation:
                        vi: Mã f6 ăn lại mã g4, cách duy nhất để lấy lại một quân. Nhưng hậu Trắng nhìn thẳng ô g4 qua đường chéo d1-g4, nên cuộc đổi này chỉ có một chiều.
                        en: The f6 knight recaptures on g4, the only way to win a piece back. But the white queen looks straight at g4 along the d1-g4 diagonal, so the trade only goes one way.
                        fr: Le cavalier f6 reprend en g4, seul moyen de regagner une pièce. Mais la dame blanche voit directement g4 sur la diagonale d1-g4, si bien que l'échange ne tourne qu'à sens unique.
                      children:
                        - ply: Qxg4
                          annotation:
                            vi: Qxg4. Hậu ăn con mã trên g4 và Trắng đã lời hẳn một tượng, mà không có quân nào của mình bị đe doạ.
                            en: Qxg4. The queen takes the knight on g4 and White has won a whole bishop without a piece of its own under threat.
                            fr: Qxg4. La dame prend le cavalier g4 et les Blancs ont gagné un fou entier sans qu'aucune de leurs pièces soit menacée.
                          outcome:
                            type: position
                            evaluation:
                              vi: 'Trắng hơn hẳn một tượng. Trắng còn hai tượng và một mã, Đen chỉ còn một tượng và một mã, và mỗi bên vẫn có bảy tốt, hậu và hai xe. Đen không có gì cụ thể để bù lại một tượng: không có đòn tấn công vào vua và cũng chưa lấy lại được tốt nào.'
                              en: "White is a whole bishop up. White has two bishops and a knight against Black's one bishop and one knight, and each side still has seven pawns, a queen and two rooks. Black has nothing concrete to pay for a bishop: no attack on the king and no pawn won back."
                              fr: "Les Blancs ont un fou entier de plus. Ils ont deux fous et un cavalier contre un fou et un cavalier aux Noirs, et chaque camp a toujours sept pions, une dame et deux tours. Les Noirs n'ont rien de concret pour compenser un fou : ni attaque contre le roi ni pion regagné."
                            plan:
                              vi: Trắng nhập thành, phát triển nốt các quân còn lại và đổi quân để biến lợi thế vật chất thành thắng lợi. Đen cố gắng nhập thành và đẩy tốt c để lấy lại không gian, nhưng thiếu một tượng thì chẳng có cách nào bù đắp.
                              en: White castles, finishes development and trades pieces to turn the extra bishop into a win. Black tries to castle and push the c-pawn for space, but with a bishop down there is nothing to make up for it.
                              fr: Les Blancs roquent, achèvent leur développement et échangent les pièces pour transformer le fou gagné en victoire. Les Noirs tentent de roquer et de pousser le pion c pour gagner de l'espace, mais avec un fou de moins rien ne compense.
                            basis:
