# Italian Game: Evans Gambit, Fraser-Mortimer Attack. Defining line 1.e4 e5 2.Nf3 Nc6 3.Bc4
# Bc5 4.b4 Bxb4 5.c3 Bc5 6.d4 exd4 7.O-O d6 8.cxd4 Bb6 9.Nc3 Bg4 10.Qa4 Bd7 11.Qb3 Na5
# 12.Bxf7+ Kf8 13.Qc2, which ends on White's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5).
