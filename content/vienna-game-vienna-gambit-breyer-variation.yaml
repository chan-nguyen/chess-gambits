tree:
  annotation:
    vi:
      Sau khi đổi tốt ở trung tâm (fxe5, Nxe4), Trắng chơi 6.Nf3 thay vì đưa hậu ra ngay, ưu tiên phát
      triển quân trước khi tính chuyện ăn lại tốt.
    en:
      After the central pawn trade (fxe5, Nxe4), White plays 6.Nf3 instead of bringing the queen out
      at once, prioritising development before worrying about winning the pawn back.
    fr:
      Après l'échange de pions au centre (fxe5, Nxe4), les Blancs jouent 6.Nf3 au lieu de sortir tout
      de suite la dame, privilégiant le développement avant de songer à regagner le pion.
  dismissRest:
    reason:
      vi:
        Đen chơi nước khác ngoài Be7, ví dụ d4 đuổi mã Trắng trước hoặc Nc6. Đánh giá chung — vật chất
        cân bằng, con mã e4 là tâm điểm — không đổi nhiều.
      en:
        Black plays something other than Be7, for instance d4 to chase the White knight first, or Nc6.
        The overall assessment — level material, the knight on e4 as the focal point — does not
        change much.
      fr:
        Les Noirs jouent autre chose que Be7, par exemple d4 pour chasser d'abord le cavalier blanc, ou
        Nc6. L'évaluation générale — matériel égal, le cavalier e4 comme point focal — ne change
        guère.
  children:
    - ply: Be7
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen phát triển tượng ra e7 thay vì vội bảo vệ mã e4, chuẩn bị nhập thành nhanh.
        en:
          Black develops the bishop to e7 instead of rushing to defend the knight on e4, preparing to
          castle quickly.
        fr:
          Les Noirs développent le fou en e7 au lieu de se hâter de défendre le cavalier e4, préparant un
          roque rapide.
      outcome:
        type: position
        evaluation:
          vi:
            'Đếm tốt, hai bên đều có 7 — vật chất cân bằng: Trắng đã ăn tốt e5 nhưng đổi lại để Đen ăn tốt
            e4.'
          en:
            'Count the pawns and both sides have 7 — material is level: White captured the e5 pawn but let
            Black capture the e4 pawn in return.'
          fr:
            'Comptez les pions, chaque camp en a 7 — le matériel est égal : les Blancs ont capturé le pion
            e5 mais ont laissé les Noirs capturer le pion e4 en retour.'
        plan:
          vi:
            Trắng chơi d3 đuổi mã hoặc Bd3, hoàn thiện phát triển và chuẩn bị nhập thành trong lúc vẫn theo
            dõi con mã e4. Đen chơi O-O và Nc6, hoàn thiện phát triển và bảo vệ con mã tiền tiêu
            càng lâu càng tốt.
          en:
            White plays d3 to chase the knight, or Bd3, finishing development and preparing to castle while
            keeping an eye on the knight on e4. Black plays O-O and Nc6, finishing development and
            defending the advanced knight for as long as possible.
          fr:
            Les Blancs jouent d3 pour chasser le cavalier, ou Bd3, achevant leur développement et préparant
            le roque tout en surveillant le cavalier e4. Les Noirs jouent O-O et Nc6, achevant leur
            développement et défendant le cavalier avancé aussi longtemps que possible.
        basis:
          by: chan
          at: 2026-09-29
