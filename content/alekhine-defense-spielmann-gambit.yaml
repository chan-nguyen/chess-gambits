# Alekhine Defense: Spielmann Gambit. Frozen defining line 1.e4 Nf6 2.Nc3 d5 3.e5 Nfd7
# 4.e6, which ends on White's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). The line below was replayed with chess.js before being annotated.
