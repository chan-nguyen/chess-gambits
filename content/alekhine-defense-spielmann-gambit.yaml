    source: >-
      A judgement. White pushes the e-pawn a second time to e6, giving it up in exchange
      for damaging Black's pawn structure and gaining time. It is a sharp practical try
      rather than a proven advantage — Black simply takes the pawn and untangles. No engine
      was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-21'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
