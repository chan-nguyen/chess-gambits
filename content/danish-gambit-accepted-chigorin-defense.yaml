    source: >-
      A judgement, and the same label the catalogue's family rule carries. Guarding e5 in
      advance rather than developing a piece is a solid, unglamorous way to meet the fully
      accepted Danish, thought to hold up against White's two bishops without conceding
      anything concrete. No engine was consulted and no database was queried.
