# Danish Gambit Accepted: Chigorin Defense. Frozen defining line 1.e4 e5 2.d4 exd4 3.c3
# dxc3 4.Bc4 cxb2 5.Bxb2, which ends on White's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 5...Qe7: Black defends the
# e5 square in advance and prepares to meet the coming pressure with ...d6 and ...Nc6.
# Nothing is hanging at the resulting position. searchMate at 4 moves from this position
# returns unknown, which the stopping rule treats the same as no-mate, so no forced mate is
# claimed anywhere in this entry.
