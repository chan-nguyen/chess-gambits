name: 'French Defense: Marshall Gambit'
eco: C10
category: gambit
side: white
definingLine: [e4, e6, d4, d5, Nc3]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. Trading the centre for the c-file and quick piece play is a real plan, and
