tree:
  annotation:
    vi: Trắng vừa phát triển mã lên c3, con mã bình thường sẽ đỡ tốt d4 sau khi đổi tốt trung tâm. Mục này đi sâu riêng vào việc Đen đáp lại bằng 3...c5, tấn công thẳng vào chính con tốt d4 ấy trước khi nó kịp đứng vững.
    en: White has just developed the knight to c3, the piece that would normally guard d4 once the central pawns trade. This entry follows specifically Black answering with 3...c5, striking straight at that d4 pawn before it settles.
    fr: Les Blancs viennent de développer le cavalier en c3, la pièce qui garderait normalement d4 une fois les pions centraux échangés. Cette entrée suit spécifiquement la réponse noire 3...c5, qui frappe directement ce pion d4 avant qu'il ne s'installe.
  dismissRest:
    reason:
      vi: Đen không chơi 3...c5 — đổi tốt bằng 3...dxe4 trước, hay phát triển bằng 3...Nf6. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black does not play 3...c5 — trading with 3...dxe4 first, or developing with 3...Nf6. Each is outside the scope of this entry.
      fr: Les Noirs ne jouent pas 3...c5 — échangeant d'abord par 3...dxe4, ou développant par 3...Cf6. Chacun sort du cadre de cette entrée.
  children:
    - ply: c5
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Gambit Marshall. Đen đánh vào tốt d4 ngay lập tức, mời Trắng đổi tốt trung tâm để lấy cột d và cột c mở cho cả hai bên.
        en: The Marshall Gambit. Black strikes at the d4 pawn at once, inviting White to trade the central pawns for open d- and c-files on both sides.
        fr: Le Gambit Marshall. Les Noirs frappent aussitôt le pion d4, invitant les Blancs à échanger les pions centraux contre des colonnes d et c ouvertes des deux côtés.
      outcome:
        type: position
        evaluation:
          vi: Quân số hoàn toàn ngang nhau, mỗi bên còn đủ tám tốt. Căng thẳng ở trung tâm chưa được giải quyết theo cả hai hướng — tốt d4 của Trắng bị tốt c5 đánh, còn tốt e4 của Trắng bị tốt d5 đánh — và Trắng phải chọn đổi tốt bên nào trước hay đẩy tốt lên e5 để khoá hẳn trung tâm lại.
          en: Material is completely level, each side still has all eight pawns. The central tension is unresolved in both directions — White's d4 pawn is attacked by c5, and White's e4 pawn is attacked by d5 — and White has to choose which side to trade first, or push e5 to lock the centre shut instead.
          fr: Le matériel est parfaitement égal, chaque camp a encore ses huit pions. La tension centrale n'est résolue dans aucune des deux directions — le pion d4 blanc est attaqué par c5, et le pion e4 blanc est attaqué par d5 — et les Blancs doivent choisir quel côté échanger en premier, ou pousser e5 pour verrouiller complètement le centre.
        plan:
          vi: Trắng chơi exd5 rồi cxd4 hoặc Nxd5, mở cột cho xe và tận dụng nhịp phát triển, hoặc đẩy e5 để khoá trung tâm và chơi kiểu Advance Variation. Đen chơi cxd4 hoặc dxe4 tùy Trắng chọn gì, rồi Nf6 và Nc6, tranh chấp trung tâm bằng quân thay vì tốt.
          en: White plays exd5 then cxd4 or Nxd5, opening files for the rooks and using the development tempo, or pushes e5 to lock the centre and play an Advance Variation structure. Black plays cxd4 or dxe4 depending on White's choice, then Nf6 and Nc6, contesting the centre with pieces instead of pawns.
          fr: Les Blancs jouent exd5 puis cxd4 ou Nxd5, ouvrant des colonnes pour les tours et utilisant le temps de développement, ou poussent e5 pour verrouiller le centre et jouer une structure de type Variante d'Avance. Les Noirs jouent cxd4 ou dxe4 selon le choix des Blancs, puis Nf6 et Nc6, disputant le centre avec les pièces plutôt qu'avec les pions.
        basis:
          by: chan
          at: '2026-09-25'
