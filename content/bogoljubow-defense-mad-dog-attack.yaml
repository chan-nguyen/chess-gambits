tree:
  annotation:
    vi: Trắng vừa chơi 7.h4, đẩy tốt h khi cả hai mã và một tượng đã ra quân và vua vẫn ở e1. Tốt d4 bị hậu Đen tấn công và được bảo vệ hai lần, bởi mã f3 và hậu d1; f7 bị tượng c4 tấn công và chỉ có vua bảo vệ.
    en: White has just played 7.h4, pushing the h-pawn with both knights and a bishop already out and the king still on e1. The pawn on d4 is attacked by Black's queen and defended twice, by the knight on f3 and the queen on d1; f7 is attacked by the bishop on c4 and defended only by the king.
    fr: Les Blancs viennent de jouer 7.h4, poussant le pion h alors que les deux cavaliers et un fou sont sortis et que le roi est encore en e1. Le pion d4 est attaqué par la dame noire et défendu deux fois, par le cavalier f3 et la dame d1 ; f7 est attaqué par le fou c4 et défendu seulement par le roi.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 7...Nc6. Bài này chỉ đi theo nhánh 7...Nc6; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 7...Nc6 here. This entry follows the reply 7...Nc6 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 7...Nc6. Cette fiche ne suit que la réponse 7...Nc6 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Nc6
      replyQuality: good
      frequency: common
      annotation:
        vi: 'Đen phát triển bằng 7...Nc6, tấn công tốt d4 lần thứ hai: tốt này giờ bị hậu và mã tấn công, và được mã f3 cùng hậu d1 bảo vệ.'
        en: 'Black develops with 7...Nc6, attacking the d4 pawn a second time: it is now attacked by the queen and the knight, and defended by the knight on f3 and the queen on d1.'
        fr: 'Les Noirs se développent par 7...Nc6, attaquant le pion d4 une seconde fois : il est désormais attaqué par la dame et le cavalier, et défendu par le cavalier f3 et la dame d1.'
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng sáu, Đen bảy, nên Trắng kém một tốt. Chưa bên nào nhập thành. Tốt f7 bị tượng c4 tấn công mà chỉ có vua bảo vệ, còn tốt d4 được bảo vệ hai lần và bị tấn công hai lần, bởi hậu và mã của Đen.'
          en: "Count the pawns: White six, Black seven, so White is a pawn down. Neither king has castled. The pawn on f7 is attacked by the bishop on c4 and defended only by the king, while the pawn on d4 is defended twice and attacked twice, by Black's queen and knight."
          fr: "Comptez les pions : six pour les Blancs, sept pour les Noirs ; les Blancs sont donc un pion en moins. Aucun roi n'a roqué. Le pion f7 est attaqué par le fou c4 et défendu seulement par le roi, tandis que le pion d4 est défendu deux fois et attaqué deux fois, par la dame et le cavalier noirs."
        plan:
          vi: Trắng tăng sức ép lên f7 bằng Ng5 hoặc đẩy tiếp tốt bằng h5; Đen nhập thành bằng ...O-O hoặc gây sức ép lên mã f3 bằng ...Bg4.
          en: White adds to the pressure on f7 with Ng5 or pushes on with h5; Black castles with ...O-O or puts pressure on the knight on f3 with ...Bg4.
          fr: Les Blancs renforcent la pression sur f7 par Ng5 ou poursuivent la poussée par h5 ; les Noirs roquent par ...O-O ou mettent la pression sur le cavalier f3 par ...Bg4.
