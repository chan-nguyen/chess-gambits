# The Scotch Gambit. Frozen defining line 1.e4 e5 2.Nf3 Nc6 3.d4 exd4 4.Bc4, which ends on
# White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
#
# Every leaf here is an assessment. The Scotch Gambit leads to the Max Lange Attack and to
# some of the sharpest tactics in the open games, but none of the lines below forces mate,
# and an unproved mate claim is refused rather than written (ADR-0005).
id: scotch-game-scotch-gambit
name: 'Scotch Game: Scotch Gambit'
eco: C44
category: gambit
side: white
definingLine: [e4, e5, Nf3, Nc6, d4, exd4, Bc4]
soundness:
  value: sound
  reviewedAt: '2026-09-17'
  basis:
    by: chan
    at: '2026-09-17'
    source: >-
      A judgement, and the same label the catalogue's family rule carries. White is not
      really a pawn down for long — Nxd4 or c3 regains it in most lines — so what is being
      offered is time rather than material, and the resulting positions are respectable at
      every level. Black equalises with accurate play after 4...Nf6 5.e5 d5, which is why
      this is called sound rather than winning. No engine was consulted and no database was
      queried.
judgement:
  by: chan
  at: '2026-09-17'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
