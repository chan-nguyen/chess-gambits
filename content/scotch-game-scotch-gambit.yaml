tree:
  annotation:
    vi: Trắng chưa vội lấy lại con tốt d4 mà đưa tượng ra c4, nhắm thẳng vào f7. Đây là điểm khác nhau giữa Gambit Scotch và Khai cuộc Scotch bình thường, ở đó Trắng chơi Nxd4 và ván cờ lắng xuống. Ở đây Trắng giữ con tốt d4 của Đen làm con tin và đổi lấy hai nhịp phát triển cùng nước O-O sớm.
    en: White does not hurry to take the d4 pawn back and puts the bishop on c4, straight at f7. That is the difference between the Scotch Gambit and the ordinary Scotch, where Nxd4 is played and the game calms down. Here White leaves Black's pawn on d4 as a hostage and takes two tempi and an early O-O instead.
    fr: Les Blancs ne se hâtent pas de reprendre le pion d4 et posent le fou en c4, droit sur f7. C'est là toute la différence entre le Gambit écossais et la Partie écossaise ordinaire, où Nxd4 se joue et où la partie s'apaise. Ici, les Blancs laissent le pion noir en d4 comme otage et prennent deux temps et un roque rapide à la place.
  dismissRest:
    reason:
      vi: Đen chơi một nước khác. Nước 4...Ne5 đánh vào tượng nhưng con mã ở e5 không ai đỡ, nên 5.Nxe5 ăn đứt một quân. Nước 4...d3 trả tốt lại ngay và Trắng lấy lại bằng cxd3 hoặc Qxd3, được một ván cờ thoải mái mà chẳng thí gì. Các nước 4...Be7, 4...Nge7 hay 4...Qf6 đều chơi được nhưng thụ động, Trắng đáp O-O rồi Nxd4 hoặc c3 và có thế trận dễ chơi hơn hẳn. Không nước nào ở đây trừng phạt được nước Bc4.
      en: Black plays something else. 4...Ne5 attacks the bishop, but the knight on e5 is defended by nothing and 5.Nxe5 simply wins a piece. 4...d3 gives the pawn straight back and White recaptures with cxd3 or Qxd3 for a comfortable game with nothing sacrificed. 4...Be7, 4...Nge7 and 4...Qf6 are all playable but passive, and White answers O-O followed by Nxd4 or c3 with much the easier position. Nothing here punishes Bc4.
      fr: Les Noirs jouent autre chose. 4...Ne5 attaque le fou, mais le cavalier en e5 n'est défendu par rien et 5.Nxe5 gagne simplement une pièce. 4...d3 rend le pion aussitôt et les Blancs reprennent par cxd3 ou Qxd3, avec un jeu confortable et rien de sacrifié. 4...Be7, 4...Nge7 et 4...Qf6 sont jouables mais passifs, et les Blancs répondent O-O puis Nxd4 ou c3 avec une position bien plus facile. Rien ici ne punit Bc4.
  children:
    - ply: Nf6
      replyQuality: good
      frequency: common
      annotation:
        vi: Nước tự nhiên nhất và cũng là nước đúng nhất. Đen phát triển và đánh vào con tốt e4 cùng lúc, buộc Trắng phải quyết định ngay.
        en: The most natural move and also the best one. Black develops and attacks the e4 pawn at the same time, forcing White to decide at once.
        fr: Le coup le plus naturel et aussi le meilleur. Les Noirs se développent et attaquent le pion e4 en même temps, obligeant les Blancs à trancher immédiatement.
      children:
        - ply: e5
          annotation:
            vi: Trắng đẩy tốt lên thay vì đỡ nó. Con mã f6 bị đuổi, và nếu Đen lùi mã thì Trắng được nhịp còn con tốt e5 chiếm chỗ. Nước O-O cũng chơi được và dẫn tới Tấn công Max Lange, nhưng e5 là cách trực tiếp nhất.
            en: White pushes past instead of defending. The f6 knight is attacked, and if it retreats White gains a tempo and the e5 pawn takes space. Castling is also good and leads to the Max Lange Attack, but e5 is the most direct treatment.
            fr: Les Blancs poussent au lieu de défendre. Le cavalier f6 est attaqué, et s'il recule les Blancs gagnent un temps tandis que le pion e5 prend de l'espace. Le roque est également bon et mène à l'Attaque Max Lange, mais e5 est le traitement le plus direct.
          dismissRest:
            reason:
              vi: Đen không chơi d5. Nước 5...Ne4 đưa mã ra chỗ không ai giữ, Trắng đáp Qe2 hoặc Bd5 và con mã gặp rắc rối. Nước 5...Ng4 để mã bị h3 đuổi. Nước 5...Qe7 giữ mã bằng cách ghim tốt e5 và là nước phòng thủ nghiêm túc nhất trong nhóm này, nhưng nó chôn con tượng f8 và Trắng chơi O-O rồi Re1 với sức ép trên cột e. Còn mọi nước bỏ mặc con mã f6 thì exf6 ăn đứt một quân.
              en: Black does not play ...d5. 5...Ne4 puts the knight where nothing defends it, and Qe2 or Bd5 leaves it in trouble. 5...Ng4 invites h3. 5...Qe7 defends the knight by pinning the e5 pawn and is the most serious of these, but it buries the f8 bishop and White plays O-O and Re1 with pressure down the e-file. And anything that abandons the f6 knight loses a piece to exf6.
              fr: Les Noirs ne jouent pas ...d5. 5...Ne4 place le cavalier là où rien ne le défend, et Qe2 ou Bd5 le met en difficulté. 5...Ng4 invite h3. 5...Qe7 défend le cavalier en clouant le pion e5 et reste le plus sérieux de ces coups, mais il enterre le fou f8 et les Blancs jouent O-O puis Re1 avec une pression sur la colonne e. Et tout coup qui abandonne le cavalier f6 perd une pièce après exf6.
          children:
            - ply: d5
              replyQuality: best
              frequency: common
              annotation:
                vi: Nước đúng, và nó là một đòn trung gian. Đen không lùi con mã mà đánh vào tượng c4 trước, để khi tượng phải đi thì Đen mới tính tiếp chuyện con mã. Đây là cách duy nhất giữ được thăng bằng.
                en: Correct, and it is an in-between move. Instead of retreating the knight, Black attacks the bishop on c4 first, so that the knight question is only answered after the bishop has had to move. This is the one way to keep the balance.
                fr: Correct, et c'est un coup intermédiaire. Au lieu de reculer le cavalier, les Noirs attaquent d'abord le fou en c4, de sorte que la question du cavalier ne se pose qu'après le déplacement du fou. C'est la seule façon de maintenir l'équilibre.
              children:
                - ply: Bb5
                  annotation:
                    vi: Tượng lùi về b5 chứ không về b3 hay d3, vì ở b5 nó đánh con mã c6 và vẫn giữ được ý đồ exf6. Đây là ngã rẽ chính của cả biến, và nước trả lời chuẩn của Đen là Ne4.
                    en: The bishop goes to b5 rather than b3 or d3, because on b5 it hits the knight on c6 while exf6 is still in the air. This is the main crossroads of the variation, and Black's standard answer is 6...Ne4.
                    fr: Le fou va en b5 plutôt qu'en b3 ou d3, car en b5 il frappe le cavalier c6 tandis que exf6 reste dans l'air. C'est le carrefour principal de la variante, et la réponse habituelle des Noirs est 6...Ne4.
                  dismissRest:
                    reason:
                      vi: Đen không chơi ...Ne4 và do đó phải trả lời câu hỏi exf6 bằng cách khác. Nước ...Nd7 lùi mã về chỗ chật và Trắng chơi Nxd4 rồi O-O với thế cờ dễ chơi hơn hẳn. Nước ...d3 đẩy tốt đi tiếp cho khỏi bị ăn lại thì cxd3 và quân số lại ngang nhau. Nước ...Bd7, ...Bg4 hay ...Be6 phát triển thì exf6 ăn mã và Trắng hơn hẳn một quân nhẹ trong một nhịp, Đen phải lấy lại bằng ...Qxf6 hay ...gxf6 và cấu trúc hỏng. Nước ...Qe7 giữ mã thì Bxc6+ bxc6 rồi Qxd4 và quân số ngang nhau nhưng cấu trúc Đen xấu hơn. Nước ...a6 đuổi tượng thì Bxc6+ vẫn là câu trả lời. Không nước nào giữ được cả con tốt d4 lẫn con mã f6.
                      en: Black does not play ...Ne4 and so has to answer the exf6 question some other way. ...Nd7 retreats the knight to a cramped square and White plays Nxd4 and castles with the far easier game. ...d3, pushing the pawn on so it cannot be recaptured on d4, is met by cxd3 and the material is level again. ...Bd7, ...Bg4 and ...Be6 all develop and all allow exf6, which is a clear piece for a move — Black takes back with ...Qxf6 or ...gxf6 and the structure pays for it. ...Qe7 defends the knight and is met by Bxc6+ bxc6 and Qxd4, with material level and the worse structure for Black. ...a6 chases the bishop and Bxc6+ is still the answer. Nothing here keeps both the d4 pawn and the f6 knight.
                      fr: Les Noirs ne jouent pas ...Ne4 et doivent donc répondre autrement à la question exf6. ...Nd7 replie le cavalier sur une case à l'étroit et les Blancs jouent Nxd4 puis roquent avec un jeu nettement plus facile. ...d3, qui pousse le pion plus loin pour échapper à la reprise en d4, se traite par cxd3 et le matériel redevient égal. ...Bd7, ...Bg4 et ...Be6 développent tous et permettent tous exf6, une pièce nette contre un coup — les Noirs reprennent par ...Qxf6 ou ...gxf6 et la structure le paie. ...Qe7 défend le cavalier et reçoit Bxc6+ bxc6 puis Qxd4, matériel égal et structure noire inférieure. ...a6 chasse le fou et Bxc6+ reste la réponse. Rien ici ne conserve à la fois le pion d4 et le cavalier f6.
                  children:
                    - ply: Ne4
                      replyQuality: best
                      frequency: common
                      annotation:
                        vi: Mã nhảy vào e4 chứ không lùi. Ở đó nó an toàn vì tốt e5 không ăn được nó, và nó đứng giữa bàn cờ. Đen vẫn hơn một tốt và bây giờ mới là lúc Trắng phải lấy lại.
                        en: The knight jumps to e4 instead of retreating. It is safe there because the e5 pawn cannot take it, and it stands in the middle of the board. Black is still a pawn up, and only now does White have to go and get it back.
                        fr: Le cavalier saute en e4 au lieu de reculer. Il y est en sécurité, le pion e5 ne pouvant le prendre, et il occupe le centre. Les Noirs ont toujours un pion de plus, et ce n'est que maintenant que les Blancs doivent aller le rechercher.
                      children:
                        - ply: Nxd4
                          annotation:
                            vi: Trắng lấy lại con tốt bằng mã và đưa nó vào trung tâm. Mã d4 đánh con mã c6 đang bị tượng b5 ghim, và đó là điều khiến nước tiếp theo của Đen gần như bắt buộc.
                            en: White takes the pawn back with the knight and centralises it in the same move. The knight on d4 attacks the c6 knight, which is already pinned by the bishop on b5, and that is what makes Black's next move close to forced.
                            fr: Les Blancs reprennent le pion du cavalier et le centralisent du même coup. Le cavalier d4 attaque le cavalier c6, déjà cloué par le fou b5, et c'est ce qui rend le coup suivant des Noirs presque forcé.
                          dismissRest:
                            reason:
                              vi: Đen không gỡ ghim bằng ...Bd7. Con mã c6 vẫn bị tượng b5 ghim vào vua e8 và mã d4 vẫn đang đánh nó, nên Đen phải giải quyết chuyện đó chứ không được làm việc khác. Nước ...Qh4 hay ...Qg5 đánh sang cánh vua thì Nxc6 rồi Be2 là đủ và Đen mất quân. Nước ...Bc5 phát triển thì Nxc6 bxc6 Bxc6+ chiếu, và nước sau Bxa8 ăn luôn con xe. Nước ...Nxf2 bắt xe thì Kxf2 và Đen mất mã lấy một tốt. Nước ...a6 đuổi tượng thì Bxc6+ bxc6 và cấu trúc Đen hỏng mà chưa được gì.
                              en: Black does not break the pin with ...Bd7. The knight on c6 is still pinned against the king on e8 and still attacked by the knight on d4, so that is the thing Black has to deal with and nothing else. ...Qh4 or ...Qg5 swinging at the kingside is met by Nxc6 and Be2, which is enough and costs Black a piece. ...Bc5, developing, runs into Nxc6 bxc6 Bxc6+, which comes with check and takes the rook on a8 next move. ...Nxf2 forking is answered by Kxf2 and Black has given a knight for a pawn. ...a6 chases the bishop and Bxc6+ bxc6 wrecks the structure for nothing in return.
                              fr: Les Noirs ne brisent pas le clouage par ...Bd7. Le cavalier c6 reste cloué face au roi e8 et toujours attaqué par le cavalier d4, si bien que c'est cela, et rien d'autre, que les Noirs doivent régler. ...Qh4 ou ...Qg5 vers l'aile roi se traite par Nxc6 puis Be2, ce qui suffit et coûte une pièce aux Noirs. ...Bc5, qui développe, se heurte à Nxc6 bxc6 Bxc6+, avec échec, et la tour a8 tombe au coup suivant. ...Nxf2, la fourchette, reçoit Kxf2 et les Noirs ont donné un cavalier contre un pion. ...a6 chasse le fou et Bxc6+ bxc6 ruine la structure sans contrepartie.
                          children:
                            - ply: Bd7
                              replyQuality: best
                              frequency: common
                              annotation:
                                vi: Đen gỡ ghim và phát triển cùng một nước. Bây giờ con mã c6 được giữ hai lần và Đen doạ ...Nxd4 để đổi bớt.
                                en: Black breaks the pin and develops in one move. The knight on c6 is now defended twice and Black threatens ...Nxd4 to trade a pair off.
                                fr: Les Noirs brisent le clouage et développent d'un seul coup. Le cavalier c6 est désormais défendu deux fois et les Noirs menacent ...Nxd4 pour échanger une paire.
                              children:
                                - ply: Bxc6
                                  annotation:
                                    vi: Trắng đổi trước khi bị đổi. Đây là nước quyết định cấu trúc của cả phần còn lại ván cờ, vì nó buộc Đen phải chọn cách ăn lại và cả hai cách đều để lại tốt chồng ở cột c.
                                    en: White trades before being traded with. This is the move that decides the pawn structure for the rest of the game, because it makes Black choose a recapture and both recaptures end with doubled pawns on the c-file.
                                    fr: Les Blancs échangent avant qu'on ne les échange. C'est le coup qui fixe la structure de pions pour le reste de la partie, car il oblige les Noirs à choisir une reprise et les deux reprises finissent par des pions doublés sur la colonne c.
                                  dismissRest:
                                    reason:
                                      vi: Đen ăn lại bằng tượng thay vì bằng tốt, hoặc không ăn lại. Nước ...Bxc6 hoàn toàn chơi được nhưng Nxc6 rồi bxc6 đưa về đúng cấu trúc tốt chồng ấy, chỉ khác là Đen đã mất thêm con tượng ô trắng. Bỏ không ăn thì Đen kém hẳn một quân nhẹ. Nói cách khác, cột c của Đen sẽ chồng dù Đen chọn đường nào, và điều duy nhất Đen quyết được là có còn tượng hay không.
                                      en: Black recaptures with the bishop instead of the pawn, or does not recapture at all. ...Bxc6 is entirely playable, but Nxc6 and then ...bxc6 reaches the same doubled-pawn structure with Black's light-squared bishop gone as well. Not recapturing simply leaves Black a piece down. Put another way, Black's c-file is going to be doubled whichever road is taken, and the only thing Black gets to decide is whether the bishop survives the trip.
                                      fr: Les Noirs reprennent du fou plutôt que du pion, ou ne reprennent pas. ...Bxc6 est tout à fait jouable, mais Nxc6 puis ...bxc6 aboutit à la même structure de pions doublés, le fou de cases blanches noir en moins. Ne pas reprendre laisse simplement les Noirs avec une pièce de retard. Autrement dit, la colonne c noire sera doublée quel que soit le chemin, et la seule chose que les Noirs décident est de savoir si le fou survit au voyage.
                                  children:
                                    - ply: bxc6
                                      replyQuality: best
                                      frequency: common
                                      annotation:
                                        vi: Đen ăn bằng tốt b và giữ lại con tượng. Cột b mở ra cho xe a8 nhắm vào b2, và đó là thứ Đen được đổi lấy cặp tốt chồng ở c6 và c7.
                                        en: Black takes with the b-pawn and keeps the bishop. The b-file opens for the a8 rook against b2, and that is what Black gets in exchange for the doubled pair on c6 and c7.
                                        fr: Les Noirs prennent du pion b et conservent le fou. La colonne b s'ouvre pour la tour a8 en direction de b2, et c'est ce que les Noirs reçoivent en échange du duo doublé en c6 et c7.
                                      children:
                                        - ply: O-O
                                          annotation:
                                            vi: Trắng nhập thành và câu chuyện về con tốt gambit đã khép lại. Từ đây ván cờ không còn là chuyện hơn kém tốt nữa mà là chuyện cấu trúc.
                                            en: White castles and the story of the gambit pawn is closed. From here the game stops being about material and becomes an argument about structure.
                                            fr: Les Blancs roquent et l'histoire du pion de gambit est close. À partir d'ici, la partie cesse d'être une affaire de matériel pour devenir une question de structure.
                                          outcome:
                                            type: position
                                            evaluation:
                                              vi: Đếm tốt thì bảy đều, còn quân thì không hẳn. Trắng đã đổi con tượng ô trắng lấy con mã c6, nên bây giờ Trắng có hai mã cùng một tượng còn Đen có một mã cùng hai tượng. Đen giữ cặp tượng, và đó là phần bù thứ nhất cho cặp tốt chồng. Con tốt gambit đã về, nên câu hỏi vật chất của Khai cuộc Scotch Gambit đã được trả lời xong và những gì còn lại là cấu trúc. Trên bàn cờ có bốn thứ nhìn thấy được. Thứ nhất, Đen có hai con tốt chồng ở c6 và c7, và chúng sẽ chồng mãi mãi vì không có con tốt b nào để gỡ. Thứ hai, chính vì không có tốt b nên cột b nửa mở cho xe a8 và nó chĩa thẳng vào b2, đó là phần bù của Đen. Thứ ba, con tốt e5 của Trắng lấy mất ô f6 và ô d6 của quân Đen, nên con mã e4 không có đồng đội nào thay thế được nếu nó bị đuổi đi. Thứ tư, Trắng đã nhập thành còn vua Đen ở e8 và tượng f8 chưa ra khỏi hàng. Cuối cùng, cột b mở ra còn có một cái giá nữa bên cạnh cặp tốt chồng, đó là con tốt a7 bây giờ cô lập, không có tốt b nào bên cạnh và sẽ không bao giờ có.
                                              en: Count the pawns and it is seven each. The pieces do not match, and the difference is the trade that made the structure. White gave the light-squared bishop for the knight on c6, so White now has two knights and one bishop and Black has one knight and the bishop pair. That pair is the first half of what Black gets for the doubled pawns. The gambit pawn is back, so the material question the Scotch Gambit asked has been answered and what is left is structure. Four things stand on the board. First, Black has doubled pawns on c6 and c7, and they are doubled for good, because there is no b-pawn left to undouble them. Second, it is precisely that missing b-pawn that leaves the b-file half-open for the a8 rook, pointing straight at b2, and that is Black's compensation. Third, White's pawn on e5 takes both f6 and d6 away from Black's pieces, so if the knight on e4 is chased off, no other black piece can replace it. Fourth, White has castled while the black king is on e8 with the f8 bishop still at home. And the open b-file has a second price beside the doubled pair, which is that the pawn on a7 is now isolated — there is no b-pawn beside it and never will be.
                                              fr: Comptez les pions, sept de chaque côté. Les pièces, elles, ne se répondent pas, et la différence est l'échange qui a créé la structure. Les Blancs ont donné le fou de cases blanches contre le cavalier c6, si bien qu'ils ont désormais deux cavaliers et un fou et les Noirs un cavalier et la paire de fous. Cette paire est la première moitié de ce que les Noirs reçoivent pour les pions doublés. Le pion de gambit est revenu, donc la question matérielle posée par le Gambit écossais est réglée et il ne reste que la structure. Quatre choses se voient sur l'échiquier. D'abord, les Noirs ont des pions doublés en c6 et c7, doublés pour toujours, car il ne reste aucun pion b pour les dédoubler. Ensuite, c'est précisément ce pion b manquant qui laisse la colonne b semi-ouverte pour la tour a8, braquée sur b2, et c'est la compensation noire. Puis, le pion blanc en e5 retire à la fois f6 et d6 aux pièces noires, si bien que si le cavalier e4 est chassé, aucune autre pièce noire ne peut le remplacer. Enfin, les Blancs ont roqué alors que le roi noir est en e8 et le fou f8 encore à la maison. Et la colonne b ouverte a un second prix à côté du duo doublé, celui de laisser le pion a7 isolé — il n'a plus de pion b à ses côtés et n'en aura jamais.
                                            plan:
                                              vi: Trắng chơi f3 hoặc Nd2 để đuổi con mã e4, rồi Re1 và c4 đánh vào con tốt d5, sau đó Be3 và Qd3. Mục tiêu dài hạn là cặp tốt c6 và c7, chúng không đi đâu được và một con xe ở c1 cộng một con mã ở a4 hay b3 là đủ để ép. Đen chơi ...Be7 và ...O-O ngay lập tức, vì vua ở giữa bàn là vấn đề cấp bách hơn cấu trúc, rồi ...Rb8 xuống cột b, ...c5 để mở đường cho tượng d7 và cho xe, và ...f6 đánh vào con tốt e5 khi đã nhập thành xong. Nước phá quyết định là ...c5 rồi ...d4, vì nó biến cặp tốt chồng thành một con tốt thông ở trung tâm.
                                              en: White plays f3 or Nd2 to chase the e4 knight, then Re1 and c4 against the d5 pawn, followed by Be3 and Qd3. The long-term target is the pair on c6 and c7 — they cannot move and a rook on c1 plus a knight on a4 or b3 is enough to lean on them. Black plays ...Be7 and ...O-O straight away, because a king in the centre is more urgent than a pawn structure, then ...Rb8 onto the b-file, ...c5 to free the d7 bishop and the rook, and ...f6 against the e5 pawn once the king is safe. The break that decides it is ...c5 followed by ...d4, because it turns the doubled pair into a passed pawn in the centre.
                                              fr: Les Blancs jouent f3 ou Nd2 pour chasser le cavalier e4, puis Re1 et c4 contre le pion d5, suivis de Be3 et Qd3. La cible à long terme est le duo c6 et c7 — il ne peut pas bouger et une tour en c1 plus un cavalier en a4 ou b3 suffisent à peser dessus. Les Noirs jouent ...Be7 et ...O-O sans tarder, car un roi au centre est plus urgent qu'une structure de pions, puis ...Rb8 sur la colonne b, ...c5 pour libérer le fou d7 et la tour, et ...f6 contre le pion e5 une fois le roi à l'abri. La rupture décisive est ...c5 suivi de ...d4, car elle transforme le duo doublé en un pion passé au centre.
                                            basis:
                                              by: chan
                                              at: '2026-09-17'
    - ply: Bc5
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen giữ con tốt d4 và phát triển tượng ra ô tốt nhất của nó. Nước này dẫn tới Tấn công Max Lange nếu Trắng chơi O-O, hoặc tới một gambit thứ hai nếu Trắng chơi c3.
        en: Black holds the d4 pawn and develops the bishop to its best square. This leads to the Max Lange Attack if White castles, or to a second gambit offer if White plays c3.
        fr: Les Noirs conservent le pion d4 et développent le fou sur sa meilleure case. Cela mène à l'Attaque Max Lange si les Blancs roquent, ou à une seconde offre de gambit si les Blancs jouent c3.
      children:
        - ply: c3
          annotation:
            vi: Trắng mời thêm một con tốt nữa. Nếu Đen ăn dxc3 thì Nxc3 cho Trắng mã ra trung tâm, tượng c4 nhắm f7 và cột d mở, tức là đúng thế trận kiểu Gambit Göring. Nếu Đen không ăn thì Trắng chơi cxd4 và có trung tâm e4 cộng d4 đàng hoàng.
            en: White offers another pawn. If Black takes with ...dxc3, Nxc3 gives White a centralised knight, the bishop on c4 against f7 and an open d-file — the Göring Gambit set-up. If Black declines, White plays cxd4 and owns a proper e4 and d4 centre.
            fr: Les Blancs offrent un pion de plus. Si les Noirs prennent par ...dxc3, Nxc3 donne aux Blancs un cavalier centralisé, le fou c4 contre f7 et une colonne d ouverte, soit le dispositif du Gambit Göring. Si les Noirs refusent, les Blancs jouent cxd4 et possèdent un vrai centre e4 et d4.
          outcome:
            type: position
            evaluation:
              vi: Đen hơn một tốt và sắp được mời con thứ hai. Con tượng c5 đứng đẹp nhưng nó sẽ bị chính con tốt c3 và d4 đẩy đi khi Trắng lấy lại trung tâm, nên Đen thường chơi Nf6 hoặc d3 để giữ nhịp. Thế cờ sắc và hai bên đều có tài nguyên, nhưng ai thuộc nhánh này sẽ chơi nhanh hơn nhiều.
              en: Black is a pawn up and about to be offered a second. The bishop on c5 is well placed, but it is exactly what the c3 and d4 pawns will push around once White rebuilds the centre, so Black usually plays ...Nf6 or ...d3 to keep the tempo. The position is sharp and both sides have resources, but whoever knows this branch will play it much faster.
              fr: Les Noirs ont un pion de plus et s'en voient offrir un second. Le fou en c5 est bien placé, mais c'est précisément lui que les pions c3 et d4 chasseront dès que les Blancs auront reconstruit le centre, si bien que les Noirs jouent d'ordinaire ...Nf6 ou ...d3 pour garder le tempo. La position est acérée et les deux camps ont des ressources, mais celui qui connaît cette branche la jouera bien plus vite.
            plan:
              vi: Trắng chơi cxd4 nếu Đen không ăn, hoặc Nxc3 nếu Đen ăn, rồi O-O, Nc3, Bg5 và Rc1 hoặc Re1. Nước phá là d5 hoặc e5 để mở trung tâm khi vua Đen chưa nhập thành. Đen nên chơi d3 để chặn đường chéo và làm Trắng phải mất nhịp nhặt lại con tốt, hoặc Nf6 rồi d6 và O-O. Nếu Đen kịp nhập thành và giữ thêm một tốt thì thế cờ là của Đen.
              en: White plays cxd4 if Black declines, or Nxc3 if Black accepts, then castles, Nc3, Bg5 and a rook to c1 or e1. The break is d5 or e5 to open the centre while the black king is still in it. Black should consider ...d3, which blocks the diagonal and makes White spend time collecting the pawn, or ...Nf6 followed by ...d6 and ...O-O. If Black castles in time and keeps an extra pawn, the position is Black's.
              fr: Les Blancs jouent cxd4 si les Noirs refusent, ou Nxc3 s'ils acceptent, puis roquent, Nc3, Bg5 et une tour en c1 ou e1. La rupture est d5 ou e5 pour ouvrir le centre tant que le roi noir y demeure. Les Noirs peuvent envisager ...d3, qui barre la diagonale et oblige les Blancs à perdre du temps pour récupérer le pion, ou ...Nf6 suivi de ...d6 et ...O-O. Si les Noirs roquent à temps en gardant un pion de plus, la position est à eux.
            basis:
              by: chan
              at: '2026-09-17'
    - ply: Bb4+
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Phòng thủ London. Đen chiếu để ép Trắng phải trả lời, và nước trả lời tự nhiên nhất lại chính là nước Trắng muốn chơi. Đây là kiểu chiếu không đem lại gì, nhưng nó cũng không làm hỏng gì.
        en: The London Defense. Black checks to force a reply, and the most natural reply is the one White wanted to play anyway. It is a check that gains nothing, though it spoils nothing either.
        fr: La Défense londonienne. Les Noirs font échec pour forcer une réponse, et la réponse la plus naturelle est justement celle que les Blancs voulaient jouer. C'est un échec qui ne rapporte rien, mais qui ne gâte rien non plus.
      children:
        - ply: c3
          annotation:
            vi: Trắng chắn bằng tốt, và con tốt này vừa đỡ chiếu vừa đánh vào tốt d4. Con tượng b4 bây giờ phải quyết định, đổi ở c3 để cho Trắng một cấu trúc tốt mạnh hơn ở trung tâm, hay lùi về e7 hoặc a5 và mất nhịp.
            en: White blocks with the pawn, and that pawn both answers the check and attacks d4. The bishop on b4 now has to decide — take on c3 and hand White a stronger pawn centre, or retreat to e7 or a5 having lost time.
            fr: Les Blancs bloquent avec le pion, et ce pion pare l'échec tout en attaquant d4. Le fou b4 doit maintenant choisir — prendre en c3 et offrir aux Blancs un centre de pions plus fort, ou reculer en e7 ou a5 après avoir perdu du temps.
          outcome:
            type: position
            evaluation:
              vi: Đen hơn một tốt trên danh nghĩa, nhưng con tốt d4 đang bị c3 đánh và sẽ không sống lâu. Con tượng b4 là quân duy nhất đang bị hỏi, và mọi câu trả lời của nó đều tốn nhịp hoặc cải thiện cấu trúc của Trắng. Đây là một trong những nhánh dễ chịu nhất cho Trắng trong cả biến, và nó cho thấy vì sao nước chiếu ở b4 không phải là nước đáng chơi.
              en: Black is nominally a pawn up, but the pawn on d4 is attacked by c3 and will not live long. The bishop on b4 is the one piece being questioned, and every answer it has either costs time or improves White's structure. This is one of the most comfortable branches for White in the whole variation, and it shows why the check on b4 is not a move worth playing.
              fr: Les Noirs ont nominalement un pion de plus, mais le pion d4 est attaqué par c3 et ne vivra pas longtemps. Le fou b4 est la seule pièce mise en question, et toutes ses réponses coûtent du temps ou améliorent la structure blanche. C'est l'une des branches les plus confortables pour les Blancs dans toute la variante, et elle montre pourquoi l'échec en b4 ne vaut pas la peine d'être joué.
            plan:
              vi: Trắng lấy lại con tốt bằng cxd4 hoặc bxc3 tuỳ theo Đen làm gì, rồi O-O, Nc3, Bg5 hay Be3 và Re1. Nếu Đen chơi dxc3 thì bxc3 cho Trắng trung tâm e4 cộng d4 và cột b nửa mở, đó là cách ăn lại đáng chọn. Đen nên lùi tượng về e7 rồi chơi Nf6, d6 và O-O, tránh đổi ở c3, và tìm cách phá trung tâm Trắng bằng d5 sau khi đã an toàn.
              en: White recovers the pawn with cxd4 or bxc3 depending on what Black does, then castles, Nc3, Bg5 or Be3 and Re1. If Black plays ...dxc3, recapturing bxc3 gives White the e4 and d4 centre plus a half-open b-file, and that is the recapture to prefer. Black should retreat the bishop to e7, then play ...Nf6, ...d6 and ...O-O, avoid the exchange on c3, and aim to break up White's centre with ...d5 once safe.
              fr: Les Blancs récupèrent le pion par cxd4 ou bxc3 selon ce que font les Noirs, puis roquent, Nc3, Bg5 ou Be3 et Re1. Si les Noirs jouent ...dxc3, reprendre par bxc3 donne aux Blancs le centre e4 et d4 plus une colonne b semi-ouverte, et c'est la reprise à préférer. Les Noirs feraient bien de reculer le fou en e7, puis de jouer ...Nf6, ...d6 et ...O-O, d'éviter l'échange en c3 et de viser ...d5 pour casser le centre blanc une fois en sécurité.
            basis:
              by: chan
              at: '2026-09-17'
    - ply: d6
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Phòng thủ Janowski. Đen củng cố trước khi làm gì khác, mở đường cho tượng c8 và chuẩn bị Nf6 mà không sợ e5. Chắc chắn nhưng chậm.
        en: The Janowski Defense. Black shores things up before doing anything else, opens the c8 bishop's diagonal and prepares ...Nf6 without fearing e5. Solid but slow.
        fr: La Défense Janowski. Les Noirs consolident avant toute autre chose, ouvrent la diagonale du fou c8 et préparent ...Nf6 sans craindre e5. Solide mais lent.
      children:
        - ply: O-O
          annotation:
            vi: Trắng nhập thành và để con tốt d4 lại đó. Xe f1 vào cột f, vua an toàn, và Trắng vẫn còn cả c3 lẫn Nxd4 để lấy lại tốt vào lúc thích hợp. Đây chính là thứ mà gambit mua được, đó là thời gian.
            en: White castles and leaves the d4 pawn where it is. The rook comes to the f-file, the king is safe, and White still has both c3 and Nxd4 to recover the pawn at a convenient moment. This is exactly what the gambit buys, which is time.
            fr: Les Blancs roquent et laissent le pion d4 où il est. La tour vient sur la colonne f, le roi est en sûreté, et les Blancs gardent à la fois c3 et Nxd4 pour reprendre le pion au bon moment. C'est précisément ce que le gambit achète, du temps.
          outcome:
            type: position
            evaluation:
              vi: Đen hơn một tốt và không có điểm yếu nào, nhưng Đen cũng chưa nhập thành và mới ra một quân. Trắng đã nhập thành xong, tượng đã ở c4 và mã đã ở f3, và con tốt d4 thì không chạy đi đâu được. Thực tế đây là một thế cờ Scotch bình thường mà Trắng đã được tặng thêm hai nhịp.
              en: Black is a pawn up with no weaknesses, but Black has not castled and has only one piece out. White has castled, the bishop is on c4, the knight is on f3, and the d4 pawn is not going anywhere. In practice this is an ordinary Scotch in which White has been given two extra tempi.
              fr: Les Noirs ont un pion de plus sans aucune faiblesse, mais ils n'ont pas roqué et n'ont sorti qu'une pièce. Les Blancs ont roqué, le fou est en c4, le cavalier en f3, et le pion d4 n'ira nulle part. En pratique, c'est une écossaise ordinaire dans laquelle les Blancs ont reçu deux temps de plus.
            plan:
              vi: Trắng chơi c3 để mời đổi hoặc lấy lại tốt, rồi Nbd2 hay Nc3, Re1 và Qb3 nhắm vào f7 và b7 cùng lúc. Nếu Đen chơi Nf6 thì e5 lại là nước phá. Đen chơi Nf6 hoặc Be7 rồi O-O thật nhanh, sau đó Be6 để đổi con tượng c4 và Re8. Nếu Đen đổi được cặp tượng trắng ô và giữ thêm tốt thì ván cờ nghiêng về Đen, còn nếu chậm thì cột e và đường chéo a2-g8 sẽ nói chuyện.
              en: White plays c3 to invite the exchange or regain the pawn, then Nbd2 or Nc3, Re1 and Qb3, hitting f7 and b7 at once. If Black plays ...Nf6, e5 is again the break. Black plays ...Nf6 or ...Be7 and castles quickly, then ...Be6 to trade the c4 bishop off, and ...Re8. If Black trades the light-squared bishops and keeps the extra pawn, the game tilts Black's way; if Black is slow, the e-file and the a2-g8 diagonal will have something to say.
              fr: Les Blancs jouent c3 pour inviter l'échange ou reprendre le pion, puis Nbd2 ou Nc3, Re1 et Qb3, qui frappe f7 et b7 à la fois. Si les Noirs jouent ...Nf6, e5 est de nouveau la rupture. Les Noirs jouent ...Nf6 ou ...Be7 et roquent vite, puis ...Be6 pour échanger le fou c4, et ...Re8. Si les Noirs échangent les fous de cases claires en gardant le pion, la partie penche de leur côté ; s'ils tardent, la colonne e et la diagonale a2-g8 auront leur mot à dire.
            basis:
              by: chan
              at: '2026-09-17'
