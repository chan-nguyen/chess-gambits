tree:
  annotation:
    vi: Đây là thế cờ ngay sau 1.e4 e6 2.d4 b5. Mục này đi theo phép thử trực tiếp nhất của ván thí
      quân, khi Trắng đơn giản ăn tốt bằng Bxb5.
    en:
      'This is the position right after 1.e4 e6 2.d4 b5. This entry follows the most direct test of
      the gambit: White simply accepts with Bxb5.'
    fr: Voici la position juste après 1.e4 e6 2.d4 b5. Cette entrée suit le test le plus direct du
      gambit, quand les Blancs acceptent tout simplement par Bxb5.
  dismissRest:
    reason:
      vi:
        Trắng không ăn tốt trên b5 mà chơi nước khác, giữ nguyên tương quan lực lượng và dẫn tới một thế
        cờ điềm tĩnh hơn mà mục này không theo — phép thử thực sự của ván thí quân chỉ nằm ở nhánh
        chấp nhận được trình bày ở đây.
      en:
        White declines to capture on b5 and plays something else instead, keeping material level and
        heading into a calmer position that this entry does not follow — the practical test of the
        gambit lives only in the accepted line modelled here.
      fr:
        Les Blancs refusent de prendre en b5 et jouent autre chose, gardant le matériel égal et menant
        vers une position plus calme que cette entrée ne suit pas — le vrai test du gambit ne se
        trouve que dans la ligne acceptée présentée ici.
  children:
