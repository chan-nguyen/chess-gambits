      annotation:
        vi:
          Trắng chơi Bxb5, ăn tốt trên b5 — cách đáp trả đơn giản và được thử nghiệm nhiều nhất trước con
          tốt được thí.
        en:
          White plays Bxb5, capturing the pawn on b5 — the simplest and most tested response to the
          offered pawn.
        fr:
          Les Blancs jouent Bxb5, en prenant le pion en b5 — la réponse la plus simple et la plus éprouvée
          face au pion offert.
      outcome:
        type: position
        evaluation:
          vi:
            Đếm tốt, Trắng có 8 còn Đen có 7 — Trắng hơn đúng 1 tốt sạch. Cả hai vua đều chưa nhập thành,
            vẫn còn đứng giữa bàn cờ.
          en:
            Count the pawns and it is 8 for White, 7 for Black — White is up a clean pawn. Neither king has
            castled yet; both are still in the centre.
          fr:
            Comptez les pions, 8 pour les Blancs, 7 pour les Noirs — les Blancs ont un pion net de plus.
            Aucun des deux rois n'a encore roqué ; tous deux restent au centre.
        plan:
          vi:
            Trắng tìm cách giữ vững phần vật chất hơn, đổi quân khi thuận lợi và hoàn thiện phát triển mà
            không mạo hiểm. Đen chơi vì tốc độ phát triển và các đường mở nhắm vào vua Trắng, cố
            gắng chứng minh giá trị của quân đã thí trước khi đối phương kịp gỡ rối.
          en:
            White looks to consolidate the extra material, trade pieces when it is convenient, and finish
            development without taking risks. Black plays for rapid development and open lines
            toward the white king, trying to make the sacrifice count before White untangles.
          fr:
            Les Blancs cherchent à consolider le surplus de matériel, échanger les pièces quand cela les
            arrange, et terminer leur développement sans prendre de risques. Les Noirs jouent pour
            un développement rapide et des lignes ouvertes vers le roi blanc, essayant de
            rentabiliser le sacrifice avant que les Blancs ne se démêlent.
        basis:
          by: chan
          at: 2026-09-29
