# Scandinavian Defense: Portuguese Gambit, Classical Variation. Defining line 1.e4 d5 2.exd5
# Nf6 3.d4 Bg4, which ends on Black's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). The frozen catalogue line runs one ply further (Nf3); it
# is modelled below as a reply so the learner's ply ends the defining line, as the catalogue
# build allows.
# Part of batch s of round 4 (#182). Every ply below was replayed with chess.js before it
# was annotated; searchMate at 3 moves from each leaf returns no-mate, so no forced mate is
# claimed anywhere in this entry, and no capture is left going free at any leaf.
id: scandinavian-defense-portuguese-gambit-classical-variation
name: 'Scandinavian Defense: Portuguese Gambit, Classical Variation'
eco: B01
category: gambit
side: black
definingLine: [e4, d5, exd5, Nf6, d4, Bg4]
soundness:
  value: dubious
  reviewedAt: '2026-10-01'
  basis:
    by: chan
    at: '2026-10-01'
    source: >-
      A judgement, deepened from the frozen listed-tier classification in
      tools/catalogue/source/classification.yaml. At the end of the defining line White is a
      pawn up, eight pawns against seven, but the pawn on d5 is attacked twice and defended
      by nothing, so Black can take it back, and the bishop on g4 attacks the queen on d1,
      which only the king defends. The rating of dubious is the catalogue's; the board at
      this point shows a loose extra pawn rather than a clear advantage for White. No engine
      was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-10-01'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen vừa chơi 3...Bg4, nên số tốt là Trắng tám, Đen bảy. Tượng g4 tấn công hậu d1, quân chỉ có vua bảo vệ, còn tốt d5 bị hậu d8 và mã f6 tấn công và không được quân nào bảo vệ.
    en: Black has just played 3...Bg4, so the pawn count is White eight, Black seven. The bishop on g4 attacks the queen on d1, which only the king defends, and the pawn on d5 is attacked by the queen on d8 and the knight on f6 and defended by nothing.
    fr: Les Noirs viennent de jouer 3...Bg4, de sorte que le compte des pions est de huit pour les Blancs, sept pour les Noirs. Le fou g4 attaque la dame d1, que seul le roi défend, et le pion d5 est attaqué par la dame d8 et le cavalier f6 et n'est défendu par aucune pièce.
  dismissRest:
    reason:
      vi: 'Trắng chơi nước khác thay vì 4.Nf3 ở đây, chẳng hạn 4.Be2 hoặc 4.f3. Mục này chỉ mô hình hóa 4.Nf3 và không phân tích các nước kia; nhiệm vụ của Đen thường vẫn như cũ: lấy lại tốt d5.'
      en: "White plays something other than 4.Nf3 here, for instance 4.Be2 or 4.f3. This entry models only 4.Nf3 and does not analyse those moves; Black's task usually stays the same: win the d5 pawn back."
      fr: "Les Blancs jouent autre chose que 4.Nf3 ici, par exemple 4.Be2 ou 4.f3. Cette entrée ne modélise que 4.Nf3 et n'analyse pas ces coups ; la tâche des Noirs reste en général la même : regagner le pion d5."
  children:
    - ply: Nf3
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng phát triển mã ra f3, chắn đường chéo từ tượng tới hậu. Mã bị tượng g4 tấn công và được tốt g2 cùng hậu d1 bảo vệ.
        en: White develops the knight to f3, which blocks the bishop's diagonal to the queen. The knight is attacked by the bishop on g4 and defended by the pawn on g2 and the queen on d1.
        fr: Les Blancs développent le cavalier en f3, ce qui bloque la diagonale du fou vers la dame. Le cavalier est attaqué par le fou g4 et défendu par le pion g2 et la dame d1.
      unsettled: "Qxd5 and Nxd5 are going free because nothing of White's guards d5, and the evaluation already counts on that capture: whichever piece takes, the pawn count becomes seven each, so playing it out would only repeat what the leaf says."
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng tám, Đen bảy, nên Trắng tạm thời hơn một tốt, nhưng tốt d5 bị tấn công hai lần, bởi hậu d8 và mã f6, và không được quân nào bảo vệ, nên Đen ăn lại và số tốt thành bảy đều. Tượng g4 cũng có thể tự đổi lấy mã f3.'
          en: 'Count the pawns: White eight, Black seven, so White is a pawn up for the moment, but the pawn on d5 is attacked twice, by the queen on d8 and the knight on f6, and defended by nothing, so Black takes it back and the count becomes seven each. The bishop on g4 can also trade itself for the knight on f3.'
          fr: "Comptez les pions : huit pour les Blancs, sept pour les Noirs, donc les Blancs ont provisoirement un pion de plus, mais le pion d5 est attaqué deux fois, par la dame d8 et le cavalier f6, et n'est défendu par aucune pièce, de sorte que les Noirs le reprennent et que le compte devient sept partout. Le fou g4 peut aussi s'échanger contre le cavalier f3."
        plan:
          vi: Trắng chơi c4 để đuổi mã khi nó đáp xuống d5, rồi Be2 và O-O. Đen chơi ...Nxd5 để lấy lại con tốt, rồi ...e6 và ...Nc6 để phát triển.
          en: White plays c4 to chase the knight once it lands on d5, then Be2 and O-O. Black plays ...Nxd5 to regain the pawn, then ...e6 and ...Nc6 to develop.
          fr: Les Blancs jouent c4 pour chasser le cavalier dès qu'il arrive en d5, puis Be2 et O-O. Les Noirs jouent ...Nxd5 pour regagner le pion, puis ...e6 et ...Nc6 pour se développer.
        basis:
          by: chan
          at: 2026-10-01
