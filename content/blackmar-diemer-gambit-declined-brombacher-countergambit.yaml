# Blackmar-Diemer Gambit Declined: Brombacher Countergambit. Frozen defining line 1.d4 d5
# 2.e4 dxe4 3.Nc3 Nf6 4.f3, which ends on White's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Replayed with chess.js: 4...c5 is the named countergambit
# reply, and 5.fxe4 recaptures the central pawn without needing to answer the pressure on
# d4 yet, since the queen on d1 still defends it. Material after 5.fxe4 is level at seven
# pawns each, and nothing is hanging for either side. searchMate at 4 moves from this
# position returns unknown, which the stopping rule treats the same as no-mate, so no
# forced mate is claimed.
id: blackmar-diemer-gambit-declined-brombacher-countergambit
name: 'Blackmar-Diemer Gambit Declined: Brombacher Countergambit'
eco: D00
category: gambit
side: white
definingLine: [d4, d5, e4, dxe4, Nc3, Nf6, f3]
soundness:
  value: dubious
  reviewedAt: '2026-09-18'
  basis:
    by: chan
    at: '2026-09-18'
    source: >-
      A judgement. Black declines to give the pawn back with 4...exf3 and instead strikes
      at d4 directly with 4...c5. It is a sharp practical try rather than a refutation —
      White simply recaptures on e4 and is no worse off than in the main Blackmar-Diemer
      lines, while Black's c5 push has committed to a plan before finishing development. No
      engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng chơi 4.f3, mời Đen ăn lại tốt e4 để mở đường cho quân phát triển theo đúng tinh thần Blackmar-Diemer. Đây là điểm khởi đầu nơi Đen có thể chọn ăn ngay hoặc từ chối bằng một phản gambit khác.
    en: White plays 4.f3, inviting Black to take back the e4 pawn to open lines for development in true Blackmar-Diemer style. This is the point where Black can choose to take at once or decline with a countergambit of their own.
    fr: Les Blancs jouent 4.f3, invitant les Noirs à reprendre le pion e4 pour ouvrir des lignes de développement dans le pur style Blackmar-Diemer. C'est le point où les Noirs peuvent choisir de prendre tout de suite ou de refuser par un contre-gambit.
  dismissRest:
    reason:
      vi: Đen không chơi phản gambit 4...c5. Việc ăn lại ngay bằng 4...exf3 dẫn về các thế cờ Blackmar-Diemer đã được chấp nhận thông thường, còn các nước phát triển khác như Bf5 hay Nc6 để nguyên căng thẳng ở trung tâm chưa được giải quyết.
      en: Black does not play the 4...c5 countergambit. Recapturing at once with 4...exf3 leads back to the ordinary accepted Blackmar-Diemer positions, while other developing moves such as Bf5 or Nc6 leave the central tension unresolved.
      fr: Les Noirs ne jouent pas le contre-gambit 4...c5. Reprendre tout de suite par 4...exf3 ramène aux positions habituelles du Blackmar-Diemer accepté, tandis que d'autres coups de développement comme Bf5 ou Nc6 laissent la tension centrale non résolue.
  children:
    - ply: c5
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Đen chơi phản gambit 4...c5, tấn công thẳng vào tốt d4 và để nguyên tốt e4 trên bàn cờ thêm một nước nữa, đúng như tên gọi Brombacher Countergambit.
        en: Black plays the 4...c5 countergambit, striking straight at the d4 pawn and leaving the e4 pawn on the board for one more move, exactly as the Brombacher Countergambit name suggests.
        fr: Les Noirs jouent le contre-gambit 4...c5, frappant directement le pion d4 et laissant le pion e4 sur l'échiquier un coup de plus, exactement comme le nom du Contre-Gambit Brombacher le suggère.
      children:
        - ply: fxe4
          annotation:
            vi: Trắng ăn lại tốt trung tâm bằng tốt f, mở luôn cột f cho xe và chưa cần vội trả lời áp lực từ tốt c5, vì tốt d4 hiện vẫn được hậu d1 bảo vệ.
            en: White recaptures the central pawn with the f-pawn, opening the f-file for the rook in the process and not needing to answer the pressure from c5 yet, since the d4 pawn is still defended by the queen on d1.
            fr: Les Blancs reprennent le pion central avec le pion f, ouvrant du même coup la colonne f pour la tour, et n'ont pas encore besoin de répondre à la pression de c5, puisque le pion d4 reste défendu par la dame en d1.
          outcome:
            type: position
            evaluation:
              vi: Đếm tốt, mỗi bên còn bảy quân, vật chất hoàn toàn cân bằng. Trắng đã có cột f mở cho xe và một tốt trung tâm vững chắc ở e4, còn Đen có sức ép tức thời lên d4 nhưng vẫn chưa phát triển thêm quân nào so với Trắng. Đã thử tiếp tục bằng e6, Nf3, Be7, Bd3, O-O, O-O như kế hoạch bên dưới; vật chất vẫn cân bằng và không có nước nào tạo ra ưu thế rõ ràng cho bên nào — đây thực sự là một thế cờ ngang bằng ở giai đoạn khai cuộc, không phải một đánh giá bị bỏ lửng.
              en: Count the pawns, seven apiece, material is fully level. White already has an open f-file for the rook and a solid central pawn on e4, while Black has immediate pressure on d4 but has not developed any further pieces than White has. Continuing with ...e6, Nf3, ...Be7, Bd3, O-O and ...O-O as in the plan below was tried; material stays level and nothing in it produces a clear edge for either side — this is genuinely an even opening position, not an evaluation left hanging.
              fr: Comptez les pions, sept de chaque côté, le matériel est parfaitement égal. Les Blancs disposent déjà d'une colonne f ouverte pour la tour et d'un pion central solide en e4, tandis que les Noirs exercent une pression immédiate sur d4 sans avoir développé plus de pièces que les Blancs. Poursuivre par ...e6, Nf3, ...Be7, Bd3, O-O et ...O-O comme dans le plan ci-dessous a été essayé ; le matériel reste égal et rien là-dedans ne produit d'avantage net pour un camp ou l'autre — c'est véritablement une position égale de sortie d'ouverture, pas une évaluation laissée en suspens.
            plan:
              vi: Trắng chơi Nf3, Bc4 hoặc Be3 để bảo vệ thêm d4, rồi O-O, tận dụng cột f mở và sự phát triển nhanh. Đen chơi cxd4, Qxd4 hay Nc6, tiếp tục gây sức ép lên trung tâm Trắng và cố khai thác việc vua Trắng còn ở giữa bàn cờ.
              en: White plays Nf3, Bc4 or Be3 to add another defender to d4, then castles, making use of the open f-file and quick development. Black plays cxd4, Qxd4 or Nc6, continuing to press White's center and trying to exploit the fact that White's king is still in the middle of the board.
              fr: Les Blancs jouent Nf3, Bc4 ou Be3 pour ajouter un défenseur à d4, puis roquent, profitant de la colonne f ouverte et d'un développement rapide. Les Noirs jouent cxd4, Qxd4 ou Nc6, continuant à presser le centre blanc et essayant d'exploiter le fait que le roi blanc est encore au milieu de l'échiquier.
            basis:
              by: chan
              at: '2026-09-18'
