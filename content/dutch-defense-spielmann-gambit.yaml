judgement:
  by: chan
  at: '2026-09-30'
  source: Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: 'Trắng vừa chơi 3.g4 sau 2.Nc3 Nf6, hiến một tốt: tốt g4 bị tốt f5 và mã f6 tấn công mà không có quân bảo vệ, còn tốt f5 bị tốt g4 tấn công mà cũng không có quân bảo vệ.'
    en: 'White has just played 3.g4 after 2.Nc3 Nf6, offering a pawn: the g4 pawn is attacked by the f5 pawn and the knight on f6 and has no defender, while the f5 pawn is attacked by the g4 pawn and has no defender either.'
    fr: "Les Blancs viennent de jouer 3.g4 après 2.Nc3 Nf6, offrant un pion : le pion g4 est attaqué par le pion f5 et le cavalier f6 et n'a aucun défenseur, tandis que le pion f5 est attaqué par le pion g4 et n'a pas non plus de défenseur."
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 3...fxg4. Bài này chỉ đi theo nhánh ăn tốt 3...fxg4; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 3...fxg4 here. This entry follows the capture 3...fxg4 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 3...fxg4. Cette fiche ne suit que la prise 3...fxg4 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: fxg4
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen ăn tốt bằng 3...fxg4. Tốt mới ở g4 được mã f6 bảo vệ và không có quân Trắng nào tấn công nó.
        en: Black takes the pawn with 3...fxg4. The new pawn on g4 is defended by the knight on f6 and no White piece attacks it.
        fr: Les Noirs prennent le pion par 3...fxg4. Le nouveau pion g4 est défendu par le cavalier f6 et aucune pièce blanche ne l'attaque.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt, và Đen có hai tốt trên cột g, ở g7 và g4. Tốt g4 được mã f6 bảo vệ và chưa bị quân nào tấn công. Trắng không còn tốt g nên cột g nửa mở cho quân Trắng.'
          en: "Count the pawns: White seven, Black eight, so White is a pawn down, and Black has two pawns on the g-file, on g7 and g4. The g4 pawn is defended by the knight on f6 and attacked by nothing. White has no g-pawn, so the g-file is half open for White's pieces."
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins, et les Noirs ont deux pions sur la colonne g, en g7 et en g4. Le pion g4 est défendu par le cavalier f6 et n'est attaqué par rien. Les Blancs n'ont plus de pion g, si bien que la colonne g est semi-ouverte pour leurs pièces."
        plan:
          vi: Trắng tấn công g4 bằng h3 hoặc phát triển bằng Bg5, đánh vào con mã đang bảo vệ nó. Đen thêm quân bảo vệ bằng ...h5 hoặc ...d6, nước sau mở đường cho tượng c8 tới g4.
          en: White attacks g4 with h3 or develops with Bg5, hitting the knight that defends it. Black adds a defender with ...h5 or ...d6, the latter opening the line from the bishop on c8 to g4.
          fr: Les Blancs attaquent g4 par h3 ou se développent par Bg5, attaquant le cavalier qui le défend. Les Noirs ajoutent un défenseur par ...h5 ou ...d6, ce dernier ouvrant la ligne du fou c8 vers g4.
        basis:
          by: chan
          at: '2026-09-30'
