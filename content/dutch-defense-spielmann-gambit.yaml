# Dutch Defense: Spielmann Gambit. Defining line 1.d4 f5 2.Nc3 Nf6 3.g4.
# Every ply was replayed with chess.js and the leaf was read off its FEN before any sentence was written.
# searchMate at 3 moves from the leaf returns no-mate, so no forced mate is claimed anywhere in this entry.
id: dutch-defense-spielmann-gambit
name: 'Dutch Defense: Spielmann Gambit'
eco: A80
category: gambit
side: white
definingLine:
  - d4
  - f5
  - Nc3
  - Nf6
  - g4
soundness:
  value: unsound
  reviewedAt: '2026-09-30'
  basis:
