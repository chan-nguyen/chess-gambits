    source: >-
      A judgement. White is a pawn down at this point, but the knight on g5 presses on e6,
      f7 and h7, the f6 pawn attacks g7 and Black's c-pawns are doubled; that is treated as
      enough compensation for the line to be labelled sound. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-09-30'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
