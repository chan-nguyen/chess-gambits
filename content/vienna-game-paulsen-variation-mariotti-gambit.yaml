tree:
  annotation:
    vi: 'Đen vừa chơi 5...h4, hiến một tốt: tốt h4 tấn công g3, bị mã f3 và tốt g3 tấn công và được hậu cùng xe bảo vệ. Tượng c5 của Đen cũng nhắm vào f2, chỉ có vua bảo vệ.'
    en: "Black has just played 5...h4, offering a pawn: the h4 pawn attacks g3 and is attacked by the knight on f3 and the g3 pawn and defended by the queen and the rook. Black's bishop on c5 also eyes f2, which only the king defends."
    fr: 'Les Noirs viennent de jouer 5...h4, offrant un pion : le pion h4 attaque g3, est attaqué par le cavalier f3 et le pion g3 et défendu par la dame et la tour. Le fou c5 noir vise aussi f2, que seul le roi défend.'
  dismissRest:
    reason:
      vi: Trắng chọn một nước khác thay vì 6.Nxh4. Bài này chỉ đi theo nhánh ăn tốt 6.Nxh4; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: White plays something other than 6.Nxh4 here. This entry follows the capture 6.Nxh4 only; other moves lead to lines that are not mapped here.
      fr: Les Blancs jouent autre chose que 6.Nxh4. Cette fiche ne suit que la prise 6.Nxh4 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Nxh4
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng ăn tốt bằng 6.Nxh4, loại bỏ con tốt đang tấn công g3; mã giờ đứng ở mép bàn cờ, bị hậu và xe tấn công và chỉ có tốt g3 bảo vệ.
        en: White takes the pawn with 6.Nxh4, removing the pawn that attacked g3; the knight now stands on the rim, attacked by the queen and the rook and defended only by the g3 pawn.
        fr: Les Blancs prennent le pion par 6.Nxh4, supprimant le pion qui attaquait g3 ; le cavalier se trouve maintenant au bord de l'échiquier, attaqué par la dame et la tour et défendu seulement par le pion g3.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng tám, Đen bảy, nên con tốt Đen hiến chưa được lấy lại. Mã h4 bị hậu d8 và xe h8 tấn công hai lần mà chỉ có tốt g3 bảo vệ một lần. Tượng c5 tấn công f2, chỉ có vua bảo vệ, và chưa bên nào nhập thành.'
          en: 'Count the pawns: White eight, Black seven, so the pawn Black offered has not come back. The knight on h4 is attacked twice, by the queen on d8 and the rook on h8, and defended once, by the g3 pawn. The bishop on c5 attacks f2, which only the king defends, and neither king has castled.'
          fr: "Comptez les pions : huit pour les Blancs, sept pour les Noirs ; le pion offert par les Noirs n'est donc pas récupéré. Le cavalier h4 est attaqué deux fois, par la dame d8 et la tour h8, et défendu une fois, par le pion g3. Le fou c5 attaque f2, que seul le roi défend, et aucun roi n'a roqué."
        plan:
          vi: Đen phát triển bằng ...Nf6, tấn công e4, hoặc đánh ở trung tâm bằng ...d5. Trắng củng cố tốt thừa bằng cách đưa mã về Nf3 và nhập thành.
          en: Black develops with ...Nf6, attacking e4, or strikes in the centre with ...d5. White consolidates the extra pawn by retreating the knight with Nf3 and castling.
          fr: Les Noirs se développent par ...Nf6, attaquant e4, ou frappent au centre par ...d5. Les Blancs consolident le pion en plus en ramenant le cavalier par Nf3 et en roquant.
        basis:
          by: chan
          at: '2026-09-30'
