# Van't Kruijs Opening: Keoni-Hiva Gambit, Akahi Variation. Frozen defining line 1.e3 e5
# 2.Nc3 Nf6 3.f4 exf4 4.Nf3, which ends on White's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). The line below was replayed with chess.js before being
# annotated.
id: vant-kruijs-opening-keoni-hiva-gambit-akahi-variation
name: "Van't Kruijs Opening: Keoni-Hiva Gambit, Akahi Variation"
eco: A00
category: gambit
