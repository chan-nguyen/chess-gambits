judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Sau khi đã mất tốt f vào tay Đen, Trắng chơi 4.Nf3, phát triển và chuẩn bị nhập thành thay vì đòi lại con tốt ngay lập tức, dùng nhịp độ để bù cho vật chất.
    en: Having already lost the f-pawn to Black, White plays 4.Nf3, developing and preparing to castle rather than trying to win the pawn back immediately, using tempo to compensate for the material.
    fr: Ayant déjà perdu le pion f au profit des Noirs, les Blancs jouent 4.Nf3, développant et préparant le roque plutôt que de tenter de regagner le pion immédiatement, utilisant le temps pour compenser le matériel.
  dismissRest:
    reason:
      vi: Đen không chọn cách giữ chắc con tốt f4 bằng Bd6. Các nước khác như Nc6 hay d5 phát triển bình thường cũng không trả lại con tốt ngay, nhưng để nó dễ bị Trắng giành lại hơn theo cách khác, nên phần lớn trường hợp cụ thể ấy được gộp vào đây thay vì phân tích riêng.
      en: Black does not choose to hold the f4 pawn firmly with Bd6. Anything else, such as the natural developing Nc6 or d5, does not give the pawn back immediately either, but leaves it easier for White to win back some other way, so those specific cases are folded in here rather than analysed separately.
      fr: Les Noirs ne choisissent pas de garder fermement le pion f4 par Bd6. Tout le reste, comme le développement naturel Nc6 ou d5, ne rend pas non plus le pion immédiatement, mais le laisse plus facile à regagner pour les Blancs d'une autre façon, donc ces cas précis sont regroupés ici plutôt qu'analysés séparément.
  children:
    - ply: Bd6
      replyQuality: best
      frequency: common
      annotation:
        vi: Tượng ra d6, vừa phát triển vừa bảo vệ chắc chắn con tốt f4 dọc đường chéo e5-f4. Đây là cách đơn giản nhất để giữ vững con tốt thừa.
        en: The bishop develops to d6, both developing and firmly defending the f4 pawn along the e5-f4 diagonal. This is the simplest way to hold the extra pawn.
        fr: Le fou se développe en d6, à la fois développant et défendant fermement le pion f4 le long de la diagonale e5-f4. C'est la façon la plus simple de garder le pion supplémentaire.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy. Đen hơn đúng một tốt sạch, con tốt f của Trắng đã mất từ nước 3, và Bd6 vừa bảo vệ chắc chắn con tốt f4 đang giữ được. Cái Trắng có để bù lại chỉ là hai mã đã phát triển và chuẩn bị nhập thành, chưa phải điều gì đáng kể so với một tốt sạch.
          en: Count the pawns and it is eight for Black, seven for White. Black is a clean pawn up, White's f-pawn lost since move three, and Bd6 has just firmly defended the f4 pawn Black is holding. What White has to show for it is only two developed knights and readiness to castle, not much against a clean pawn.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs. Les Noirs ont un pion de plus bien réel, le pion f des Blancs perdu depuis le troisième coup, et Bd6 vient de défendre fermement le pion f4 que les Noirs conservent. Ce que les Blancs ont à montrer pour cela n'est que deux cavaliers développés et la préparation du roque, pas grand-chose face à un pion net.
        plan:
          vi: Trắng chơi O-O, d4 và Ne5 hay g3, cố mở đường cho các quân còn lại và tìm cách gây sức ép lên con tốt f4 trước khi Đen kịp củng cố. Đen chơi O-O, Nc6 và c6 hay d5, hoàn tất phát triển và giữ vững con tốt thừa, sẵn sàng đổi bớt quân khi có lợi.
          en: White plays O-O, d4 and Ne5 or g3, trying to open lines for the remaining pieces and to pressure the f4 pawn before Black can consolidate. Black plays O-O, Nc6 and c6 or d5, completing development and holding the extra pawn firmly, ready to trade pieces when it is favourable.
          fr: Les Blancs jouent O-O, d4 et Ne5 ou g3, en essayant d'ouvrir des lignes pour les pièces restantes et de faire pression sur le pion f4 avant que les Noirs ne puissent consolider. Les Noirs jouent O-O, Nc6 et c6 ou d5, achevant leur développement et gardant fermement le pion supplémentaire, prêts à échanger des pièces quand c'est favorable.
        basis:
          by: chan
          at: '2026-09-18'
