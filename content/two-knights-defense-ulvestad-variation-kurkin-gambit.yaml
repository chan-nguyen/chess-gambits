# Italian Game: Two Knights Defense, Ulvestad Variation, Kurkin Gambit. Frozen defining
# line 1.e4 e5 2.Nf3 Nc6 3.Bc4 Nf6 4.Ng5 d5 5.exd5 b5 6.Bf1 h6 7.Nxf7, which ends on
# White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). Two
# more captures — dxc6 and Bxb5 — are still hanging after the modelled reply, and the
# entry says so with `unsettled`. The line below was replayed with chess.js before being
# annotated.
id: two-knights-defense-ulvestad-variation-kurkin-gambit
name: 'Italian Game: Two Knights Defense, Ulvestad Variation, Kurkin Gambit'
eco: C57
category: gambit
side: white
definingLine: [e4, e5, Nf3, Nc6, Bc4, Nf6, Ng5, d5, exd5, b5, Bf1, h6, Nxf7]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. White gives up a whole knight for one pawn to drag Black's king to f7.
      Two more captures are hanging next move — dxc6 wins back a whole knight, and Bxb5
      wins a further pawn — so White's follow-up here is more concrete than a bare piece
      sacrifice, and once the more significant of the two, dxc6, is cashed in, White is
      only slightly worse rather than a full piece down. But nothing forces mate, Black's
      king on f7 is not under any immediate fire, and that is still short of full
      compensation for the piece given up. No engine was consulted and no database was
      queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
