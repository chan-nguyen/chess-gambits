tree:
  annotation:
    vi: Trắng vừa chơi 6.Ng5, nhắm mã vào f7 và h7; mã được tốt h4 bảo vệ và bị hậu Đen tấn công. Đen hơn một tốt, tám đối bảy, và tốt g4 bị hậu d1 tấn công mà không có quân bảo vệ.
    en: White has just played 6.Ng5, aiming the knight at f7 and h7; the knight is defended by the h4 pawn and attacked by Black's queen. Black is a pawn up, eight to seven, and the pawn on g4 is attacked by the queen on d1 and has no defender.
    fr: Les Blancs viennent de jouer 6.Ng5, dirigeant le cavalier vers f7 et h7 ; le cavalier est défendu par le pion h4 et attaqué par la dame noire. Les Noirs ont un pion de plus, huit contre sept, et le pion g4 est attaqué par la dame d1 sans aucun défenseur.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 6...Nf6. Bài này chỉ đi theo nhánh 6...Nf6; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 6...Nf6 here. This entry follows the reply 6...Nf6 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 6...Nf6. Cette fiche ne suit que la réponse 6...Nf6 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Nf6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen phát triển bằng 6...Nf6, bảo vệ tốt g4 và che luôn h7, đồng thời tấn công tốt e4.
        en: Black develops with 6...Nf6, which defends the pawn on g4 and also covers h7, and attacks the pawn on e4.
        fr: Les Noirs se développent par 6...Nf6, qui défend le pion g4 et couvre aussi h7, tout en attaquant le pion e4.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt. Đen có hai tốt trên cột f, ở f7 và f4, còn tốt g4 bị hậu d1 tấn công và được mã f6 bảo vệ. Mã g5 của Trắng tấn công f7, chỉ có vua bảo vệ, và h7, được xe h8 và mã f6 bảo vệ.'
          en: "Count the pawns: White seven, Black eight, so White is a pawn down. Black has two pawns on the f-file, on f7 and f4, and the g4 pawn is attacked by the queen on d1 and defended by the knight on f6. White's knight on g5 attacks f7, which only the king defends, and h7, which the rook on h8 and the knight on f6 defend."
          fr: 'Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins. Les Noirs ont deux pions sur la colonne f, en f7 et en f4, et le pion g4 est attaqué par la dame d1 et défendu par le cavalier f6. Le cavalier g5 blanc attaque f7, que seul le roi défend, et h7, que la tour h8 et le cavalier f6 défendent.'
        plan:
          vi: Trắng thêm quân tấn công f7 bằng Bc4 và mở trung tâm bằng d4; Đen thách thức mã g5 bằng ...h6 hoặc phản công bằng ...d5.
          en: White adds a second attacker on f7 with Bc4 and opens the centre with d4; Black challenges the knight on g5 with ...h6 or strikes back with ...d5.
          fr: Les Blancs ajoutent un second attaquant sur f7 par Bc4 et ouvrent le centre par d4 ; les Noirs défient le cavalier g5 par ...h6 ou ripostent par ...d5.
        basis:
          by: chan
          at: '2026-09-30'
