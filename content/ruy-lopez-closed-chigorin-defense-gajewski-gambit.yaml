# Ruy Lopez: Closed, Chigorin Defense, Gajewski Gambit. Frozen defining line 1.e4 e5 2.Nf3
# Nc6 3.Bb5 a6 4.Ba4 Nf6 5.O-O Be7 6.Re1 b5 7.Bb3 d6 8.c3 O-O 9.h3 Na5 10.Bc2 d5, which ends
# on Black's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). The
# line below was replayed with chess.js before being annotated; after 11.exd5 the pawn on
# d5 is undefended, so both Qxd5 and Nxd5 are noted as free recaptures rather than modelled
# further.
id: ruy-lopez-closed-chigorin-defense-gajewski-gambit
name: 'Ruy Lopez: Closed, Chigorin Defense, Gajewski Gambit'
eco: C96
category: gambit
side: black
definingLine:
  [e4, e5, Nf3, Nc6, Bb5, a6, Ba4, Nf6, O-O, Be7, Re1, b5, Bb3, d6, c3, O-O, h3, Na5, Bc2, d5]
soundness:
  value: sound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. Black strikes in the centre with 10...d5 from a fully mobilised position,
      and even though White captures first, nothing defends the pawn on d5 afterwards, so the
      material comes straight back — a well-tested central break from the main Chigorin
      complex, judged sound because Black is never actually worse off for having played it.
      No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
