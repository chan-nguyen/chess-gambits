tree:
  annotation:
    vi: Sau khi hoàn tất khai triển và đưa mã sang a5, Đen chơi 10...d5, phá vỡ trung tâm ngay lập tức và thách thức tốt e4 của Trắng.
    en: Having finished mobilising and rerouted the knight to a5, Black plays 10...d5, breaking open the centre at once and challenging White's e4 pawn.
    fr: Une fois la mobilisation achevée et le cavalier réorienté en a5, les Noirs jouent 10...d5, ouvrant le centre d'un coup et défiant le pion e4 blanc.
  dismissRest:
    reason:
      vi: Trắng không ăn con tốt d5. Các nước khác như Nbd2 hay chưa vội ăn liền vẫn để nguyên căng thẳng trung tâm, và Đen tiếp tục kế hoạch của mình mà không gặp trở ngại gì đặc biệt.
      en: White does not take the d5 pawn. Anything else, such as Nbd2 or simply not rushing to capture, leaves the central tension on the board, and Black continues with the plan without meeting any particular obstacle.
      fr: Les Blancs ne prennent pas le pion d5. Tout le reste, comme Nbd2 ou le fait de ne pas se presser de capturer, laisse la tension centrale sur l'échiquier, et les Noirs poursuivent leur plan sans rencontrer d'obstacle particulier.
  children:
    - ply: exd5
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng ăn tốt ngay bằng chính tốt e4, quân duy nhất có thể ăn tại đó.
        en: White takes the pawn at once with the e4 pawn, the only piece that can capture there.
        fr: Les Blancs prennent aussitôt le pion avec leur propre pion e4, la seule pièce pouvant capturer là.
      unsettled: >-
        Both Qxd5 and Nxd5 are going free — nothing of White's defends the d5 square, so Black
        recaptures the pawn at once with either piece.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt ngay tại đây, Trắng 39 còn Đen 38, nhưng con tốt d5 chẳng có quân nào của Trắng bảo vệ, nên Qxd5 hay Nxd5 sẽ lấy lại nó ngay tức khắc. Trong khi đó, toàn bộ cánh hậu của Trắng (mã b1, tượng c1) vẫn còn nguyên trên hàng một, chưa hề động đậy, còn Đen đã hoàn tất phát triển và nhập thành từ trước.
          en: Count the pawns right here, 39 for White against 38 for Black, but nothing of White's defends the pawn on d5, so Qxd5 or Nxd5 wins it straight back at once. Meanwhile the whole of White's queenside (the knight on b1, the bishop on c1) is still sitting untouched on the back rank, while Black finished developing and castled long ago.
          fr: Comptez les pions ici même, 39 pour les Blancs contre 38 pour les Noirs, mais rien du côté blanc ne défend le pion d5, si bien que Qxd5 ou Nxd5 le reprend aussitôt. Pendant ce temps, toute l'aile dame blanche (le cavalier b1, le fou c1) reste intacte sur la première rangée, alors que les Noirs ont depuis longtemps achevé leur développement et roqué.
        plan:
          vi: Đen chơi Nxd5 hoặc Qxd5 lấy lại tốt, rồi tiếp tục với Nc4 hay Bf6, cùng Re8, khai thác việc cánh hậu Trắng còn chậm phát triển. Trắng chơi Nbd2, Nf1 và Ng3, cố gắng gỡ rối cánh hậu và bắt kịp Đen về mặt thời gian trước khi bị ép phải phòng thủ.
          en: Black plays Nxd5 or Qxd5 to win the pawn back, then continues with Nc4 or Bf6, along with Re8, exploiting White's slow queenside development. White plays Nbd2, Nf1 and Ng3, trying to untangle the queenside and catch up on time before being forced onto the back foot.
          fr: Les Noirs jouent Nxd5 ou Qxd5 pour reprendre le pion, puis poursuivent par Nc4 ou Bf6, avec Re8, exploitant le développement lent de l'aile dame blanche. Les Blancs jouent Nbd2, Nf1 et Ng3, essayant de dénouer l'aile dame et de rattraper leur retard de temps avant d'être poussés sur la défensive.
        basis:
          by: chan
          at: '2026-09-25'
