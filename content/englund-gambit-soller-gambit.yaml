# Englund Gambit: Soller Gambit. Frozen defining line 1.d4 e5 2.dxe5 f6, which ends on
# Black's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). The line
# below was replayed with chess.js before being annotated.
id: englund-gambit-soller-gambit
name: 'Englund Gambit: Soller Gambit'
eco: A40
category: gambit
side: black
definingLine: [d4, e5, dxe5, f6]
soundness:
  value: dubious
  reviewedAt: '2026-09-22'
  basis:
    by: chan
    at: '2026-09-22'
    source: >-
      A judgement. White takes the second pawn with exf6, but Black's knight recaptures
      that very pawn back on f6, so the net cost of the whole idea is only the original
      e5 pawn, not two — a single pawn down for a half-open f-file and a developed
      knight is a fair, if unproven, price. No engine was consulted and no database was
      queried.
judgement:
  by: chan
  at: '2026-09-21'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Thay vì đưa mã hay hậu ra để dọa ăn lại tốt e5, Đen chơi 2...f6 ngay, mời Trắng ăn thêm một tốt nữa để đổi lấy việc mở cột f cho xe và một số nhịp phát triển.
    en: Instead of bringing out a knight or the queen to threaten the e5 pawn, Black plays 2...f6 at once, inviting White to take a second pawn in exchange for opening the f-file for a rook and picking up some development.
    fr: Au lieu de sortir un cavalier ou la dame pour menacer le pion e5, les Noirs jouent 2...f6 d'emblée, invitant les Blancs à prendre un second pion en échange de l'ouverture de la colonne f pour une tour et d'un peu de développement.
  dismissRest:
    reason:
      vi: Trắng không ăn con tốt f6. Các nước khác như Nf3 hay e4 để nguyên con tốt f6 trên bàn cờ và Đen sẽ ăn lại tốt e5 ngay bằng fxe5, nghĩa là lời mời vẫn chưa hề được nhận.
      en: White does not take the f6 pawn. Anything else, such as Nf3 or e4, leaves the f6 pawn sitting on the board and Black simply recaptures the e5 pawn at once with fxe5, meaning the offer has still not actually been accepted.
      fr: Les Blancs ne prennent pas le pion f6. Tout le reste, comme Nf3 ou e4, laisse le pion f6 sur l'échiquier et les Noirs reprennent aussitôt le pion e5 par fxe5, ce qui veut dire que l'offre n'a toujours pas été acceptée.
  children:
    - ply: exf6
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng ăn con tốt thứ hai bằng tốt e, quân duy nhất có thể ăn tại đó. Bây giờ Đen phải ăn lại bằng mã từ g8.
        en: White takes the second pawn with the e-pawn, the only piece that can capture there. Now Black has to recapture with the knight from g8.
        fr: Les Blancs prennent le second pion avec le pion e, la seule pièce pouvant capturer là. Les Noirs doivent maintenant reprendre avec le cavalier depuis g8.
      children:
        - ply: Nxf6
          annotation:
            vi: Mã ăn lại ở f6, quân duy nhất có thể ăn tại đó, và cũng là nước phát triển tự nhiên nhất cho Đen.
            en: The knight recaptures on f6, the only piece that can capture there, and also the most natural developing move Black has.
            fr: Le cavalier reprend en f6, la seule pièce pouvant capturer là, et aussi le coup de développement le plus naturel pour les Noirs.
          outcome:
            type: position
            evaluation:
              vi: Đếm tốt thì Trắng bảy, Đen sáu. Con tốt Trắng vừa ăn ở f6 đã bị chính con mã Đen ăn lại ngay, nên cái giá thật sự của cả kế hoạch chỉ là con tốt e5 ban đầu, đúng một tốt chứ không phải hai. Đen có mã đã phát triển ra f6 và cột f nửa mở cho xe f8 sau này, bù lại phần nào cho con tốt đã mất.
              en: Count the pawns and it is seven for White, six for Black. The pawn White had just won on f6 was immediately recaptured by Black's own knight, so the real cost of the whole plan is only the original e5 pawn — one pawn down, not two. Black has a knight already developed to f6 and a half-open f-file for the rook later, some compensation for the pawn that is actually missing.
              fr: Comptez les pions, sept pour les Blancs, six pour les Noirs. Le pion que les Blancs venaient de gagner en f6 a été aussitôt repris par le cavalier noir, si bien que le coût réel de tout le plan n'est que le pion e5 initial, un seul pion et non deux. Les Noirs ont un cavalier déjà développé en f6 et une colonne f semi-ouverte pour la tour plus tard, une certaine compensation pour le pion réellement perdu.
            plan:
              vi: Trắng chơi Nf3, e4 hoặc c4, và Nc3, phát triển nhanh, giữ vững con tốt thừa và chuẩn bị nhập thành trước khi Đen kịp tận dụng cột f. Đen chơi Bc5 hoặc d5, O-O và Re8 hay Rf8 dùng cột nửa mở, cố gây đủ sức ép để bù lại con tốt đã mất.
              en: White plays Nf3, e4 or c4, and Nc3, developing quickly, holding the extra pawn and preparing to castle before Black can make use of the f-file. Black plays Bc5 or d5, O-O and Re8 or Rf8 to use the half-open file, trying to build enough pressure to make up for the lost pawn.
              fr: Les Blancs jouent Nf3, e4 ou c4, et Nc3, se développant rapidement, gardant le pion supplémentaire et se préparant à roquer avant que les Noirs ne puissent exploiter la colonne f. Les Noirs jouent Bc5 ou d5, O-O et Re8 ou Rf8 pour utiliser la colonne semi-ouverte, en essayant de bâtir assez de pression pour compenser le pion perdu.
            basis:
              by: chan
              at: '2026-09-22'
