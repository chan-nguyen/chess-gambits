# King's Gambit Accepted, Kieseritzky Gambit, Anderssen-Cordel Gambit, taught. Frozen
# defining line 1.e4 e5 2.f4 exf4 3.Nf3 g5 4.h4 g4 5.Ne5 Nf6 6.Bc4 d5 7.exd5 Bd6 8.d4 Nh5
# 9.Bxf4, which ends on White's own 9.Bxf4 — the learner's ply — so the root is an opponent
# node (docs/CONTEXT.md, invariant 5). Black's 9...Nxf4 is modelled as the root's single
# reply. Every ply was replayed with chess.js, and the leaf was checked with `searchMate`
# (bounded to 2 moves): no-mate, not in check, no free capture.
id: kings-gambit-accepted-kieseritzky-gambit-anderssen-cordel-gambit
name: "King's Gambit Accepted: Kieseritzky Gambit, Anderssen-Cordel Gambit"
eco: C39
category: gambit
side: white
definingLine: [e4, e5, f4, exf4, Nf3, g5, h4, g4, Ne5, Nf6, Bc4, d5, exd5, Bd6, d4, Nh5, Bxf4]
soundness:
  value: dubious
