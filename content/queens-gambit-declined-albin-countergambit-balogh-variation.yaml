    source: >-
      A judgement. Black gives a pawn for the advanced d4 pawn and quick pressure on e5,
      which two Black pieces attack and only the knight on f3 defends. It is a practical try
      rather than a position where Black can claim an edge, so the label is dubious. No
      engine was consulted and no database was queried.
judgement:
