tree:
  annotation:
    vi: 'Trắng vừa chơi 4.b4, thí tốt b: tốt b4 bị cả tượng c5 lẫn mã c6 tấn công và không quân Trắng nào bảo vệ, còn tượng c5 của Đen cũng bị tốt b4 tấn công mà không ai bảo vệ. Đen phải quyết định có ăn không.'
    en: "White has just played 4.b4, offering the b-pawn: the b4 pawn is attacked by both the bishop on c5 and the knight on c6 and no White piece defends it, while Black's bishop on c5 is attacked by the b4 pawn and is undefended. Black has to decide whether to take."
    fr: "Les Blancs viennent de jouer 4.b4, offrant le pion b : le pion b4 est attaqué à la fois par le fou c5 et par le cavalier c6 et aucune pièce blanche ne le défend, tandis que le fou c5 noir est attaqué par le pion b4 et n'est pas défendu. Les Noirs doivent décider de prendre ou non."
  dismissRest:
    reason:
      vi: Đen chọn nước khác thay vì 4...Bxb4, chẳng hạn 4...Nxb4 hoặc 4...Bb6. Đánh giá trong mục này dành cho nhánh Đen ăn tốt bằng tượng.
      en: Black plays something other than 4...Bxb4, for example 4...Nxb4 or 4...Bb6. The assessment in this entry is for the line where Black takes the pawn with the bishop.
      fr: Les Noirs jouent autre chose que 4...Bxb4, par exemple 4...Nxb4 ou 4...Bb6. L'évaluation de cette fiche porte sur la ligne où les Noirs prennent le pion avec le fou.
  children:
    - ply: Bxb4
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen ăn tốt b bằng tượng, vừa thoát khỏi đòn tấn công của tốt b4 vừa giữ nguyên mã c6 để bảo vệ tượng.
        en: Black takes the b-pawn with the bishop, escaping the attack of the b4 pawn and keeping the knight on c6 to defend the bishop.
        fr: Les Noirs prennent le pion b avec le fou, échappant à l'attaque du pion b4 et gardant le cavalier c6 pour défendre le fou.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám — Trắng kém một tốt, không còn tốt nào trên cột b nên tốt a2 đứng trơ trọi. Tượng b5 của Trắng tấn công mã c6 nhưng mã ấy được cả tốt b7 lẫn d7 bảo vệ, còn tốt e5 của Đen bị mã f3 tấn công và có mã c6 bảo vệ. Tượng b4 của Đen còn ghim tốt d2 vào vua e1, nên Trắng chưa thể chơi d4.'
          en: "Count the pawns: White seven, Black eight — White is a pawn down and has no pawn on the b-file, so the a2 pawn stands alone. White's bishop on b5 attacks the knight on c6, but both the b7 and d7 pawns defend it, and Black's e5 pawn is attacked by the knight on f3 and defended by the knight on c6. Black's bishop on b4 also pins the d2 pawn to the king on e1, so White cannot play d4 yet."
          fr: "Comptons les pions : sept pour les Blancs, huit pour les Noirs — les Blancs ont un pion de moins et n'ont plus de pion sur la colonne b, si bien que le pion a2 reste seul. Le fou b5 blanc attaque le cavalier c6, mais les pions b7 et d7 le défendent tous les deux, et le pion e5 noir est attaqué par le cavalier f3 et défendu par le cavalier c6. Le fou b4 noir cloue en outre le pion d2 au roi e1, si bien que les Blancs ne peuvent pas encore jouer d4."
        plan:
          vi: Trắng chơi c3 để tấn công tượng b4, rồi d4 để chiếm trung tâm hoặc O-O. Đen chơi ...Nf6 và ...O-O để hoàn thành phát triển.
          en: White plays c3 to attack the bishop on b4, then d4 to take the centre, or O-O. Black plays ...Nf6 and ...O-O to finish developing.
          fr: Les Blancs jouent c3 pour attaquer le fou b4, puis d4 pour prendre le centre, ou O-O. Les Noirs jouent ...Nf6 et ...O-O pour achever leur développement.
        basis:
          by: chan
          at: '2026-09-30'
