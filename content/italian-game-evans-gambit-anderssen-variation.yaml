# Italian Game, Evans Gambit, Anderssen Variation. One of a batch of entries authored for
# issue #148 (batch h), sharing the trunk `1.e4 e5 2.Nf3 Nc6 3.Bc4 Bc5 4.b4 Bxb4 5.c3` with
# `italian-game-evans-gambit.yaml` and its siblings `italian-game-evans-gambit-main-line`
# (5...Ba5) and `italian-game-evans-gambit-mcdonnell-defense` (5...Bc5). Defining line ends
# on White's 5.c3 (invariant 5). Every ply below was replayed with chess.js before being
# written.
