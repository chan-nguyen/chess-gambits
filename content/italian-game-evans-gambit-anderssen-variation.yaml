tree:
  annotation:
    vi: Tốt c3 vừa đánh tượng b4 và dọn chỗ cho d4. Mục này đi sâu riêng vào 5...Be7, lui hẳn về hàng ngang đầu.
    en: The c3 pawn has just attacked the bishop on b4 and cleared the way for d4. This entry follows specifically 5...Be7, retreating all the way to the back rank.
    fr: Le pion c3 vient d'attaquer le fou en b4 et de dégager la route de d4. Cette entrée suit spécifiquement 5...Fe7, un retour complet sur la première rangée.
  dismissRest:
    reason:
      vi: Đen đáp lại 5.c3 bằng một nước khác ngoài 5...Be7 — lui về a5 (nhánh chính), c5 (McDonnell), d6 (Stone-Ware) hay f8 (Mayet), hay trả lại tốt bằng 5...d5. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 5.c3 with something other than 5...Be7 — retreating to a5 (the main line), c5 (McDonnell), d6 (Stone-Ware) or f8 (Mayet), or giving the pawn back with 5...d5. Each is outside the scope of this entry.
      fr: Les Noirs répondent à 5.c3 par autre chose que 5...Fe7 — reculant en a5 (la ligne principale), c5 (McDonnell), d6 (Stone-Ware) ou f8 (Mayet), ou rendant le pion par 5...d5. Chacun sort du cadre de cette entrée.
  children:
    - ply: Be7
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Biến Anderssen. Tượng lui hẳn về e7, từ bỏ đường chéo nhắm vào f2 để đổi lấy một vị trí chắc chắn, sẵn sàng nhập thành nhanh.
        en: The Anderssen Variation. The bishop drops all the way back to e7, giving up the diagonal aimed at f2 in exchange for a solid post ready for a quick castle.
        fr: La Variante Anderssen. Le fou recule complètement en e7, abandonnant la diagonale visant f2 en échange d'un poste solide, prêt pour un roque rapide.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy — Đen vẫn hơn đúng một tốt. Con tượng ở e7 không còn gây áp lực gì lên cánh vua Trắng nữa, nhưng đổi lại Đen có thể nhập thành ngay lập tức mà không cần thêm chuẩn bị.
          en: Count the pawns and it is eight for Black, seven for White — Black is still exactly one pawn up. The bishop on e7 no longer puts any pressure on White's kingside, but in exchange Black can castle immediately without any further preparation.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs — les Noirs restent exactement un pion devant. Le fou en e7 ne fait plus pression sur l'aile roi blanche, mais en échange les Noirs peuvent roquer immédiatement sans préparation supplémentaire.
        plan:
          vi: Trắng chơi d4, rồi O-O và Qb3 hoặc Bg5, tận dụng trung tâm và nhịp phát triển để bù cho con tốt đã mất, nhắm vào f7 khi có dịp. Đen chơi Nf6 và O-O ngay lập tức, đưa vua vào nơi an toàn trước khi lo tới việc trả lại con tốt hay không.
          en: White plays d4, then O-O and Qb3 or Bg5, using the centre and the development lead to make up for the lost pawn, eyeing f7 when the chance comes. Black plays Nf6 and castles at once, getting the king to safety before worrying about whether to give the pawn back.
          fr: Les Blancs jouent d4, puis O-O et Qb3 ou Bg5, utilisant le centre et l'avance de développement pour compenser le pion perdu, visant f7 à l'occasion. Les Noirs jouent Nf6 et roquent aussitôt, mettant le roi à l'abri avant de se soucier de rendre ou non le pion.
        basis:
          by: chan
          at: '2026-09-25'
