# Blackmar-Diemer Gambit Accepted, Teichmann Defense. Frozen defining line 1.d4 d5
# 2.e4 dxe4 3.Nc3 Nf6 4.f3 exf3 5.Nxf3, which ends on White's own ply, so the root is
# an opponent node (docs/CONTEXT.md, invariant 5). Replayed with chess.js through
# 5...Bg4. searchMate at 3 moves from the resulting position returns no-mate, so no
# forced mate is claimed anywhere in this entry, and no capture is left going free at
# the leaf.
