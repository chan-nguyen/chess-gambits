# King's Gambit Accepted, Bishop's Gambit, Anderssen Defense. One of eighteen entries tracked
# by issue #111 (group H), sharing the trunk `1.e4 e5 2.f4 exf4 3.Bc4` with
# `kings-gambit-accepted.yaml` and group G (#110). The defining line ends on White's own
# 3.Bc4, the learner's ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
#
# 3...g5 is the Bishop's Gambit's main, most respected defense — the direct analogue of
# 3...g5 against the King's Knight Gambit — and it holds the f4 pawn while fighting for the
# centre. Every move here was replayed with a scratch chess.js script (deleted before commit)
# confirming legality and check status. Under the stricter bar from issue #107, a `position`
# leaf must be clearly decisive, and this is a genuinely contested main line: no forced
# decisive continuation could be established without deeper calculation than a human
# reviewer without engine assistance can respondibly certify, so the line stops at
# `unexplored` per docs/CONTEXT.md's fourth honest stopping point, rather than dressing up an
# unclear position as an advantage for either side.
