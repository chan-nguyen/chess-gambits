# King's Gambit Accepted, Bishop's Gambit, Anderssen Defense. One of eighteen entries tracked
# by issue #111 (group H), sharing the trunk `1.e4 e5 2.f4 exf4 3.Bc4` with
# `kings-gambit-accepted.yaml` and group G (#110). The defining line ends on White's own
# 3.Bc4, the learner's ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
#
# 3...g5 is the Bishop's Gambit's main, most respected defense — the direct analogue of
# 3...g5 against the King's Knight Gambit — and it holds the f4 pawn while fighting for the
# centre. Every move here, and the tried continuation 4.h4 g4 5.Ne2 Nc6 named in the
# evaluation below, was replayed with a scratch chess.js script (deleted before commit)
# confirming legality, check status and material at each ply. Under the stricter bar from
# issue #107, this position genuinely does not resolve to a two-point edge or a structural
# catastrophe for either side after a few plies of testing — Black is a pawn up with a
# committed, slightly loose kingside, and White has open lines but no forced follow-up a
# human reviewer without engine assistance can certify — so the leaf states that plainly
# rather than either forcing a false verdict or reverting to `unexplored`, which would
# discard the position analysis actually done here.
