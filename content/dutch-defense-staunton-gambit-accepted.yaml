                              en: Black does not play ...e6. Moves such as ...g6 or ...d5 are other set-ups, and none of them is mapped here.
                              fr: Les Noirs ne jouent pas ...e6. Des coups comme ...g6 ou ...d5 sont d'autres dispositifs, et aucun n'est cartographié ici.
                          children:
                            - ply: e6
