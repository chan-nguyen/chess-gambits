                                                          en: White adds pieces against the pinned rook and the f6 knight — Bg5, castling and Rf1. Black needs to untangle with ...Be7 and ...Kf8, then bring the queenside pieces out with ...d5 and ...Nc6.
                                                          fr: Les Blancs ajoutent des pièces contre la tour clouée et le cavalier f6 — Bg5, le roque puis Rf1. Les Noirs doivent se démêler par ...Be7 et ...Kf8, puis sortir les pièces de l'aile dame par ...d5 et ...Nc6.
