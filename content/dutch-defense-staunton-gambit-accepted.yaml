                                                    en: The bishop takes the g6 pawn with check and attacks the rook on h7 at the same time. White has given a knight for two pawns, and Black now has to look after both the king and the rook.
                                                    fr: Le fou prend le pion g6 avec échec et attaque en même temps la tour h7. Les Blancs ont donné un cavalier pour deux pions, et les Noirs doivent maintenant s'occuper à la fois du roi et de la tour.
                                                  dismissed:
