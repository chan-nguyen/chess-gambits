                                                      reason: Leaves the rook on h7 en prise. 9.Bxh7 Nxh7 trades a bishop for a rook, which brings the material level, and the king on e7 has lost the right to castle; it is worse for Black than 8...Rf7.
                                                  children:
                                                    - ply: Rf7
                                                      replyQuality: best
                                                      frequency: common
                                                      annotation:
                                                        vi: Xe chạy sang f7, ô duy nhất vừa chắn được nước chiếu vừa giữ được xe. Nhưng giờ nó bị tượng g6 ghim vào vua.
                                                        en: The rook goes to f7, the one square that both blocks the check and saves it. But it is now pinned to the king by the bishop on g6.
                                                        fr: La tour va en f7, la seule case qui pare l'échec tout en la sauvant. Mais elle est maintenant clouée au roi par le fou g6.
                                                      outcome:
                                                        type: position
                                                        evaluation:
                                                          vi: Tính theo quân số, Đen hơn một mã đổi lấy một tốt — hai mã, hai tượng, hai xe và năm tốt đối với một mã, hai tượng, hai xe và sáu tốt. Nhưng xe f7 bị tượng g6 ghim vào vua và không có nước đi nào, xe a8 bị chính quân mình bịt kín, và vua e8 không còn nhập thành cánh vua được nữa.
                                                          en: On the count Black is a knight up for a pawn — two knights, two bishops, two rooks and five pawns against one knight, two bishops, two rooks and six pawns. But the rook on f7 is pinned to the king by the bishop on g6 and has no move, the rook on a8 is shut in by its own pieces, and the king on e8 can no longer castle on the kingside.
                                                          fr: Au compte, les Noirs ont un cavalier de plus pour un pion — deux cavaliers, deux fous, deux tours et cinq pions contre un cavalier, deux fous, deux tours et six pions. Mais la tour f7 est clouée au roi par le fou g6 et n'a aucun coup, la tour a8 est enfermée par ses propres pièces, et le roi e8 ne peut plus roquer côté roi.
                                                        plan:
