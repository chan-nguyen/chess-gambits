                              frequency: common
                              annotation:
                                vi: Đen đi e6 để mở đường cho tượng f8. Nhưng tốt f đã mất, nên f7 chỉ còn vua bảo vệ và g6 chỉ còn tốt h7 bảo vệ.
                                en: Black plays e6 to open the f8 bishop. With the f-pawn gone, though, f7 is guarded only by the king and g6 only by the h7 pawn.
                                fr: Les Noirs jouent e6 pour ouvrir le fou f8. Mais le pion f ayant disparu, f7 n'est plus gardé que par le roi et g6 que par le pion h7.
                              children:
                                - ply: Ng5
                                  annotation:
                                    vi: Mã nhảy lên g5 và tấn công h7 lần thứ hai. Mã g5 và tượng d3 cùng nhắm vào con tốt này, còn xe h8 và mã f6 cùng bảo vệ nó.
                                    en: The knight jumps to g5 and attacks h7 a second time. The knight and the bishop on d3 both aim at the pawn, and the rook on h8 and the knight on f6 both defend it.
                                    fr: Le cavalier saute en g5 et attaque h7 une seconde fois. Le cavalier et le fou d3 visent tous deux le pion, que la tour h8 et le cavalier f6 défendent tous deux.
                                  dismissRest:
                                    reason:
                                      vi: Đen không chơi ...g6. Quân tốt h7 bị tấn công hai lần, bởi mã g5 và tượng d3, và được bảo vệ hai lần, bởi xe h8 và mã f6. Các nước khác, chẳng hạn ...d5, ...Nc6 hay ...d6, xoay quanh sự thật đó theo cách riêng và không nước nào được dựng ở đây.
                                      en: Black does not play ...g6. The pawn on h7 is attacked twice, by the knight on g5 and the bishop on d3, and defended twice, by the rook on h8 and the knight on f6. Other moves, such as ...d5, ...Nc6 or ...d6, are different ways of living with that and none is mapped here.
                                      fr: Les Noirs ne jouent pas ...g6. Le pion h7 est attaqué deux fois, par le cavalier g5 et le fou d3, et défendu deux fois, par la tour h8 et le cavalier f6. D'autres coups, comme ...d5, ...Nc6 ou ...d6, sont d'autres façons de vivre avec cela, et aucun n'est cartographié ici.
                                  children:
                                    - ply: g6
                                      replyQuality: blunder
                                      frequency: occasional
                                      annotation:
                                        vi: Đen đi g6 để chắn đường chéo của tượng d3. Nhưng con tốt g6 giờ đứng cùng đường với h7, và nó chỉ được tốt h7 bảo vệ — một đòn hy sinh sẽ khiến cả hai quân tốt rơi cùng lúc.
                                        en: Black plays g6 to shut the bishop's diagonal. But the pawn on g6 now stands on the same line as h7 and is guarded only by the h7 pawn — a sacrifice will make both fall at once.
                                        fr: Les Noirs jouent g6 pour fermer la diagonale du fou. Mais le pion g6 se tient maintenant sur la même ligne que h7 et n'est gardé que par le pion h7 — un sacrifice va faire tomber les deux à la fois.
                                      children:
                                        - ply: Nxh7
                                          annotation:
                                            vi: Trắng hy sinh mã ở h7. Quân mã này bị xe h8 và mã f6 tấn công mà không có quân nào bảo vệ, nhưng nếu Đen ăn, tốt g6 sẽ bị tượng ăn kèm chiếu.
                                            en: White sacrifices the knight on h7. It is attacked by the rook on h8 and the knight on f6 and defended by nothing, but if Black takes, the g6 pawn is left to the bishop with check.
                                            fr: Les Blancs sacrifient le cavalier en h7. Il est attaqué par la tour h8 et le cavalier f6 et défendu par personne, mais si les Noirs le prennent, le pion g6 est livré au fou avec échec.
                                          dismissRest:
                                            reason:
                                              vi: Đen không ăn lại bằng xe. Ăn bằng mã, ...Nxh7, bị Bxg6+ chiếu ngay, và mọi nước khác đều để con mã Trắng đứng nguyên trên h7. Không đường nào trong số này được dựng ở đây.
                                              en: Black does not recapture with the rook. Recapturing with the knight, ...Nxh7, runs into Bxg6+ at once, and every other reply leaves White's knight standing on h7. None of those lines is mapped here.
                                              fr: Les Noirs ne reprennent pas de la tour. Reprendre du cavalier, ...Nxh7, se heurte aussitôt à Bxg6+, et tout autre coup laisse le cavalier blanc sur h7. Aucune de ces lignes n'est cartographiée ici.
                                          children:
                                            - ply: Rxh7
