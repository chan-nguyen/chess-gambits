                                              frequency: common
                                              annotation:
                                                vi: Đen ăn mã bằng xe, giữ mã f6 ở lại bảo vệ vua.
                                                en: Black takes the knight with the rook, keeping the f6 knight at home.
                                                fr: Les Noirs prennent le cavalier de la tour, gardant le cavalier f6 chez lui.
