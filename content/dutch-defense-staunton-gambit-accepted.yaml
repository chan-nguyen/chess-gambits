# Dutch Defense: Staunton Gambit Accepted. Frozen defining line 1.d4 f5 2.e4, which ends on
# White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). Replayed
# with chess.js through 2...fxe4: Black takes the pawn at once, the only piece that can
# capture there. Nothing is hanging at the resulting position. searchMate at 4 moves from
# this position returns no-mate, so no forced mate is claimed anywhere in this entry.
id: dutch-defense-staunton-gambit-accepted
name: 'Dutch Defense: Staunton Gambit Accepted'
eco: A82
category: gambit
side: white
definingLine: [d4, f5, e4]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. Taking the pawn is the sternest test of the gambit — White gets fast
      development and pressure on the e-file and h5-e8 diagonal, real compensation that is
      not proven to outweigh a clean pawn against accurate defence. No engine was consulted
      and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng chơi 2.e4, mời Đen ăn con tốt trung tâm này ngay sau nước đi đầu tiên của Phòng thủ Hà Lan, đổi lấy việc mở tung trung tâm trước khi Đen kịp hoàn thiện phát triển.
    en: White plays 2.e4, inviting Black to take the central pawn right after the Dutch Defense's very first move, in exchange for ripping the centre open before Black can finish developing.
    fr: Les Blancs jouent 2.e4, invitant les Noirs à prendre le pion central juste après le tout premier coup de la Défense hollandaise, en échange de l'ouverture du centre avant que les Noirs n'achèvent leur développement.
  dismissRest:
    reason:
      vi: Đen không ăn con tốt e4. Các nước như 2...e6 đóng cửa trung tâm hay 2...d6 cũng từ chối gambit theo cách riêng, mỗi cách có trang riêng của nó.
      en: Black does not take the e4 pawn. Moves such as ...e6, closing the centre, or ...d6 also decline the gambit in their own way, each with its own page.
      fr: Les Noirs ne prennent pas le pion e4. Des coups comme ...e6, fermant le centre, ou ...d6 refusent eux aussi le gambit à leur façon, chacun avec sa propre page.
  children:
    - ply: fxe4
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen ăn con tốt ngay lập tức, quân duy nhất có thể ăn tại đó. Con tốt f5 đã hoàn thành việc ăn quân và Đen giờ hơn hẳn một tốt, chấp nhận thử thách gắt gao nhất của gambit.
        en: Black takes the pawn at once, the only piece that can capture there. The f5 pawn has done its capturing and Black is now a clean pawn up, accepting the sternest test of the gambit.
        fr: Les Noirs prennent aussitôt le pion, la seule pièce pouvant capturer là. Le pion f5 a fait sa capture et les Noirs ont maintenant un pion net d'avance, acceptant le test le plus sévère du gambit.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy. Đen hơn đúng một tốt sạch, còn Trắng chưa có gì cụ thể để bù lại ngoài cột e nửa mở và ý định dồn quân nhanh vào vị trí mà con tốt f5 để lại một lỗ hổng ở e6.
          en: Count the pawns and it is eight for Black, seven for White. Black is a clean pawn up, and White has nothing concrete yet to show for it beyond the half-open e-file and the intention to develop quickly into the hole the f5 pawn left behind on e6.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs. Les Noirs ont un pion net d'avance, et les Blancs n'ont encore rien de concret à montrer, hormis la colonne e semi-ouverte et l'intention de se développer rapidement vers le trou laissé en e6 par le pion f5.
        plan:
          vi: Trắng chơi Nc3, Bg5 hay Bc4 và Qe2, dồn quân nhanh vào trung tâm và cột e trước khi Đen kịp củng cố. Đen chơi Nf6, g6 hay c6, hoàn tất phát triển một cách chắc chắn và giữ vững con tốt thừa vào tàn cuộc.
          en: White plays Nc3, Bg5 or Bc4 and Qe2, developing quickly onto the centre and the e-file before Black can consolidate. Black plays ...Nf6, ...g6 or ...c6, completing development soundly and holding the extra pawn for the endgame.
          fr: Les Blancs jouent Nc3, Bg5 ou Bc4 et Qe2, se développant rapidement sur le centre et la colonne e avant que les Noirs ne consolident. Les Noirs jouent ...Nf6, ...g6 ou ...c6, achevant leur développement solidement et gardant le pion supplémentaire pour la finale.
        basis:
          by: chan
          at: '2026-09-25'
