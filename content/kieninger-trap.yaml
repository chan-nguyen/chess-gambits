# The Kieninger Trap, in the Rubinstein line of the Budapest Gambit. The defining line is the
# one the catalogue has frozen for this id — 1.d4 Nf6 2.c4 e5 3.dxe5 Ng4 4.Bf4 Nc6 5.Nf3 Bb4+
# 6.Nbd2 Qe7 — and it ends on Black's own ply, so the root is an opponent node and White's
# losing capture can carry `blunder` (invariant 5).
#
# ECO is A52 and category is `trap`, which is what `tools/catalogue/source/traps.yaml`
# records: a trap carries the ECO of the opening it sits inside (ADR-0008).
#
# Both mates below are claimed with `type: trap` and nothing else. The move counts, the lines
# and the certificates are produced by `npm run prove:mates` and replayed by
# `npm run verify:mates` (ADR-0005). Every other line here was replayed with chess.js.
id: kieninger-trap
name: Kieninger Trap
eco: A52
category: trap
side: black
definingLine: [d4, Nf6, c4, e5, dxe5, Ng4, Bf4, Nc6, Nf3, 'Bb4+', Nbd2, Qe7]
soundness:
  value: sound
  reviewedAt: '2026-09-17'
  basis:
    by: chan
    at: '2026-09-17'
    source: >-
      A judgement, and the same label `traps.yaml` carries. It is about Black's play rather
      than about the trap springing — Black regains the e5 pawn by force here whether or not
      White walks into the mate, so nothing in this entry depends on the opponent
      cooperating. The mate itself is not a judgement; it is proved. No engine was consulted
      and no database was queried.
judgement:
  by: chan
  at: '2026-09-17'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date. The two mates are not — they are machine-proved and replayed by
    CI.
tree:
  annotation:
    vi: Đen vừa chơi Qe7, và bây giờ ba quân Đen là hậu e7, mã g4 và mã c6 đều nhắm vào con tốt e5. Con tượng b4 thì ghim mã d2 vào vua e1. Cái bẫy nằm ở chỗ khi mã g4 ăn ở e5 thì cột e mở ra, hậu e7 nhìn thẳng vào vua e1, và con tốt e2 không còn được phép ăn ở d3 nữa.
    en: Black has just played ...Qe7, and now three black pieces — the queen on e7, the knight on g4 and the knight on c6 — all bear on the e5 pawn. The bishop on b4 pins the knight on d2 to the king on e1. The trap lives in this detail — when the g4 knight captures on e5, the e-file opens, the queen on e7 looks straight at the king on e1, and the e2 pawn is no longer allowed to capture on d3.
    fr: Les Noirs viennent de jouer ...Qe7, et trois pièces noires — la dame en e7, le cavalier g4 et le cavalier c6 — visent désormais le pion e5. Le fou b4 cloue le cavalier d2 sur le roi e1. Le piège tient à ce détail — quand le cavalier g4 prend en e5, la colonne e s'ouvre, la dame e7 regarde droit vers le roi e1, et le pion e2 n'a plus le droit de prendre en d3.
  dismissRest:
    reason:
      vi: Trắng chơi một nước khác. Không nước nào trong hai mươi sáu nước hợp lệ ở đây bị chiếu bí ngay, vì cái bẫy còn cần thêm hai nhịp nữa. Nước 7.Qa4 ghim mã c6 và là thử thách đáng kể nhất, Đen đáp Bxd2+ rồi ăn ở e5. Nước 7.e6 trả tốt lại ngay để phá cấu trúc Đen sau fxe6 hoặc dxe6. Các nước 7.e4, 7.Be3, 7.Rc1 hay 7.Qb3 đều để Đen lấy lại tốt bằng Ngxe5, và phải là mã g4 chứ không phải mã c6, vì chỉ khi mã g4 ăn thì cột e mới mở ra sau lưng con hậu. Không nước nào giữ được con tốt e5.
      en: White plays something else. None of the twenty-six legal moves here is mated on the spot — the trap needs two more moves than this. 7.Qa4 pins the knight on c6 and is the most serious try; Black answers ...Bxd2+ and then takes on e5. 7.e6 gives the pawn straight back to wreck Black's structure after ...fxe6 or ...dxe6. 7.e4, 7.Be3, 7.Rc1 and 7.Qb3 all let Black recover the pawn with ...Ngxe5 — and it must be the g4 knight, not the c6 knight, because only then does the e-file open behind the queen. Nothing here holds the e5 pawn.
      fr: Les Blancs jouent autre chose. Aucun des vingt-six coups légaux d'ici n'est maté sur-le-champ — le piège réclame deux coups de plus. 7.Qa4 cloue le cavalier c6 et constitue l'essai le plus sérieux ; les Noirs répondent ...Bxd2+ puis prennent en e5. 7.e6 rend le pion aussitôt pour abîmer la structure noire après ...fxe6 ou ...dxe6. 7.e4, 7.Be3, 7.Rc1 et 7.Qb3 permettent tous la reprise par ...Ngxe5 — et ce doit être le cavalier g4, non celui de c6, car c'est à cette seule condition que la colonne e s'ouvre derrière la dame. Rien ici ne conserve le pion e5.
  children:
    - ply: a3
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng hỏi con tượng b4 một câu, và đó là câu hỏi hợp lý. Nước này tự nó không sai, nó chỉ đặt con tốt a3 vào đúng chỗ để sau này Trắng ăn ở b4 theo phản xạ. Cái bẫy không nằm ở a3, nó nằm ở nước ăn lại sau đó.
        en: White asks the bishop on b4 a fair question. The move is not wrong in itself; it simply places a pawn on a3 so that White can later take on b4 by reflex. The trap is not in a3 — it is in that recapture.
        fr: Les Blancs posent au fou b4 une question légitime. Le coup n'est pas mauvais en soi ; il place simplement un pion en a3 pour que les Blancs puissent plus tard prendre en b4 par réflexe. Le piège n'est pas dans a3, il est dans cette reprise.
      children:
        - ply: Ngxe5
          annotation:
            vi: Mã g4 ăn ở e5, không phải mã c6. Đây là nước quan trọng nhất của cả mục này. Khi mã g4 rời chỗ và đứng vào e5, cột e chỉ còn một quân chắn là chính con mã ấy, và hậu e7 đã nhìn thấy vua e1 phía sau. Đồng thời Đen lờ luôn câu hỏi đặt cho con tượng b4, và đó là điều Trắng khó tin.
            en: The g4 knight takes on e5, not the c6 knight. This is the most important move in the entry. Once the knight has left g4 and landed on e5, the only piece left blocking the e-file is that same knight, and the queen on e7 can already see the king on e1 behind it. At the same time Black ignores the question put to the bishop on b4, which is the part White finds hard to believe.
            fr: C'est le cavalier g4 qui prend en e5, pas celui de c6. C'est le coup le plus important de cette entrée. Une fois le cavalier parti de g4 et posé en e5, la seule pièce qui obstrue encore la colonne e est ce cavalier même, et la dame e7 aperçoit déjà le roi e1 derrière. Dans le même temps, les Noirs ignorent la question posée au fou b4, et c'est ce que les Blancs ont du mal à croire.
          dismissRest:
            reason:
              vi: Trắng chơi một nước khác, và phần lớn là thua ngay. Mười chín trong hai mươi chín nước hợp lệ ở đây bị 8...Nd3 chiếu bí, vì con tốt e2 ăn ở d3 thì hở vua cho hậu e7, hậu d1 thì bị mã d2 chắn, còn vua e1 thì bị chính quân nhà vây kín. Những nước thoát được là các nước đụng tới ô d3 hoặc xoá con mã e5, tức là Bxe5, Be3, e3, e4 và các nước hậu ra c2, b3, a4, c1 hay b1. Hai nước đáng chơi nhất trong số đó được dựng thành nhánh riêng bên dưới.
              en: White plays something else, and most of it loses at once. Nineteen of the twenty-nine legal moves here are mated by 8...Nd3#, because the e2 pawn capturing on d3 would expose the king to the queen on e7, the queen on d1 is blocked by the knight on d2, and the king on e1 is boxed in by its own pieces. The moves that survive are the ones that touch d3 or remove the knight on e5 — Bxe5, Be3, e3, e4, and the queen to c2, b3, a4, c1 or b1. The two most relevant are modelled below.
              fr: Les Blancs jouent autre chose, et la plupart du temps cela perd sur-le-champ. Dix-neuf des vingt-neuf coups légaux ici sont matés par 8...Nd3#, car la prise en d3 par le pion e2 exposerait le roi à la dame e7, la dame d1 est bloquée par le cavalier d2, et le roi e1 est enfermé par ses propres pièces. Les coups qui survivent sont ceux qui touchent d3 ou éliminent le cavalier e5 — Bxe5, Be3, e3, e4, et la dame en c2, b3, a4, c1 ou b1. Les deux plus pertinents sont modélisés ci-dessous.
          children:
            - ply: axb4
              replyQuality: blunder
              frequency: occasional
              annotation:
                vi: Trắng ăn con tượng. Đây là nước thua, và phần còn lại do máy chứng minh chứ không do người khẳng định.
                en: Taking the bishop. This is the losing move, and what follows is proved by machine rather than asserted by a person.
                fr: Prendre le fou. C'est le coup perdant, et la suite est prouvée par la machine plutôt qu'affirmée par un humain.
              outcome:
                type: trap
            - ply: Nxe5
              replyQuality: best
              frequency: common
              annotation:
                vi: Trắng đổi con mã e5 đi, và đây là cách xử lý đúng. Xoá con mã ấy là xoá luôn nước Nd3, ít nhất là trong một nhịp.
                en: White trades the knight on e5 off, which is the correct handling. Removing that knight removes ...Nd3 — at least for one move.
                fr: Les Blancs échangent le cavalier e5, ce qui est le traitement correct. Supprimer ce cavalier supprime ...Nd3, du moins pour un coup.
              children:
                - ply: Nxe5
                  annotation:
                    vi: Đen ăn lại bằng con mã còn lại, và bàn cờ trở về đúng hình cũ. Lại có một con mã Đen ở e5, lại có hậu e7 sau lưng nó, và con tượng b4 vẫn còn đó chờ bị ăn. Cái bẫy chưa hề biến mất, nó chỉ lùi lại một nhịp.
                    en: Black recaptures with the other knight, and the picture is back exactly as it was. There is again a black knight on e5, again a queen on e7 behind it, and the bishop on b4 is still sitting there waiting to be taken. The trap has not gone away; it has simply moved back one move.
                    fr: Les Noirs reprennent avec l'autre cavalier, et le tableau est exactement le même qu'avant. Il y a de nouveau un cavalier noir en e5, de nouveau une dame en e7 derrière lui, et le fou b4 attend toujours d'être pris. Le piège n'a pas disparu, il a simplement reculé d'un coup.
                  dismissRest:
                    reason:
                      vi: Trắng chơi một nước khác, và cái bẫy vẫn còn nguyên. Mười sáu trong hai mươi lăm nước hợp lệ ở đây vẫn bị 9...Nd3 chiếu bí, đúng theo cơ chế cũ. Các nước thoát được là Bxe5, Be3, e3, e4 và các nước hậu ra c2, b3, a4, c1 hay b1. Trong số đó Bxe5 với Qxe5 sau đó là cách đơn giản nhất để kết thúc mọi chuyện, còn e4 thì mở ô e2 cho vua. Nước axb4 thì được dựng thành nhánh riêng vì nó là nước Trắng muốn chơi nhất.
                      en: White plays something else, and the trap is untouched. Sixteen of the twenty-five legal moves here are still mated by 9...Nd3#, by exactly the same mechanism. The survivors are Bxe5, Be3, e3, e4, and the queen to c2, b3, a4, c1 or b1. Of those, Bxe5 followed by ...Qxe5 is the simplest way to end the whole story, and e4 opens e2 for the king. axb4 gets a branch of its own below, because it is the move White most wants to play.
                      fr: Les Blancs jouent autre chose, et le piège reste intact. Seize des vingt-cinq coups légaux ici sont encore matés par 9...Nd3#, par le mécanisme exact. Les rescapés sont Bxe5, Be3, e3, e4, et la dame en c2, b3, a4, c1 ou b1. Parmi eux, Bxe5 suivi de ...Qxe5 est la façon la plus simple d'en finir, et e4 ouvre e2 au roi. axb4 reçoit sa propre branche ci-dessous, car c'est le coup que les Blancs veulent le plus jouer.
                  children:
                    - ply: axb4
                      replyQuality: blunder
                      frequency: occasional
                      annotation:
                        vi: Trắng cuối cùng vẫn ăn con tượng. Đây là nước thua, và phần còn lại lại do máy chứng minh.
                        en: White takes the bishop after all. This is the losing move, and again what follows is proved by machine.
                        fr: Les Blancs finissent par prendre le fou. C'est le coup perdant, et là encore la suite est prouvée par la machine.
                      outcome:
                        type: trap
                    - ply: e3
                      replyQuality: good
                      frequency: common
                      annotation:
                        vi: Trắng đẩy tốt e và mở ô e2 cho vua, và như thế nước Nd3 không còn là chiếu bí. Đây là nước phòng thủ ít tốn kém nhất, nhưng nó vẫn chưa trả lời câu hỏi con tượng b4.
                        en: White pushes the e-pawn and opens e2 for the king, and with that ...Nd3 stops being mate. It is the cheapest defence available, but it still leaves the question of the bishop on b4 unanswered.
                        fr: Les Blancs poussent le pion e et ouvrent e2 au roi, et dès lors ...Nd3 n'est plus mat. C'est la défense la moins coûteuse, mais elle laisse toujours sans réponse la question du fou b4.
                      outcome:
                        type: position
                        evaluation:
                          vi: Quân số ngang nhau. Đen đã lấy lại con tốt e5 và có một con mã đứng rất tốt ở e5, hậu ở e7 trên cột nửa mở, còn vua Trắng thì vẫn ở e1 và chưa nhập thành được ngay vì tượng f1 chưa ra. Con tượng b4 của Đen đang bị tốt a3 đánh nên Đen phải giải quyết nó, bằng Bxd2+ để đổi hoặc bằng Bc5 và Ba5 để giữ. Thế cờ cân bằng và Đen đã đạt được đúng điều gambit Budapest hứa hẹn.
                          en: Material is level. Black has recovered the e5 pawn and has an excellent knight on e5, a queen on e7 on a half-open file, while White's king is still on e1 and cannot castle yet because the f1 bishop has not moved. Black's bishop on b4 is attacked by the a3 pawn and has to be resolved — with ...Bxd2+ to trade, or ...Bc5 or ...Ba5 to keep it. The position is balanced and Black has got exactly what the Budapest promises.
                          fr: Le matériel est égal. Les Noirs ont récupéré le pion e5 et disposent d'un excellent cavalier en e5, d'une dame en e7 sur une colonne semi-ouverte, tandis que le roi blanc est encore en e1 et ne peut pas roquer car le fou f1 n'a pas bougé. Le fou noir en b4 est attaqué par le pion a3 et doit être réglé — par ...Bxd2+ pour échanger, ou ...Bc5 ou ...Ba5 pour le conserver. La position est équilibrée et les Noirs ont obtenu exactement ce que promet le Budapest.
                        plan:
                          vi: Đen chơi Bxd2+ để đổi con mã đang giữ ô d3 và e4, hoặc Bc5 nếu muốn giữ cặp tượng, rồi O-O, d6, Bf5 hay Be6 và Rfe8 trên cột e. Con mã e5 là quân mạnh nhất của Đen, đừng đổi nó vô cớ. Trắng phải chơi Be2 và O-O thật nhanh để thoát khỏi cột e, rồi Nf3 hoặc Nb3 đưa mã trở lại và b4 với c5 để chiếm cánh hậu. Chừng nào vua Trắng còn ở e1 thì Trắng còn phải đếm lại ô d3 trước mỗi nước.
                          en: Black plays ...Bxd2+ to trade off the knight that guards d3 and e4, or ...Bc5 to keep the bishop pair, then castles, ...d6, ...Bf5 or ...Be6 and ...Rfe8 on the e-file. The knight on e5 is Black's best piece and should not be traded without reason. White must play Be2 and castle quickly to get off the e-file, then bring the knight back with Nf3 or Nb3 and take the queenside with b4 and c5. As long as the white king sits on e1, White has to recount the d3 square before every move.
                          fr: Les Noirs jouent ...Bxd2+ pour échanger le cavalier qui garde d3 et e4, ou ...Bc5 pour conserver la paire de fous, puis roquent, ...d6, ...Bf5 ou ...Be6 et ...Rfe8 sur la colonne e. Le cavalier e5 est la meilleure pièce noire et ne doit pas être échangé sans raison. Les Blancs doivent jouer Be2 et roquer vite pour quitter la colonne e, puis ramener le cavalier par Nf3 ou Nb3 et prendre l'aile dame par b4 et c5. Tant que le roi blanc reste en e1, les Blancs doivent recompter la case d3 avant chaque coup.
                        basis:
                          by: chan
                          at: '2026-09-17'
    - ply: e3
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Trắng mở ô e2 cho vua và chuẩn bị Be2 cùng O-O, không thèm hỏi con tượng b4. Đây là cách chơi điềm tĩnh và nó tránh được cái bẫy hoàn toàn, đơn giản vì vua sẽ không còn bị vây.
        en: White opens e2 for the king and prepares Be2 and castling, without bothering to ask the bishop on b4 anything. It is the calm treatment and it sidesteps the trap completely, simply because the king will no longer be boxed in.
        fr: Les Blancs ouvrent e2 au roi et préparent Be2 puis le roque, sans se soucier d'interroger le fou b4. C'est le traitement calme et il évite complètement le piège, tout bonnement parce que le roi ne sera plus enfermé.
      children:
        - ply: Ngxe5
          annotation:
            vi: Đen lấy lại con tốt, và vẫn bằng con mã g4 chứ không phải mã c6. Thói quen này đáng giữ, vì nó mở cột e và giữ áp lực lên vua Trắng cho đến khi Trắng nhập thành xong.
            en: Black takes the pawn back, and still with the g4 knight rather than the one on c6. The habit is worth keeping, because it opens the e-file and keeps the pressure on the white king until White has castled.
            fr: Les Noirs reprennent le pion, et toujours avec le cavalier g4 plutôt que celui de c6. L'habitude vaut la peine d'être gardée, car elle ouvre la colonne e et maintient la pression sur le roi blanc jusqu'à ce que les Blancs aient roqué.
          outcome:
            type: position
            evaluation:
              vi: Quân số ngang nhau và gambit đã hoàn thành nhiệm vụ. Đen có mã ở e5, hậu ở e7 nhìn dọc cột e, và con tượng b4 đang ghim mã d2 vào vua e1, nên Trắng chưa thể chơi Nxe5 hay bất cứ nước nào làm hở đường chéo ấy. Trắng có tốt c4 và một chút không gian ở cánh hậu. Thế cờ cân bằng, nhưng bên phải cẩn thận trong vài nước tới là Trắng.
              en: Material is level and the gambit has done its job. Black has a knight on e5, a queen on e7 looking down the e-file, and the bishop on b4 pinning the knight on d2 to the king on e1, so White cannot yet play Nxe5 or anything that opens that diagonal. White has the c4 pawn and a little queenside space. The position is balanced, but for the next few moves it is White who has to be careful.
              fr: Le matériel est égal et le gambit a rempli son office. Les Noirs ont un cavalier en e5, une dame en e7 qui plonge sur la colonne e, et le fou b4 qui cloue le cavalier d2 sur le roi e1, si bien que les Blancs ne peuvent pas encore jouer Nxe5 ni rien qui ouvre cette diagonale. Les Blancs ont le pion c4 et un peu d'espace à l'aile dame. La position est équilibrée, mais ce sont les Blancs qui doivent être prudents dans les prochains coups.
            plan:
              vi: Đen chơi O-O và Re8 để ép vào cột e khi vua Trắng còn ở đó, giữ ghim ở b4 càng lâu càng tốt, rồi d6, Bf5 hoặc Bg4 và a5 để giữ ô b4. Nếu Trắng ép được bằng Be2 và O-O thì Đen đổi ở d2 rồi chơi d6 với một thế cờ hoàn toàn ổn. Trắng phải chơi Be2 và O-O thật nhanh, rồi Nb3 hoặc Nf3 gỡ ghim, b4 và c5 để dùng không gian cánh hậu, và Qc2 với Rfd1 sau đó.
              en: Black castles and puts a rook on e8 to press the file while the white king is still on it, keeps the pin on b4 as long as possible, then plays ...d6, ...Bf5 or ...Bg4 and ...a5 to hold the b4 square. If White manages Be2 and O-O, Black trades on d2 and plays ...d6 with a perfectly sound game. White must play Be2 and castle quickly, then unpin with Nb3 or Nf3, use the queenside space with b4 and c5, and follow with Qc2 and Rfd1.
              fr: Les Noirs roquent et posent une tour en e8 pour peser sur la colonne tant que le roi blanc s'y trouve, maintiennent le clouage en b4 le plus longtemps possible, puis jouent ...d6, ...Bf5 ou ...Bg4 et ...a5 pour tenir la case b4. Si les Blancs parviennent à Be2 et au roque, les Noirs échangent en d2 et jouent ...d6 avec un jeu parfaitement sain. Les Blancs doivent jouer Be2 et roquer vite, puis déclouer par Nb3 ou Nf3, exploiter l'espace à l'aile dame par b4 et c5, et enchaîner Qc2 et Rfd1.
            basis:
              by: chan
              at: '2026-09-17'
