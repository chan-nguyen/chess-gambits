# King's Gambit Accepted, Kieseritzky Gambit, Long Whip, taught. Shares its 9-ply root,
# 1.e4 e5 2.f4 exf4 3.Nf3 g5 4.h4 g4 5.Ne5, with `kings-gambit-accepted-kieseritzky-gambit`,
# so `definingLine` stops there — the learner's own 5.Ne5 — and Black's 5...h5, the move
# that gives this entry its name, is modelled as the root's own reply (docs/CONTEXT.md,
# invariant 5). Every ply was replayed with chess.js, and the leaf was checked with
# `searchMate` (bounded to 2 moves): no-mate, not in check, no free capture.
id: kings-gambit-accepted-kieseritzky-gambit-long-whip
name: "King's Gambit Accepted: Kieseritzky Gambit, Long Whip"
eco: C39
category: gambit
side: white
definingLine: [e4, e5, f4, exf4, Nf3, g5, h4, g4, Ne5]
soundness:
  value: dubious
  reviewedAt: '2026-09-29'
  basis:
    by: chan
    at: '2026-09-29'
    source: >-
      A judgement. The most classical way to meet 3...g5: White provokes ...g4 with 4.h4
      first, then jumps the knight to e5 where it eyes f7 and cannot easily be evicted. Real,
      dangerous compensation for the pawn rather than a proven refutation. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-29'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Sau khi ép Đen phải đẩy tốt lên g4 bằng 4.h4, Trắng nhảy mã vào e5, một ô trung tâm mà con mã khó bị đuổi và đang nhòm thẳng vào f7.
    en: Having provoked ...g4 with 4.h4, White jumps the knight into e5, a central square from which it is hard to evict and from which it already eyes f7.
    fr: Après avoir provoqué ...g4 par 4.h4, les Blancs sautent le cavalier en e5, une case centrale d'où il est difficile à déloger et d'où il vise déjà f7.
  dismissRest:
    reason:
      vi: Đen chọn một cách phòng thủ khác thay vì 5...h5 — nhiều biến trong số đó đã có tên riêng và mục riêng, chẳng hạn ...Nf6, ...Nh6 hay ...d6, mỗi cách nhằm hoặc đuổi mã e5, hoặc hoàn tất phát triển, hoặc cả hai. Nằm ngoài phạm vi mục này.
      en: Black chooses a different defence instead of 5...h5 — several of these already have their own name and their own entry, such as ...Nf6, ...Nh6 or ...d6, each aiming to chase the e5 knight, finish development, or both. Outside the scope of this entry.
      fr: Les Noirs choisissent une autre défense que 5...h5 — plusieurs d'entre elles ont déjà leur propre nom et leur propre entrée, comme ...Nf6, ...Nh6 ou ...d6, chacune visant à chasser le cavalier e5, à achever le développement, ou les deux. Hors du cadre de cette entrée.
  children:
    - ply: h5
      replyQuality: inaccuracy
      frequency: rare
      annotation:
        vi: Đen đẩy thêm tốt lên h5 để giữ chắc con tốt g4, nhưng chưa đưa ra bất kỳ quân nào.
        en: Black pushes the pawn on to h5 to firmly hold the g4 pawn, but has not brought out a single piece yet.
        fr: Les Noirs poussent le pion jusqu'en h5 pour bien tenir le pion g4, mais n'ont encore sorti aucune pièce.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng bảy, Đen tám — Trắng vẫn kém một tốt như từ đầu. Toàn bộ các quân của Đen, trừ tốt, vẫn còn nguyên trên hàng tám — chưa mã, chưa tượng, chưa hậu nào được đưa ra — trong khi con mã Trắng đã đứng vững trên e5 và nhòm thẳng f7.
          en: Count the pawns and it is seven for White, eight for Black — the same pawn deficit as from the start. Every Black piece except the pawns is still sitting on the back rank — no knight, bishop or queen has moved — while White's knight already stands firm on e5, eyeing f7 directly.
          fr: Comptez les pions, sept pour les Blancs, huit pour les Noirs — le même déficit qu'au départ. Toutes les pièces noires, hormis les pions, restent sur la huitième rangée — aucun cavalier, fou ou dame n'a bougé — alors que le cavalier blanc est déjà solidement posté en e5, visant directement f7.
        plan:
          vi: Trắng chơi Bc4 nhắm f7, d4 để dựng trung tâm, và tranh thủ thời gian Đen chưa phát triển được quân nào để tổ chức tấn công nhanh. Đen chơi ...Nf6 hoặc ...d6 gấp để bắt kịp phát triển và đuổi con mã e5 trước khi bị Trắng khai thác quá đà.
          en: White plays Bc4 aiming at f7, d4 to build the centre, and uses the time Black has spent with no piece developed to organise a fast attack. Black plays ...Nf6 or ...d6 urgently to catch up on development and chase the e5 knight before White exploits the lead too far.
          fr: Les Blancs jouent Bc4 en visant f7, d4 pour bâtir le centre, et profitent du temps que les Noirs ont passé sans développer une seule pièce pour organiser une attaque rapide. Les Noirs jouent ...Nf6 ou ...d6 en urgence pour rattraper leur développement et chasser le cavalier e5 avant que les Blancs n'en profitent davantage.
        basis:
          by: chan
          at: '2026-09-29'
