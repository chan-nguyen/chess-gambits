# Ruy Lopez: Schliemann Defense, Classical Variation. Frozen defining line 1.e4 e5 2.Nf3 Nc6
# 3.Bb5 f5 4.Nc3 fxe4 5.Nxe4 d5 6.Nxe5 dxe4 7.Nxc6 Qg5, which ends on Black's own ply, so the root is
# an opponent node (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 8.Nd4+ Bd7 9.Bxd7+
# Kxd7 10.O-O. Every knight move from c6 is a discovered check from the bishop on b5, and 8.Nd4+ is
# the one where the knight then defends that bishop. searchMate at 3 moves from the resulting
# position returns no-mate, so no forced mate is claimed anywhere in this entry, and no capture is
# left going free at the leaf.
id: ruy-lopez-schliemann-defense-classical-variation
name: 'Ruy Lopez: Schliemann Defense, Classical Variation'
eco: C63
category: gambit
side: black
definingLine: [e4, e5, Nf3, Nc6, Bb5, f5, Nc3, fxe4, Nxe4, d5, Nxe5, dxe4, Nxc6, Qg5]
soundness:
  value: dubious
  reviewedAt: '2026-09-30'
  basis:
    by: chan
    at: '2026-09-30'
    source: A judgement. At the leaf Black is a pawn down, six pawns to seven, its e4 pawn is isolated, its king stands on d7 without castling rights, and the knight on g8, the bishop on f8 and both rooks have not moved. The queen on g5 has no pawn to take for free. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-30'
  source: Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen vừa chơi 7...Qg5. Trắng hơn một tốt, bảy so với sáu. Mã c6 của Trắng che đường chéo của tượng b5 tới vua e8, nên mọi nước đi của mã đều là chiếu lộ. Hậu g5 của Đen thì tấn công cả tượng b5 lẫn tốt g2, và không quân Trắng nào bảo vệ hai quân đó.
    en: Black has just played 7...Qg5. White is a pawn up, seven to six. White's knight on c6 stands in front of the bishop on b5's diagonal to the king on e8, so every move of that knight is a discovered check. Black's queen on g5 attacks both the bishop on b5 and the g2 pawn, and no White piece defends either.
    fr: Les Noirs viennent de jouer 7...Qg5. Les Blancs ont un pion de plus, sept contre six. Le cavalier c6 blanc se trouve devant la diagonale du fou b5 vers le roi e8, si bien que chaque coup de ce cavalier est un échec à la découverte. La dame g5 noire attaque à la fois le fou b5 et le pion g2, et aucune pièce blanche ne défend l'un ni l'autre.
  dismissRest:
    reason:
      vi: Trắng chọn nước khác thay vì 8.Nd4+, chẳng hạn 8.Nxa7+ hoặc 8.Ne5+. Đánh giá trong mục này dành cho nhánh Trắng đưa mã tới d4, vừa chiếu lộ vừa bảo vệ tượng b5.
      en: White plays something other than 8.Nd4+, for example 8.Nxa7+ or 8.Ne5+. The assessment in this entry is for the line where White puts the knight on d4, giving the discovered check and defending the bishop on b5 at once.
      fr: Les Blancs jouent autre chose que 8.Nd4+, par exemple 8.Nxa7+ ou 8.Ne5+. L'évaluation de cette fiche porte sur la ligne où les Blancs placent le cavalier en d4, donnant l'échec à la découverte et défendant en même temps le fou b5.
  children:
    - ply: Nd4+
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng đưa mã tới d4 với nước chiếu lộ của tượng b5. Mã d4 đồng thời bảo vệ chính tượng b5 đang bị hậu g5 tấn công.
        en: White puts the knight on d4 with a discovered check from the bishop on b5. The knight on d4 also defends that bishop, which the queen on g5 attacks.
        fr: Les Blancs placent le cavalier en d4 avec un échec à la découverte du fou b5. Le cavalier d4 défend aussi ce fou, que la dame g5 attaque.
      children:
        - ply: Bd7
          annotation:
            vi: Đen chặn chiếu bằng tượng từ c8, giữ vua ở lại e8 thêm một nước.
            en: Black blocks the check with the bishop from c8, keeping the king on e8 for one more move.
            fr: Les Noirs parent l'échec avec le fou de c8, gardant le roi en e8 un coup de plus.
          dismissRest:
            reason:
              vi: Trắng chơi nước khác thay vì 9.Bxd7+, chẳng hạn 9.Bf1. Đánh giá trong mục này dành cho nhánh Trắng đổi tượng ngay.
              en: White plays something other than 9.Bxd7+, for example 9.Bf1. The assessment in this entry is for the line where White trades the bishops at once.
              fr: Les Blancs jouent autre chose que 9.Bxd7+, par exemple 9.Bf1. L'évaluation de cette fiche porte sur la ligne où les Blancs échangent les fous tout de suite.
          children:
            - ply: Bxd7+
              replyQuality: good
              frequency: common
              annotation:
                vi: Trắng ăn tượng d7 với nước chiếu. Vua Đen có thể ăn lại hoặc né sang d8, e7 hay f7.
                en: White takes the bishop on d7 with check. The black king can recapture or step to d8, e7 or f7.
                fr: Les Blancs prennent le fou d7 avec échec. Le roi noir peut reprendre ou se mettre en d8, e7 ou f7.
              children:
                - ply: Kxd7
                  annotation:
                    vi: Vua Đen ăn lại tượng. Vua đứng trên d7 và mất quyền nhập thành, còn hậu g5 vẫn tấn công tốt g2.
                    en: The black king recaptures the bishop. The king stands on d7 and has lost the right to castle, while the queen on g5 still attacks the g2 pawn.
                    fr: Le roi noir reprend le fou. Le roi se trouve en d7 et a perdu le droit au roque, tandis que la dame g5 attaque toujours le pion g2.
                  dismissRest:
                    reason:
                      vi: Trắng chơi nước khác thay vì 10.O-O, chẳng hạn 10.g3. Đánh giá trong mục này dành cho nhánh Trắng nhập thành để bảo vệ tốt g2.
                      en: White plays something other than 10.O-O, for example 10.g3. The assessment in this entry is for the line where White castles, which also defends the g2 pawn.
                      fr: Les Blancs jouent autre chose que 10.O-O, par exemple 10.g3. L'évaluation de cette fiche porte sur la ligne où les Blancs roquent, ce qui défend aussi le pion g2.
                  children:
                    - ply: O-O
                      replyQuality: good
                      frequency: common
                      annotation:
                        vi: 'Trắng nhập thành: vua g1 giờ bảo vệ tốt g2, nên hậu g5 không còn ăn được tốt nào miễn phí.'
                        en: 'White castles: the king on g1 now defends the g2 pawn, so the queen on g5 has no pawn to take for free.'
                        fr: "Les Blancs roquent : le roi g1 défend maintenant le pion g2, si bien que la dame g5 n'a plus de pion à prendre gratuitement."
                      outcome:
                        type: position
                        evaluation:
                          vi: 'Đếm tốt: Trắng bảy, Đen sáu — Đen kém một tốt, và tốt e4 của Đen bị cô lập vì không còn tốt d hay tốt f. Vua Đen đứng trên d7 và mất quyền nhập thành, còn mã g8, tượng f8 và cả hai xe vẫn chưa rời ô xuất phát.'
                          en: "Count the pawns: White seven, Black six — Black is a pawn down, and Black's e4 pawn is isolated with no d-pawn or f-pawn beside it. Black's king stands on d7 and has lost the right to castle, and the knight on g8, the bishop on f8 and both rooks have not yet left their starting squares."
                          fr: "Comptons les pions : sept pour les Blancs, six pour les Noirs — les Noirs ont un pion de moins, et le pion e4 noir est isolé, sans pion d ni pion f à côté de lui. Le roi noir se trouve en d7 et a perdu le droit au roque, et le cavalier g8, le fou f8 et les deux tours n'ont pas encore quitté leur case de départ."
                        plan:
                          vi: Trắng chơi Nf3 để đuổi hậu và d3 để mở đường đánh vào tốt e4 bị cô lập. Đen chơi ...Nf6 để bảo vệ tốt e4, ...Re8 và ...Kc8 để đưa vua về chỗ an toàn hơn.
                          en: White plays Nf3 to chase the queen and d3 to open lines against the isolated e4 pawn. Black plays ...Nf6 to defend the e4 pawn, then ...Re8 and ...Kc8 to bring the king to a safer square.
                          fr: Les Blancs jouent Nf3 pour chasser la dame et d3 pour ouvrir des lignes contre le pion e4 isolé. Les Noirs jouent ...Nf6 pour défendre le pion e4, puis ...Re8 et ...Kc8 pour mettre le roi sur une case plus sûre.
                        basis:
                          by: chan
                          at: '2026-09-30'
