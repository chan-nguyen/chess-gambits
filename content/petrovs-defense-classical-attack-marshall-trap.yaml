# Petrov's Defense: Classical Attack, Marshall Trap. Frozen defining line 1.e4 e5 2.Nf3 Nf6
# 3.Nxe5 d6 4.Nf3 Nxe4 5.d4 d5 6.Bd3 Bd6 7.O-O O-O 8.c4 Bg4 9.cxd5 f5 10.Re1 Bxh2+ ends on
# Black's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). Part of
# batch t of round 4 (#182). Every ply below was replayed with chess.js before it was
# annotated; searchMate at 3 moves from the leaf returns no-mate, so no forced mate is claimed
# anywhere in this entry, and no capture is left going free at the leaf.
id: 'petrovs-defense-classical-attack-marshall-trap'
name: "Petrov's Defense: Classical Attack, Marshall Trap"
