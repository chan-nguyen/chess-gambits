tree:
  annotation:
    vi: Trắng vừa chơi 8.Qf2. Hậu tấn công mã f6, vốn được hai tốt e7 và g7 bảo vệ, và giữ tốt d4 khỏi hậu Đen. Trắng có hai tượng và một mã, Đen có một tượng và hai mã.
    en: White has just played 8.Qf2. The queen attacks the knight on f6, which the pawns on e7 and g7 defend, and keeps the d4 pawn safe from Black's queen. White has two bishops and one knight, Black one bishop and two knights.
    fr: Les Blancs viennent de jouer 8.Qf2. La dame attaque le cavalier f6, que les pions e7 et g7 défendent, et garde le pion d4 de la dame noire. Les Blancs ont deux fous et un cavalier, les Noirs un fou et deux cavaliers.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 8...e6. Bài này chỉ đi theo nhánh 8...e6; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 8...e6 here. This entry follows the reply 8...e6 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 8...e6. Cette fiche ne suit que la réponse 8...e6 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: e6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen chơi 8...e6, mở đường cho tượng f8 và để mã f6 được tốt g7 và hậu d8 bảo vệ.
        en: Black plays 8...e6, which opens the diagonal for the bishop on f8 and leaves the knight on f6 defended by the g7 pawn and the queen on d8.
        fr: Les Noirs jouent 8...e6, qui ouvre la diagonale du fou f8 et laisse le cavalier f6 défendu par le pion g7 et la dame d8.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng sáu, Đen bảy, nên Trắng kém một tốt. Trắng có cặp tượng còn Đen có một tượng và hai mã. Tốt d4 bị hậu d8 tấn công một lần và được hậu f2 bảo vệ một lần.'
          en: 'Count the pawns: White six, Black seven, so White is a pawn down. White has the pair of bishops while Black has one bishop and two knights. The d4 pawn is attacked once, by the queen on d8, and defended once, by the queen on f2.'
          fr: 'Comptez les pions : six pour les Blancs, sept pour les Noirs ; les Blancs sont donc un pion en moins. Les Blancs ont la paire de fous, les Noirs un fou et deux cavaliers. Le pion d4 est attaqué une fois, par la dame d8, et défendu une fois, par la dame f2.'
        plan:
          vi: Trắng phát triển hai tượng bằng Bd3 và Be3 để dùng cặp tượng. Đen phát triển bằng ...Bd6 và ...Nbd7 rồi nhập thành, giữ con tốt thừa.
          en: White develops the two bishops with Bd3 and Be3 to put the bishop pair to use. Black develops with ...Bd6 and ...Nbd7 and castles, keeping the extra pawn.
          fr: Les Blancs développent les deux fous par Bd3 et Be3 pour mettre la paire de fous à profit. Les Noirs se développent par ...Bd6 et ...Nbd7 puis roquent, en gardant le pion en plus.
