tree:
  annotation:
    vi: Trắng chơi 4.d4 rồi 5.c3 mời Đen ăn tốt, nhưng đây là nhánh Đen từ chối lời mời ấy.
    en:
      White plays 4.d4 and then 5.c3, inviting Black to take the pawn, but this is the branch where
      Black declines that invitation.
    fr:
      Les Blancs jouent 4.d4 puis 5.c3, invitant les Noirs à prendre le pion, mais c'est la branche où
      les Noirs déclinent cette invitation.
  dismissRest:
    reason:
      vi:
        Đen ăn tốt bằng dxc3 hoặc chơi nước khác ngoài d5. Nếu ăn tốt, ván cờ chuyển sang biến Göring
        Gambit chấp nhận với đánh giá khác hẳn; các nước từ chối khác thường dẫn tới thế cờ tương tự
        d5.
      en:
        Black takes the pawn with dxc3, or plays something other than d5. Taking it shifts the game into
        the Göring Gambit Accepted with a quite different assessment; other declining tries usually
        lead to a position similar to d5.
      fr:
        Les Noirs prennent le pion par dxc3, ou jouent autre chose que d5. La prise fait basculer la
        partie vers le Gambit Göring accepté avec une évaluation bien différente ; les autres refus
        mènent généralement à une position semblable à d5.
  children:
    - ply: d5
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen từ chối ăn tốt c3, phản kích ngay ở trung tâm bằng d5 thay vì tham lam giữ tốt thừa.
        en:
          Black declines the c3 pawn, striking back in the centre with d5 at once instead of greedily
          holding the extra pawn.
        fr:
          Les Noirs déclinent le pion c3, frappant aussitôt le centre par d5 au lieu de garder avidement
          le pion supplémentaire.
      outcome:
        type: position
        evaluation:
          vi:
            Đếm tốt, hai bên đều có 8 — Đen chưa ăn tốt c3 nên vật chất vẫn cân bằng, nhưng con tốt d4 của
            Đen (từ nước exd4 trước đó) đang bị Trắng nhắm tới.
          en:
            Count the pawns and both sides still have 8 — Black has not taken the c3 pawn, so material is
            level, but the pawn Black holds on d4 (from the earlier exd4) is now under fire from
            White.
          fr:
            Comptez les pions, chaque camp en a encore 8 — les Noirs n'ont pas pris le pion c3, le matériel
            reste donc égal, mais le pion noir en d4 (issu du exd4 précédent) est maintenant visé
            par les Blancs.
        plan:
          vi:
            Trắng chơi cxd4 ăn lại tốt và có trung tâm vững, hoặc Bb5 gây sức ép trước. Đen chơi dxe4 hoặc
            Bb4+, tìm cách giữ thế cân bằng và hoàn thiện phát triển nhanh.
          en:
            White plays cxd4 to recapture and set up a solid centre, or Bb5 to add pressure first. Black
            plays dxe4 or Bb4+, trying to keep the balance and develop quickly.
          fr:
            Les Blancs jouent cxd4 pour reprendre et installer un centre solide, ou Bb5 pour ajouter la
            pression d'abord. Les Noirs jouent dxe4 ou Bb4+, cherchant à garder l'équilibre et à se
            développer rapidement.
        basis:
          by: chan
          at: 2026-09-29
