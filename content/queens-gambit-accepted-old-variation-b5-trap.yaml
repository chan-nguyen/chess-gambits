                    en: "White takes the b5 pawn with the a-pawn. White's pawn on b5 attacks c6, so Black has to choose, and if Black recaptures with cxb5, the c-pawn leaves c6 and reopens the f3-a8 diagonal it is blocking."
                    fr: "Les Blancs prennent le pion b5 avec le pion a. Le pion b5 des Blancs attaque c6, donc les Noirs doivent choisir, et s'ils reprennent par cxb5, le pion c quitte c6 et rouvre la diagonale f3-a8 qu'il bloque."
                  dismissed:
                    - ply: c5
                      reason: >-
                        The c-pawn leaves the diagonal exactly as after 5...cxb5, so 6.Qf3 hits
                        the undefended rook on a8 the same way and wins at least a piece.
                  dismissRest:
                    reason:
                      vi: 'Đen chơi một nước khác và giữ tốt c6 tại chỗ, nên đường chéo f3-a8 vẫn đóng và chưa có cú Qf3 nào. Trắng chỉ việc đi lấy tốt c4: với 5...e6, 5...Nf6 hay 5...Bb7 thì sau Bxc4 Trắng hơn đúng một tốt, bảy tốt so với sáu.'
                      en: 'Black plays something else and keeps the pawn on c6, so the f3-a8 diagonal stays closed and there is no Qf3 shot yet. White simply goes after the c4 pawn: after 5...e6, 5...Nf6 or 5...Bb7, Bxc4 leaves White exactly one pawn up, seven pawns against six.'
                      fr: "Les Noirs jouent autre chose et gardent le pion en c6, si bien que la diagonale f3-a8 reste fermée et qu'il n'y a pas encore de coup Df3. Les Blancs n'ont qu'à aller chercher le pion c4 : après 5...e6, 5...Cf6 ou 5...Fb7, Fxc4 laisse les Blancs avec exactement un pion de plus, sept pions contre six."
                  children:
                    - ply: cxb5
                      replyQuality: blunder
                      frequency: common
                      annotation:
                        vi: 'Đen ăn lại tốt b5 bằng tốt c, một nước hoàn toàn tự nhiên vì nó lấy lại tốt. Nhưng tốt c rời c6, và đường chéo f3-a8 mở trở lại mà không còn quân nào của Đen đứng trên đó.'
                        en: 'Black recaptures the b5 pawn with the c-pawn, a perfectly natural move because it wins the pawn back. But the c-pawn leaves c6, and the f3-a8 diagonal opens again with no black piece left on it.'
                        fr: "Les Noirs reprennent le pion b5 avec le pion c, un coup parfaitement naturel puisqu'il regagne le pion. Mais le pion c quitte c6, et la diagonale f3-a8 s'ouvre de nouveau sans qu'il reste une pièce noire dessus."
                      children:
                        - ply: Qf3
                          annotation:
                            vi: 'Trắng đưa hậu ra f3, đe doạ Qxa8. Xe a8 không có nước đi nào và không có quân nào bảo vệ, vì mã b8 và tượng c8 chắn cả xe lẫn hậu d8.'
                            en: 'White brings the queen out to f3, threatening Qxa8. The rook on a8 has no move and no defender, because the knight on b8 and the bishop on c8 shut in both the rook and the queen on d8.'
                            fr: "Les Blancs sortent la dame en f3, menaçant Dxa8. La tour a8 n'a aucun coup et aucun défenseur, car le cavalier b8 et le fou c8 enferment à la fois la tour et la dame d8."
                          counts:
