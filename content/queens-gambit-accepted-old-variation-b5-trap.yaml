                                    en: 'The queen takes the knight with check to the king on e8. Black has only two legal ways to answer it, Bd7 or Qd7.'
                                    fr: "La dame prend le cavalier avec échec au roi e8. Les Noirs n'ont que deux façons légales d'y répondre, Fd7 ou Dd7."
