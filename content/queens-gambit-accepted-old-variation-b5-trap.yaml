# Queen's Gambit Accepted: Old Variation, b5 Trap. The frozen defining line is 1.d4 d5 2.c4
# dxc4 3.e3, and it ends on White's own ply, so the root is an opponent node and Black's
# replies can carry a quality (docs/CONTEXT.md, invariant 5).
#
# ECO is D20, matching `traps.yaml` and the dataset row "Queen's Gambit Accepted: Old
# Variation" (1.d4 d5 2.c4 dxc4 3.e3, D20), which is exactly this line. `category: trap` is
# exempt from the "Queen's Gambit is a misnomer" exclusion that keeps the family out of the
# gambit catalogue, and from the ECO check (ADR-0008).
#
# Source: #173 item 8 (lichess study chapter 8; chesstrapguide.com has the same idea via
# 3.e4). Replayed with chess.js the line is legal and the combination is real: after 3...b5
# 4.a4 c6 5.axb5 cxb5? the long diagonal f3-a8 is open, the a8 rook has no square and no
# defender, and 6.Qf3 wins at least a piece against every reply. But the source's finish is
# wrong. In 6...Nc6 7.Qxc6+ Bd7 the source plays 8.Qxa8?, and that loses the queen to
# 8...Qxa8, since the b8 knight and the c8 bishop are both off the eighth rank and the d8
# queen sees a8. The move that keeps the knight is 8.Qa6, which this entry teaches. Nor is
# 3...b5 a refutation in itself: it is a dubious move that the Stockfish 19 build the
# analysis page ships (depth 16, an estimate and not a proof) rates about nine-tenths of a
# pawn for White after 4.a4, and 4...c6 is the move that walks into the trap, not the best
# defence (4...Bb7 is).
#
# No outcome here is a claimed mate; the leaves are material assessments (ADR-0005).
id: queens-gambit-accepted-old-variation-b5-trap
name: "Queen's Gambit Accepted: Old Variation, b5 Trap"
eco: D20
category: trap
side: white
definingLine: [d4, d5, c4, dxc4, e3]
soundness:
  value: sound
  reviewedAt: '2026-10-01'
  basis:
    by: chan
    at: '2026-10-01'
    source: >-
      A judgement about 3.e3 and the answer 4.a4 to 3...b5, and the same label `traps.yaml`
      carries. 3.e3 is the oldest way to play against the Queen's Gambit Accepted, and the
      trap only needs Black to recapture 5...cxb5. A defender who sees it plays 4...Bb7 or
      4...b4 and White is still slightly better by the analysis page's own Stockfish build
      (depth 16, an estimate and not a proof). No mate is claimed.
judgement:
  by: chan
  at: '2026-10-01'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, including the material counts, computed by hand from the derived
    FEN rather than from an engine.
tree:
  annotation:
    vi: 'Trắng chơi 3.e3, nước cổ điển của Gambit Hậu bị nhận. Nó mở đường chéo cho tượng f1 để lấy lại tốt c4 ở nước sau. Đen đang hơn một tốt, và cách giữ tốt tham lam nhất là 3...b5, vì nó đẩy một tốt cánh hậu ra đúng chỗ mà tốt a2 của Trắng đang chờ.'
    en: "White plays 3.e3, the classical move against the Queen's Gambit Accepted. It opens the diagonal for the f1 bishop so that it can win back the c4 pawn next. Black is a pawn up, and the greediest way to keep it is 3...b5, because it puts a queenside pawn exactly where White's a2 pawn is waiting."
    fr: "Les Blancs jouent 3.e3, le coup classique contre le gambit dame accepté. Il ouvre la diagonale du fou f1 pour reprendre le pion c4 au coup suivant. Les Noirs ont un pion de plus, et la manière la plus gourmande de le garder est 3...b5, car elle pose un pion de l'aile dame exactement là où attend le pion a2 des Blancs."
  dismissRest:
    reason:
      vi: 'Đen không chơi 3...b5, nên không có tốt nào ở b5 cho tốt a đánh vào và nước 4.a4 mất mục tiêu. Trắng tiếp tục bằng những nước thường lệ của Biến Cũ như Bxc4 hay Nf3, hoặc lấy ngay quân Đen bỏ treo, chẳng hạn 3...Bg4 mất tượng vì Qxg4 và 3...Bh3 mất tượng vì Nxh3.'
      en: 'Black does not play 3...b5, so there is no pawn on b5 for the a-pawn to hit and 4.a4 has no target. White carries on with the usual Old Variation moves such as Bxc4 or Nf3, or takes whatever Black leaves hanging at once, for instance 3...Bg4, which loses the bishop to Qxg4, and 3...Bh3, which loses it to Nxh3.'
      fr: "Les Noirs ne jouent pas 3...b5, donc il n'y a aucun pion en b5 que le pion a puisse attaquer et 4.a4 n'a plus de cible. Les Blancs continuent par les coups habituels de la variante ancienne comme Fxc4 ou Cf3, ou prennent tout de suite ce que les Noirs laissent en prise, par exemple 3...Fg4, qui perd le fou à cause de Dxg4, et 3...Fh3, qui le perd à cause de Cxh3."
  children:
    - ply: b5
      replyQuality: inaccuracy
      frequency: occasional
      annotation:
        vi: 'Đen giữ tốt c4 bằng tốt b5. Nước này trông hợp lý vì tốt c4 giờ có tốt b5 bảo vệ, nhưng chính tốt b5 lại chưa có quân nào giữ. Thêm nữa, đường chéo f3-a8 đã thông, vì tốt d5 đã đổi đi và tốt b7 đã rời chỗ.'
        en: 'Black keeps the c4 pawn with the b5 pawn. The move looks sensible because the c4 pawn now has the b5 pawn defending it, but the b5 pawn itself has no defender. And the f3-a8 diagonal is open, because the d5 pawn has gone and the b7 pawn has left.'
        fr: "Les Noirs gardent le pion c4 avec le pion b5. Le coup paraît sensé car le pion c4 est maintenant défendu par le pion b5, mais le pion b5 lui-même n'a aucun défenseur. De plus la diagonale f3-a8 est ouverte, car le pion d5 a disparu et le pion b7 a quitté sa case."
      children:
        - ply: a4
          annotation:
            vi: 'Trắng đẩy tốt a4, tấn công tốt b5 không ai giữ. Cùng lúc đó đường chéo f3-a8 đang thông, nên hậu Trắng có thể ra f3 nhắm vào xe a8. Đen phải lo cùng lúc cho cả hai chuyện.'
            en: "White pushes the a-pawn to a4, attacking the b5 pawn, which nobody guards. At the same time the f3-a8 diagonal is open, so White's queen can go to f3 and aim at the rook on a8. Black has to see to both things at once."
            fr: "Les Blancs poussent le pion a en a4, attaquant le pion b5, que personne ne garde. En même temps la diagonale f3-a8 est ouverte, si bien que la dame blanche peut aller en f3 et viser la tour a8. Les Noirs doivent s'occuper des deux choses à la fois."
          dismissRest:
            reason:
              vi: 'Đen chơi một nước khác. 4...c6 là nước trông như giải quyết cả hai chuyện cùng lúc, vì tốt c6 đánh vào b5 và chặn đường chéo f3-a8, nên chỉ nước ấy mới dẫn đúng vào cái bẫy này. Với các nước khác Trắng có cách riêng, chẳng hạn 4...a6 thì 5.Qf3 đánh ngay vào xe a8, còn 4...bxa4 thì 5.Qxa4+ ăn lại tốt kèm chiếu.'
              en: 'Black plays something else. 4...c6 is the move that looks as if it settles both things at once, because the c6 pawn attacks b5 and blocks the f3-a8 diagonal, and only that move leads into exactly this trap. Against the others White has its own answers; against 4...a6, 5.Qf3 hits the rook on a8 at once, and against 4...bxa4, 5.Qxa4+ takes the pawn back with check.'
              fr: 'Les Noirs jouent autre chose. 4...c6 est le coup qui semble régler les deux choses à la fois, car le pion c6 attaque b5 et bloque la diagonale f3-a8, et seul ce coup mène exactement à ce piège. Contre les autres, les Blancs ont leurs propres réponses ; contre 4...a6, 5.Df3 attaque aussitôt la tour a8, et contre 4...bxa4, 5.Dxa4+ reprend le pion avec échec.'
          children:
            - ply: c6
              replyQuality: mistake
              frequency: common
              annotation:
                vi: 'Đen đẩy tốt c6, một nước trông như giải quyết cả hai chuyện cùng lúc. Tốt c6 đánh vào b5 và chặn đường chéo f3-a8 bằng chính thân nó.'
                en: 'Black pushes the c-pawn to c6, a move that looks as if it settles both things at once. The c6 pawn attacks b5 and blocks the f3-a8 diagonal with its own body.'
                fr: 'Les Noirs poussent le pion c en c6, un coup qui semble régler les deux choses à la fois. Le pion c6 attaque b5 et bloque la diagonale f3-a8 de son propre corps.'
              children:
