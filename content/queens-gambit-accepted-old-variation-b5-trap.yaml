                                              en: 'White develops with Nf3 and Nc3, adds pressure on the b5 and c4 pawns, and trades pieces to turn the extra knight into a win. Black tries to hold the pawns on b5 and c4 and looks for activity with ...e6, ...Nf6 and ...Bd6.'
                                              fr: "Les Blancs se développent par Cf3 et Cc3, accentuent la pression sur les pions b5 et c4, et échangent des pièces pour transformer le cavalier de plus en victoire. Les Noirs essaient de tenir les pions b5 et c4 et cherchent de l'activité avec ...e6, ...Cf6 et ...Fd6."
