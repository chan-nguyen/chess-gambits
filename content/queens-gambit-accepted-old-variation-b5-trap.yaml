                              en: 'Black has no way to protect a8. Of the {legal} legal replies here, the two below are the most natural. Every other reply also loses material at once, either the rook on a8 or the piece Black puts in the way or leaves hanging, so White always wins at least a piece.'
                              fr: "Les Noirs n'ont aucun moyen de protéger a8. Parmi les {legal} coups légaux ici, les deux ci-dessous sont les plus naturels. Tous les autres coups perdent aussi du matériel sur-le-champ, soit la tour a8, soit la pièce que les Noirs placent en travers ou laissent en prise, si bien que les Blancs gagnent toujours au moins une pièce."
                          children:
