                                    evaluation:
                                      vi: 'Trắng hơn một xe đổi lấy một tốt: Trắng có hậu, hai xe, hai mã, hai tượng và sáu tốt; Đen có hậu, một xe, hai mã, hai tượng và bảy tốt. Hậu a8 không bị quân Đen nào tấn công, và các ô b7, c6, d5, e4, f3 trên đường chéo đều trống, nên hậu có thể rút về f3 bất cứ lúc nào.'
                                      en: 'White is a rook up for a pawn: White has the queen, two rooks, two knights, two bishops and six pawns; Black has the queen, one rook, two knights, two bishops and seven pawns. The queen on a8 is not attacked by any black piece, and the squares b7, c6, d5, e4 and f3 on the diagonal are all empty, so she can step back to f3 whenever she likes.'
                                      fr: "Les Blancs ont une tour de plus pour un pion : les Blancs ont la dame, deux tours, deux cavaliers, deux fous et six pions ; les Noirs ont la dame, une tour, deux cavaliers, deux fous et sept pions. La dame a8 n'est attaquée par aucune pièce noire, et les cases b7, c6, d5, e4 et f3 de la diagonale sont toutes vides, si bien qu'elle peut revenir en f3 quand elle veut."
