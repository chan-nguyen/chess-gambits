                                        en: 'Black blocks with the bishop from c8. The bishop leaves c8, so the eighth rank opens, and the queen on d8 now looks straight at the rook on a8 through the empty b8 and c8.'
                                        fr: "Les Noirs parent avec le fou de c8. Le fou quitte c8, si bien que la huitième rangée s'ouvre, et la dame d8 regarde maintenant droit la tour a8 à travers b8 et c8, désormais vides."
