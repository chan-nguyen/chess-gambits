                                              en: 'White is a knight up for a pawn: White has the queen, two rooks, two knights, two bishops and six pawns; Black has the queen, two rooks, two bishops, one knight and seven pawns. The b5 pawn is held by the bishop on d7 and the a7 pawn by the rook on a8, so nothing is hanging yet, and Black has no free capture.'
                                              fr: "Les Blancs ont un cavalier de plus pour un pion : les Blancs ont la dame, deux tours, deux cavaliers, deux fous et six pions ; les Noirs ont la dame, deux tours, deux fous, un cavalier et sept pions. Le pion b5 est tenu par le fou d7 et le pion a7 par la tour a8, donc rien n'est en prise pour l'instant, et les Noirs n'ont aucune prise gratuite."
