# Zukertort Opening: Speelsmet Gambit. Frozen defining line 1.Nf3 c5 2.d4 cxd4 3.e3, which
# ends on White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
# Replayed with chess.js through the reply dxe3; searchMate at 3 moves from the resulting
# position returns no-mate, so no forced mate is claimed anywhere in this entry. The leaf
# carries `unsettled` because a capture is going free there.
id: zukertort-opening-speelsmet-gambit
name: 'Zukertort Opening: Speelsmet Gambit'
eco: A04
category: gambit
side: white
definingLine: [Nf3, c5, d4, cxd4, e3]
soundness:
  value: unsound
  reviewedAt: '2026-10-01'
  basis:
    by: chan
    at: '2026-10-01'
    source: >-
      A judgement. At the end of the defining line White is a pawn down, seven pawns to eight,
      and Black's d4 pawn is attacked three times and undefended, but Black can take on e3
      first and still be a pawn up after the recapture. White has not been shown to get more
      in return than a half-open d-file. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-10-01'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: 'Trắng vừa chơi 3.e3, đẩy tốt e lên. Tốt e3 bị tốt d4 của Đen tấn công và được tốt f2 và tượng c1 bảo vệ, còn tốt d4 bị tốt e3, mã f3 và hậu tấn công mà không có quân nào bảo vệ. Trắng đang kém một tốt, bảy so với tám. Mục này đi theo nước Đen ăn 3...dxe3.'
    en: "White has just played 3.e3, pushing the e-pawn. White's e3 pawn is attacked by Black's d4 pawn and defended by the f2 pawn and the bishop on c1, while the d4 pawn is attacked by the e3 pawn, the knight on f3 and the queen and nothing defends it. White is a pawn down, seven pawns to eight. This entry follows Black capturing 3...dxe3."
    fr: 'Les Blancs viennent de jouer 3.e3, poussant le pion e. Le pion e3 blanc est attaqué par le pion d4 noir et défendu par le pion f2 et le fou c1, tandis que le pion d4 est attaqué par le pion e3, le cavalier f3 et la dame sans être défendu. Les Blancs ont un pion de moins, sept contre huit. Cette entrée suit la prise 3...dxe3 des Noirs.'
  dismissRest:
    reason:
      vi: 'Đen chơi một nước khác thay vì 3...dxe3, nên tốt e3 chưa bị ăn. Mục này chỉ đi theo nước ăn tốt.'
      en: 'Black plays something other than 3...dxe3 here, so the e3 pawn is not taken. This entry follows only the capture.'
      fr: "Les Noirs jouent autre chose que 3...dxe3 ici, si bien que le pion e3 n'est pas pris. Cette entrée ne suit que la prise."
  children:
    - ply: dxe3
      replyQuality: good
      frequency: common
      annotation:
        vi: 'Đen ăn tốt e3 bằng tốt d. Tốt e3 mới bị tốt f2 và tượng c1 tấn công mà không có quân Đen nào bảo vệ, nên Trắng sắp ăn lại, và bản thân tốt e3 đang tấn công tốt f2.'
        en: "Black takes the e3 pawn with the d-pawn. The new pawn on e3 is attacked by the f2 pawn and the bishop on c1 and nothing of Black's defends it, so White is about to recapture, and the e3 pawn itself attacks the f2 pawn."
        fr: 'Les Noirs prennent le pion e3 avec le pion d. Le nouveau pion e3 est attaqué par le pion f2 et le fou c1 et aucune pièce noire ne le défend, si bien que les Blancs vont reprendre, et le pion e3 attaque lui-même le pion f2.'
      unsettled: >-
        Recapturing on e3 (fxe3 or Bxe3) is going free because nothing of Black's defends the
        pawn on e3; the evaluation counts that recapture, which brings the pawn count to six
        against seven.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng sáu, Đen tám, và tốt e3 của Đen sắp bị ăn lại, bằng fxe3 hoặc Bxe3. Khi đó là sáu so với bảy, nên Trắng vẫn kém một tốt. Lúc này Trắng không có tốt nào trên cột d và cột e, nên hai cột đó là cột nửa mở của Trắng, và hậu d1 đã nhắm vào tốt d7, vốn được mã, tượng và hậu Đen bảo vệ.'
          en: "Count the pawns: White six, Black eight, with Black's pawn on e3 about to be taken back, by fxe3 or Bxe3. Once it is, the count is six against seven, so White is still a pawn down. For the moment White has no pawn on the d- or e-file, so both files are half-open for White, and the queen on d1 already bears on the d7 pawn, which Black's knight, bishop and queen defend."
          fr: "Comptez les pions : six pour les Blancs, huit pour les Noirs, le pion noir e3 étant sur le point d'être repris, par fxe3 ou Bxe3. Une fois qu'il l'est, le compte est de six contre sept, si bien que les Blancs ont toujours un pion de moins. Pour le moment, les Blancs n'ont aucun pion sur les colonnes d et e, si bien que les deux colonnes sont semi-ouvertes pour eux, et la dame d1 vise déjà le pion d7, que défendent le cavalier, le fou et la dame noirs."
        plan:
          vi: 'Trắng ăn lại bằng Bxe3, rồi phát triển bằng Nc3 và Bd3 và nhập thành. Đen phát triển bằng ...e6, ...Nf6 và ...Nc6, rồi ...Be7.'
          en: 'White recaptures with Bxe3, then develops with Nc3 and Bd3 and castles. Black develops with ...e6, ...Nf6 and ...Nc6, then ...Be7.'
          fr: 'Les Blancs reprennent par Bxe3, puis se développent par Nc3 et Bd3 et roquent. Les Noirs se développent par ...e6, ...Nf6 et ...Nc6, puis ...Be7.'
        basis:
          by: chan
          at: '2026-10-01'
