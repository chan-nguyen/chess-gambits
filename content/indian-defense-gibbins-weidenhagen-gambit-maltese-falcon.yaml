    by: chan
    at: '2026-10-01'
    source: >-
      A judgement. White has given the g-pawn for a broad pawn centre on d4, e4 and f3, but
      the e4 pawn is already attacked by the knight on f6 and defended only by the f3 pawn,
      and Black can add a second attacker at once. The pawn has not come back, so the label
      is dubious. No engine was consulted and no database was queried.
