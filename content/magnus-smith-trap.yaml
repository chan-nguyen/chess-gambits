# The Magnus Smith Trap, in the Sozin line of the Classical Sicilian. The defining line is
# the one frozen in `tools/catalogue/source/traps.yaml` — 1.e4 c5 2.Nf3 Nc6 3.d4 cxd4 4.Nxd4
# Nf6 5.Nc3 d6 6.Bc4 g6 7.Nxc6 bxc6 8.e5 — and it ends on White's own ply, so the root is an
# opponent node and Black's replies can carry a quality (docs/CONTEXT.md, invariant 5).
#
# ECO is B57, matching `traps.yaml` (a trap carries the ECO of the opening it sits inside,
# ADR-0008). Its dataset row is not imported as a gambit because nobody offers material in
# the main line — the loss is entirely Black's mistake at move 8.
#
# This trap ends in a material win, not a mate (docs/CONTEXT.md, "Trap branch"): after
# 8...dxe5?? 9.Bxf7+ the king's only legal move is Kxf7 — d7 is covered by the queen on d1
# down the d-file the capture just opened, and e7 is Black's own pawn — and 10.Qxd8 takes the
# queen for a bishop. No leaf here claims a mate, so no certificate is needed. Every line
# was replayed with chess.js: the knight retreats 8...Ng4, 8...Nd7, 8...Nh5 and 8...Nd5 are
# each given a real answer, and every `position` leaf sits at a position with no check, no
# mate in one and no free capture. The Wikipedia article on the trap was read for the
# candidate lines and then set aside; every claim below is read off the board, not copied.
id: magnus-smith-trap
name: Magnus Smith Trap
eco: B57
category: trap
side: white
definingLine: [e4, c5, Nf3, Nc6, d4, cxd4, Nxd4, Nf6, Nc3, d6, Bc4, g6, Nxc6, bxc6, e5]
soundness:
  value: sound
  reviewedAt: '2026-09-30'
  basis:
    by: chan
    at: '2026-09-30'
    source: >-
      A judgement, and the same label `traps.yaml` carries. White invests nothing to set the
      trap — 7.Nxc6 and 8.e5 are ordinary moves that also happen to ask the f6 knight a
      question it cannot answer by taking on e5 — so when Black declines the bait White is
      simply playing the Sozin with a good structure against Black's damaged one. No engine
      was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-30'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics. Nothing here is a
    mate, so nothing here is machine-proved; every material count was read off the derived
    position with chess.js.
tree:
  annotation:
    vi: Trắng vừa chơi 8.e5, tấn công con mã f6 bằng tốt. Nước ăn lại tự nhiên nhất, 8...dxe5, trông như thắng một tốt sạch — nhưng nó mở toang cột d giữa hậu d1 của Trắng và hậu d8 của Đen, và con tượng c4 đang nhìn vào f7 chỉ chờ đúng điều đó.
    en: White has just played 8.e5, attacking the f6 knight with a pawn. The most natural reply, 8...dxe5, looks like a clean extra pawn — but it throws the d-file wide open between White's queen on d1 and Black's queen on d8, and the bishop on c4 has been waiting on f7 for exactly that.
    fr: Les Blancs viennent de jouer 8.e5, attaquant le cavalier f6 avec un pion. La réponse la plus naturelle, 8...dxe5, ressemble à un pion net de plus — mais elle ouvre grand la colonne d entre la dame blanche d1 et la dame noire d8, et le fou c4 n'attendait que cela sur f7.
  dismissRest:
    reason:
      vi: Đen chơi một nước khác. Con tốt e5 đang đánh con mã f6, và mọi nước để nó đứng nguyên đó — ...Bg7, ...Qc7, ...Rb8, ...e6 và những nước tương tự — đều để exf6 ăn nó. ...Ne4 đưa con mã tới ô mà Nxe4 ăn không; ...Ng8 rút nó hẳn về nhà; ...d5 phản công tượng c4, và sau 9.exf6 dxc4 con mã đã đổi lấy con tượng. Vài nước còn trả thêm quân ngay tại chỗ, ...Kd7 vào Bxf7, ...Bh6 vào Bxh6, ...Ba6 vào Bxa6, ...Bh3 vào gxh3, ...g5 vào Bxg5.
      en: Black plays something else. The e5 pawn is attacking the f6 knight, and every reply that leaves it there — ...Bg7, ...Qc7, ...Rb8, ...e6 and the like — lets exf6 take it. ...Ne4 puts the knight where Nxe4 takes it for nothing; ...Ng8 brings it all the way home; ...d5 hits the c4 bishop instead, and after 9.exf6 dxc4 the knight has gone for the bishop. A few hand over more material on the spot, ...Kd7 to Bxf7, ...Bh6 to Bxh6, ...Ba6 to Bxa6, ...Bh3 to gxh3, ...g5 to Bxg5.
      fr: Les Noirs jouent autre chose. Le pion e5 attaque le cavalier f6, et toute réponse qui le laisse là — ...Bg7, ...Qc7, ...Rb8, ...e6 et consorts — permet à exf6 de le prendre. ...Ne4 place le cavalier où Nxe4 le prend pour rien ; ...Ng8 le ramène tout à fait chez lui ; ...d5 frappe le fou c4 à la place, et après 9.exf6 dxc4 le cavalier est parti contre le fou. Quelques réponses cèdent encore plus de matériel sur-le-champ, ...Kd7 sur Bxf7, ...Bh6 sur Bxh6, ...Ba6 sur Bxa6, ...Bh3 sur gxh3, ...g5 sur Bxg5.
  children:
    - ply: dxe5
      replyQuality: blunder
      frequency: common
      annotation:
        vi: Đen ăn con tốt e5 bằng tốt d, thoát khỏi đòn tấn công con mã và có vẻ như thắng một tốt. Đây chính là nước mà cái bẫy Magnus Smith chờ đợi, vì con tốt d vừa rời khỏi cột d.
        en: Black takes the e5 pawn with the d-pawn, sidestepping the attack on the knight and seemingly winning a pawn. This is exactly the move the Magnus Smith Trap is waiting for, because the d-pawn has just left the d-file.
        fr: Les Noirs prennent le pion e5 du pion d, esquivant l'attaque sur le cavalier et gagnant apparemment un pion. C'est exactement le coup qu'attend le piège Magnus Smith, car le pion d vient de quitter la colonne d.
      children:
        - ply: 'Bxf7+'
          annotation:
            vi: Tượng thí ở f7 kèm chiếu. Vua Đen chỉ có đúng một nước hợp lệ, ăn con tượng — ô d7 bị hậu d1 khống chế dọc theo cột d vừa mở, còn e7 là con tốt của chính Đen.
            en: The bishop gives itself up on f7 with check. Black's king has exactly one legal move, taking the bishop — d7 is covered by the queen on d1 down the d-file that has just opened, and e7 is Black's own pawn.
            fr: Le fou se sacrifie en f7 avec échec. Le roi noir n'a qu'un seul coup légal, prendre le fou — d7 est contrôlée par la dame d1 le long de la colonne d qui vient de s'ouvrir, et e7 est le propre pion des Noirs.
          children:
            - ply: Kxf7
              replyQuality: best
              frequency: common
              annotation:
                vi: Vua ăn tượng — nước duy nhất hợp lệ. Vua vừa rời khỏi e8 nên không còn canh d8 nữa, và hậu d8 giờ chỉ được bảo vệ bởi chính nó.
                en: The king takes the bishop — the only legal move. The king has just left e8, so it no longer covers d8, and the queen on d8 is now defended by nothing.
                fr: Le roi prend le fou — le seul coup légal. Le roi vient de quitter e8, il ne couvre donc plus d8, et la dame d8 n'est plus défendue par rien.
              children:
                - ply: Qxd8
                  annotation:
                    vi: Hậu Trắng ăn hậu Đen ở d8. Không có gì ăn lại được, và chuỗi bắt buộc kết thúc ở đây.
                    en: White's queen takes Black's queen on d8. Nothing can take back, and the forced sequence ends here.
                    fr: La dame blanche prend la dame noire en d8. Rien ne peut reprendre, et la séquence forcée s'achève ici.
                  outcome:
                    type: position
                    evaluation:
                      vi: Trắng đã đổi một con tượng lấy con hậu Đen. Trắng còn hậu, hai xe, một tượng, một mã và sáu tốt; Đen còn hai xe, hai tượng, một mã và sáu tốt — hơn kém nhau đúng một hậu đổi một tượng. Con hậu Trắng đang đứng ở d8 giữa các quân Đen nhưng không quân nào đánh được nó, và vua Đen ở f7 đã mất quyền nhập thành.
                      en: White has traded a bishop for Black's queen. White has a queen, two rooks, a bishop, a knight and six pawns; Black has two rooks, two bishops, a knight and six pawns — the difference is exactly a queen for a bishop. White's queen stands on d8 in the middle of Black's pieces with nothing attacking it, and Black's king on f7 has lost the right to castle.
                      fr: Les Blancs ont échangé un fou contre la dame noire. Les Blancs ont une dame, deux tours, un fou, un cavalier et six pions ; les Noirs deux tours, deux fous, un cavalier et six pions — la différence est exactement une dame contre un fou. La dame blanche se tient en d8 au milieu des pièces noires sans que rien ne l'attaque, et le roi noir en f7 a perdu le droit de roquer.
                    plan:
                      vi: Trắng rút hậu về nơi an toàn khi bị đuổi, nhập thành, rồi đơn giản đổi quân và dùng con hậu để nhặt các tốt yếu ở a7, c6 và e5 — càng ít quân trên bàn thì ưu thế hậu càng rõ. Đen chỉ có thể cố phối hợp hai tượng và hai xe để quấy rối con hậu, chẳng hạn ...Bb7 và ...Rd8, và tránh mọi cuộc đổi quân.
                      en: White brings the queen back to safety when it is chased, castles, and then simply trades pieces and uses the queen to pick off the weak pawns on a7, c6 and e5 — the fewer pieces on the board, the clearer the queen's advantage. Black can only try to coordinate the two bishops and two rooks against the queen, with ...Bb7 and ...Rd8 for instance, and avoid every trade.
                      fr: Les Blancs ramènent la dame en sécurité quand elle est chassée, roquent, puis échangent simplement les pièces et utilisent la dame pour cueillir les pions faibles a7, c6 et e5 — moins il y a de pièces sur l'échiquier, plus l'avantage de la dame est net. Les Noirs ne peuvent qu'essayer de coordonner les deux fous et les deux tours contre la dame, par ...Bb7 et ...Rd8 par exemple, et éviter tout échange.
                    basis:
                      by: chan
                      at: '2026-09-30'
    - ply: Ng4
      replyQuality: good
      frequency: common
      annotation:
        vi: Con mã nhảy lên g4, tấn công e5 và f2, và tránh được cái bẫy. Nhưng con mã ở g4 chỉ được canh bởi tượng c8 qua đường chéo c8-h3, và Trắng có một nước tốt cắt đứt đúng đường chéo ấy.
        en: The knight jumps to g4, attacking e5 and f2, and avoids the trap. But the knight on g4 is guarded only by the c8 bishop along the c8-h3 diagonal, and White has a pawn move that cuts exactly that line.
        fr: Le cavalier saute en g4, attaquant e5 et f2, et évite le piège. Mais le cavalier g4 n'est gardé que par le fou c8 le long de la diagonale c8-h3, et les Blancs ont un coup de pion qui coupe précisément cette ligne.
      children:
        - ply: e6
          annotation:
            vi: Trắng đẩy tốt lên e6, đâm vào f7 và đồng thời đứng chắn ngay trên đường chéo c8-g4. Con mã g4 bây giờ không còn ai canh và bị hậu d1 đe doạ ăn, trong khi con tốt e6 được tượng c4 bảo vệ.
            en: White pushes the pawn to e6, striking at f7 and at the same time standing right on the c8-g4 diagonal. The g4 knight is now defended by nobody and is threatened by the queen on d1, while the e6 pawn is protected by the bishop on c4.
            fr: Les Blancs poussent le pion en e6, frappant f7 et se postant en même temps en plein sur la diagonale c8-g4. Le cavalier g4 n'est plus défendu par personne et se trouve menacé par la dame d1, tandis que le pion e6 est protégé par le fou c4.
          dismissRest:
            reason:
              vi: Đen chơi một nước khác. Con tốt e6 đã cắt tượng c8 khỏi g4, nên con mã ở đó đang treo cho Qxg4 — và phần lớn các nước, ...Bg7 hay ...Qc7 chẳng hạn, cứ để nó bị ăn, riêng ...Bd7 còn để exf7 là chiếu bí. ...f6 và ...d5 cũng không thay đổi điều đó. ...Bxe6 10.Bxe6 fxe6 đổi tượng và lấy lại con tốt, nhưng 11.Qxg4 vẫn ăn con mã vì con tốt e6 của Đen lại chắn đường chéo. ...h5 che con mã bằng tốt, còn ...Ne5, ...Nf6 và ...Nh6 rút nó về — bốn nước ấy giữ được quân, đổi lại con tốt Trắng vẫn nằm ở e6 và exf7+ vẫn còn trên bàn. ...Nxf2, ...Nxh2 và ...Ne3 thì ném con mã đi ngay tại chỗ.
              en: Black plays something else. The e6 pawn has cut the c8 bishop off from g4, so the knight there is hanging to Qxg4 — and most replies, ...Bg7 or ...Qc7 for instance, simply leave it to be taken, while after ...Bd7 exf7 is even mate. ...f6 and ...d5 do not change that. ...Bxe6 10.Bxe6 fxe6 trades the bishops and wins the pawn back, but 11.Qxg4 still takes the knight because Black's e6 pawn closes the diagonal again. ...h5 props the knight up with a pawn, and ...Ne5, ...Nf6 and ...Nh6 bring it back — those four keep the piece, at the price of leaving White's pawn on e6 with exf7+ still on the table. ...Nxf2, ...Nxh2 and ...Ne3 throw the knight away on the spot.
              fr: Les Noirs jouent autre chose. Le pion e6 a coupé le fou c8 de g4, si bien que le cavalier y est en prise sur Qxg4 — et la plupart des réponses, ...Bg7 ou ...Qc7 par exemple, le laissent simplement se faire prendre, tandis qu'après ...Bd7 exf7 est même mat. ...f6 et ...d5 n'y changent rien. ...Bxe6 10.Bxe6 fxe6 échange les fous et regagne le pion, mais 11.Qxg4 prend quand même le cavalier, le pion e6 noir refermant la diagonale. ...h5 étaie le cavalier d'un pion, et ...Ne5, ...Nf6 et ...Nh6 le ramènent — ces quatre réponses gardent la pièce, au prix de laisser le pion blanc en e6 avec exf7+ toujours possible. ...Nxf2, ...Nxh2 et ...Ne3 jettent le cavalier sur-le-champ.
          children:
            - ply: f5
              replyQuality: best
              frequency: common
              annotation:
                vi: Đen đẩy tốt f lên f5, vừa che con mã g4 bằng tốt vừa giữ cho con tốt e6 không ăn được ở f7. Đây là cách duy nhất giữ con mã mà không rút nó về.
                en: Black pushes the f-pawn to f5, covering the g4 knight with a pawn and at the same time taking the f7 capture away from the e6 pawn. It is the only way to keep the knight without retreating it.
                fr: Les Noirs poussent le pion f en f5, couvrant le cavalier g4 d'un pion et ôtant du même coup la prise en f7 au pion e6. C'est la seule façon de garder le cavalier sans le faire reculer.
              outcome:
                type: position
                evaluation:
                  vi: Quân số ngang nhau, bảy tốt mỗi bên và đủ bộ quân. Điều khác nhau là cấu trúc tốt, Đen có con tốt a7 lẻ loi và các tốt c6, d6 đã bị bẻ khỏi cánh hậu sau ...bxc6, trong khi Trắng có con tốt e6 cắm sâu vào trận địa Đen, được tượng c4 bảo vệ và lấy đi cả ô d7 lẫn ô f7 khỏi vua Đen. Tượng c8 của Đen bị chính con tốt ấy chặn đường, và vua Đen chưa nhập thành.
                  en: Material is level, seven pawns each and every piece still on the board. What differs is the pawn structure, Black has an isolated a7 pawn and c6 and d6 pawns broken off from the queenside by ...bxc6, while White has a pawn on e6 wedged deep in Black's camp, protected by the c4 bishop and taking both d7 and f7 away from Black's king. Black's c8 bishop is blocked by that same pawn, and Black's king has not castled.
                  fr: Le matériel est égal, sept pions de chaque côté et toutes les pièces encore sur l'échiquier. Ce qui diffère est la structure de pions, les Noirs ont un pion a7 isolé et des pions c6 et d6 détachés de l'aile dame par ...bxc6, tandis que les Blancs ont un pion e6 enfoncé dans le camp noir, protégé par le fou c4 et qui ôte à la fois d7 et f7 au roi noir. Le fou noir c8 est bloqué par ce même pion, et le roi noir n'a pas roqué.
                plan:
                  vi: Trắng chơi h3 để hỏi con mã g4, Qe2 hoặc Qf3 giữ chặt e6, O-O và Re1, rồi Bb3 và Nd5 khai thác các ô yếu quanh vua Đen chừng nào nó còn ở e8. Đen chơi ...Nf6 hay ...Ne5, ...Bg7 và ...O-O càng sớm càng tốt, rồi ...Bxe6 khi có thể đổi con tượng c4 lấy con tốt gai ấy.
                  en: White plays h3 to ask the g4 knight the question, Qe2 or Qf3 to hold e6, O-O and Re1, then Bb3 and Nd5 to work on the weak squares around Black's king for as long as it stays on e8. Black plays ...Nf6 or ...Ne5, ...Bg7 and ...O-O as soon as possible, then ...Bxe6 whenever the c4 bishop can be traded for that thorn of a pawn.
                  fr: Les Blancs jouent h3 pour interroger le cavalier g4, Qe2 ou Qf3 pour tenir e6, O-O et Re1, puis Bb3 et Nd5 pour travailler les cases faibles autour du roi noir tant qu'il reste en e8. Les Noirs jouent ...Nf6 ou ...Ne5, ...Bg7 et ...O-O le plus tôt possible, puis ...Bxe6 dès que le fou c4 peut être échangé contre cette épine de pion.
                basis:
                  by: chan
                  at: '2026-09-30'
            - ply: fxe6
              replyQuality: mistake
              frequency: common
              annotation:
                vi: Đen ăn con tốt e6 bằng tốt f, tưởng là dọn sạch mối phiền. Nhưng con tốt Đen giờ đứng ở e6 lại tiếp tục chắn đường chéo c8-g4 y như con tốt Trắng vừa rồi, và con mã g4 vẫn không ai canh.
                en: Black takes the e6 pawn with the f-pawn, apparently clearing the nuisance away. But the black pawn now on e6 blocks the c8-g4 diagonal exactly as the white one did, and the g4 knight is still defended by nobody.
                fr: Les Noirs prennent le pion e6 du pion f, croyant écarter la gêne. Mais le pion noir désormais en e6 bouche la diagonale c8-g4 exactement comme le faisait le pion blanc, et le cavalier g4 n'est toujours défendu par personne.
              children:
                - ply: Qxg4
                  annotation:
                    vi: Hậu Trắng ăn con mã g4. Không quân Đen nào ăn lại được, vì đường chéo từ c8 vẫn đang bị chính con tốt e6 của Đen chặn.
                    en: White's queen takes the g4 knight. No black piece can take back, because the diagonal from c8 is still blocked by Black's own e6 pawn.
                    fr: La dame blanche prend le cavalier g4. Aucune pièce noire ne peut reprendre, car la diagonale depuis c8 est toujours bouchée par le propre pion noir e6.
                  outcome:
                    type: position
                    evaluation:
                      vi: Trắng hơn một con mã, kém một tốt. Trắng còn hậu, hai xe, hai tượng, một mã và sáu tốt; Đen còn hậu, hai xe, hai tượng và bảy tốt, không còn mã nào. Cấu trúc tốt của Đen — a7 lẻ, c6 và d6 đứng riêng, e7 và e6 chồng nhau — không thể sửa được nữa, và con tốt e6 đang bị hậu g4 đánh trong khi vua Đen chưa nhập thành.
                      en: White is a knight up for a pawn. White has a queen, two rooks, two bishops, a knight and six pawns; Black has a queen, two rooks, two bishops and seven pawns, with no knight left. Black's pawn structure — a7 isolated, c6 and d6 on their own, e7 and e6 doubled — cannot be repaired, and the e6 pawn is attacked by the queen on g4 while Black's king has not castled.
                      fr: Les Blancs ont un cavalier de plus contre un pion. Les Blancs ont une dame, deux tours, deux fous, un cavalier et six pions ; les Noirs une dame, deux tours, deux fous et sept pions, sans plus aucun cavalier. La structure de pions noire — a7 isolé, c6 et d6 livrés à eux-mêmes, e7 et e6 doublés — ne peut plus se réparer, et le pion e6 est attaqué par la dame g4 alors que le roi noir n'a pas roqué.
                    plan:
                      vi: Trắng chơi O-O, Bxe6 hoặc Qxe6+ khi con tốt ấy không còn được bảo vệ, Re1 dọc cột e và Bf4 nhắm vào d6 — vua Đen ở e8 với cột e nửa mở là mục tiêu chính. Đen chơi ...Qd7 hoặc ...Bd7 giữ e6, ...Bg7 và ...O-O, và cố đổi con tượng c4 để tắt đường chéo vào e6.
                      en: White plays O-O, Bxe6 or Qxe6+ as soon as that pawn is left undefended, Re1 down the e-file and Bf4 against d6 — Black's king on e8 with the half-open e-file in front of it is the main target. Black plays ...Qd7 or ...Bd7 to hold e6, ...Bg7 and ...O-O, and tries to trade off the c4 bishop to close the diagonal into e6.
                      fr: Les Blancs jouent O-O, Bxe6 ou Qxe6+ dès que ce pion n'est plus défendu, Re1 sur la colonne e et Bf4 contre d6 — le roi noir en e8, avec la colonne e semi-ouverte devant lui, est la cible principale. Les Noirs jouent ...Qd7 ou ...Bd7 pour tenir e6, ...Bg7 et ...O-O, et tentent d'échanger le fou c4 pour fermer la diagonale vers e6.
                    basis:
                      by: chan
                      at: '2026-09-30'
    - ply: Nd7
      replyQuality: good
      frequency: common
      annotation:
        vi: Con mã lùi về d7, tấn công lại con tốt e5 và tránh mọi rắc rối trên cột d — con tốt d6 vẫn ở đó chắn giữa hai con hậu. Nhưng con mã ở d7 chặn luôn đường ra của tượng c8 và chắn cột d của hậu, nên con tốt d6 chỉ còn được tốt e7 bảo vệ.
