                                evaluation:
                                  vi: Trắng hơn một tốt, sáu tốt so với năm, và cả hai bên đều còn hậu, hai xe và hai tượng nhưng không còn mã nào. Đen có hai con tốt lẻ ở a7 và d6 và không sửa được điều đó, cột e mở hoàn toàn trước vua e8 chưa nhập thành, và tượng d5 của Trắng đứng ngay giữa bàn nhìn vào f7 mà không con tốt Đen nào đuổi được nó nữa. Trắng có thể nhập thành ngay.
                                  en: White is a pawn up, six pawns to five, and both sides have a queen, two rooks and two bishops but no knight left. Black has two isolated pawns on a7 and d6 and no way to repair that, the e-file is fully open in front of the uncastled king on e8, and White's bishop on d5 sits in the middle of the board looking at f7 with no black pawn left to chase it. White can castle at once.
                                  fr: Les Blancs ont un pion de plus, six contre cinq, et les deux camps ont une dame, deux tours et deux fous mais plus aucun cavalier. Les Noirs ont deux pions isolés en a7 et d6 sans moyen d'y remédier, la colonne e est entièrement ouverte devant le roi e8 non roqué, et le fou blanc d5 trône au milieu de l'échiquier, braqué sur f7, sans plus aucun pion noir pour le chasser. Les Blancs peuvent roquer aussitôt.
                                plan:
                                  vi: Trắng chơi O-O, Re1 chiếm cột e và Qf3 nhắm f7 chừng nào vua Đen còn ở e8, rồi Bf4 hoặc Be3 đánh vào d6 và a7. Đen cần ...Be7 và ...O-O trước hết để thoát khỏi cột e, rồi ...Be6 đổi con tượng d5 và ...Rb4 hay ...Qa5 tìm hoạt động ở cánh hậu để bù cho con tốt.
                                  en: White plays O-O, Re1 to take the e-file and Qf3 against f7 for as long as Black's king stays on e8, then Bf4 or Be3 against d6 and a7. Black needs ...Be7 and ...O-O first of all to get off the e-file, then ...Be6 to trade the d5 bishop and ...Rb4 or ...Qa5 for queenside activity to make up for the pawn.
                                  fr: Les Blancs jouent O-O, Re1 pour prendre la colonne e et Qf3 contre f7 tant que le roi noir reste en e8, puis Bf4 ou Be3 contre d6 et a7. Les Noirs ont besoin de ...Be7 et ...O-O avant tout pour quitter la colonne e, puis ...Be6 pour échanger le fou d5 et ...Rb4 ou ...Qa5 pour une activité à l'aile dame qui compense le pion.
