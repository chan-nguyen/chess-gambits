# Ruy Lopez: Classical Variation, Cordel Gambit. Frozen defining line 1.e4 e5 2.Nf3 Nc6 3.Bb5
# Bc5 4.c3 f5, which ends on Black's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). Replayed with chess.js through 5.exf5. searchMate at 3 moves from the resulting
# position returns no-mate, so no forced mate is claimed anywhere in this entry, and no capture is
# left going free at the leaf.
id: ruy-lopez-classical-variation-cordel-gambit
name: 'Ruy Lopez: Classical Variation, Cordel Gambit'
eco: C64
category: gambit
side: black
definingLine: [e4, e5, Nf3, Nc6, Bb5, Bc5, c3, f5]
soundness:
  value: dubious
  reviewedAt: '2026-09-30'
  basis:
    by: chan
    at: '2026-09-30'
    source: "A judgement. After 5.exf5 Black is a pawn down, seven pawns to eight, with the f-pawn gone. What Black has in return is concrete but small: the bishop on c5 bears on f2, which only the king defends, the f-file is half-open for Black, and White's pawns are doubled on the f-file. No engine was consulted and no database was queried."
judgement:
  by: chan
  at: '2026-09-30'
  source: Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen vừa chơi 4...f5, phản công vào tốt e4. Tốt f5 bị tốt e4 tấn công mà không quân nào bảo vệ, và tốt e4 cũng bị tốt f5 tấn công mà không quân Trắng nào bảo vệ. Trắng phải quyết định có ăn không.
    en: Black has just played 4...f5, a countergambit against the e4 pawn. The f5 pawn is attacked by the e4 pawn with nothing defending it, and the e4 pawn is attacked by the f5 pawn with no White piece defending it. White has to decide whether to take.
    fr: Les Noirs viennent de jouer 4...f5, un contre-gambit contre le pion e4. Le pion f5 est attaqué par le pion e4 sans aucune défense, et le pion e4 est attaqué par le pion f5 sans qu'aucune pièce blanche ne le défende. Les Blancs doivent décider de prendre ou non.
  dismissRest:
    reason:
      vi: Trắng chọn nước khác thay vì 5.exf5, chẳng hạn 5.d4 hoặc 5.Nxe5. Đánh giá trong mục này dành cho nhánh Trắng ăn tốt f5 ngay.
      en: White plays something other than 5.exf5, for example 5.d4 or 5.Nxe5. The assessment in this entry is for the line where White takes the f5 pawn at once.
      fr: Les Blancs jouent autre chose que 5.exf5, par exemple 5.d4 ou 5.Nxe5. L'évaluation de cette fiche porte sur la ligne où les Blancs prennent tout de suite le pion f5.
  children:
    - ply: exf5
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng ăn tốt f5 bằng tốt e, giữ tốt thừa và đồng thời rời khỏi cột e, nơi tốt e4 đang bị nhắm tới.
        en: White takes the f5 pawn with the e-pawn, keeping the extra pawn and leaving the e-file, where the e4 pawn was the target.
        fr: Les Blancs prennent le pion f5 avec le pion e, gardant le pion supplémentaire et quittant la colonne e, où le pion e4 était la cible.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng tám, Đen bảy — Đen kém một tốt và không còn tốt f. Tốt Trắng bị chồng ở cột f (f2 và f5), cột f nửa mở cho Đen, và tượng c5 của Đen nhắm vào f2, ô chỉ có vua e1 bảo vệ. Tốt e5 của Đen bị mã f3 tấn công và chỉ có mã c6 bảo vệ.'
          en: "Count the pawns: White eight, Black seven — Black is a pawn down and has no f-pawn left. White's pawns are doubled on the f-file (f2 and f5), the f-file is half-open for Black, and Black's bishop on c5 bears on f2, a square only the king on e1 defends. Black's e5 pawn is attacked by the knight on f3 and defended only by the knight on c6."
          fr: "Comptons les pions : huit pour les Blancs, sept pour les Noirs — les Noirs ont un pion de moins et n'ont plus de pion f. Les pions blancs sont doublés sur la colonne f (f2 et f5), la colonne f est semi-ouverte pour les Noirs, et le fou c5 noir vise f2, une case que seul le roi e1 défend. Le pion e5 noir est attaqué par le cavalier f3 et défendu seulement par le cavalier c6."
        plan:
          vi: Trắng chơi d4 để đánh vào tượng c5 và tốt e5, rồi nhập thành và giữ tốt thừa. Đen phát triển bằng ...Nf6, nhập thành và dùng cột f nửa mở cùng tượng c5 nhắm vào f2.
          en: White plays d4 to hit the bishop on c5 and the e5 pawn, then castles and keeps the extra pawn. Black develops with ...Nf6, castles and uses the half-open f-file and the bishop on c5 against f2.
          fr: Les Blancs jouent d4 pour attaquer le fou c5 et le pion e5, puis roquent et gardent le pion supplémentaire. Les Noirs se développent par ...Nf6, roquent et utilisent la colonne f semi-ouverte et le fou c5 contre f2.
        basis:
          by: chan
          at: '2026-09-30'
