tree:
  annotation:
    vi:
      Sau khi Trắng thí liền hai tốt trung tâm và nhảy mã vào d5, Đen ăn luôn tốt e4, và Trắng đáp lại
      bằng 7.Qe2 — đòn chiến thuật cốt lõi của Belgrade Gambit, ghim con mã vừa ăn tốt vào vua Đen.
    en:
      After White gives up two central pawns in a row and jumps the knight to d5, Black takes the pawn
      on e4, and White replies with 7.Qe2 — the key tactical point of the Belgrade Gambit, pinning
      the knight that just grabbed the pawn to Black's king.
    fr:
      Après que les Blancs ont cédé coup sur coup deux pions centraux et sauté le cavalier en d5, les
      Noirs prennent le pion e4, et les Blancs répliquent par 7.Qe2 — le point tactique central du
      Gambit de Belgrade, clouant le cavalier qui vient de prendre le pion contre le roi noir.
  dismissRest:
    reason:
      vi:
        Đen chơi nước khác ngoài f5, ví dụ Be7 hay Qe7 gỡ ghim ngay. Con mã e4 vẫn là quân bị nhắm tới
        trong mọi trường hợp, và đánh giá chung — Trắng kém hai tốt, bù lại bằng thế ghim và nhịp độ
        — không đổi nhiều.
      en:
        Black plays something other than f5, for instance Be7 or Qe7 to unpin at once. The knight on e4
        is the target either way, and the overall assessment — White down two pawns, compensated by
        the pin and the tempo — does not change much.
      fr:
        Les Noirs jouent autre chose que f5, par exemple Be7 ou Qe7 pour déclouer tout de suite. Le
        cavalier e4 reste la cible dans tous les cas, et l'évaluation générale — les Blancs à deux
        pions de moins, compensés par le clouage et le temps — ne change guère.
  children:
    - ply: f5
      replyQuality: best
      frequency: common
      annotation:
        vi:
          Đen chơi f5, bảo vệ thêm cho mã e4 thay vì vội tính đường rút — cách xử lý hiện đại nhất trước
          7.Qe2.
        en:
          Black plays f5, giving the knight on e4 extra cover instead of rushing to plan a retreat — the
          most modern way of meeting 7.Qe2.
        fr:
          Les Noirs jouent f5, apportant un soutien supplémentaire au cavalier e4 au lieu de se hâter de
          préparer une retraite — la façon la plus moderne de répondre à 7.Qe2.
      outcome:
        type: position
        evaluation:
          vi:
            Đếm tốt, Trắng 6 còn Đen 8 — Đen hơn đúng hai tốt sạch. Nhưng con mã e4 của Đen đang bị ghim
            tuyệt đối trên cột e giữa hậu e2 của Trắng và vua e8 của chính Đen — kiểm tra cho thấy
            nó không có nước đi hợp lệ nào nếu đến lượt Đen đi.
          en:
            Count the pawns and it is 6 for White against 8 for Black — Black is up two clean pawns. But
            Black's knight on e4 is absolutely pinned down the e-file between White's queen on e2
            and Black's own king on e8 — checking the position shows it has no legal move at all if
            it were Black to move.
          fr:
            "Comptez les pions : 6 pour les Blancs contre 8 pour les Noirs — les Noirs sont en avance de
            deux pions nets. Mais le cavalier noir en e4 est absolument cloué sur la colonne e entre
            la dame blanche en e2 et le roi noir en e8 — la vérification montre qu'il n'a aucun coup
            légal si c'était aux Noirs de jouer."
        plan:
          vi:
            Trắng chơi Nxc7+ ăn thêm tốt và phá vỡ thế nhập thành của Đen, tranh thủ trong lúc mã e4 còn bị
            ghim, dù phải trả lại chút vật chất đã thí. Đen chơi Qe7 hoặc d5, tìm cách gỡ ghim cho
            mã e4 và hoàn thiện phát triển trước khi Trắng khai thác được hết.
          en:
            White plays Nxc7+ to grab another pawn and wreck Black's castling rights, cashing in while the
            knight on e4 is still pinned, even though some of the sacrificed material has to be
            given back. Black plays Qe7 or d5, trying to unpin the knight on e4 and finish
            developing before White can exploit it fully.
          fr:
            Les Blancs jouent Nxc7+ pour gagner un pion de plus et briser les droits de roque noirs,
            profitant du clouage du cavalier e4, quitte à rendre une partie du matériel sacrifié.
            Les Noirs jouent Qe7 ou d5, cherchant à déclouer le cavalier e4 et à achever leur
            développement avant que les Blancs n'en profitent pleinement.
        basis:
          by: chan
