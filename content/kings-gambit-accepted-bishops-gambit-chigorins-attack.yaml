tree:
  annotation:
    vi: Trắng vừa chơi 6.g3, dùng tốt tấn công hậu h4. Hậu được tốt g5 bảo vệ, còn tốt g3 được tốt h2 bảo vệ và bị cả tốt f4 lẫn hậu h4 tấn công.
    en: White has just played 6.g3, attacking the queen on h4 with a pawn. The queen is defended by the pawn on g5, while the pawn on g3 is defended by the pawn on h2 and attacked by both the pawn on f4 and the queen on h4.
    fr: Les Blancs viennent de jouer 6.g3, attaquant la dame h4 avec un pion. La dame est défendue par le pion g5, tandis que le pion g3 est défendu par le pion h2 et attaqué à la fois par le pion f4 et par la dame h4.
  dismissRest:
    reason:
      vi: Đen chơi một nước khác thay vì ăn g3, chẳng hạn 6...Qh6, đưa hậu đi chỗ khác và vẫn giữ f4 nhờ tốt g5. Phần lớn các nước còn lại chỉ mất hậu đổi lấy một tốt vì gxh4.
      en: Black plays something other than capturing on g3, for example 6...Qh6, which moves the queen away and keeps f4 defended by the pawn on g5. Most other moves simply lose the queen for a pawn to gxh4.
      fr: Les Noirs jouent autre chose que de prendre en g3, par exemple 6...Qh6, qui écarte la dame et garde f4 défendu par le pion g5. La plupart des autres coups perdent simplement la dame contre un pion après gxh4.
  children:
    - ply: fxg3
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen ăn g3 bằng tốt f. Nước đó loại bỏ tốt đang tấn công hậu, và tốt mới ở g3 đánh vào h2, con tốt mà hậu h4 cũng đang đánh.
        en: Black captures the pawn with the f-pawn. That removes the attacker of the queen, and the new pawn on g3 attacks h2, which the queen on h4 attacks as well.
        fr: Les Noirs prennent le pion avec le pion f. Cela supprime l'attaquant de la dame, et le nouveau pion en g3 attaque h2, que la dame h4 attaque elle aussi.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng sáu, Đen bảy, nên Đen hơn một tốt. Vua Trắng ở f1 đã mất quyền nhập thành và không còn tốt nào ở cột f hay cột g che phía trước, trong khi tốt h2 bị đánh hai lần mà chỉ có một quân bảo vệ.'
          en: "Count the pawns: White six, Black seven, so Black is a pawn up. White's king on f1 has lost the right to castle and has no pawn left on the f-file or the g-file in front of it, while the pawn on h2 is attacked twice and defended once."
          fr: "Comptez les pions : six pour les Blancs, sept pour les Noirs, si bien que les Noirs ont un pion d'avance. Le roi blanc en f1 a perdu le droit de roquer et n'a plus aucun pion sur la colonne f ni sur la colonne g devant lui, tandis que le pion h2 est attaqué deux fois et défendu une seule fois."
        plan:
          vi: 'Trắng phải đáp lại sức ép lên h2: hxg3 dùng tốt tấn công hậu ngay, còn Nf3 tấn công hậu bằng mã, trong khi tượng d5 vẫn đánh vào các tốt b7 và f7. Đen muốn giữ con tốt hơn và giữ hậu cùng tốt g3 nhắm vào vua Trắng.'
          en: 'White has to answer the pressure on h2: hxg3 attacks the queen with a pawn at once, and Nf3 attacks it with the knight, while the bishop on d5 keeps the pawns on b7 and f7 under fire. Black wants to hold the extra pawn and keep the queen and the pawn on g3 pointed at the white king.'
          fr: "Les Blancs doivent répondre à la pression sur h2 : hxg3 attaque aussitôt la dame avec un pion, et Nf3 l'attaque avec le cavalier, tandis que le fou d5 tient sous le feu les pions b7 et f7. Les Noirs veulent garder le pion de plus et garder la dame et le pion g3 braqués sur le roi blanc."
        basis:
          by: chan
          at: '2026-09-30'
