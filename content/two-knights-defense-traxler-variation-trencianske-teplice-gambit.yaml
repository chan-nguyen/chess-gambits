tree:
  annotation:
    vi:
      'Sau khi Trắng thí tượng bằng Bxf7+ và Đen buộc phải tự đi vua ra e7 thay vì bắt lại, Trắng đã
      có một tốt thừa và một mục tiêu lâu dài: cái vua không thể nhập thành ấy.'
    en:
      'After White sacrifices the bishop with Bxf7+ and Black has to move the king to e7 rather than
      recapturing, White has an extra pawn and a lasting target: that king which can no longer
      castle.'
    fr: 'Après le sacrifice du fou par Bxf7+ et le roi noir forcé de se déplacer en e7 plutôt que de
      reprendre, les Blancs ont un pion supplémentaire et une cible durable : ce roi qui ne peut
      plus roquer.'
  dismissRest:
    reason:
      vi:
        Trắng chơi nước khác ngoài 6.d4, ví dụ Nc3 hay O-O ngay. Ý tưởng khai thác vua Đen không thể
        nhập thành và đánh giá chung — Trắng hơn một tốt — không đổi nhiều.
      en: White plays something other than 6.d4, for instance Nc3 or O-O right away. The idea of
        exploiting the fact that Black cannot castle, and the overall assessment — White up a pawn —
        do not change much.
      fr:
        Les Blancs jouent autre chose que 6.d4, par exemple Nc3 ou O-O tout de suite. L'idée d'exploiter
        le roi noir qui ne peut plus roquer, et l'évaluation générale — les Blancs en avance d'un
        pion — ne changent guère.
  children:
    - ply: d4
      replyQuality: best
      frequency: common
      annotation:
        vi:
          Trắng chơi tiếp 6.d4, mở thêm đường cho các quân trong lúc vua Đen đã mất quyền nhập thành và
          còn kẹt ở e7.
        en:
          White continues with 6.d4, opening more lines for the pieces while Black's king has already lost
          the right to castle and remains stuck on e7.
        fr:
          Les Blancs poursuivent par 6.d4, ouvrant encore des lignes pour leurs pièces pendant que le roi
          noir a déjà perdu le droit de roquer et reste coincé en e7.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 8 còn Đen 7 — Trắng hơn đúng một tốt sạch.
          en: Count the pawns and it is 8 for White against 7 for Black — White is up one clean pawn.
          fr:
            "Comptez les pions : 8 pour les Blancs contre 7 pour les Noirs — les Blancs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng tiếp tục phát triển với Nc3 hoặc O-O, khai thác việc vua Đen không thể nhập thành để duy
            trì sức ép lâu dài. Đen chơi Bxd4 hoặc d6, tìm cách trả lại vật chất hoặc củng cố vị trí
            vua ở giữa bàn.
          en:
            White continues developing with Nc3 or O-O, exploiting the fact that Black's king cannot castle
            to keep up lasting pressure. Black plays Bxd4 or d6, either giving material back or
            trying to shore up the king stuck in the centre.
          fr:
            Les Blancs poursuivent leur développement avec Nc3 ou O-O, exploitant le fait que le roi noir ne
            peut plus roquer pour maintenir une pression durable. Les Noirs jouent Bxd4 ou d6,
            rendant du matériel ou tentant de consolider le roi resté au centre.
        basis:
          by: chan
          at: 2026-09-29
