tree:
  annotation:
    vi:
      Sau 3...Nf6 4.Ng5 Bc5!?, Đen phớt lờ đòn doạ Nxf7 thông thường và phản công thẳng vào f2 — Trắng
      giờ phải chọn giữa ăn tốt f7 bằng tượng, bằng mã, hay lùi lại an toàn.
    en:
      After 3...Nf6 4.Ng5 Bc5!?, Black ignores the usual Nxf7 threat and counterattacks f2 directly —
      White now has to choose between grabbing f7 with the bishop, with the knight, or retreating to
      safety.
    fr: Après 3...Nf6 4.Ng5 Bc5!?, les Noirs ignorent la menace habituelle Nxf7 et contre-attaquent
      directement f2 — les Blancs doivent maintenant choisir entre prendre f7 avec le fou, avec le
      cavalier, ou reculer en sécurité.
  dismissRest:
    reason:
      vi:
        Trắng chơi nước khác ngoài Bxf7+, ví dụ Nxf7 (một nhánh Traxler khác) hoặc lùi mã về f3/h3. Mỗi
        lựa chọn dẫn tới một thế cờ và đánh giá rất khác nhau, và đây là nhánh chọn riêng đòn thí
        tượng.
      en: White plays something other than Bxf7+, for instance Nxf7 (a different Traxler branch) or
        retreating the knight to f3 or h3. Each choice leads to a quite different position and
        assessment, and this is the branch that specifically chooses the bishop sacrifice.
      fr: Les Blancs jouent autre chose que Bxf7+, par exemple Nxf7 (une autre branche Traxler) ou
        reculent le cavalier en f3 ou h3. Chaque choix mène à une position et une évaluation bien
        différentes, et c'est ici la branche qui choisit spécifiquement le sacrifice du fou.
  children:
    - ply: Bxf7+
      replyQuality: best
      frequency: common
      annotation:
        vi:
          Trắng thí tượng bằng Bxf7+, ăn tốt kèm chiếu thay vì lùi mã g5 về nơi an toàn — mũi nhọn chính
          của toàn bộ Traxler Counterattack.
        en:
          White sacrifices the bishop with Bxf7+, grabbing a pawn with check instead of retreating the
          knight on g5 to safety — the main point of the whole Traxler Counterattack.
        fr: Les Blancs sacrifient le fou par Bxf7+, gagnant un pion avec échec au lieu de reculer le
          cavalier g5 en sécurité — le point central de toute la Contre-attaque Traxler.
      children:
        - ply: Ke7
          annotation:
            vi:
              Vua Đen không thể ăn lại bằng Kxf7 vì sẽ dính chiếu từ chính con mã đang đứng ở g5 — kiểm tra
              cho thấy đó là nước bất hợp lệ — nên vua phải bước sang e7.
            en:
              Black's king cannot recapture with Kxf7 because that would walk into check from the very knight
              sitting on g5 — checking the position confirms that move is illegal — so the king
              steps to e7 instead.
            fr:
              Le roi noir ne peut pas reprendre par Kxf7 car il tomberait en échec du cavalier même posté en
              g5 — la vérification confirme que ce coup est illégal — le roi se déplace donc en e7.
          outcome:
            type: position
            evaluation:
              vi:
                Đếm tốt, Trắng 8 còn Đen 7 — Trắng hơn đúng một tốt sạch nhờ đòn ăn tốt kèm chiếu. Đổi lại, vua
                Đen đã mất quyền nhập thành và con tượng Trắng trên f7 đang đứng sâu trong trận địa
                đối phương mà không có quân nào của Trắng bảo vệ.
              en:
                Count the pawns and it is 8 for White against 7 for Black — White is up a clean pawn from the
                capture-with-check. In exchange, Black's king has lost the right to castle, and the
                White bishop on f7 is sitting deep in enemy territory with no White piece defending
                it.
              fr:
                Comptez les pions, 8 pour les Blancs contre 7 pour les Noirs — les Blancs sont en avance d'un
                pion net grâce à la prise avec échec. En échange, le roi noir a perdu le droit de
                roquer, et le fou blanc en f7 se trouve loin en territoire ennemi sans qu'aucune
                pièce blanche ne le défende.
            plan:
              vi:
                Trắng tìm cách rút tượng f7 về an toàn hoặc dùng nó làm mồi để tiếp tục tấn công bằng Qf3 hay
                d4, khai thác việc vua Đen kẹt ở e7. Đen chơi Rf8 hoặc d6, vừa gây sức ép bắt tượng
                vừa hoàn thiện phòng thủ cho vua.
              en:
                White looks for a way to bring the bishop on f7 home safely, or uses it as bait while continuing
                the attack with Qf3 or d4, exploiting the fact that Black's king is stuck on e7.
                Black plays Rf8 or d6, both pressuring the bishop and shoring up the king's
                defences.
              fr:
                Les Blancs cherchent à ramener le fou f7 en sécurité, ou l'utilisent comme appât en poursuivant
                l'attaque avec Qf3 ou d4, exploitant le roi noir coincé en e7. Les Noirs jouent Rf8
                ou d6, à la fois pour presser le fou et pour renforcer la défense du roi.
            basis:
              by: chan
              at: 2026-09-29
