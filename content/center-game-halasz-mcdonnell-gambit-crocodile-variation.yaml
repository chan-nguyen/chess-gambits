tree:
  annotation:
    vi: Trắng vừa chơi 5.c3, đưa ra con tốt thứ hai. Tốt d4 của Đen bị tấn công ba lần, bởi tốt c3, mã f3 và hậu d1, và được bảo vệ hai lần, bởi mã c6 và tượng c5. Trắng có bảy tốt, Đen có tám.
    en: White has just played 5.c3, offering a second pawn. Black's pawn on d4 is attacked three times, by the c3 pawn, the knight on f3 and the queen on d1, and defended twice, by the knight on c6 and the bishop on c5. White has seven pawns, Black eight.
    fr: Les Blancs viennent de jouer 5.c3, offrant un second pion. Le pion d4 noir est attaqué trois fois, par le pion c3, le cavalier f3 et la dame d1, et défendu deux fois, par le cavalier c6 et le fou c5. Les Blancs ont sept pions, les Noirs huit.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 5...dxc3. Bài này chỉ đi theo nhánh ăn tốt 5...dxc3; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 5...dxc3 here. This entry follows the capture 5...dxc3 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 5...dxc3. Cette fiche ne suit que la prise 5...dxc3 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: dxc3
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen nhận con tốt thứ hai bằng 5...dxc3. Tốt c3 bị tốt b2 và mã b1 tấn công mà không có quân bảo vệ, nên Trắng ăn lại được ngay.
        en: Black accepts the second pawn with 5...dxc3. The pawn on c3 is attacked by the b2 pawn and the knight on b1 and defended by nothing, so White can recapture at once.
        fr: "Les Noirs acceptent le second pion par 5...dxc3. Le pion c3 est attaqué par le pion b2 et le cavalier b1 et n'est défendu par rien : les Blancs peuvent reprendre aussitôt."
      children:
        - ply: Nxc3
          annotation:
            vi: Trắng ăn lại bằng mã, 6.Nxc3, thay vì bằng tốt b. Mã vào cuộc và tốt b vẫn ở b2.
            en: White recaptures with the knight, 6.Nxc3, rather than with the b-pawn. The knight comes into play and the b-pawn stays on b2.
            fr: Les Blancs reprennent avec le cavalier, 6.Nxc3, plutôt qu'avec le pion b. Le cavalier entre en jeu et le pion b reste en b2.
          outcome:
            type: position
            evaluation:
              vi: 'Đếm tốt: Trắng sáu, Đen bảy, nên Trắng kém một tốt. Trắng không còn tốt c và d nên hai cột này nửa mở cho quân Trắng, còn Đen không còn tốt e; tốt e4 và f4 của Trắng giữ trung tâm. Tượng c5 của Đen nhắm vào f2 cạnh vua Trắng, vốn chưa nhập thành và còn cả hai quyền.'
              en: "Count the pawns: White six, Black seven, so White is a pawn down. White has no c- or d-pawn, so both files are half open for White's pieces, while Black has no e-pawn; White's pawns on e4 and f4 hold the centre. Black's bishop on c5 bears on f2, next to White's king, which has not castled and keeps both rights."
              fr: "Comptez les pions : six pour les Blancs, sept pour les Noirs ; les Blancs sont donc un pion en moins. Les Blancs n'ont plus de pion c ni d, si bien que ces deux colonnes sont semi-ouvertes pour leurs pièces, alors que les Noirs n'ont plus de pion e ; les pions blancs e4 et f4 tiennent le centre. Le fou c5 noir vise f2, à côté du roi blanc, qui n'a pas roqué et garde les deux droits."
            plan:
              vi: Trắng phát triển bằng Bc4 hoặc Bd3 rồi nhập thành sau khi tượng c5, đang nhắm vào g1, bị chặn hoặc bị đuổi đi, tận dụng các cột c và d nửa mở cùng tốt e4, f4. Đen hoàn tất phát triển bằng ...d6 và ...Nf6, giữ con tốt thừa.
              en: White develops with Bc4 or Bd3 and castles once the bishop on c5, which bears on g1, has been blocked or driven away, using the half-open c- and d-files and the pawns on e4 and f4. Black completes development with ...d6 and ...Nf6, keeping the extra pawn.
              fr: Les Blancs se développent par Bc4 ou Bd3 puis roquent une fois le fou c5, qui vise g1, bloqué ou chassé, en exploitant les colonnes c et d semi-ouvertes et les pions e4 et f4. Les Noirs achèvent leur développement par ...d6 et ...Nf6, en gardant le pion en plus.
            basis:
              by: chan
              at: '2026-09-30'
