tree:
  annotation:
    vi: Trắng chơi 3.c3, mời Đen ăn con tốt d4, nhưng đây là nhánh Đen từ chối lời mời ấy.
    en: White plays 3.c3, inviting Black to take the d4 pawn, but this is the branch where Black
      declines that invitation.
    fr:
      Les Blancs jouent 3.c3, invitant les Noirs à prendre le pion d4, mais c'est la branche où les
      Noirs déclinent cette invitation.
  dismissRest:
    reason:
      vi:
        Đen ăn tốt bằng dxc3 hoặc chơi nước khác ngoài e5. Ăn tốt dẫn sang biến Smith-Morra chấp nhận
        với đánh giá khác hẳn; các cách từ chối khác thường dẫn tới thế cờ tương tự e5.
      en: Black takes the pawn with dxc3, or plays something other than e5. Taking it leads into the
        Smith-Morra Accepted with a quite different assessment; other declining tries usually lead
        to a position similar to e5.
      fr: Les Noirs prennent le pion par dxc3, ou jouent autre chose que e5. La prise mène au Gambit
        Smith-Morra accepté avec une évaluation bien différente ; les autres refus mènent
        généralement à une position semblable à e5.
  children:
    - ply: e5
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Đen từ chối ăn tốt c3, phản kích ngay ở trung tâm bằng e5 để giữ vững con tốt d4 đã ăn được.
        en:
          Black declines the c3 pawn, striking back in the centre with e5 at once to hold on to the d4
          pawn already won.
        fr:
          Les Noirs déclinent le pion c3, frappant aussitôt le centre par e5 pour conserver le pion d4
          déjà gagné.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 7 còn Đen 8 — Đen hơn đúng một tốt sạch.
          en: Count the pawns and it is 7 for White against 8 for Black — Black is up one clean pawn.
          fr:
            "Comptez les pions : 7 pour les Blancs contre 8 pour les Noirs — les Noirs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng chơi cxd4 ăn lại tốt và có trung tâm vững, hoặc Nf3 gây sức ép lên e5 trước. Đen chơi Nc6
            hoặc d6, bảo vệ trung tâm và hoàn thiện phát triển trong lúc vẫn giữ con tốt thừa.
          en:
            White plays cxd4 to recapture and set up a solid centre, or Nf3 to pressure e5 first. Black
            plays Nc6 or d6, defending the centre and developing while still holding the extra pawn.
          fr:
            Les Blancs jouent cxd4 pour reprendre et installer un centre solide, ou Nf3 pour presser e5
            d'abord. Les Noirs jouent Nc6 ou d6, défendant le centre et se développant tout en
            gardant le pion supplémentaire.
        basis:
          by: chan
          at: 2026-09-29
