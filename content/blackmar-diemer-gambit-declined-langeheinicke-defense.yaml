# Blackmar-Diemer Gambit Declined, Langeheinicke Defense. Frozen defining line 1.d4 d5
# 2.e4 dxe4 3.Nc3 Nf6 4.f3, which ends on White's own ply, so the root is an opponent
# node (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 4...e3 5.Bxe3.
# Black's ...e3 leaves that pawn undefended, so White's forced reply Bxe3 simply wins
# it back, levelling material. searchMate at 3 moves from the resulting position
# returns no-mate, so no forced mate is claimed anywhere in this entry, and no capture
# is left going free at the leaf.
id: blackmar-diemer-gambit-declined-langeheinicke-defense
name: 'Blackmar-Diemer Gambit Declined: Langeheinicke Defense'
eco: D00
category: gambit
side: white
definingLine: [d4, d5, e4, dxe4, Nc3, Nf6, f3]
soundness:
  value: dubious
  reviewedAt: '2026-09-29'
  basis:
    by: chan
    at: '2026-09-29'
    source: >-
      Long-established Blackmar-Diemer Gambit theory. White offers a further pawn purely for
      open lines and quick development; declining the capture keeps the extra material but
      costs time. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-29'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa chơi 4.f3, mời Đen ăn lại tốt e4 để chuyển sang thế Accepted; ở đây Đen chọn không ăn (declined) và chơi cách khác. Trắng đã phát triển mã c3 và chuẩn bị mở đường cho tượng c1, đổi lại tạm thời chỉ kém một tốt trên bàn cờ (bảy so với tám) mà chưa lấy lại được.
    en: White has just played 4.f3, inviting Black to recapture on e4 and transpose to the Accepted lines; here Black declines that capture and plays something else instead. White has developed the knight to c3 and is preparing to open the diagonal for the c1-bishop, currently down one pawn on the board (seven against eight) with no recapture yet.
    fr: "Les Blancs viennent de jouer 4.f3, invitant les Noirs à reprendre en e4 pour transposer dans les lignes Accepted ; ici, les Noirs refusent cette capture et jouent autre chose. Les Blancs ont développé le cavalier en c3 et se préparent à ouvrir la diagonale du fou c1, actuellement un pion de moins sur l'échiquier (sept contre huit) sans reprise encore effectuée."
  dismissRest:
    reason:
      vi: 'Đen chơi cách khác thay vì ...e3 ở đây, kể cả việc ăn lại bằng ...exf3 để chuyển hẳn sang các thế Accepted đã biết. Đánh giá tương tự: Trắng luôn kém một tốt trên bàn tại thời điểm này nhưng bù lại bằng mã đã phát triển và trung tâm thoáng, bất kể Đen chọn hướng nào.'
      en: 'Black plays something other than ...e3 here, including recapturing with ...exf3 to transpose into the known Accepted lines. The assessment is similar throughout: White is always a pawn down on the board at this point but compensated by the developed knight and the open centre, whichever way Black goes.'
      fr: "Les Noirs jouent autre chose que ...e3 ici, y compris reprendre par ...exf3 pour transposer dans les lignes Accepted connues. L'évaluation reste similaire dans tous les cas : les Blancs sont toujours un pion de moins sur l'échiquier à ce stade, compensé par le cavalier développé et le centre ouvert, quelle que soit la direction choisie par les Noirs."
  children:
    - ply: e3
      replyQuality: inaccuracy
      frequency: rare
      annotation:
        vi: Đen đẩy tiếp con tốt đã ăn được xuống ...e3, giữ nó tạm thời an toàn khỏi việc bị đổi qua exf3, nhưng con tốt tiến quá sâu này lại không được bảo vệ.
        en: Black pushes the captured pawn further to ...e3, keeping it temporarily safe from being traded off via exf3, but this deeply advanced pawn is left undefended.
        fr: "Les Noirs poussent encore le pion capturé jusqu'en ...e3, le mettant temporairement à l'abri d'un échange par exf3, mais ce pion très avancé reste sans défense."
      children:
        - ply: Bxe3
          annotation:
            vi: Tượng c1 đơn giản ăn lại trên e3, vừa lấy lại tốt vừa phát triển quân.
            en: The c1-bishop simply captures on e3, winning the pawn back while developing the piece.
            fr: Le fou c1 capture simplement en e3, regagnant le pion tout en se développant.
          outcome:
            type: position
            evaluation:
              vi: 'Sau khi ăn lại, vật chất cân bằng: bảy tốt mỗi bên. Tượng Trắng đã ra ngoài và đứng khá tích cực trên e3, trong khi Đen vẫn chưa phát triển quân nào.'
              en: "After the recapture material is level: seven pawns each. White's bishop is out and stands quite actively on e3, while Black has still not developed a single piece."
              fr: "Après la reprise, le matériel est égal : sept pions de chaque côté. Le fou blanc est sorti et occupe une case assez active en e3, tandis que les Noirs n'ont encore développé aucune pièce."
            plan:
              vi: Trắng tiếp tục Nf3 và Bc4 hoặc Bd3, nhập thành nhanh và khai thác lợi thế phát triển đáng kể. Đen phải vội đưa quân ra bằng ...Nf6 và ...e6 hoặc ...g6 để bắt kịp.
              en: White continues with Nf3 and Bc4 or Bd3, castling quickly and exploiting a sizeable development lead. Black must hurry to bring pieces out with ...Nf6 and ...e6 or ...g6 to catch up.
              fr: Les Blancs poursuivent par Nf3 et Bc4 ou Bd3, roquant rapidement et exploitant une avance de développement conséquente. Les Noirs doivent se hâter de sortir leurs pièces par ...Nf6 et ...e6 ou ...g6 pour rattraper leur retard.
            basis:
              by: chan
              at: '2026-09-29'
