# Englund Gambit: Main Line. Frozen defining line 1.d4 e5 2.dxe5 Nc6 3.Nf3 Qe7, which ends
# on Black's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). The
# line below was replayed with chess.js before being annotated.
id: englund-gambit-main-line
name: 'Englund Gambit: Main Line'
eco: A40
category: gambit
side: black
definingLine: [d4, e5, dxe5, Nc6, Nf3, Qe7]
soundness:
  value: dubious
  reviewedAt: '2026-09-21'
  basis:
    by: chan
    at: '2026-09-21'
    source: >-
      A judgement. The queen on e7 pins nothing and only pressures the e5 pawn once more,
      which White answers by simply defending it with a developing move. Black is still a
      pawn down with a queen out early and no forced way back to material equality. No
      engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-21'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen đưa hậu ra e7, gây thêm áp lực lên con tốt e5 và chuẩn bị ăn lại nó bằng Qxe5 nếu Trắng không đỡ. Đây là cách chơi chính thống nhất của Englund Gambit, khác với việc thí quân hẳn ở Mosquito hay Soller Gambit.
    en: Black brings the queen to e7, adding pressure to the e5 pawn and preparing to take it back with Qxe5 if White does not defend it. This is the most mainstream handling of the Englund Gambit, unlike the outright piece offers of the Mosquito or Soller Gambits.
    fr: Les Noirs amènent la dame en e7, ajoutant de la pression sur le pion e5 et se préparant à le reprendre par Qxe5 si les Blancs ne le défendent pas. C'est le traitement le plus classique du Gambit Englund, contrairement aux offres de pièce pures et simples du Gambit Mosquito ou du Gambit Soller.
  dismissRest:
    reason:
      vi: Trắng không đỡ con tốt e5 bằng một nước phát triển tự nhiên. Các nước khác ở đây, như Qd4 hay Nc3, cũng có thể đỡ tốt theo cách khác nhưng không thay đổi bức tranh chung là Trắng vẫn hơn tốt và có phát triển tốt hơn.
      en: White does not defend the e5 pawn with a natural developing move. The alternatives here, such as Qd4 or Nc3, also defend the pawn in a different way but do not change the overall picture that White is still a pawn up with the better development.
      fr: Les Blancs ne défendent pas le pion e5 par un coup de développement naturel. Les alternatives ici, comme Qd4 ou Nc3, défendent aussi le pion d'une autre manière mais ne changent pas le tableau d'ensemble, les Blancs ont toujours un pion de plus et un meilleur développement.
  children:
    - ply: Bf4
      replyQuality: best
      frequency: common
      annotation:
        vi: Con tượng vừa phát triển vừa đỡ chắc con tốt e5, và bây giờ Đen không còn cách nào ăn lại nó một cách miễn phí.
        en: The bishop develops while defending the e5 pawn at the same time, and now Black has no way to win it back for free.
        fr: Le fou se développe tout en défendant le pion e5 en même temps, et les Noirs n'ont désormais plus aucun moyen de le regagner gratuitement.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy, đúng một tốt Trắng đang giữ từ 2.dxe5. Con tốt e5 giờ được tượng f4 đỡ chắc, còn con hậu Đen ở e7 chỉ để nhìn nó chứ không ăn được. Trắng có phát triển sớm và vững, còn Đen vẫn phải nghĩ cách bù lại con tốt.
          en: Count the pawns and it is eight for White, seven for Black, exactly the one White has held since 2.dxe5. The e5 pawn is now solidly defended by the bishop on f4, and Black's queen on e7 can only look at it rather than take it. White has quick, solid development, while Black still has to find a way to make up for the pawn.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs, exactement celui que les Blancs tiennent depuis 2.dxe5. Le pion e5 est désormais solidement défendu par le fou en f4, et la dame noire en e7 ne peut que le regarder sans le prendre. Les Blancs ont un développement rapide et solide, tandis que les Noirs doivent encore trouver comment compenser le pion.
        plan:
          vi: Đen chơi Qb4+ để lấy nhịp bằng cách chiếu, rồi Nf6 và d6, tìm cách phát triển nhanh và gây sức ép lên trung tâm để bù cho con tốt đã mất. Trắng chơi Nc3 hoặc Nbd2 để chặn nước chiếu, rồi e3, Nf3 và Bd3, hoàn tất phát triển và giữ vững con tốt thừa trước khi bước vào trung cuộc.
          en: Black plays Qb4+ to gain a tempo with check, then Nf6 and d6, trying to develop quickly and pressure the centre to make up for the lost pawn. White plays Nc3 or Nbd2 to block the check, then e3, Nf3 and Bd3, completing development and holding the extra pawn before heading into the middlegame.
          fr: Les Noirs jouent Qb4+ pour gagner un temps avec échec, puis Nf6 et d6, en essayant de se développer rapidement et de faire pression sur le centre pour compenser le pion perdu. Les Blancs jouent Nc3 ou Nbd2 pour bloquer l'échec, puis e3, Nf3 et Bd3, achevant leur développement et gardant le pion supplémentaire avant d'entrer dans le milieu de partie.
        basis:
          by: chan
          at: '2026-09-21'
