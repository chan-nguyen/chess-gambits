tree:
  annotation:
    vi:
      Sau khi Đen thí tốt để phát triển nhanh hai quân nhẹ ra ngoài (Bg4 rồi Bf5), Trắng chơi f3 đuổi
      tượng, và giờ tính đến việc giữ vững con tốt d5 đã ăn được từ đầu.
    en:
      After Black sacrifices a pawn to develop both minor pieces quickly (Bg4, then Bf5), White plays
      f3 to chase the bishop away, and now looks to hold on to the d5 pawn won right at the start.
    fr:
      Après que les Noirs ont sacrifié un pion pour développer rapidement leurs deux pièces mineures
      (Bg4 puis Bf5), les Blancs jouent f3 pour chasser le fou, et cherchent maintenant à conserver
      le pion d5 gagné dès le début.
  dismissRest:
    reason:
      vi:
        Trắng chơi nước khác ngoài 6.c4, ví dụ Bb5+ hay Nc3 ngay. Ý tưởng giữ tốt d5 và đánh giá chung —
        Trắng hơn tốt, Đen có nhịp độ và phát triển bù lại — không đổi nhiều.
      en:
        White plays something other than 6.c4, for instance Bb5+ or Nc3 right away. The idea of holding
        the d5 pawn and the overall assessment — White up a pawn, Black compensated by tempo and
        development — do not change much.
      fr:
        Les Blancs jouent autre chose que 6.c4, par exemple Bb5+ ou Nc3 tout de suite. L'idée de garder
        le pion d5 et l'évaluation générale — les Blancs en avance d'un pion, les Noirs compensés
        par le temps et le développement — ne changent guère.
  children:
    - ply: c4
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng củng cố thêm tốt d5 bằng c4, giữ vững con tốt thừa trước khi tính chuyện phát triển tiếp.
        en:
          White shores up the extra pawn on d5 with c4, holding on to the material before worrying about
          development.
        fr:
          Les Blancs consolident le pion supplémentaire en d5 avec c4, conservant le matériel avant de se
          soucier du développement.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 8 còn Đen 7 — Trắng hơn đúng một tốt sạch.
          en: Count the pawns and it is 8 for White against 7 for Black — White is up one clean pawn.
          fr:
            "Comptez les pions : 8 pour les Blancs contre 7 pour les Noirs — les Blancs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng chơi Nc3 và Nge2, hoàn thiện đội hình trong lúc vẫn giữ tốt d5 làm vốn liếng. Đen chơi
            Nbd7 và Qc8 hoặc Bb4+, thí thêm nhịp độ để đòi lại con tốt hoặc dựng thế công bù đắp.
          en:
            White plays Nc3 and Nge2, completing development while banking the d5 pawn as an asset. Black
            plays Nbd7 and Qc8, or Bb4+, spending more tempo either to win the pawn back or to build
            attacking compensation.
          fr:
            Les Blancs jouent Nc3 et Nge2, achevant leur développement tout en gardant le pion d5 comme
            atout. Les Noirs jouent Nbd7 et Qc8, ou Bb4+, dépensant encore du temps soit pour
            regagner le pion, soit pour construire une compensation offensive.
        basis:
          by: chan
          at: 2026-09-29
