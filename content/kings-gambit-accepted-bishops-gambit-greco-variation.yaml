tree:
  annotation:
    vi: Trắng vừa đưa tượng ra c4, Gambit Tượng. Mục này đi sâu riêng vào 3...Qh4+, buộc vua Trắng phải nhúc nhích ngay.
    en: White has just played the bishop to c4, the Bishop's Gambit. This entry follows specifically 3...Qh4+, forcing the White king to move at once.
    fr: Les Blancs viennent de jouer le fou en c4, le Gambit du Fou. Cette entrée suit spécifiquement 3...Dh4+, forçant aussitôt le roi blanc à bouger.
  dismissRest:
    reason:
      vi: Đen đáp lại 3.Bc4 bằng một nước khác ngoài 3...Qh4+ — giữ tốt bằng 3...g5, đánh trung tâm bằng 3...d5, hay phát triển bằng 3...Nf6. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 3.Bc4 with something other than 3...Qh4+ — holding the pawn with 3...g5, striking the centre with 3...d5, or developing with 3...Nf6. Each is outside the scope of this entry.
      fr: Les Noirs répondent à 3.Bc4 par autre chose que 3...Dh4+ — conserver le pion par 3...g5, une frappe centrale par 3...d5, ou un développement par 3...Nf6. Chacun sort du cadre de cette entrée.
  children:
    - ply: 'Qh4+'
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen chiếu ngay bằng hậu, quân duy nhất có thể chiếu ở đây, buộc Trắng phải trả lời trước khi làm gì khác.
        en: Black checks at once with the queen, the only piece that can check here, forcing White to answer before doing anything else.
        fr: Les Noirs donnent échec aussitôt avec la dame, la seule pièce pouvant le faire ici, forçant les Blancs à répondre avant toute autre chose.
      children:
        - ply: Kf1
          annotation:
            vi: Trắng chỉ có một cách hợp lệ để đáp lại chiếu này, vì không quân nào có thể chặn hay ăn con hậu ở h4. Vua mất quyền nhập thành ngay từ đầu.
            en: White has exactly one legal way to answer this check, since nothing can block or capture the queen on h4. The king loses castling rights right at the start.
            fr: Les Blancs n'ont qu'une seule façon légale de répondre à cet échec, car rien ne peut bloquer ou prendre la dame en h4. Le roi perd le droit de roquer dès le début.
          dismissRest:
            reason:
              vi: Đen đáp lại Kf1 bằng một nước khác ngoài 4...Bc5 — giữ tốt bằng 4...g5, phát triển bằng 4...Nf6 hay 4...Nc6, hay chơi 4...d6. Mỗi lựa chọn nằm ngoài phạm vi mục này.
              en: Black meets Kf1 with something other than 4...Bc5 — holding the pawn with 4...g5, developing with 4...Nf6 or 4...Nc6, or playing 4...d6. Each is outside the scope of this entry.
              fr: Les Noirs répondent à Kf1 par autre chose que 4...Fc5 — conserver le pion par 4...g5, un développement par 4...Cf6 ou 4...Cc6, ou 4...d6. Chacun sort du cadre de cette entrée.
          children:
            - ply: Bc5
              replyQuality: good
              frequency: occasional
              annotation:
                vi: Biến Greco. Đen đưa tượng ra một ô hoạt động, nhắm dọc đường chéo c5-g1 vào tốt f2 và chuẩn bị phát triển các quân còn lại mà không vội đẩy tốt cánh vua lên.
                en: The Greco Variation. Black develops the bishop to an active square, aiming down the c5-g1 diagonal at the f2 pawn, and gets ready to develop the rest of the pieces without hurrying the kingside pawns forward.
                fr: La Variante Greco. Les Noirs développent le fou sur une case active, visant le pion f2 le long de la diagonale c5-g1, et se préparent à développer le reste des pièces sans presser les pions de l'aile roi.
              outcome:
                type: position
                evaluation:
                  vi: Đen vẫn hơn đúng con tốt f4 ban đầu, nhưng con số ấy không phải điều quan trọng nhất ở đây. Hậu h4 và tượng c5 cùng nhắm vào ô f2 ngay cạnh vua, và ...Qxf2 sẽ là chiếu hết vì tượng c5 đỡ chắc cho hậu trong khi vua f1 không còn ô nào để chạy. Phần lớn các nước đi tự nhiên của Trắng — kể cả những nước phát triển bình thường như Nf3 hay Nc3 — mặc kệ mối đe dọa này và thua ngay lập tức; chỉ một số ít nước là an toàn.
                  en: Black is still exactly one pawn up, the original f4 pawn, but that is not the important number here. The queen on h4 and the bishop on c5 both bear on f2, right beside the king, and ...Qxf2 would be checkmate, because the bishop on c5 holds the queen up while the king on f1 has nowhere left to run. Most of White's natural-looking replies — including ordinary developing moves like Nf3 or Nc3 — ignore this threat and lose at once; only a handful of moves are safe.
                  fr: Les Noirs restent exactement un pion devant, le pion f4 initial, mais ce n'est pas le chiffre important ici. La dame en h4 et le fou en c5 visent tous deux f2, juste à côté du roi, et ...Dxf2 serait échec et mat, car le fou en c5 soutient la dame pendant que le roi en f1 n'a plus aucune case pour fuir. La plupart des réponses blanches d'apparence naturelle — y compris des coups de développement ordinaires comme Cf3 ou Cc3 — ignorent cette menace et perdent sur-le-champ ; seule une poignée de coups sont sûrs.
                plan:
                  vi: Trắng phải chơi chính xác — d4 chặn đường chéo của tượng và đồng thời đuổi nó đi, g3 chặn đường chéo của hậu, hoặc Qe2, Qf3, Qe1, Ke2, Nh3 đều đỡ hoặc né được ô f2; Bxf7+ cũng an toàn vì đó là một nước chiếu, buộc Đen phải trả lời trước. Đen lui hậu và tượng về nơi an toàn nếu bị đuổi, rồi Nf6 và Nc6, giữ con tốt f4 làm vốn liếng lâu dài và luôn để mắt tới ô f2 nếu Trắng lơ là.
                  en: White has to play accurately — d4 blocks the bishop's diagonal while chasing it away, g3 blocks the queen's diagonal, and Qe2, Qf3, Qe1, Ke2 or Nh3 all defend or sidestep f2; Bxf7+ is safe too, since it is a check of its own and forces Black to answer first. Black drops the queen and bishop back to safety if chased, then plays Nf6 and Nc6, banking the f4 pawn as a long-term asset and keeping an eye on f2 in case White ever gets careless.
                  fr: Les Blancs doivent jouer avec précision — d4 bloque la diagonale du fou tout en le chassant, g3 bloque la diagonale de la dame, et Qe2, Qf3, Qe1, Ke2 ou Nh3 défendent ou évitent tous f2 ; Bxf7+ est sûr aussi, puisque c'est un échec en soi qui force les Noirs à répondre d'abord. Les Noirs replient la dame et le fou en sécurité s'ils sont chassés, puis jouent Nf6 et Nc6, conservant le pion f4 comme atout durable et gardant un œil sur f2 si les Blancs se relâchent.
                basis:
                  by: chan
                  at: '2026-09-25'
