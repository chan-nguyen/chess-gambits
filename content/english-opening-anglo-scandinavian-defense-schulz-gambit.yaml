tree:
  annotation:
    vi: Đen đáp lại English Opening bằng ...d5, để Trắng ăn rồi phát triển mã ra f6 nhắm lại tốt d5, một phản-gambit theo kiểu Scandinavian đảo màu. Trắng phải chọn cách bảo vệ tốt đó.
    en: Black meets the English Opening with ...d5, letting White capture and then developing the knight to f6 to target the d5 pawn, a reversed-colour Scandinavian-style countergambit. White must choose how to defend that pawn.
    fr: Les Noirs répondent au Début Anglais par ...d5, laissant les Blancs capturer puis développant le cavalier en f6 pour viser le pion d5, une contre-offre à la Scandinave en couleurs inversées. Les Blancs doivent choisir comment défendre ce pion.
  dismissRest:
    reason:
      vi: 'Trắng chọn cách khác thay vì 3.Nc3 ở đây, ví dụ giữ tốt bằng e4 hoặc trả lại bằng Nf3. Đánh giá tương tự: Trắng giữ tốt dư trong khi Đen luôn có áp lực trực tiếp lên nó, bất kể Trắng chọn hướng nào.'
      en: 'White plays something other than 3.Nc3 here, for instance holding the pawn with e4 or handing it back with Nf3. The assessment is similar throughout: White holds the extra pawn while Black always presses on it directly, whichever way White goes.'
      fr: "Les Blancs jouent autre chose que 3.Nc3 ici, par exemple garder le pion par e4 ou le rendre par Nf3. L'évaluation reste similaire : les Blancs gardent le pion supplémentaire tandis que les Noirs font toujours pression dessus directement, quelle que soit la voie choisie."
  children:
    - ply: Nc3
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng bảo vệ tốt d5 bằng mã c3, vừa giữ vật chất vừa phát triển quân.
        en: White defends the d5 pawn with the knight on c3, holding the material while developing a piece.
        fr: Les Blancs défendent le pion d5 avec le cavalier en c3, gardant le matériel tout en développant une pièce.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng tám, Đen bảy — Trắng giữ đúng một tốt dư, được bảo vệ chắc chắn bởi mã c3. Đen đã phát triển một mã nhưng chưa tạo được đe doạ cụ thể nào khác lên tốt d5.'
          en: 'Count the pawns: White eight, Black seven — White holds exactly one extra pawn, now solidly defended by the c3-knight. Black has one knight developed but has not created any other concrete threat on the d5 pawn.'
          fr: "Comptez les pions : huit pour les Blancs, sept pour les Noirs — les Blancs gardent exactement un pion de plus, désormais solidement défendu par le cavalier c3. Les Noirs ont un cavalier développé mais n'ont créé aucune autre menace concrète sur le pion d5."
        plan:
          vi: Trắng tiếp tục e4 và Nf3, củng cố tốt d5 và hoàn tất phát triển, giữ tốt dư làm vốn lâu dài. Đen chơi ...g6 và ...Bg7 gây sức ép lên tốt d5 theo kiểu fianchetto, hoặc ...c6 chuẩn bị ...Qb6.
          en: White continues with e4 and Nf3, reinforcing the d5 pawn and finishing development, banking the extra pawn as a long-term asset. Black plays ...g6 and ...Bg7 to pressure d5 fianchetto-style, or ...c6 preparing ...Qb6.
          fr: Les Blancs poursuivent par e4 et Nf3, renforçant le pion d5 et achevant leur développement, conservant le pion supplémentaire comme atout durable. Les Noirs jouent ...g6 et ...Bg7 pour faire pression sur d5 à la façon du fianchetto, ou ...c6 préparant ...Qb6.
        basis:
          by: chan
          at: '2026-09-29'
