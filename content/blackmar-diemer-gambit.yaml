            - ply: Bf5
              replyQuality: good
              frequency: occasional
              annotation:
                vi: Phòng thủ Zeller. Đen đưa tượng ra ngoài dãy tốt trước khi chơi e6, đúng theo nguyên tắc chống mọi khai cuộc kiểu Pháp. Con tượng ở f5 cũng giữ thêm con tốt e4 một cách gián tiếp.
                en: The Zeller Defence. Black gets the bishop outside the pawn chain before playing ...e6, which is the standard principle against every French-like structure. The bishop on f5 also gives the e4 pawn indirect support.
                fr: La Défense Zeller. Les Noirs sortent le fou hors de la chaîne de pions avant de jouer ...e6, ce qui est le principe habituel contre toute structure de type française. Le fou en f5 soutient aussi indirectement le pion e4.
              children:
                - ply: f3
                  annotation:
                    vi: Trắng vẫn chơi f3. Sơ đồ không đổi vì con tượng f5 không ngăn được nó, và nếu Đen ăn exf3 thì Nxf3 hoặc Qxf3 đều cho Trắng thế trận quen thuộc, lần này kèm theo khả năng Bd3 đổi con tượng f5 đi.
                    en: White plays f3 anyway. The set-up does not change, because the bishop on f5 cannot stop it, and if Black takes with ...exf3 then either Nxf3 or Qxf3 gives White the familiar position, this time with Bd3 available to trade the f5 bishop off.
                    fr: Les Blancs jouent f3 malgré tout. Le dispositif ne change pas, car le fou f5 ne peut l'empêcher, et si les Noirs prennent par ...exf3, Nxf3 comme Qxf3 donnent aux Blancs la position habituelle, cette fois avec Bd3 disponible pour échanger le fou f5.
                  outcome:
                    type: position
                    evaluation:
                      vi: Đen hơn một tốt và con tượng trắng ô đã ra được chỗ tốt, đó là hai thứ mà phòng thủ này mua được bằng một nước. Trắng vẫn có sơ đồ cũ, và thêm một chi tiết là nước Bd3 sẽ hỏi con tượng f5 một câu khó. Về khách quan Đen đứng ít nhất là ngang bằng, nhưng thế cờ vẫn còn nhiều nhựa và người chơi Trắng vẫn ở trong lãnh thổ quen thuộc.
                      en: Black is a pawn up and has the light-squared bishop out on a good square, which is the two things this defence buys with one move. White still has the same scheme, plus the detail that Bd3 will ask the bishop on f5 an awkward question. Objectively Black is at least equal, but the position is still full of life and the White player is still on familiar ground.
                      fr: Les Noirs ont un pion de plus et le fou de cases claires sorti sur une bonne case, ce sont les deux choses que cette défense achète en un coup. Les Blancs gardent le même schéma, avec ce détail que Bd3 posera au fou f5 une question embarrassante. Objectivement les Noirs sont au moins à égalité, mais la position reste pleine de sève et le joueur blanc demeure en terrain connu.
                    plan:
                      vi: Trắng chơi fxe4 nếu Đen bỏ mặc con tốt, hoặc Nxf3 sau exf3, rồi Bd3 đổi con tượng f5, Nge2 hay Nf3, Be3 và Qd2 với O-O-O. Ý là đổi con tượng phòng thủ của Đen rồi đánh vào ô h7. Đen chơi e6 để nối tốt, rồi Bb4 hoặc Be7, Nf6, Nbd7 và O-O, giữ con tượng f5 khỏi bị đổi nếu được bằng cách lui về g6, và trả lại con tốt thừa nếu việc đó giúp hoàn tất phát triển.
                      en: White plays fxe4 if Black abandons the pawn, or Nxf3 after ...exf3, then Bd3 to trade the f5 bishop, Nge2 or Nf3, Be3 and Qd2 with O-O-O. The idea is to exchange Black's defending bishop and then attack h7. Black plays ...e6 to link the pawns, then ...Bb4 or ...Be7, ...Nf6, ...Nbd7 and ...O-O, keeps the f5 bishop from being traded by dropping it to g6 if possible, and gives the extra pawn back if that is what finishes development.
                      fr: Les Blancs jouent fxe4 si les Noirs abandonnent le pion, ou Nxf3 après ...exf3, puis Bd3 pour échanger le fou f5, Nge2 ou Nf3, Be3 et Qd2 avec O-O-O. L'idée est d'échanger le fou défenseur noir puis d'attaquer h7. Les Noirs jouent ...e6 pour relier les pions, puis ...Bb4 ou ...Be7, ...Nf6, ...Nbd7 et ...O-O, évitent l'échange du fou f5 en le repliant en g6 si possible, et rendent le pion en plus si cela achève le développement.
