    - ply: e6
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Đen từ chối bằng cách chuyển ván cờ sang Phòng thủ Pháp. Đây là cách né gambit hiệu quả nhất nếu bạn vốn đã chơi Pháp, vì Trắng không còn gì để thí và cũng không còn sơ đồ nào để thuộc lòng.
        en: Black declines by turning the game into a French Defence. This is the most effective way to dodge the gambit if you already play the French, because White has nothing left to sacrifice and no memorised scheme left to use.
        fr: Les Noirs refusent en transformant la partie en Défense française. C'est la façon la plus efficace d'esquiver le gambit si l'on joue déjà la française, car les Blancs n'ont plus rien à sacrifier ni de schéma appris à dérouler.
      children:
        - ply: Nc3
          annotation:
            vi: Trắng phát triển và bàn cờ bây giờ là một thế Pháp bình thường sau 1.e4 e6 2.d4 d5 3.Nc3. Không có con tốt nào bị thí và cũng không có cột f nào mở. Người chơi Blackmar-Diemer phải chấp nhận chơi cờ như mọi người.
            en: White develops and the board is now an ordinary French after 1.e4 e6 2.d4 d5 3.Nc3. No pawn has been sacrificed and no f-file has been opened. The Blackmar-Diemer player has to play chess like everybody else.
            fr: Les Blancs se développent et l'échiquier montre désormais une française ordinaire après 1.e4 e6 2.d4 d5 3.Nc3. Aucun pion n'a été sacrifié et aucune colonne f n'a été ouverte. Le joueur de Blackmar-Diemer doit jouer aux échecs comme tout le monde.
          outcome:
            type: position
            evaluation:
              vi: Quân số ngang nhau và thế cờ là Phòng thủ Pháp với mã c3, một trong những khai cuộc được nghiên cứu kỹ nhất. Đen chọn giữa Bb4 kiểu Winawer, Nf6 kiểu Cổ điển và dxe4 kiểu Rubinstein. Trắng không có gì đặc biệt, nhưng cũng không kém gì, và đó đã là một thành công đối với Đen vì Đen đã tránh được toàn bộ phần chuẩn bị của đối thủ.
              en: Material is level and the position is a French Defence with Nc3, one of the most thoroughly studied openings there is. Black chooses between the Winawer ...Bb4, the Classical ...Nf6 and the Rubinstein ...dxe4. White has nothing special, but nothing worse either — and for Black that already counts as a success, because the opponent's entire preparation has been sidestepped.
              fr: Le matériel est égal et la position est une Défense française avec Nc3, l'une des ouvertures les plus étudiées qui soient. Les Noirs choisissent entre la Winawer ...Bb4, la Classique ...Nf6 et la Rubinstein ...dxe4. Les Blancs n'ont rien de spécial, mais rien de pire non plus, et pour les Noirs c'est déjà un succès, puisque toute la préparation adverse a été contournée.
            plan:
              vi: Trắng chọn e5 để chiếm chỗ, Bg5 để ghim mã f6, hoặc exd5 để đơn giản hoá, và sau đó chơi Pháp một cách bình thường với Nf3, Bd3 và O-O. Đen chọn sơ đồ quen thuộc nhất của mình, và nếu là Winawer thì Bb4 rồi c5 là nước phá, còn nếu là Cổ điển thì Nf6, c5 và Nc6. Ai hiểu cấu trúc tốt Pháp hơn thì bên đó thắng, chứ không còn ai thuộc gambit hơn ai.
              en: White chooses between e5 for space, Bg5 to pin the f6 knight, and exd5 to simplify, then plays the French normally with Nf3, Bd3 and O-O. Black picks whichever scheme is most familiar — with the Winawer it is ...Bb4 and then ...c5 as the break, with the Classical it is ...Nf6, ...c5 and ...Nc6. The game is decided by who understands French pawn structures better, not by who has memorised more of a gambit.
              fr: Les Blancs choisissent entre e5 pour l'espace, Bg5 pour clouer le cavalier f6 et exd5 pour simplifier, puis jouent la française normalement avec Nf3, Bd3 et O-O. Les Noirs prennent le schéma qui leur est le plus familier — en Winawer, ...Bb4 puis ...c5 comme rupture ; en Classique, ...Nf6, ...c5 et ...Nc6. La partie se décide sur la compréhension des structures de pions françaises, non sur la mémoire d'un gambit.
