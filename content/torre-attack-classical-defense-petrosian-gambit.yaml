    source: >-
      A judgement. White pushes the d-pawn into Black's position, offering it in exchange
      for saddling Black with doubled d-pawns after the natural recapture. Black simply
      takes with 5...exd5 and ends up a clean pawn up with a slightly worse pawn structure
      to show for it — real, but not shown to be worth a full pawn yet. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
