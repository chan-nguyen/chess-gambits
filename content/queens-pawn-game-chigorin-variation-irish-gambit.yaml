    source: >-
      A judgement. Black offers the c-pawn to strike at the centre immediately and open
      lines before White's knight development is finished, in the spirit of the Albin and
      Benko complexes. It gives real practical activity, but White can simply take and
      consolidate with an extra, cleanly won pawn, so it is judged dubious rather than fully
      equal. No engine was consulted and no database was queried.
