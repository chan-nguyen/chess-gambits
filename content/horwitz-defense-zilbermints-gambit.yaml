# Horwitz Defense: Zilbermints Gambit. Frozen defining line 1.d4 e6 2.c4 e5, which ends on
# Black's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). The line
# below was replayed with chess.js before being annotated.
id: horwitz-defense-zilbermints-gambit
name: 'Horwitz Defense: Zilbermints Gambit'
eco: A40
category: gambit
side: black
definingLine: [d4, e6, c4, e5]
soundness:
  value: dubious
  reviewedAt: '2026-09-18'
  basis:
    by: chan
    at: '2026-09-18'
    source: >-
      A judgement. White simply takes the pawn with dxe5 and it stays taken — Black's case is
      quick development against a White centre still to be organised, real but not shown to
      be worth a full pawn yet. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Sau 1...e6 kiểu Horwitz, Đen chơi luôn 2...e5, một con tốt không được quân nào đỡ, mời Trắng ăn nó để đổi lấy nhịp độ phát triển trong khi trung tâm Trắng còn chưa hoàn thiện.
    en: After the Horwitz-style 1...e6, Black plays 2...e5 right away, an undefended pawn, offering it in exchange for tempo while White's centre is not yet complete.
    fr: Après le 1...e6 façon Horwitz, les Noirs jouent d'emblée 2...e5, un pion non défendu, l'offrant en échange de temps pendant que le centre blanc n'est pas encore complet.
  dismissRest:
    reason:
      vi: Trắng không ăn con tốt e5. Các nước khác như Nc3 hay Nf3 để nguyên con tốt e5 trên bàn cờ, nghĩa là lời mời vẫn chưa hề được nhận.
      en: White does not take the e5 pawn. Anything else, such as Nc3 or Nf3, leaves the e5 pawn sitting on the board, meaning the offer has still not actually been accepted.
      fr: Les Blancs ne prennent pas le pion e5. Tout le reste, comme Nc3 ou Nf3, laisse le pion e5 sur l'échiquier, ce qui veut dire que l'offre n'a toujours pas été acceptée.
  children:
    - ply: dxe5
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng ăn con tốt ngay lập tức bằng tốt d, quân duy nhất có thể ăn tại đó. Con tốt e5 không được quân Đen nào đỡ nên đây đơn giản là ăn một tốt miễn phí.
        en: White takes the pawn at once with the d-pawn, the only piece that can capture there. The e5 pawn is defended by nothing of Black's, so this is simply picking up a free pawn.
        fr: Les Blancs prennent aussitôt le pion avec le pion d, la seule pièce pouvant capturer là. Le pion e5 n'est défendu par rien du côté noir, il s'agit donc simplement de ramasser un pion gratuit.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy. Trắng hơn đúng một tốt sạch, con tốt e của Đen đã mất từ nước 2, và chưa có gì đòi lại được nó. Cái Đen có để bù lại chỉ là một nhịp phát triển, chưa phải điều gì đáng kể so với một tốt sạch.
          en: Count the pawns and it is eight for White, seven for Black. White is a clean pawn up, Black's e-pawn lost since move two, and nothing has won it back yet. What Black has to show for it is only one tempo of development, not much against a clean pawn.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs. Les Blancs ont un pion de plus bien réel, le pion e des Noirs perdu depuis le deuxième coup, et rien ne l'a encore récupéré. Ce que les Noirs ont à montrer pour cela n'est qu'un temps de développement, pas grand-chose face à un pion net.
        plan:
          vi: Trắng chơi Nc3, Nf3 và e4, hoàn tất phát triển và giữ vững con tốt thừa trước khi Đen kịp gây sức ép. Đen chơi Bc5 hay Nc6, Nf6 và O-O, tìm cách gây sức ép lên con tốt e5 và giành lại nó trước khi Trắng hoàn tất phát triển.
          en: White plays Nc3, Nf3 and e4, completing development and holding the extra pawn firmly before Black can build pressure. Black plays Bc5 or Nc6, Nf6 and O-O, trying to pressure the e5 pawn and win it back before White finishes developing.
          fr: Les Blancs jouent Nc3, Nf3 et e4, achevant leur développement et gardant fermement le pion supplémentaire avant que les Noirs ne puissent faire pression. Les Noirs jouent Bc5 ou Nc6, Nf6 et O-O, cherchant à faire pression sur le pion e5 et à le regagner avant que les Blancs n'achèvent leur développement.
        basis:
          by: chan
          at: '2026-09-18'
