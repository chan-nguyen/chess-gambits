# King's Gambit Declined: Falkbeer Countergambit, Tarrasch Variation, taught. Frozen
# defining line 1.e4 e5 2.f4 d5 3.exd5 e4 4.d3 Nf6 5.dxe4 Nxe4 6.Nf3 Bc5 7.Qe2 Bf5 8.g4 O-O
# ends on Black's own 8...O-O, so the root is an opponent node (docs/CONTEXT.md, invariant
# 5). The modelled line is 9.gxf5 Qxd5, so the leaf has White to move; the capture on f5 is
# White's reply and the recapture on d5 is Black's own move, so no capture is left going
# free. Every ply was replayed with chess.js; searchMate at 3 moves from the leaf returns
# no-mate, the leaf is not in check and no capture is going free.
id: kings-gambit-declined-falkbeer-countergambit-tarrasch-variation
name: "King's Gambit Declined: Falkbeer Countergambit, Tarrasch Variation"
eco: C32
category: gambit
side: black
definingLine: [e4, e5, f4, d5, exd5, e4, d3, Nf6, dxe4, Nxe4, Nf3, Bc5, Qe2, Bf5, g4, O-O]
soundness:
  value: dubious
  reviewedAt: '2026-09-30'
  basis:
    by: chan
    at: '2026-09-30'
    source: >-
      A judgement. After 8.g4 O-O White simply takes the bishop with 9.gxf5, and after 9...Qxd5
      Black has regained only the pawn on d5 for it, so White is left a whole bishop up. No engine
      was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-30'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement
    on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen vừa nhập thành bằng 8...O-O, để tượng f5 bị tốt g4 tấn công mà không có ai bảo vệ. Tốt g4 của Trắng cũng bị tượng f5 đánh mà không có ai bảo vệ, và tốt d5 bị hậu tấn công.
    en: Black has just castled with 8...O-O, leaving the bishop on f5 attacked by the pawn on g4 and defended by nothing. White's pawn on g4 is attacked by that bishop and defended by nothing, and the pawn on d5 is attacked by the queen.
    fr: Les Noirs viennent de roquer par 8...O-O, laissant le fou f5 attaqué par le pion g4 et défendu par rien. Le pion g4 des Blancs est attaqué par ce fou et défendu par rien, et le pion d5 est attaqué par la dame.
  dismissRest:
    reason:
      vi: Trắng không chơi 9.gxf5. Phần lớn các nước khác để tốt g4 cho Bxg4 hoặc tốt d5 cho Qxd5 ăn mà không quân nào ăn lại được.
      en: White plays something other than 9.gxf5. Most other moves leave the pawn on g4 to Bxg4 or the pawn on d5 to Qxd5, with nothing able to recapture.
      fr: Les Blancs jouent autre chose que 9.gxf5. La plupart des autres coups laissent le pion g4 à Bxg4 ou le pion d5 à Qxd5, sans que rien puisse reprendre.
  children:
    - ply: gxf5
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng ăn tượng bằng tốt. Mã e4, con mã mà tượng vừa bảo vệ, giờ bị hậu e2 đánh mà không có ai bảo vệ.
        en: White takes the bishop with the pawn. The knight on e4, which the bishop was defending, is now attacked by the queen on e2 and defended by nothing.
        fr: Les Blancs prennent le fou avec le pion. Le cavalier e4, que le fou défendait, est maintenant attaqué par la dame e2 et défendu par rien.
      children:
        - ply: Qxd5
          annotation:
            vi: Đen ăn tốt d5 bằng hậu, vừa bảo vệ mã e4, vừa đánh vào các tốt f5 và a2.
            en: Black takes the pawn on d5 with the queen, which defends the knight on e4 and attacks the pawns on f5 and a2.
            fr: Les Noirs prennent le pion d5 avec la dame, qui défend le cavalier e4 et attaque les pions f5 et a2.
          outcome:
            type: position
            evaluation:
              vi: 'Đếm quân: mỗi bên sáu tốt, nhưng Trắng hơn một tượng: Trắng còn hai tượng, Đen chỉ còn một. Tốt f5 của Trắng bị hậu đánh mà không có ai bảo vệ, còn mã e4 của Đen bị hậu e2 đánh và được hậu d5 bảo vệ.'
              en: "Count the material: six pawns each, but White is a bishop up: White has two bishops and Black only one. White's pawn on f5 is attacked by the queen and defended by nothing, and Black's knight on e4 is attacked by the queen on e2 and defended by the queen on d5."
              fr: 'Comptez le matériel : six pions de chaque côté, mais les Blancs ont un fou de plus : deux fous pour les Blancs, un seul pour les Noirs. Le pion f5 des Blancs est attaqué par la dame et défendu par rien, et le cavalier e4 des Noirs est attaqué par la dame e2 et défendu par la dame d5.'
            plan:
              vi: Trắng bảo vệ tốt f5, chẳng hạn bằng Bh3 hoặc Nh4, rồi hoàn tất phát triển. Đen đe dọa ...Qxf5 ăn tốt nếu Trắng để yên.
              en: White defends the pawn on f5, for example with Bh3 or Nh4, and then completes development. Black threatens ...Qxf5, winning the pawn if White leaves it alone.
              fr: Les Blancs défendent le pion f5, par exemple par Bh3 ou Nh4, puis achèvent leur développement. Les Noirs menacent ...Qxf5, gagnant le pion si les Blancs le laissent seul.
            basis:
              by: chan
              at: '2026-09-30'
