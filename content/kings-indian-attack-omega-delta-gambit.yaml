tree:
  annotation:
    vi: Đáp lại cách bố trí King's Indian Attack của Trắng, Đen chơi luôn 2...e5, một con tốt không được quân nào đỡ, mời mã f3 ăn nó để đổi lấy trung tâm rộng và nhịp độ phát triển.
    en: Answering White's King's Indian Attack set-up, Black plays 2...e5 right away, an undefended pawn, offering it to the f3 knight in exchange for a wide centre and development tempo.
    fr: En réponse à la mise en place King's Indian Attack des Blancs, les Noirs jouent d'emblée 2...e5, un pion non défendu, l'offrant au cavalier f3 en échange d'un large centre et d'un temps de développement.
  dismissRest:
    reason:
      vi: Trắng không ăn con tốt e5. Các nước khác như Bg2 hay d3 để nguyên con tốt e5 trên bàn cờ, nghĩa là lời mời vẫn chưa hề được nhận.
      en: White does not take the e5 pawn. Anything else, such as Bg2 or d3, leaves the e5 pawn sitting on the board, meaning the offer has still not actually been accepted.
      fr: Les Blancs ne prennent pas le pion e5. Tout le reste, comme Bg2 ou d3, laisse le pion e5 sur l'échiquier, ce qui veut dire que l'offre n'a toujours pas été acceptée.
  children:
    - ply: Nxe5
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng ăn con tốt bằng mã, quân duy nhất có thể ăn tại đó. Con tốt e5 không được quân Đen nào đỡ nên đây đơn giản là ăn một tốt miễn phí, dù đưa mã ra khá xa các quân còn lại.
        en: White takes the pawn with the knight, the only piece that can capture there. The e5 pawn is defended by nothing of Black's, so this is simply picking up a free pawn, even though it sends the knight rather far from the rest of the pieces.
        fr: Les Blancs prennent le pion avec le cavalier, la seule pièce pouvant capturer là. Le pion e5 n'est défendu par rien du côté noir, il s'agit donc simplement de ramasser un pion gratuit, même si cela envoie le cavalier assez loin des autres pièces.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy. Trắng hơn đúng một tốt sạch, con tốt e đã mất ngay từ nước 2, và chưa có gì đòi lại được nó. Cái Đen có để bù lại chỉ là hàng tốt trung tâm rộng với d5 còn nguyên, chưa phải điều gì đáng kể so với một tốt sạch.
          en: Count the pawns and it is eight for White, seven for Black. White is a clean pawn up, the e-pawn lost as early as move two, and nothing has won it back yet. What Black has to show for it is only the wide central pawn duo with d5 still standing, not much against a clean pawn.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs. Les Blancs ont un pion de plus bien réel, le pion e perdu dès le deuxième coup, et rien ne l'a encore récupéré. Ce que les Noirs ont à montrer pour cela n'est que le large duo de pions centraux avec d5 encore en place, pas grand-chose face à un pion net.
        plan:
          vi: Trắng chơi Bg2, d3 và O-O, hoàn tất bố trí và giữ vững con tốt thừa trước khi Đen kịp gây sức ép lên con mã e5. Đen chơi Nc6 hay f6, tấn công con mã e5 và cố giành lại con tốt trước khi Trắng hoàn tất phát triển.
          en: White plays Bg2, d3 and O-O, completing the set-up and holding the extra pawn firmly before Black can pressure the e5 knight. Black plays Nc6 or f6, attacking the e5 knight and trying to win the pawn back before White finishes developing.
          fr: Les Blancs jouent Bg2, d3 et O-O, achevant leur mise en place et gardant fermement le pion supplémentaire avant que les Noirs ne puissent faire pression sur le cavalier e5. Les Noirs jouent Nc6 ou f6, attaquant le cavalier e5 et cherchant à regagner le pion avant que les Blancs n'achèvent leur développement.
        basis:
          by: chan
          at: '2026-09-18'
