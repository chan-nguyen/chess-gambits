tree:
  annotation:
    vi: Trắng vừa ăn tốt e4 bằng mã, 4.Nxe4, thay vì ăn e5 bằng 4.dxe5. Tốt d4 bị tốt e5 của Đen tấn công và chỉ có hậu bảo vệ, nên Đen có thể ăn bằng 4...exd4.
    en: White has just taken the pawn on e4 with the knight, 4.Nxe4, rather than capturing on e5 with 4.dxe5. The pawn on d4 is attacked by Black's e5 pawn and defended only by the queen, so Black can take it with 4...exd4.
    fr: "Les Blancs viennent de prendre le pion e4 avec le cavalier, 4.Nxe4, plutôt que de prendre en e5 par 4.dxe5. Le pion d4 est attaqué par le pion e5 noir et n'est défendu que par la dame : les Noirs peuvent le prendre par 4...exd4."
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 4...exd4. Bài này chỉ đi theo nhánh ăn tốt d4; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 4...exd4 here. This entry follows the capture on d4 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 4...exd4. Cette fiche ne suit que la prise en d4 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: exd4
      replyQuality: good
      frequency: common
      annotation:
        vi: 'Đen ăn tốt d4 bằng 4...exd4. Tốt mới được hậu d8 bảo vệ, nên nếu Trắng chơi Qxd4 thì chỉ mất hậu: sau ...Qxd4 không quân Trắng nào ăn lại được.'
        en: Black takes on d4 with 4...exd4. The new pawn is defended by the queen on d8, and White's Qxd4 would simply lose the queen, since after ...Qxd4 no White piece could recapture.
        fr: 'Les Noirs prennent en d4, 4...exd4. Le nouveau pion est défendu par la dame d8 : Qxd4 ne ferait que perdre la dame, car après ...Qxd4 aucune pièce blanche ne pourrait reprendre.'
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng sáu, Đen bảy. Trắng đã hiến hai tốt, tốt e và tốt d, mới ăn lại một, nên đang kém một tốt. Tốt thừa d4 của Đen bị hậu d1 tấn công một lần và được hậu d8 bảo vệ một lần. Mã e4 của Trắng là quân duy nhất đã phát triển của cả hai bên.'
          en: "Count the pawns: White six, Black seven. White has given up two pawns, the e-pawn and the d-pawn, and taken one, so White is a pawn down. Black's extra pawn on d4 is attacked once, by the queen on d1, and defended once, by the queen on d8. White's knight on e4 is the only piece developed on either side."
          fr: "Comptez les pions : six pour les Blancs, sept pour les Noirs. Les Blancs ont cédé deux pions, le pion e et le pion d, et n'en ont repris qu'un : ils sont un pion en moins. Le pion d4 noir est attaqué une fois, par la dame d1, et défendu une fois, par la dame d8. Le cavalier e4 blanc est la seule pièce développée des deux camps."
        plan:
          vi: Trắng phát triển bằng Nf3, nước đi tấn công d4 lần thứ hai, rồi Bd3 và nhập thành, cố gắng lấy lại tốt khi còn dẫn trước về phát triển. Đen giữ d4 bằng ...Nc6 hoặc ...c5 và có thể đánh vào mã bằng ...f5, vừa giữ tốt thừa vừa bắt kịp phát triển.
          en: White develops with Nf3, which attacks d4 a second time, and Bd3, then castles, trying to win the pawn back while the lead in development lasts. Black holds d4 with ...Nc6 or ...c5 and can hit the knight with ...f5, keeping the extra pawn while catching up in development.
          fr: Les Blancs se développent par Nf3, qui attaque d4 une seconde fois, et Bd3, puis roquent, cherchant à récupérer le pion tant que l'avance de développement dure. Les Noirs tiennent d4 par ...Nc6 ou ...c5 et peuvent chasser le cavalier par ...f5, gardant le pion en plus tout en rattrapant leur retard de développement.
        basis:
          by: chan
          at: '2026-09-30'
