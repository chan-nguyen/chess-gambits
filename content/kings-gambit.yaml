              annotation:
                vi: Cách chơi cổ điển. Đen giữ con tốt f4 bằng cách dựng một dãy tốt g5-f4 và tính chuyện đẩy tiếp g4 để đuổi con mã f3. Nó tham lam nhưng hoàn toàn có cơ sở, và nó là lý do vì sao Gambit Vua nổi tiếng là hỗn loạn.
                en: The classical treatment. Black props the f4 pawn up with a g5-f4 chain and plans ...g4 to kick the knight off f3. It is greedy but entirely principled, and it is why the King's Gambit has its reputation for chaos.
                fr: Le traitement classique. Les Noirs étaient le pion f4 par la chaîne g5-f4 et prévoient ...g4 pour chasser le cavalier de f3. C'est gourmand mais tout à fait fondé, et c'est ce qui vaut au Gambit du Roi sa réputation de chaos.
