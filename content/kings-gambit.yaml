                            en: The Kieseritzky Gambit. The knight goes forward to e5 rather than back, and there it is stable because no black pawn can hit it. From e5 it looks at g4, f7 and d7 at once.
                            fr: Le Gambit Kieseritzky. Le cavalier avance en e5 au lieu de reculer, et il y est stable car aucun pion noir ne peut l'attaquer. De e5, il vise g4, f7 et d7 à la fois.
                          outcome:
                            type: position
                            evaluation:
                              vi: Trắng kém một tốt và thế cờ hoàn toàn không cân bằng. Đen có hai tốt liền nhau ở f4 và g4 cắm sâu, nhưng chúng cần quân đỡ mà quân Đen thì chưa ra. Con mã e5 của Trắng đứng rất tốt, cột h đã hé mở nhờ h4, và vua Đen chưa nhập thành được về cánh vua vì hàng g và f đều hỏng. Đây là thế cờ mà người thuộc lý thuyết hơn sẽ thắng.
                              en: White is a pawn down and the position is wildly unbalanced. Black has two connected pawns on f4 and g4 wedged deep in White's half, but they need pieces behind them and Black's pieces are not out yet. White's knight on e5 is excellent, the h-file is already half-open thanks to h4, and Black cannot castle kingside because the f- and g-pawns have left the shelter. This is a position where whoever knows more theory wins.
                              fr: Les Blancs ont un pion de moins et la position est franchement déséquilibrée. Les Noirs ont deux pions liés en f4 et g4 enfoncés dans le camp blanc, mais il leur faut des pièces derrière et les pièces noires ne sont pas sorties. Le cavalier blanc en e5 est excellent, la colonne h est déjà semi-ouverte grâce à h4, et les Noirs ne peuvent pas roquer du petit côté puisque les pions f et g ont quitté l'abri.
