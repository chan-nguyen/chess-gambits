                      fr: Les Blancs ont un pion de moins contre le centre e4-d4 et la colonne f semi-ouverte. Les Noirs n'ont encore dÃ©veloppÃ© aucune piÃ¨ce, mais leur structure est saine et le pion f4 est mieux tenu que dans les autres branches, car ...g5 peut venir sans permettre Ne5. La thÃ©orie juge la position Ã©quilibrÃ©e — le gambit ne donne pas d'avantage mais ne perd pas non plus.
                    plan:
                      vi: Trắng chơi Bxf4 hoặc Bc4 rồi O-O, Nc3 và dùng cột f. Nếu Đen chơi g5 thì Trắng không nhảy Ne5 nữa mà chơi h4 hoặc g3 để phá dãy tốt từ bên dưới. Đen chơi g5 để giữ tốt, Bg7 cho con tượng thở, Nc6 hoặc Nd7, và nhập thành dài. Đòn phá của Đen là h5 và g4 đẩy tiếp, còn đòn phá của Trắng là g3 hoặc e5 mở trung tâm khi vua Đen còn ở giữa.
                      en: White plays Bxf4 or Bc4, castles, brings the knight to c3 and uses the f-file. If Black plays ...g5, White no longer jumps to e5 but undermines the chain from below with h4 or g3. Black plays ...g5 to hold the pawn, ...Bg7 to give the bishop air, ...Nc6 or ...Nd7, and castles queenside. Black's break is ...h5 followed by ...g4; White's is g3, or e5 to open the centre while the black king is still in it.
                      fr: Les Blancs jouent Bxf4 ou Bc4, roquent, amènent le cavalier en c3 et exploitent la colonne f. Si les Noirs jouent ...g5, les Blancs ne sautent plus en e5 mais sapent la chaîne par en dessous avec h4 ou g3. Les Noirs jouent ...g5 pour tenir le pion, ...Bg7 pour aérer le fou, ...Nc6 ou ...Nd7, et roquent du grand côté. La rupture noire est ...h5 puis ...g4 ; celle des Blancs est g3, ou e5 pour ouvrir le centre tant que le roi noir y demeure.
                    basis:
                      by: chan
