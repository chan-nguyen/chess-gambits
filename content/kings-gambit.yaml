              children:
                - ply: exd5
                  annotation:
                    vi: Trắng ăn lại. Con tốt d5 bây giờ là của Trắng và nó sẽ bị đánh ngay, nhưng Trắng không cần giữ nó, cái Trắng cần là nhịp để chơi d4, Bxf4 và nhập thành.
                    en: White takes back. The pawn on d5 is White's now and it will be attacked at once, but White does not need to keep it — what White needs is the time to play d4, Bxf4 and castle.
                    fr: Les Blancs reprennent. Le pion d5 est dÃ©sormais blanc et sera attaquÃ© aussitÃ´t, mais les Blancs n'ont pas besoin de le garder — ce qu'il leur faut, c'est le temps de jouer d4, Bxf4 et de roquer.
                  outcome:
                    type: position
                    evaluation:
                      vi: Quân số ngang nhau. Trắng vẫn còn con tốt thừa ở d5 nhưng nó không giữ được, còn Đen vẫn còn con tốt f4 và cũng không giữ được. Điều thật sự quan trọng là cấu trúc đã mở và Trắng đi trước một nhịp phát triển. Đen thường chơi Nf6 rồi Nxd5 hoặc c6, và sau đó là một ván cờ mở bình thường chứ không còn là một cuộc tấn công.
                      en: Material is level. White still has the extra pawn on d5 but cannot hold it, and Black still has the pawn on f4 and cannot hold that either. What matters is that the structure has opened and White is one tempo ahead in development. Black usually plays ...Nf6 and either ...Nxd5 or ...c6, and what follows is an ordinary open game rather than an attack.
                      fr: Le matériel est égal. Les Blancs ont encore le pion en plus en d5 mais ne peuvent le conserver, et les Noirs ont encore le pion f4 et ne peuvent pas davantage le garder. Ce qui compte, c'est que la structure s'est ouverte et que les Blancs ont un temps d'avance au développement. Les Noirs jouent d'ordinaire ...Nf6 puis ...Nxd5 ou ...c6, et il s'ensuit une partie ouverte ordinaire plutôt qu'une attaque.
                    plan:
                      vi: Trắng chơi d4 để chiếm trung tâm, Bxf4 hoặc Bc4 tuỳ theo Đen làm gì với con tốt d5, rồi O-O và Nc3. Cột f nửa mở là tài sản dài hạn, nên xe f1 nên ở nguyên đó và quân nặng dồn vào f7. Đen nên chơi Nf6 đánh vào d5, đổi hết những gì đổi được ở trung tâm, cố giữ con tốt f4 thêm một chút bằng g5 chỉ khi vua đã an toàn, và nếu không thì trả tốt lại để hoàn tất phát triển với Bd6 và O-O.
                      en: White plays d4 for the centre, then Bxf4 or Bc4 depending on what Black does about the d5 pawn, then castles and brings the knight to c3. The half-open f-file is the long-term asset, so the rook stays on f1 and the heavy pieces aim at f7. Black should hit d5 with ...Nf6, trade off what can be traded in the centre, hold on to the f4 pawn with ...g5 only once the king is safe, and otherwise give the pawn back to finish developing with ...Bd6 and ...O-O.
                      fr: Les Blancs jouent d4 pour le centre, puis Bxf4 ou Bc4 selon ce que les Noirs font du pion d5, puis roquent et amÃ¨nent le cavalier en c3. La colonne f semi-ouverte est l'atout durable — la tour reste en f1 et les piÃ¨ces lourdes visent f7. Les Noirs doivent frapper d5 par ...Nf6, Ã©changer ce qui peut l'Ãªtre au centre, ne garder le pion f4 par ...g5 qu'une fois le roi en sÃ©curitÃ©, et sinon rendre le pion pour achever le dÃ©veloppement par ...Bd6 et ...O-O.
