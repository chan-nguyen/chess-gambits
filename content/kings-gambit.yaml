            - ply: d6
              replyQuality: good
              frequency: occasional
              annotation:
                vi: Phòng thủ Fischer. Đen chuẩn bị g5 nhưng giữ sẵn nước d6 để khi mã Trắng nhảy vào e5 thì đã có tốt d6 đuổi nó. Fischer viết rằng đây là cách bác bỏ Gambit Vua, và dù câu đó hơi mạnh thì nước đi vẫn rất tốt.
                en: The Fischer Defence. Black prepares ...g5 but keeps ...d6 in first, so that when the white knight jumps to e5 there is already a pawn on d6 to chase it. Fischer wrote that this refutes the King's Gambit; the claim is too strong, but the move is genuinely good.
                fr: La Défense Fischer. Les Noirs préparent ...g5 mais glissent ...d6 d'abord, de sorte que si le cavalier blanc saute en e5, un pion en d6 est déjà là pour le chasser. Fischer a écrit que cela réfutait le Gambit du Roi ; l'affirmation est excessive, mais le coup est réellement bon.
