    - ply: d5
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Phản gambit Falkbeer. Đen không ăn tốt mà thí lại một con tốt của mình để mở trung tâm ngay lập tức, đúng vào lúc nước f4 vừa làm vua Trắng hở. Đây là cách trả lời theo đúng nguyên tắc.
        en: The Falkbeer Countergambit. Black declines the pawn and offers one back instead, opening the centre exactly when f4 has loosened White's king. It is the principled answer.
        fr: Le Contre-gambit Falkbeer. Les Noirs refusent le pion et en offrent un à leur tour, ouvrant le centre juste au moment où f4 a affaibli le roi blanc. C'est la réponse de principe.
      children:
        - ply: exd5
          annotation:
            vi: Trắng phải ăn. Nếu fxe5 thì Đen chơi Qh4+ và Trắng gặp rắc rối thật sự, còn nếu bỏ mặc thì Đen ăn ở e4 và trung tâm của Trắng biến mất. Sau exd5 thì Đen thường đẩy tiếp e4 và cắm một con tốt vào giữa bàn cờ.
            en: White has to take. After fxe5 Black plays ...Qh4+ and White is in real trouble, and leaving it alone lets Black take on e4 and White's centre disappears. After exd5, Black usually pushes ...e4 and plants a pawn in the middle of the board.
            fr: Les Blancs doivent prendre. Après fxe5, les Noirs jouent ...Qh4+ et les Blancs sont en réelle difficulté, et ne rien faire permet la prise en e4, après quoi le centre blanc s'évapore. Après exd5, les Noirs poussent d'ordinaire ...e4 et plantent un pion au milieu de l'échiquier.
          outcome:
            type: position
            evaluation:
              vi: Trắng hơn một tốt trên danh nghĩa nhưng con tốt d5 không giữ được lâu, còn con tốt e5 của Đen thì đang được f4 đánh. Sau nước e4 tự nhiên của Đen, thế cờ trở thành cuộc giằng co quanh con tốt e4 cắm sâu ấy, và đó mới là nội dung thật của nhánh này. Thực tế coi như cân bằng, nhưng là kiểu cân bằng rất sắc.
              en: White is nominally a pawn up, but the pawn on d5 cannot be held for long and Black's pawn on e5 is attacked by f4. After Black's natural ...e4, the game turns into a fight around that advanced pawn, which is the real content of this branch. It is roughly balanced, but it is a sharp kind of balance.
              fr: Les Blancs ont nominalement un pion de plus, mais le pion d5 ne se garde pas longtemps et le pion noir e5 est attaqué par f4. Après le naturel ...e4 des Noirs, la partie se transforme en lutte autour de ce pion avancé, qui est le vrai contenu de cette branche. C'est à peu près équilibré, mais d'un équilibre très acéré.
            plan:
              vi: Trắng chơi d3 để đánh vào con tốt e4 của Đen, Nc3, Qe2 hoặc Nd2 rồi dxe4 và Nf3. Nếu ăn hết được tốt e4 mà không mất nhịp thì Trắng hơn tốt và thắng. Đen chơi e4 rồi Nf6, Bc5 hoặc Bb4+ để phát triển thật nhanh và O-O, sau đó Re8 ép vào cột e. Nước phá của Đen là c6 để lấy lại con tốt d5, và của Trắng là d3 hoặc Nc3 đánh vào e4.
              en: White plays d3 to attack the advanced pawn, then Nc3, Qe2 or Nd2, and finally dxe4 and Nf3. If White wins the e4 pawn without losing time, White is simply a pawn up and winning. Black plays ...e4, then ...Nf6, ...Bc5 or ...Bb4+ to develop quickly and castle, then ...Re8 down the e-file. Black's break is ...c6 to win the d5 pawn back; White's is d3, or Nc3 hitting e4.
              fr: Les Blancs jouent d3 pour attaquer le pion avancé, puis Nc3, Qe2 ou Nd2, et enfin dxe4 et Nf3. Si les Blancs gagnent le pion e4 sans perdre de temps, ils ont simplement un pion de plus et gagnent. Les Noirs jouent ...e4, puis ...Nf6, ...Bc5 ou ...Bb4+ pour se développer vite et roquer, puis ...Re8 sur la colonne e. La rupture noire est ...c6 pour reprendre le pion d5 ; celle des Blancs est d3, ou Nc3 contre e4.
            basis:
              by: chan
              at: '2026-09-17'
    - ply: Bc5
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Từ chối gambit theo kiểu cổ điển. Con tượng đứng ở c5 nhắm vào f2 và ô đó bây giờ chỉ còn vua đỡ, nên Trắng mất luôn quyền chơi nhập thành ngắn một cách thoải mái. Đen không lấy tốt mà lấy sự khó chịu.
        en: The classical way of declining. The bishop on c5 points at f2, which is now defended by the king alone, so White can no longer castle short comfortably. Black takes annoyance instead of a pawn.
        fr: La manière classique de refuser. Le fou en c5 vise f2, désormais défendu par le seul roi, si bien que les Blancs ne peuvent plus roquer confortablement du petit côté. Les Noirs prennent de la gêne plutôt qu'un pion.
      children:
        - ply: Nf3
          annotation:
            vi: Vẫn là nước phát triển đúng. Trắng chưa vội chơi fxe5 vì sau đó Qh4+ là rất khó chịu, nên Nf3 đi trước để bịt ô h4. Ván cờ chuyển sang kiểu vị trí, và Trắng thường sẽ chơi Nc3, d3 rồi Na4 để đổi con tượng c5.
            en: Still the right developing move. White is in no hurry with fxe5, because ...Qh4+ would then be very unpleasant, so Nf3 comes first and covers h4. The game turns positional, and White usually follows with Nc3, d3 and Na4 to trade that c5 bishop off.
            fr: Toujours le bon coup de développement. Les Blancs ne se pressent pas de jouer fxe5, car ...Qh4+ serait alors très désagréable ; Nf3 vient donc d'abord et couvre h4. La partie devient positionnelle, et les Blancs enchaînent d'ordinaire par Nc3, d3 puis Na4 pour échanger ce fou de c5.
          outcome:
            type: position
            evaluation:
              vi: Quân số ngang nhau và chưa bên nào thí gì cả. Trắng có thêm không gian ở cánh vua nhưng vua Trắng thì hở, và con tượng c5 nhìn thẳng vào f2 nên nhập thành ngắn là một quyết định phải cân nhắc chứ không còn tự động. Đen đứng vững chắc và dễ chơi hơn về mặt con người.
              en: Material is level and nobody has sacrificed anything. White has extra kingside space but a draughty king, and with the bishop on c5 staring at f2, castling short is a decision rather than a formality. Black is solid and, in human terms, the easier side to play.
              fr: Le matériel est égal et personne n'a rien sacrifié. Les Blancs ont de l'espace à l'aile roi mais un roi exposé, et avec le fou en c5 braqué sur f2, le petit roque devient une décision et non une formalité. Les Noirs sont solides et, humainement, plus faciles à jouer.
            plan:
              vi: Trắng chơi Nc3 và d3 trước, rồi Na4 để đổi con tượng c5, sau đó mới tính đến fxe5 hoặc f5 chiếm chỗ. Nhập thành dài cũng là một lựa chọn hợp lý ở đây. Đen giữ tượng ở c5 càng lâu càng tốt, chơi d6, Nf6, Nc6 và O-O, rồi tìm cách mở trung tâm bằng d5 hoặc exf4 vào đúng lúc con tượng vẫn còn nhắm f2.
              en: White plays Nc3 and d3 first, then Na4 to exchange the c5 bishop, and only then considers fxe5 or the space-gaining f5. Castling queenside is a sensible option here too. Black keeps the bishop on c5 as long as possible, plays ...d6, ...Nf6, ...Nc6 and ...O-O, and looks to open the centre with ...d5 or ...exf4 at a moment when the bishop still bears down on f2.
              fr: Les Blancs jouent d'abord Nc3 et d3, puis Na4 pour échanger le fou de c5, et n'envisagent qu'ensuite fxe5 ou le gain d'espace f5. Le grand roque est aussi une option raisonnable ici. Les Noirs gardent le fou en c5 le plus longtemps possible, jouent ...d6, ...Nf6, ...Nc6 et ...O-O, et cherchent à ouvrir le centre par ...d5 ou ...exf4 à un moment où le fou vise encore f2.
            basis:
              by: chan
              at: '2026-09-17'
