# The King's Gambit. The defining line is the frozen one — 1.e4 e5 2.f4 — which ends on
# White's own ply, so the root is an opponent node and every reply carries a quality
# (docs/CONTEXT.md, invariant 5).
#
# Nothing here claims a mate. Every leaf is an assessment, because none of these lines
# forces mate and a claim the build cannot prove is refused rather than downgraded
# (ADR-0005). Every move below was replayed with chess.js before it was written down.
id: kings-gambit
name: "King's Gambit"
eco: C30
category: gambit
side: white
definingLine: [e4, e5, f4]
soundness:
  value: dubious
  reviewedAt: '2026-09-17'
  basis:
    by: chan
    at: '2026-09-17'
    source: >-
      A judgement, not a measurement, and the same label the catalogue's family rule
      carries. Modern theory holds that Black equalises with the Modern Defence 3...d5 and
      with the Fischer Defence 3...d6, so the pawn is not fully compensated against correct
      play; at club level the open f-file and the lead in development win far more games
      than the theory suggests. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-17'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng cho không một con tốt ở f4 để đổi lấy trung tâm và cột f. Ý tưởng là sau khi Đen ăn ở f4, Trắng chơi Nf3 rồi d4, dựng một trung tâm tốt to và mở cột f nhắm thẳng vào ô f7. Cái giá phải trả là ô e1-h4 bị hở, nên nước Qh4+ của Đen luôn là chuyện phải tính.
    en: White simply gives the f4 pawn away for the centre and the f-file. The idea is that after Black takes on f4, White plays Nf3 and d4, builds a big pawn centre and opens the f-file straight at f7. The price is the e1-h4 diagonal, so ...Qh4+ is always something to reckon with.
    fr: Les Blancs donnent purement et simplement le pion f4 contre le centre et la colonne f. L'idée est qu'après la prise noire en f4, les Blancs jouent Nf3 puis d4, bâtissent un gros centre de pions et ouvrent la colonne f droit sur f7. Le prix à payer est la diagonale e1-h4, si bien que ...Qh4+ est toujours à prendre en compte.
  dismissRest:
    reason:
      vi: Đen chơi một nước khác. Trắng tiếp tục theo kế hoạch cũ, tức là Nf3 để chặn trước nước Qh4+, rồi d4, Bc4 hay Bd3 và nhập thành ngắn. Nếu Đen không ăn ở f4 thì Trắng có thể tự chọn lúc chơi fxe5, và thế cờ trở thành một ván Khai cuộc Tốt Vua bình thường mà Trắng có thêm không gian. Nước 2...Qh4+ 3.g3 thì con hậu phải lui và Trắng được nhịp.
      en: Black plays something else. White carries on with the same plan — Nf3 first, so that ...Qh4+ is answered before it is played, then d4, Bc4 or Bd3 and short castling. If Black never takes on f4, White chooses the moment for fxe5 and the game becomes an ordinary king's-pawn opening with extra space. 2...Qh4+ 3.g3 only sends the queen back and hands White a tempo.
      fr: Les Noirs jouent autre chose. Les Blancs poursuivent le mÃªme plan — Nf3 d'abord, pour que ...Qh4+ soit parÃ© avant d'Ãªtre jouÃ©, puis d4, Bc4 ou Bd3 et le petit roque. Si les Noirs ne prennent jamais en f4, ce sont les Blancs qui choisissent le moment de fxe5 et la partie devient une ouverture du pion roi ordinaire avec de l'espace en plus. 2...Qh4+ 3.g3 ne fait que renvoyer la dame et offre un temps aux Blancs.
  children:
    - ply: exf4
      replyQuality: good
      frequency: common
      annotation:
        vi: Gambit Vua được chấp nhận. Đây là cách trả lời thẳng thắn nhất và cũng là cách thường gặp nhất. Đen cầm tốt và nhận lấy nhiệm vụ giữ nó hoặc trả lại nó vào lúc có lợi nhất.
        en: The King's Gambit Accepted. This is the most direct answer and the one that turns up most often. Black takes the pawn and takes on the job of either holding it or giving it back at the best moment.
        fr: Le Gambit du Roi accepté. C'est la réponse la plus directe et la plus fréquente. Les Noirs prennent le pion et acceptent la tâche de le garder ou de le rendre au meilleur moment.
      children:
        - ply: Nf3
          annotation:
            vi: Nước gần như bắt buộc, và lý do đầu tiên là con mã f3 đánh luôn ô h4, nên nước chiếu 3...Qh4+ bị trả lời bằng 4.Nxh4 và Đen mất hậu. Mã cũng nhắm vào e5 và g5, và nó dọn đường cho d4. Chơi 3.Bc4 trước thì Đen có Qh4+ 4.Kf1 và Trắng mất quyền nhập thành.
            en: Close to forced, and the first reason is that the knight on f3 covers h4, so the check 3...Qh4+ is simply answered by 4.Nxh4 and Black has lost the queen. The knight also eyes e5 and g5 and clears the way for d4. Playing 3.Bc4 first allows 3...Qh4+ 4.Kf1 and White has lost the right to castle.
            fr: Quasi forcé, et la première raison est que le cavalier f3 contrôle h4, si bien que l'échec 3...Qh4+ se réfute par 4.Nxh4 et les Noirs perdent la dame. Le cavalier surveille aussi e5 et g5 et dégage la voie pour d4. Jouer 3.Bc4 d'abord permet 3...Qh4+ 4.Kf1 et les Blancs ont perdu le droit de roquer.
          dismissRest:
            reason:
              vi: Đen chơi một nước khác. Nước 3...Qh4+ chỉ mất hậu vì 4.Nxh4. Các nước 3...Be7 kiểu Cunningham, 3...Nf6 kiểu Schallopp hay 3...h6 đều chơi được và đều dẫn đến cùng một loại thế cờ, ở đó Trắng chơi d4, Bc4 hoặc Bxf4 và O-O, lấy lại con tốt hoặc để nó lại để đổi lấy trung tâm và cột f. Không nước nào trong số đó bác bỏ gambit, và cũng không nước nào giữ được tốt f4 lâu dài mà không nhượng bộ chỗ khác.
              en: Black plays something else. 3...Qh4+ merely loses the queen to 4.Nxh4. The Cunningham 3...Be7, the Schallopp 3...Nf6 and 3...h6 are all playable and all lead to the same kind of game, where White plays d4, Bc4 or Bxf4 and castles, recovering the pawn or leaving it there in exchange for the centre and the f-file. None of them refutes the gambit, and none of them holds the f4 pawn for long without conceding something else.
              fr: Les Noirs jouent autre chose. 3...Qh4+ perd simplement la dame après 4.Nxh4. Le Cunningham 3...Be7, le Schallopp 3...Nf6 et 3...h6 sont tous jouables et mènent tous au même type de partie, où les Blancs jouent d4, Bc4 ou Bxf4 puis roquent, en récupérant le pion ou en le laissant contre le centre et la colonne f. Aucun ne réfute le gambit, et aucun ne conserve durablement le pion f4 sans concéder ailleurs.
