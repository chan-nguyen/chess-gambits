# King's Gambit Accepted: Lolli Gambit, Young Variation, taught. Frozen defining line 1.e4
# e5 2.f4 exf4 3.Nf3 g5 4.Bc4 g4 5.Bxf7+ Kxf7 6.O-O gxf3 7.Qxf3 Qf6 8.d4 Qxd4+ 9.Be3 Qf6
# 10.Nc3 ends on White's own 10.Nc3, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). Black's 10...Nc6 is modelled as the root's single reply, so the leaf has
# White to move. Every ply was replayed with chess.js; searchMate at 3 moves from the leaf
# returns no-mate, the leaf is not in check and no capture is going free in the machine's
# sense (every capture on the board can be recaptured).
