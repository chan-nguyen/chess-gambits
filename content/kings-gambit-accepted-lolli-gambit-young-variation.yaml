tree:
  annotation:
    vi: Trắng vừa chơi 10.Nc3, đưa quân nhẹ cuối cùng vào cuộc. Hậu f3 và tượng e3 cùng tấn công tốt f4, con tốt mà hậu f6 đang bảo vệ; hậu Đen cũng đánh vào mã c3, con mã được tốt b2 bảo vệ.
    en: White has just played 10.Nc3, bringing the last minor piece into play. The queen on f3 and the bishop on e3 both attack the pawn on f4, which the queen on f6 defends; Black's queen also attacks the knight on c3, which the pawn on b2 defends.
    fr: Les Blancs viennent de jouer 10.Nc3, mettant en jeu la dernière pièce mineure. La dame f3 et le fou e3 attaquent tous deux le pion f4, que la dame f6 défend ; la dame noire attaque aussi le cavalier c3, que le pion b2 défend.
  dismissRest:
    reason:
      vi: Đen chơi một nước khác thay vì 10...Nc6, chẳng hạn 10...Nh6 hoặc 10...Ne7. Phần lớn các nước còn lại cho Trắng ăn được tốt f4, con tốt đang bị đánh hai lần mà chỉ có một quân bảo vệ.
      en: Black plays something other than 10...Nc6, for example 10...Nh6 or 10...Ne7. Most other moves let White win the pawn on f4, which is attacked twice and defended once.
      fr: Les Noirs jouent autre chose que 10...Nc6, par exemple 10...Nh6 ou 10...Ne7. La plupart des autres coups permettent aux Blancs de gagner le pion f4, attaqué deux fois et défendu une seule fois.
  children:
    - ply: Nc6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen phát triển mã lên c6, nước đó cũng bảo vệ tốt a7, con tốt mà tượng e3 đang đánh.
        en: Black develops a knight to c6, which also defends the pawn on a7 that the bishop on e3 attacks.
        fr: Les Noirs développent un cavalier en c6, qui défend aussi le pion a7 que le fou e3 attaque.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm quân: mỗi bên sáu tốt, nhưng Trắng kém hai quân nhẹ, một mã và một tượng. Mã c3 của Trắng bị hậu đánh và chỉ có tốt b2 bảo vệ, tượng e3 bị tốt f4 đánh và chỉ có hậu bảo vệ, còn tốt f4 của Đen bị đánh hai lần và chỉ có một quân bảo vệ.'
          en: "Count the material: six pawns each, but White is two minor pieces down, a knight and a bishop. White's knight on c3 is attacked by the queen and defended only by the pawn on b2, the bishop on e3 is attacked by the pawn on f4 and defended only by the queen, and Black's pawn on f4 is attacked twice and defended once."
          fr: 'Comptez le matériel : six pions de chaque côté, mais les Blancs sont en moins deux pièces mineures, un cavalier et un fou. Le cavalier c3 des Blancs est attaqué par la dame et défendu seulement par le pion b2, le fou e3 est attaqué par le pion f4 et défendu seulement par la dame, et le pion f4 des Noirs est attaqué deux fois et défendu une seule fois.'
        plan:
          vi: Trắng có thể ăn tốt f4 bằng Bxf4, nước đó cũng đánh vào tốt c7 không có ai bảo vệ. Đen muốn đổi bớt quân tấn công của Trắng bằng ...fxe3 hoặc ...Qxc3 và giữ hai quân nhẹ hơn.
          en: White can take the pawn on f4 with Bxf4, which also attacks the undefended pawn on c7. Black wants to trade off White's attacking pieces with ...fxe3 or ...Qxc3 and keep the two extra minor pieces.
          fr: Les Blancs peuvent prendre le pion f4 par Bxf4, qui attaque aussi le pion c7 sans défense. Les Noirs veulent échanger les pièces d'attaque des Blancs par ...fxe3 ou ...Qxc3 et garder les deux pièces mineures de plus.
        basis:
          by: chan
          at: '2026-09-30'
