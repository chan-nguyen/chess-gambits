# King's Gambit Accepted, Muzio Gambit, Kling and Horwitz Counterattack, taught. Shares its
# 9-ply root, 1.e4 e5 2.f4 exf4 3.Nf3 g5 4.Bc4 g4 5.O-O, with
# `kings-gambit-accepted-muzio-gambit-brentano-defense`, so `definingLine` stops there — the
# learner's own 5.O-O — and Black's 5...Qe7, the move that gives this entry its name, is
# modelled as the root's own reply (docs/CONTEXT.md, invariant 5). Every ply was replayed
# with chess.js, and the leaf was checked with `searchMate` (bounded to 2 moves): no-mate,
# not in check, no free capture. `f7` was independently confirmed attacked by White and now
# defended by Black with `chess.js`'s `isAttacked`.
id: muzio-gambit-kling-and-horwitz-counterattack
name: "King's Gambit Accepted: Muzio Gambit, Kling and Horwitz Counterattack"
eco: C37
category: gambit
side: white
definingLine: [e4, e5, f4, exf4, Nf3, g5, Bc4, g4, O-O]
soundness:
  value: dubious
  reviewedAt: '2026-09-29'
  basis:
    by: chan
    at: '2026-09-29'
    source: >-
      A judgement. White gives up the f3 knight outright by castling, and Black answers by
      shoring up f7 rather than grabbing the piece — a solid, practical reply, not a proven
      refutation of White's attacking chances. No engine was consulted and no database was
      queried.
judgement:
  by: chan
  at: '2026-09-29'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng nhập thành, hiến hẳn con mã f3 đang bị tốt g4 tấn công để đổi lấy cột f mở.
    en: White castles, offering up the knight on f3, which the g4 pawn attacks, for the open f-file.
    fr: Les Blancs roquent, offrant le cavalier f3, attaqué par le pion g4, contre la colonne f ouverte.
  dismissRest:
    reason:
      vi: Đen chơi khác 5...Qe7 — chẳng hạn ăn luôn mã bằng ...gxf3 hay phản công trung tâm bằng ...d5. Mỗi cách nằm ngoài phạm vi mục này.
      en: Black plays something other than 5...Qe7 — for instance capturing the knight at once with ...gxf3 or counterattacking the centre with ...d5. Each is outside the scope of this entry.
      fr: Les Noirs jouent autre chose que 5...Qe7 — par exemple capturer aussitôt le cavalier par ...gxf3 ou contre-attaquer le centre par ...d5. Chacun sort du cadre de cette entrée.
  children:
    - ply: Qe7
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Thay vì ăn mã ngay, Đen đưa hậu ra e7, thêm một quân bảo vệ cho tốt f7 đang bị tượng c4 nhắm tới.
        en: Instead of capturing the knight at once, Black brings the queen to e7, adding a defender to the f7 pawn the bishop on c4 is aiming at.
        fr: Plutôt que de capturer aussitôt le cavalier, les Noirs amènent la dame en e7, ajoutant un défenseur au pion f7 visé par le fou c4.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng bảy, Đen tám — Trắng vẫn kém một tốt. Tốt f7 của Đen đang bị tượng c4 tấn công nhưng giờ đã được hậu e7 bảo vệ thêm (đã kiểm tra lại bằng chess.js), nên Trắng chưa thể khai thác ngay đường chéo ấy.
          en: Count the pawns and it is seven for White, eight for Black — White is still a pawn down. Black's f7 pawn is attacked by the bishop on c4 but is now defended by the queen on e7, independently confirmed with chess.js, so White cannot yet exploit that diagonal directly.
          fr: Comptez les pions, sept pour les Blancs, huit pour les Noirs — les Blancs restent en retard d'un pion. Le pion f7 noir est attaqué par le fou c4 mais est désormais défendu par la dame en e7, ce qui a été vérifié avec chess.js, si bien que les Blancs ne peuvent pas encore exploiter directement cette diagonale.
        plan:
          vi: Trắng chơi e5 giành thêm không gian và mở đường cho các quân, hoặc Nc3 hoàn tất phát triển trước khi tính chuyện ăn lại tốt f4. Đen chơi ...Bg7 và ...Nc6, hoàn tất phát triển trong lúc vẫn giữ được tốt thừa và con hậu che chắn cho cánh vua.
          en: White plays e5 to gain more space and open lines for the pieces, or Nc3 to finish developing before thinking about winning back the f4 pawn. Black plays ...Bg7 and ...Nc6, finishing development while still holding the extra pawn with the queen shielding the kingside.
          fr: Les Blancs jouent e5 pour gagner plus d'espace et ouvrir des lignes pour leurs pièces, ou Nc3 pour achever leur développement avant de songer à regagner le pion f4. Les Noirs jouent ...Bg7 et ...Nc6, achevant leur développement tout en conservant le pion supplémentaire, la dame protégeant l'aile roi.
        basis:
          by: chan
          at: '2026-09-29'
