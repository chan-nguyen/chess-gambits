tree:
  annotation:
    vi:
      Sau khi Trắng chiếu Bb5+ và Đen chặn bằng Nbd7, Trắng tiếp tục kế hoạch củng cố con tốt d5 bằng
      c4 thay vì đổi tượng ngay.
    en:
      After White checks with Bb5+ and Black blocks with Nbd7, White continues the plan of shoring up
      the d5 pawn with c4 rather than trading the bishop off at once.
    fr:
      Après l'échec des Blancs par Bb5+ et le blocage noir par Nbd7, les Blancs poursuivent le plan de
      consolidation du pion d5 avec c4 plutôt que d'échanger le fou tout de suite.
  dismissRest:
    reason:
      vi:
        Trắng chơi nước khác ngoài 7.c4, ví dụ đổi tượng bằng Bxd7+ trước hoặc Nc3 ngay. Đánh giá chung
        — Trắng hơn tốt, Đen có nhịp độ bù lại — không đổi nhiều.
      en:
        White plays something other than 7.c4, for instance trading first with Bxd7+ or playing Nc3 at
        once. The overall assessment — White up a pawn, Black compensated by tempo — does not change
        much.
      fr:
        Les Blancs jouent autre chose que 7.c4, par exemple échanger d'abord par Bxd7+ ou jouer Nc3 tout
        de suite. L'évaluation générale — les Blancs en avance d'un pion, les Noirs compensés par le
        temps — ne change guère.
  children:
    - ply: c4
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng vẫn củng cố tốt d5 bằng c4, tiếp tục kế hoạch giữ vật chất sau khi đã ra chiếu Bb5+.
        en:
          White still shores up the d5 pawn with c4, continuing the plan of holding the material after the
          check on b5.
        fr:
          Les Blancs consolident toujours le pion d5 avec c4, poursuivant le plan de conservation du
          matériel après l'échec en b5.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 8 còn Đen 7 — Trắng hơn đúng một tốt sạch.
          en: Count the pawns and it is 8 for White against 7 for Black — White is up one clean pawn.
          fr:
            "Comptez les pions : 8 pour les Blancs contre 7 pour les Noirs — les Blancs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng chơi Nc3 và Nge2, hoàn thiện đội hình và giữ vững con tốt thừa. Đen chơi a6 đuổi tượng
            hoặc Qc8, tìm cách gây sức ép lên cột c và đòi lại con tốt.
          en:
            White plays Nc3 and Nge2, completing development while holding the extra pawn. Black plays a6 to
            chase the bishop, or Qc8, trying to build pressure down the c-file and win the pawn
            back.
          fr: Les Blancs jouent Nc3 et Nge2, achevant leur développement tout en gardant le pion
            supplémentaire. Les Noirs jouent a6 pour chasser le fou, ou Qc8, cherchant à faire
            pression sur la colonne c et à regagner le pion.
        basis:
          by: chan
          at: 2026-09-29
