# Réti Opening: Advance Variation, Navara Gambit. Frozen defining line 1.Nf3 d5 2.c4 d4
# 3.b4 g5, which ends on Black's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Replayed with chess.js through the reply Nxg5;
# searchMate at 3 moves from the resulting position returns no-mate, so no forced mate is
# claimed anywhere in this entry.
id: reti-opening-advance-variation-navara-gambit
name: 'Réti Opening: Advance Variation, Navara Gambit'
eco: A09
category: gambit
side: black
definingLine: [Nf3, d5, c4, d4, b4, g5]
soundness:
  value: dubious
  reviewedAt: '2026-10-01'
  basis:
    by: chan
    at: '2026-10-01'
    source: >-
      A judgement. At the end of the defining line the pawn count is level, eight each, but
      the g5 pawn is attacked by the knight on f3 and nothing defends it, so White can simply
      take it with the knight; Black would then be a pawn down, with the half-open g-file as
      the main asset. The practical chances are real, but Black has not been shown to regain
      the pawn by force. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-10-01'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: 'Đen vừa chơi 3...g5. Tốt g5 bị mã f3 tấn công mà không có quân nào bảo vệ, còn tốt d4 bị mã f3 tấn công và chỉ có hậu bảo vệ. Số tốt đang cân bằng, mỗi bên tám. Mục này đi theo nước Trắng ăn 4.Nxg5.'
    en: 'Black has just played 3...g5. The g5 pawn is attacked by the knight on f3 and nothing defends it, while the d4 pawn is attacked by the knight on f3 and defended only by the queen. The pawn count is level, eight each. This entry follows White taking 4.Nxg5.'
    fr: 'Les Noirs viennent de jouer 3...g5. Le pion g5 est attaqué par le cavalier f3 sans être défendu, tandis que le pion d4 est attaqué par le cavalier f3 et défendu seulement par la dame. Le compte des pions est égal, huit chacun. Cette entrée suit la prise 4.Nxg5 des Blancs.'
  dismissRest:
    reason:
      vi: 'Trắng chơi một nước khác thay vì 4.Nxg5, nên tốt g5 chưa bị ăn ngay. Mục này chỉ đi theo nước ăn tốt.'
      en: 'White plays something other than 4.Nxg5 here, so the g5 pawn is not taken at once. This entry follows only the capture.'
      fr: "Les Blancs jouent autre chose que 4.Nxg5 ici, si bien que le pion g5 n'est pas pris tout de suite. Cette entrée ne suit que la prise."
  children:
    - ply: Nxg5
      replyQuality: good
      frequency: common
      annotation:
        vi: 'Trắng ăn tốt g5 bằng mã. Mã g5 tấn công các tốt f7 và h7, nhưng chưa quân Đen nào tấn công được mã.'
        en: "White takes the g5 pawn with the knight. The knight on g5 attacks the f7 and h7 pawns, but none of Black's pieces attacks the knight yet."
        fr: "Les Blancs prennent le pion g5 avec le cavalier. Le cavalier g5 attaque les pions f7 et h7, mais aucune pièce noire n'attaque encore le cavalier."
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng tám, Đen bảy, nên Đen kém một tốt. Mã g5 tấn công tốt f7, chỉ có vua bảo vệ, và tốt h7, được xe h8 bảo vệ. Cột g là cột nửa mở của Đen vì Đen không còn tốt g, còn tốt b4 của Trắng không có quân bảo vệ.'
          en: "Count the pawns: White eight, Black seven, so Black is a pawn down. The knight on g5 attacks the f7 pawn, which only the king defends, and the h7 pawn, which the rook on h8 defends. The g-file is half-open for Black, since Black has no g-pawn, and White's b4 pawn has no defender."
          fr: "Comptez les pions : huit pour les Blancs, sept pour les Noirs, donc les Noirs ont un pion de moins. Le cavalier g5 attaque le pion f7, que seul le roi défend, et le pion h7, que défend la tour h8. La colonne g est semi-ouverte pour les Noirs, puisqu'ils n'ont plus de pion g, et le pion b4 blanc n'a pas de défenseur."
        plan:
          vi: 'Đen chơi ...h6 để đuổi mã, ...e5 để mở đường chéo của tượng f8 tới tốt b4, rồi ...Bxb4. Trắng rút mã về f3 khi nó bị tấn công và chơi d3 và Bd2 để bảo vệ tốt b4.'
          en: 'Black plays ...h6 to chase the knight, ...e5 to open the diagonal of the bishop on f8 to the b4 pawn, then ...Bxb4. White retreats the knight to f3 when it is attacked and plays d3 and Bd2 to defend the b4 pawn.'
          fr: 'Les Noirs jouent ...h6 pour chasser le cavalier, ...e5 pour ouvrir au fou f8 la diagonale vers le pion b4, puis ...Bxb4. Les Blancs ramènent le cavalier en f3 quand il est attaqué et jouent d3 et Bd2 pour défendre le pion b4.'
        basis:
          by: chan
          at: '2026-10-01'
