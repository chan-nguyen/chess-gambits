# Benko Gambit Accepted: Yugoslav. Frozen defining line 1.d4 Nf6 2.c4 c5 3.d5 b5
# 4.cxb5 a6 5.bxa6 Bxa6 6.Nc3 d6, which ends on Black's own ply, so the root is an
# opponent node (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 7.e4.
# searchMate at 3 moves from the resulting position returns no-mate, so no forced mate
# is claimed anywhere in this entry, and no capture is left going free at the leaf.
id: benko-gambit-accepted-yugoslav
name: 'Benko Gambit Accepted: Yugoslav'
eco: A59
category: gambit
side: black
definingLine: [d4, Nf6, c4, c5, d5, b5, cxb5, a6, bxa6, Bxa6, Nc3, d6]
soundness:
  value: sound
  reviewedAt: '2026-09-29'
  basis:
    by: chan
    at: '2026-09-29'
    source: >-
      Long-established opening theory, one of the main gambits Black has against 1.d4: the
      queenside pawn majority and open files provide durable practical compensation for the
