# Ruy Lopez: Closed, Alekhine Gambit. Frozen defining line 1.e4 e5 2.Nf3 Nc6 3.Bb5 a6 4.Ba4 Nf6
# 5.O-O Be7 6.Re1 b5 7.Bb3 d6 8.c3 Na5 9.Bc2 c5 10.d4 Qc7 11.Nbd2 O-O 12.Nf1 Bg4 13.Ne3 Bxf3
# 14.Qxf3, which ends on White's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). Replayed with chess.js through 14...cxd4 15.cxd4 exd4. At the leaf the pawn on d4
# attacks the knight on e3, but it is White's move, so nothing is left going free. searchMate at 3
# moves from the resulting position returns no-mate, so no forced mate is claimed anywhere in this
# entry.
