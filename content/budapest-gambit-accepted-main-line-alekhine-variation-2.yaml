# Indian Defense: Budapest Gambit Accepted, Main Line, Alekhine Variation, Tartakower Defense.
# Frozen defining line 1.d4 Nf6 2.c4 e5 3.dxe5 Ng4 4.e4 d6 ends on Black's own ply, so the
# root is an opponent node (docs/CONTEXT.md, invariant 5). Part of batch t of round 4 (#182).
# Every ply below was replayed with chess.js before it was annotated; searchMate at 3 moves
# from the leaf returns no-mate, so no forced mate is claimed anywhere in this entry, and no
# capture is left going free at the leaf.
