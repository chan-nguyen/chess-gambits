tree:
  annotation:
    vi:
      Sau một loạt đổi quân quyết liệt ở trung tâm kết thúc bằng 9.Bxc5, hậu Đen đang đứng giữa bàn cờ
      trên e4 và phải quyết định bước tiếp theo.
    en: After a sharp string of central exchanges ending in 9.Bxc5, Black's queen is sitting in the
      middle of the board on e4 and has to decide what to do next.
    fr: Après une série d'échanges tranchants au centre se terminant par 9.Bxc5, la dame noire se
      retrouve au milieu de l'échiquier en e4 et doit décider de la suite.
  dismissRest:
    reason:
      vi:
        Đen rút hậu về an toàn hoặc phát triển bình thường thay vì ăn thêm tốt g2. Vật chất khi đó gần
        như cân bằng và cả hai bên đều còn việc phải hoàn thiện phát triển, không có gì đặc biệt để
        nói thêm.
      en:
        Black retreats the queen to safety or develops normally instead of grabbing the g2 pawn too.
        Material is then close to level and both sides still have development to finish, with
        nothing more specific to say.
      fr:
        Les Noirs replient la dame en sécurité ou se développent normalement au lieu de prendre aussi le
        pion g2. Le matériel est alors proche de l'égalité et les deux camps ont encore du
        développement à achever, sans rien de plus particulier à signaler.
  children:
    - ply: Qxg2
      replyQuality: inaccuracy
      frequency: occasional
      annotation:
        vi:
          Đen tham lam ăn luôn con tốt g2, đưa hậu vào sâu trong trận địa Trắng thay vì lo hoàn thiện phát
          triển.
        en:
          Black greedily grabs the g2 pawn too, sending the queen deep into White's position instead of
          worrying about development.
        fr:
          Les Noirs prennent avidement aussi le pion g2, envoyant la dame profondément dans le camp blanc
          au lieu de se soucier du développement.
      outcome:
        type: position
        evaluation:
          vi:
            'Vật chất gần như cân bằng sau một loạt đổi quân: Trắng còn cặp tượng nhưng chỉ một mã và năm
            tốt, Đen còn hai mã, một tượng và sáu tốt — hai bên chỉ chênh nhau đúng một điểm quy
            đổi.'
          en:
            'Material is close to level after a string of trades: White keeps the bishop pair but only one
            knight and five pawns, Black keeps two knights, one bishop and six pawns — the two sides
            are within a single point of each other.'
          fr:
            "Le matériel est proche de l'égalité après une série d'échanges : les Blancs gardent la paire de
            fous mais un seul cavalier et cinq pions, les Noirs gardent deux cavaliers, un fou et
            six pions — les deux camps ne sont séparés que d'un point."
        plan:
          vi:
            Trắng chơi Nf3 hoặc Rf1, vừa phát triển vừa gây khó cho hậu Đen đang lạc sâu trên cột g, tìm
            cách bắt hậu hoặc buộc nó rút về mất thêm nhịp. Đen chơi Qxh1 lấy thêm xe rồi tìm đường
            rút hậu về an toàn, hoặc Nge7 hoàn thiện phát triển trước.
          en:
            White plays Nf3 or Rf1, developing while making life hard for the queen stranded on the g-file,
            looking to trap it or force it back with a loss of time. Black plays Qxh1 to grab the
            rook too and then finds a way to bring the queen home safely, or plays Nge7 to finish
            developing first.
          fr:
            Les Blancs jouent Nf3 ou Rf1, se développant tout en compliquant la vie de la dame noire égarée
            sur la colonne g, cherchant à la piéger ou à la forcer à reculer en perdant du temps.
            Les Noirs jouent Qxh1 pour prendre aussi la tour puis cherchent à ramener la dame en
            sécurité, ou jouent Nge7 pour d'abord achever leur développement.
        basis:
          by: chan
          at: 2026-09-29
