# Caro-Kann Defense: von Hennig Gambit. Frozen defining line 1.e4 c6 2.d4 d5 3.Nc3 dxe4
# 4.Bc4, which ends on White's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). Replayed with chess.js through 4...Nf6: Black develops and holds onto the
# extra pawn rather than trying to keep the piece that would recapture it busy elsewhere.
# Nothing is hanging at the resulting position. searchMate at 4 moves from this position
# returns unknown, which the stopping rule treats the same as no-mate, so no forced mate is
# claimed anywhere in this entry.
id: caro-kann-defense-von-hennig-gambit
name: 'Caro-Kann Defense: von Hennig Gambit'
eco: B15
category: gambit
side: white
definingLine: [e4, c6, d4, d5, Nc3, dxe4, Bc4]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. Developing the bishop before recapturing on e4 aims quickly at f7, but it
      leaves the pawn uncollected for a while and Black's simplest reply holds everything
      together. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Thay vì ăn lại ngay bằng 4.Nxe4, Trắng chơi 4.Bc4, nhắm thẳng vào f7 trước và để dành việc đòi lại con tốt e4 cho sau này.
    en: Instead of recapturing at once with 4.Nxe4, White plays 4.Bc4, aiming straight at f7 first and saving the recapture on e4 for later.
    fr: Au lieu de reprendre tout de suite par 4.Nxe4, les Blancs jouent 4.Bc4, visant d'abord directement f7 et gardant la reprise en e4 pour plus tard.
  dismissRest:
    reason:
      vi: Đen không phát triển bằng 4...Nf6. Các nước như Nd7 hay Bf5 cũng giữ được con tốt thừa nhưng theo cách khác, còn con tốt e4 vẫn chưa ai đỡ thêm.
      en: Black does not develop with 4...Nf6. Moves such as ...Nd7 or ...Bf5 also keep the extra pawn but in a different way, and the e4 pawn still has no extra defender.
      fr: Les Noirs ne développent pas par 4...Nf6. Des coups comme ...Nd7 ou ...Bf5 gardent eux aussi le pion supplémentaire mais d'une autre façon, et le pion e4 n'a toujours pas de défenseur supplémentaire.
  children:
    - ply: Nf6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen phát triển mã tự nhiên và giữ vững con tốt thừa, chưa cần vội vàng làm gì thêm vì chưa quân Trắng nào đe dọa được nó.
        en: Black develops the knight naturally and simply keeps the extra pawn, with no need to do anything more urgent yet since no white piece threatens it.
        fr: Les Noirs développent naturellement le cavalier et gardent simplement le pion supplémentaire, sans rien devoir faire de plus urgent puisqu'aucune pièce blanche ne le menace.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy, Đen hơn đúng một tốt sạch và con tốt ấy chưa hề bị đe dọa. Tượng c4 của Trắng đã nhắm vào f7 nhưng chưa có quân nào hỗ trợ thêm, còn Đen sẽ hoàn thiện phát triển và nhập thành để con tốt e4 được che chắn kỹ hơn nữa.
          en: Count the pawns and it is eight for Black, seven for White — Black is a clean pawn up and that pawn is not under any threat. White's bishop on c4 already aims at f7 but has no support yet, while Black will finish developing and castle so the e4 pawn is shielded even more.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs — les Noirs ont un pion net d'avance et ce pion n'est sous aucune menace. Le fou blanc en c4 vise déjà f7 mais n'a encore aucun soutien, tandis que les Noirs vont achever leur développement et roquer pour que le pion e4 soit encore mieux protégé.
        plan:
          vi: Trắng chơi Qe2 hoặc Ng5, cố tạo áp lực cụ thể lên f7 và đòi lại con tốt e4 trước khi Đen kịp củng cố hoàn toàn. Đen chơi Bf5 hay g6, Bg7, e6 và O-O, hoàn tất phát triển một cách chắc chắn và giữ vững con tốt thừa vào tàn cuộc.
          en: White plays Qe2 or Ng5, trying to create concrete pressure on f7 and win the e4 pawn back before Black fully consolidates. Black plays ...Bf5 or ...g6, ...Bg7, ...e6 and ...O-O, completing development soundly and holding the extra pawn for the endgame.
          fr: Les Blancs jouent Qe2 ou Ng5, cherchant à créer une pression concrète sur f7 et à reprendre le pion e4 avant que les Noirs ne consolident complètement. Les Noirs jouent ...Bf5 ou ...g6, ...Bg7, ...e6 et ...O-O, achevant leur développement solidement et gardant le pion supplémentaire pour la finale.
        basis:
          by: chan
          at: '2026-09-25'
