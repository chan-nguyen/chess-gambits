judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa chơi 3.c4, thí thêm một tốt nữa cạnh tốt d4. Mục này đi sâu riêng vào việc Đen nhận tốt bằng 3...dxe4.
    en: White has just played 3.c4, offering a second central pawn alongside d4. This entry follows specifically Black accepting with 3...dxe4.
    fr: Les Blancs viennent de jouer 3.c4, offrant un second pion central aux côtés de d4. Cette entrée suit spécifiquement l'acceptation des Noirs par 3...dxe4.
  dismissRest:
    reason:
      vi: Đen không ăn tốt e4 — chơi 3...Nf6 hay 3...c5, hay đổi tốt bằng 3...dxc4 trước. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black does not take the e4 pawn — playing 3...Nf6 or 3...c5, or trading with 3...dxc4 first. Each is outside the scope of this entry.
      fr: Les Noirs ne prennent pas le pion e4 — jouant 3...Cf6 ou 3...c5, ou échangeant par 3...dxc4 d'abord. Chacun sort du cadre de cette entrée.
  children:
    - ply: dxe4
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen nhận tốt bằng cách ăn ở e4, giữ nguyên áp lực lên tốt c4 để tính sau.
        en: Black accepts by taking on e4, leaving the pressure on the c4 pawn for later.
        fr: Les Noirs acceptent en prenant en e4, laissant la pression sur le pion c4 pour plus tard.
      children:
        - ply: Nc3
          annotation:
            vi: Trắng phát triển mã, tấn công thẳng vào con tốt e4 và chuẩn bị đòi lại nó ngay trong vài nước tới.
            en: White develops the knight, attacking the e4 pawn directly and getting ready to win it back within the next few moves.
            fr: Les Blancs développent le cavalier, attaquant directement le pion e4 et se préparant à le regagner d'ici quelques coups.
          outcome:
            type: position
            evaluation:
              vi: Đếm tốt thì Đen tám, Trắng bảy — Đen vẫn hơn đúng một tốt, nhưng con tốt e4 giờ bị mã c3 đánh trực tiếp và chưa có quân Đen nào đỡ nó. Trắng đã có nhịp và cột c mở để bù lại.
              en: Count the pawns and it is eight for Black, seven for White — Black is still exactly one pawn up, but the e4 pawn is now attacked directly by the c3 knight and nothing Black has defends it. White already has the tempo and the open c-file to show for it.
              fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs — les Noirs restent exactement un pion devant, mais le pion e4 est désormais attaqué directement par le cavalier c3 et rien chez les Noirs ne le défend. Les Blancs ont déjà le temps et la colonne c ouverte à montrer pour cela.
            plan:
              vi: Trắng chơi Nxe4 đòi lại tốt, rồi Nf3 và Bd3 hay Bc4, tận dụng cặp tượng và cột c mở để bù cho khoảng thời gian đã bỏ ra. Đen chơi Nf6 đỡ trước khi bị ăn, hoặc f5 giữ tốt e4 một lúc, rồi c6 và Be7, hoàn thiện phát triển.
              en: White plays Nxe4 to win the pawn back, then Nf3 and Bd3 or Bc4, using the bishop pair and the open c-file to justify the time spent. Black plays Nf6 to defend before it is taken, or f5 to hold the e4 pawn a little longer, then c6 and Be7, completing development.
              fr: Les Blancs jouent Nxe4 pour regagner le pion, puis Nf3 et Bd3 ou Bc4, utilisant la paire de fous et la colonne c ouverte pour justifier le temps dépensé. Les Noirs jouent Nf6 pour défendre avant d'être pris, ou f5 pour tenir le pion e4 un peu plus longtemps, puis c6 et Be7, achevant leur développement.
            basis:
              by: chan
              at: '2026-09-25'
