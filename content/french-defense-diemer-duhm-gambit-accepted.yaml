# French Defense, Diemer-Duhm Gambit Accepted. One entry in a batch authored for issue #148
# (batch h), sharing the trunk `1.e4 e6 2.d4 d5 3.c4` with `french-defense-diemer-duhm-gambit`,
# whose own root already models this exact 3...dxe4 as its single reply. Defining line ends
# on White's 3.c4 (invariant 5) — reaching Black's own acceptance again keeps the root an
# opponent node — and this entry continues one ply further than the base entry, into White's
# own follow-up. Every ply below was replayed with chess.js before being written.
id: french-defense-diemer-duhm-gambit-accepted
name: 'French Defense: Diemer-Duhm Gambit Accepted'
eco: C00
category: gambit
side: white
definingLine: [e4, e6, d4, d5, c4]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
