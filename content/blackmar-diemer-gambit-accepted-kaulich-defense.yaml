# Blackmar-Diemer Gambit Accepted, Kaulich Defense. Frozen defining line 1.d4 d5 2.e4
# dxe4 3.Nc3 Nf6 4.f3 exf3 5.Nxf3, which ends on White's own ply, so the root is an
# opponent node (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 5...c5
# 6.dxc5. Black's ...c5 leaves that pawn undefended, so White's forced reply dxc5
# simply wins it back, levelling material. searchMate at 3 moves from the resulting
# position returns no-mate, so no forced mate is claimed anywhere in this entry, and
# no capture is left going free at the leaf.
id: blackmar-diemer-gambit-accepted-kaulich-defense
name: 'Blackmar-Diemer Gambit Accepted: Kaulich Defense'
eco: D00
category: gambit
side: white
definingLine: [d4, d5, e4, dxe4, Nc3, Nf6, f3, exf3, Nxf3]
soundness:
  value: dubious
  reviewedAt: '2026-09-29'
  basis:
    by: chan
    at: '2026-09-29'
    source: >-
      Long-established Blackmar-Diemer Gambit theory. White accepts being a pawn down
      permanently in exchange for fast, open development — real practical chances at club
      level, not a refutation of correct defence. No engine was consulted and no database was
      queried.
judgement:
  by: chan
  at: '2026-09-29'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: 'Trắng vừa ăn lại trên f3 bằng mã, hoàn tất đợt đổi tốt của Gambit Blackmar-Diemer: kém một tốt (sáu so với bảy) nhưng đã phát triển đầy đủ — mã đã đứng vững ở f3, thế trận thoáng, và Trắng sẽ tiếp tục với Bc4 hoặc Bd3 rồi nhập thành nhanh. Đen phải chọn cách đối phó với lợi thế phát triển này.'
    en: "White has just recaptured on f3 with the knight, completing the Blackmar-Diemer's pawn exchange: down one pawn (six against seven) but fully mobilised, the knight already anchored on f3, an open position, and Bc4 or Bd3 plus quick castling still to come. Black must now choose how to meet this lead in development."
    fr: "Les Blancs viennent de reprendre en f3 avec le cavalier, achevant l'échange de pions du Gambit Blackmar-Diemer : un pion de retard (six contre sept) mais un développement complet, le cavalier déjà solidement posté en f3, une position ouverte, et Bc4 ou Bd3 suivi d'un roque rapide à venir. Les Noirs doivent maintenant choisir comment répondre à cette avance de développement."
  dismissRest:
    reason:
      vi: 'Đen chọn cách phát triển khác thay vì ...c5 ở đây. Đánh giá hầu như không đổi: Trắng luôn kém đúng một tốt nhưng bù lại bằng quân mã đã đứng vững ở f3, hai tượng sẵn sàng xuất quân và cột f đang mở cho xe, bất kể Đen chọn nước nào khác.'
      en: 'Black develops some other way instead of ...c5 here. The assessment barely changes: White is always down exactly one pawn but compensated by the knight already anchored on f3, both bishops ready to develop, and the open f-file for the rook, whichever other move Black picks.'
      fr: "Les Noirs se développent autrement qu'avec ...c5 ici. L'évaluation change à peine : les Blancs ont toujours exactement un pion de moins mais compensent avec le cavalier déjà solidement posté en f3, les deux fous prêts à se développer et la colonne f ouverte pour la tour, quel que soit l'autre coup choisi par les Noirs."
  children:
    - ply: c5
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Đen phản công ngay ở trung tâm bằng ...c5, tấn công tốt d4 thay vì lo hoàn thiện phát triển trước.
        en: Black counterattacks the centre at once with ...c5, hitting the d4 pawn rather than finishing development first.
        fr: "Les Noirs contre-attaquent aussitôt le centre par ...c5, visant le pion d4 plutôt que d'achever leur développement."
      children:
        - ply: dxc5
          annotation:
            vi: Tốt d4 đơn giản ăn lại trên c5, vì con tốt đó chưa được Đen bảo vệ.
            en: "The d4 pawn simply captures on c5, since Black's pawn there was left undefended."
            fr: Le pion d4 capture simplement en c5, ce pion noir étant resté sans défense.
          outcome:
            type: position
            evaluation:
              vi: 'Sau khi ăn lại, vật chất trở lại cân bằng: sáu tốt cho mỗi bên. Trắng vẫn giữ mã đã phát triển trên f3 và cả hai tượng sẵn sàng xuất quân, trong khi Đen chưa nhập thành.'
              en: 'After the recapture material is level again: six pawns each. White still has the knight developed on f3 and both bishops ready to come out, while Black has not yet castled.'
              fr: "Après la reprise, le matériel est à nouveau égal : six pions de chaque côté. Les Blancs gardent le cavalier développé en f3 et les deux fous prêts à sortir, tandis que les Noirs n'ont pas encore roqué."
            plan:
              vi: Trắng tiếp tục Bc4 hoặc Bb5+ tranh thủ thời gian, rồi nhập thành nhanh, khai thác việc vua Đen còn kẹt ở giữa bàn. Đen tìm cách phát triển nhanh bằng ...Nc6 hoặc ...Qxd1+ đổi hậu để giảm sức ép.
              en: "White continues with Bc4 or Bb5+, gaining time, then castles quickly, exploiting the fact that Black's king is still in the centre. Black looks to develop fast with ...Nc6 or to trade queens with ...Qxd1+ to relieve the pressure."
              fr: Les Blancs poursuivent par Bc4 ou Bb5+, gagnant du temps, puis roquent rapidement, exploitant le fait que le roi noir reste au centre. Les Noirs cherchent à se développer vite par ...Nc6 ou à échanger les dames par ...Qxd1+ pour soulager la pression.
            basis:
              by: chan
              at: '2026-09-29'
