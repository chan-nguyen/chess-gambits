tree:
  annotation:
    vi: Trắng vừa chơi 5.Bc4 sau 4.f3. Tượng tấn công f7, chỉ có vua bảo vệ. Tốt e4 bị tấn công hai lần, bởi mã c3 và tốt f3, và được bảo vệ hai lần, bởi mã f6 và tượng f5.
    en: White has just played 5.Bc4 after 4.f3. The bishop attacks f7, which only the king defends. The pawn on e4 is attacked twice, by the knight on c3 and the f3 pawn, and defended twice, by the knight on f6 and the bishop on f5.
    fr: Les Blancs viennent de jouer 5.Bc4 après 4.f3. Le fou attaque f7, que seul le roi défend. Le pion e4 est attaqué deux fois, par le cavalier c3 et le pion f3, et défendu deux fois, par le cavalier f6 et le fou f5.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 5...e6. Bài này chỉ đi theo nhánh 5...e6; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 5...e6 here. This entry follows 5...e6 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 5...e6. Cette fiche ne suit que 5...e6 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: e6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen chơi 5...e6, chắn đường chéo của tượng c4 tới f7 và giải phóng tượng f8. Tốt e6 mới bị tượng Trắng tấn công và được tốt f7 cùng tượng f5 bảo vệ.
        en: Black plays 5...e6, which blocks the c4 bishop's diagonal to f7 and frees the bishop on f8. The new pawn on e6 is attacked by the bishop and defended by the f7 pawn and the bishop on f5.
        fr: Les Noirs jouent 5...e6, qui coupe la diagonale du fou c4 vers f7 et libère le fou f8. Le nouveau pion e6 est attaqué par le fou et défendu par le pion f7 et par le fou f5.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt. Đen có hai tốt trên cột e, ở e6 và e4. Tốt e4 bị tấn công hai lần, bởi mã c3 và tốt f3, và được bảo vệ hai lần, bởi mã f6 và tượng f5.'
          en: 'Count the pawns: White seven, Black eight, so White is a pawn down. Black has two pawns on the e-file, on e6 and e4. The pawn on e4 is attacked twice, by the knight on c3 and the f3 pawn, and defended twice, by the knight on f6 and the bishop on f5.'
          fr: 'Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins. Les Noirs ont deux pions sur la colonne e, en e6 et en e4. Le pion e4 est attaqué deux fois, par le cavalier c3 et le pion f3, et défendu deux fois, par le cavalier f6 et le fou f5.'
        plan:
          vi: Trắng có thể ăn e4 bằng fxe4 hoặc Nxe4, hoặc phát triển bằng Nge2; Đen cố giữ tốt bằng ...Bb4, ghim mã c3 vào vua, hoặc đánh vào d4 bằng ...Nc6, và hoàn tất phát triển.
          en: White can take on e4 with fxe4 or Nxe4, or develop with Nge2; Black tries to keep the pawn with ...Bb4, which pins the knight on c3 to the king, or hits d4 with ...Nc6, and completes development.
          fr: Les Blancs peuvent prendre en e4 par fxe4 ou Nxe4, ou se développer par Nge2 ; les Noirs cherchent à garder le pion par ...Bb4, qui cloue le cavalier c3 sur le roi, ou attaquent d4 par ...Nc6, et achèvent leur développement.
        basis:
          by: chan
          at: '2026-09-30'
