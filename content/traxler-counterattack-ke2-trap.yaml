                    - ply: Nxh8
                      replyQuality: blunder
                      frequency: common
                      annotation:
                        vi: Trắng ăn xe h8, nước ăn trông như được không mà không mất gì. Nhưng nó bỏ mặc ô f2, và Đen chiếu bí ngay bằng Qf2#. Phần còn lại do máy chứng minh chứ không do người khẳng định.
                        en: White takes the rook on h8, a capture that looks free of charge. But it does nothing about f2, and Black mates at once with Qf2#. What follows is proved by machine rather than asserted by a person.
                        fr: Les Blancs prennent la tour h8, une prise qui paraît gratuite. Mais elle ne fait rien pour f2, et les Noirs matent aussitôt par Qf2#. La suite est prouvée par la machine plutôt qu'affirmée par un humain.
                      outcome:
                        type: trap
            - ply: Kf1
              replyQuality: mistake
              frequency: occasional
              annotation:
                vi: Vua đi f1. Nước này trông cũng gọn gàng, nhưng nó cho Đen đúng nước Qh4 như trước với cùng đe dọa, và lần này hậu trên f2 tự nó đã phủ cả e1, e2 lẫn g1, không cần đến xe h1 nữa.
                en: The king goes to f1. It looks just as tidy, but it allows the same Qh4 with the same threat, and this time the queen on f2 would cover e1, e2 and g1 by itself without any help from the rook on h1.
                fr: Le roi va en f1. Cela paraît tout aussi net, mais cela autorise le même Qh4 avec la même menace, et cette fois la dame en f2 couvrirait à elle seule e1, e2 et g1, sans l'aide de la tour h1.
              children:
                - ply: Qh4
                  annotation:
                    vi: Đen đi cùng một nước hậu như khi gặp Kg1, với cùng đe dọa. Qf2 sẽ là chiếu bí, vì mã e4 canh f2 và hậu trên f2 phủ cả e1, e2 và g1.
                    en: Black plays the same queen move as against Kg1, with the same threat. Qf2 would be mate, because the knight on e4 guards f2 and the queen on f2 would cover e1, e2 and g1.
                    fr: Les Noirs jouent le même coup de dame que contre Kg1, avec la même menace. Qf2 serait mat, car le cavalier e4 garde f2 et la dame en f2 couvrirait e1, e2 et g1.
                  counts:
                    legal: { count: legalReplies, expect: 33 }
                    mated: { count: matedBy, ply: 'Qf2#', expect: 27 }
                  dismissRest:
                    reason:
                      vi: Trắng chơi nước khác. {Mated} trong {legal} nước hợp lệ ở đây bị Qf2# chiếu bí ngay. Những nước tránh được là Nd6+ (chiếu trước), g3 (chắn đường chéo), Qe2, Qf3 và Qe1 (canh f2) cùng Ke2 (để Qf2 chỉ còn là nước chiếu). Đó là các cách phòng thủ khác và không được dựng ở đây.
                      en: White plays anything else. {Mated} of the {legal} legal replies here lose at once to Qf2#. The moves that avoid it are Nd6+ (a check first), g3 (which blocks the diagonal), Qe2, Qf3 and Qe1 (which cover f2) and Ke2 (so that Qf2 is only a check). Those are other defences and are not mapped here.
                      fr: Les Blancs jouent autre chose. {Mated} des {legal} réponses légales ici perdent aussitôt sur Qf2#. Les coups qui l'évitent sont Nd6+ (un échec d'abord), g3 (qui bouche la diagonale), Qe2, Qf3 et Qe1 (qui couvrent f2) ainsi que Ke2 (pour que Qf2 ne soit plus qu'un échec). Ce sont d'autres défenses et elles ne sont pas cartographiées ici.
                  children:
                    - ply: Nxh8
                      replyQuality: blunder
                      frequency: common
                      annotation:
                        vi: Trắng lại ăn xe h8 như thể được không. Ô f2 vẫn không có ai che, và Qf2# chiếu bí ngay. Phần còn lại do máy chứng minh chứ không do người khẳng định.
                        en: White takes the rook on h8 again as if it were free. f2 is still uncovered, and Qf2# mates at once. What follows is proved by machine rather than asserted by a person.
                        fr: Les Blancs prennent de nouveau la tour h8 comme si elle était gratuite. f2 reste sans défense, et Qf2# mate aussitôt. La suite est prouvée par la machine plutôt qu'affirmée par un humain.
                      outcome:
                        type: trap
    - ply: Kf1
      replyQuality: best
      frequency: common
      annotation:
        vi: Vua đi f1 và chưa ăn con tượng. Tượng f2 của Đen đang bị vua tấn công, còn mã Trắng ở f7 vẫn chĩa đôi vào hậu d8 và xe h8. Vua tránh được những nước chiếu theo sau Ke2.
        en: The king goes to f1 and does not take the bishop yet. Black's bishop on f2 is attacked by the king, and White's knight on f7 still forks the queen on d8 and the rook on h8. The king stays out of the checks that follow Ke2.
        fr: Le roi va en f1 sans prendre le fou. Le fou noir f2 est attaqué par le roi, et le cavalier blanc f7 fourche toujours la dame d8 et la tour h8. Le roi reste hors des échecs qui suivent Ke2.
      children:
        - ply: Qe7
          annotation:
            vi: Hậu Đen thoát khỏi đòn chĩa đôi bằng cách lên e7, từ đó tấn công lại mã f7. Tượng f2 vẫn đang bị vua tấn công, và đó chính là giá Đen đã chấp nhận trả.
            en: Black's queen steps out of the fork to e7, from where it attacks the knight on f7 in turn. The bishop on f2 is still attacked by the king, and that is the price Black has accepted.
            fr: La dame noire sort de la fourchette en e7, d'où elle attaque à son tour le cavalier f7. Le fou f2 reste attaqué par le roi, et c'est le prix que les Noirs ont accepté.
          dismissRest:
            reason:
              vi: Trắng không ăn xe ngay. Kxf2, ăn lại tượng trước, là nước tự nhiên còn lại, và còn có cả những nước nhẹ nhàng hơn; tất cả đều dẫn ra khỏi đường mà mục này theo và không nước nào được dựng ở đây.
              en: White does not take the rook at once. Kxf2, recapturing the bishop first, is the other natural move, and there are quieter ones; all of them lead away from the line this entry follows and none is mapped here.
              fr: Les Blancs ne prennent pas la tour tout de suite. Kxf2, qui reprend d'abord le fou, est l'autre coup naturel, et il y en a de plus calmes ; tous s'écartent de la ligne que suit cette entrée et aucun n'est cartographié ici.
          children:
            - ply: Nxh8
              replyQuality: best
              frequency: common
              annotation:
                vi: Trắng ăn xe h8. Trắng giờ hơn một xe, nhưng con mã vừa ăn đứng trong góc với chỉ hai ô để đi là f7 và g6, và tượng f2 vẫn chưa bị ăn.
                en: White takes the rook on h8. White is now a rook up, but the knight that took it stands in the corner with just two squares to go to, f7 and g6, and the bishop on f2 has not been taken yet.
                fr: Les Blancs prennent la tour h8. Ils ont maintenant une tour de plus, mais le cavalier qui l'a prise se tient dans le coin avec seulement deux cases où aller, f7 et g6, et le fou f2 n'a pas encore été pris.
              children:
                - ply: d5
                  annotation:
                    vi: Đen đẩy tốt d5, đồng thời tấn công tượng c4 và tốt e4 và mở đường cho tượng c8. Con mã Trắng ở h8 chỉ còn hai ô để đi là g6 và f7, và cả hai đều làm mất nó.
                    en: Black strikes with d5, attacking the bishop on c4 and the pawn on e4 at once and opening the diagonal of the c8 bishop. The white knight on h8 has only two squares to go to, g6 and f7, and both lose it.
                    fr: Les Noirs frappent par d5, attaquant à la fois le fou c4 et le pion e4 et ouvrant la diagonale du fou c8. Le cavalier blanc h8 n'a plus que deux cases où aller, g6 et f7, et les deux le font perdre.
                  dismissRest:
                    reason:
                      vi: Trắng không ăn tốt d5. Tốt ấy tấn công cả tượng c4 lẫn tốt e4. Ăn nó, như ở đây, là đường mà mục này theo; Kxf2 trước, Nc3 hay các nước lùi tượng là những cách đáp khác và không được dựng ở đây.
                      en: White does not take on d5. The pawn attacks both the bishop on c4 and the pawn on e4. Taking it, as here, is the line this entry follows; Kxf2 first, Nc3 or a retreat of the bishop are other answers and are not mapped here.
                      fr: Les Blancs ne prennent pas en d5. Le pion attaque à la fois le fou c4 et le pion e4. Le prendre, comme ici, est la ligne que suit cette entrée ; Kxf2 d'abord, Nc3 ou un repli du fou sont d'autres réponses et ne sont pas cartographiés ici.
                  children:
                    - ply: exd5
                      replyQuality: best
                      frequency: common
                      annotation:
                        vi: Trắng ăn tốt d5 bằng tốt e. Nước này thắng thêm một tốt, bảy đối sáu, nhưng tốt d5 cũng chắn đường chéo của tượng c4, nên tượng ấy không còn bảo vệ được f7.
                        en: White takes the d5 pawn with the e-pawn. It wins another pawn, seven against six, but the pawn on d5 also blocks the diagonal of the c4 bishop, which no longer guards f7.
                        fr: Les Blancs prennent le pion d5 du pion e. Ils gagnent un pion de plus, sept contre six, mais le pion d5 bouche aussi la diagonale du fou c4, qui ne garde plus f7.
                      children:
                        - ply: Nd4
                          annotation:
                            vi: Mã Đen nhảy vào d4, tấn công c2 và e2 và giữ cả b3 lẫn f3. Mã f6 vẫn ở nguyên chỗ, và tượng f2 vẫn nằm sát vua.
                            en: Black's knight jumps into d4, attacking c2 and e2 and covering b3 and f3. The knight on f6 stays where it is, and the bishop on f2 is still next to the king.
                            fr: Le cavalier noir saute en d4, attaquant c2 et e2 et couvrant b3 et f3. Le cavalier f6 reste en place, et le fou f2 est toujours à côté du roi.
                          unsettled: >-
                            Kxf2 is the capture the check sees: nothing recaptures on f2. The leaf does
                            not claim the bishop is safe — the evaluation below counts the position
                            with the bishop still on f2 and names Kxf2 as the open question, and
                            Black's answer to it, ...Ng4+, puts the king back on an open board with
                            the g4 knight guarding the square it came from. Playing the capture out
                            would add a count the leaf has already given in one line.
                          outcome:
                            type: position
                            evaluation:
                              vi: Trắng hơn một xe và một tốt trên bàn cờ — hai xe, hai tượng, hai mã và bảy tốt đối với một xe, hai tượng, hai mã và sáu tốt, hai hậu vẫn còn. Con mã Trắng ở h8 không có ô an toàn nào, vì Nf7 bị hậu e7 ăn không (tốt d5 của chính Trắng chắn đường tượng c4 tới f7) còn Ng6 thì mất vào tốt h7. Bù lại, Đen có tượng f2 sát một vua đã mất quyền nhập thành, cùng hai mã d4 và f6. Thế cờ chưa yên, vì vua Trắng có thể ăn tượng bằng Kxf2.
                              en: White has a rook and a pawn more — two rooks, two bishops, two knights and seven pawns against one rook, two bishops, two knights and six pawns, with the queens still on. The white knight on h8 has no safe square, because Nf7 would be taken for nothing by the queen on e7 (White's own pawn on d5 blocks the c4 bishop's diagonal to f7) and Ng6 is lost to the h7 pawn. Black's compensation is the bishop on f2 beside a king that can no longer castle, and the knights on d4 and f6. Nothing is settled yet, since the white king can take the bishop with Kxf2.
                              fr: Les Blancs ont une tour et un pion de plus — deux tours, deux fous, deux cavaliers et sept pions contre une tour, deux fous, deux cavaliers et six pions, les dames étant toujours là. Le cavalier blanc h8 n'a aucune case sûre, car Nf7 serait pris gratuitement par la dame e7 (le pion d5 des Blancs bouche la diagonale du fou c4 vers f7) et Ng6 est perdu contre le pion h7. La compensation noire est le fou f2 à côté d'un roi qui ne peut plus roquer, et les cavaliers d4 et f6. Rien n'est réglé, puisque le roi blanc peut prendre le fou par Kxf2.
                            plan:
                              vi: Trắng muốn giải thoát mã và tượng bằng d6 — nước này tấn công hậu e7 và tốt c7, đồng thời mở đường chéo của tượng c4 tới f7 để con mã có thể ra khỏi góc. Đen giữ tượng f2 bằng ...Ng4 và đưa thêm quân vào cuộc bằng ...Bg4 nhắm vào hậu d1.
                              en: White wants to free the knight and the bishop with d6, which attacks the queen on e7 and the pawn on c7 and opens the c4 bishop's diagonal to f7 so that the knight can leave the corner. Black keeps the bishop on f2 alive with ...Ng4 and brings more pieces in with ...Bg4, aiming at the queen on d1.
                              fr: Les Blancs veulent libérer le cavalier et le fou par d6, qui attaque la dame e7 et le pion c7 et ouvre la diagonale du fou c4 vers f7 pour que le cavalier puisse quitter le coin. Les Noirs gardent le fou f2 en vie par ...Ng4 et amènent d'autres pièces avec ...Bg4, visant la dame d1.
                            basis:
                              by: chan
                              at: '2026-10-01'
