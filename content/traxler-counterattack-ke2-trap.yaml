# Traxler Counterattack: Ke2 Trap. The defining line is the one frozen in
# `tools/catalogue/source/traps.yaml` — 1.e4 e5 2.Nf3 Nc6 3.Bc4 Nf6 4.Ng5 Bc5 5.Nxf7 Bxf2+ —
# and it ends on Black's own ply, so the root is an opponent node and White's replies can
# carry a quality (docs/CONTEXT.md, invariant 5).
#
# ECO is C57, matching `traps.yaml` (a trap carries the ECO of the opening it sits inside,
# ADR-0008). The dataset's deeper Traxler rows — Bishop Sacrifice Line, King March Line,
# Knight Sacrifice Line — are catalogue entries of their own, authored by the deepening
# stream; none of them is authored a second time here (see "Where each line lives" below).
#
# This is the line of the game that gave the whole opening its name: J. Reinisch vs Karel
# Traxler, Hostouň 1890, as recorded on Wikipedia's "Traxler Counterattack" page (citing
# Chessgames.com for the game score). Of White's three legal replies to 5...Bxf2+ —
# 6.Kxf2, 6.Kf1 and 6.Ke2 — the first two are the ones modern theory actually recommends
# (per the same page: Kf1 "as the white king can no longer be checked", and Kxf2 the choice
# of "most modern masters" facing 5.Bxf7+ move orders); 6.Ke2 is singled out on the page as
# strictly worse than Kf1, "as Black does not have to play Qe7 since the white king is
# still exposed to checks." What follows in the actual game, quoted there from Traxler's
# own annotation ("White has no defense; the mating finale is pretty"), was replayed in
# full with chess.js: 6...Nd4+ 7.Kd3 b5!! 8.Bb3 Nxe4!! 9.Nxd8 Nc5+ 10.Kc3 Ne2+ 11.Qxe2 Bd4+
# 12.Kb4 a5+ 13.Kxb5 Ba6+ 14.Kxa5 Bd3+ 15.Kb4 Na6+ 16.Ka4 Nb4+ 17.Kxb4 c5#, giving up the
# queen and both knights to walk White's own king to the a4/b4 corner of its own side of
# the board.
#
# The leaf under 6.Ke2 claims no mate, even though the actual 1890 game reached one by force
# (invariant 4 forbids asserting a mate without a certificate, and there is no certificate
# for this one). `npm run prove:mates -- --max-moves 12` was run against that leaf and
# **refused**: after 167 seconds and three million nodes the search reached its node cap
# without settling whether mate in 12 is forced (`cap-reached`, per ADR-0005 — "an
# unprovable claim never becomes a published one, and the leaf goes back to the author to
# be written as an honest assessment"). The historical record and Traxler's own annotation
# are cited in the prose as what they are — a documented fact about one specific game — and
# the outcome there is the `type: position` a project this careful about invariant 4 has to
# fall back to rather than assert what it cannot prove.
#
# #175 item 5 added the two correct answers, 6.Kxf2 and 6.Kf1, which this entry used to wave
# away in a catch-all, and the quick mates that hide inside them. Every ply below was
# replayed with chess.js before a word of prose was written, and every count in a leaf and
# every "is this square covered" was read off the derived position. The vendored Stockfish 19
# (the analysis page's build, ADR-0012) was run locally as a cross-check on which replies
# deserve which quality; none of its figures appears anywhere in the content.
#
# Sources, and what replaying them changed:
#  - chesstrapguide, "Wilkes-Barre": 6.Kxf2 Nxe4+ 7.Kg1 Qh4 8.g3 Nxg3 9.hxg3 Qxg3+ 10.Kf1
#    Rf8. Replays legally. What the page does not say is that 7...Qh4 threatens Qf2# at once
#    (the e4 knight guards f2 and the h1 rook takes the king's last square), so the natural
#    8.Nxh8?? walks into mate in one. That is the trap in this line, and it is proved
#    below, together with its twin after 7.Kf1.
#  - chessgames, G23 (Kerner vs Brinckmann 1955, as the audit issue lists it; the game
#    itself was not looked at): 6.Kf1 Qe7 7.Nxh8 d5 8.exd5 Nd4. Replays legally, and 6...Qe7
#    is the one sensible way to meet 6.Kf1: on the engine cross-check every other black
#    move is at least two and a half pawns worse, because the knight on f7 still forks the
#    queen and the rook.
#  - The issue asks for 7.Ke3 and 7.Kf1 "as real replies". 7.Kf1 is modelled, as a mistake
#    (7...Qh4 and Qf2# threatens again, and the king no longer has Kg1 to run to). 7.Ke3 is
#    the root of an existing catalogue entry, `two-knights-defense-traxler-counterattack-
#    king-march-line`, whose defining line is exactly 1.e4 ... 6.Kxf2 Nxe4+; it is named in
#    a `dismissed` note below instead of being authored a second time.
#
# Where each line lives, so that nothing is authored twice. The position after 5...Bxf2+ is
# this entry's root; everything the issue lists starts from it, so it is all here. The
# gambit entry `italian-game-two-knights-defense-traxler-counterattack` (root after
# 4...Bc5) stops at 5.Nxf7 with a position leaf and is left untouched: it has no way to
# point at another entry (`transposesTo` is scoped within one entry), so giving it
# 5...Bxf2+ and the replies would copy this subtree. The three sub-row entries own 5.Bxf7+,
# 5.Nxf7 Rf8 and 7.Ke3 respectively.
id: traxler-counterattack-ke2-trap
name: 'Traxler Counterattack: Ke2 Trap'
eco: C57
category: trap
side: black
definingLine: [e4, e5, Nf3, Nc6, Bc4, Nf6, Ng5, Bc5, Nxf7, 'Bxf2+']
soundness:
  value: sound
  reviewedAt: '2026-09-21'
  basis:
    by: chan
    at: '2026-09-21'
    source: >-
      A judgement about White's play at move 6, not about the Traxler Counterattack as a
      whole, which remains a real piece sacrifice and is taught as such by the gambit entry
      this trap sits alongside. Once White specifically plays 6.Ke2, the king stays in the
      centre with no safe haven, and the actual 1890 game — replayed move by move with
      chess.js and legal at every step — was lost by force according to Traxler's own
      annotation. This project's own search could not certify that forced mate within
      budget (see the header), so the judgement below stops at "White's position is
      practically hopeless" rather than at a proved mate. No engine was consulted for the
      judgement and no database was queried.
judgement:
  by: chan
  at: '2026-10-01'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics. The branches added
    on 2026-10-01 (6.Kxf2 and 6.Kf1) were additionally cross-checked locally against
    Stockfish 19, depth 14 to 18, to catch a quality that was plainly wrong; no engine figure
    is published. The mates are not judgement — they are machine-proved and replayed by CI.
tree:
  annotation:
    vi: Đen vừa ăn tốt f2 bằng tượng và chiếu vua. Con mã Trắng ở f7 vẫn đang chĩa đôi vào hậu d8 và xe h8, nhưng vua phải thoát chiếu trước đã. Trắng có {legal} nước hợp lệ, tất cả đều là nước đi của vua, và chỉ một trong số đó là sai lầm thực sự.
    en: Black has just taken the f2 pawn with the bishop and given check. White's knight on f7 still forks the queen on d8 and the rook on h8, but the king has to answer the check first. White has {legal} legal replies, all of them king moves, and only one of them is a genuine mistake.
    fr: Les Noirs viennent de prendre le pion f2 du fou en donnant échec. Le cavalier blanc en f7 fourche toujours la dame d8 et la tour h8, mais le roi doit d'abord parer l'échec. Les Blancs ont {legal} réponses légales, toutes des coups de roi, et une seule d'entre elles est une véritable faute.
  counts:
    legal: { count: legalReplies, expect: 3 }
  children:
    - ply: Ke2
      replyQuality: blunder
      frequency: rare
      annotation:
        vi: Trắng lùi vua về e2 thay vì f1 hay ăn luôn con tượng. Nước này trông như một cách lùi vua thận trọng, nhưng nó vẫn để vua đứng giữa bàn cờ, còn có thể bị chiếu tiếp — và Đen sẽ không để cơ hội đó trôi qua.
        en: White steps the king to e2 instead of f1 or simply capturing the bishop. It looks like a cautious retreat, but it still leaves the king in the middle of the board, open to further checks — and Black does not let that chance go by.
        fr: Les Blancs reculent le roi en e2 au lieu de f1 ou de simplement prendre le fou. Cela ressemble à un repli prudent, mais le roi reste au milieu de l'échiquier, exposé à d'autres échecs — et les Noirs ne laissent pas passer cette occasion.
      unsettled: >-
        Nxe4 is going free in the narrow sense this check uses — nothing recaptures on
        e4 — but it is not the move: Nd4+ is check, keeps the king from ever castling or
        settling, and is the move both the historical game and this entry's plan actually
        continue with. Grabbing the free pawn first would only give White a spare tempo to
        address the king. This is the detector reporting a capture the stronger move
        simply ignores, and the leaf is correct as it stands.
      outcome:
        type: position
        evaluation:
          vi: Quân số vẫn ngang nhau ở đây — mỗi bên đã ăn một tốt, bảy tốt đối bảy tốt, và các quân nặng nhẹ còn nguyên — nhưng thế cờ thì không hề ngang nhau chút nào. Vua Trắng đã mất quyền nhập thành và còn kẹt giữa bàn, ngay trên đường chiếu tiếp theo của mã c6, và mọi cách phát triển bình thường (Nc3, d4, Re1) đều chậm hơn ít nhất một nhịp so với những đòn chiếu liên tục mà Đen sắp tung ra. Đây chính xác là thế cờ của ván đấu lịch sử J. Reinisch – Karel Traxler, Hostouň 1890 — ván đấu mà chính Traxler ghi lại rằng Trắng "không còn cách chống đỡ nào" sau đó.
          en: Material is still level here — each side has taken a pawn, seven pawns against seven, and every piece is still on the board — but the position is nowhere near level. White's king has lost the right to castle and is stuck in the centre, sitting right on the next check the knight on c6 is about to give, and every ordinary developing move (Nc3, d4, Re1) is at least a tempo too slow for the string of checks Black is about to unleash. This is the exact position from the historical game J. Reinisch–Karel Traxler, Hostouň 1890 — the game Traxler himself recorded as having "no defense" for White from here on.
          fr: Le matériel reste égal ici — chaque camp a pris un pion, sept pions contre sept, et toutes les pièces sont encore sur l'échiquier — mais la position, elle, n'a rien d'égal. Le roi blanc a perdu le droit de roquer et reste coincé au centre, posté juste sur le prochain échec que le cavalier c6 s'apprête à donner, et tout coup de développement ordinaire (Nc3, d4, Re1) accuse au moins un temps de retard sur la série d'échecs que les Noirs s'apprêtent à déclencher. C'est exactement la position de la partie historique J. Reinisch–Karel Traxler, Hostouň 1890 — la partie que Traxler lui-même a notée comme n'ayant "aucune défense" pour les Blancs à partir d'ici.
        plan:
          vi: Đen tiếp tục với Nd4+, buộc vua Trắng phải chọn giữa Kd3 (như ván đấu lịch sử) hay ăn liều Kxf2, và trong cả hai trường hợp vua đều tiếp tục bị đuổi bằng những nước chiếu liên tiếp của mã, tượng và hậu, hy sinh cả hậu lẫn cả hai mã nếu cần chỉ để giữ vua Trắng không bao giờ tìm được nơi trú ẩn. Trắng, về phần mình, không còn nước phát triển nào đủ nhanh để bắt kịp — cố nhập thành là không thể vì vua đã di chuyển, còn cố đổi quân để giảm áp lực chỉ giúp Đen giản lược sang một thế tàn cuộc vẫn còn thắng thế rõ ràng nhờ vua Trắng lộ liễu.
          en: Black continues with Nd4+, forcing White's king to choose between Kd3 (as in the historical game) or the greedy Kxf2, and either way the king keeps getting chased by a string of checks from the knight, the bishop and the queen, giving up the queen and both knights if that is what it takes to keep the White king from ever finding shelter. White, for its part, has no developing move fast enough to catch up — castling is gone because the king has moved, and trading pieces to relieve the pressure only helps Black simplify into an endgame that is still clearly winning on the exposed king alone.
          fr: Les Noirs poursuivent par Nd4+, obligeant le roi blanc à choisir entre Kd3 (comme dans la partie historique) ou la prise gourmande Kxf2, et dans les deux cas le roi continue d'être chassé par une série d'échecs du cavalier, du fou et de la dame, sacrifiant la dame et les deux cavaliers s'il le faut pour que le roi blanc ne trouve jamais refuge. Les Blancs, de leur côté, n'ont aucun coup de développement assez rapide pour rattraper leur retard — le roque a disparu puisque le roi a bougé, et échanger les pièces pour soulager la pression ne fait qu'aider les Noirs à simplifier vers une finale encore nettement gagnante, rien qu'à cause du roi exposé.
        basis:
          by: chan
          at: '2026-09-21'
    - ply: Kxf2
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng dùng vua ăn tượng. Trắng giờ hơn một tượng, số tốt ngang nhau, bảy đối bảy, nhưng vua đã bị kéo ra f2 giữa bàn cờ, đến lượt Đen đi và có ngay một nước chiếu.
        en: White takes the bishop with the king. White is now a bishop up with the pawns level, seven against seven, but the king has been pulled out to f2, in the middle of the board, with Black to move and a check available at once.
        fr: Les Blancs prennent le fou avec le roi. Ils ont maintenant un fou de plus, les pions étant égaux, sept contre sept, mais le roi a été attiré en f2, au milieu de l'échiquier, avec le trait aux Noirs et un échec disponible aussitôt.
      children:
        - ply: 'Nxe4+'
          annotation:
            vi: Đen ăn tốt e4 bằng mã và chiếu vua. Nước này đồng thời nhường đường cho hậu d8 nhìn tới h4, và mã e4 sẽ canh ô f2 ngay khi vua Trắng rời khỏi đó. Vua Trắng có {legal} nước hợp lệ, và chúng không hề ngang nhau — Kg1 là nước lùi vững, Ke3 là cuộc hành quân của vua đã có mục riêng, còn những nước vua khác đều kém hơn.
            en: Black takes the e4 pawn with the knight and gives check. The move also clears the diagonal for the queen on d8, which now sees h4, and the knight on e4 will guard f2 as soon as the king has left it. White's king has {legal} legal moves and they are far from equal — Kg1 is the sound retreat, Ke3 is the king march that has an entry of its own, and the other king moves are all worse.
            fr: Les Noirs prennent le pion e4 du cavalier en donnant échec. Le coup libère aussi la diagonale de la dame d8, qui voit désormais h4, et le cavalier e4 gardera f2 dès que le roi aura quitté cette case. Le roi blanc a {legal} coups légaux et ils sont loin d'être égaux — Kg1 est le repli sain, Ke3 est la marche du roi qui a sa propre entrée, et les autres coups de roi sont tous moins bons.
          counts:
            legal: { count: legalReplies, expect: 6 }
          dismissed:
            - ply: Ke3
              reason: The root of the catalogue entry two-knights-defense-traxler-counterattack-king-march-line, whose defining line is exactly this position; it owns 7.Ke3 and what follows. Authoring it here as well would be a second copy of the same subtree.
          dismissRest:
            reason:
              vi: Vua Trắng đi e1, e2 hoặc f3, và cả ba nước đều bước thẳng vào một nước chiếu ngay lập tức — Qh4+ nếu Ke1, Nd4+ nếu Ke2, Qf6+ nếu Kf3 — khi vua vẫn còn đứng giữa bàn cờ. Mục này theo Kg1 và Kf1.
              en: White's king goes to e1, e2 or f3, and each of them walks straight into a check — Qh4+ against Ke1, Nd4+ against Ke2, Qf6+ against Kf3 — with the king still in the middle of the board. This entry follows Kg1 and Kf1.
              fr: Le roi blanc va en e1, e2 ou f3, et chacun de ces coups entre droit dans un échec — Qh4+ contre Ke1, Nd4+ contre Ke2, Qf6+ contre Kf3 — alors que le roi reste au milieu de l'échiquier. Cette entrée suit Kg1 et Kf1.
          children:
            - ply: Kg1
              replyQuality: good
              frequency: common
              annotation:
                vi: Vua lùi về g1, nước lùi vững nhất. Xe h1 vẫn đứng ngay cạnh, tự chắn mất ô thoát của chính vua mình, và điều đó sẽ có ý nghĩa ngay lập tức.
                en: The king steps back to g1, the sound retreat. White's own rook is still on h1, shutting in its king, and that is going to matter at once.
                fr: Le roi recule en g1, le repli sain. La tour blanche est toujours en h1, elle enferme son propre roi, et cela va compter aussitôt.
              children:
                - ply: Qh4
                  annotation:
                    vi: Hậu Đen thoát khỏi đòn chĩa đôi và đồng thời có đe dọa riêng. Hậu lên h4 và nhìn vào f2, nơi mã e4 đã canh sẵn. Qf2 sẽ là chiếu bí, vì xe h1 chiếm mất ô thoát cuối cùng của vua.
                    en: Black's queen steps out of the fork with a threat of its own. It goes to h4 and aims at f2, where the knight on e4 already stands guard. Qf2 would be mate, because the rook on h1 takes the king's last square away.
                    fr: La dame noire sort de la fourchette avec une menace à elle. Elle va en h4 et vise f2, que le cavalier e4 garde déjà. Qf2 serait mat, car la tour h1 prend au roi sa dernière case.
                  counts:
                    legal: { count: legalReplies, expect: 33 }
                    mated: { count: matedBy, ply: 'Qf2#', expect: 26 }
                  dismissRest:
                    reason:
                      vi: Trắng chơi nước khác. {Mated} trong {legal} nước hợp lệ ở đây bị Qf2# chiếu bí ngay, vì mã e4 canh f2 còn xe h1 nhốt vua lại. Những nước tránh được là g3, nước mà mục này theo, cùng Nd6+ (chiếu trước), h3 (nhường ô h2 cho vua), Qe2, Qf3, Qe1 và Qf1 (canh f2). Ngoài g3, những nước đó là các cách phòng thủ khác và không nước nào được dựng ở đây.
                      en: White plays anything else. {Mated} of the {legal} legal replies here lose at once to Qf2#, because the knight on e4 guards f2 and the rook on h1 shuts the king in. The moves that avoid it are g3, which this entry follows, and Nd6+ (a check first), h3 (which makes room on h2), Qe2, Qf3, Qe1 and Qf1 (which cover f2). Apart from g3, those are other defences and none of them is mapped here.
                      fr: Les Blancs jouent autre chose. {Mated} des {legal} réponses légales ici perdent aussitôt sur Qf2#, car le cavalier e4 garde f2 et la tour h1 enferme le roi. Les coups qui l'évitent sont g3, que cette entrée suit, ainsi que Nd6+ (un échec d'abord), h3 (qui fait de la place en h2), Qe2, Qf3, Qe1 et Qf1 (qui couvrent f2). Hormis g3, ce sont d'autres défenses et aucune n'est cartographiée ici.
                  children:
                    - ply: g3
                      replyQuality: good
                      frequency: common
                      annotation:
                        vi: Trắng chắn đường chéo bằng g3, chặn được nước chiếu bí. Nhưng con tốt chắn đường lại bị ăn được, và con mã ăn nó sẽ nhìn thẳng vào xe h1.
                        en: White blocks the diagonal with g3, which stops the mate. The pawn that blocks it can be captured, though, and the knight that takes it attacks the rook on h1.
                        fr: Les Blancs bouchent la diagonale par g3, ce qui évite le mat. Mais le pion qui la bouche peut être pris, et le cavalier qui le prend attaque la tour h1.
                      children:
                        - ply: Nxg3
                          annotation:
                            vi: Đen ăn tốt bằng mã. Con mã nhìn vào xe h1, được hậu bảo vệ, và quân duy nhất của Trắng có thể ăn lại nó là tốt h2.
                            en: Black takes the pawn with the knight. It attacks the rook on h1, the queen protects it, and the only white piece that can take it back is the pawn on h2.
                            fr: Les Noirs prennent le pion du cavalier. Celui-ci attaque la tour h1, la dame le protège, et la seule pièce blanche qui puisse le reprendre est le pion h2.
                          dismissed:
                            - ply: Nxh8
                              reason: A playable alternative, not a mistake. 9.Nxh8 takes the rook first and Black's attack goes on with 9...Nd4. It is not modelled because the entry follows the line the sources give, 9.hxg3, and this one would open a second long subtree that no source line supports.
                          dismissRest:
                            reason:
                              vi: Trắng không ăn con mã. Ngoài Nxh8, mọi nước khác đều để nó đứng nguyên ở g3, nơi hậu bảo vệ nó và nơi nó đang tấn công xe h1. Đó không phải đường mà mục này theo.
                              en: White does not take the knight. Apart from Nxh8, every other reply leaves it on g3, where the queen protects it and where it attacks the rook on h1. That is not the line this entry follows.
                              fr: Les Blancs ne prennent pas le cavalier. Hormis Nxh8, tous les autres coups le laissent en g3, où la dame le protège et d'où il attaque la tour h1. Ce n'est pas la ligne que suit cette entrée.
                          children:
                            - ply: hxg3
                              replyQuality: good
                              frequency: common
                              annotation:
                                vi: Trắng ăn mã bằng tốt h, nước ăn lại tự nhiên nhất. Xe h1 giờ đối mặt với hậu h4, và con tốt mới trên g3 cũng tấn công nó — nhưng con tốt ấy không có quân nào bảo vệ.
                                en: White takes the knight with the h-pawn, the natural recapture. The rook on h1 now faces the queen on h4, and the new pawn on g3 attacks it too — but that pawn is protected by nothing.
                                fr: Les Blancs prennent le cavalier du pion h, la reprise naturelle. La tour h1 fait maintenant face à la dame h4, et le nouveau pion g3 l'attaque aussi — mais ce pion n'est protégé par personne.
                              children:
                                - ply: 'Qxg3+'
                                  annotation:
                                    vi: Hậu Đen, đang bị cả xe lẫn tốt tấn công, ăn con tốt g3 không ai bảo vệ và chiếu dọc cột g. Trắng chỉ có {legal} nước hợp lệ, và đó là nước vua đi f1.
                                    en: Black's queen, attacked by the rook and by the pawn, takes the unprotected pawn on g3 and gives check along the g-file. White has only {legal} legal move, and it is the king to f1.
                                    fr: La dame noire, attaquée par la tour et par le pion, prend le pion g3 non protégé et donne échec sur la colonne g. Les Blancs n'ont que {legal} coup légal, et c'est le roi en f1.
                                  counts:
                                    legal: { count: legalReplies, expect: 1 }
                                  children:
                                    - ply: Kf1
                                      replyQuality: best
                                      frequency: common
                                      annotation:
                                        vi: Vua đi f1, ô duy nhất. Vua đã mất quyền nhập thành, Trắng không còn tốt nào trên các cột e, f, g và h, còn hậu Đen vẫn đứng ở g3.
                                        en: The king goes to f1, the only square. It has lost the right to castle, White has no pawn left on the e-, f-, g- or h-file, and Black's queen is still on g3.
                                        fr: Le roi file en f1, la seule case. Il a perdu le droit de roquer, il ne reste aucun pion blanc sur les colonnes e, f, g et h, et la dame noire est toujours en g3.
                                      children:
                                        - ply: Rf8
                                          annotation:
                                            vi: Đen đưa xe h8 về f8 và tấn công mã f7, quân mà chỉ có tượng c4 bảo vệ. Nếu mã ấy biến mất, xe sẽ nhìn thẳng xuống cột f đang để ngỏ vào vua f1.
                                            en: Black brings the h8 rook to f8, attacking the knight on f7, which only the bishop on c4 defends. If that knight goes, the rook looks straight down the open f-file at the king on f1.
                                            fr: Les Noirs ramènent la tour h8 en f8 et attaquent le cavalier f7, que seul le fou c4 défend. Si ce cavalier disparaît, la tour regarde droit le long de la colonne f ouverte vers le roi f1.
                                          unsettled: >-
                                            Rxh7 is the capture the check sees: nothing recaptures on h7. It is not a
                                            free pawn in any sense a learner could use, because it spends a move on a pawn
                                            while White's own king is the target — the rook on f8 still attacks the
                                            knight on f7, and the knight is defended only by the bishop on c4 (the
                                            rook on h7 does not defend it, the g7 pawn is in the way). The evaluation
                                            already counts the pawns as they stand before the capture, and one pawn
                                            more or less changes the count by one, not the picture of an exposed
                                            king, so playing it out would add nothing the leaf needs.
                                          outcome:
                                            type: position
                                            evaluation:
                                              vi: Trắng có hai tượng và hai mã đối với một tượng và một mã của Đen, còn Đen có bảy tốt đối với bốn tốt của Trắng. Ba tốt không đủ trả cho một tượng và một mã, nên phép đếm vẫn nghiêng về Trắng. Nhưng vua f1 không còn nhập thành được, Trắng không còn tốt nào trên các cột e, f, g và h, và hậu g3 cùng xe f8 của Đen đã ở sát nó — xe tấn công mã f7 mà chỉ có tượng c4 bảo vệ, và ...Bh3+ sẽ tới ngay khi tốt d7 nhường đường.
                                              en: White has two bishops and two knights against one bishop and one knight, and Black has seven pawns against White's four. Three pawns do not pay for a bishop and a knight, so the count still favours White. But the king on f1 can no longer castle, White has no pawn left on the e-, f-, g- or h-file, and Black's queen on g3 and rook on f8 are already close to it — the rook attacks the knight on f7, which only the bishop on c4 defends, and ...Bh3+ comes as soon as the d7 pawn steps aside.
                                              fr: Les Blancs ont deux fous et deux cavaliers contre un fou et un cavalier, et les Noirs ont sept pions contre quatre. Trois pions ne paient pas un fou et un cavalier, donc le compte reste en faveur des Blancs. Mais le roi f1 ne peut plus roquer, il ne reste aucun pion blanc sur les colonnes e, f, g et h, et la dame g3 et la tour f8 noires sont déjà tout près — la tour attaque le cavalier f7, que seul le fou c4 défend, et ...Bh3+ arrive dès que le pion d7 s'écarte.
                                            plan:
                                              vi: Trắng muốn đưa các quân còn ngủ vào cuộc và đưa vua ra khỏi tầm bắn — Nc3 và Qe2 là những nước tự nhiên. Đen giữ thế chủ động bằng ...d5, mở đường cho tượng c8 và tấn công tượng c4, rồi tiếp tục ...Bh3+.
                                              en: White wants to bring the sleeping pieces into play and get the king out of the line of fire — Nc3 and Qe2 are the natural moves. Black keeps the initiative with ...d5, which opens the c8 bishop and attacks the bishop on c4, with ...Bh3+ to follow.
                                              fr: Les Blancs veulent mettre en jeu leurs pièces endormies et sortir le roi de la ligne de tir — Nc3 et Qe2 sont les coups naturels. Les Noirs gardent l'initiative avec ...d5, qui ouvre le fou c8 et attaque le fou c4, avant ...Bh3+.
                                            basis:
                                              by: chan
