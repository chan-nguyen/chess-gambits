# Sicilian Defense: Nyezhmetdinov-Rossolimo Attack, Fianchetto Variation, Lutikov Gambit. Frozen
# defining line 1.e4 c5 2.Nf3 Nc6 3.Bb5 g6 4.O-O Bg7 5.c3 Nf6 6.d4, which ends on White's own ply, so
# the root is an opponent node (docs/CONTEXT.md, invariant 5). Replayed with chess.js through
# 6...Nxe4 7.Re1 d5. With the d-pawn gone from d7 the knight on c6 is pinned to the king by the bishop
# on b5 (it has no legal move at the leaf). searchMate at 3 moves from the resulting position returns
# no-mate, so no forced mate is claimed anywhere in this entry, and no capture is left going free at
# the leaf.
id: nyezhmetdinov-rossolimo-attack-fianchetto-variation-lutikov
