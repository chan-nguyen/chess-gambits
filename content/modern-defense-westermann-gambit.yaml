soundness:
  value: sound
  reviewedAt: '2026-09-22'
  basis:
    by: chan
    at: '2026-09-22'
    source: >-
      A judgement. Nothing is actually offered here — 3.Bd2 develops the bishop toward a
      future Qc1/Bh6 or c4-and-Nc3 setup, keeping options flexible. It is a quiet, modest
      try rather than a genuine sacrifice, so there is little to refute and White stays
      perfectly safe. No engine was consulted and no database was queried.
judgement:
