    source: >-
      Long-established Blackmar-Diemer Gambit theory. White offers a further pawn purely for
      open lines and quick development; declining the capture keeps the extra material but
      costs time. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-29'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa chơi 4.f3, mời Đen ăn lại tốt e4 để chuyển sang thế Accepted; ở đây Đen chọn không ăn (declined) và chơi cách khác. Trắng đã phát triển mã c3 và chuẩn bị mở đường cho tượng c1, đổi lại tạm thời chỉ kém một tốt trên bàn cờ (bảy so với tám) mà chưa lấy lại được.
    en: White has just played 4.f3, inviting Black to recapture on e4 and transpose to the Accepted lines; here Black declines that capture and plays something else instead. White has developed the knight to c3 and is preparing to open the diagonal for the c1-bishop, currently down one pawn on the board (seven against eight) with no recapture yet.
    fr: "Les Blancs viennent de jouer 4.f3, invitant les Noirs à reprendre en e4 pour transposer dans les lignes Accepted ; ici, les Noirs refusent cette capture et jouent autre chose. Les Blancs ont développé le cavalier en c3 et se préparent à ouvrir la diagonale du fou c1, actuellement un pion de moins sur l'échiquier (sept contre huit) sans reprise encore effectuée."
  dismissRest:
    reason:
      vi: 'Đen chơi cách khác thay vì ...e6 ở đây, kể cả việc ăn lại bằng ...exf3 để chuyển hẳn sang các thế Accepted đã biết. Đánh giá tương tự: Trắng luôn kém một tốt trên bàn tại thời điểm này nhưng bù lại bằng mã đã phát triển và trung tâm thoáng, bất kể Đen chọn hướng nào.'
      en: 'Black plays something other than ...e6 here, including recapturing with ...exf3 to transpose into the known Accepted lines. The assessment is similar throughout: White is always a pawn down on the board at this point but compensated by the developed knight and the open centre, whichever way Black goes.'
      fr: "Les Noirs jouent autre chose que ...e6 ici, y compris reprendre par ...exf3 pour transposer dans les lignes Accepted connues. L'évaluation reste similaire dans tous les cas : les Blancs sont toujours un pion de moins sur l'échiquier à ce stade, compensé par le cavalier développé et le centre ouvert, quelle que soit la direction choisie par les Noirs."
  children:
    - ply: e6
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Đen chơi ...e6 chuẩn bị ...Bb4 hoặc ...Nf6 với thế trận chắc chắn, đơn giản không vội ăn tốt f3.
        en: Black plays ...e6, preparing ...Bb4 or ...Nf6 with a solid setup, simply in no hurry to capture on f3.
        fr: Les Noirs jouent ...e6, préparant ...Bb4 ou ...Nf6 avec un dispositif solide, sans se presser de capturer en f3.
      outcome:
        type: position
        evaluation:
          vi: Đen giữ tốt dư (tám so với bảy) với thế trận chắc chắn, trong khi Trắng có mã trên c3 và sắp chơi fxe4 để cân bằng vật chất.
          en: Black holds the extra pawn (eight against seven) with a solid setup, while White has the knight on c3 and is about to play fxe4 to level material.
          fr: "Les Noirs conservent le pion supplémentaire (huit contre sept) avec un dispositif solide, tandis que les Blancs ont le cavalier en c3 et s'apprêtent à jouer fxe4 pour égaliser le matériel."
        plan:
          vi: Trắng chơi fxe4 cân bằng vật chất rồi tiếp tục Bd3 hoặc Bc4 và O-O. Đen chơi ...Nf6 và ...Bb4 hoặc ...Be7, hoàn tất phát triển với thế trận vững chắc.
          en: White plays fxe4, levelling material, then continues with Bd3 or Bc4 and O-O. Black plays ...Nf6 and ...Bb4 or ...Be7, completing development with a sound position.
          fr: Les Blancs jouent fxe4, égalisant le matériel, puis poursuivent par Bd3 ou Bc4 et O-O. Les Noirs jouent ...Nf6 et ...Bb4 ou ...Be7, achevant leur développement avec une position saine.
        basis:
          by: chan
