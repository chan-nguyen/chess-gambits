id: french-defense-alapin-gambit
name: 'French Defense: Alapin Gambit'
eco: C00
category: gambit
side: white
definingLine: [e4, e6, d4, d5, Be3]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. The bishop move does nothing to defend e4 and does not open a line that is
      worth a clean pawn, so Black is simply better for taking. No engine was consulted and
      no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa đưa tượng ra e3 thay vì bảo vệ tốt e4 bằng Nc3 hay Nd2 như thường lệ. Con tốt e4 giờ không còn ai đỡ.
    en: White has just developed the bishop to e3 instead of defending the e4 pawn with the usual Nc3 or Nd2. The e4 pawn is now defended by nothing.
    fr: Les Blancs viennent de développer le fou en e3 au lieu de défendre le pion e4 par les habituels Nc3 ou Nd2. Le pion e4 n'est désormais plus défendu.
  dismissRest:
    reason:
      vi: Đen không ăn tốt e4 — phát triển bằng 3...Nf6 hay chơi 3...c5. Mỗi lựa chọn để nguyên con tốt e4 trên bàn cờ, nghĩa là lời mời vẫn chưa hề được nhận.
      en: Black does not take the e4 pawn — developing with 3...Nf6 or playing 3...c5. Each leaves the e4 pawn sitting on the board, meaning the invitation has still not actually been accepted.
      fr: Les Noirs ne prennent pas le pion e4 — développant par 3...Cf6 ou jouant 3...c5. Chacun laisse le pion e4 sur l'échiquier, ce qui veut dire que l'invitation n'a toujours pas été acceptée.
  children:
    - ply: dxe4
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen ăn con tốt ngay lập tức bằng tốt d, quân duy nhất có thể ăn tại đó. Không có gì phức tạp, con tốt e4 chỉ đơn giản là bị treo.
        en: Black takes the pawn at once with the d-pawn, the only piece that can capture there. There is nothing complicated here — the e4 pawn is simply hanging.
        fr: Les Noirs prennent aussitôt le pion avec le pion d, la seule pièce pouvant capturer là. Il n'y a rien de compliqué ici, le pion e4 est simplement en prise.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy. Đen hơn đúng một tốt sạch, và con tượng e3 của Trắng chưa làm được gì để bù lại, chỉ đứng khá xa trung tâm và không nhắm vào con tốt nào của Đen.
          en: Count the pawns and it is eight for Black, seven for White. Black is a clean pawn up, and White's bishop on e3 has nothing to show for it yet, standing well away from the centre and not aiming at any Black pawn.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs. Les Noirs ont un pion de plus bien réel, et le fou blanc en e3 n'a encore rien à montrer, se tenant loin du centre et ne visant aucun pion noir.
        plan:
          vi: Trắng chơi Nc3 hoặc Nd2 để đòi lại con tốt e4, rồi Nf3 và Bd3, cố tận dụng cặp tượng đã phát triển sớm để bù cho vật chất đã mất. Đen chơi Nf6 và Be7 hay Bb4+, hoàn thiện phát triển và giữ con tốt thừa làm vốn liếng lâu dài.
          en: White plays Nc3 or Nd2 to win the e4 pawn back, then Nf3 and Bd3, trying to use the early-developed bishop pair to justify the material spent. Black plays Nf6 and Be7 or Bb4+, completing development and banking the extra pawn as a long-term asset.
          fr: Les Blancs jouent Nc3 ou Nd2 pour regagner le pion e4, puis Nf3 et Bd3, essayant d'utiliser la paire de fous développée tôt pour justifier le matériel dépensé. Les Noirs jouent Nf6 et Be7 ou Bb4+, achevant leur développement et conservant le pion supplémentaire comme atout durable.
        basis:
          by: chan
          at: '2026-09-25'
