# Bishop's Opening: Lewis Countergambit, Walker Variation. Frozen defining line 1.e4
# e5 2.Bc4 Bc5 3.c3 d5 4.Bxd5 Nf6, which ends on Black's own ply, so the root is an
# opponent node (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 5.d4 —
# the d5-bishop is defended by White's own e4 pawn, so the mutual attack does not drop
# a piece. searchMate at 3 moves from the resulting position returns no-mate, so no
# forced mate is claimed anywhere in this entry, and no capture is left going free at
# the leaf.
