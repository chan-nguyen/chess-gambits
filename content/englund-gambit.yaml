    - ply: Nf3
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Trắng phát triển và đánh vào con tốt e5 bằng quân thay vì ăn nó. Đây là biến Alekhine đảo, và nó đặt câu hỏi cho Đen sớm hơn Đen muốn.
        en: White develops and attacks the e5 pawn with a piece instead of taking it. This is the Reversed Alekhine, and it asks Black a question earlier than Black would like.
        fr: Les Blancs se développent et attaquent le pion e5 avec une pièce au lieu de le prendre. C'est l'Alekhine inversée, et elle pose aux Noirs une question plus tôt qu'ils ne le souhaiteraient.
      children:
        - ply: e4
          annotation:
            vi: Đen đẩy tốt lên và đuổi con mã. Con tốt e4 chiếm chỗ nhưng nó cũng cô đơn, vì không có con tốt nào của Đen đỡ nó được và Trắng sẽ nhắm vào nó bằng Nfd2, Nc3 hay f3.
            en: Black pushes on and chases the knight. The pawn on e4 takes space but it is also alone, because no black pawn can support it and White will aim at it with Nfd2, Nc3 or f3.
            fr: Les Noirs poussent et chassent le cavalier. Le pion e4 prend de l'espace mais il est seul, car aucun pion noir ne peut le soutenir et les Blancs le viseront par Nfd2, Nc3 ou f3.
          outcome:
            type: position
            evaluation:
              vi: Quân số ngang nhau và không bên nào thí gì cả. Đen có con tốt e4 cắm sâu, và câu hỏi duy nhất của thế cờ là con tốt ấy mạnh hay yếu. Nó không có tốt đỡ và Trắng có thể nhắm vào nó bằng Nc3, Nfd2, f3 hoặc Bf4 với Nd2. Nếu Đen giữ được nó thì Đen có không gian, còn nếu mất nó thì Đen mất một con tốt mà chẳng được gì.
              en: Material is level and nobody has sacrificed anything. Black has an advanced pawn on e4, and the only question in the position is whether that pawn is strong or weak. No pawn can support it and White can aim at it with Nc3, Nfd2, f3, or Bf4 and Nd2. If Black holds it, Black has space; if Black loses it, Black has lost a pawn for nothing.
              fr: Le matériel est égal et personne n'a rien sacrifié. Les Noirs ont un pion avancé en e4, et la seule question de la position est de savoir si ce pion est fort ou faible. Aucun pion ne peut le soutenir et les Blancs peuvent le viser par Nc3, Nfd2, f3, ou Bf4 et Nd2. Si les Noirs le conservent, ils ont de l'espace ; s'ils le perdent, ils ont perdu un pion pour rien.
            plan:
              vi: Đen chơi d5 để dựng dãy tốt d5-e4, rồi Nc6, Nf6, Bf5 hoặc Be6 và O-O, và tuyệt đối không được để mất con tốt e4 mà không có đền bù. Trắng chơi Nfd2 hoặc Ng1 tuỳ khẩu vị, rồi Nc3 đánh vào e4, e3, Bf4, Be2 và O-O, và nước phá là f3 để xoá con tốt e4. Ai thắng cuộc giằng co quanh ô e4 thì bên đó thắng ván cờ.
              en: Black plays ...d5 to build the d5-e4 chain, then ...Nc6, ...Nf6, ...Bf5 or ...Be6 and ...O-O, and must not lose the e4 pawn without compensation. White plays Nfd2 or Ng1 to taste, then Nc3 against e4, e3, Bf4, Be2 and castles, and the break is f3 to liquidate the pawn. Whoever wins the argument about e4 wins the game.
              fr: Les Noirs jouent ...d5 pour bâtir la chaîne d5-e4, puis ...Nc6, ...Nf6, ...Bf5 ou ...Be6 et ...O-O, et ne doivent pas perdre le pion e4 sans compensation. Les Blancs jouent Nfd2 ou Ng1 selon leur goût, puis Nc3 contre e4, e3, Bf4, Be2 et roquent, la rupture étant f3 pour liquider le pion. Celui qui gagne la discussion autour d'e4 gagne la partie.
