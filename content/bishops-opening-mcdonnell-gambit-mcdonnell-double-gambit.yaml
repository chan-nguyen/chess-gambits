# Bishop's Opening: McDonnell Gambit, McDonnell Double Gambit. Frozen defining line 1.e4 e5
# 2.Bc4 Bc5 3.b4 Bxb4 4.f4, which ends on White's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 4...exf4: Black takes the
# second pawn at once, the only piece that can capture there. Nothing is hanging at the
# resulting position. searchMate at 4 moves from this position returns no-mate, so no forced
# mate is claimed anywhere in this entry.
id: bishops-opening-mcdonnell-gambit-mcdonnell-double-gambit
name: "Bishop's Opening: McDonnell Gambit, McDonnell Double Gambit"
eco: C23
category: gambit
side: white
definingLine: [e4, e5, Bc4, Bc5, b4, Bxb4, f4]
soundness:
  value: dubious
