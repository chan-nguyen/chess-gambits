        en: 'White defends the pawn on e4 with the d-pawn and opens the diagonal for the bishop on c1. The pawn on e4 is now attacked twice and defended once.'
        fr: 'Les Blancs défendent le pion e4 avec le pion d et ouvrent la diagonale du fou c1. Le pion e4 est maintenant attaqué deux fois et défendu une fois.'
      outcome:
