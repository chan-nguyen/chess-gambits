tree:
  annotation:
    vi: 'Đen vừa chơi 3...Nf6, tấn công tốt e4. Số tốt hai bên bằng nhau, mỗi bên tám. Tốt e4 bị mã f6 và tốt f5 tấn công mà không có gì bảo vệ, và tốt e5 của Đen bị mã f3 tấn công và cũng không có gì bảo vệ.'
    en: "Black has just played 3...Nf6, attacking the pawn on e4. The pawns are level, eight each. The pawn on e4 is attacked by the knight on f6 and the f5 pawn and nothing defends it, and Black's pawn on e5 is attacked by the knight on f3 and nothing defends it either."
    fr: 'Les Noirs viennent de jouer 3...Nf6, attaquant le pion e4. Les pions sont à égalité, huit de chaque côté. Le pion e4 est attaqué par le cavalier f6 et le pion f5 et rien ne le défend, et le pion e5 des Noirs est attaqué par le cavalier f3 et rien ne le défend non plus.'
  dismissRest:
    reason:
      vi: 'Trắng chơi nước khác 4.d3 ở đây, chẳng hạn 4.Nc3, cũng bảo vệ tốt e4. Mục này đi theo nước đẩy tốt bảo vệ e4 và mở đường cho tượng c1.'
      en: 'White plays something other than 4.d3 here, for instance 4.Nc3, which also defends the e4 pawn. This entry follows the pawn move that defends e4 and opens the diagonal for the bishop on c1.'
      fr: 'Les Blancs jouent autre chose que 4.d3 ici, par exemple 4.Nc3, qui défend aussi le pion e4. Cette entrée suit le coup de pion qui défend e4 et ouvre la diagonale du fou c1.'
  children:
