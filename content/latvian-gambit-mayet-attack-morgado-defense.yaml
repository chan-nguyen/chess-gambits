        evaluation:
          vi: 'Đếm tốt: mỗi bên tám, nghĩa là chưa có tốt nào bị mất. Các tốt e5 và f5 của Đen đều bị tấn công, bởi mã f3 và tốt e4, và không có gì bảo vệ chúng. Tốt e4 bị tấn công hai lần và được bảo vệ một lần. Nxe4 sẽ mất mã lấy một tốt, vì tốt d3 ăn lại.'
          en: "Count the pawns: eight each, so nothing has been won yet. Black's pawns on e5 and f5 are both attacked, by the knight on f3 and the pawn on e4, and nothing defends them. The pawn on e4 is attacked twice and defended once. Nxe4 would give the knight for a pawn, since the d3 pawn retakes."
          fr: "Comptez les pions : huit de chaque côté, donc rien n'a encore été gagné. Les pions e5 et f5 des Noirs sont tous deux attaqués, par le cavalier f3 et le pion e4, et rien ne les défend. Le pion e4 est attaqué deux fois et défendu une fois. Nxe4 donnerait le cavalier pour un pion, car le pion d3 reprend."
        plan:
          vi: 'Trắng nhập thành bằng O-O và phát triển bằng Nc3. Đen bảo vệ tốt e5 bằng ...Nc6 và phát triển bằng ...Bc5.'
          en: 'White castles with O-O and develops with Nc3. Black defends the e5 pawn with ...Nc6 and develops with ...Bc5.'
          fr: 'Les Blancs roquent par O-O et se développent par Nc3. Les Noirs défendent le pion e5 par ...Nc6 et se développent par ...Bc5.'
