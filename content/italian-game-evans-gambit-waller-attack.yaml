# Italian Game: Evans Gambit, Waller Attack. Defining line 1.e4 e5 2.Nf3 Nc6 3.Bc4 Bc5 4.b4
# Bxb4 5.c3 Ba5 6.d4 exd4 7.O-O d6 8.Qb3, which ends on White's own ply, so the root is an
