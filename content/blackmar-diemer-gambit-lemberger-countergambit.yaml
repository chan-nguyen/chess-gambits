# Blackmar-Diemer Gambit: Lemberger Countergambit. Frozen defining line 1.d4 d5 2.e4 dxe4
# 3.Nc3, which ends on White's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). Replayed with chess.js through 3...e5 4.dxe5: Black answers one gambit with
# another instead of holding the extra pawn, and White simply takes it. Nothing is hanging
# at the resulting position. searchMate at 4 moves from this position returns no-mate, so no
# forced mate is claimed anywhere in this entry.
id: blackmar-diemer-gambit-lemberger-countergambit
name: 'Blackmar-Diemer Gambit: Lemberger Countergambit'
eco: D00
category: gambit
side: white
definingLine: [d4, d5, e4, dxe4, Nc3]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. Black gives the pawn straight back to open the centre before White can
      build the usual attack, which is generally judged the most reliable practical answer
      to the whole gambit, though not a proven refutation. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng chơi 3.Nc3, chuẩn bị đòi lại con tốt e4 bằng f3 theo lối chính thống. Đen đáp lại không phải bằng cách giữ tốt mà bằng chính một nước phản gambit.
    en: White plays 3.Nc3, preparing to win the e4 pawn back with f3 the orthodox way. Black answers not by holding the pawn but with a countergambit of its own.
    fr: Les Blancs jouent 3.Nc3, préparant à reprendre le pion e4 par f3 de façon orthodoxe. Les Noirs répondent non pas en gardant le pion mais par un contre-gambit.
  dismissRest:
    reason:
      vi: Đen không chơi 3...e5. Giữ vững con tốt e4 bằng Nf6 hay Bf5 dẫn vào các nhánh gambit đã được chấp nhận khác, mỗi nhánh có cách chơi riêng.
      en: Black does not play 3...e5. Holding onto the e4 pawn with ...Nf6 or ...Bf5 leads into other accepted-gambit branches, each with its own way of playing.
      fr: Les Noirs ne jouent pas 3...e5. Garder le pion e4 par ...Nf6 ou ...Bf5 mène vers d'autres branches du gambit accepté, chacune avec sa propre façon de jouer.
  children:
    - ply: e5
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen mở trung tâm ngay lập tức thay vì cố giữ con tốt e4, không để Trắng có thời gian dồn quân theo đúng kế hoạch của gambit.
        en: Black opens the centre at once instead of trying to hold the e4 pawn, giving White no time to build up according to the gambit's usual plan.
        fr: Les Noirs ouvrent aussitôt le centre au lieu d'essayer de garder le pion e4, ne laissant pas aux Blancs le temps de s'organiser selon le plan habituel du gambit.
      children:
        - ply: dxe5
          annotation:
            vi: Trắng ăn con tốt e5. Đây là nước tự nhiên nhất, đưa vật chất trở lại cân bằng ngay lập tức.
            en: White takes the e5 pawn. This is the most natural move, restoring material balance at once.
            fr: Les Blancs prennent le pion e5. C'est le coup le plus naturel, rétablissant aussitôt l'équilibre matériel.
          outcome:
            type: position
            evaluation:
              vi: Đếm tốt thì bảy đều, nên cả hai nước thí đã triệt tiêu lẫn nhau về mặt vật chất. Con hậu Đen ở d8 đang bị con tốt e5 của Trắng chắn đường phát triển, và Đen sẽ cần một nhịp để đòi lại con tốt ấy hoặc đổi hậu qua Qxd1. Trắng có mã c3 đã ra ngoài và trung tâm đã thoáng hơn cho cả hai bên.
              en: Count the pawns and it is seven each, so the two sacrifices have cancelled each other out materially. Black's queen on d8 has its development blocked by White's pawn on e5, and Black will need a tempo to win that pawn back or trade queens with ...Qxd1. White has the c3 knight developed and the centre is now more open for both sides.
              fr: Comptez les pions, sept de chaque côté, les deux sacrifices s'annulent donc matériellement. Le développement de la dame noire en d8 est gêné par le pion blanc en e5, et les Noirs devront prendre un temps pour reprendre ce pion ou échanger les dames par ...Qxd1. Les Blancs ont le cavalier c3 développé et le centre est désormais plus ouvert pour les deux camps.
            plan:
              vi: Đen chơi Qxd1+ đổi hậu rồi Nc6 đòi lại tốt e5, hoặc Nc6 trực tiếp và Nxe5 sau, hoàn tất phát triển bằng Nf6, Be7 hay g6. Trắng chơi Nf3, Bf4 hoặc Bc4, giữ con tốt e5 càng lâu càng tốt và hoàn thiện phát triển trước khi Đen kịp lấy lại nó.
              en: Black plays ...Qxd1+ to trade queens and then ...Nc6 to win the e5 pawn back, or ...Nc6 directly followed by ...Nxe5, completing development with ...Nf6, ...Be7 or ...g6. White plays Nf3, Bf4 or Bc4, holding the e5 pawn for as long as possible and completing development before Black can win it back.
              fr: Les Noirs jouent ...Qxd1+ pour échanger les dames puis ...Nc6 pour reprendre le pion e5, ou ...Nc6 directement suivi de ...Nxe5, achevant leur développement par ...Nf6, ...Be7 ou ...g6. Les Blancs jouent Nf3, Bf4 ou Bc4, gardant le pion e5 aussi longtemps que possible et achevant leur développement avant que les Noirs ne le reprennent.
            basis:
              by: chan
              at: '2026-09-25'
