# Bishop's Opening: Khan Gambit. Frozen defining line 1.e4 e5 2.Bc4 d5, which ends on
# Black's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). The line
# below was replayed with chess.js before being annotated, including the dismissed
# 3...Qxd5?? line. searchMate from the leaf FEN, bounded to 2 moves, returns no-mate.
id: bishops-opening-khan-gambit
name: "Bishop's Opening: Khan Gambit"
eco: C23
category: gambit
side: black
definingLine: [e4, e5, Bc4, d5]
soundness:
  value: unsound
  reviewedAt: '2026-09-21'
  basis:
    by: chan
    at: '2026-09-21'
    source: >-
      A judgement. Black strikes back in the centre at once with 2...d5!?, but White simply
      takes the pawn, and Black has no safe way to recapture it immediately — the natural
      recapture with the queen walks into a bishop fork. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-09-21'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Thay vì các nước phát triển thông thường, Đen chơi thẳng 2...d5!?, phản công vào trung tâm ngay lập tức và mời Trắng ăn tốt để đổi lấy nhịp tấn công tượng c4.
    en: Instead of a normal developing move, Black strikes back in the centre at once with 2...d5!?, inviting White to take the pawn in exchange for a tempo attacking the bishop on c4.
    fr: Au lieu d'un coup de développement normal, les Noirs contre-attaquent immédiatement au centre par 2...d5!?, invitant les Blancs à prendre le pion en échange d'un temps sur le fou en c4.
  dismissRest:
    reason:
      vi: Trắng không ăn con tốt d5. Các nước khác như Bxd5?? cũng ăn được tốt nhưng đưa tượng vào ô có thể bị tấn công, còn Bb3 hay Nf3 để nguyên con tốt ấy trên bàn cờ.
      en: White does not take the d5 pawn with the e-pawn. Bxd5 also wins the pawn but puts the bishop on a square that can be hit, while Bb3 or Nf3 leave the pawn on the board entirely.
      fr: Les Blancs ne prennent pas le pion d5 avec le pion e. Bxd5 gagne aussi le pion mais place le fou sur une case qui peut être attaquée, tandis que Bb3 ou Nf3 laissent ce pion entièrement sur l'échiquier.
  dismissed:
    - ply: Bxd5
      reason: Also wins the pawn, but centralises the bishop on d5 where ...c6 or ...Nf6 gains a tempo on it; exd5 wins the same pawn without inviting that, so this is not modelled separately.
  children:
    - ply: exd5
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng ăn con tốt d5 bằng tốt e4, giữ con tượng c4 ở lại đường chéo tốt của nó thay vì đưa nó ra ô có thể bị đuổi bằng ...c6 sau này.
        en: White takes the d5 pawn with the e4 pawn, keeping the bishop on c4 on its good diagonal instead of putting it on a square that can be chased away later with ...c6.
        fr: Les Blancs prennent le pion d5 avec le pion e4, gardant le fou en c4 sur sa bonne diagonale au lieu de le placer sur une case qui pourrait être chassée plus tard par ...c6.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy. Trắng hơn đúng một tốt sạch, và Đen không có cách ăn lại an toàn ngay lập tức — hậu ăn lại thì mất luôn vì con tượng c4, còn các quân khác chưa vươn tới d5 được.
          en: Count the pawns and it is eight for White, seven for Black. White is a clean pawn up, and Black has no safe way to recapture it immediately — the queen recapture simply loses to the bishop on c4, and nothing else reaches d5 yet.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs. Les Blancs ont un pion de plus, et les Noirs n'ont aucun moyen sûr de le reprendre immédiatement — la reprise à la dame perd tout simplement à cause du fou en c4, et rien d'autre n'atteint encore d5.
        plan:
          vi: Trắng chơi Nf3, O-O và Re1, phát triển bình thường và giữ vững tốt thừa trong khi hoàn tất phát triển an toàn. Đen chơi Nf6 rồi Bd6 hay Be7 và O-O, cố hoàn tất phát triển nhanh để bù cho tốt đã mất.
          en: White plays Nf3, O-O and Re1, developing normally and holding the extra pawn while completing development safely. Black plays Nf6 then Bd6 or Be7 and O-O, trying to develop quickly to compensate for the lost pawn.
          fr: Les Blancs jouent Nf3, O-O et Re1, se développant normalement et gardant le pion supplémentaire tout en achevant leur développement en toute sécurité. Les Noirs jouent Nf6 puis Bd6 ou Be7 et O-O, essayant de se développer rapidement pour compenser le pion perdu.
        basis:
          by: chan
          at: '2026-09-21'
