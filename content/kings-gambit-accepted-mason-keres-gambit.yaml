# King's Gambit Accepted, Mason-Keres Gambit: 1.e4 e5 2.f4 exf4 3.Nc3. Every ply below was
# replayed with chess.js before being written (see docs/CONTEXT.md, invariant 1). The leaf
# is a decisive stop under the #107 bar: a clean extra pawn plus a king permanently stuck
# on e2 with no shield and no route to castling.
id: kings-gambit-accepted-mason-keres-gambit
name: Mason-Keres Gambit
eco: C33
category: gambit
side: white
definingLine: [e4, e5, f4, exf4, Nc3]
soundness:
  value: dubious
  reviewedAt: '2026-09-18'
  basis:
    by: chan
    at: '2026-09-18'
    source: >-
      A judgement. 3.Nc3 develops a piece, which is more than several sister lines in this
      family manage, but it does nothing about 3...Qh4+, and neither reply to that check
      keeps both the material and the king's safety intact. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng chơi 3.Nc3, phát triển mã ra một ô hợp lý thay vì lãng phí tốt hay quân như những nhánh khác trong họ này. Nhưng nước đi này không ngăn được nước chiếu quen thuộc của Đen, và Trắng sẽ phải trả giá theo cách khác.
    en: White plays 3.Nc3, developing a knight to a reasonable square rather than wasting a tempo the way several sister lines in this family do. But it does nothing to stop Black's familiar check, and White pays for it in a different currency.
    fr: Les Blancs jouent 3.Nc3, développant un cavalier vers une case raisonnable plutôt que de perdre un temps comme le font plusieurs variantes sœurs de cette famille. Mais cela n'empêche en rien l'échec familier des Noirs, et les Blancs en paient le prix sous une autre forme.
  dismissRest:
    reason:
      vi: Đen chơi một nước phát triển khác thay vì chiếu ngay. Bất kỳ nước nào cũng giữ nguyên một tốt hơn cho Đen, nhưng 3...Qh4+ là cách trực tiếp nhất buộc vua Trắng phải rời vị trí ban đầu.
      en: Black plays some other developing move instead of checking at once. Any of them keeps Black's extra pawn intact, but 3...Qh4+ is the most direct way to force White's king from its starting square.
      fr: Les Noirs jouent un autre coup de développement au lieu de mettre en échec immédiatement. Chacun d'eux conserve le pion supplémentaire des Noirs, mais 3...Qh4+ est le moyen le plus direct de forcer le roi blanc à quitter sa case de départ.
  children:
    - ply: Qh4+
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen chiếu ngay bằng Qh4+. Không còn hậu ở d1 để chặn, Trắng chỉ có hai lựa chọn — 4.g3 mất thêm một tốt nữa sau fxg3, còn 4.Ke2 mất quyền nhập thành ngay lập tức. Ke2 là lựa chọn thực dụng hơn vì không mất thêm quân.
        en: Black checks at once with Qh4+. With no queen left on d1 to block, White has only two replies — 4.g3 drops a further pawn to fxg3, while 4.Ke2 forfeits castling immediately. Ke2 is the more practical choice since it does not lose extra material.
        fr: Les Noirs mettent en échec immédiatement par Qh4+. La dame n'étant plus en d1 pour bloquer, les Blancs n'ont que deux réponses — 4.g3 cède un pion supplémentaire après fxg3, tandis que 4.Ke2 sacrifie immédiatement le roque. Ke2 est le choix le plus pragmatique car il ne perd pas de matériel supplémentaire.
      children:
        - ply: Ke2
          annotation:
            vi: Trắng buộc phải đi Ke2, tránh mất thêm tốt nhưng từ bỏ quyền nhập thành vĩnh viễn. Ô f2 ngay bên cạnh vua hoàn toàn trống — Trắng đã mất tốt f ngay từ nước 2...exf4 — nên vua không còn một lá chắn tốt nào ở đó.
            en: White is forced into Ke2, avoiding a further pawn loss but giving up castling for good. The f2 square right beside the king is completely empty — White gave up its f-pawn all the way back at 2...exf4 — so there is no pawn shield left there at all.
            fr: Les Blancs sont contraints de jouer Ke2, évitant une perte de pion supplémentaire mais abandonnant le roque pour de bon. La case f2, juste à côté du roi, est totalement vide — les Blancs ont cédé leur pion f dès 2...exf4 — si bien qu'il n'y a plus aucun bouclier de pions à cet endroit.
          dismissRest:
            reason:
              vi: Đen chơi một nước khác thay vì giữ lại con tốt f4 bằng g5. Bất kỳ lựa chọn nào cũng để lại vị trí tương tự có lợi cho Đen, nhưng 4...g5 là cách đơn giản nhất để khóa chặt cả hai lợi thế mà không mở thêm đường cho quân Trắng.
              en: Black plays something other than locking in the f4 pawn with g5. Any choice leaves a broadly similar position in Black's favour, but 4...g5 is the simplest way to lock in both advantages without opening any more lines for White's pieces.
              fr: Les Noirs jouent autre chose que de verrouiller le pion f4 par g5. Tout autre choix laisse une position globalement semblable en faveur des Noirs, mais 4...g5 est le moyen le plus simple de verrouiller les deux avantages sans ouvrir davantage de lignes pour les pièces blanches.
          children:
            - ply: g5
              replyQuality: best
              frequency: common
              annotation:
                vi: Đen củng cố con tốt f4 bằng g5, khóa chặt cấu trúc tốt cánh vua. Thế cờ giờ đã ổn định hoàn toàn có lợi cho Đen.
                en: Black shores up the f4 pawn with g5, locking the kingside pawn structure. The position is now fully settled in Black's favour.
                fr: Les Noirs consolident le pion f4 par g5, verrouillant la structure de pions à l'aile roi. La position est désormais pleinement stabilisée en faveur des Noirs.
              outcome:
                type: position
                evaluation:
                  vi: Đen hơn đúng một tốt (f4, được g5 bảo vệ vĩnh viễn) mà không có bù đắp nào cho Trắng. Vua Trắng đứng tại e2 — mất quyền nhập thành vĩnh viễn — với ô f2 bên cạnh hoàn toàn trống, không một tốt nào che chắn, và vẫn có thể bị quấy rối thêm bằng ...f3+ trong tương lai.
                  en: Black is a clean pawn up (the f4 pawn, permanently guarded by g5) with no compensation for White at all. White's king stands on e2 — castling gone for good — with the f2 square beside it completely bare of any pawn, and still open to further harassment such as a future ...f3+.
                  fr: Les Noirs ont un pion d'avance net (le pion f4, défendu à jamais par g5) sans la moindre compensation pour les Blancs. Le roi blanc se tient en e2 — le roque perdu pour de bon — avec la case f2 juste à côté totalement vide de tout pion, et toujours exposé à un futur harcèlement par ...f3+.
                plan:
                  vi: Đen phát triển bình thường với Nc6, Nf6, Bc5 hoặc Bg7 sau khi chơi thêm d6, giữ khả năng đẩy f4-f3+ làm quân bài dự trữ, và không có gì phải vội vì lợi thế đã vững chắc và lâu dài.
                  en: Black develops normally with Nc6, Nf6, and Bc5 or a Bg7 fianchetto after a further d6, keeping the f4-f3+ push in reserve as a resource, with nothing to rush since the advantage is solid and lasting.
                  fr: Les Noirs se développent normalement par Nc6, Nf6, et Bc5 ou un fianchetto Bg7 après un futur d6, en gardant la poussée f4-f3+ comme ressource en réserve, sans rien à précipiter puisque l'avantage est solide et durable.
                basis:
                  by: chan
                  at: '2026-09-18'
