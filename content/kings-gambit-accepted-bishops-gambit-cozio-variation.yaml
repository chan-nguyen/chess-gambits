# King's Gambit Accepted, Bishop's Gambit, Cozio Variation. One of a batch of entries
# authored for issue #148 (batch h), sharing the trunk `1.e4 e5 2.f4 exf4 3.Bc4` with
# `kings-gambit-accepted-bishops-gambit.yaml` and its existing siblings — including
# `kings-gambit-accepted-bishops-gambit-cozio-defense` (3...Nf6), a different named line
# despite the shared surname. Defining line ends on White's 3.Bc4 (invariant 5). Every ply
# below was replayed with chess.js before being written.
id: kings-gambit-accepted-bishops-gambit-cozio-variation
name: "King's Gambit Accepted: Bishop's Gambit, Cozio Variation"
eco: C33
category: gambit
side: white
definingLine: [e4, e5, f4, exf4, Bc4]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      The same judgement the family head `kings-gambit-accepted-bishops-gambit.yaml` carries.
      No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa đưa tượng ra c4, Gambit Tượng. Mục này đi sâu riêng vào 3...Qh4+, buộc vua Trắng phải nhúc nhích ngay.
    en: White has just played the bishop to c4, the Bishop's Gambit. This entry follows specifically 3...Qh4+, forcing the White king to move at once.
    fr: Les Blancs viennent de jouer le fou en c4, le Gambit du Fou. Cette entrée suit spécifiquement 3...Dh4+, forçant aussitôt le roi blanc à bouger.
  dismissRest:
    reason:
      vi: Đen đáp lại 3.Bc4 bằng một nước khác ngoài 3...Qh4+ — giữ tốt bằng 3...g5, đánh trung tâm bằng 3...d5, hay phát triển bằng 3...Nf6. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 3.Bc4 with something other than 3...Qh4+ — holding the pawn with 3...g5, striking the centre with 3...d5, or developing with 3...Nf6. Each is outside the scope of this entry.
      fr: Les Noirs répondent à 3.Bc4 par autre chose que 3...Dh4+ — conserver le pion par 3...g5, une frappe centrale par 3...d5, ou un développement par 3...Nf6. Chacun sort du cadre de cette entrée.
  children:
    - ply: 'Qh4+'
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen chiếu ngay bằng hậu, quân duy nhất có thể chiếu ở đây, buộc Trắng phải trả lời trước khi làm gì khác.
        en: Black checks at once with the queen, the only piece that can check here, forcing White to answer before doing anything else.
        fr: Les Noirs donnent échec aussitôt avec la dame, la seule pièce pouvant le faire ici, forçant les Blancs à répondre avant toute autre chose.
      children:
        - ply: Kf1
          annotation:
            vi: Trắng chỉ có một cách hợp lệ để đáp lại chiếu này, vì không quân nào có thể chặn hay ăn con hậu ở h4. Vua mất quyền nhập thành ngay từ đầu.
            en: White has exactly one legal way to answer this check, since nothing can block or capture the queen on h4. The king loses castling rights right at the start.
            fr: Les Blancs n'ont qu'une seule façon légale de répondre à cet échec, car rien ne peut bloquer ou prendre la dame en h4. Le roi perd le droit de roquer dès le début.
          dismissRest:
            reason:
              vi: Đen đáp lại Kf1 bằng một nước khác ngoài 4...d6 — giữ tốt bằng 4...g5, phát triển bằng 4...Nf6 hay 4...Nc6, hay lui hậu về c5. Mỗi lựa chọn nằm ngoài phạm vi mục này.
              en: Black meets Kf1 with something other than 4...d6 — holding the pawn with 4...g5, developing with 4...Nf6 or 4...Nc6, or dropping the queen back to c5. Each is outside the scope of this entry.
              fr: Les Noirs répondent à Kf1 par autre chose que 4...d6 — conserver le pion par 4...g5, un développement par 4...Cf6 ou 4...Cc6, ou replier la dame en c5. Chacun sort du cadre de cette entrée.
          children:
            - ply: d6
              replyQuality: good
              frequency: occasional
              annotation:
                vi: Biến Cozio. Đen chơi thận trọng, mở đường cho tượng c8 và không vội đưa con hậu đi xa hơn nữa hay đẩy tốt g lên.
                en: The Cozio Variation. Black plays it safe, opens a diagonal for the c8 bishop, and is in no hurry to push the queen any further or advance the g-pawn.
                fr: La Variante Cozio. Les Noirs jouent prudemment, ouvrent une diagonale pour le fou c8 et ne sont pas pressés d'avancer davantage la dame ou le pion g.
              outcome:
                type: position
                evaluation:
                  vi: Đen vẫn hơn đúng con tốt f4 ban đầu. Vua Trắng đã mất quyền nhập thành và còn phải tự đi bộ về nơi an toàn, trong khi con hậu Đen ở h4 vẫn đứng khá tự do vì chưa quân nào của Trắng nhòm tới được nó.
                  en: Black is still exactly one pawn up, the original f4 pawn. White's king has lost castling rights and still has to walk to safety by hand, while Black's queen on h4 stands fairly free since nothing White has can trouble it yet.
                  fr: Les Noirs restent exactement un pion devant, le pion f4 initial. Le roi blanc a perdu le droit de roquer et doit encore marcher à pied vers un abri, tandis que la dame noire en h4 reste assez libre puisque rien chez les Blancs ne peut encore l'inquiéter.
                plan:
                  vi: Trắng chơi Nf3 đuổi hậu, rồi g3 nếu cần, và tìm cách đưa vua về g2 hay g1 để nối lại các xe. Đen lui hậu về e7 hay h5 khi bị đuổi, chơi Nf6 và Be7 hay Bg4, giữ con tốt f4 làm vốn liếng lâu dài.
                  en: White plays Nf3 to chase the queen, then g3 if needed, and looks for a way to tuck the king onto g2 or g1 to reconnect the rooks. Black drops the queen back to e7 or h5 when chased, plays Nf6 and Be7 or Bg4, banking the f4 pawn as a long-term asset.
                  fr: Les Blancs jouent Nf3 pour chasser la dame, puis g3 si besoin, et cherchent à ranger le roi en g2 ou g1 pour relier les tours. Les Noirs replient la dame en e7 ou h5 quand elle est chassée, jouent Nf6 et Be7 ou Bg4, conservant le pion f4 comme atout durable.
                basis:
                  by: chan
                  at: '2026-09-25'
