tree:
  annotation:
    vi: Trắng vừa chơi 5.Bc4 sau khi Đen ăn tốt thứ hai bằng 4...dxc3. Đen hơn hai tốt, tám đối sáu, và tốt c3 bị tốt b2 cùng mã b1 tấn công mà không quân nào bảo vệ. Tượng c4 tấn công f7, chỉ có vua bảo vệ.
    en: White has just played 5.Bc4 after Black took the second pawn with 4...dxc3. Black is two pawns up, eight to six, and the pawn on c3 is attacked by the b2 pawn and the knight on b1 and defended by nothing. The bishop on c4 attacks f7, which only the king defends.
    fr: Les Blancs viennent de jouer 5.Bc4 après que les Noirs ont pris le second pion par 4...dxc3. Les Noirs ont deux pions de plus, huit contre six, et le pion c3 est attaqué par le pion b2 et le cavalier b1 sans être défendu. Le fou c4 attaque f7, que seul le roi défend.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 5...d6. Bài này chỉ đi theo nhánh 5...d6; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 5...d6 here. This entry follows the reply 5...d6 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 5...d6. Cette fiche ne suit que la réponse 5...d6 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: d6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen chơi 5...d6, dùng tốt bảo vệ tượng c5 và mở đường chéo cho tượng c8. Tốt c3 vẫn bị tấn công hai lần nên Trắng có thể ăn lại ngay.
        en: Black plays 5...d6, which defends the bishop on c5 with a pawn and opens the diagonal of the bishop on c8. The pawn on c3 is still attacked twice, so White can recapture at once.
        fr: 'Les Noirs jouent 5...d6, qui défend le fou c5 par un pion et ouvre la diagonale du fou c8. Le pion c3 reste attaqué deux fois : les Blancs peuvent reprendre aussitôt.'
      children:
        - ply: Nxc3
          annotation:
            vi: Trắng ăn lại bằng mã từ b1, 6.Nxc3, đưa mã vào cuộc và để tốt b ở nhà.
            en: White recaptures with the knight from b1, 6.Nxc3, bringing it into play and leaving the b-pawn at home.
            fr: Les Blancs reprennent avec le cavalier de b1, 6.Nxc3, le mettant en jeu et laissant le pion b à sa place.
          outcome:
            type: position
            evaluation:
              vi: 'Đếm tốt: Trắng sáu, Đen bảy, nên Trắng kém một tốt sau khi hiến tốt d và tốt c và chỉ lấy lại một. Trắng đã phát triển ba quân (tượng c4, mã c3 và mã f3) còn Đen mới có tượng c5; chưa bên nào nhập thành. Tượng c4 tấn công f7 và tượng c5 tấn công f2, và mỗi tốt đó chỉ có vua bảo vệ.'
              en: "Count the pawns: White six, Black seven, so White is a pawn down after giving up the d-pawn and the c-pawn and taking back only one. White has three pieces developed (the bishop on c4 and the knights on c3 and f3) against Black's single bishop on c5; neither king has castled. The bishop on c4 attacks f7 and the bishop on c5 attacks f2, and each of those pawns is defended only by its king."
              fr: "Comptez les pions : six pour les Blancs, sept pour les Noirs ; les Blancs sont donc un pion en moins après avoir cédé le pion d et le pion c et n'en avoir repris qu'un. Les Blancs ont trois pièces développées (le fou c4 et les cavaliers c3 et f3) contre le seul fou c5 des Noirs ; aucun roi n'a roqué. Le fou c4 attaque f7 et le fou c5 attaque f2, et chacun de ces pions n'est défendu que par son roi."
            plan:
              vi: Trắng nhập thành và phát triển bằng Bg5, dùng lợi thế phát triển; Đen hoàn tất phát triển bằng ...Nf6 và ...Nc6 và giữ tốt thừa.
              en: White castles and develops with Bg5, using the lead in development; Black completes development with ...Nf6 and ...Nc6 and keeps the extra pawn.
              fr: Les Blancs roquent et se développent par Bg5, en exploitant leur avance de développement ; les Noirs achèvent leur développement par ...Nf6 et ...Nc6 et gardent le pion en plus.
            basis:
              by: chan
              at: '2026-09-30'
