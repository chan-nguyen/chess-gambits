tree:
  annotation:
    vi: 'Trắng vừa chơi 12.Nd2, phát triển mã và che tốt e4. Trắng có tám tốt, Đen bốn tốt, nhưng Đen hơn một quân: hai tượng và một mã so với một tượng và một mã của Trắng. Tốt g2 bị hậu g5 tấn công mà không có quân nào bảo vệ, và vua Đen trên f7 đã mất quyền nhập thành. Mục này đi theo nước ăn tốt 12...Qxg2.'
    en: "White has just played 12.Nd2, developing the knight and covering the e4 pawn. White has eight pawns to Black's four, but Black has an extra piece: two bishops and a knight to White's bishop and knight. The g2 pawn is attacked by the queen on g5 and nothing defends it, and Black's king on f7 has lost the right to castle. This entry follows the capture 12...Qxg2."
    fr: 'Les Blancs viennent de jouer 12.Nd2, développant le cavalier et couvrant le pion e4. Les Blancs ont huit pions contre quatre aux Noirs, mais les Noirs ont une pièce de plus : deux fous et un cavalier contre un fou et un cavalier. Le pion g2 est attaqué par la dame g5 et rien ne le défend, et le roi noir en f7 a perdu le droit de roquer. Cette entrée suit la prise 12...Qxg2.'
  dismissRest:
    reason:
      vi: Đen chơi một nước khác thay vì 12...Qxg2 ở đây, chẳng hạn 12...Qg6, vẫn giữ tốt g2 trong tầm tấn công từ g6. Mục này chỉ mô hình hóa nước ăn tốt trên g2.
      en: Black plays something other than 12...Qxg2 here, for instance 12...Qg6, which keeps the g2 pawn attacked from g6. This entry models only the capture on g2.
      fr: Les Noirs jouent autre chose que 12...Qxg2 ici, par exemple 12...Qg6, qui garde le pion g2 sous attaque depuis g6. Cette entrée ne modélise que la prise en g2.
  children:
    - ply: Qxg2
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen ăn tốt g2 bằng hậu, hậu giờ tấn công xe h1, quân không được bảo vệ, cùng các tốt e4, f2 và h2, những tốt đều được bảo vệ.
        en: Black takes the g2 pawn with the queen, which now attacks the rook on h1, undefended, as well as the e4, f2 and h2 pawns, all of which are defended.
        fr: Les Noirs prennent le pion g2 avec la dame, qui attaque maintenant la tour h1, sans défense, ainsi que les pions e4, f2 et h2, tous défendus.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen bốn — Trắng hơn ba tốt, Đen hơn một tượng: hai tượng và một mã so với một tượng và một mã của Trắng. Xe h1 bị hậu tấn công mà không được bảo vệ, nên Trắng phải đi xe hoặc che nó ngay, còn vua Đen trên f7 không thể nhập thành. Cột g mở thuộc về Đen, với hậu g2 và xe g8 đứng trên đó.'
          en: "Count the pawns: White seven, Black four — White has three more pawns, Black has a bishop more: two bishops and a knight to White's bishop and knight. The rook on h1 is attacked by the queen and nothing defends it, so White has to move or cover it at once, and Black's king on f7 cannot castle. The open g-file is Black's, with the queen on g2 and the rook on g8 on it."
          fr: 'Comptez les pions : sept pour les Blancs, quatre pour les Noirs — les Blancs ont trois pions de plus, les Noirs un fou de plus : deux fous et un cavalier contre un fou et un cavalier. La tour h1 est attaquée par la dame et rien ne la défend, donc les Blancs doivent la déplacer ou la couvrir tout de suite, et le roi noir en f7 ne peut pas roquer. La colonne g ouverte appartient aux Noirs, avec la dame g2 et la tour g8 dessus.'
        plan:
          vi: Trắng phải đối phó với mối đe dọa trên h1 ngay, và còn có các nước chiếu Qh5+ và Qf3+ nhắm vào một vua không thể nhập thành. Đen phát triển tượng c8 bằng ...Bg4 hoặc ...Be6 và giữ sức ép trên cột g.
          en: White has to meet the threat on h1 at once, and has the checks Qh5+ and Qf3+ in hand against a king that can no longer castle. Black develops the c8 bishop with ...Bg4 or ...Be6 and keeps the pressure on the g-file.
          fr: Les Blancs doivent parer tout de suite la menace sur h1, et ont en réserve les échecs Qh5+ et Qf3+ contre un roi qui ne peut plus roquer. Les Noirs développent le fou c8 par ...Bg4 ou ...Be6 et gardent la pression sur la colonne g.
        basis:
          by: chan
          at: 2026-09-30
