# Scandinavian Defense: Portuguese Gambit, Lusophobe Variation. Defining line 1.e4 d5 2.exd5
# Nf6 3.d4 Bg4 4.Bb5+ Nbd7, which ends on Black's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). The frozen catalogue line runs one ply further (Be2); it
# is modelled below as a reply so the learner's ply ends the defining line, as the catalogue
# build allows.
# Part of batch s of round 4 (#182). Every ply below was replayed with chess.js before it
# was annotated; searchMate at 3 moves from the leaf returns no-mate, so no forced mate is
# claimed anywhere in this entry. The leaf leaves a capture going free, which its
# `unsettled` note acknowledges.
id: scandinavian-defense-portuguese-gambit-lusophobe-variation
name: 'Scandinavian Defense: Portuguese Gambit, Lusophobe Variation'
eco: B01
category: gambit
side: black
definingLine: [e4, d5, exd5, Nf6, d4, Bg4, Bb5+, Nbd7]
soundness:
  value: dubious
  reviewedAt: '2026-10-01'
  basis:
    by: chan
    at: '2026-10-01'
    source: >-
      A judgement, deepened from the frozen listed-tier classification in
      tools/catalogue/source/classification.yaml. At the end of the defining line White is a
      pawn up, eight pawns against seven, but the pawn on d5 is attacked by the knight on f6
      and defended by nothing, and the bishop on g4 attacks the queen on d1, which only the
      king defends. The rating of dubious is the catalogue's; the board at this point shows
      a loose extra pawn rather than a clear advantage for White. No engine was consulted
      and no database was queried.
judgement:
  by: chan
  at: '2026-10-01'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen vừa chơi 4...Nbd7 để chặn nước chiếu, nên số tốt là Trắng tám, Đen bảy. Tượng b5 tấn công mã d7, quân được bốn quân Đen bảo vệ, tượng g4 tấn công hậu d1, quân chỉ có vua bảo vệ, còn tốt d5 bị mã f6 tấn công và không được quân nào bảo vệ.
    en: Black has just played 4...Nbd7, blocking the check, so the pawn count is White eight, Black seven. The bishop on b5 attacks the knight on d7, which four Black pieces defend, the bishop on g4 attacks the queen on d1, which only the king defends, and the pawn on d5 is attacked by the knight on f6 and defended by nothing.
    fr: Les Noirs viennent de jouer 4...Nbd7 pour parer l'échec, de sorte que le compte des pions est de huit pour les Blancs, sept pour les Noirs. Le fou b5 attaque le cavalier d7, que quatre pièces noires défendent, le fou g4 attaque la dame d1, que seul le roi défend, et le pion d5 est attaqué par le cavalier f6 et n'est défendu par aucune pièce.
  dismissRest:
    reason:
      vi: 'Trắng chơi nước khác thay vì 5.Be2 ở đây, chẳng hạn 5.f3 hoặc 5.Nf3. Mục này chỉ mô hình hóa 5.Be2 và không phân tích các nước kia; nhiệm vụ của Đen thường vẫn như cũ: lấy lại tốt d5.'
      en: "White plays something other than 5.Be2 here, for instance 5.f3 or 5.Nf3. This entry models only 5.Be2 and does not analyse those moves; Black's task usually stays the same: win the d5 pawn back."
      fr: "Les Blancs jouent autre chose que 5.Be2 ici, par exemple 5.f3 ou 5.Nf3. Cette entrée ne modélise que 5.Be2 et n'analyse pas ces coups ; la tâche des Noirs reste en général la même : regagner le pion d5."
  children:
    - ply: Be2
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng lùi tượng 5.Be2, chắn đường chéo từ tượng g4 tới hậu và tấn công tượng g4. Tượng e2 được hậu, vua và mã g1 bảo vệ, còn tượng g4 được mã f6 bảo vệ.
        en: White retreats the bishop with 5.Be2, which blocks the line from the bishop on g4 to the queen and attacks the bishop on g4. The bishop on e2 is defended by the queen, the king and the knight on g1, and the bishop on g4 is defended by the knight on f6.
        fr: Les Blancs replient le fou par 5.Be2, ce qui bloque la ligne entre le fou g4 et la dame et attaque le fou g4. Le fou e2 est défendu par la dame, le roi et le cavalier g1, et le fou g4 est défendu par le cavalier f6.
      unsettled: "Nxd5 is going free because nothing of White's guards d5, but the capture is not a clean win: the knight on f6 is the only defender of the bishop on g4, so ...Nxd5 would lose that bishop to Bxg4. The evaluation therefore reads the position as it stands, with the pawn on d5 still White's."
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng tám, Đen bảy, nên Trắng hơn một tốt. Tốt d5 bị mã f6 tấn công và không được quân nào bảo vệ, nhưng mã đó cũng là quân duy nhất bảo vệ tượng g4, quân bị tượng e2 tấn công, nên ...Nxd5 sẽ mất tượng và Đen phải đổi quân trước, bằng ...Bxe2, rồi mới ăn ở d5.'
          en: 'Count the pawns: White eight, Black seven, so White is a pawn up. The pawn on d5 is attacked by the knight on f6 and defended by nothing, but that knight is also the only defender of the bishop on g4, which the bishop on e2 attacks, so ...Nxd5 would lose the bishop and Black has to trade first, with ...Bxe2, before taking on d5.'
          fr: "Comptez les pions : huit pour les Blancs, sept pour les Noirs, donc les Blancs ont un pion de plus. Le pion d5 est attaqué par le cavalier f6 et n'est défendu par aucune pièce, mais ce cavalier est aussi le seul défenseur du fou g4, que le fou e2 attaque, de sorte que ...Nxd5 perdrait le fou et que les Noirs doivent d'abord échanger, par ...Bxe2, avant de prendre en d5."
        plan:
          vi: Trắng ăn lại ở e2, rồi chơi c4 để tấn công quân nào vừa đáp xuống d5 và Nf3 để phát triển. Đen chơi ...Bxe2 và ...Nxd5 để lấy lại con tốt.
          en: White recaptures on e2, then plays c4 to attack whatever has landed on d5 and Nf3 to develop. Black plays ...Bxe2 and ...Nxd5 to regain the pawn.
          fr: Les Blancs reprennent en e2, puis jouent c4 pour attaquer ce qui est arrivé en d5 et Nf3 pour se développer. Les Noirs jouent ...Bxe2 et ...Nxd5 pour regagner le pion.
        basis:
          by: chan
          at: 2026-10-01
