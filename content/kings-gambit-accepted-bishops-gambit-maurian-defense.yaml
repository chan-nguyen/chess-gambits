    vi: Trắng vừa đưa tượng ra c4, Gambit Tượng. Mục này đi sâu riêng vào 3...Nc6, Phòng thủ Maurian.
    en: White has just played the bishop to c4, the Bishop's Gambit. This entry follows specifically 3...Nc6, the Maurian Defense.
    fr: Les Blancs viennent de jouer le fou en c4, le Gambit du Fou. Cette entrée suit spécifiquement 3...Nc6, la Défense Maurian.
