    at: '2026-10-01'
    source: >-
      A judgement. At the end of the defining line White is a pawn down, seven pawns to eight,
      and the g4 pawn is attacked by the bishop on c8 and has no defender, so Black can take
      it for free; White has not been shown to get more in return than the half-open d-file
      and the bishop on g2 pressing on the d5 pawn. No engine was consulted and no database
      was queried.
judgement:
