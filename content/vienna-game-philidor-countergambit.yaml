    source: >-
      A judgement. Black meets White's central push with a kingside strike of their own,
      but the e5 pawn is simply undefended after 3...f5, and White is not obliged to
      exchange first. A pawn for some quick activity is a real try, not a sound equalizer.
      No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-22'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
