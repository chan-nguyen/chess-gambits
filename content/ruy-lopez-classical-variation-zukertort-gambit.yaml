# Ruy Lopez: Classical Variation, Zukertort Gambit. Frozen defining line 1.e4 e5 2.Nf3 Nc6
# 3.Bb5 Nf6 4.O-O Bc5 5.c3, which ends on White's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 5...Nxe4. searchMate at 3 moves
# from the resulting position returns no-mate, so no forced mate is claimed anywhere in this entry,
# and no capture is left going free at the leaf.
