# Sicilian Defense: Lasker-Pelikan Variation, Sveshnikov Variation, Peresypkin's Sacrifice. Frozen
# defining line 1.e4 c5 2.Nf3 Nc6 3.d4 cxd4 4.Nxd4 Nf6 5.Nc3 e5 6.Ndb5 d6 7.Bg5 a6 8.Na3 b5 9.Bxf6 gxf6
# 10.Nd5 f5 11.Bxb5, which ends on White's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). Replayed with chess.js through 11...axb5 12.Nxb5 Bd7 13.Nbc7+ Qxc7 14.Nxc7+ Kd8 15.Nxa8
# fxe4. This entry models one Black reply, 12...Bd7, which allows a knight fork; every move of the fork
# was replayed and each of Black's answers to the two checks is the only legal move or one of two
# legal moves, both covered. searchMate at 3 moves from the resulting position returns no-mate, so no
# forced mate is claimed anywhere in this entry, and no capture is left going free at the leaf.
