# King's Gambit Accepted, Bishop's Gambit, Cozio Defense. One of eighteen entries tracked by
# issue #111 (group H), sharing the trunk `1.e4 e5 2.f4 exf4 3.Bc4` with
# `kings-gambit-accepted.yaml` and group G (#110). Defining line ends on White's 3.Bc4
# (invariant 5). Every move replayed with a scratch chess.js script (deleted before commit).
#
# 3...Nf6 develops a piece and attacks e4 directly. Under the stricter #107 bar a `position`
# leaf must be clearly decisive; this is a sound developing try and no forced decisive
# continuation could be established by hand without an engine, so the line stops at
# `unexplored` rather than asserting a verdict that is not actually there.
