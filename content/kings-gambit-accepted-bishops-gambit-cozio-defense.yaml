# King's Gambit Accepted, Bishop's Gambit, Cozio Defense. One of eighteen entries tracked by
# issue #111 (group H), sharing the trunk `1.e4 e5 2.f4 exf4 3.Bc4` with
# `kings-gambit-accepted.yaml` and group G (#110). Defining line ends on White's 3.Bc4
# (invariant 5). Every move replayed with a scratch chess.js script (deleted before commit).
#
# 3...Nf6 develops a piece and attacks e4 directly. The tried continuation named in the
# evaluation, 4.e5 Ng4, was replayed with a scratch chess.js script (deleted before commit)
# confirming legality and material at each ply. Under the stricter #107 bar this is a sound
# developing try that genuinely does not resolve to a decisive edge for either side at this
# depth, so the leaf states that plainly instead of forcing a verdict or reverting to
# `unexplored`.
