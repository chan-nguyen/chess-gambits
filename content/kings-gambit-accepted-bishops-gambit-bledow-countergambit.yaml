tree:
  annotation:
    vi: Trắng vừa đưa tượng ra c4, Gambit Tượng. Mục này đi sâu riêng vào 3...d5, đánh thẳng vào con tượng vừa ra.
    en: White has just played the bishop to c4, the Bishop's Gambit. This entry follows specifically 3...d5, striking straight at the newly placed bishop.
    fr: Les Blancs viennent de jouer le fou en c4, le Gambit du Fou. Cette entrée suit spécifiquement 3...d5, qui frappe directement le fou qui vient de se poser.
  dismissRest:
    reason:
      vi: Đen đáp lại 3.Bc4 bằng một nước khác ngoài 3...d5 — giữ tốt bằng 3...g5, phát triển bằng 3...Nf6, hay chiếu bằng 3...Qh4+. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 3.Bc4 with something other than 3...d5 — holding the pawn with 3...g5, developing with 3...Nf6, or checking with 3...Qh4+. Each is outside the scope of this entry.
      fr: Les Noirs répondent à 3.Bc4 par autre chose que 3...d5 — conserver le pion par 3...g5, un développement par 3...Nf6, ou un échec par 3...Qh4+. Chacun sort du cadre de cette entrée.
  children:
    - ply: d5
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Đen phản công ngay vào trung tâm, buộc con tượng phải nhúc nhích hoặc ăn quân trước khi Trắng kịp làm gì thêm với con tốt f4.
        en: Black counters in the centre at once, forcing the bishop to move or capture before White can do anything more with the f4 pawn.
        fr: Les Noirs contre-attaquent aussitôt au centre, forçant le fou à bouger ou à prendre avant que les Blancs ne puissent faire quoi que ce soit de plus avec le pion f4.
      children:
        - ply: Bxd5
          annotation:
            vi: Trắng ăn tốt, cách xử lý tự nhiên nhất. Con tượng đứng ở d5 vẫn nhìn vào f7, còn Đen phải quyết định phát triển thế nào tiếp theo.
            en: White captures, the most natural handling. The bishop on d5 still eyes f7, and Black has to decide how to develop next.
            fr: Les Blancs prennent, le traitement le plus naturel. Le fou en d5 vise toujours f7, et les Noirs doivent décider comment poursuivre leur développement.
          dismissRest:
            reason:
              vi: Đen đáp lại Bxd5 bằng một nước khác ngoài 4...Nf6 — đuổi tượng bằng 4...c6, hay một nước khác. Mỗi lựa chọn nằm ngoài phạm vi mục này.
              en: Black meets Bxd5 with something other than 4...Nf6 — chasing the bishop with 4...c6, or something else. Each is outside the scope of this entry.
              fr: Les Noirs répondent à Bxd5 par autre chose que 4...Cf6 — chassant le fou par 4...c6, ou autre chose. Chacun sort du cadre de cette entrée.
          children:
            - ply: Nf6
              replyQuality: good
              frequency: occasional
              annotation:
                vi: Biến phản-gambit Bledow. Thay vì đuổi con tượng bằng tốt, Đen phát triển ngay và nhắm vào con tượng lẫn tốt e4, mời Trắng đổi chác thêm.
                en: The Bledow Countergambit. Instead of chasing the bishop with a pawn, Black simply develops and eyes both the bishop and the e4 pawn, inviting further exchanges.
                fr: Le Contre-gambit Bledow. Plutôt que de chasser le fou avec un pion, les Noirs développent aussitôt et visent à la fois le fou et le pion e4, invitant à de nouveaux échanges.
              outcome:
                type: position
                evaluation:
                  vi: Đếm tốt thì mỗi bên đều còn bảy, quân số hoàn toàn ngang nhau — con tốt f4 Đen ăn được ở đầu ván đã được bù lại đúng bằng con tốt d Đen mất vào tay Bxd5. Con tượng d5 đang bị mã f6 nhòm tới, còn tốt e4 cũng không còn ai đỡ ngoài chính con tượng ấy.
                  en: Count the pawns and each side has seven, material is completely level — the f4 pawn Black won at the start is balanced out exactly by the d-pawn Black lost to Bxd5. The bishop on d5 is eyed by the f6 knight, and the e4 pawn is now defended by nothing but that same bishop.
                  fr: Comptez les pions, chaque camp en a sept, le matériel est parfaitement égal — le pion f4 gagné par les Noirs au début est exactement compensé par le pion d perdu au profit de Bxd5. Le fou en d5 est visé par le cavalier f6, et le pion e4 n'est plus défendu que par ce même fou.
                plan:
                  vi: Trắng lui tượng về b3 hoặc đổi ngay bằng Bxf7+ Kxf7 để phá thế nhập thành của Đen, rồi chơi Nf3 và tìm cách giành lại tốt f4. Đen chơi Nxd5 nếu tượng không lui, hoặc Bd6 và O-O, giữ con tốt f4 làm vốn liếng lâu dài.
                  en: White retreats the bishop to b3, or trades at once with Bxf7+ Kxf7 to wreck Black's castling, then plays Nf3 and looks for a way to win back the f4 pawn. Black plays Nxd5 if the bishop does not retreat, or Bd6 and O-O, banking the f4 pawn as a long-term asset.
                  fr: Les Blancs replient le fou en b3, ou échangent aussitôt par Bxf7+ Kxf7 pour briser le roque noir, puis jouent Nf3 et cherchent à regagner le pion f4. Les Noirs jouent Nxd5 si le fou ne recule pas, ou Bd6 et O-O, conservant le pion f4 comme atout durable.
                basis:
                  by: chan
                  at: '2026-09-25'
