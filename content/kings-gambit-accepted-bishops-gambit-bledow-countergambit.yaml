# King's Gambit Accepted, Bishop's Gambit, Bledow Countergambit. One of a batch of entries
# authored for issue #148 (batch h), sharing the trunk `1.e4 e5 2.f4 exf4 3.Bc4` with
# `kings-gambit-accepted-bishops-gambit.yaml` and its existing siblings, including the very
# similar `kings-gambit-accepted-bishops-gambit-anderssen-variation` (same 3...d5 4.Bxd5,
# differing only in Black's fifth move). Defining line ends on White's 3.Bc4 (invariant 5).
# Every ply below was replayed with chess.js before being written.
id: kings-gambit-accepted-bishops-gambit-bledow-countergambit
name: "King's Gambit Accepted: Bishop's Gambit, Bledow Countergambit"
eco: C33
category: gambit
side: white
