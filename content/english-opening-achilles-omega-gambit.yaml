# English Opening: Achilles-Omega Gambit. Frozen defining line 1.c4 Nf6 2.e4, which ends on
# White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). Replayed
# with chess.js through 2...Nxe4: Black takes the pawn at once, the only piece that can
# capture there. Nothing is hanging at the resulting position. searchMate at 4 moves from
# this position returns no-mate, so no forced mate is claimed anywhere in this entry.
id: english-opening-achilles-omega-gambit
name: 'English Opening: Achilles-Omega Gambit'
eco: A10
category: gambit
side: white
definingLine: [c4, Nf6, e4]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
