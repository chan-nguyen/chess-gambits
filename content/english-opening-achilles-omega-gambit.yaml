tree:
  annotation:
    vi: Trắng chơi 2.e4, mời Đen ăn con tốt trung tâm này bằng chính con mã đang tấn công nó, đổi lấy một nhịp phát triển nào đó bù lại về sau.
    en: White plays 2.e4, inviting Black to take the central pawn with the very knight already attacking it, in exchange for some development to show for it later.
    fr: Les Blancs jouent 2.e4, invitant les Noirs à prendre le pion central avec le cavalier qui l'attaque déjà, en échange d'un peu de développement à montrer plus tard.
  dismissRest:
    reason:
      vi: Đen không ăn con tốt e4. Các nước như d6 hay e6 để nguyên con tốt e4 trên bàn cờ, nghĩa là lời mời vẫn chưa hề được nhận.
      en: Black does not take the e4 pawn. Anything else, such as ...d6 or ...e6, leaves the e4 pawn sitting on the board, meaning the offer has still not actually been accepted.
      fr: Les Noirs ne prennent pas le pion e4. Tout le reste, comme ...d6 ou ...e6, laisse le pion e4 sur l'échiquier, ce qui veut dire que l'offre n'a toujours pas été acceptée.
  children:
    - ply: Nxe4
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen ăn con tốt ngay lập tức bằng chính con mã đang tấn công nó. Không có gì phức tạp ở đây, con tốt e4 chỉ đơn giản là bị treo.
        en: Black takes the pawn at once with the very knight attacking it. There is nothing complicated here — the e4 pawn is simply hanging.
        fr: Les Noirs prennent aussitôt le pion avec le cavalier qui l'attaquait déjà. Il n'y a rien de compliqué ici, le pion e4 est simplement en prise.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy. Đen hơn đúng một tốt sạch, con mã e4 đứng vững giữa bàn cờ và chưa quân Trắng nào đe dọa được nó, còn Trắng chưa có gì cụ thể để bù lại ngoài ý định phát triển nhanh bằng Nc3 để đuổi mã.
          en: Count the pawns and it is eight for Black, seven for White. Black is a clean pawn up, the knight on e4 sits solidly in the centre with no white piece threatening it, and White has nothing concrete yet to show for it beyond the intention to develop quickly with Nc3 to chase it.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs. Les Noirs ont un pion net d'avance, le cavalier en e4 est solidement installé au centre sans qu'aucune pièce blanche ne le menace, et les Blancs n'ont encore rien de concret à montrer, hormis l'intention de se développer rapidement par Nc3 pour le chasser.
        plan:
          vi: Trắng chơi Nc3 đuổi mã, rồi Nf3 và g3, phát triển nhanh và cố tạo đủ hoạt động để bù cho con tốt đã mất. Đen chơi Nf6 lùi mã về vị trí an toàn, rồi d5 hay g6, hoàn tất phát triển một cách chắc chắn và giữ vững con tốt thừa.
          en: White plays Nc3 to chase the knight, then Nf3 and g3, developing quickly and trying to create enough activity to make up for the lost pawn. Black plays ...Nf6 to bring the knight back to safety, then ...d5 or ...g6, completing development soundly and holding the extra pawn.
          fr: Les Blancs jouent Nc3 pour chasser le cavalier, puis Nf3 et g3, se développant rapidement et essayant de créer assez d'activité pour compenser le pion perdu. Les Noirs jouent ...Nf6 pour ramener le cavalier en sécurité, puis ...d5 ou ...g6, achevant leur développement solidement et gardant le pion supplémentaire.
        basis:
          by: chan
          at: '2026-09-25'
