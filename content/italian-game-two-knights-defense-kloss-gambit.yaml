name: 'Italian Game: Two Knights Defense, Kloss Gambit'
eco: C57
category: gambit
side: black
definingLine: [e4, e5, Nf3, Nc6, Bc4, Nf6, Ng5, d5, exd5, Nb4]
soundness:
  value: unsound
  reviewedAt: '2026-09-30'
  basis:
    by: chan
    at: '2026-09-30'
    source: >-
      A judgement. White can simply castle: the knight on b4 attacks the c2 and a2 pawns,
      both defended, and is offside, while the knight on g5 presses on f7 and h7; Black can
      regain the pawn with ...Nbxd5, but then White is castled, the knight on g5 still presses on f7 and h7 and Black's king is still on e8, so the line is labelled unsound.
      No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-30'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
