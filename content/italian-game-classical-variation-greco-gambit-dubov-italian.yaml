tree:
  annotation:
    vi: Trắng vừa chơi 6.b4, dùng tốt tấn công tượng c5. Tượng bị tốt tấn công mà không có quân nào bảo vệ; tốt b4 bị tượng và mã c6 tấn công và chỉ được một quân bảo vệ là tốt c3; còn tốt d4 của Đen bị tấn công ba lần và được bảo vệ hai lần. Tốt e4 của Trắng bị mã f6 tấn công mà không ai bảo vệ. Mục này đi theo nước lui tượng 6...Bb6.
    en: White has just played 6.b4, attacking the bishop on c5 with a pawn. The bishop is attacked by the pawn and nothing defends it; the b4 pawn is attacked by the bishop and by the knight on c6 and defended once, by the c3 pawn; and Black's pawn on d4 is attacked three times and defended twice. White's e4 pawn is attacked by the knight on f6 and nothing defends it. This entry follows the retreat 6...Bb6.
    fr: Les Blancs viennent de jouer 6.b4, attaquant le fou c5 avec un pion. Le fou est attaqué par le pion et rien ne le défend ; le pion b4 est attaqué par le fou et par le cavalier c6 et défendu une fois, par le pion c3 ; et le pion d4 des Noirs est attaqué trois fois et défendu deux fois. Le pion e4 blanc est attaqué par le cavalier f6 et rien ne le défend. Cette entrée suit le repli 6...Bb6.
  dismissRest:
    reason:
      vi: Đen chơi một nước khác thay vì 6...Bb6 ở đây, chẳng hạn 6...Bxb4, ăn tốt bằng tượng. Mục này chỉ mô hình hóa nước lui tượng về b6.
      en: Black plays something other than 6...Bb6 here, for instance 6...Bxb4, which takes the pawn with the bishop. This entry models only the retreat to b6.
      fr: Les Noirs jouent autre chose que 6...Bb6 ici, par exemple 6...Bxb4, qui prend le pion avec le fou. Cette entrée ne modélise que le repli en b6.
  children:
    - ply: Bb6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen lui tượng về b6, nơi nó vẫn bảo vệ tốt d4 và không quân Trắng nào tấn công được nó.
        en: Black retreats the bishop to b6, where it keeps defending the d4 pawn and is attacked by none of White's pieces.
        fr: Les Noirs replient le fou en b6, où il continue de défendre le pion d4 et n'est attaqué par aucune pièce blanche.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nhưng hai tốt d7 và d4 của Đen bị chồng, và tốt d4 bị tấn công ba lần còn chỉ được bảo vệ hai lần, bởi tượng b6 và mã c6. Tốt e4 của Trắng bị mã f6 tấn công mà không ai bảo vệ, còn tốt b4 của Trắng được tốt c3 bảo vệ trước mã c6.'
          en: "Count the pawns: White seven, Black eight, but Black's pawns on d7 and d4 are doubled, and the d4 pawn is attacked three times and defended twice, by the bishop on b6 and the knight on c6. White's e4 pawn is attacked by the knight on f6 and nothing defends it, and White's b4 pawn is defended by the c3 pawn against the knight on c6."
          fr: 'Comptez les pions : sept pour les Blancs, huit pour les Noirs, mais les pions noirs d7 et d4 sont doublés, et le pion d4 est attaqué trois fois et défendu deux fois, par le fou b6 et le cavalier c6. Le pion e4 blanc est attaqué par le cavalier f6 et rien ne le défend, et le pion b4 blanc est défendu par le pion c3 face au cavalier c6.'
        plan:
          vi: Trắng ăn lại bằng cxd4, rồi chơi Nc3 để bảo vệ e4 và O-O, nhắm một trung tâm lớn đối lại hai tốt d chồng của Đen. Đen chơi ...d6 và ...O-O để củng cố tốt dư.
          en: White takes back with cxd4, then plays Nc3 to cover e4 and O-O, aiming for a big centre against Black's doubled d-pawns. Black plays ...d6 and ...O-O to consolidate the extra pawn.
          fr: Les Blancs reprennent par cxd4, puis jouent Nc3 pour couvrir e4 et O-O, visant un grand centre face aux pions d doublés des Noirs. Les Noirs jouent ...d6 et ...O-O pour consolider le pion de plus.
        basis:
          by: chan
          at: 2026-09-30
