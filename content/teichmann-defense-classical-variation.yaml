tree:
  annotation:
    vi: Trắng vừa chơi 8.Be3. Tượng bảo vệ tốt d4, còn hậu f3 tấn công mã f6, vốn được hai tốt e7 và g7 bảo vệ. Trắng có hai tượng và một mã, Đen có một tượng và hai mã.
    en: White has just played 8.Be3. The bishop defends the d4 pawn, and the queen on f3 attacks the knight on f6, which the pawns on e7 and g7 defend. White has two bishops and one knight, Black one bishop and two knights.
    fr: Les Blancs viennent de jouer 8.Be3. Le fou défend le pion d4, et la dame f3 attaque le cavalier f6, que les pions e7 et g7 défendent. Les Blancs ont deux fous et un cavalier, les Noirs un fou et deux cavaliers.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 8...Qb6. Bài này chỉ đi theo nhánh 8...Qb6; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 8...Qb6 here. This entry follows the reply 8...Qb6 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 8...Qb6. Cette fiche ne suit que la réponse 8...Qb6 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Qb6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen chơi 8...Qb6, cùng lúc tấn công d4 và b2. Tốt d4 được tượng e3 bảo vệ, nhưng tốt b2 không còn quân nào bảo vệ vì tượng từng giữ nó đã lên e3.
        en: Black plays 8...Qb6, attacking d4 and b2 at once. The d4 pawn is defended by the bishop on e3, but the pawn on b2 has no defender left, since the bishop that guarded it now stands on e3.
        fr: Les Noirs jouent 8...Qb6, attaquant d4 et b2 à la fois. Le pion d4 est défendu par le fou e3, mais le pion b2 n'a plus de défenseur, le fou qui le gardait se trouvant maintenant en e3.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng sáu, Đen bảy, nên Trắng kém một tốt. Tốt b2 bị hậu b6 tấn công mà không quân nào bảo vệ, còn tốt d4 bị cùng quân hậu đó tấn công và chỉ có tượng e3 bảo vệ một lần. Trắng có cặp tượng.'
          en: 'Count the pawns: White six, Black seven, so White is a pawn down. The pawn on b2 is attacked by the queen on b6 and defended by nothing, and the d4 pawn is attacked by the same queen and defended once, by the bishop on e3. White has the pair of bishops.'
          fr: "Comptez les pions : six pour les Blancs, sept pour les Noirs ; les Blancs sont donc un pion en moins. Le pion b2 est attaqué par la dame b6 et n'est défendu par rien, et le pion d4 est attaqué par cette même dame et défendu une fois, par le fou e3. Les Blancs ont la paire de fous."
        plan:
          vi: 'Trắng phải lo cho b2: Rb1 bảo vệ nó, còn O-O-O đưa vua lên c1, nơi vua che chắn tốt này. Đen, nếu được yên, ăn bằng ...Qxb2; nếu không thì phát triển bằng ...e6 và ...Nbd7.'
          en: 'White must deal with b2: Rb1 defends it, and O-O-O puts the king on c1, where it covers that pawn. Black, if left alone, takes with ...Qxb2; otherwise Black develops with ...e6 and ...Nbd7.'
          fr: "Les Blancs doivent s'occuper de b2 : Rb1 le défend, et O-O-O place le roi en c1, où il le couvre. Les Noirs, s'ils sont laissés tranquilles, prennent par ...Qxb2 ; sinon ils se développent par ...e6 et ...Nbd7."
        basis:
          by: chan
          at: '2026-09-30'
