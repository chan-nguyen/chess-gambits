# Bishop's Opening: Boden-Kieseritzky Gambit, Lichtenhein Defense. Frozen defining
# line 1.e4 e5 2.Nf3 Nf6 3.Bc4 Nxe4 4.Nc3, which ends on White's own ply, so the root
# is an opponent node (docs/CONTEXT.md, invariant 5). Replayed with chess.js through
# 4...d5 5.Nxe5 — the e5 pawn is left undefended once the f6-knight moved away.
# searchMate at 3 moves from the resulting position returns no-mate, so no forced mate
# is claimed anywhere in this entry, and no capture is left going free at the leaf.
