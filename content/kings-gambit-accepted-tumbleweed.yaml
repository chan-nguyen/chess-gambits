# King's Gambit Accepted, Tumbleweed: 1.e4 e5 2.f4 exf4 3.Kf2. Every ply below was replayed
# with chess.js before being written (see docs/CONTEXT.md, invariant 1). This entry follows
# the #107 depth bar: the leaf below is a *decisive* stop, not a merely-valid one — see the
# evaluation for both features it names.
id: kings-gambit-accepted-tumbleweed
name: Tumbleweed
eco: C33
category: gambit
side: white
definingLine: [e4, e5, f4, exf4, Kf2]
soundness:
  value: unsound
  reviewedAt: '2026-09-18'
  basis:
    by: chan
    at: '2026-09-18'
    source: >-
      A judgement. White's king move gives up castling for nothing concrete in return —
      no extra pawn regained, no attack started — and 3...Qh4+ proves the cost immediately.
      No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng chơi 3.Kf2, nước đi kỳ quặc đặt tên cho biến "Tumbleweed" (cỏ lăn) này — vua tự tay bỏ quyền nhập thành ngay từ khai cuộc, chỉ với hy vọng dọn đường ăn lại tốt f4 sau này hoặc né một nước chiếu Qh4+ tưởng tượng. Đây không phải một nước thí quân có mục đích, mà là một sự nhượng bộ không kèm theo bù đắp nào.
    en: White plays 3.Kf2, the odd move that gives this variation its name "Tumbleweed" — the king gives up castling with its own hand right out of the opening, in the vague hope of recapturing the f4 pawn later or sidestepping an imagined ...Qh4+. This is not a purposeful sacrifice; it is a concession with no compensation attached.
    fr: Les Blancs jouent 3.Kf2, le coup étrange qui donne son nom à cette variante « Tumbleweed » (buisson roulant) — le roi renonce lui-même au roque dès l'ouverture, dans le vague espoir de reprendre le pion f4 plus tard ou d'esquiver un ...Qh4+ imaginaire. Ce n'est pas un sacrifice réfléchi, c'est une concession sans la moindre compensation.
  dismissRest:
    reason:
      vi: Đen chơi một nước phát triển bình thường khác, chẳng hạn 3...Nc6 hay 3...d5. Bất kỳ nước nào cũng giữ Đen hơn một tốt trước một vị trí vua Trắng đã tự làm hỏng vĩnh viễn, nhưng 3...Qh4+ là cách rõ ràng nhất để chứng minh điều đó ngay lập tức.
      en: Black plays some other ordinary developing move, such as 3...Nc6 or 3...d5. Any of them keeps Black a clean pawn up against a White king that has already ruined its own position for good, but 3...Qh4+ is the clearest way to prove it at once.
      fr: Les Noirs jouent un autre coup de développement ordinaire, comme 3...Nc6 ou 3...d5. Chacun d'eux laisse les Noirs avec un pion d'avance net face à un roi blanc qui a déjà ruiné sa propre position pour de bon, mais 3...Qh4+ est la façon la plus nette de le démontrer immédiatement.
  children:
    - ply: Qh4+
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen chiếu ngay bằng Qh4+, buộc vua Trắng phải di chuyển lần thứ hai. Đây là cách sắc bén nhất để khai thác 3.Kf2 — vua Trắng sẽ không bao giờ tìm được một chốn an toàn.
        en: Black checks at once with Qh4+, forcing White's king to move a second time. This is the sharpest way to exploit 3.Kf2 — White's king will never find a genuinely safe square.
        fr: Les Noirs mettent en échec immédiatement par Qh4+, forçant le roi blanc à se déplacer une seconde fois. C'est la façon la plus incisive d'exploiter 3.Kf2 — le roi blanc ne trouvera jamais de case vraiment sûre.
      children:
        - ply: Kf3
          annotation:
            vi: Trắng buộc phải đi Kf3, lựa chọn ít tệ nhất. 4.g3 sẽ dính fxg3+ và sau 5.hxg3 quân hậu Đen ăn thẳng xe h1 đang bỏ ngỏ (Qxh1), còn 4.Ke2 cho phép Đen tiếp tục quấy rối bằng f3+. Kf3 tránh mất thêm quân ngay lập tức, nhưng buộc vua phải đứng giữa bàn cờ, không còn một tốt nào ở e2 hay f2 để che chắn.
            en: White is forced into Kf3, the least damaging option. 4.g3 runs into fxg3+, and after 5.hxg3 Black's queen simply takes the undefended rook on h1 (Qxh1); 4.Ke2 lets Black keep harassing with f3+. Kf3 avoids losing more material at once, but it leaves the king standing in the middle of the board with no pawn left on e2 or f2 to shield it.
            fr: Les Blancs sont contraints de jouer Kf3, l'option la moins dommageable. 4.g3 se heurte à fxg3+, et après 5.hxg3 la dame noire prend simplement la tour non défendue en h1 (Qxh1) ; 4.Ke2 permet aux Noirs de continuer à harceler par f3+. Kf3 évite de perdre davantage de matériel immédiatement, mais laisse le roi planté au milieu de l'échiquier, sans plus aucun pion en e2 ou f2 pour le protéger.
          dismissRest:
            reason:
              vi: Đen chơi một nước khác thay vì giữ lại con tốt f4 bằng g5. Bất kỳ lựa chọn nào cũng để lại một vị trí tương tự — Đen hơn tốt, vua Trắng mắc kẹt vĩnh viễn ở giữa bàn cờ — nhưng 4...g5 là cách đơn giản và rõ ràng nhất để giữ nguyên cả hai lợi thế đó mà không mở thêm đường cho quân Trắng.
              en: Black plays something other than holding the f4 pawn with g5. Any choice leaves a broadly similar position — Black a pawn up, White's king stuck in the centre for good — but 4...g5 is the simplest, clearest way to keep both advantages without opening any more lines for White's pieces.
              fr: Les Noirs jouent autre chose que de conserver le pion f4 par g5. Tout autre choix laisse une position globalement semblable — les Noirs avec un pion d'avance, le roi blanc bloqué au centre pour de bon — mais 4...g5 est la façon la plus simple et la plus nette de conserver les deux avantages sans ouvrir davantage de lignes pour les pièces blanches.
          children:
            - ply: g5
              replyQuality: best
              frequency: common
              annotation:
                vi: Đen củng cố con tốt f4 bằng g5, khóa chặt cấu trúc tốt cánh vua và không cho Trắng bất kỳ cơ hội nào để lấy lại con tốt đã mất. Thế cờ giờ đã ổn định hoàn toàn có lợi cho Đen.
                en: Black shores up the f4 pawn with g5, locking the kingside pawn structure and denying White any chance of ever winning the lost pawn back. The position is now fully settled in Black's favour.
                fr: Les Noirs consolident le pion f4 par g5, verrouillant la structure de pions à l'aile roi et privant les Blancs de toute chance de jamais regagner le pion perdu. La position est désormais pleinement stabilisée en faveur des Noirs.
              outcome:
                type: position
                evaluation:
                  vi: Đen hơn đúng một tốt (f4, được g5 bảo vệ vĩnh viễn) mà không có bất kỳ sự đền bù nào cho Trắng. Quan trọng hơn, vua Trắng đã mất quyền nhập thành vĩnh viễn và buộc phải đứng tại f3 — một ô vua không bao giờ tự nguyện ghé qua — trong khi hai ô e2 và f2 ngay trước mặt hoàn toàn trống, không còn một tốt nào che chắn ở đó.
                  en: Black is a clean pawn up (the f4 pawn, permanently guarded by g5) with no compensation for White at all. More importantly, White's king has lost castling rights for good and is stuck standing on f3 — a square a king never visits by choice — while the e2 and f2 squares directly in front of it are completely bare, with no pawn left to shield either one.
                  fr: Les Noirs ont un pion d'avance net (le pion f4, défendu à jamais par g5) sans la moindre compensation pour les Blancs. Plus important encore, le roi blanc a perdu le roque pour de bon et reste planté en f3 — une case qu'un roi ne visite jamais de son plein gré — tandis que les cases e2 et f2, juste devant lui, sont complètement vides, sans plus aucun pion pour les protéger.
                plan:
                  vi: Đen phát triển bình thường với Nc6, Nf6, Bc5 hoặc Bg7 sau khi chơi thêm d6, luôn nhắm quân vào đường chéo và cột đang mở thẳng vào vua Trắng ở f3, đồng thời không có gì phải vội vì lợi thế đã vững chắc và lâu dài.
                  en: Black develops normally with Nc6, Nf6, and Bc5 or a Bg7 fianchetto after a further d6, always aiming pieces down the diagonal and file that already point straight at White's king on f3, with nothing to rush since the advantage is solid and lasting.
                  fr: Les Noirs se développent normalement par Nc6, Nf6, et Bc5 ou un fianchetto Bg7 après un futur d6, en dirigeant toujours leurs pièces le long de la diagonale et de la colonne qui pointent déjà droit sur le roi blanc en f3, sans rien à précipiter puisque l'avantage est solide et durable.
                basis:
                  by: chan
                  at: '2026-09-18'
