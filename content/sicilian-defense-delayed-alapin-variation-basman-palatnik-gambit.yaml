tree:
  annotation:
    vi:
      Sau khi đổi tốt ở d4 và ăn lại bằng 6.cxd4, Trắng để lại con tốt e4 không người bảo vệ — một cái
      bẫy có chủ đích mời Đen ăn tốt.
    en:
      After the trade of pawns on d4 and recapturing with 6.cxd4, White leaves the e4 pawn undefended
      — a deliberate trap inviting Black to grab it.
    fr: Après l'échange de pions en d4 et la reprise par 6.cxd4, les Blancs laissent le pion e4 sans
      défense — un piège délibéré invitant les Noirs à le prendre.
  dismissRest:
    reason:
      vi:
        Đen bỏ qua con tốt e4 và phát triển bình thường, ví dụ g6 hay e6. Con tốt ấy vẫn nằm trên bàn cờ
        và Trắng có trung tâm rộng nhưng chưa có nhịp độ phụ thêm mà việc ăn tốt mang lại.
      en:
        Black ignores the e4 pawn and develops normally, for instance g6 or e6. That pawn stays on the
        board and White has a broad centre but not the extra tempo that capturing it brings.
      fr:
        Les Noirs ignorent le pion e4 et se développent normalement, par exemple g6 ou e6. Ce pion reste
        sur l'échiquier et les Blancs ont un centre large mais pas le temps supplémentaire
        qu'apporterait sa capture.
  children:
    - ply: Nxe4
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen ăn luôn con tốt e4 đang không được bảo vệ, nhận lời thí của Trắng.
        en: Black simply grabs the undefended e4 pawn, accepting White's gambit.
        fr: Les Noirs prennent tout simplement le pion e4 non défendu, acceptant le gambit blanc.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 6 còn Đen 7 — Đen hơn đúng một tốt sạch.
          en: Count the pawns and it is 6 for White against 7 for Black — Black is up one clean pawn.
          fr:
            "Comptez les pions : 6 pour les Blancs contre 7 pour les Noirs — les Noirs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng chơi d5 đuổi mã hoặc Nc3, tranh thủ trung tâm tốt d4 và nhịp độ để bù cho con tốt đã mất.
            Đen chơi Nf6 hoặc Nc5 rút mã về nơi an toàn, tìm cách giữ vững con tốt thừa và hoàn
            thiện phát triển.
          en:
            White plays d5 to chase the knight, or Nc3, leaning on the d4 pawn centre and the tempo as
            compensation for the missing pawn. Black plays Nf6 or Nc5 to pull the knight back to
            safety, trying to hold on to the extra pawn and finish developing.
          fr:
            Les Blancs jouent d5 pour chasser le cavalier, ou Nc3, s'appuyant sur le centre du pion d4 et le
            temps gagné en compensation du pion perdu. Les Noirs jouent Nf6 ou Nc5 pour ramener le
            cavalier en sécurité, cherchant à conserver le pion supplémentaire et à achever leur
            développement.
        basis:
          by: chan
          at: 2026-09-29
