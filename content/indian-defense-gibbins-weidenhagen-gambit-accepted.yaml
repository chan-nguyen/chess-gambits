# Indian Defense, Gibbins-Weidenhagen Gambit Accepted. One entry in a batch authored for
# issue #148 (batch h), sharing the trunk `1.d4 Nf6 2.g4` with its sibling
# `indian-defense-gibbins-weidenhagen-gambit-oshima-defense` (2...e5 instead of this entry's
# 2...Nxg4). Defining line ends on White's 2.g4 (invariant 5). Every ply below was replayed
# with chess.js before being written.
id: indian-defense-gibbins-weidenhagen-gambit-accepted
name: 'Indian Defense: Gibbins-Weidenhagen Gambit Accepted'
eco: A45
category: gambit
side: white
definingLine: [d4, Nf6, g4]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement, matching the family-level label this gambit already carries in this
      catalogue. The pawn buys a tempo on the knight and a long diagonal for the f1 bishop,
      and it has never been shown to fall short of practical chances. No engine was consulted
      and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa đẩy tốt lên g4, tấn công thẳng vào mã f6 và mời Đen ăn tốt để đổi lấy nhịp.
    en: White has just pushed the pawn to g4, attacking the f6 knight directly and inviting Black to take the pawn in exchange for a tempo.
    fr: Les Blancs viennent de pousser le pion en g4, attaquant directement le cavalier f6 et invitant les Noirs à prendre le pion en échange d'un temps.
  dismissRest:
    reason:
      vi: Đen không ăn tốt g4 — lui mã về d5 hay e4, hay chơi 2...e5 (Phòng thủ Oshima). Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black does not take the g4 pawn — dropping the knight back to d5 or e4, or playing 2...e5 (the Oshima Defense). Each is outside the scope of this entry.
      fr: Les Noirs ne prennent pas le pion g4 — reculant le cavalier en d5 ou e4, ou jouant 2...e5 (la Défense Oshima). Chacun sort du cadre de cette entrée.
  children:
    - ply: Nxg4
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen nhận tốt, quân duy nhất có thể ăn tại đó. Con mã đứng khá lộ liễu ở g4, xa khỏi phần còn lại của quân Đen.
        en: Black accepts, the only piece that can capture there. The knight stands rather exposed on g4, away from the rest of Black's army.
        fr: Les Noirs acceptent, la seule pièce pouvant capturer là. Le cavalier se retrouve plutôt exposé en g4, loin du reste de l'armée noire.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy — Đen hơn đúng một tốt. Nhưng con mã g4 chưa có quân nào đỡ và đứng xa trung tâm, trong khi Trắng đã có sẵn đường chéo dài h1-a8 cho tượng f1 sắp fianchetto.
          en: Count the pawns and it is eight for Black, seven for White — Black is exactly one pawn up. But the g4 knight is defended by nothing and stands far from the centre, while White already has the long h1-a8 diagonal ready for the soon-to-be-fianchettoed f1 bishop.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs — les Noirs ont exactement un pion de plus. Mais le cavalier g4 n'est défendu par rien et se retrouve loin du centre, tandis que les Blancs ont déjà la grande diagonale h1-a8 prête pour le fou f1 bientôt fianchetté.
        plan:
          vi: Trắng chơi h3 đuổi mã, rồi Bg2 và Nf3, tận dụng đường chéo dài và nhịp phát triển để bù cho con tốt đã mất. Đen lui mã về f6 hay h6 khi bị đuổi, rồi d5 và e6, hoàn thiện phát triển và giữ con tốt thừa làm vốn liếng lâu dài.
          en: White plays h3 to chase the knight, then Bg2 and Nf3, using the long diagonal and the development tempo to make up for the lost pawn. Black drops the knight back to f6 or h6 when chased, then plays d5 and e6, completing development and banking the extra pawn as a long-term asset.
          fr: Les Blancs jouent h3 pour chasser le cavalier, puis Bg2 et Cf3, utilisant la grande diagonale et le temps de développement pour compenser le pion perdu. Les Noirs replient le cavalier en f6 ou h6 quand il est chassé, puis jouent d5 et e6, achevant leur développement et conservant le pion supplémentaire comme atout durable.
        basis:
          by: chan
          at: '2026-09-25'
