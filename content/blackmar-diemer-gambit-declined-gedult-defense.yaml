# Blackmar-Diemer Gambit Declined, Gedult Defense. Frozen defining line 1.d4 d5 2.e4
# dxe4 3.Nc3 Nf6 4.f3, which ends on White's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 4...a6. searchMate at
# 3 moves from the resulting position returns no-mate, so no forced mate is claimed
# anywhere in this entry, and no capture is left going free at the leaf.
id: blackmar-diemer-gambit-declined-gedult-defense
name: 'Blackmar-Diemer Gambit Declined: Gedult Defense'
eco: D00
category: gambit
side: white
definingLine: [d4, d5, e4, dxe4, Nc3, Nf6, f3]
soundness:
  value: dubious
  reviewedAt: '2026-09-29'
  basis:
    by: chan
    at: '2026-09-29'
    source: >-
      Long-established Blackmar-Diemer Gambit theory. White offers a further pawn purely for
      open lines and quick development; declining the capture keeps the extra material but
      costs time. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-29'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa chơi 4.f3, mời Đen ăn lại tốt e4 để chuyển sang thế Accepted; ở đây Đen chọn không ăn (declined) và chơi cách khác. Trắng đã phát triển mã c3 và chuẩn bị mở đường cho tượng c1, đổi lại tạm thời chỉ kém một tốt trên bàn cờ (bảy so với tám) mà chưa lấy lại được.
    en: White has just played 4.f3, inviting Black to recapture on e4 and transpose to the Accepted lines; here Black declines that capture and plays something else instead. White has developed the knight to c3 and is preparing to open the diagonal for the c1-bishop, currently down one pawn on the board (seven against eight) with no recapture yet.
    fr: "Les Blancs viennent de jouer 4.f3, invitant les Noirs à reprendre en e4 pour transposer dans les lignes Accepted ; ici, les Noirs refusent cette capture et jouent autre chose. Les Blancs ont développé le cavalier en c3 et se préparent à ouvrir la diagonale du fou c1, actuellement un pion de moins sur l'échiquier (sept contre huit) sans reprise encore effectuée."
  dismissRest:
    reason:
      vi: 'Đen chơi cách khác thay vì ...a6 ở đây, kể cả việc ăn lại bằng ...exf3 để chuyển hẳn sang các thế Accepted đã biết. Đánh giá tương tự: Trắng luôn kém một tốt trên bàn tại thời điểm này nhưng bù lại bằng mã đã phát triển và trung tâm thoáng, bất kể Đen chọn hướng nào.'
      en: 'Black plays something other than ...a6 here, including recapturing with ...exf3 to transpose into the known Accepted lines. The assessment is similar throughout: White is always a pawn down on the board at this point but compensated by the developed knight and the open centre, whichever way Black goes.'
      fr: "Les Noirs jouent autre chose que ...a6 ici, y compris reprendre par ...exf3 pour transposer dans les lignes Accepted connues. L'évaluation reste similaire dans tous les cas : les Blancs sont toujours un pion de moins sur l'échiquier à ce stade, compensé par le cavalier développé et le centre ouvert, quelle que soit la direction choisie par les Noirs."
  children:
    - ply: a6
      replyQuality: inaccuracy
      frequency: rare
      annotation:
        vi: Đen chơi ...a6, một nước chờ khiêm tốn ngăn Bb5 hoặc Nb5 sau này, nhưng không giúp gì cho việc phát triển quân hay tranh chấp trung tâm.
        en: Black plays the modest waiting move ...a6, ruling out a future Bb5 or Nb5, but it does nothing for development or the fight for the centre.
        fr: "Les Noirs jouent le coup d'attente modeste ...a6, écartant un futur Bb5 ou Nb5, mais cela n'aide en rien le développement ni la lutte pour le centre."
      outcome:
        type: position
        evaluation:
          vi: Đen giữ tốt dư (tám so với bảy) nhưng chưa đưa quân nào ra ngoài, trong khi Trắng đã có mã trên c3 và chuẩn bị mở tượng c1 bằng nước f3 vừa chơi.
          en: Black holds the extra pawn (eight against seven) but has not developed a single piece yet, while White already has the knight on c3 and has just prepared to open the c1-bishop with f3.
          fr: "Les Noirs conservent le pion supplémentaire (huit contre sept) mais n'ont encore développé aucune pièce, tandis que les Blancs ont déjà le cavalier en c3 et viennent de préparer l'ouverture du fou c1 par f3."
        plan:
          vi: Trắng chơi fxe4 lấy lại tốt ngay, cân bằng vật chất trong khi vẫn dẫn trước về phát triển, rồi tiếp tục Bc4 và O-O. Đen phải vội vàng bắt kịp bằng ...Nc6 và ...e5.
          en: White plays fxe4, recapturing the pawn at once and levelling material while still leading in development, then continues with Bc4 and O-O. Black must hurry to catch up with ...Nc6 and ...e5.
          fr: Les Blancs jouent fxe4, reprenant aussitôt le pion et égalisant le matériel tout en gardant leur avance de développement, puis poursuivent par Bc4 et O-O. Les Noirs doivent se hâter de rattraper leur retard par ...Nc6 et ...e5.
        basis:
          by: chan
          at: '2026-09-29'
