# King's Pawn Game: MacLeod Attack, Lasa Gambit. Frozen defining line 1.e4 e5 2.c3 f5 ends on
# Black's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). Part of
# batch t of round 4 (#182). Every ply below was replayed with chess.js before it was
# annotated; searchMate at 3 moves from the leaf returns no-mate, so no forced mate is claimed
# anywhere in this entry, and no capture is left going free at the leaf.
id: 'kings-pawn-game-macleod-attack-lasa-gambit'
name: "King's Pawn Game: MacLeod Attack, Lasa Gambit"
eco: 'C20'
category: 'gambit'
side: 'black'
definingLine:
  - 'e4'
  - 'e5'
  - 'c3'
  - 'f5'
soundness:
  value: 'unsound'
  reviewedAt: '2026-10-01'
  basis:
    by: 'chan'
    at: '2026-10-01'
    source: "A judgement. At the end of the defining line the pawns are level, eight each, and Black's f5 pawn is attacked by the e4 pawn with nothing defending it, so White can take it at once, while the move 2.c3 has left White's centre untouched. Black has nothing developed to show for the pawn, so the line is judged unsound. No engine was consulted and no database was queried."
judgement:
  by: 'chan'
  at: '2026-10-01'
  source: "Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement on one date, not engine output and not database statistics."
tree:
  annotation:
    vi: 'Đen vừa chơi 2...f5. Số tốt hai bên bằng nhau, mỗi bên tám. Tốt f5 của Đen bị tốt e4 tấn công và không có gì bảo vệ, và tốt e4 của Trắng bị tốt f5 tấn công và cũng không có gì bảo vệ.'
    en: "Black has just played 2...f5. The pawns are level, eight each. Black's pawn on f5 is attacked by the e4 pawn and nothing defends it, and White's pawn on e4 is attacked by the f5 pawn and nothing defends it either."
    fr: 'Les Noirs viennent de jouer 2...f5. Les pions sont à égalité, huit de chaque côté. Le pion f5 des Noirs est attaqué par le pion e4 et rien ne le défend, et le pion e4 des Blancs est attaqué par le pion f5 et rien ne le défend non plus.'
  dismissRest:
    reason:
      vi: 'Trắng chơi nước khác 3.exf5 ở đây, chẳng hạn 3.d4. Mục này đi theo nước ăn tốt f5.'
      en: 'White plays something other than 3.exf5 here, for instance 3.d4. This entry follows the capture of the pawn on f5.'
      fr: 'Les Blancs jouent autre chose que 3.exf5 ici, par exemple 3.d4. Cette entrée suit la capture du pion f5.'
  children:
    - ply: 'exf5'
      replyQuality: 'best'
      frequency: 'common'
      annotation:
        vi: 'Trắng ăn tốt f5 bằng tốt e, thắng một tốt. Tốt f5 của Trắng không bị quân nào tấn công.'
        en: "White takes the pawn on f5 with the e-pawn, winning a pawn. White's pawn on f5 is not attacked by anything."
        fr: "Les Blancs prennent le pion f5 avec le pion e, gagnant un pion. Le pion f5 des Blancs n'est attaqué par aucune pièce."
      outcome:
        type: 'position'
        evaluation:
          vi: 'Đếm tốt: Trắng tám, Đen bảy, nghĩa là con tốt đã thí chưa lấy lại được, và các tốt f của Trắng bị chồng, ở f2 và f5. Chưa bên nào phát triển quân nhẹ nào, và tốt f5 chưa bị quân nào tấn công.'
          en: "Count the pawns: White eight, Black seven, so the sacrificed pawn has not come back, and White's f-pawns are doubled, on f2 and f5. Neither side has a minor piece developed, and the pawn on f5 is not yet attacked by anything."
          fr: "Comptez les pions : huit pour les Blancs, sept pour les Noirs, donc le pion sacrifié n'est pas revenu, et les pions f blancs sont doublés, en f2 et f5. Aucun camp n'a développé de pièce mineure, et le pion f5 n'est encore attaqué par aucune pièce."
        plan:
          vi: 'Trắng giành trung tâm bằng d4 và phát triển bằng Nf3 và Bd3, nước cũng bảo vệ tốt f5. Đen tấn công tốt f5 bằng ...Qf6 và phát triển bằng ...Nc6.'
          en: 'White challenges the centre with d4 and develops with Nf3 and Bd3, which also defends the f5 pawn. Black attacks the f5 pawn with ...Qf6 and develops with ...Nc6.'
          fr: 'Les Blancs défient le centre par d4 et se développent par Nf3 et Bd3, qui défend aussi le pion f5. Les Noirs attaquent le pion f5 par ...Qf6 et se développent par ...Nc6.'
        basis:
          by: 'chan'
          at: '2026-10-01'
