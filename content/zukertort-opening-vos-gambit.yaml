# Zukertort Opening: Vos Gambit. Frozen defining line 1.Nf3 d6 2.d4 e5, which ends on
# Black's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). The line
# below was replayed with chess.js before being annotated.
id: zukertort-opening-vos-gambit
name: 'Zukertort Opening: Vos Gambit'
eco: A04
category: gambit
side: black
definingLine: [Nf3, d6, d4, e5]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. Black offers the freshly advanced e5 pawn with 2...e5, but White's own
      knight already guards that square, so 3.dxe5 nets the pawn cleanly and it is not
      simply Black's to win back; there is nothing yet to show for the missing pawn. No
      engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Sau 1...d6 2.d4, Đen tung ngay 2...e5!?, một ý tưởng kiểu Englund ngược, thí tốt để mở đường nhanh chóng cho các quân nhẹ.
    en: After 1...d6 2.d4, Black immediately strikes with 2...e5!?, a sort of reversed Englund idea, offering the pawn to open lines quickly for the minor pieces.
    fr: Après 1...d6 2.d4, les Noirs frappent aussitôt par 2...e5!?, une idée en quelque sorte inversée du Gambit Englund, offrant le pion pour ouvrir rapidement des lignes aux pièces mineures.
  dismissRest:
    reason:
      vi: Trắng còn cách khác để ăn tốt hoặc bỏ qua nó. 3.Nxe5 ăn bằng mã thay vì bằng tốt, dẫn tới một thế cờ rất giống nhau với cùng một tốt thừa; còn một nước phát triển bình thường bỏ qua việc ăn tốt thì giữ nguyên sức căng trên bàn cờ và không thay đổi điều Đen đang cố chứng minh.
      en: White has other ways to win the pawn or leave it alone. 3.Nxe5 captures with the knight instead of the pawn, leading to a very similar position with the same extra pawn; a normal developing move that declines the capture altogether leaves the tension on the board and does not change what Black is trying to prove.
      fr: Les Blancs disposent d'autres façons de gagner le pion ou de le laisser. 3.Nxe5 capture avec le cavalier plutôt qu'avec le pion, menant à une position très semblable avec le même pion supplémentaire ; un coup de développement normal qui décline la capture laisse la tension sur l'échiquier et ne change rien à ce que les Noirs cherchent à prouver.
  children:
    - ply: dxe5
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng ăn tốt bằng chính tốt d, cách trực diện nhất để kiểm chứng xem Đen có thật sự bù đắp được hay không, và con tốt vừa chiếm được lại đang được mã f3 đỡ sẵn.
        en: White captures with the d-pawn, the most direct way to test whether Black really has enough to show for it, and the newly won pawn is itself already guarded by the knight on f3.
        fr: Les Blancs capturent avec le pion d, la façon la plus directe de tester si les Noirs ont vraiment de quoi compenser, et le pion tout juste gagné est déjà lui-même gardé par le cavalier en f3.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy — Trắng hơn đúng một tốt sạch. Con tốt ấy đang được mã f3 đỡ vững nên Đen không thể đơn giản ăn lại miễn phí; thứ Đen có được để đổi lại chỉ là đường chéo c8-h3 vừa mở ra cho tượng, chưa đủ để nói tới bù đắp thật sự.
          en: Count the pawns and it is eight for White, seven for Black — White is a clean pawn up. That pawn is solidly guarded by the knight on f3, so Black cannot simply win it back for free; all Black has to show for it is the newly opened c8-h3 diagonal for the bishop, not nearly enough yet to call it real compensation.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs — les Blancs ont un pion de plus. Ce pion est solidement gardé par le cavalier en f3, donc les Noirs ne peuvent pas simplement le reprendre gratuitement ; tout ce que les Noirs ont à montrer, c'est la diagonale c8-h3 tout juste ouverte pour le fou, ce qui est loin de suffire pour parler de vraie compensation.
        plan:
          vi: Trắng chơi Nc3, e4 và Bc4 hay Be2, hoàn tất phát triển và giữ vững con tốt thừa. Đen chơi ...Nf6, ...Be7 và nhập thành, hoặc cân nhắc ...dxe5 đổi bớt quân, cố đưa quân nhẹ vào cuộc trước khi quyết định hướng đi tiếp theo.
          en: White plays Nc3, e4 and Bc4 or Be2, completing development and holding on to the extra pawn. Black plays ...Nf6, ...Be7 and castles, or considers ...dxe5 to trade down, trying to get the minor pieces into play before settling on a plan.
          fr: Les Blancs jouent Nc3, e4 et Bc4 ou Be2, achevant leur développement et gardant le pion supplémentaire. Les Noirs jouent ...Nf6, ...Be7 et roquent, ou envisagent ...dxe5 pour simplifier, essayant de mettre leurs pièces mineures en jeu avant de fixer un plan.
        basis:
          by: chan
          at: '2026-09-25'
