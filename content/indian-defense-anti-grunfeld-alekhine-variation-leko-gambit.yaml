id: indian-defense-anti-grunfeld-alekhine-variation-leko-gambit
name: 'Indian Defense: Anti-Grünfeld, Alekhine Variation, Leko Gambit'
eco: E60
category: gambit
side: black
definingLine: [d4, Nf6, c4, g6, f3, e5]
soundness:
