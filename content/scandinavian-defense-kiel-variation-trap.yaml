# The Kiel Variation trap, in the Modern Scandinavian. The defining line is 1.e4 d5 2.exd5
# Nf6 3.d4 Nxd5 4.c4 Nb4 — and it ends on Black's own ply, so the root is an opponent node
# and White's reply can carry a quality (invariant 5).
#
# This entry is included because the product owner's reference sources (a lichess trap study
# and a chess.com "10 traps" article) both point at it, and because #118 asked for it by
# name. But it does not hold up as a trap. Two specific ideas repeated about it online were
# checked by hand with chess.js and both fail outright: 4...Nb4 does not threaten 5...Nc2+
# (the queen on d1 defends c2 directly, so the knight is simply lost for nothing) and it does
# not threaten 5...Nd3+ either (both the queen and the f1 bishop defend d3). Every "White
# walks into a trick" story built on either of those squares is not a trick; it is a losing
# move for Black regardless of what White has or has not played. What is left, once those are
# checked and discarded, is exactly what general opening literature already says about this
# line without the trap framing: 5.a3! simply asks the knight where it is going, and neither
# retreat is a good square. Per docs/CONTEXT.md ("Where a line's reputation doesn't hold up
# under real analysis... write an honest position leaf"), that is what this file does, rather
# than inventing a tactic that was not found.
#
# ECO is B01 and category is `trap`, which is what `tools/catalogue/source/traps.yaml`
# records: a trap carries the ECO of the opening it sits inside (ADR-0008).
#
# From #127, following up on #125/#126: the lichess study's ch24 chapter also gives a second
# White try, 5.Qa4+, with an annotated line running 5...N8c6 6.d5?! b5! 7.cxb5 Bf5 8.Na3
# Qxd5 9.bxc6 Qe4+ 10.Kd2 Rd8+ 11.Kc3 e5, calling the position "-+" and noting several
# sub-branches with claimed deep mates. This is added as a **second sibling branch** at the
# root, alongside 5.a3, rather than touching that branch or its `unsound` verdict — 5.a3
# remains simply the best try and is untouched; 5.Qa4+ is a weaker, more complicated try that
# a real opponent might also play, and showing that White can also blunder badly inside it
# does not make the position sound for Black, since 5.a3 is still there refuting the gambit
# cleanly. Replaying every move with chess.js confirms 5...b5! is real (it forks the queen on
# a4 and the pawn on c4 at once) and that 6.d5?! is genuinely a mistake rather than the best
# try, matching the source. What replay found past the source's own line: at the final
# position (after 11...e5, White to move), several of the natural-looking replies hang
# outright to an immediate mate the source never names as such — 12.Qxb4?? Qxb4# is the
# cleanest of them (the queen recapture is itself mate, since White's own king on c3 has
# nowhere to go), and 12.Qb3??/12.b3?? Qd4#, 12.Bd3?? Qxd3#/Rxd3#, and 12.Ne2?? Qd3#/Rd3# all
# fail the same way. None of these were the source's own claimed lines, which is exactly the
# kind of thing a hand replay is for. What replay could **not** settle, in the time this pass
# allows, is whether White's genuinely careful tries (12.Qa5, 12.Kb3, 12.Bd2 and the like)
# are also lost by force — the position stays full of checks (Rd3+, Nd5+, Nxa2+, Qxc6+ among
# others) and material is roughly two pawns for White, but no forced mate against best
# defence was found or claimed. Rather than assert a verdict that was not earned, or leave
# the node as `unexplored` as a stand-in for "no forced verdict found" (the mistake `docs/
# PROJECT-PLAN.md` §6.9 warns three earlier agents made), this entry follows 12.Qa5
# Qxc6+ 13.Kb3 down to an honest `position` leaf: White is up material with a king that has
# walked from e1 to b3 and committed to an exposed square, and this catalogue does not claim
# more than that. The deeper alleged mates quoted in the issue (`15.Kb3 Qc2#`, `11.Nd4#`/
# `Qd3#`) were not reachable from the exact line replayed here and are not claimed.
#
# The mate at 12...Qxb4# is claimed with `type: trap` and nothing else; the certificate is
# produced by `npm run prove:mates` and replayed by `npm run verify:mates` (ADR-0005).
id: scandinavian-defense-kiel-variation-trap
name: 'Scandinavian Defense: Kiel Variation Trap'
eco: B01
category: trap
side: black
definingLine: [e4, d5, exd5, Nf6, d4, Nxd5, c4, Nb4]
soundness:
  value: unsound
  reviewedAt: '2026-09-18'
  basis:
    by: chan
    at: '2026-09-18'
    source: >-
      A judgement, not a measurement. Two of the tactics most often cited for this line —
      5...Nc2+ and 5...Nd3+ — were checked by hand with chess.js and both simply lose the
      knight, defended as they are by White's queen (and, on d3, the bishop too). With those
      gone there is no concrete punishment for White playing naturally, and the simple 5.a3!
      leaves the knight without a good square. This is taught so it is recognised, not so it
      is played with real hope of a trick. No engine was consulted and no database was
      queried.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date.
tree:
  annotation:
    vi: Đen vừa đưa mã ra b4, một nước trông có vẻ hung hãn — như thể nó đe doạ Nc2+ chiếu vua và xe, hoặc Nd3+ chiếu vua và tượng. Cả hai đe doạ ấy đều không có thật — hậu Trắng ở d1 canh thẳng ô c2, còn ô d3 thì cả hậu lẫn tượng f1 cùng canh. Con mã b4 chỉ đơn giản là đang đứng ở rìa bàn cờ, chờ Trắng hỏi nó đi đâu.
    en: Black has just played the knight to b4, a move that looks aggressive — as if it threatens Nc2+, forking king and rook, or Nd3+, forking king and bishop. Neither threat is real. White's queen on d1 guards c2 directly, and d3 is guarded twice over, by the queen and by the bishop on f1. The knight on b4 is simply standing at the edge of the board, waiting for White to ask where it is going.
    fr: Les Noirs viennent de jouer le cavalier en b4, un coup qui semble agressif — comme s'il menaçait Cc2+, fourchette roi-tour, ou Cd3+, fourchette roi-fou. Aucune de ces menaces n'est réelle. La dame blanche en d1 garde directement c2, et d3 est gardée deux fois, par la dame et par le fou f1. Le cavalier b4 se tient simplement au bord de l'échiquier, attendant que les Blancs lui demandent où il va.
  dismissRest:
    reason:
      vi: Trắng chơi một nước khác, và không có gì phải lo cả — vì như đã nói, không đe doạ nào của con mã b4 là thật. Bất kỳ nước phát triển bình thường nào (Nf3, Nc3, Be2...) đều ổn. Nước rõ ràng nhất và trực tiếp nhất là 5.a3, hỏi thẳng con mã ngay lập tức; nước 5.Qa4+ cũng được xét riêng bên dưới, vì nó dẫn tới những biến phức tạp hơn hẳn.
      en: White plays something else, and there is nothing to fear either way, since as already noted neither of the knight's threats is real. Any ordinary developing move (Nf3, Nc3, Be2...) is fine. The clearest and most direct one is 5.a3, asking the knight the question at once; 5.Qa4+ is also examined separately below, since it leads to far messier complications.
      fr: Les Blancs jouent autre chose, et il n'y a rien à craindre dans un cas comme dans l'autre, puisqu'aucune des menaces du cavalier n'est réelle, comme on l'a vu. N'importe quel coup de développement ordinaire (Cf3, Cc3, Fe2...) convient. Le plus clair et le plus direct est 5.a3, qui pose aussitôt la question au cavalier ; 5.Qa4+ est aussi examiné séparément ci-dessous, car il mène à des complications bien plus confuses.
  children:
    - ply: a3
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng đẩy tốt lên a3, hỏi thẳng con mã b4 xem nó định đi đâu. Không có ô nào tốt cả — lùi về a6 thì đứng ngoài rìa, còn về c6 thì chỉ đổi chỗ cho con mã b8 vốn cũng cần một ô tốt.
        en: White pushes the pawn to a3, asking the knight on b4 directly where it plans to go. There is no good square — retreating to a6 leaves it offside, and going to c6 only swaps places with the b8 knight, which needed a good square of its own too.
        fr: Les Blancs poussent le pion en a3, demandant directement au cavalier b4 où il compte aller. Il n'y a pas de bonne case — reculer en a6 le laisse hors-jeu, et aller en c6 ne fait qu'échanger sa place avec le cavalier b8, qui avait lui aussi besoin d'une bonne case.
      children:
        - ply: N4a6
          annotation:
            vi: Con mã lùi về a6, ô duy nhất còn giữ được nó trên bàn cờ mà không cản trở quân khác. Nhưng từ a6 nó không làm được gì và sẽ mất vài nhịp nữa mới quay lại được cuộc chơi.
            en: The knight retreats to a6, the one square that keeps it on the board without blocking anything else. But from a6 it does nothing useful and will cost several more moves to bring back into the game.
            fr: Le cavalier recule en a6, la seule case qui le maintient sur l'échiquier sans gêner autre chose. Mais depuis a6 il ne fait rien d'utile et il faudra plusieurs coups de plus pour le ramener dans la partie.
          outcome:
            type: position
            evaluation:
              vi: Quân số ngang nhau hoàn toàn. Nhưng con mã a6 là một quân không có ô tốt nào để đi tiếp trong nhiều nước sắp tới — nó đứng ngoài cuộc chơi ở rìa bàn cờ trong khi Trắng đã có được cả một tốt trung tâm phụ (c4) và toàn quyền phát triển bình thường. Đây chính là cái giá thực sự của 4...Nb4 — không phải mất quân, mà là mất nhịp và mất một quân vào chỗ tồi.
              en: Material is completely level. But the knight on a6 is a piece with no good square to go to for a long stretch of moves — it stands outside the game on the rim while White already has an extra central pawn on c4 and completely normal development ahead. This is the real cost of 4...Nb4 — not lost material, but a lost tempo and a piece parked somewhere bad.
              fr: Le matériel est parfaitement égal. Mais le cavalier a6 est une pièce sans bonne case où aller pendant un long moment — il reste hors du jeu, sur le bord, tandis que les Blancs disposent déjà d'un pion central supplémentaire en c4 et d'un développement tout à fait normal devant eux. C'est le vrai coût de 4...Cb4 — non pas une perte de matériel, mais un temps perdu et une pièce mal placée.
            plan:
              vi: Trắng phát triển bình thường với Nc3, Nf3, Be2 và nhập thành, giữ tốt c4 và d4 làm trung tâm vững chắc, rồi tìm cách đưa con mã a6 kia vào thế bị động lâu dài bằng b4 và Bb2 nếu có dịp. Đen phải tốn thêm vài nhịp mới đưa được con mã trở lại qua c7 hoặc b8, trong khi vẫn phải hoàn thiện phần phát triển còn lại.
              en: White develops normally with Nc3, Nf3, Be2 and castling, keeps the c4 and d4 pawns as a solid centre, and looks to keep that a6 knight passive for a long time with b4 and Bb2 when the chance comes. Black has to spend extra moves bringing the knight back through c7 or b8, all while still needing to finish the rest of development.
              fr: Les Blancs développent normalement avec Cc3, Cf3, Fe2 et le roque, gardent les pions c4 et d4 comme centre solide, et cherchent à maintenir ce cavalier a6 passif longtemps avec b4 et Fb2 le moment venu. Les Noirs doivent consacrer des coups supplémentaires à ramener le cavalier via c7 ou b8, tout en devant encore achever le reste de leur développement.
            basis:
              by: chan
              at: '2026-09-18'
    - ply: 'Qa4+'
      replyQuality: inaccuracy
      frequency: occasional
      annotation:
        vi: Trắng chiếu bằng hậu thay vì hỏi thẳng con mã. Đây là một cách chơi có thật, không phải một sai lầm rõ ràng, nhưng nó dẫn Trắng vào những biến phức tạp hơn hẳn so với 5.a3 đơn giản — và như sẽ thấy dưới đây, phức tạp hơn không có nghĩa là tốt hơn.
        en: White checks with the queen instead of asking the knight directly. This is a real try, not an obvious mistake, but it leads White into far messier complications than the simple 5.a3 — and as the branch below shows, messier is not the same as better.
        fr: Les Blancs font échec avec la dame au lieu d'interroger directement le cavalier. C'est un essai réel, pas une erreur évidente, mais il entraîne les Blancs dans des complications bien plus confuses que le simple 5.a3 — et comme le montre la branche ci-dessous, plus confus ne veut pas dire meilleur.
      children:
        - ply: N8c6
          annotation:
            vi: Đen chặn chiếu bằng con mã còn lại, giữ con mã b4 tại chỗ. Đây là cách chặn tự nhiên nhất và không nhường lại bất kỳ điều gì.
            en: Black blocks the check with the other knight, keeping the b4 knight exactly where it is. This is the most natural block and gives up nothing.
            fr: Les Noirs bloquent l'échec avec l'autre cavalier, laissant le cavalier b4 exactement où il est. C'est le blocage le plus naturel et il ne cède rien.
          dismissRest:
            reason:
              vi: Trắng chơi một nước khác thay vì 6.d5. Phần lớn các nước ở đây — lùi hậu, phát triển bình thường, hay đơn giản là a3 hỏi thẳng con mã như trong nhánh chính — đều ổn hoặc thậm chí tốt hơn cho Trắng. Nước 6.d5 được chọn ở đây chính vì nó là nước dẫn tới những biến phức tạp mà #127 yêu cầu kiểm tra, không phải vì nó là thử nghiệm nghiêm túc nhất.
              en: White plays something other than 6.d5. Most tries here — retreating the queen, developing normally, or simply playing a3 to ask the knight the same question as in the main branch — are fine or even better for White. 6.d5 is chosen here precisely because it is the move that leads into the complications #127 asked to have checked, not because it is White's most serious try.
              fr: Les Blancs jouent autre chose que 6.d5. La plupart des essais ici — reculer la dame, développer normalement, ou simplement jouer a3 pour poser au cavalier la même question que dans la branche principale — sont corrects, voire meilleurs pour les Blancs. 6.d5 est choisi ici précisément parce que c'est le coup qui mène aux complications que le #127 demandait de vérifier, pas parce que c'est l'essai le plus sérieux des Blancs.
          children:
            - ply: d5
              replyQuality: mistake
              frequency: rare
              annotation:
                vi: Trắng đẩy tốt lên d5, đuổi con mã c6 và có vẻ giành thêm không gian. Nhưng nước này bỏ ngỏ hoàn toàn tốt c4 và ô a4 nơi hậu đang đứng — và Đen có đúng một nước để khai thác cả hai cùng lúc.
                en: White pushes the pawn to d5, chasing the c6 knight and apparently gaining space. But this move leaves the c4 pawn and the a4 square, where the queen is standing, completely undefended together — and Black has exactly one move that exploits both at once.
                fr: Les Blancs poussent le pion en d5, chassant le cavalier c6 et gagnant apparemment de l'espace. Mais ce coup laisse le pion c4 et la case a4, où se trouve la dame, complètement sans défense en même temps — et les Noirs disposent exactement d'un coup qui exploite les deux à la fois.
