                                                                      fr: Plus rien ne garde c6 après 12.Qa5, donc c'est le choix le plus clair — reprendre le pion avec échec dans la foulée — tandis que d'autres options comme Rd3+, Cd5+ ou Cxa2+ restent disponibles mais ne sont pas approfondies ici.
