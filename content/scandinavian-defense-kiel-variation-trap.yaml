                                              en: White blocks the check with a piece instead (Be3, Be2 or Ne2) rather than moving the king. None of those is checked in depth here; 10.Kd2, sending the king to look for shelter on the queenside, is chosen because it matches the source and leads into the lines with the suspected deep mates that #127 asked to have checked.
                                              fr: Les Blancs bloquent l'échec avec une pièce (Fe3, Fe2 ou Ce2) plutôt que de déplacer le roi. Aucune de ces options n'est vérifiée en profondeur ici ; 10.Kd2, qui envoie le roi chercher refuge à l'aile dame, est choisi car il correspond à la source et mène aux lignes avec les mats profonds soupçonnés que le #127 demandait de vérifier.
