                                                                        vi: Trắng đi tiếp vua sang b3, tránh chiếu và tìm chỗ ẩn náu gần các con tốt cánh hậu còn nguyên vẹn.
                                                                        en: White's king steps on to b3, sidestepping the check and looking for shelter near the still-intact queenside pawns.
                                                                        fr: Le roi blanc continue sa marche jusqu'en b3, esquivant l'échec et cherchant refuge près des pions de l'aile dame encore intacts.
                                                                      outcome:
                                                                        type: position
                                                                        evaluation:
                                                                          vi: Trắng hơn khoảng hai tốt về vật chất tính từ đầu biến, nhưng vua Trắng đã đi tới b3 sau khi rời e1 — một hành trình nó không thể quay ngược lại và không tốt nào còn che chắn được — trong khi hậu, xe và tượng Đen đều đang hoạt động. Không có quân nào của Trắng đang bị ăn miễn phí ở đây, nhưng vua đã dấn thân quá xa khỏi hàng ngũ quân của mình để có thể gọi là an toàn.
                                                                          en: White is up roughly two pawns' worth of material counting from the start of this branch, but the king has walked all the way to b3 after leaving e1 — a journey it cannot take back and that no pawn can ever shelter again — while Black's queen, rook and bishop are all active. Nothing of White's is going free right here, but the king has strayed too far from its own pieces to call this safe.
                                                                          fr: Les Blancs ont environ deux pions de plus en matériel depuis le début de cette branche, mais le roi s'est rendu jusqu'en b3 après avoir quitté e1 — un trajet qu'il ne peut annuler et qu'aucun pion ne pourra plus jamais abriter — tandis que la dame, la tour et le fou noirs sont tous actifs. Rien chez les Blancs n'est pris gratuitement ici, mais le roi s'est trop éloigné de ses propres pièces pour que cela puisse être qualifié de sûr.
                                                                        plan:
                                                                          vi: Đen tiếp tục tìm nước chiếu hoặc đe doạ mới quanh vua Trắng lang thang, trong khi vua ấy vẫn chưa tìm được nơi an toàn thật sự. Trắng tìm cách đổi bớt quân tấn công của Đen, nhất là con hậu, và cố gắng che chắn nhà vua bằng các quân còn lại trước khi tính đến việc củng cố phần vật chất đã có.
                                                                          en: Black keeps looking for the next check or threat around White's wandering king, while that king still has not found real safety. White looks to trade off Black's attacking pieces, especially the queen, and tries to shelter the king behind the remaining pieces before thinking about consolidating the material already won.
                                                                          fr: Les Noirs continuent de chercher le prochain échec ou la prochaine menace autour du roi blanc errant, tandis que ce roi n'a toujours pas trouvé de véritable sécurité. Les Blancs cherchent à échanger les pièces attaquantes noires, surtout la dame, et tentent d'abriter le roi derrière les pièces restantes avant de songer à consolider le matériel déjà gagné.
