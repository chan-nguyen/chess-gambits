# Queen's Pawn Game: Accelerated London System, Steinitz Countergambit, Morris
# Countergambit Accepted. Frozen defining line 1.d4 d5 2.Bf4 c5 3.e4, which ends on
# White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
# Replayed with chess.js through 3...dxe4 4.dxc5 — Black's c5 pawn is left undefended
# once Black captures on e4, so the recapture simply wins it back. searchMate at 3
# moves from the resulting position returns no-mate, so no forced mate is claimed
# anywhere in this entry, and no capture is left going free at the leaf.
id: accelerated-london-system-steinitz-countergambit-morris-2
name: "Queen's Pawn Game: Accelerated London System, Steinitz Countergambit, Morris Countergambit Accepted"
eco: D00
category: gambit
side: white
definingLine: [d4, d5, Bf4, c5, e4]
soundness:
  value: dubious
  reviewedAt: '2026-09-29'
  basis:
    by: chan
    at: '2026-09-29'
    source: >-
      A judgement. White's second pawn offer opens the position further for the bishop already
      on f4, and the following in-between capture on c5 restores material at once — real
      compensation, not a refutation of correct defence. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-09-29'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
