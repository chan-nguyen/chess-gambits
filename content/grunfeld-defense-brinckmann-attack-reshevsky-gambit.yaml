name: 'Grünfeld Defense: Brinckmann Attack, Reshevsky Gambit'
eco: D83
category: gambit
side: black
definingLine: [d4, Nf6, c4, g6, Nc3, d5, Bf4, Bg7, Rc1, O-O, e3, c5, dxc5, Qa5]
soundness:
