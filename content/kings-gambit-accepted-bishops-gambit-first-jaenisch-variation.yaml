# entries authored for issue #148 (batch h), sharing the trunk `1.e4 e5 2.f4 exf4 3.Bc4`
# with `kings-gambit-accepted-bishops-gambit.yaml` and its existing siblings. Defining line
# ends on White's 3.Bc4 (invariant 5). Every ply below was replayed with chess.js before
# being written.
