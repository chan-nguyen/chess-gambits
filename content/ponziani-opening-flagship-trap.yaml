                                              frequency: common
                                              annotation:
                                                vi: Mã d1 ăn tốt c3, lấy đi tốt đang bảo vệ b4 nên b4+ không còn là chiếu hết. Đây là cách đỡ tự nhiên nhất và là nước các nguồn nêu, nhưng Trắng vẫn ăn hậu.
                                                en: The d1 knight takes the c3 pawn, removing the pawn that protects b4, so b4+ is no longer mate. It is the most natural defence and the one the sources give, but White still takes the queen.
                                                fr: "Le cavalier d1 prend le pion c3, ôtant le pion qui protège b4 : b4+ n'est plus mat. C'est la défense la plus naturelle et celle que donnent les sources, mais les Blancs prennent quand même la dame."
                                              children:
                                                - ply: Bxd8
                                                  annotation:
                                                    vi: 'Tượng g5 ăn hậu d8: Trắng lấy lại hậu đã bỏ ở nước tám.'
                                                    en: The g5 bishop takes the queen on d8, winning back the queen given up on move eight.
                                                    fr: Le fou g5 prend la dame d8 et regagne la dame sacrifiée au huitième coup.
                                                  outcome:
                                                    type: position
                                                    evaluation:
                                                      vi: 'Quân số: Trắng có hai xe, hai mã, hai tượng và năm tốt, Đen có hai xe, hai tượng, một mã và sáu tốt, nghĩa là Trắng hơn một mã đổi một tốt sau khi đã lấy lại hậu. Vua Đen kẹt ở c5 và đã mất quyền nhập thành, còn hai mã Trắng ở a3 và c4 cùng tốt b2 vẫn nhắm vào các ô quanh nó.'
                                                      en: 'Material count: White has two rooks, two knights, two bishops and five pawns; Black has two rooks, two bishops, one knight and six pawns, so White is a knight for a pawn ahead after winning the queen back. The black king is stuck on c5 and has lost the right to castle, and the white knights on a3 and c4 and the b2 pawn still bear on the squares around it.'
                                                      fr: 'Décompte matériel : les Blancs ont deux tours, deux cavaliers, deux fous et cinq pions ; les Noirs deux tours, deux fous, un cavalier et six pions, soit un cavalier de plus pour un pion côté blanc après avoir regagné la dame. Le roi noir est bloqué en c5 et a perdu le droit de roquer, et les cavaliers blancs a3 et c4 ainsi que le pion b2 visent encore les cases autour de lui.'
                                                    plan:
                                                      vi: Trắng tiếp tục truy đuổi vua Đen (b4+, đưa xe vào cột b hoặc c) và giữ hai tượng. Mã c3 của Đen đang bị tốt b2 đánh nên Đen phải lo cứu nó và cứu vua cùng lúc, mà không còn hậu để giúp.
                                                      en: White keeps hunting the black king (b4+, a rook to the b- or c-file) and keeps both bishops. Black's c3 knight is attacked by the b2 pawn, so Black has to save it and the king at the same time, with no queen to help.
                                                      fr: 'Les Blancs poursuivent la chasse au roi noir (b4+, une tour sur la colonne b ou c) et gardent les deux fous. Le cavalier c3 noir est attaqué par le pion b2 : les Noirs doivent le sauver en même temps que le roi, sans dame pour les aider.'
                                                    basis:
                                                      by: chan
                                                      at: 2026-10-01
                                            - ply: a5
                                              replyQuality: best
                                              frequency: occasional
                                              annotation:
                                                vi: Tốt a5 canh ô b4, nên b4+ không còn là chiếu hết vì tốt a5 ăn được. Nhưng nó không cứu được hậu, và Trắng ăn hậu.
                                                en: The a-pawn steps to a5 and guards b4, so b4+ is no longer mate because the a5 pawn can take it. But it does not save the queen, and White takes it.
                                                fr: "Le pion a avance en a5 et garde b4 : b4+ n'est plus mat puisque le pion a5 peut le prendre. Mais cela ne sauve pas la dame, et les Blancs la prennent."
                                              children:
                                                - ply: Bxd8
                                                  annotation:
                                                    vi: 'Tượng g5 ăn hậu d8: Trắng lấy lại hậu đã bỏ ở nước tám.'
                                                    en: The g5 bishop takes the queen on d8, winning back the queen given up on move eight.
                                                    fr: Le fou g5 prend la dame d8 et regagne la dame sacrifiée au huitième coup.
                                                  outcome:
                                                    type: position
                                                    evaluation:
                                                      vi: 'Quân số: Trắng có hai xe, hai mã, hai tượng và sáu tốt, Đen có hai xe, hai tượng, một mã và sáu tốt, nghĩa là Trắng hơn một mã nguyên vẹn, vì hậu hai bên đã mất cả. Mã d1 của Đen đang bị vua e1 và xe a1 cùng đánh mà không có quân nào bảo vệ.'
                                                      en: "Material count: White has two rooks, two knights, two bishops and six pawns; Black has two rooks, two bishops, one knight and six pawns, so White is a clean knight ahead, both queens being gone. Black's knight on d1 is attacked by the king on e1 and the rook on a1 and defended by nothing."
                                                      fr: "Décompte matériel : les Blancs ont deux tours, deux cavaliers, deux fous et six pions ; les Noirs deux tours, deux fous, un cavalier et six pions, soit un cavalier net de plus pour les Blancs, les deux dames ayant disparu. Le cavalier d1 noir est attaqué par le roi e1 et la tour a1 et n'est défendu par rien."
                                                    plan:
                                                      vi: Trắng sẽ ăn mã d1 bằng vua hoặc xe nếu nó đứng yên, giữ hai tượng và dùng quân dư ra để truy đuổi vua c5. Đen phải lo cho mã d1 và cho vua cùng một lúc.
                                                      en: White will take the d1 knight with the king or a rook if it stays there, keeps both bishops and uses the extra piece to hunt the king on c5. Black has to look after the d1 knight and the king at the same time.
                                                      fr: Les Blancs prendront le cavalier d1 avec le roi ou une tour s'il reste là, gardent les deux fous et se servent de la pièce de plus pour chasser le roi c5. Les Noirs doivent s'occuper en même temps du cavalier d1 et du roi.
                                                    basis:
                                                      by: chan
                                                      at: 2026-10-01
                                            - ply: Qxg5
                                              replyQuality: blunder
                                              frequency: common
                                              annotation:
                                                vi: Hậu ăn tượng g5, tưởng là thoát nạn và thắng thêm một quân. Nhưng nước đó không làm gì với b4, và b4 là chiếu hết.
                                                en: The queen takes the bishop on g5, expecting to escape and win a piece as well. But that does nothing about b4, and b4 is checkmate.
                                                fr: La dame prend le fou g5, croyant s'échapper et gagner une pièce de plus. Mais cela ne change rien à b4, et b4 est mat.
                                              outcome:
                                                type: trap
                                            - ply: Qe7+
                                              replyQuality: blunder
                                              frequency: occasional
                                              annotation:
                                                vi: Hậu chiếu từ e7 để bắt tượng g5 ăn. Tượng ăn hậu có chiếu, Đen ăn lại tượng, và b4 vẫn là chiếu hết; chuỗi này do máy chứng minh.
                                                en: The queen checks from e7 to make the g5 bishop take. The bishop takes the queen with check, Black takes the bishop back, and b4 is still checkmate; the sequence is proved by machine.
                                                fr: La dame donne échec en e7 pour forcer le fou g5 à prendre. Le fou prend la dame avec échec, les Noirs reprennent le fou, et b4 reste mat ; la séquence est prouvée par la machine.
                                              outcome:
                                                type: trap
                                            - ply: Nxb2
                                              replyQuality: blunder
                                              frequency: occasional
                                              annotation:
                                                vi: Mã d1 ăn tốt b2, lấy đi tốt cần cho b4, nhưng nó rời d1 — ô từ đó nó canh e3. Giờ không còn quân nào của Đen ăn được ô e3, và Be3 là chiếu hết.
                                                en: The d1 knight takes the b2 pawn, removing the pawn b4 needs, but it leaves d1, the square from which it guarded e3. Now no black piece can take on e3, and Be3 is checkmate.
                                                fr: Le cavalier d1 prend le pion b2, ôtant le pion dont b4 a besoin, mais il quitte d1, case d'où il gardait e3. Plus aucune pièce noire ne peut prendre en e3, et Be3 est mat.
                                              outcome:
                                                type: trap
