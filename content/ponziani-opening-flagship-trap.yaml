# The Flagship Trap (also called the Ponziani Trap), from White's side of the Ponziani
# Opening, Jaenisch Counterattack. The defining line is 1.e4 e5 2.Nf3 Nc6 3.c3 Nf6 4.d4 Nxe4
# 5.d5 Ne7 6.Nxe5 Ng6 7.Bd3 and it ends on White's own ply, so the root is an opponent node
# and Black's mistakes can carry a quality (docs/CONTEXT.md, invariant 5). 4...Nxe4 is Black's
# main line, not the mistake; the error comes at move seven.
#
# ECO is C44 and category is `trap`, matching `traps.yaml`: a trap carries the ECO of the
# opening it sits inside (ADR-0008). The dataset's row for the Jaenisch Counterattack (3...Nf6)
# is C44; its Vukovic Gambit row (4...Nxe4 5.d5 Bc5) is a different position from this one
# (5...Ne7) and is not touched.
#
# Sources are leads. The line 7...Nxf2 8.Bxg6 Nxd1 9.Bxf7+ Ke7 10.Bg5+ Kd6 11.Nc4+ Kc5
# 12.Nba3 is on chesstrapguide.com and the Chess Website's Flagship Trap page, and is credited
# to Bachmann-Kunstmann 1899 in the reference list that fed issue #173. It was replayed ply by
# ply with chess.js before any prose was written. What the replay found, and the file now says:
#
# - Every ply of the line is legal and the king walk is forced: 9.Bxf7+ has one legal reply
#   (Ke7), 10.Bg5+ has one (Kd6) and 11.Nc4+ has one (Kc5). The source continues 12...Nxc3
#   13.Bxd8, which is true but hides the point of the trap: 12.Nba3 is a quiet move that
#   threatens b2-b4 mate, and most of Black's replies at that node are mated at once by it. The
#   count is derived by the build, not typed. 12.Bxd8 wins too, so the quiet move is not
#   "stronger"; it is the one that sets a mating trap.
# - 7...Nxf2 is not the end of the game by itself. After 8.Bxg6 the sound defence is
#   8...hxg6 9.Kxf2, which leaves White a piece for a pawn ahead with the king a little
#   exposed; that branch is modelled as an honest assessment. The queen grab 8...Nxd1? is the
#   mistake that walks into the combination.
# - The strongest 7th move is 7...Nxe5, which after 8.Bxe4 is level. It gets its own branch.
#   The trap is a trap because 7...Nxf2 looks natural, not because 7.Bd3 refutes everything.
# - At move eight most of Black's other replies are worse than they look: 8...d6 is mated in
#   two (modelled as a trap branch) and several others in four; those longer mates are not
#   claimed here and the catch-all says only that Black loses decisively.
#
# A private engine cross-check (the Stockfish build the analysis page ships, at moderate
# depth) was used to decide which replies deserve a branch. It is not the source of any claim
# in the lesson: every mate is proved by our own search, and every capture or count was read
# off the derived board.
