tree:
  annotation:
    vi: 'Trắng vừa đưa tượng ra d3. Tượng đánh vào mã e4 không được bảo vệ, còn mã e5 đang đánh mã g6. Đen có một nước trông rất hấp dẫn: 7...Nxf2, mã ăn tốt f2 và cùng lúc tấn công hậu d1, xe h1 và tượng d3.'
    en: 'White has just brought the bishop out to d3. It attacks the undefended knight on e4, while the knight on e5 attacks the knight on g6. Black has one very tempting move: 7...Nxf2, taking the f2 pawn and attacking the queen on d1, the rook on h1 and the bishop on d3 all at once.'
    fr: "Les Blancs viennent de sortir le fou en d3. Il attaque le cavalier e4 non défendu, tandis que le cavalier e5 attaque le cavalier g6. Les Noirs ont un coup très tentant : 7...Nxf2, qui prend le pion f2 et attaque d'un seul coup la dame d1, la tour h1 et le fou d3."
  dismissRest:
    reason:
      vi: Mỗi nước còn lại đều để một trong hai mã bị bắt, hoặc đưa nó vào một ô bị ăn mất, và Trắng thắng ít nhất một quân đổi lấy một tốt.
      en: Every remaining move leaves one of the two knights to be captured, or puts it on a square where it is taken, and White wins at least a piece for a pawn.
      fr: Chacun des autres coups laisse l'un des deux cavaliers en prise, ou le pose sur une case où il est pris, et les Blancs gagnent au moins une pièce contre un pion.
  dismissed:
    - ply: Nc5
      reason: 7...Nc5 8.Nxg6 Nxd3+ 9.Qxd3 hxg6 trades two pieces each and leaves the game level.
    - ply: Nf6
      reason: 7...Nf6 retreats the attacked knight; 8.Nxg6 hxg6 trades the g6 knight and the game stays roughly level.
    - ply: Nd6
      reason: 7...Nd6 saves the knight, but 8.f4 keeps the e5 knight supported and White is slightly better.
    - ply: f5
      reason: 7...f5 protects the e4 knight with a pawn; 8.Nxg6 hxg6 trades knights and White keeps a small edge.
    - ply: Qe7
      reason: 7...Qe7 hits the e5 knight; after 8.Nxg6 hxg6 the queen guards e4 and White keeps a small edge.
    - ply: Qh4
      reason: 7...Qh4 8.g3 drives the queen back with both black knights still loose; White is clearly better.
    - ply: Qf6
      reason: 7...Qf6 8.Ng4 attacks the queen with both black knights still loose; White is clearly better.
    - ply: Ng5
      reason: '7...Ng5 8.Nxg6 hxg6 9.Qe2+ wins a piece: the check wins the g5 knight.'
    - ply: Nxc3
      reason: 7...Nxc3 8.Bxg6 hxg6 9.Nxc3 leaves White a piece for a pawn ahead.
  children:
    - ply: Nxe5
      replyQuality: best
      frequency: common
      annotation:
        vi: 'Mã g6 ăn mã e5 của Trắng: nó thoát khỏi đòn đánh và đứng giữa bàn cờ. Mã e4 vẫn bị tượng d3 đánh, nên Trắng ăn nó ngay bằng Bxe4.'
        en: "The g6 knight takes White's knight on e5: it escapes the attack and lands in the centre. The e4 knight is still attacked by the d3 bishop, so White takes it at once with Bxe4."
        fr: "Le cavalier g6 prend le cavalier e5 des Blancs : il échappe à l'attaque et se pose au centre. Le cavalier e4 reste attaqué par le fou d3, les Blancs le prennent donc aussitôt avec Bxe4."
      children:
        - ply: Bxe4
          annotation:
            vi: Tượng d3 ăn mã e4 và trả quân số về cân bằng. Mã e5 của Đen đứng giữa bàn cờ, còn tượng e4 của Trắng chĩa về h7.
            en: The d3 bishop takes the e4 knight and restores the material balance. Black's knight stands on e5 in the middle of the board and White's bishop on e4 points at h7.
            fr: Le fou d3 prend le cavalier e4 et rétablit l'équilibre matériel. Le cavalier noir se tient en e5 au centre de l'échiquier, et le fou e4 blanc vise h7.
          outcome:
            type: position
            evaluation:
              vi: 'Quân số hoàn toàn cân bằng: mỗi bên mất một mã, còn bảy tốt và cùng số quân (hậu, hai xe, hai tượng, một mã). Tượng e4 của Trắng chĩa vào h7, còn tốt d5 hạn chế các ô c6 và e6 của Đen; mã e5 của Đen đứng vững ở trung tâm. Thế cờ ngang, và đây là cách đáp đúng của Đen: ở đây không có cái bẫy nào.'
              en: "Material is exactly level: each side has lost a knight and has seven pawns and the same pieces (queen, two rooks, two bishops, one knight). White's bishop on e4 bears on h7 and the d5 pawn takes c6 and e6 from Black, while Black's knight on e5 stands firmly in the centre. The position is level and this is the correct answer for Black: there is no trap here."
              fr: "Le matériel est rigoureusement égal : chaque camp a perdu un cavalier et possède sept pions et les mêmes pièces (dame, deux tours, deux fous, un cavalier). Le fou e4 blanc vise h7 et le pion d5 ôte c6 et e6 aux Noirs, tandis que le cavalier e5 noir est solidement installé au centre. La position est égale et c'est la bonne réponse des Noirs : il n'y a pas de piège ici."
            plan:
              vi: Trắng phát triển nốt (nhập thành, Bf4 đánh vào mã e5), còn Đen đưa tượng ra c5 hoặc d6 rồi nhập thành. Mã e5 chỉ nên đổi khi có lợi, vì tốt d5 làm các quân nhẹ còn lại của Đen khó ra.
              en: White finishes development (castling, Bf4 hitting the e5 knight); Black brings a bishop out to c5 or d6 and castles. The e5 knight should only be traded on good terms, because the d5 pawn makes it harder for Black's other minor pieces to come out.
              fr: Les Blancs achèvent leur développement (roque, Bf4 contre le cavalier e5) ; les Noirs sortent un fou en c5 ou d6 puis roquent. Le cavalier e5 ne doit être échangé qu'à de bonnes conditions, car le pion d5 gêne la sortie des autres pièces mineures noires.
            basis:
              by: chan
              at: 2026-10-01
    - ply: Nxf2
      replyQuality: mistake
      frequency: common
      annotation:
        vi: 'Mã e4 ăn tốt f2 và chĩa ba quân: hậu d1, xe h1 và tượng d3 cùng bị tấn công. Nhìn thì Đen thắng hậu hoặc xe, nhưng mã g6 vẫn đang bị mã e5 đánh và Đen sắp phải trả giá cho điều đó.'
        en: 'The e4 knight takes the f2 pawn and forks three pieces: the queen on d1, the rook on h1 and the bishop on d3 are all attacked. It looks as if Black wins the queen or a rook, but the g6 knight is still attacked by the e5 knight and Black is about to pay for it.'
        fr: 'Le cavalier e4 prend le pion f2 et fourche trois pièces : la dame d1, la tour h1 et le fou d3 sont toutes attaquées. On croirait que les Noirs gagnent la dame ou une tour, mais le cavalier g6 reste attaqué par le cavalier e5 et les Noirs vont devoir le payer.'
      children:
        - ply: Bxg6
          annotation:
            vi: 'Trắng bỏ mặc cú chĩa: 8.Bxg6 ăn mã g6. Tượng đứng trên g6 đánh vào f7 và h7, và cùng với mã e5 nó đánh vào f7, nơi chỉ có vua Đen canh giữ.'
            en: 'White ignores the fork: 8.Bxg6 takes the g6 knight. The bishop on g6 attacks f7 and h7, and together with the e5 knight it attacks f7, which only the black king guards.'
            fr: 'Les Blancs ignorent la fourchette : 8.Bxg6 prend le cavalier g6. Le fou en g6 attaque f7 et h7, et avec le cavalier e5 il attaque f7, que seul le roi noir garde.'
          dismissRest:
            reason:
              vi: 'Mọi nước còn lại đều không tốt hơn 8...hxg6: tượng g6 và mã e5 vẫn cùng nhắm vào f7, mã f2 của Đen vẫn lơ lửng, và Trắng giữ lợi thế rõ rệt trong từng nước.'
              en: 'Every other move is no better than 8...hxg6: the g6 bishop and the e5 knight still attack f7 together, the black knight on f2 is still loose, and White keeps a clear advantage in each.'
              fr: "Tout autre coup ne vaut pas mieux que 8...hxg6 : le fou g6 et le cavalier e5 attaquent toujours f7 ensemble, le cavalier noir f2 est toujours en l'air, et les Blancs gardent un avantage net dans chaque cas."
          dismissed:
            - ply: fxg6
              reason: 8...fxg6 9.Kxf2 (or 9.Qe2 first) again leaves White a piece for a pawn ahead; same assessment as 8...hxg6.
            - ply: Bc5
              reason: 8...Bc5 9.Bxf7+ Kf8 10.Qf3 and White is clearly ahead.
          children:
            - ply: hxg6
              replyQuality: best
              frequency: common
              annotation:
                vi: 'Tốt h ăn lại tượng. Đây là cách phòng thủ tốt nhất của Đen: cột h mở ra cho xe, còn mã f2 vẫn đang chĩa vào hậu và xe. Trắng ăn mã f2 bằng vua.'
                en: "The h-pawn recaptures the bishop. This is Black's best defence: the h-file opens for the rook, and the knight on f2 still forks the queen and the rook. White takes that knight with the king."
                fr: "Le pion h reprend le fou. C'est la meilleure défense des Noirs : la colonne h s'ouvre pour la tour, et le cavalier f2 fourche toujours la dame et la tour. Les Blancs prennent ce cavalier avec le roi."
              children:
                - ply: Kxf2
                  annotation:
                    vi: Vua Trắng ăn mã f2, chấm dứt cú chĩa và giữ lại quân dư.
                    en: The white king takes the knight on f2, ending the fork and keeping the extra piece.
                    fr: Le roi blanc prend le cavalier f2, met fin à la fourchette et garde la pièce de plus.
                  outcome:
                    type: position
                    evaluation:
                      vi: 'Trắng hơn một quân đổi lấy một tốt: Trắng còn hai mã và một tượng cùng sáu tốt, Đen chỉ còn hai tượng và bảy tốt. Hai tốt g của Đen bị chồng (g7 và g6), một khuyết tật không sửa được. Đổi lại vua Trắng đã mất quyền nhập thành và đứng ở f2, trên đường chiếu của ...Bc5+ và ...Qh4+.'
                      en: "White is a piece for a pawn ahead: White has two knights and a bishop with six pawns, Black has only two bishops with seven. Black's g-pawns are doubled (g7 and g6), a defect that cannot be repaired. In return the white king has lost the right to castle and stands on f2, in the line of ...Bc5+ and ...Qh4+."
                      fr: 'Les Blancs ont une pièce de plus pour un pion : deux cavaliers et un fou avec six pions, contre deux fous seulement et sept pions. Les pions g noirs sont doublés (g7 et g6), un défaut irréparable. En contrepartie le roi blanc a perdu le droit de roquer et se trouve en f2, sur la ligne de ...Bc5+ et ...Qh4+.'
                    plan:
                      vi: Trắng đáp các nước chiếu bằng nước chặn (Be3 trước ...Bc5+, g3 trước ...Qh4+) rồi đổi bớt quân để giữ quân dư ra. Đen dùng cột h mở và hai tượng để tạo đe doạ liên tục, nhưng phải tìm ra cách bù đắp cho một quân.
                      en: White answers the checks with blocks (Be3 against ...Bc5+, g3 against ...Qh4+) and then trades pieces to keep the extra one. Black uses the open h-file and the two bishops to keep making threats, but has to find a way to make up for a piece.
                      fr: Les Blancs répondent aux échecs par des interpositions (Be3 contre ...Bc5+, g3 contre ...Qh4+) puis échangent des pièces pour conserver la pièce de plus. Les Noirs se servent de la colonne h ouverte et des deux fous pour menacer sans cesse, mais doivent trouver de quoi compenser une pièce.
                    basis:
                      by: chan
                      at: 2026-10-01
