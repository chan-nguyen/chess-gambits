    source: "A judgement, and the same label `traps.yaml` carries. It is about White's play from move seven: against Black's best reply 7...Nxe5 White is level, and against 7...Nxf2 White keeps a piece for a pawn even if Black finds 8...hxg6, so nothing in this entry depends on the opponent cooperating. The mates are not a judgement; they are proved. An engine was used privately at moderate depth to find the replies worth modelling and is not the source of any claim."
judgement:
  by: chan
