tree:
  annotation:
    vi: Sau khi Đen ăn tốt d4, Trắng đẩy luôn 6.e5 đuổi mã f6, giành không gian và nhịp độ ngay giữa
      khai cuộc.
    en:
      After Black takes the d4 pawn, White immediately pushes 6.e5 to chase the knight on f6, grabbing
      space and tempo right in the opening.
    fr: Après la prise du pion d4 par les Noirs, les Blancs poussent aussitôt 6.e5 pour chasser le
      cavalier f6, gagnant espace et temps en plein milieu de l'ouverture.
  dismissRest:
    reason:
      vi:
        Mã f6 lùi theo cách khác ngoài Ng4, ví dụ Ne4 hay Nd5. Đánh giá chung — Trắng kém một tốt, có
        không gian và nhịp độ bù lại — không đổi nhiều theo ô mã lùi về.
      en: The knight on f6 retreats some other way than Ng4, for instance Ne4 or Nd5. The overall
        assessment — White down a pawn, compensated by space and tempo — does not change much
        depending on the retreat square.
      fr:
        Le cavalier f6 recule autrement que par Ng4, par exemple Ne4 ou Nd5. L'évaluation générale — les
        Blancs à un pion de moins, compensés par l'espace et le temps — ne change guère selon la
        case de repli.
  children:
    - ply: Ng4
      replyQuality: best
      frequency: common
      annotation:
        vi: Bị tốt e5 đuổi, mã f6 nhảy sang g4 thay vì lùi về e4 hay g8, giữ quân hoạt động và nhắm vào f2.
        en:
          Chased by the e5 pawn, the knight on f6 jumps to g4 instead of retreating to e4 or g8, staying
          active and eyeing f2.
        fr:
          Chassé par le pion e5, le cavalier f6 saute en g4 au lieu de reculer en e4 ou g8, restant actif
          et visant f2.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 7 còn Đen 8 — Đen hơn đúng một tốt sạch.
          en: Count the pawns and it is 7 for White against 8 for Black — Black is up one clean pawn.
          fr:
            "Comptez les pions : 7 pour les Blancs contre 8 pour les Noirs — les Noirs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng chơi O-O hoặc Qe2, bảo vệ f2 và tranh thủ tốt e5 cản trở quân Đen phát triển. Đen chơi Bc5
            hoặc d6, tìm cách khai thác ô yếu quanh f2 và đưa quân về hỗ trợ mã g4.
          en:
            White plays O-O or Qe2, defending f2 and using the e5 pawn to cramp Black's development. Black
            plays Bc5 or d6, trying to exploit the weak squares around f2 and bring pieces up to
            support the knight on g4.
          fr:
            Les Blancs jouent O-O ou Qe2, défendant f2 et utilisant le pion e5 pour gêner le développement
            noir. Les Noirs jouent Bc5 ou d6, cherchant à exploiter les cases faibles autour de f2
            et à amener des pièces pour soutenir le cavalier g4.
        basis:
          by: chan
          at: 2026-09-29
