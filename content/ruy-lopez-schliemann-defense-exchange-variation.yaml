# Ruy Lopez: Schliemann Defense, Exchange Variation. The catalogue's line is 1.e4 e5 2.Nf3 Nc6
# 3.Bb5 f5 4.Bxc6, which ends on White's ply; with Black as the learner that would make the root a
# learner node, so the defining line here stops at 3...f5 and 4.Bxc6 is modelled as the opponent's
# reply (docs/CONTEXT.md, invariant 5; the catalogue check accepts a prefix). Replayed with chess.js
# through 4...dxc6 5.d3. searchMate at 3 moves from the resulting position returns no-mate, so no
# forced mate is claimed anywhere in this entry, and no capture is left going free at the leaf.
id: ruy-lopez-schliemann-defense-exchange-variation
name: 'Ruy Lopez: Schliemann Defense, Exchange Variation'
eco: C63
category: gambit
side: black
definingLine: [e4, e5, Nf3, Nc6, Bb5, f5]
soundness:
  value: dubious
  reviewedAt: '2026-09-30'
  basis:
    by: chan
