tree:
  annotation:
    vi: Trắng vừa chơi 4.d4, chiếm trung tâm bằng tốt d4 và e4 và để tốt f4 của Đen bị tượng c1 tấn công mà không có quân bảo vệ. Trắng kém một tốt, bảy đối tám.
    en: White has just played 4.d4, taking the centre with pawns on d4 and e4 and leaving Black's pawn on f4 attacked by the bishop on c1 with no defender. White is a pawn down, seven to eight.
    fr: Les Blancs viennent de jouer 4.d4, occupant le centre avec des pions en d4 et e4 et laissant le pion f4 noir attaqué par le fou c1 sans défenseur. Les Blancs sont un pion en moins, sept contre huit.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 4...Qh4+. Bài này chỉ đi theo nhánh chiếu 4...Qh4+; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 4...Qh4+ here. This entry follows the check 4...Qh4+ only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 4...Qh4+. Cette fiche ne suit que l'échec 4...Qh4+ ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Qh4+
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen chiếu ngay bằng 4...Qh4+, đồng thời bảo vệ tốt f4. Trắng có thể chắn bằng g3 hoặc đi vua lên d2 hay e2.
        en: Black checks at once with 4...Qh4+, which also defends the pawn on f4. White can block with g3 or move the king, to d2 or e2.
        fr: Les Noirs font aussitôt échec par 4...Qh4+, ce qui défend aussi le pion f4. Les Blancs peuvent s'interposer par g3 ou déplacer le roi, en d2 ou en e2.
      children:
        - ply: Ke2
          annotation:
            vi: Trắng đáp 5.Ke2, đưa vua lên e2 và từ bỏ quyền nhập thành; tốt h2 bị hậu h4 tấn công nhưng được xe h1 bảo vệ.
            en: White answers 5.Ke2, walking the king to e2 and giving up castling; the h2 pawn is attacked by the queen on h4 but defended by the rook on h1.
            fr: Les Blancs répondent 5.Ke2, portant le roi en e2 et renonçant au roque ; le pion h2 est attaqué par la dame h4 mais défendu par la tour h1.
          outcome:
            type: position
            evaluation:
              vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt. Vua Trắng ở e2 đã mất cả hai quyền nhập thành, còn Đen vẫn giữ cả hai. Tốt f4 của Đen bị tượng c1 tấn công và được hậu h4 bảo vệ.'
              en: "Count the pawns: White seven, Black eight, so White is a pawn down. White's king on e2 has lost both castling rights, while Black keeps both. Black's pawn on f4 is attacked by the bishop on c1 and defended by the queen on h4."
              fr: 'Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins. Le roi blanc, en e2, a perdu les deux droits de roque, alors que les Noirs gardent les deux. Le pion f4 noir est attaqué par le fou c1 et défendu par la dame h4.'
            plan:
              vi: Đen phát triển bằng ...Nf6 hoặc ...d6 và giữ tốt thừa; Trắng đuổi hậu bằng Nf3 rồi chỉ lấy lại tốt bằng Bxf4 khi hậu không còn giữ tốt đó.
              en: Black develops with ...Nf6 or ...d6, keeping the extra pawn; White drives the queen away with Nf3 and takes back on f4 with Bxf4 only once the queen no longer guards that pawn.
              fr: Les Noirs se développent par ...Nf6 ou ...d6 en gardant le pion en plus ; les Blancs chassent la dame par Nf3 puis ne reprennent en f4 par Bxf4 que lorsque la dame ne garde plus ce pion.
            basis:
              by: chan
              at: '2026-09-30'
