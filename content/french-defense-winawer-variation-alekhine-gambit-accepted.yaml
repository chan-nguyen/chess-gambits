        vi: Alekhine Gambit Accepted. Đen chơi Bxc3+, ăn mã trên c3.
        en: The Alekhine Gambit Accepted. Black plays Bxc3+, capturing the knight on c3.
        fr: Le Alekhine Gambit Accepted. Les Noirs jouent Bxc3+, en prenant le cavalier en c3.
      children:
        - ply: bxc3
          annotation:
            vi:
              Trắng ăn lại tượng vừa chiếu tướng trên c3 bằng bxc3, cách vừa giải quyết chiếu tướng vừa lấy
              lại quân.
            en:
              White recaptures the checking bishop on c3 with bxc3, the only way to deal with the check that
              also wins the piece back.
            fr:
              Les Blancs reprennent le fou qui donnait l'échec en c3 par bxc3, la façon de répondre à l'échec
              qui reprend aussi la pièce.
          outcome:
            type: position
            evaluation:
              vi:
                'Đếm quân: Đen thừa 1 mã, Trắng thừa 1 tượng. Cộng thêm tốt (Trắng 7, Đen 8), tính ra Đen hơn
                khoảng 1 tốt quy đổi. Cả hai vua đều chưa nhập thành, vẫn còn đứng giữa bàn cờ.'
              en:
                "Counting the pieces: Black has an extra knight, White has an extra bishop. With the pawns at 7
                for White and 8 for Black, that is Black ahead by roughly 1 pawn's worth of
                material. Neither king has castled yet; both are still in the centre."
              fr:
                "En comptant les pièces : les Noirs ont un cavalier de plus et les Blancs ont un fou de plus.
                Avec les pions (7 pour les Blancs, 8 pour les Noirs), cela fait les Noirs en avance
                d'environ 1 pion de matériel. Aucun des deux rois n'a encore roqué ; tous deux
                restent au centre."
            plan:
              vi:
                Đen tìm cách giữ vững phần vật chất hơn, đổi quân khi thuận lợi và hoàn thiện phát triển mà
                không mạo hiểm. Trắng chơi vì tốc độ phát triển và các đường mở nhắm vào vua Đen, cố
                gắng chứng minh giá trị của quân đã thí trước khi đối phương kịp gỡ rối.
              en:
                Black looks to consolidate the extra material, trade pieces when it is convenient, and finish
                development without taking risks. White plays for rapid development and open lines
                toward the black king, trying to make the sacrifice count before Black untangles.
              fr:
                Les Noirs cherchent à consolider le surplus de matériel, échanger les pièces quand cela les
                arrange, et terminer leur développement sans prendre de risques. Les Blancs jouent
                pour un développement rapide et des lignes ouvertes vers le roi noir, essayant de
                rentabiliser le sacrifice avant que les Noirs ne se démêlent.
            basis:
              by: chan
              at: 2026-09-29
