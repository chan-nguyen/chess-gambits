# Scandinavian Defense: Blackburne Gambit. Frozen defining line 1.e4 d5 2.exd5 c6 3.dxc6
# Nxc6, which ends on Black's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). The line below was replayed with chess.js before being annotated.
id: scandinavian-defense-blackburne-gambit
name: 'Scandinavian Defense: Blackburne Gambit'
eco: B01
category: gambit
side: black
definingLine: [e4, d5, exd5, c6, dxc6, Nxc6]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. Black gives up a full pawn for open lines and quick development, but
      White simply keeps the extra pawn with ordinary play, and Black no longer has a
      c-pawn or a d-pawn to ever contest the centre with again — real practical chances, but
      not enough to call the pawn sacrifice sound. No engine was consulted and no database
      was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Thay vì chơi 2...Nf6 truyền thống, Đen chơi 2...c6!?, mời Trắng ăn thêm một tốt nữa để đổi lấy các đường mở và một nhịp phát triển nhanh sau khi ăn lại bằng mã.
    en: Instead of the traditional 2...Nf6, Black plays 2...c6!?, inviting White to take yet another pawn in exchange for open lines and a quick tempo of development after recapturing with the knight.
    fr: Au lieu du traditionnel 2...Nf6, les Noirs jouent 2...c6!?, invitant les Blancs à prendre un pion de plus en échange de lignes ouvertes et d'un développement rapide après avoir repris avec le cavalier.
  dismissRest:
    reason:
      vi: Trắng không đẩy tốt lên d4. Các nước khác như Nf3 hay Nc3 phát triển trước và để nguyên tình huống trung tâm, và Đen vẫn tiếp tục phát triển bình thường mà không gặp vấn đề gì đặc biệt.
      en: White does not push the pawn to d4. Anything else, such as Nf3 or Nc3 developing first, leaves the central situation as it is, and Black simply continues developing normally without any particular problem.
      fr: Les Blancs ne poussent pas le pion en d4. Tout le reste, comme Nf3 ou Nc3 qui développent d'abord, laisse la situation centrale telle quelle, et les Noirs poursuivent simplement leur développement normal sans problème particulier.
  children:
    - ply: d4
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng đẩy tốt lên d4, chiếm thêm không gian trung tâm và chuẩn bị phát triển các quân nhẹ một cách tự nhiên.
        en: White pushes the pawn to d4, grabbing extra central space and preparing to develop the minor pieces naturally.
        fr: Les Blancs poussent le pion en d4, gagnant de l'espace central supplémentaire et se préparant à développer naturellement les pièces mineures.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 38 còn Đen 37 — Trắng hơn đúng một tốt sạch. Đen cũng không còn tốt c hay tốt d nào nữa, nghĩa là các ô c6 và d5 sẽ không bao giờ còn được một con tốt Đen nào kiểm soát lại, một nhược điểm cấu trúc lâu dài chứ không chỉ là chuyện thiếu một tốt.
          en: Count the pawns, 38 for White against 37 for Black — White is a clean pawn up. Black also no longer has a c-pawn or a d-pawn at all, meaning the c6 and d5 squares can never be covered by a black pawn again, a lasting structural weakness on top of the missing pawn itself.
          fr: Comptez les pions, 38 pour les Blancs contre 37 pour les Noirs — les Blancs ont un pion de plus tout net. Les Noirs n'ont plus non plus de pion c ni de pion d, ce qui signifie que les cases c6 et d5 ne pourront plus jamais être couvertes par un pion noir, une faiblesse structurelle durable qui s'ajoute au pion manquant lui-même.
        plan:
          vi: Trắng chơi Nf3, Nc3 và Bc4 hay Be2, hoàn tất phát triển nhanh chóng và nhắm quân vào các ô yếu c6, d5 hay b5 về sau, giữ vững con tốt thừa. Đen chơi Nf6, g6, Bg7 và O-O, dựa vào cặp tượng linh hoạt cùng lối chơi năng động để bù lại phần nào con tốt đã mất.
          en: White plays Nf3, Nc3 and Bc4 or Be2, finishing development quickly and later aiming pieces at the weak c6, d5 or b5 squares, holding on to the extra pawn. Black plays Nf6, g6, Bg7 and O-O, relying on active piece play and the bishop pair to make up some ground for the lost pawn.
          fr: Les Blancs jouent Nf3, Nc3 et Bc4 ou Be2, achevant rapidement leur développement et visant plus tard les cases faibles c6, d5 ou b5, tout en conservant le pion supplémentaire. Les Noirs jouent Nf6, g6, Bg7 et O-O, comptant sur un jeu actif et la paire de fous pour compenser un peu le pion perdu.
        basis:
          by: chan
          at: '2026-09-25'
