tree:
  annotation:
    vi: Sau khi cả hai bên đã nhập thành và Trắng chơi 11.Qe2, đưa hậu ra vị trí hoạt động chuẩn của
      toàn bộ hệ thống, Đen tiếp tục hoàn thiện phát triển.
    en: After both sides have castled and White plays 11.Qe2, bringing the queen to the system's
      standard active square, Black continues completing development.
    fr:
      Après que les deux camps ont roqué et que les Blancs jouent 11.Qe2, amenant la dame sur la case
      active habituelle du système, les Noirs poursuivent leur développement.
  dismissRest:
    reason:
      vi:
        'Đen chọn một cách sắp xếp quân khác ở đây. Đánh giá chung không đổi: Trắng vẫn kém đúng một tốt
        nhưng đổi lại có lợi thế phát triển và các đường mở, bất kể Đen chọn bố trí quân theo cách
        nào.'
      en:
        'Black sets up some other way here. The overall assessment does not change: White is still down
        exactly one pawn but has the development lead and the open lines in exchange, whichever plan
        Black chooses.'
      fr:
        "Les Noirs adoptent une autre disposition ici. L'évaluation générale ne change pas : les Blancs
        restent avec un pion de moins mais gardent l'avance de développement et les colonnes
        ouvertes en échange, quel que soit le plan noir."
  children:
    - ply: Nf6
      replyQuality: good
      frequency: occasional
      annotation:
        vi:
          Đen mới đưa tượng ra e7, giờ tiếp tục với Nf6, hoàn thiện phát triển cánh vua theo lối Finegold
          Defense.
        en:
          Black has just developed the bishop to e7, and now continues with Nf6, finishing kingside
          development in Finegold Defense style.
        fr:
          Les Noirs viennent de développer le fou en e7, et poursuivent maintenant avec Nf6, achevant le
          développement de l'aile roi à la manière de la Défense Finegold.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 6 còn Đen 7 — Đen hơn đúng một tốt sạch.
          en: Count the pawns and it is 6 for White against 7 for Black — Black is up one clean pawn.
          fr:
            "Comptez les pions : 6 pour les Blancs contre 7 pour les Noirs — les Noirs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng triển khai tự nhiên với Qe2, Rd1 (hoặc Rfd1 nếu đã nhập thành) và đôi khi Bf4/Bg5, dồn
            quân vào các đường mở và cánh hậu Đen đổi lại con tốt đã mất. Đen tranh thủ hoàn thiện
            phát triển, nhập thành cho an toàn, và cố giữ con tốt thừa qua giai đoạn khai cuộc nguy
            hiểm nhất.
          en:
            White develops naturally with Qe2, Rd1 (or Rfd1 once castled) and sometimes Bf4/Bg5, aiming
            pieces down the open lines and at Black's queenside in exchange for the missing pawn.
            Black uses the tempo to finish development, castle to safety, and try to hold on to the
            extra pawn through the sharpest part of the opening.
          fr:
            Les Blancs se développent normalement avec Qe2, Rd1 (ou Rfd1 après le roque) et parfois Bf4/Bg5,
            dirigeant leurs pièces vers les colonnes ouvertes et l'aile dame noire en échange du
            pion manquant. Les Noirs profitent du temps gagné pour achever leur développement,
            roquer et tenter de conserver le pion supplémentaire pendant la phase la plus périlleuse
            de l'ouverture.
        basis:
          by: chan
