# Benko Gambit: Nd2 Variation. Frozen defining line 1.d4 Nf6 2.c4 c5 3.d5 b5 4.cxb5 a6
# 5.bxa6 Bxa6 6.Nc3 d6 7.Nf3 g6, which ends on Black's own ply, so the root is an
# opponent node (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 8.Nd2.
# searchMate at 3 moves from the resulting position returns no-mate, so no forced mate
# is claimed anywhere in this entry, and no capture is left going free at the leaf.
