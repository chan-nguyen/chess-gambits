# King's Gambit Accepted, Bishop's Gambit, Kieseritzky Gambit. One of eighteen entries
# tracked by issue #111 (group H), sharing the trunk `1.e4 e5 2.f4 exf4 3.Bc4` with
# `kings-gambit-accepted.yaml` and group G (#110). Defining line ends on White's 3.Bc4
# (invariant 5). Every move replayed with a scratch chess.js script (deleted before commit):
# 3...b5 4.Bxb5 was confirmed legal, with the b5 pawn undefended (nothing recaptures on b5),
# and material returning to level (a second, separate pawn sacrifice repaid).
#
# 3...b5 is a further pawn sacrifice offered to deflect the bishop away from its attack on
# f7. The tried continuation named in the evaluation, 4...Nf6, was also replayed with
# chess.js. Under the stricter #107 bar, the position after 4.Bxb5 restores only material
# parity — not a two-point edge — and the resulting queenside/central imbalance is
# genuinely double edged rather than an unambiguous catastrophe for either side, so the
# leaf states that plainly instead of forcing a verdict or reverting to `unexplored`.
