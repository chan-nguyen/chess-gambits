tree:
  annotation:
    vi: Trắng vừa chơi 6.Qe2, bảo vệ mã f3 và nhìn xuống cột e. Mã e4 của Đen bị mã c3 và hậu tấn công hai lần mà chỉ có tốt d5 bảo vệ, còn tượng g4 tấn công mã f3, vốn được hậu và tốt g2 bảo vệ. Mỗi bên có bảy tốt.
    en: White has just played 6.Qe2, defending the knight on f3 and looking down the e-file. Black's knight on e4 is attacked twice, by the knight on c3 and the queen, and defended only by the d5 pawn, while the bishop on g4 attacks the knight on f3, which the queen and the g2 pawn defend. Each side has seven pawns.
    fr: Les Blancs viennent de jouer 6.Qe2, défendant le cavalier f3 et regardant la colonne e. Le cavalier noir e4 est attaqué deux fois, par le cavalier c3 et la dame, et défendu seulement par le pion d5, tandis que le fou g4 attaque le cavalier f3, que la dame et le pion g2 défendent. Chaque camp a sept pions.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 6...Nc6. Bài này chỉ đi theo nhánh 6...Nc6; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 6...Nc6 here. This entry follows the reply 6...Nc6 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 6...Nc6. Cette fiche ne suit que la réponse 6...Nc6 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Nc6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen phát triển bằng 6...Nc6, tấn công tốt e5, vốn chỉ có mã f3 bảo vệ.
        en: Black develops with 6...Nc6, attacking the pawn on e5, which only the knight on f3 defends.
        fr: Les Noirs se développent par 6...Nc6, attaquant le pion e5, que seul le cavalier f3 défend.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: mỗi bên bảy tốt, nên vật chất cân bằng. Tốt e5 bị mã c6 tấn công một lần và được mã f3 bảo vệ một lần; mã f3 bị tượng g4 tấn công và đứng trước hậu e2. Mã e4 của Đen bị mã c3 và hậu tấn công hai lần và chỉ có tốt d5 bảo vệ một lần.'
          en: "Count the pawns: seven each, so material is level. The pawn on e5 is attacked once, by the knight on c6, and defended once, by the knight on f3; the knight on f3 is attacked by the bishop on g4 and stands in front of the queen on e2. Black's knight on e4 is attacked twice, by the knight on c3 and the queen, and defended once, by the d5 pawn."
          fr: 'Comptez les pions : sept de chaque côté, donc le matériel est égal. Le pion e5 est attaqué une fois, par le cavalier c6, et défendu une fois, par le cavalier f3 ; le cavalier f3 est attaqué par le fou g4 et se trouve devant la dame e2. Le cavalier noir e4 est attaqué deux fois, par le cavalier c3 et la dame, et défendu une fois, par le pion d5.'
        plan:
          vi: Trắng có thể mở đầu bằng Nxe4, loại bỏ con mã đang tấn công c3 và d2. Đen có thể ăn f3 bằng ...Bxf3, loại bỏ quân bảo vệ e5, hoặc tăng sức ép bằng ...Bc5.
          en: White can begin with Nxe4, removing the knight that attacks c3 and d2. Black can take on f3 with ...Bxf3, removing the defender of e5, or add pressure with ...Bc5.
          fr: Les Blancs peuvent commencer par Nxe4, supprimant le cavalier qui attaque c3 et d2. Les Noirs peuvent prendre en f3 par ...Bxf3, supprimant le défenseur de e5, ou ajouter de la pression par ...Bc5.
        basis:
          by: chan
          at: '2026-09-30'
