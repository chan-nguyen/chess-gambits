# Sicilian Defense: Dragon Variation, Classical Variation, Zollner Gambit. Frozen defining line
# 1.e4 c5 2.Nf3 Nc6 3.d4 cxd4 4.Nxd4 g6 5.Be3 Bg7 6.Be2 Nf6 7.Nc3 O-O 8.O-O d6 9.f4 Qb6 10.e5, which
# ends on White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). Replayed
# with chess.js through 10...Qxb2 11.Ncb5. The leaf has Black to move, but every capture open to
# Black there is answered by a recapture. searchMate at 3 moves from the resulting position returns
# no-mate, so no forced mate is claimed anywhere in this entry.
id: dragon-variation-classical-variation-zollner-gambit
name: 'Sicilian Defense: Dragon Variation, Classical Variation, Zollner Gambit'
