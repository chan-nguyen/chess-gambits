tree:
  annotation:
    vi: Trắng đã chơi xong 1.e4 c5 2.f4 d5 3.Nf3 theo kiểu chuyển vị Bird/Hà Lan đảo, để ngỏ tốt e4 cho Đen ăn. Đen phải quyết định có nhận tốt hay không.
    en: White has played 1.e4 c5 2.f4 d5 3.Nf3, a Bird-like reversed Dutch move order, leaving the e4 pawn open for Black to take. Black must decide whether to accept.
    fr: "Les Blancs ont joué 1.e4 c5 2.f4 d5 3.Nf3, un ordre de coups à la Bird façon Hollandaise inversée, laissant le pion e4 à prendre pour les Noirs. Les Noirs doivent décider s'ils l'acceptent."
  dismissRest:
    reason:
      vi: 'Đen chọn cách khác thay vì ...dxe4 ở đây, ví dụ giữ căng thẳng bằng ...Nc6. Đánh giá tương tự: Trắng luôn có đền bù về phát triển cho tốt đã để ngỏ, bất kể Đen chọn hướng nào.'
      en: 'Black plays something other than ...dxe4 here, for instance keeping the tension with ...Nc6. The assessment is similar throughout: White always gets development in return for the pawn left open, whichever way Black goes.'
      fr: "Les Noirs jouent autre chose que ...dxe4 ici, par exemple en gardant la tension par ...Nc6. L'évaluation reste similaire : les Blancs obtiennent toujours du développement en échange du pion laissé libre."
  children:
    - ply: dxe4
      replyQuality: good
