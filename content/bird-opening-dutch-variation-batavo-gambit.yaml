      annotation:
        vi: Đen ăn tốt e4, chấp nhận đòn Batavo Gambit của Trắng.
        en: "Black captures the e4 pawn, accepting White's Batavo Gambit."
        fr: Les Noirs prennent le pion e4, acceptant le Gambit Batavo des Blancs.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám — Trắng kém một tốt. Đổi lại, mã Trắng đã phát triển ra f3 và có thể tiếp tục Nc3 tấn công lại tốt e4, trong khi Đen chưa đưa quân nào ra.'
          en: "Count the pawns: White seven, Black eight — White is down one pawn. In return, White's knight is already out on f3 and can follow with Nc3 to attack the e4 pawn again, while Black has not developed a single piece."
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs — les Blancs ont un pion de moins. En contrepartie, le cavalier blanc est déjà sorti en f3 et peut enchaîner par Nc3 pour attaquer à nouveau le pion e4, tandis que les Noirs n'ont développé aucune pièce."
        plan:
          vi: Trắng chơi Nc3 tấn công tốt e4 lần nữa, sẵn sàng lấy lại vật chất hoặc chấp nhận đổi lấy phát triển nhanh. Đen củng cố tốt e4 bằng ...Nc6 hoặc ...Nf6, hoặc trả lại tốt bằng ...e5 để đơn giản hoá.
          en: White plays Nc3, attacking the e4 pawn again, ready either to win the material back or to accept trading it for fast development. Black defends the e4 pawn with ...Nc6 or ...Nf6, or hands it back with ...e5 to simplify.
          fr: "Les Blancs jouent Nc3, attaquant à nouveau le pion e4, prêts soit à regagner le matériel soit à l'échanger contre un développement rapide. Les Noirs défendent le pion e4 par ...Nc6 ou ...Nf6, ou le rendent par ...e5 pour simplifier."
