  basis:
    by: chan
    at: '2026-10-01'
    source: >-
      A judgement. At the end of the defining line White has castled without recapturing on
      d4, so White is a pawn down, seven pawns against eight. Black's pawns are doubled on
      d5 and d4, but the d4 pawn is attacked twice and defended twice, so the pawn is not
      coming back by force, while Black has not castled. Nothing on the board yet repays the
      pawn, which is why the entry is rated dubious. No engine was consulted and no database
      was queried.
judgement:
  by: chan
  at: '2026-10-01'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
