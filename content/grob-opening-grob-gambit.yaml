# Grob Opening, Grob Gambit. One entry in a batch authored for issue #148 (batch h), and the
# shared trunk `1.g4 d5 2.Bg2` for its siblings `grob-opening-grob-gambit-basman-gambit`,
# `-fritz-gambit` and `-richter-grob-gambit`. Defining line ends on White's 2.Bg2 (invariant
# 5). Every ply below was replayed with chess.js before being written.
id: grob-opening-grob-gambit
name: 'Grob Opening: Grob Gambit'
eco: A00
category: gambit
side: white
definingLine: [g4, d5, Bg2]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. Once 1...d5 is played the g4 pawn is simply hanging to the c8 bishop, and
      taking it costs Black nothing beyond a slightly displaced bishop. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa fianchetto tượng lên g2, con tượng ấy sẽ nhìn suốt đường chéo dài a8-h1. Nhưng con tốt g4 vẫn còn đó, và đường chéo c8-h3 đã mở toang từ khi Đen chơi 1...d5.
    en: White has just fianchettoed the bishop to g2, where it will rake the long a8-h1 diagonal. But the g4 pawn is still sitting there, and the c8-h3 diagonal has been wide open ever since Black played 1...d5.
    fr: Les Blancs viennent de fianchetter le fou en g2, où il balaiera la grande diagonale a8-h1. Mais le pion g4 est toujours là, et la diagonale c8-h3 est grande ouverte depuis que les Noirs ont joué 1...d5.
  dismissRest:
    reason:
      vi: Đen không ăn tốt g4 — phát triển bằng 2...Nf6 hay chơi 2...c6 (Richter-Grob), 2...h5 (Basman) hay 2...e5 (Keres). Mỗi lựa chọn để nguyên con tốt g4 trên bàn cờ, nghĩa là lời mời vẫn chưa hề được nhận.
      en: Black does not take the g4 pawn — developing with 2...Nf6, or playing 2...c6 (Richter-Grob), 2...h5 (Basman) or 2...e5 (Keres). Each leaves the g4 pawn sitting on the board, meaning the invitation has still not actually been accepted.
      fr: Les Noirs ne prennent pas le pion g4 — développant par 2...Cf6, ou jouant 2...c6 (Richter-Grob), 2...h5 (Basman) ou 2...e5 (Keres). Chacun laisse le pion g4 sur l'échiquier, ce qui veut dire que l'invitation n'a toujours pas été acceptée.
  children:
    - ply: Bxg4
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen nhận lời mời và ăn tốt g4 bằng tượng, quân duy nhất có thể ăn tại đó vì đường chéo đã mở sẵn từ nước 1...d5. Đây chính là Gambit Grob được chấp nhận.
        en: Black accepts and takes the g4 pawn with the bishop, the only piece that can capture there thanks to the diagonal already opened by 1...d5. This is the Grob Gambit accepted.
        fr: Les Noirs acceptent et prennent le pion g4 avec le fou, la seule pièce pouvant capturer là grâce à la diagonale déjà ouverte par 1...d5. C'est le Gambit Grob accepté.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy. Đen hơn đúng một tốt sạch, và con tượng vừa ăn tốt đứng khá an toàn ở g4, chưa bị quân nào của Trắng đe dọa.
          en: Count the pawns and it is eight for Black, seven for White. Black is a clean pawn up, and the bishop that just captured stands fairly safely on g4, not yet threatened by anything White has.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs. Les Noirs ont un pion net d'avance, et le fou qui vient de capturer se tient assez en sécurité en g4, pas encore menacé par quoi que ce soit chez les Blancs.
        plan:
          vi: Trắng chơi c4 hoặc h3 đuổi tượng, rồi Nf3 và O-O, đặt cược vào đường chéo dài và không gian để bù cho con tốt đã mất. Đen lui tượng về d7 hay e6 khi bị đuổi, rồi Nf6 và e6, hoàn thiện phát triển và giữ con tốt thừa làm vốn liếng lâu dài.
          en: White plays c4 or h3 to chase the bishop, then Nf3 and O-O, betting on the long diagonal and space to make up for the lost pawn. Black drops the bishop back to d7 or e6 when chased, then plays Nf6 and e6, completing development and banking the extra pawn as a long-term asset.
          fr: Les Blancs jouent c4 ou h3 pour chasser le fou, puis Nf3 et O-O, misant sur la grande diagonale et l'espace pour compenser le pion perdu. Les Noirs replient le fou en d7 ou e6 quand il est chassé, puis jouent Nf6 et e6, achevant leur développement et conservant le pion supplémentaire comme atout durable.
        basis:
          by: chan
          at: '2026-09-25'
