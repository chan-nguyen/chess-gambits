# Réti Opening: Zilbermints Gambit. Frozen defining line 1.Nf3 d5 2.c4 b5, which ends on
# Black's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). Replayed
# with chess.js: 3.cxb5 simply takes the offered pawn, since nothing of Black's recaptures
# on b5 for free, and nothing else is hanging afterwards. searchMate at 4 moves from this
# position returns unknown, which the stopping rule treats the same as no-mate, so no
# forced mate is claimed.
id: reti-opening-zilbermints-gambit
name: 'Réti Opening: Zilbermints Gambit'
eco: A09
category: gambit
