    source: >-
      A judgement. Black offers a second wing pawn to keep the centre intact and open lines
      for the queenside pieces, but the b5 pawn is simply hanging with nothing recapturing
      it, and White ends up a clean pawn up with an ordinary, healthy position. No engine
      was consulted and no database was queried.
judgement:
  by: chan
