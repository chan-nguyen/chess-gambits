# King's Gambit Accepted, Bishop's Gambit, Lopez Variation. One of a batch of entries
# authored for issue #148 (batch h), sharing the trunk `1.e4 e5 2.f4 exf4 3.Bc4` with
# `kings-gambit-accepted-bishops-gambit.yaml` and its existing siblings — including
# `kings-gambit-accepted-bishops-gambit-lopez-defense` (3...c6), a different named line
# despite the shared surname. Defining line ends on White's 3.Bc4 (invariant 5). Every ply
# below was replayed with chess.js before being written.
id: kings-gambit-accepted-bishops-gambit-lopez-variation
name: "King's Gambit Accepted: Bishop's Gambit, Lopez Variation"
eco: C33
category: gambit
side: white
definingLine: [e4, e5, f4, exf4, Bc4]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      The same judgement the family head `kings-gambit-accepted-bishops-gambit.yaml` carries.
      No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa đưa tượng ra c4, Gambit Tượng. Mục này đi sâu riêng vào 3...Qh4+, buộc vua Trắng phải nhúc nhích ngay.
    en: White has just played the bishop to c4, the Bishop's Gambit. This entry follows specifically 3...Qh4+, forcing the White king to move at once.
    fr: Les Blancs viennent de jouer le fou en c4, le Gambit du Fou. Cette entrée suit spécifiquement 3...Dh4+, forçant aussitôt le roi blanc à bouger.
  dismissRest:
    reason:
      vi: Đen đáp lại 3.Bc4 bằng một nước khác ngoài 3...Qh4+ — giữ tốt bằng 3...g5, đánh trung tâm bằng 3...d5, hay phát triển bằng 3...Nf6. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 3.Bc4 with something other than 3...Qh4+ — holding the pawn with 3...g5, striking the centre with 3...d5, or developing with 3...Nf6. Each is outside the scope of this entry.
      fr: Les Noirs répondent à 3.Bc4 par autre chose que 3...Dh4+ — conserver le pion par 3...g5, une frappe centrale par 3...d5, ou un développement par 3...Nf6. Chacun sort du cadre de cette entrée.
  children:
    - ply: 'Qh4+'
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen chiếu ngay bằng hậu, quân duy nhất có thể chiếu ở đây, buộc Trắng phải trả lời trước khi làm gì khác.
        en: Black checks at once with the queen, the only piece that can check here, forcing White to answer before doing anything else.
        fr: Les Noirs donnent échec aussitôt avec la dame, la seule pièce pouvant le faire ici, forçant les Blancs à répondre avant toute autre chose.
      children:
        - ply: Kf1
          annotation:
            vi: Trắng chỉ có một cách hợp lệ để đáp lại chiếu này, vì không quân nào có thể chặn hay ăn con hậu ở h4. Vua mất quyền nhập thành ngay từ đầu.
            en: White has exactly one legal way to answer this check, since nothing can block or capture the queen on h4. The king loses castling rights right at the start.
            fr: Les Blancs n'ont qu'une seule façon légale de répondre à cet échec, car rien ne peut bloquer ou prendre la dame en h4. Le roi perd le droit de roquer dès le début.
          dismissRest:
            reason:
              vi: Đen đáp lại Kf1 bằng một nước khác ngoài 4...g5 — phát triển bằng 4...Nf6 hay 4...Nc6, hay chơi 4...d6. Mỗi lựa chọn nằm ngoài phạm vi mục này.
              en: Black meets Kf1 with something other than 4...g5 — developing with 4...Nf6 or 4...Nc6, or playing 4...d6. Each is outside the scope of this entry.
              fr: Les Noirs répondent à Kf1 par autre chose que 4...g5 — un développement par 4...Cf6 ou 4...Cc6, ou 4...d6. Chacun sort du cadre de cette entrée.
          children:
            - ply: g5
              replyQuality: good
              frequency: common
              annotation:
                vi: Biến Lopez. Đen giữ chắc con tốt f4 bằng cách bảo vệ nó thêm một lần nữa, chấp nhận làm yếu cánh vua để đổi lấy vật chất.
                en: The Lopez Variation. Black holds the f4 pawn firmly by defending it a second time, accepting a weaker kingside in exchange for the material.
                fr: La Variante Lopez. Les Noirs tiennent fermement le pion f4 en le défendant une seconde fois, acceptant un affaiblissement de l'aile roi en échange du matériel.
              outcome:
                type: position
                evaluation:
                  vi: Đen vẫn hơn đúng con tốt f4 ban đầu, và giờ con tốt ấy được tốt g5 đỡ chắc. Đổi lại, cánh vua Đen đã yếu đi đáng kể và vua Trắng, dù mất quyền nhập thành, vẫn chưa bị đe dọa cụ thể nào.
                  en: Black is still exactly one pawn up, the original f4 pawn, and it is now firmly held by the g5 pawn. In exchange, Black's kingside is noticeably weaker, and White's king, though it has lost castling rights, faces no concrete threat yet.
                  fr: Les Noirs restent exactement un pion devant, le pion f4 initial, désormais solidement tenu par le pion g5. En échange, l'aile roi noire est nettement affaiblie, et le roi blanc, bien qu'ayant perdu le droit de roquer, ne fait face à aucune menace concrète pour l'instant.
                plan:
                  vi: Trắng chơi h4 đánh vào cột tốt g5, Nf3 đuổi hậu, và tìm cách mở cột h. Đen chơi h6 giữ tốt g5, Nf6 và Bg7 hay Bc5, giữ con tốt f4 làm vốn liếng lâu dài.
                  en: White plays h4 to strike at the g5 pawn, Nf3 to chase the queen, and looks for a way to open the h-file. Black plays h6 to hold g5, Nf6 and Bg7 or Bc5, banking the f4 pawn as a long-term asset.
                  fr: Les Blancs jouent h4 pour frapper le pion g5, Nf3 pour chasser la dame, et cherchent à ouvrir la colonne h. Les Noirs jouent h6 pour tenir g5, Nf6 et Bg7 ou Bc5, conservant le pion f4 comme atout durable.
                basis:
                  by: chan
                  at: '2026-09-25'
