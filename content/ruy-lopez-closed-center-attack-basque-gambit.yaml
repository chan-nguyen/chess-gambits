tree:
  annotation:
    vi:
      Sau khi đã thí tốt d4 và đẩy e5 đuổi mã, Trắng chơi tiếp 11.c3 hiến luôn con tốt thứ hai để mở
      đường cho quân, thay vì vội vàng ăn lại tốt d4 bằng cách khác.
    en:
      Having already given up the d4 pawn and pushed e5 to chase the knight away, White plays 11.c3,
      offering a second pawn outright to open lines for the pieces rather than rushing to win the d4
      pawn back some other way.
    fr:
      Après avoir déjà cédé le pion d4 et poussé e5 pour chasser le cavalier, les Blancs jouent 11.c3,
      offrant carrément un second pion pour ouvrir des lignes à leurs pièces plutôt que de se
      précipiter pour regagner le pion d4 autrement.
  dismissRest:
    reason:
      vi:
        Đen bỏ qua con tốt c3 và chơi nước khác. Con tốt ấy vẫn nằm trên bàn cờ và Trắng chưa có được
        nhịp độ mà việc ăn tốt mang lại, nhưng đánh giá tổng thể — Đen hơn tốt, Trắng có bù đắp bằng
        không gian và phát triển — không đổi nhiều.
      en:
        Black ignores the c3 pawn and plays something else. That pawn stays on the board and White does
        not get the extra tempo that capturing it brings, but the overall picture — Black up
        material, White compensated by space and development — does not change much.
      fr:
        Les Noirs ignorent le pion c3 et jouent autre chose. Ce pion reste sur l'échiquier et les Blancs
        ne gagnent pas le temps supplémentaire qu'apporterait sa capture, mais le tableau général —
        les Noirs en avance matérielle, les Blancs compensés par l'espace et le développement — ne
        change guère.
  children:
    - ply: dxc3
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen ăn luôn con tốt thứ hai mà Trắng vừa hiến ở c3.
        en: Black simply takes the second pawn White has just offered on c3.
        fr: Les Noirs prennent tout simplement le second pion offert en c3.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 6 còn Đen 8 — Đen hơn đúng hai tốt sạch.
          en: Count the pawns and it is 6 for White against 8 for Black — Black is up two clean pawns.
          fr:
            'Comptez les pions : 6 pour les Blancs contre 8 pour les Noirs — les Noirs sont en avance de
            deux pions nets.'
        plan:
          vi:
            Trắng chơi Nxc3 lấy lại một phần vật chất, đưa hậu ra hoạt động và tận dụng con tốt e5 để hạn
            chế mã f6, gây sức ép bù cho tốt đã mất. Đen chơi Nxc3 đổi lại quân hoặc rút mã, nhập
            thành nhanh và cố giữ vững hai tốt thừa.
          en:
            White plays Nxc3 to win back some material, brings the queen into play, and leans on the e5 pawn
            to cramp the knight on f6, all as compensation for the missing pawns. Black trades on c3
            or pulls the knight back, castles quickly, and tries to hold on to the two extra pawns.
          fr:
            Les Blancs jouent Nxc3 pour regagner du matériel, activent leur dame et s'appuient sur le pion
            e5 pour gêner le cavalier f6, en compensation des pions perdus. Les Noirs échangent en
            c3 ou reculent le cavalier, roquent rapidement et tentent de conserver les deux pions
            supplémentaires.
        basis:
          by: chan
          at: 2026-09-29
