# Alekhine Defense: Four Pawns Attack, Cambridge Gambit. Frozen defining line 1.e4 Nf6 2.e5 Nd5
# 3.d4 d6 4.c4 Nb6 5.f4 g5, which ends on Black's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 6.fxg5. searchMate at 3 moves from
# the resulting position returns no-mate, so no forced mate is claimed anywhere in this entry, and
# no capture is left going free at the leaf.
id: alekhine-defense-four-pawns-attack-cambridge-gambit
name: 'Alekhine Defense: Four Pawns Attack, Cambridge Gambit'
eco: B03
category: gambit
