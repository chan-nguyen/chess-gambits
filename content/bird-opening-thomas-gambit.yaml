# Bird Opening: Thomas Gambit. Frozen defining line 1.f4 d5 2.b3 Nf6 3.Bb2 d4 4.Nf3 c5
# 5.e3, which ends on White's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). Replayed with chess.js through the reply dxe3; searchMate at 3 moves from
# the resulting position returns no-mate, so no forced mate is claimed anywhere in this
# entry. The leaf carries `unsettled` because a capture is going free there.
id: bird-opening-thomas-gambit
name: 'Bird Opening: Thomas Gambit'
eco: A03
category: gambit
side: white
definingLine: [f4, d5, b3, Nf6, Bb2, d4, Nf3, c5, e3]
soundness:
  value: unsound
  reviewedAt: '2026-10-01'
  basis:
    by: chan
    at: '2026-10-01'
    source: >-
      A judgement. At the end of the defining line the pawn count is level, eight each, and
      White offers the e3 pawn, which Black can take with the d-pawn. White recaptures with
      dxe3, which opens the d-file between the queens, and a queen trade then brings the king
      to d1, where it can no longer castle. White has not been shown to get anything concrete
      in return for that. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-10-01'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: 'Trắng vừa chơi 5.e3, đưa tốt e lên. Tốt e3 bị tốt d4 của Đen tấn công và được tốt d2 bảo vệ, còn tốt d4 bị tốt e3, mã f3 và tượng b2 tấn công và được hậu và tốt c5 bảo vệ. Số tốt đang cân bằng, mỗi bên tám. Mục này đi theo nước Đen ăn 5...dxe3.'
    en: "White has just played 5.e3. White's e3 pawn is attacked by Black's d4 pawn and defended by the d2 pawn, while the d4 pawn is attacked by the e3 pawn, the knight on f3 and the bishop on b2 and defended by the queen and the c5 pawn. The pawn count is level, eight each. This entry follows Black capturing 5...dxe3."
    fr: 'Les Blancs viennent de jouer 5.e3. Le pion e3 blanc est attaqué par le pion d4 noir et défendu par le pion d2, tandis que le pion d4 est attaqué par le pion e3, le cavalier f3 et le fou b2 et défendu par la dame et le pion c5. Le compte des pions est égal, huit chacun. Cette entrée suit la prise 5...dxe3 des Noirs.'
  dismissRest:
    reason:
      vi: 'Đen chơi một nước khác thay vì 5...dxe3, nên tốt e3 chưa bị ăn. Mục này chỉ đi theo nước ăn tốt.'
      en: 'Black plays something other than 5...dxe3 here, so the e3 pawn is not taken. This entry follows only the capture.'
      fr: "Les Noirs jouent autre chose que 5...dxe3 ici, si bien que le pion e3 n'est pas pris. Cette entrée ne suit que la prise."
  children:
    - ply: dxe3
      replyQuality: good
      frequency: common
      annotation:
        vi: 'Đen ăn tốt e3 bằng tốt d. Tốt e3 mới bị tốt d2 tấn công mà không có quân Đen nào bảo vệ, nên Trắng sắp ăn lại.'
        en: "Black takes the e3 pawn with the d-pawn. The new pawn on e3 is attacked by the d2 pawn and nothing of Black's defends it, so White is about to recapture."
        fr: 'Les Noirs prennent le pion e3 avec le pion d. Le nouveau pion e3 est attaqué par le pion d2 et aucune pièce noire ne le défend, si bien que les Blancs vont reprendre.'
      unsettled: >-
        Recapturing on e3 with the d-pawn is going free because nothing of Black's defends the
        pawn on e3; the evaluation counts that recapture, which brings the pawn count to seven
        against seven.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, và tốt e3 của Đen sắp bị ăn lại bằng dxe3, đưa số tốt về bảy so với bảy. Sau đó cột d mở giữa hai hậu, nên sau ...Qxd1+ vua Trắng ăn lại bằng Kxd1 và Trắng mất quyền nhập thành. Trong khi đó tượng b2 của Trắng nhắm vào mã f6, vốn được các tốt e7 và g7 bảo vệ.'
          en: "Count the pawns: White seven, Black eight, with Black's pawn on e3 about to be taken back by dxe3, which brings the count to seven each. After that the d-file is open between the queens, so after ...Qxd1+ the king recaptures with Kxd1 and White loses the right to castle. Meanwhile White's bishop on b2 aims at the knight on f6, which the e7 and g7 pawns defend."
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs, le pion noir e3 étant sur le point d'être repris par dxe3, ce qui ramène le compte à sept chacun. Ensuite la colonne d est ouverte entre les deux dames, si bien qu'après ...Qxd1+ le roi reprend par Kxd1 et que les Blancs perdent le droit de roquer. Pendant ce temps, le fou blanc b2 vise le cavalier f6, que défendent les pions e7 et g7."
        plan:
          vi: 'Trắng ăn lại bằng dxe3, rồi phát triển bằng Nc3 và Bc4, nhập thành nếu Đen không đổi hậu. Đen có thể đổi hậu trên cột d mở, nếu không thì phát triển bằng ...Nc6, ...Bg4 và ...e6.'
          en: 'White recaptures with dxe3, then develops with Nc3 and Bc4, castling if Black does not trade queens. Black can trade queens on the open d-file, and otherwise develops with ...Nc6, ...Bg4 and ...e6.'
          fr: "Les Blancs reprennent par dxe3, puis se développent par Nc3 et Bc4, en roquant si les Noirs n'échangent pas les dames. Les Noirs peuvent échanger les dames sur la colonne d ouverte, et sinon se développent par ...Nc6, ...Bg4 et ...e6."
        basis:
          by: chan
          at: '2026-10-01'
