    - ply: d5
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Phòng thủ Sørensen, tức là từ chối gambit bằng cách phản công ngay giữa bàn. Đen không lấy con tốt c3 mà thí lại một tốt để mở đường cho hậu và tượng, đúng theo nguyên tắc chống mọi gambit.
        en: The Sørensen Defence — declining by counter-striking in the centre. Black leaves the c3 pawn and offers one back to open lines for the queen and bishop, which is the standard principle against any gambit.
        fr: La Défense Sørensen, autrement dit refuser en contre-attaquant au centre. Les Noirs laissent le pion c3 et en rendent un pour ouvrir des lignes à la dame et au fou, ce qui est le principe habituel contre tout gambit.
      children:
        - ply: exd5
          annotation:
            vi: Trắng ăn lại và bây giờ mỗi bên có một con tốt đi lạc, tốt d5 của Trắng và tốt d4 của Đen. Đen thường chơi Nf6 hoặc Qxd5 để lấy lại, và Trắng lấy lại tốt d4 bằng cxd4.
            en: White takes back, and now each side has one stray pawn — White's on d5 and Black's on d4. Black usually plays ...Nf6 or ...Qxd5 to regain it, and White recovers the d4 pawn with cxd4.
            fr: Les Blancs reprennent, et chaque camp a désormais un pion égaré, celui des Blancs en d5 et celui des Noirs en d4. Les Noirs jouent d'ordinaire ...Nf6 ou ...Qxd5 pour le récupérer, et les Blancs reprennent le pion d4 par cxd4.
          dismissRest:
            reason:
              vi: Đen không ăn lại ở d5. Con tốt d5 của Trắng đứng đó không ai giữ, nên để nó lại là tự nguyện kém một tốt mà không được gì. Nước ...dxc3 quay lại nhận gambit thì Nxc3 hoặc Bc4 và Trắng còn thêm con tốt d5 chặn ngang. Nước ...Nf6 đánh vào d5 thì c4 giữ nó và Trắng có cặp tốt d5-c4 chiếm chỗ. Nước ...Qe7+ chiếu thì Be2 hoặc Qe2 chặn và con hậu Đen đứng sai chỗ. Nước ...Bd6 hay ...Be7 phát triển thì cxd4 và Trắng lấy lại tốt với trung tâm d4-d5. Cả nhóm này đều để Trắng giữ con tốt thừa ở d5.
              en: Black does not recapture on d5. White's pawn there is undefended, so leaving it is a voluntary pawn deficit for nothing. ...dxc3 goes back to accepting the gambit and Nxc3 or Bc4 follows, with White's d5 pawn wedged in as well. ...Nf6 hits d5 and c4 holds it, giving White the d5-c4 pair for space. ...Qe7+ checks and Be2 or Qe2 blocks, with the black queen misplaced. ...Bd6 and ...Be7 develop and cxd4 recovers the pawn with a d4-d5 centre. Everything in this group lets White keep the extra pawn on d5.
              fr: Les Noirs ne reprennent pas en d5. Le pion blanc qui s'y trouve n'est pas défendu, si bien que le laisser revient à accepter volontairement un pion de retard pour rien. ...dxc3 revient à accepter le gambit et Nxc3 ou Bc4 suit, avec en prime le pion d5 en coin. ...Nf6 frappe d5 et c4 le tient, donnant aux Blancs le duo d5-c4 et l'espace. ...Qe7+ donne échec et Be2 ou Qe2 interpose, la dame noire étant mal placée. ...Bd6 et ...Be7 développent et cxd4 reprend le pion avec un centre d4-d5. Tout ce groupe laisse les Blancs conserver le pion en plus en d5.
          children:
            - ply: Qxd5
              replyQuality: best
              frequency: common
              annotation:
                vi: Đen lấy lại bằng hậu vì không có quân nào khác tới được d5. Con hậu đứng giữa bàn cờ trông oai nhưng nó sẽ bị Nc3 đuổi, và đó là nhịp Trắng cần.
                en: Black recaptures with the queen, because nothing else reaches d5. The queen in the middle of the board looks imposing but Nc3 will chase it, and that tempo is what White is playing for.
                fr: Les Noirs reprennent de la dame, car rien d'autre n'atteint d5. La dame au centre a fière allure mais Nc3 la chassera, et c'est le temps que cherchent les Blancs.
              children:
                - ply: cxd4
                  annotation:
                    vi: Trắng lấy lại con tốt và thế cờ đã cân bằng vật chất. Con tốt d4 bây giờ là tốt cô, không có tốt c hay tốt e nào đỡ được nó nữa.
                    en: White takes the pawn back and material is level. The pawn on d4 is now isolated — there is no c-pawn and no e-pawn left that could ever defend it.
                    fr: Les Blancs reprennent le pion et le matériel est égal. Le pion d4 est désormais isolé — il ne reste ni pion c ni pion e pour le défendre un jour.
                  outcome:
                    type: position
                    evaluation:
                      vi: Đếm tốt thì sáu đều và quân cũng đều, nên Gambit Đan Mạch đã chấm dứt ở đây, không còn con tốt nào bị thí nữa. Trên bàn cờ còn lại hai thứ nhìn thấy được và chúng chống nhau. Thứ nhất, con tốt d4 của Trắng là tốt cô thật sự, Trắng không còn tốt c và cũng không còn tốt e, nên sẽ không bao giờ có con tốt nào của Trắng đỡ được nó, và đổi lại nó kiểm soát hai ô c5 cùng e5 cho quân Trắng. Thứ hai, con hậu Đen ở d5 đang đứng một mình giữa bàn cờ trong khi Trắng chưa phát triển quân nào, nên Nc3 tới là Đen phải đi hậu lần nữa. Ở cánh hậu Đen có ba tốt a7, b7, c7 chọi hai tốt a2, b2 của Trắng, và về tàn cuộc đó là số lẻ có giá trị.
                      en: Count the pawns and it is six each, and the pieces match, so the Danish Gambit is over here — there is no sacrificed pawn left. Two things remain on the board and they pull against each other. First, White's d4 pawn is genuinely isolated, because White has no c-pawn and no e-pawn left, so no pawn of White's will ever defend it, and in return it holds c5 and e5 for White's pieces. Second, Black's queen is standing alone in the middle of the board while White has not developed a piece, so Nc3 arrives and the queen has to move again. On the queenside Black has three pawns, a7, b7 and c7, against White's two, a2 and b2, and in an endgame that spare pawn is worth something.
                      fr: Comptez les pions, six de chaque côté, et les pièces se répondent, si bien que le Gambit danois s'arrête ici, plus aucun pion n'est sacrifié. Deux choses restent sur l'échiquier et elles se contredisent. D'abord, le pion d4 blanc est véritablement isolé, car les Blancs n'ont plus ni pion c ni pion e, aucun pion blanc ne le défendra donc jamais, et en échange il tient c5 et e5 pour les pièces blanches. Ensuite, la dame noire se tient seule au centre alors que les Blancs n'ont développé aucune pièce, si bien que Nc3 arrive et que la dame doit rejouer. À l'aile dame, les Noirs ont trois pions, a7, b7 et c7, contre deux aux Blancs, a2 et b2, et en finale ce pion supplémentaire compte.
                    plan:
                      vi: Trắng chơi Nc3 đuổi hậu để được nhịp, rồi Nf3, Bc4 hoặc Be2, O-O và Re1, chơi một ván cờ tốt cô cổ điển. Quân Trắng đứng vào c5 và e5, con tốt d4 được xe d1 đỡ, và nước phá đúng lúc là d4-d5. Trắng không được đổi hết quân, vì tàn cuộc với tốt cô là tàn cuộc thua. Đen chơi ...Nc6 ép vào d4, đưa hậu về a5 hoặc d8 cho an toàn, rồi ...Nf6, ...Be7 hoặc ...Bd6 và ...O-O, sau đó ...Bg4 ghim mã f3 và ...Rd8 chồng lên con tốt cô. Nước phá của Đen là ...c5 đánh thẳng vào d4, và nếu đổi được hậu cùng một cặp xe thì ba tốt cánh hậu chọi hai là thứ quyết định.
                      en: White plays Nc3 to chase the queen and gain the tempo, then Nf3, Bc4 or Be2, castles and Re1, playing a classical isolated-pawn game. White's pieces take c5 and e5, a rook on d1 holds the d4 pawn, and the break at the right moment is d4-d5. White must not trade everything off, because an endgame with an isolated pawn is a lost endgame. Black plays ...Nc6 to press d4, retreats the queen to a5 or d8 for safety, then ...Nf6, ...Be7 or ...Bd6 and ...O-O, followed by ...Bg4 to pin the f3 knight and ...Rd8 to pile on the isolated pawn. Black's break is ...c5 straight at d4, and if the queens and a pair of rooks come off, three queenside pawns against two is what decides it.
                      fr: Les Blancs jouent Nc3 pour chasser la dame et gagner le temps, puis Nf3, Bc4 ou Be2, roquent et Re1, avec une partie classique à pion isolé. Leurs pièces prennent c5 et e5, une tour en d1 tient le pion d4, et la rupture au bon moment est d4-d5. Les Blancs ne doivent pas tout échanger, car une finale à pion isolé est une finale perdue. Les Noirs jouent ...Nc6 pour peser sur d4, replient la dame en a5 ou d8 pour la mettre à l'abri, puis ...Nf6, ...Be7 ou ...Bd6 et ...O-O, avant ...Bg4 pour clouer le cavalier f3 et ...Rd8 pour accumuler sur le pion isolé. Leur rupture est ...c5 droit sur d4, et si les dames et une paire de tours disparaissent, trois pions d'aile dame contre deux font la décision.
