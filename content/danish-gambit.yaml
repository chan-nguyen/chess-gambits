                                                vi: Đây là nước phải tìm ra. Tượng vào b4 chiếu, và vì đang chiếu nên Trắng không có thì giờ đưa hậu về. Đen sẽ lấy lại con hậu ngay ở nước sau.
                                                en: This is the move that has to be found. The bishop comes to b4 with check, and because it is check White has no time to bring the queen home. Black takes the queen back next move.
                                                fr: Voici le coup qu'il faut trouver. Le fou arrive en b4 avec échec et, l'échec obligeant, les Blancs n'ont pas le temps de ramener la dame. Les Noirs reprendront la dame au coup suivant.
                                              children:
                                                - ply: Qd2
                                                  annotation:
                                                    vi: Trắng chặn bằng chính con hậu và mời đổi. Trong bảy nước hợp lệ thì đây là nước duy nhất giữ được thăng bằng, vì Nc3 hay Nd2 chặn thì Đen ăn con quân chặn ấy và vẫn còn hậu ở d8 để đòi, còn đưa vua đi thì mất hậu luôn.
                                                    en: White blocks with the queen itself and offers the trade. Of the seven legal moves this is the only one that holds the balance — blocking with Nc3 or Nd2 lets Black take the blocker with the queen on d8 still to be answered for, and moving the king loses the queen outright.
                                                    fr: Les Blancs interposent la dame elle-même et proposent l'échange. Des sept coups légaux, c'est le seul qui maintient l'équilibre — interposer Nc3 ou Nd2 permet aux Noirs de prendre l'obstacle avec la dame en d8 encore à régler, et bouger le roi perd la dame purement et simplement.
                                                  dismissRest:
                                                    reason:
                                                      vi: Đen không đổi ngay ở d2. Con hậu Trắng vẫn đang đứng ở d2 chắn nước chiếu, và mọi nước khác của Đen đều để Trắng có thì giờ chơi Nf3 hoặc Bxg7 rồi rút hậu, tức là Trắng giữ được con hậu đã ăn ở d8. Nước ...Bxd2+ là nước duy nhất lấy lại đúng số quân. Nước ...Nxe4 ăn thêm tốt thì Qxb4 ăn tượng và Trắng hơn hẳn. Nước ...Re8 hay ...Rd8 đưa xe vào cột thì Qxb4 cũng vậy. Ở đây Đen không có lựa chọn, chỉ có một nước.
                                                      en: Black does not take on d2 at once. The white queen is standing on d2 blocking the check, and anything else gives White the time to play Nf3 or Bxg7 and then move the queen away — which means White keeps the queen taken on d8. ...Bxd2+ is the only move that squares the material. ...Nxe4 grabs another pawn and Qxb4 takes the bishop, leaving White far ahead. ...Re8 and ...Rd8 bring a rook to the file and Qxb4 does the same. Black has no choice here, only a move.
                                                      fr: Les Noirs ne prennent pas tout de suite en d2. La dame blanche se tient en d2 et pare l'échec, et tout autre coup donne aux Blancs le temps de jouer Nf3 ou Bxg7 puis de retirer la dame — ce qui leur laisse la dame prise en d8. ...Bxd2+ est le seul coup qui égalise le compte. ...Nxe4 rafle un pion de plus et Qxb4 prend le fou, laissant les Blancs largement devant. ...Re8 et ...Rd8 amènent une tour sur la colonne et Qxb4 fait de même. Les Noirs n'ont pas le choix ici, seulement un coup.
                                                  children:
                                                    - ply: Bxd2+
                                                      replyQuality: best
                                                      frequency: common
                                                      annotation:
                                                        vi: Đen ăn hậu, và vẫn là chiếu. Số quân bây giờ đã cân bằng trở lại.
                                                        en: Black takes the queen, and it is check again. The material count is level once more.
                                                        fr: Les Noirs prennent la dame, et c'est encore échec. Le compte matériel est de nouveau égal.
                                                      children:
                                                        - ply: Nxd2
                                                          annotation:
                                                            vi: Mã ăn lại tượng và chuỗi bắt buộc kết thúc ở đây. Hậu đã rời bàn cờ cả hai bên, và cái còn lại là một thế cờ mà ai cũng đếm được.
                                                            en: The knight recaptures and the forcing sequence ends here. Both queens have left the board, and what remains is a position anyone can count.
                                                            fr: Le cavalier reprend et la séquence forcée s'arrête ici. Les deux dames ont quitté l'échiquier, et il reste une position que chacun peut compter.
                                                          outcome:
                                                            type: position
                                                            evaluation:
                                                              vi: Đếm quân thì hai bên giống hệt nhau. Mỗi bên hai xe, hai mã, một tượng và năm tốt, không hơn không kém một thứ gì. Hai con tốt Gambit Đan Mạch thí đi đã được trả lại đầy đủ và không có gì hơn thế, đó chính là câu trả lời thật cho câu hỏi mà nước 3.c3 đặt ra. Cái khác duy nhất nằm ở vị trí vua. Vua Đen ở f7 và đã mất quyền nhập thành vĩnh viễn, nên con xe h8 chưa dùng được cho đến khi Đen chơi ...Re8 hoặc đi vua sang g8 bằng tay. Vua Trắng vẫn ở e1 và còn nguyên quyền nhập thành cả hai bên, O-O-O đi được ngay lập tức còn O-O phải chờ con mã rời g1. Về cấu trúc thì không bên nào có tốt chồng, con tốt cô duy nhất là a2 của Trắng và chưa ai với tới nó được. Đáng nhìn hơn là hai bên đều có một cánh đa số, Đen ba tốt a7, b7, c7 chọi một tốt a2 ở cánh hậu, Trắng bốn tốt e4, f2, g2, h2 chọi hai tốt g7, h7 ở cánh kia. Và không còn hậu để trừng phạt một vị vua đứng hở. Đó là lý do biến này được coi là cân bằng chứ không phải là chiến thắng của Trắng. Đã thử đẩy tiếp bằng Ngf3, O-O, Rfe1 và e5 để quấy vua f7 trước khi nó yên vị, nhưng ngay khi Đen kịp chơi ...Re8 nối xe thì không còn mục tiêu cụ thể nào để khai thác nữa — đây thực sự là một điểm dừng cân bằng, không phải một đánh giá còn bỏ ngỏ.
                                                              en: Count the pieces and the two sides are identical. Two rooks, two knights, one bishop and five pawns each, with nothing over on either side. The two pawns the Danish gave away have been paid back in full and nothing more, which is the real answer to the question 3.c3 asked. The one difference is where the kings are. Black's king is on f7 and has lost the right to castle for good, so the h8 rook is out of the game until Black plays ...Re8 or walks the king to g8 by hand. White's king is still on e1 with both castling rights intact, and O-O-O is available at once while O-O waits for the knight to leave g1. As for the pawns, nothing is doubled anywhere and the only isolated pawn is White's on a2, which nothing can reach yet. The more useful thing to see is that each side has a majority — Black's three pawns on a7, b7 and c7 against the lone a2 on the queenside, White's four on e4, f2, g2 and h2 against two on the other wing. And there is no queen left to punish an exposed king. That is why this variation counts as balanced rather than as a win for White. Pushing further with Ngf3, O-O, Rfe1 and e5 to bother the king on f7 before it settles was tried, but as soon as Black manages ...Re8 to connect the rooks there is no concrete target left to work with — this is a genuine level stopping point, not an evaluation left unexamined.
                                                              fr: Comptez les pièces et les deux camps sont identiques. Deux tours, deux cavaliers, un fou et cinq pions chacun, sans rien en trop d'un côté ni de l'autre. Les deux pions donnés par le Gambit danois ont été remboursés intégralement et rien de plus, ce qui est la vraie réponse à la question posée par 3.c3. La seule différence tient à la place des rois. Le roi noir est en f7 et a définitivement perdu le droit de roquer, si bien que la tour h8 reste hors jeu jusqu'à ...Re8 ou jusqu'à ce que le roi marche en g8 à pied. Le roi blanc est encore en e1 avec ses deux droits de roque intacts, et le grand roque est jouable tout de suite tandis que le petit attend que le cavalier quitte g1. Côté pions, rien n'est doublé nulle part et le seul pion isolé est le a2 blanc, que personne ne peut encore atteindre. Plus utile à voir, chaque camp possède une majorité — les trois pions noirs a7, b7 et c7 contre le seul a2 à l'aile dame, les quatre pions blancs e4, f2, g2 et h2 contre deux à l'autre aile. Et il ne reste aucune dame pour punir un roi exposé. Voilà pourquoi cette variante passe pour équilibrée et non pour un gain blanc. Poursuivre par Ngf3, O-O, Rfe1 et e5 pour inquiéter le roi en f7 avant qu'il ne s'installe a été essayé, mais dès que les Noirs parviennent à jouer ...Re8 pour relier les tours, il ne reste plus de cible concrète à exploiter — c'est un véritable point d'arrêt égal, non une évaluation laissée sans examen.
                                                            plan:
                                                              vi: Trắng chơi Ngf3 rồi O-O, sau đó Rfe1 và e5 đuổi mã f6, cố dùng cột e và ô e5 để quấy con vua f7 trước khi nó kịp yên. Con tượng b2 vẫn ăn suốt đường chéo dài nên Rad1 cùng Ne4 là cách đưa thêm quân vào. Nếu Đen kịp nối xe thì Trắng nên đổi hết và chấp nhận hoà. Đen chơi ...Re8 ngay để nối hai xe, rồi ...Kg8 bằng tay hoặc ...Ke7 nếu cột e đã an toàn, sau đó ...Nc6, ...Bf5 hay ...Be6 và ...Rad8. Nước phá của Đen là ...Nxe4 khi mã d2 rời đi, và ...c5 cùng ...b5 để chiếm chỗ ở cánh hậu. Việc Đen cần làm chỉ có một, là đưa con xe h8 vào ván cờ, và khi nó vào rồi thì thế cờ hoàn toàn cân bằng.
                                                              en: White plays Ngf3 and castles, then Rfe1 and e5 to chase the f6 knight, trying to use the e-file and the e5 square to bother the king on f7 before it settles. The bishop on b2 still rakes the long diagonal, so Rad1 and Ne4 are the way to add pieces. If Black gets the rooks connected, White should trade everything and take the draw. Black plays ...Re8 at once to connect the rooks, then walks the king to g8, or to e7 once the e-file is safe, and follows with ...Nc6, ...Bf5 or ...Be6 and ...Rad8. Black's breaks are ...Nxe4 whenever the d2 knight leaves, and ...c5 and ...b5 for queenside room. Black has exactly one job, which is to get the h8 rook into the game, and once it is in, the position is level in every respect.
                                                              fr: Les Blancs jouent Ngf3 et roquent, puis Rfe1 et e5 pour chasser le cavalier f6, en cherchant à utiliser la colonne e et la case e5 pour inquiéter le roi f7 avant qu'il ne s'installe. Le fou b2 balaie toujours la grande diagonale, si bien que Rad1 et Ne4 sont la façon d'ajouter des pièces. Si les Noirs parviennent à relier les tours, les Blancs doivent tout échanger et prendre la nulle. Les Noirs jouent ...Re8 sans tarder pour relier les tours, puis amènent le roi en g8 à pied, ou en e7 une fois la colonne e sûre, et enchaînent par ...Nc6, ...Bf5 ou ...Be6 et ...Rad8. Leurs ruptures sont ...Nxe4 dès que le cavalier d2 s'en va, et ...c5 et ...b5 pour l'espace à l'aile dame. Les Noirs ont exactement une tâche, faire entrer la tour h8 dans la partie, et une fois qu'elle y est, la position est égale à tous égards.
                                                            basis:
                                                              by: chan
