                                            en: Queen takes queen. Nothing defends d8, but this is not a free queen, because Black has a check that takes it straight back.
                                            fr: La dame prend la dame. Rien ne défend d8, mais ce n'est pas une dame gratuite, car les Noirs disposent d'un échec qui la reprend aussitôt.
                                          dismissRest:
                                            reason:
                                              vi: Đen không chơi ...Bb4+. Đây là nhóm nước mà Đen thua ngay, vì con hậu Trắng ở d8 sẽ chạy thoát. Nước ...Nxe4 ăn tốt thì Qxf8+ ăn nốt tượng và còn chiếu, Trắng hơn cả một hậu lẫn một tượng mà không mất gì. Nước ...Kg8 hay ...Ke6 chạy vua thì Qxf8 hoặc Qxc8 cũng vậy. Nước ...Be6 chặn đường về của hậu thì Qxb8 ăn mã và vẫn thoát qua a8. Cả nhóm này chỉ có một mẫu số chung, đó là Đen quên mất rằng chiếu là cách duy nhất bắt kịp một con hậu.
                                              en: Black does not play ...Bb4+. This is the group where Black simply loses, because the white queen on d8 gets away. ...Nxe4 wins a pawn and Qxf8+ wins the bishop with check, leaving White a queen and a bishop ahead for nothing. ...Kg8 and ...Ke6 move the king and Qxf8 or Qxc8 does the same job. ...Be6 blocks the queen's road home and Qxb8 takes the knight and still escapes via a8. The whole group has one thing in common, which is forgetting that a check is the only way to catch a queen.
                                              fr: Les Noirs ne jouent pas ...Bb4+. C'est le groupe où les Noirs perdent tout simplement, car la dame blanche en d8 s'échappe. ...Nxe4 gagne un pion et Qxf8+ gagne le fou avec échec, laissant les Blancs une dame et un fou devant pour rien. ...Kg8 et ...Ke6 déplacent le roi et Qxf8 ou Qxc8 fait le même travail. ...Be6 barre le chemin du retour et Qxb8 prend le cavalier et s'échappe quand même par a8. Tout ce groupe a un point commun, celui d'oublier qu'un échec est la seule façon de rattraper une dame.
                                          children:
