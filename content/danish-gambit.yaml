              replyQuality: best
              frequency: occasional
              annotation:
                vi: Phòng thủ Schlechter, và đây là lời đáp đúng. Đen không tham con tốt b2 mà trả lại một tốt để chặn con tượng c4 và mở đường cho quân mình. Biết nước này là biết cách chơi chống Gambit Đan Mạch.
                en: The Schlechter Defence, and the correct answer. Black leaves the b2 pawn alone and gives one pawn back to shut the c4 bishop out and open lines for the pieces. Knowing this move is knowing how to meet the Danish.
                fr: La Défense Schlechter, et la bonne réponse. Les Noirs laissent le pion b2 tranquille et rendent un pion pour fermer la route au fou c4 et ouvrir des lignes à leurs pièces. Connaître ce coup, c'est savoir jouer contre le Gambit danois.
              children:
                - ply: Bxd5
                  annotation:
                    vi: Trắng ăn lại bằng tượng. Con tượng bây giờ đứng ở d5 thay vì c4, và nó sẽ bị mã f6 đuổi ngay ở nước sau. Trắng vẫn còn con tốt c3 của Đen trên bàn cờ, nghĩa là vẫn kém một tốt.
                    en: White recaptures with the bishop. It now stands on d5 instead of c4 and will be chased by ...Nf6 next move. Black's pawn on c3 is still on the board, so White is still a pawn down.
                    fr: Les Blancs reprennent du fou. Il se tient désormais en d5 plutôt qu'en c4 et sera chassé par ...Nf6 au coup suivant. Le pion noir en c3 est toujours sur l'échiquier, donc les Blancs ont toujours un pion de moins.
                  outcome:
                    type: position
                    evaluation:
                      vi: Trắng kém một tốt, đó là con tốt c3 của Đen mà Trắng vẫn chưa ăn lại. Con tượng d5 đứng đẹp nhưng sẽ phải lùi sau Nf6, và Đen kịp phát triển với Nf6 rồi Be6 hoặc c6 đuổi tượng. Đây là chỗ mà lý thuyết nói Đen đứng hơn, và cũng là lý do nhãn của cả gambit này là đáng ngờ chứ không phải vững.
                      en: White is a pawn down — Black's pawn on c3, which White has still not recaptured. The bishop on d5 looks good but has to retreat once ...Nf6 comes, and Black gets developed with ...Nf6 followed by ...Be6 or ...c6 hitting the bishop. This is where theory says Black is better, and it is why the whole gambit is labelled dubious rather than sound.
                      fr: Les Blancs ont un pion de moins, le pion noir en c3 qu'ils n'ont toujours pas repris. Le fou en d5 est joliment placé mais devra reculer après ...Nf6, et les Noirs se développent par ...Nf6 suivi de ...Be6 ou ...c6 pour chasser le fou. C'est ici que la théorie donne l'avantage aux Noirs, et c'est pourquoi l'ensemble du gambit est étiqueté douteux et non sain.
                    plan:
                      vi: Trắng chơi Nxc3 để lấy lại tốt và phát triển cùng lúc, rồi Nf3, O-O và Re1, chấp nhận một thế cờ cân bằng chứ đừng cố tấn công cho bằng được. Đen chơi Nf6 đuổi tượng, rồi Nc6, Be7 hoặc Bd6 và O-O, giữ con tốt c3 nếu giữ được và nếu không thì đổi nó lấy nhịp phát triển. Nước phá của Đen về sau là c5 hoặc Bg4 ghim mã f3.
                      en: White plays Nxc3 to win the pawn back and develop in the same move, then Nf3, castles and Re1, accepting a level game rather than forcing an attack that is not there. Black plays ...Nf6 to chase the bishop, then ...Nc6, ...Be7 or ...Bd6 and ...O-O, keeps the c3 pawn if it can be kept and otherwise trades it for development. Black's later breaks are ...c5 and ...Bg4 pinning the f3 knight.
                      fr: Les Blancs jouent Nxc3 pour reprendre le pion et se développer du même coup, puis Nf3, roquent et Re1, en acceptant une partie égale plutôt que de forcer une attaque qui n'existe pas. Les Noirs jouent ...Nf6 pour chasser le fou, puis ...Nc6, ...Be7 ou ...Bd6 et ...O-O, gardent le pion c3 si c'est possible et sinon l'échangent contre du développement. Les ruptures noires ultérieures sont ...c5 et ...Bg4 clouant le cavalier f3.
                    basis:
