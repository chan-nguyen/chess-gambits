    - ply: d5
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Phòng thủ Sørensen, tức là từ chối gambit bằng cách phản công ngay giữa bàn. Đen không lấy con tốt c3 mà thí lại một tốt để mở đường cho hậu và tượng, đúng theo nguyên tắc chống mọi gambit.
        en: The Sørensen Defence — declining by counter-striking in the centre. Black leaves the c3 pawn and offers one back to open lines for the queen and bishop, which is the standard principle against any gambit.
        fr: La Défense Sørensen, autrement dit refuser en contre-attaquant au centre. Les Noirs laissent le pion c3 et en rendent un pour ouvrir des lignes à la dame et au fou, ce qui est le principe habituel contre tout gambit.
      children:
        - ply: exd5
          annotation:
            vi: Trắng ăn lại và bây giờ mỗi bên có một con tốt đi lạc, tốt d5 của Trắng và tốt d4 của Đen. Đen thường chơi Nf6 hoặc Qxd5 để lấy lại, và Trắng lấy lại tốt d4 bằng cxd4.
            en: White takes back, and now each side has one stray pawn — White's on d5 and Black's on d4. Black usually plays ...Nf6 or ...Qxd5 to regain it, and White recovers the d4 pawn with cxd4.
            fr: Les Blancs reprennent, et chaque camp a désormais un pion égaré, celui des Blancs en d5 et celui des Noirs en d4. Les Noirs jouent d'ordinaire ...Nf6 ou ...Qxd5 pour le récupérer, et les Blancs reprennent le pion d4 par cxd4.
          outcome:
            type: position
            evaluation:
              vi: Quân số ngang nhau và cả hai con tốt lẻ đều sẽ biến mất trong vài nước. Trắng không còn hai con tượng chĩa vào vua Đen nữa, và đổi lại Đen cũng không hơn tốt. Đây là cách từ chối lành nhất, và nó biến Gambit Đan Mạch thành một ván cờ mở bình thường, hơi thoải mái hơn cho Đen vì Trắng đã tiêu mất nước c3 cho một cấu trúc không còn tồn tại.
              en: Material is level and both loose pawns will come off within a few moves. White no longer has two bishops aimed at the black king, and in exchange Black is not a pawn up either. This is the healthiest way to decline, and it turns the Danish into an ordinary open game, marginally more comfortable for Black because White has spent c3 on a structure that no longer exists.
              fr: Le matériel est égal et les deux pions isolés disparaîtront en quelques coups. Les Blancs n'ont plus deux fous braqués sur le roi noir, et en contrepartie les Noirs n'ont pas de pion en plus. C'est la façon la plus saine de refuser, et elle transforme le Gambit danois en partie ouverte ordinaire, légèrement plus agréable pour les Noirs puisque les Blancs ont dépensé c3 pour une structure qui n'existe plus.
            plan:
              vi: Trắng chơi cxd4 để lấy lại tốt, rồi Nf3, Bc4 hoặc Be2, Nc3 và O-O, chơi một ván cờ có con tốt cô ở d4 cần được giữ bằng quân. Đen chơi Nf6 đánh vào d5, Qxd5 nếu thuận, rồi Nc6 ép vào d4, Be7 và O-O. Nước phá của Đen là ép vào con tốt d4 cô lập bằng Nc6, Bg4 và Rd8, còn Trắng thì muốn đẩy d5 để đổi nó đi đúng lúc.
              en: White plays cxd4 to win the pawn back, then Nf3, Bc4 or Be2, Nc3 and castles, playing a game with an isolated d4 pawn that pieces have to defend. Black plays ...Nf6 against d5, takes with ...Qxd5 when convenient, then ...Nc6 to press d4, ...Be7 and ...O-O. Black's method is to pile on the isolated pawn with ...Nc6, ...Bg4 and ...Rd8; White wants to push d5 and trade it off at the right moment.
              fr: Les Blancs jouent cxd4 pour reprendre le pion, puis Nf3, Bc4 ou Be2, Nc3 et roquent, avec une partie à pion isolé en d4 que les pièces doivent défendre. Les Noirs jouent ...Nf6 contre d5, reprennent par ...Qxd5 quand cela convient, puis ...Nc6 pour peser sur d4, ...Be7 et ...O-O. La méthode noire est d'accumuler les pressions sur le pion isolé par ...Nc6, ...Bg4 et ...Rd8 ; les Blancs veulent pousser d5 et l'échanger au bon moment.
