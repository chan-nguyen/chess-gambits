                            en: White recaptures with the bishop rather than with the e-pawn, because exd5 would block White's own diagonal. The bishop on d5 looks at f7 and b7, but ...Nf6 is about to chase it.
                            fr: Les Blancs reprennent du fou et non du pion e, car exd5 boucherait leur propre diagonale. Le fou en d5 vise f7 et b7, mais ...Nf6 va le chasser.
                          dismissRest:
                            reason:
                              vi: Đen không chơi ...Nf6. Nước ...Qxd5 ăn tượng thì Qxd5 lấy lại ngay vì hậu Trắng và tượng d5 cùng nhìn ô ấy, và Đen mất hậu không được gì. Nước ...Nc6 hay ...Bd7 phát triển thì Trắng chơi Nf3, Ne2 và O-O, giữ nguyên con tượng d5 phiền toái. Nước ...c6 đuổi tượng thì Bxf7+ Kxf7 Qxd8 là một đòn đổi mà Trắng rất muốn. Nước ...Be6 đề nghị đổi tượng thì Bxe6 fxe6 làm hỏng cấu trúc Đen và mở cột f cho xe Trắng. Không nước nào giải quyết được con tượng d5 cho bằng ...Nf6.
                              en: Black does not play ...Nf6. ...Qxd5 takes the bishop and Qxd5 takes straight back, because the white queen and the bishop both see that square, so Black has given the queen for nothing. ...Nc6 and ...Bd7 develop and White plays Nf3, Ne2 and castles, keeping the awkward bishop on d5. ...c6 kicks the bishop and is met by Bxf7+ Kxf7 Qxd8, a trade White is very happy to make. ...Be6 offers the exchange and Bxe6 fxe6 wrecks Black's structure and opens the f-file for a white rook. Nothing answers the bishop on d5 as well as ...Nf6.
                              fr: Les Noirs ne jouent pas ...Nf6. ...Qxd5 prend le fou et Qxd5 reprend aussitôt, la dame blanche et le fou voyant tous deux cette case, si bien que les Noirs ont donné la dame pour rien. ...Nc6 et ...Bd7 développent et les Blancs jouent Nf3, Ne2 et roquent, en conservant le gênant fou d5. ...c6 chasse le fou et se traite par Bxf7+ Kxf7 Qxd8, un échange que les Blancs font très volontiers. ...Be6 propose l'échange et Bxe6 fxe6 ruine la structure noire et ouvre la colonne f à une tour blanche. Rien ne répond au fou d5 aussi bien que ...Nf6.
                          children:
