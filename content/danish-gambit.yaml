                                fr: Le cavalier sort, frappe le fou d5 et se place en même temps sur la grande diagonale du fou b2. Un coup qui fait deux choses, et qui oblige les Blancs à trancher tout de suite.
                              children:
                                - ply: Bxf7+
                                  annotation:
                                    vi: Trắng không lùi tượng mà đổi nó lấy con tốt f7 và quyền nhập thành của Đen. Đây là nước làm nên cả biến này, và nó dẫn vào một chuỗi bắt buộc dài bảy nước.
                                    en: White does not retreat the bishop but gives it for the f7 pawn and Black's right to castle. This is the move the whole variation is about, and it starts a forcing sequence seven plies long.
                                    fr: Les Blancs ne reculent pas le fou mais le donnent contre le pion f7 et le droit de roquer des Noirs. C'est le coup dont dépend toute la variante, et il ouvre une séquence forcée de sept demi-coups.
                                  dismissRest:
                                    reason:
                                      vi: Đen chơi ...Ke7 thay vì ăn. Chỉ có hai nước hợp lệ ở đây và đây là nước kia. Nó giữ được con hậu nhưng để tượng f7 sống, và vua Đen đứng ở e7 ngay trước cột e đang mở với con tốt e4 của Trắng sau lưng. Trắng chơi Bb3 hoặc Bc4 rút tượng về an toàn và giữ nguyên toàn bộ ưu thế, vì bây giờ Đen vừa kém quyền nhập thành vừa còn phải trả con tốt.
                                      en: Black plays ...Ke7 instead of taking. There are only two legal moves here and this is the other one. It saves the queen but lets the bishop on f7 live, and the black king stands on e7 in front of an open e-file with White's e4 pawn behind it. White retreats with Bb3 or Bc4, keeps the bishop and keeps everything else, because Black has now lost the right to castle and still owes the pawn.
                                      fr: Les Noirs jouent ...Ke7 au lieu de prendre. Il n'y a que deux coups légaux ici et voici l'autre. Il sauve la dame mais laisse vivre le fou f7, et le roi noir se tient en e7 devant une colonne e ouverte avec le pion e4 blanc derrière. Les Blancs reculent par Bb3 ou Bc4, gardent le fou et gardent tout le reste, car les Noirs ont désormais perdu le droit de roquer et doivent toujours le pion.
                                  children:
                                    - ply: Kxf7
                                      replyQuality: best
