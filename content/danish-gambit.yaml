            - ply: Nf6
              replyQuality: inaccuracy
              frequency: occasional
              annotation:
                vi: Đen phát triển và không ăn thêm. Nước này hợp lý về nguyên tắc nhưng nó bỏ lỡ đúng cái mà Đen cần, là nước d5. Mã f6 không cản được con tượng c4 và cũng không mở đường nào cho quân Đen.
                en: Black develops and takes no more. It is reasonable on principle but it misses the one move Black needs, which is ...d5. The knight on f6 neither blocks the c4 bishop nor opens a line for anything else.
                fr: Les Noirs se développent sans rien prendre de plus. C'est raisonnable en principe, mais cela manque le seul coup dont les Noirs ont besoin, ...d5. Le cavalier f6 ne bloque pas le fou c4 et n'ouvre de ligne pour rien.
              children:
                - ply: Nxc3
                  annotation:
                    vi: Trắng lấy lại con tốt bằng nước phát triển. Mã c3 nhắm vào d5 và e4 được giữ, Trắng chỉ còn kém một tốt và đi trước hẳn về phát triển. Đây là kiểu thế cờ mà Gambit Đan Mạch muốn có.
                    en: White recovers the pawn with a developing move. The knight on c3 eyes d5 and holds e4, White is only one pawn behind and is clearly ahead in development. This is the sort of position the Danish is aiming for.
                    fr: Les Blancs récupèrent le pion par un coup de développement. Le cavalier c3 lorgne d5 et tient e4, les Blancs n'ont qu'un pion de retard et sont nettement en avance de développement. C'est le genre de position que vise le Gambit danois.
                  outcome:
                    type: position
                    evaluation:
                      vi: Trắng kém một tốt. Trắng có mã c3, tượng c4, cột d nửa mở sau khi tốt d biến mất, và Đen mới ra được mỗi con mã f6 trong khi vua vẫn ở e8. Thế cờ này dễ chơi cho Trắng hơn nhiều so với con số vật chất, nhưng nó vẫn là kém một tốt và Đen không có điểm yếu cấu trúc nào.
                      en: White is a pawn down. White has the knight on c3, the bishop on c4, a half-open d-file now that the d-pawns are gone, and Black has only the f6 knight out with the king still on e8. This is far easier to play for White than the material count suggests, but it is still a pawn, and Black has no structural weakness.
                      fr: Les Blancs ont un pion de moins. Ils disposent du cavalier c3, du fou c4, d'une colonne d semi-ouverte maintenant que les pions d ont disparu, et les Noirs n'ont sorti que le cavalier f6 avec le roi encore en e8. C'est bien plus facile à jouer pour les Blancs que ne le dit le décompte matériel, mais cela reste un pion, et les Noirs n'ont aucune faiblesse de structure.
                    plan:
                      vi: Trắng chơi Nf3, O-O rồi Re1 và Qb3 hoặc Qe2, nhắm vào f7 và cột e. Nước phá là e5 đuổi mã f6, và ô d5 là chỗ cho mã c3 nhảy vào khi Đen chơi Nc6. Đen phải chơi d5 hoặc d6 để thở, rồi Be7, O-O thật nhanh và đổi bớt quân. Sau khi vua Đen an toàn và hậu bị đổi thì con tốt thừa mới có nghĩa.
                      en: White plays Nf3, castles, then Re1 and Qb3 or Qe2 against f7 and the e-file. The break is e5 to chase the f6 knight, and d5 is the square for the c3 knight once Black plays ...Nc6. Black must play ...d5 or ...d6 to breathe, then ...Be7, castle quickly and trade pieces. The extra pawn only begins to count once the black king is safe and the queens are off.
                      fr: Les Blancs jouent Nf3, roquent, puis Re1 et Qb3 ou Qe2 contre f7 et la colonne e. La rupture est e5 pour chasser le cavalier f6, et d5 est la case du cavalier c3 dès que les Noirs jouent ...Nc6. Les Noirs doivent jouer ...d5 ou ...d6 pour respirer, puis ...Be7, roquer vite et échanger des pièces. Le pion en plus ne compte qu'une fois le roi noir en sécurité et les dames échangées.
                    basis:
