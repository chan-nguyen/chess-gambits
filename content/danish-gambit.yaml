                                        vi: Vua ăn tượng. Đen phải ăn, vì nếu không thì Đen vừa mất tốt vừa mất quyền nhập thành mà tượng Trắng vẫn còn. Vua đứng ở f7 và mất quyền nhập thành vĩnh viễn.
                                        en: The king takes the bishop. Black has to take, because otherwise the pawn and the right to castle are both gone and White still has the bishop. The king lands on f7 and the right to castle is gone for good.
                                        fr: Le roi prend le fou. Les Noirs doivent prendre, sinon le pion et le droit de roquer sont perdus tous les deux et les Blancs gardent le fou. Le roi arrive en f7 et le droit de roquer a définitivement disparu.
