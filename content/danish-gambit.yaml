# The Danish Gambit. Frozen defining line 1.e4 e5 2.d4 exd4 3.c3, which ends on White's own
# ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
#
# No leaf here claims a mate. The Danish wins games by development and by the two bishops,
# not by force, and a mate the build cannot prove is refused rather than written (ADR-0005).
id: danish-gambit
name: Danish Gambit
eco: C21
category: gambit
side: white
definingLine: [e4, e5, d4, exd4, c3]
soundness:
  value: dubious
  reviewedAt: '2026-09-17'
  basis:
    by: chan
    at: '2026-09-17'
    source: >-
      A judgement, and the same label the catalogue's family rule carries. The Schlechter
      Defence 4...d5 is the reason — Black gives one pawn back at the right moment, keeps
      the other and emerges a pawn up with a sound structure, so the two-pawn version does
      not hold against correct play. Below master level the bishops on c4 and b2 are worth
      far more than the arithmetic suggests. No engine was consulted and no database was
      queried.
judgement:
  by: chan
  at: '2026-09-17'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng mời con tốt c3. Nếu Đen ăn thì Trắng chưa ăn lại vội mà chơi Bc4, và nếu Đen ăn tiếp ở b2 thì Bxb2 cho Trắng hai con tượng chĩa thẳng vào f7 và g7 khi Đen còn chưa phát triển quân nào. Hai con tốt đổi lấy hai đường chéo, đó là toàn bộ ý tưởng.
    en: White offers the c3 pawn. If Black takes it White does not recapture but plays Bc4, and if Black takes on b2 as well, Bxb2 gives White two bishops pointing straight at f7 and g7 while Black has not developed a single piece. Two pawns for two diagonals is the whole idea.
    fr: Les Blancs offrent le pion c3. Si les Noirs le prennent, les Blancs ne reprennent pas mais jouent Bc4, et si les Noirs prennent aussi en b2, Bxb2 donne aux Blancs deux fous braqués sur f7 et g7 alors que les Noirs n'ont pas développé une seule pièce. Deux pions contre deux diagonales, toute l'idée est là.
  dismissRest:
    reason:
      vi: Đen không ăn ở c3 và cũng không chơi d5. Khi đó Trắng chỉ việc chơi cxd4 và có sẵn trung tâm e4 cộng d4 mà không mất gì cả, tức là đúng thứ mà Khai cuộc Scotch phải tốn công mới có. Nếu Đen đã chơi Nf6 thì Trắng còn có thêm e5 đuổi mã. Nước 3...d3 đẩy tốt đi tiếp để khỏi bị ăn lại thì Trắng chơi Bxd3, phát triển một quân và coi như đã trả xong. Không nước nào trong nhóm này trừng phạt gambit, chúng chỉ từ chối nó.
      en: Black neither takes on c3 nor plays ...d5. White then simply recaptures with cxd4 and owns the e4 and d4 centre for nothing — exactly what the Scotch has to work for. If Black has played ...Nf6, White also has e5 to chase the knight. 3...d3, pushing the pawn on so that it cannot be recaptured, is met by Bxd3, which develops a piece and settles the account. None of these moves punishes the gambit; they only decline it.
      fr: Les Noirs ne prennent pas en c3 et ne jouent pas ...d5. Les Blancs reprennent alors simplement par cxd4 et possèdent gratuitement le centre e4 et d4, c'est-à-dire ce que la Partie écossaise doit gagner à la sueur. Si les Noirs ont joué ...Nf6, les Blancs disposent en plus de e5 pour chasser le cavalier. 3...d3, qui pousse le pion plus loin pour échapper à la reprise, se traite par Bxd3, qui développe une pièce et solde le compte. Aucun de ces coups ne punit le gambit, ils se contentent de le refuser.
  children:
    - ply: dxc3
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen nhận con tốt đầu tiên. Đây là nước tự nhiên và không có gì sai, nhưng nó mở đúng những đường mà Trắng muốn mở.
        en: Black accepts the first pawn. It is natural and there is nothing wrong with it, but it opens exactly the lines White wants opened.
        fr: Les Noirs acceptent le premier pion. C'est naturel et il n'y a rien à y redire, mais cela ouvre précisément les lignes que les Blancs veulent ouvrir.
      children:
        - ply: Bc4
          annotation:
            vi: Đây là nước làm nên Gambit Đan Mạch. Trắng không vội lấy lại con tốt c3 mà đặt tượng vào c4 nhắm f7, và mời tiếp con tốt b2. Nếu Trắng chơi Nxc3 ngay thì đó chỉ là Gambit Göring, một thứ khác và ít tham vọng hơn.
            en: This is the move that makes it the Danish. White does not hurry to win the c3 pawn back but puts the bishop on c4 against f7 and offers the b2 pawn as well. Recapturing at once with Nxc3 would be the Göring Gambit, a different and less ambitious animal.
            fr: Voici le coup qui fait le Gambit danois. Les Blancs ne se hâtent pas de reprendre le pion c3 mais posent le fou en c4 contre f7 et offrent en prime le pion b2. Reprendre tout de suite par Nxc3 donnerait le Gambit Göring, autre chose et moins ambitieux.
          dismissRest:
            reason:
              vi: Đen không ăn b2, không chơi d5 và cũng không chơi Nf6. Khi đó Trắng chơi Nxc3 và có một thế cờ trong mơ, hơn hẳn về phát triển, tượng c4 nhắm f7, mã c3 nhắm d5, và chỉ kém đúng một tốt. Nước 4...c2 đẩy tốt thêm một bước thì Trắng chỉ việc Qxc2, lấy lại tốt và đưa hậu ra cột c. Các nước như Bb4 hay Nc6 đều chơi được nhưng không giải quyết được vấn đề chính của Đen, là vua vẫn đứng giữa bàn cờ.
              en: Black does not take on b2, does not play ...d5 and does not play ...Nf6. White then answers Nxc3 and has a dream position — well ahead in development, the bishop on c4 against f7, the knight on c3 eyeing d5, and only one pawn behind. 4...c2, pushing the pawn one square further, is answered by Qxc2, which takes the pawn back and puts the queen on the c-file. Moves like ...Bb4 and ...Nc6 are playable but do not address Black's real problem, which is a king still sitting in the centre.
              fr: Les Noirs ne prennent pas en b2, ne jouent pas ...d5 et ne jouent pas ...Nf6. Les Blancs répondent alors Nxc3 et obtiennent une position de rêve, largement en avance de développement, le fou en c4 contre f7, le cavalier c3 lorgnant d5, et un seul pion de retard. 4...c2, qui pousse le pion d'une case de plus, se traite par Qxc2, qui reprend le pion et place la dame sur la colonne c. Des coups comme ...Bb4 ou ...Nc6 sont jouables mais ne règlent pas le vrai problème noir, un roi resté au centre.
          children:
            - ply: cxb2
              replyQuality: good
              frequency: common
              annotation:
                vi: Đen ăn nốt con tốt thứ hai. Về mặt vật chất thì đây là nước đúng, hai tốt là hai tốt. Về mặt thực chiến thì đây là nước Trắng mong chờ, vì nó mở đường chéo a1-h8 cho tượng Trắng và tốn thêm một nhịp nữa của Đen.
                en: Black takes the second pawn too. Materially this is correct — two pawns are two pawns. Practically it is what White is hoping for, because it opens the a1-h8 diagonal for White's bishop and costs Black another tempo.
                fr: Les Noirs prennent aussi le second pion. Matériellement c'est correct, deux pions valent deux pions. Pratiquement, c'est ce que les Blancs espèrent, car cela ouvre la diagonale a1-h8 pour leur fou et coûte encore un temps aux Noirs.
              children:
                - ply: Bxb2
                  annotation:
                    vi: Bây giờ thế cờ đã đầy đủ. Tượng c4 nhắm f7, tượng b2 nhắm g7 và cả hai đường chéo đều thông. Trắng kém hai tốt và có đúng một thứ để đổi lại, là thời gian.
                    en: Now the position is complete. The bishop on c4 looks at f7, the bishop on b2 looks at g7, and both diagonals are clear. White is two pawns down and has exactly one thing in return, which is time.
                    fr: La position est maintenant complète. Le fou c4 vise f7, le fou b2 vise g7, et les deux diagonales sont dégagées. Les Blancs ont deux pions de moins et une seule chose en échange, le temps.
                  dismissRest:
                    reason:
                      vi: Đen không chơi ...d5. Đây là nhóm nước mà Gambit Đan Mạch sống nhờ nó, vì mọi nước phát triển tự nhiên đều để hai con tượng Trắng làm việc. Nước ...Nf6 hay ...Nc6 phát triển thì Trắng chơi Nf3, Ne2, O-O rồi Rad1 và Re1 với vua Đen còn ở giữa. Nước ...Bb4+ thì Nd2 hoặc Nc3 chặn và Trắng còn được thêm một nhịp. Nước ...Qe7 hay ...Qg5 đem hậu ra sớm thì Nf3 đuổi hoặc Ne2 rồi O-O là đủ. Nước ...f6 chặn đường chéo a1-h8 nhưng làm thủng vua và Qh5+ trở thành nước thật. Điểm chung là Đen giữ cả hai con tốt thừa và trả bằng thời gian, đúng thứ Trắng đã mua.
                      en: Black does not play ...d5. This is the group the Danish lives on, because every natural developing move leaves both white bishops at work. ...Nf6 and ...Nc6 develop, and White plays Nf3, Ne2, castles and puts rooks on d1 and e1 with the black king still in the centre. ...Bb4+ is blocked by Nd2 or Nc3 and hands White another tempo. ...Qe7 and ...Qg5 bring the queen out early and Nf3 chases it, or Ne2 and castling is enough. ...f6 shuts the a1-h8 diagonal but opens the king, and Qh5+ becomes a real move. What they share is that Black keeps both extra pawns and pays in time, which is exactly what White bought.
                      fr: Les Noirs ne jouent pas ...d5. C'est le groupe dont vit le Gambit danois, car chaque coup de développement naturel laisse travailler les deux fous blancs. ...Nf6 et ...Nc6 développent, et les Blancs jouent Nf3, Ne2, roquent et placent les tours en d1 et e1 avec le roi noir encore au centre. ...Bb4+ est paré par Nd2 ou Nc3 et offre un temps de plus aux Blancs. ...Qe7 et ...Qg5 sortent la dame trop tôt et Nf3 la chasse, ou bien Ne2 suivi du roque suffit. ...f6 ferme la diagonale a1-h8 mais ouvre le roi, et Qh5+ devient un vrai coup. Leur point commun est que les Noirs gardent les deux pions et paient en temps, c'est-à-dire précisément ce que les Blancs ont acheté.
                  children:
                    - ply: d5
                      replyQuality: best
                      frequency: common
                      annotation:
                        vi: Nước đúng, và nó là nước duy nhất đúng. Đen trả lại một tốt để chặn cả hai đường chéo cùng lúc, tượng c4 bị con tốt d5 chắn và tượng b2 sắp bị ...Nf6 che. Ai biết nước này thì Gambit Đan Mạch không đáng sợ nữa.
                        en: Correct, and the only move that is. Black gives one pawn back to block both diagonals at once — the pawn on d5 stops the c4 bishop, and ...Nf6 is about to stand in front of the one on b2. Anyone who knows this move has nothing to fear from the Danish.
                        fr: Le bon coup, et le seul. Les Noirs rendent un pion pour barrer les deux diagonales d'un coup, le pion d5 arrête le fou c4 et ...Nf6 va se placer devant celui de b2. Qui connaît ce coup n'a plus rien à craindre du Gambit danois.
