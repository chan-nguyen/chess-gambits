# Slav Defense: Diemer Gambit. Frozen defining line 1.d4 d5 2.c4 c6 3.e4, which ends on
# White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). Replayed
# with chess.js: 3...dxe4 simply takes the offered pawn, and nothing is hanging for either
# side afterwards. searchMate at 4 moves from this position returns unknown, which the
# stopping rule treats the same as no-mate, so no forced mate is claimed.
id: slav-defense-diemer-gambit
name: 'Slav Defense: Diemer Gambit'
eco: D10
category: gambit
side: white
definingLine: [d4, d5, c4, c6, e4]
soundness:
  value: dubious
  reviewedAt: '2026-09-18'
  basis:
    by: chan
    at: '2026-09-18'
    source: >-
      A judgement. White offers the e4 pawn to open the centre before Black finishes the
      usual Slav setup, betting on a lead in development making up for the pawn. It is a
      sharp practical try rather than an established main line. No engine was consulted and
      no database was queried.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
