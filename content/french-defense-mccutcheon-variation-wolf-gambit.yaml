# French Defense: McCutcheon Variation, Wolf Gambit. Defining line 1.e4 e6 2.d4 d5 3.Nc3 Bb4
# 4.Ne2 Nf6 5.Bg5, which ends on White's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5).
# Part of batch s of round 4 (#182). Every ply below was replayed with chess.js before it
# was annotated; searchMate at 3 moves from each leaf returns no-mate, so no forced mate is
# claimed anywhere in this entry, and no capture is left going free at any leaf.
id: french-defense-mccutcheon-variation-wolf-gambit
name: 'French Defense: McCutcheon Variation, Wolf Gambit'
eco: C15
category: gambit
side: white
definingLine: [e4, e6, d4, d5, Nc3, Bb4, Ne2, Nf6, Bg5]
soundness:
  value: dubious
  reviewedAt: '2026-10-01'
  basis:
    by: chan
    at: '2026-10-01'
    source: >-
      A judgement. At the end of the defining line the pawn count is level, eight each, but
      the knight on c3 is pinned to the king by the bishop on b4, so the e4 pawn, attacked
      by the pawn on d5 and the knight on f6, has no defender that can move. Black can win
      it at once, and the bishop on g5 attacking the knight on f6, which is defended twice,
      does not change that, which is why the entry is rated dubious. No engine was consulted
      and no database was queried.
judgement:
  by: chan
  at: '2026-10-01'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa chơi 5.Bg5, tấn công mã f6, và số tốt đang ngang nhau, mỗi bên tám. Mã c3 bị tượng b4 ghim vào vua e1, nên không thể ăn lại ở e4; tốt e4 bị tốt d5 và mã f6 tấn công.
    en: White has just played 5.Bg5, attacking the knight on f6, and the pawn count is level, eight each. The knight on c3 is pinned to the king on e1 by the bishop on b4, so it cannot recapture on e4; the e4 pawn is attacked by the pawn on d5 and the knight on f6.
    fr: Les Blancs viennent de jouer 5.Bg5, attaquant le cavalier f6, et le compte des pions est égal, huit de chaque côté. Le cavalier c3 est cloué au roi e1 par le fou b4, il ne peut donc pas reprendre en e4 ; le pion e4 est attaqué par le pion d5 et le cavalier f6.
  dismissRest:
    reason:
      vi: 'Đen chơi nước khác thay vì 5...dxe4 ở đây, chẳng hạn 5...h6 hoặc 5...Bxc3+. Mục này chỉ mô hình hóa 5...dxe4 và không phân tích các nước kia; nhiệm vụ của Trắng thường vẫn như cũ: thoát khỏi thế ghim ở c3 và tìm điều gì đó đáng giá để đổi lấy con tốt.'
      en: "Black plays something other than 5...dxe4 here, for instance 5...h6 or 5...Bxc3+. This entry models only 5...dxe4 and does not analyse those moves; White's task usually stays the same: get out of the pin on c3 and look for something to show for the pawn."
      fr: "Les Noirs jouent autre chose que 5...dxe4 ici, par exemple 5...h6 ou 5...Bxc3+. Cette entrée ne modélise que 5...dxe4 et n'analyse pas ces coups ; la tâche des Blancs reste en général la même : sortir du clouage en c3 et chercher de quoi justifier le pion."
  children:
    - ply: dxe4
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen ăn tốt bằng 5...dxe4. Mã c3 vẫn bị ghim, nên tốt mới ở e4 không bị quân nào có thể ăn nó tấn công.
        en: Black takes the pawn with 5...dxe4. The knight on c3 stays pinned, so the new pawn on e4 is not attacked by anything that can capture it.
        fr: Les Noirs prennent le pion par 5...dxe4. Le cavalier c3 reste cloué, de sorte que le nouveau pion en e4 n'est attaqué par aucune pièce capable de le prendre.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém đúng một tốt sạch. Mã c3 vẫn bị tượng b4 ghim vào vua e1 và không thể ăn ở e4, còn tốt của Đen bị chồng ở e6 và e4. Tượng g5 tấn công mã f6, được hậu d8 và tốt g7 bảo vệ.'
          en: "Count the pawns: White seven, Black eight, so White is a clean pawn down. The knight on c3 is still pinned to the king on e1 by the bishop on b4 and cannot take on e4, and Black's pawns are doubled on e6 and e4. The bishop on g5 attacks the knight on f6, which the queen on d8 and the pawn on g7 defend."
          fr: 'Comptez les pions : sept pour les Blancs, huit pour les Noirs, donc les Blancs ont un pion net de moins. Le cavalier c3 est toujours cloué au roi e1 par le fou b4 et ne peut pas prendre en e4, et les pions noirs sont doublés en e6 et e4. Le fou g5 attaque le cavalier f6, que la dame d8 et le pion g7 défendent.'
        plan:
          vi: Trắng chơi a3 để đặt câu hỏi cho tượng b4, và khi thế ghim không còn nữa, chẳng hạn sau ...Be7, mã c3 được tự do ăn ở e4. Đen chơi ...O-O và ...Nc6 để hoàn tất phát triển, giữ tốt e4 được mã f6 bảo vệ.
          en: White plays a3 to put the question to the bishop on b4, and once the pin is gone, for instance after ...Be7, the knight on c3 is free to take on e4. Black plays ...O-O and ...Nc6 to finish development, keeping the e4 pawn defended by the knight on f6.
          fr: Les Blancs jouent a3 pour poser la question au fou b4, et une fois le clouage levé, par exemple après ...Be7, le cavalier c3 est libre de prendre en e4. Les Noirs jouent ...O-O et ...Nc6 pour achever leur développement, en gardant le pion e4 défendu par le cavalier f6.
        basis:
          by: chan
          at: 2026-10-01
