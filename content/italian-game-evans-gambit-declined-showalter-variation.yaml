# Italian Game: Evans Gambit Declined, Showalter Variation. Defining line 1.e4 e5 2.Nf3 Nc6
# 3.Bc4 Bc5 4.b4 Bb6 5.a4 a6 6.Nc3, which ends on White's own ply, so the root is an
# opponent node (docs/CONTEXT.md, invariant 5).
