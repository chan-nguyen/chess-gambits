tree:
  annotation:
    vi: Trắng vừa chơi 6.Nc3, phát triển mã và chuẩn bị bảo vệ e4. Tốt b4 bị mã c6 tấn công mà không có quân nào bảo vệ, còn tốt f2 bị tượng b6 tấn công và được vua bảo vệ. Mục này đi theo nước 6...Nf6.
    en: White has just played 6.Nc3, developing the knight and preparing to defend e4. The b4 pawn is attacked by the knight on c6 and nothing defends it, and the f2 pawn is attacked by the bishop on b6 and defended by the king. This entry follows 6...Nf6.
    fr: Les Blancs viennent de jouer 6.Nc3, développant le cavalier et préparant la défense de e4. Le pion b4 est attaqué par le cavalier c6 et rien ne le défend, et le pion f2 est attaqué par le fou b6 et défendu par le roi. Cette entrée suit 6...Nf6.
  dismissRest:
    reason:
      vi: Đen chơi một nước khác thay vì 6...Nf6 ở đây, chẳng hạn 6...Nxb4, ăn con tốt hở. Mục này chỉ mô hình hóa nước đi mã lên f6.
      en: Black plays something other than 6...Nf6 here, for instance 6...Nxb4, which takes the loose pawn. This entry models only the knight move to f6.
      fr: Les Noirs jouent autre chose que 6...Nf6 ici, par exemple 6...Nxb4, qui prend le pion en prise. Cette entrée ne modélise que le saut du cavalier en f6.
  children:
    - ply: Nf6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen phát triển mã lên f6, nơi nó tấn công tốt e4, quân được mã c3 bảo vệ.
        en: Black develops the knight to f6, where it attacks the e4 pawn, which the knight on c3 defends.
        fr: Les Noirs développent le cavalier en f6, où il attaque le pion e4, que le cavalier c3 défend.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng tám, Đen tám — chưa có tốt nào bị ăn. Tốt b4 bị mã c6 tấn công mà không có quân nào bảo vệ, nên Trắng phải xử lý ngay; tốt e4 bị mã f6 tấn công và được mã c3 bảo vệ, còn tốt e5 bị mã f3 tấn công và được mã c6 bảo vệ. Hai bên chưa nhập thành.'
          en: 'Count the pawns: White eight, Black eight — nothing has been captured. The b4 pawn is attacked by the knight on c6 and nothing defends it, so White has to act on it at once; the e4 pawn is attacked by the knight on f6 and defended by the knight on c3, and the e5 pawn is attacked by the knight on f3 and defended by the knight on c6. Neither side has castled.'
          fr: "Comptez les pions : huit pour les Blancs, huit pour les Noirs — rien n'a été pris. Le pion b4 est attaqué par le cavalier c6 et rien ne le défend, donc les Blancs doivent agir tout de suite ; le pion e4 est attaqué par le cavalier f6 et défendu par le cavalier c3, et le pion e5 est attaqué par le cavalier f3 et défendu par le cavalier c6. Aucun camp n'a roqué."
        plan:
          vi: Trắng chơi b5, đánh mã c6, hoặc Ba3, bảo vệ b4, rồi nhập thành. Đen chơi ...d6 và ...O-O để hoàn tất phát triển, và ăn tốt b4 bằng ...Nxb4 nếu Trắng bỏ mặc nó.
          en: White plays b5, hitting the knight on c6, or Ba3, defending b4, and then castles. Black plays ...d6 and ...O-O to finish development, and takes the b4 pawn with ...Nxb4 if White leaves it.
          fr: Les Blancs jouent b5, frappant le cavalier c6, ou Ba3, défendant b4, puis roquent. Les Noirs jouent ...d6 et ...O-O pour achever leur développement, et prennent le pion b4 par ...Nxb4 si les Blancs le laissent.
        basis:
          by: chan
          at: 2026-09-30
