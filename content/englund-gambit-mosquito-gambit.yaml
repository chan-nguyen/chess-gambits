tree:
  annotation:
    vi: Đen đưa hậu ra h4 ngay từ nước thứ hai, một nước trông có vẻ hung hãn nhưng thực ra chưa đe doạ gì cụ thể, vì chưa có quân Trắng nào đứng trên đường đi của con hậu.
    en: Black brings the queen to h4 as early as move two, a move that looks aggressive but does not actually threaten anything concrete yet, since no White piece sits in the queen's way.
    fr: Les Noirs amènent la dame en h4 dès le deuxième coup, un coup qui a l'air agressif mais ne menace en réalité rien de concret pour l'instant, puisqu'aucune pièce blanche ne se trouve sur le chemin de la dame.
  dismissRest:
    reason:
      vi: Trắng không phát triển bằng một nước vừa an toàn vừa đe doạ đuổi con hậu. Các nước khác ở đây, như e4 hay Nf3, cũng hợp lý nhưng không cho Trắng cơ hội đuổi hậu ngay và lấy nhịp rõ ràng như nước được chọn.
      en: White does not develop with a move that is both safe and threatens to chase the queen. The alternatives here, such as e4 or Nf3, are also reasonable but do not give White the immediate chance to chase the queen and gain a clear tempo the way the chosen move does.
      fr: Les Blancs ne développent pas par un coup à la fois sûr et menaçant de chasser la dame. Les alternatives ici, comme e4 ou Nf3, sont aussi raisonnables mais ne donnent pas aux Blancs l'occasion immédiate de chasser la dame et de gagner un temps net comme le fait le coup choisi.
  children:
    - ply: Nc3
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng phát triển mã ra ô tự nhiên, chuẩn bị g3 để vừa đuổi hậu vừa fianchetto tượng, và chưa vội trả lời trực tiếp con hậu h4 vì nó chưa doạ gì cả.
        en: White develops the knight to its natural square, preparing g3 to chase the queen and fianchetto the bishop in one move, and is in no hurry to answer the h4 queen directly since it threatens nothing.
        fr: Les Blancs développent le cavalier sur sa case naturelle, préparant g3 pour chasser la dame et fianchetter le fou en un seul coup, et ne se pressent pas de répondre directement à la dame en h4 puisqu'elle ne menace rien.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy, đúng một tốt Trắng đang giữ từ 2.dxe5. Con hậu Đen ở h4 đứng khá xa trận địa và sắp bị g3 đuổi tiếp, còn Trắng đã phát triển được một quân mà chưa mất nhịp nào.
          en: Count the pawns and it is eight for White, seven for Black, exactly the one White has held since 2.dxe5. Black's queen on h4 sits far from the action and is about to be chased again by g3, while White has developed a piece without losing any time at all.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs, exactement celui que les Blancs tiennent depuis 2.dxe5. La dame noire en h4 se trouve loin de l'action et va bientôt être chassée de nouveau par g3, tandis que les Blancs ont développé une pièce sans perdre le moindre temps.
        plan:
          vi: Trắng chơi g3 đuổi hậu, buộc nó phải lùi về e7 hay h5, rồi Nf3, Bg2 và O-O, hoàn tất phát triển và giữ vững con tốt thừa. Đen chơi Bc5 hoặc Nc6, cố lấy lại con tốt e5 hoặc gây sức ép nào đó bù lại nhịp đã mất vì đưa hậu ra quá sớm.
          en: White plays g3 to chase the queen, forcing it back to e7 or h5, then Nf3, Bg2 and O-O, completing development and holding the extra pawn. Black plays Bc5 or Nc6, trying to win back the e5 pawn or build some pressure to make up for the time lost bringing the queen out too early.
          fr: Les Blancs jouent g3 pour chasser la dame, la forçant à reculer en e7 ou h5, puis Nf3, Bg2 et O-O, achevant leur développement et gardant le pion supplémentaire. Les Noirs jouent Bc5 ou Nc6, en essayant de regagner le pion e5 ou de bâtir une pression pour compenser le temps perdu à sortir la dame trop tôt.
        basis:
          by: chan
          at: '2026-09-21'
