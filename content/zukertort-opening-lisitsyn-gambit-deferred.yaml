# Zukertort Opening: Lisitsyn Gambit Deferred. Frozen defining line 1.Nf3 f5 2.d3 Nf6
# 3.e4, which ends on White's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). Replayed with chess.js through the reply fxe4; searchMate at 3 moves from
# the resulting position returns no-mate, so no forced mate is claimed anywhere in this
# entry.
id: zukertort-opening-lisitsyn-gambit-deferred
name: 'Zukertort Opening: Lisitsyn Gambit Deferred'
eco: A04
category: gambit
side: white
definingLine: [Nf3, f5, d3, Nf6, e4]
soundness:
  value: unsound
  reviewedAt: '2026-10-01'
  basis:
    by: chan
    at: '2026-10-01'
    source: >-
      A judgement. At the end of the defining line the pawn count is level, eight each, but
      the e4 pawn is attacked twice, by the f5 pawn and the knight on f6, and defended only by
      the d3 pawn, so Black can take it; White would then be a pawn down, since dxe4 Nxe4
      would still leave White a pawn short, and has not been shown to get more in return than
      a half-open e-file. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-10-01'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: 'Trắng vừa chơi 3.e4, đẩy tốt e tiến hai ô. Tốt e4 bị tốt f5 và mã f6 của Đen tấn công và chỉ có tốt d3 bảo vệ, còn tốt f5 bị tốt e4 tấn công mà không có quân nào bảo vệ. Số tốt đang cân bằng, mỗi bên tám. Mục này đi theo nước Đen ăn 3...fxe4.'
    en: "White has just played 3.e4, pushing the e-pawn two squares. The e4 pawn is attacked by Black's f5 pawn and the knight on f6 and defended only by the d3 pawn, while the f5 pawn is attacked by the e4 pawn and nothing defends it. The pawn count is level, eight each. This entry follows Black capturing 3...fxe4."
    fr: 'Les Blancs viennent de jouer 3.e4, poussant le pion e de deux cases. Le pion e4 est attaqué par le pion f5 et le cavalier f6 noirs et défendu seulement par le pion d3, tandis que le pion f5 est attaqué par le pion e4 sans être défendu. Le compte des pions est égal, huit chacun. Cette entrée suit la prise 3...fxe4 des Noirs.'
  dismissRest:
    reason:
      vi: 'Đen chơi một nước khác thay vì 3...fxe4, nên tốt e4 chưa bị ăn ngay. Mục này chỉ đi theo nước ăn tốt.'
      en: 'Black plays something other than 3...fxe4 here, so the e4 pawn is not taken at once. This entry follows only the capture.'
      fr: "Les Noirs jouent autre chose que 3...fxe4 ici, si bien que le pion e4 n'est pas pris tout de suite. Cette entrée ne suit que la prise."
  children:
    - ply: fxe4
      replyQuality: good
      frequency: common
      annotation:
        vi: 'Đen ăn tốt e4 bằng tốt f. Tốt e4 mới tấn công cả mã f3 lẫn tốt d3, và được mã f6 bảo vệ.'
        en: 'Black takes the e4 pawn with the f-pawn. The new pawn on e4 attacks both the knight on f3 and the d3 pawn, and the knight on f6 defends it.'
        fr: 'Les Noirs prennent le pion e4 avec le pion f. Le nouveau pion e4 attaque à la fois le cavalier f3 et le pion d3, et le cavalier f6 le défend.'
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên con tốt thí chưa lấy lại được. Tốt e4 của Đen bị tốt d3 tấn công một lần và được mã f6 bảo vệ một lần, nên dxe4 Nxe4 sẽ đưa số tốt về sáu so với bảy: Trắng vẫn kém một tốt. Trắng không còn tốt e nên cột e là cột nửa mở của Trắng, còn Đen không còn tốt f nên cột f là cột nửa mở của Đen.'
          en: "Count the pawns: White seven, Black eight, so the gambit pawn has not come back. Black's e4 pawn is attacked once, by the d3 pawn, and defended once, by the knight on f6, so dxe4 Nxe4 would bring the count to six against seven: White would still be a pawn down. White has no e-pawn, so the e-file is half-open for White, and Black has no f-pawn, so the f-file is half-open for Black."
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs, donc le pion du gambit n'est pas revenu. Le pion e4 noir est attaqué une fois, par le pion d3, et défendu une fois, par le cavalier f6, si bien que dxe4 Nxe4 ramènerait le compte à six contre sept : les Blancs auraient toujours un pion de moins. Les Blancs n'ont plus de pion e, si bien que la colonne e est semi-ouverte pour eux, et les Noirs n'ont plus de pion f, si bien que la colonne f est semi-ouverte pour eux."
        plan:
          vi: 'Trắng ăn bằng dxe4, Đen ăn lại bằng mã, rồi Trắng phát triển bằng Bd3, nhập thành và chơi c4. Đen bảo vệ mã e4 bằng ...d5 và ...Bf5 rồi phát triển bằng ...Nc6.'
          en: 'White takes with dxe4, Black recaptures with the knight, and White then develops with Bd3, castles and plays c4. Black defends the knight on e4 with ...d5 and ...Bf5 and develops with ...Nc6.'
          fr: 'Les Blancs prennent par dxe4, les Noirs reprennent avec le cavalier, puis les Blancs se développent par Bd3, roquent et jouent c4. Les Noirs défendent le cavalier e4 par ...d5 et ...Bf5 et se développent par ...Nc6.'
        basis:
          by: chan
          at: '2026-10-01'
