tree:
  annotation:
    vi: Trắng vừa chơi 5.f3, tấn công tốt e4 lần thứ hai. Tốt này bị mã c3 và tốt f3 tấn công mà chỉ có mã f6 bảo vệ, và mã f6 bị tượng g5 tấn công.
    en: White has just played 5.f3, attacking the pawn on e4 a second time. It is attacked by the knight on c3 and the f3 pawn and defended only by the knight on f6, which the bishop on g5 attacks.
    fr: Les Blancs viennent de jouer 5.f3, attaquant le pion e4 une seconde fois. Il est attaqué par le cavalier c3 et le pion f3 et défendu seulement par le cavalier f6, que le fou g5 attaque.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 5...d5. Bài này chỉ đi theo nhánh 5...d5; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 5...d5 here. This entry follows the reply 5...d5 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 5...d5. Cette fiche ne suit que la réponse 5...d5 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: d5
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen hỗ trợ tốt e4 bằng 5...d5, nên tốt này được bảo vệ hai lần, bởi mã f6 và tốt d5. Tốt d5 được hậu và mã f6 bảo vệ.
        en: Black supports the e4 pawn with 5...d5, so it is defended twice, by the knight on f6 and the d5 pawn. The d5 pawn is defended by the queen and the knight on f6.
        fr: 'Les Noirs soutiennent le pion e4 par 5...d5 : il est ainsi défendu deux fois, par le cavalier f6 et le pion d5. Le pion d5 est défendu par la dame et le cavalier f6.'
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt. Tốt e4 bị mã c3 và tốt f3 tấn công hai lần và được mã f6 và tốt d5 bảo vệ hai lần. Mã f6 bị tượng g5 tấn công và chỉ có tốt e7 bảo vệ.'
          en: 'Count the pawns: White seven, Black eight, so White is a pawn down. The pawn on e4 is attacked twice, by the knight on c3 and the f3 pawn, and defended twice, by the knight on f6 and the d5 pawn. The knight on f6 is attacked by the bishop on g5 and defended only by the e7 pawn.'
          fr: 'Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins. Le pion e4 est attaqué deux fois, par le cavalier c3 et le pion f3, et défendu deux fois, par le cavalier f6 et le pion d5. Le cavalier f6 est attaqué par le fou g5 et défendu seulement par le pion e7.'
        plan:
          vi: Trắng có thể ăn e4 bằng fxe4 hoặc đổi con mã đang bảo vệ bằng Bxf6; Đen củng cố trung tâm bằng ...Bg7 và ...c6, giữ tốt thừa.
          en: White can take on e4 with fxe4 or trade off the defending knight with Bxf6; Black firms up the centre with ...Bg7 and ...c6, keeping the extra pawn.
          fr: Les Blancs peuvent prendre en e4 par fxe4 ou échanger le cavalier défenseur par Bxf6 ; les Noirs consolident le centre par ...Bg7 et ...c6, en gardant le pion en plus.
