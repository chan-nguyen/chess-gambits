# French Defense: Wing Gambit. Frozen defining line 1.e4 e6 2.Nf3 d5 3.e5 c5 4.b4, which
# ends on White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
# The line below was replayed with chess.js before being annotated.
id: french-defense-wing-gambit
name: 'French Defense: Wing Gambit'
eco: C00
category: gambit
side: white
definingLine: [e4, e6, Nf3, d5, e5, c5, b4]
soundness:
  value: dubious
  reviewedAt: '2026-09-21'
  basis:
    by: chan
    at: '2026-09-21'
    source: >-
      A judgement. White offers the b-pawn to undermine Black's c5 pawn, which is the main
      support of the whole Advance French pawn chain, but Black can simply keep the extra
      pawn and the chain still needs to be broken by other means. No engine was consulted
      and no database was queried.
judgement:
  by: chan
  at: '2026-09-21'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng chơi 4.b4, mời Đen ăn con tốt để đổi lấy việc phá vỡ nền tảng của tốt c5, quân đang chống đỡ cho toàn bộ chuỗi tốt của Đen trong biến Tiến Tốt của Phòng thủ Pháp.
    en: White plays 4.b4, inviting Black to take the pawn in exchange for undermining the c5 pawn, the piece holding up Black's entire pawn chain in the Advance Variation of the French Defense.
    fr: Les Blancs jouent 4.b4, invitant les Noirs à prendre le pion en échange de la sape du pion c5, celui qui soutient toute la chaîne de pions noire dans la Variante d'Avance de la Défense française.
  dismissRest:
    reason:
      vi: Đen không ăn con tốt b4. Các nước khác như Nc6 hay Qb6 để nguyên con tốt b4 trên bàn cờ, nghĩa là lời mời vẫn chưa hề được nhận.
      en: Black does not take the b4 pawn. Anything else, such as Nc6 or Qb6, leaves the b4 pawn sitting on the board, meaning the offer has still not actually been accepted.
      fr: Les Noirs ne prennent pas le pion b4. Tout le reste, comme Nc6 ou Qb6, laisse le pion b4 sur l'échiquier, ce qui veut dire que l'offre n'a toujours pas été acceptée.
  children:
    - ply: cxb4
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen ăn con tốt ngay lập tức, quân duy nhất có thể ăn tại đó. Chuỗi tốt d5-e6 vẫn còn nguyên, và giờ Đen hơn hẳn một tốt.
        en: Black takes the pawn at once, the only piece that can capture there. The d5-e6 pawn chain is still intact, and Black is now a clean pawn up.
        fr: Les Noirs prennent aussitôt le pion, la seule pièce pouvant capturer là. La chaîne de pions d5-e6 reste intacte, et les Noirs ont maintenant un pion net d'avance.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy. Đen hơn đúng một tốt sạch, chuỗi tốt d5-e6 vẫn vững, còn Trắng chỉ có ý định dùng a3 hay c3 để lấy lại vị trí trên cánh hậu, chưa có gì cụ thể ngay lập tức.
          en: Count the pawns and it is eight for Black, seven for White. Black is a clean pawn up, the d5-e6 chain is still solid, and White only has the intention to use a3 or c3 to regain some queenside footing, nothing concrete right away.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs. Les Noirs ont un pion net d'avance, la chaîne d5-e6 reste solide, et les Blancs n'ont que l'intention d'utiliser a3 ou c3 pour regagner un peu de terrain à l'aile dame, rien de concret dans l'immédiat.
        plan:
          vi: Trắng chơi a3 hoặc c3, cố phá lại con tốt b4 và mở đường cho các quân nhẹ, cùng với Bd3, O-O và c4 tấn công vào tốt d5, tìm cách bù lại con tốt đã mất. Đen chơi Bd7, Nc6 và Qb6, giữ vững chuỗi tốt, hoàn tất phát triển và cố đổi bớt quân để giữ con tốt thừa vào tàn cuộc.
          en: White plays a3 or c3, trying to break the b4 pawn back and open lines for the minor pieces, together with Bd3, O-O and c4 to attack the d5 pawn, looking to make up for the lost pawn. Black plays Bd7, Nc6 and Qb6, keeping the pawn chain solid, completing development and looking to trade pieces to carry the extra pawn into the endgame.
          fr: Les Blancs jouent a3 ou c3, essayant de reprendre le pion b4 et d'ouvrir des lignes pour les pièces mineures, avec Bd3, O-O et c4 pour attaquer le pion d5, cherchant à compenser le pion perdu. Les Noirs jouent Bd7, Nc6 et Qb6, gardant la chaîne de pions solide, achevant leur développement et cherchant à échanger des pièces pour porter le pion supplémentaire jusqu'à la finale.
        basis:
          by: chan
          at: '2026-09-21'
