# Caro-Kann Defense: Hector Gambit. Defining line 1.e4 c6 2.Nc3 d5 3.Nf3 dxe4 4.Ng5, which
# ends on White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
# Part of batch s of round 4 (#182). Every ply below was replayed with chess.js before it
# was annotated; searchMate at 3 moves from each leaf returns no-mate, so no forced mate is
# claimed anywhere in this entry, and no capture is left going free at any leaf.
id: caro-kann-defense-hector-gambit
name: 'Caro-Kann Defense: Hector Gambit'
eco: B10
category: gambit
side: white
definingLine: [e4, c6, Nc3, d5, Nf3, dxe4, Ng5]
soundness:
  value: dubious
  reviewedAt: '2026-10-01'
  basis:
    by: chan
    at: '2026-10-01'
    source: >-
      A judgement. At the end of the defining line White is a pawn down, seven pawns against
      eight, and the pawn on e4 is attacked twice and defended by nothing, so Black has to
      decide at once how to hold it. The knight on g5 has no target to win, since f7 and h7
      are both defended, and Black can answer with a developing move such as 4...Bf5, which
      is why the entry is rated dubious. No engine was consulted and no database was
      queried.
judgement:
  by: chan
  at: '2026-10-01'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa chơi 4.Ng5, nên số tốt là Trắng bảy, Đen tám. Tốt e4 bị tấn công hai lần, bởi mã g5 và mã c3, và không được quân nào bảo vệ.
    en: White has just played 4.Ng5, so the pawn count is White seven, Black eight. The pawn on e4 is attacked twice, by the knight on g5 and the knight on c3, and defended by nothing.
    fr: Les Blancs viennent de jouer 4.Ng5, de sorte que le compte des pions est de sept pour les Blancs, huit pour les Noirs. Le pion e4 est attaqué deux fois, par le cavalier g5 et le cavalier c3, et n'est défendu par aucune pièce.
  dismissRest:
    reason:
      vi: 'Đen chơi nước khác thay vì 4...Bf5 ở đây, chẳng hạn 4...Nf6 hoặc 4...e6. Mục này chỉ mô hình hóa 4...Bf5 và không phân tích các nước kia; nhiệm vụ của Trắng thường vẫn như cũ: lấy lại con tốt và hoàn tất phát triển.'
      en: "Black plays something other than 4...Bf5 here, for instance 4...Nf6 or 4...e6. This entry models only 4...Bf5 and does not analyse those moves; White's task usually stays the same: win the pawn back and finish development."
      fr: "Les Noirs jouent autre chose que 4...Bf5 ici, par exemple 4...Nf6 ou 4...e6. Cette entrée ne modélise que 4...Bf5 et n'analyse pas ces coups ; la tâche des Blancs reste en général la même : regagner le pion et achever leur développement."
  children:
    - ply: Bf5
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen bảo vệ tốt e4 bằng 4...Bf5, đồng thời giữ luôn h7. Tốt e4 vẫn bị tấn công hai lần, bởi mã g5 và mã c3, và giờ được bảo vệ một lần, bởi tượng f5.
        en: Black defends the e4 pawn with 4...Bf5, which also guards h7. The pawn on e4 is still attacked twice, by the knight on g5 and the knight on c3, and is now defended once, by the bishop on f5.
        fr: Les Noirs défendent le pion e4 par 4...Bf5, qui garde aussi h7. Le pion e4 est toujours attaqué deux fois, par le cavalier g5 et le cavalier c3, et il est maintenant défendu une fois, par le fou f5.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nhưng tốt e4 bị tấn công hai lần và chỉ được bảo vệ một lần, nên Trắng có thể lấy lại nó: sau Ngxe4 Bxe4 Nxe4 số tốt ngang nhau, mỗi bên bảy. Tốt f7, được vua bảo vệ, và tốt h7, được xe và tượng bảo vệ, là những mục tiêu khác của mã và đều có quân bảo vệ.'
          en: "Count the pawns: White seven, Black eight, but the e4 pawn is attacked twice and defended once, so White can take it back: after Ngxe4 Bxe4 Nxe4 the count is level at seven each. The f7 pawn, defended by the king, and the h7 pawn, defended by the rook and the bishop, are the knight's other targets and are both defended."
          fr: 'Comptez les pions : sept pour les Blancs, huit pour les Noirs, mais le pion e4 est attaqué deux fois et défendu une fois, donc les Blancs peuvent le reprendre : après Ngxe4 Bxe4 Nxe4, le compte est égal, sept de chaque côté. Le pion f7, défendu par le roi, et le pion h7, défendu par la tour et le fou, sont les autres cibles du cavalier et sont tous deux défendus.'
        plan:
          vi: Trắng ăn e4 bằng mã từ g5, và nếu Đen đổi quân ở e4 thì ăn lại bằng mã còn lại, rồi phát triển bằng d3 và Be2. Đen chơi ...Nf6 để bảo vệ e4 lần nữa, rồi ...e6 và ...Be7.
          en: White takes on e4 with the knight from g5 and, if Black trades on e4, recaptures with the other knight, then develops with d3 and Be2. Black plays ...Nf6 to defend e4 again, then ...e6 and ...Be7.
          fr: Les Blancs prennent en e4 avec le cavalier de g5 et, si les Noirs échangent en e4, reprennent avec l'autre cavalier, puis se développent par d3 et Be2. Les Noirs jouent ...Nf6 pour défendre à nouveau e4, puis ...e6 et ...Be7.
        basis:
          by: chan
          at: 2026-10-01
