# King's Gambit Accepted: Fischer Defense, Spanish Variation, taught. Frozen defining line
# 1.e4 e5 2.f4 exf4 3.Nf3 d6 4.d4 Nf6 5.Bd3 ends on White's own 5.Bd3, so the root is an
# opponent node (docs/CONTEXT.md, invariant 5). Black's 5...Nh5 is modelled as the root's
# single reply, so the leaf has White to move. Every ply was replayed with chess.js;
# searchMate at 3 moves from the leaf returns no-mate, the leaf is not in check and no
# capture is going free.
id: kings-gambit-accepted-fischer-defense-spanish-variation
name: "King's Gambit Accepted: Fischer Defense, Spanish Variation"
eco: C34
category: gambit
side: white
definingLine: [e4, e5, f4, exf4, Nf3, d6, d4, Nf6, Bd3]
soundness:
  value: dubious
  reviewedAt: '2026-09-30'
  basis:
    by: chan
    at: '2026-09-30'
    source: >-
      A judgement. 5.Bd3 develops and opens the c1 bishop against f4, but Black can hold the pawn
      with 5...Nh5 and stays a pawn up with no White piece yet attacking it twice. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-30'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement
    on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa chơi 5.Bd3, phát triển tượng và mở đường cho tượng c1 nhắm vào f4. Tốt f4 bị tượng c1 tấn công mà không có ai bảo vệ, còn tốt e4 bị mã f6 đánh và được tượng d3 bảo vệ.
    en: White has just played 5.Bd3, developing the bishop and opening the diagonal of the c1 bishop toward f4. The pawn on f4 is attacked by the bishop on c1 and defended by nothing, while the pawn on e4 is attacked by the knight on f6 and defended by the bishop on d3.
    fr: Les Blancs viennent de jouer 5.Bd3, développant le fou et ouvrant la diagonale du fou c1 vers f4. Le pion f4 est attaqué par le fou c1 et défendu par rien, tandis que le pion e4 est attaqué par le cavalier f6 et défendu par le fou d3.
  dismissRest:
    reason:
      vi: Đen chơi một nước khác thay vì 5...Nh5, chẳng hạn 5...Nc6 hoặc 5...Be7. Gần như mọi nước khác đều để tốt f4 cho Bxf4 mà không quân nào ăn lại được.
      en: Black plays something other than 5...Nh5, for example 5...Nc6 or 5...Be7. Nearly every other move leaves the pawn on f4 to Bxf4, which nothing can recapture.
      fr: Les Noirs jouent autre chose que 5...Nh5, par exemple 5...Nc6 ou 5...Be7. Presque tout autre coup laisse le pion f4 à Bxf4, sans que rien puisse reprendre.
  children:
    - ply: Nh5
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Đen bảo vệ tốt f4 bằng mã từ h5, đặt con mã ở rìa bàn cờ.
        en: Black defends the pawn on f4 with the knight from h5, which puts the knight on the edge of the board.
        fr: Les Noirs défendent le pion f4 avec le cavalier depuis h5, ce qui place le cavalier au bord de l'échiquier.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Đen hơn một tốt, và tốt f4 bị tấn công một lần, bởi tượng c1, và được bảo vệ một lần, bởi mã h5, một con mã đứng ở rìa bàn cờ.'
          en: 'Count the pawns: White seven, Black eight, so Black is a pawn up, and the pawn on f4 is attacked once, by the bishop on c1, and defended once, by the knight on h5, a knight standing on the edge of the board.'
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs, si bien que les Noirs ont un pion d'avance, et le pion f4 est attaqué une fois, par le fou c1, et défendu une fois, par le cavalier h5, un cavalier posté au bord de l'échiquier."
        plan:
          vi: Trắng có thể tấn công mã bằng g4, hoặc thêm quân tấn công f4 bằng g3. Đen giữ con tốt bằng ...g5 và phát triển bằng ...Nc6 và ...Be7.
          en: White can attack the knight with g4, or add a second attacker to f4 with g3. Black holds the pawn with ...g5 and develops with ...Nc6 and ...Be7.
          fr: Les Blancs peuvent attaquer le cavalier par g4, ou ajouter un second attaquant à f4 par g3. Les Noirs gardent le pion par ...g5 et se développent par ...Nc6 et ...Be7.
        basis:
          by: chan
          at: '2026-09-30'
