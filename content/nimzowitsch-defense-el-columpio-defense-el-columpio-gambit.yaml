# Nimzowitsch Defense: El Columpio Defense, El Columpio Gambit. Frozen defining line 1.e4 Nc6
# 2.Nf3 Nf6 3.e5 Ng4 4.d4 d6 5.h3 Nh6 6.e6 ends on White's own ply, so the root is an opponent
# node (docs/CONTEXT.md, invariant 5). Part of batch t of round 4 (#182). Every ply below was
# replayed with chess.js before it was annotated; searchMate at 3 moves from the leaf returns
# no-mate, so no forced mate is claimed anywhere in this entry, and no capture is left going
# free at the leaf.
