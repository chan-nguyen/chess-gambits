# Indian Defense, Budapest Gambit Accepted. One entry in a batch authored for issue #148
# (batch h). Defining line ends on Black's 3...e5 (invariant 5). Every ply below was
# replayed with chess.js before being written.
id: indian-defense-budapest-gambit-accepted
name: 'Indian Defense: Budapest Gambit Accepted'
eco: A51
category: gambit
side: black
definingLine: [d4, Nf6, c4, e5]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement, matching the family-level label the Budapest Gambit already carries in
      this catalogue. Black offers the e5 pawn for quick piece activity, and it has never
      been shown short of full compensation at club level. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen vừa chơi 2...e5, thí tốt ngay lập tức thay vì chơi các nước Ấn Độ thông thường. Con tốt d4 của Trắng giờ có thể ăn ở e5.
    en: Black has just played 2...e5, offering the pawn at once rather than one of the usual Indian setups. White's d4 pawn can now capture on e5.
    fr: Les Noirs viennent de jouer 2...e5, offrant le pion tout de suite plutôt que l'un des dispositifs indiens habituels. Le pion d4 blanc peut désormais capturer en e5.
  dismissRest:
    reason:
      vi: Trắng không ăn tốt e5 — chơi 3.d5 hay 3.Nc3. Mỗi lựa chọn để nguyên con tốt e5 trên bàn cờ, nghĩa là lời mời vẫn chưa hề được nhận.
      en: White does not take the e5 pawn — playing 3.d5, or 3.Nc3. Each leaves the e5 pawn sitting on the board, meaning the invitation has still not actually been accepted.
      fr: Les Blancs ne prennent pas le pion e5 — jouant 3.d5, ou 3.Cc3. Chacun laisse le pion e5 sur l'échiquier, ce qui veut dire que l'invitation n'a toujours pas été acceptée.
  children:
    - ply: dxe5
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng ăn tốt ngay lập tức bằng tốt d, quân duy nhất có thể ăn tại đó. Con mã f6 giờ phải quyết định lui về đâu hay tiến lên g4.
        en: White takes the pawn at once with the d-pawn, the only piece that can capture there. Black's f6 knight now has to decide where to fall back to, or whether to jump forward to g4.
        fr: Les Blancs prennent aussitôt le pion avec le pion d, la seule pièce pouvant capturer là. Le cavalier f6 noir doit maintenant décider où reculer, ou s'il saute plutôt en avant en g4.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy. Trắng hơn đúng một tốt sạch, và con mã f6 của Đen đang bị chính con tốt e5 vừa ăn được đe dọa, phải nhúc nhích ngay.
          en: Count the pawns and it is eight for White, seven for Black. White is a clean pawn up, and Black's f6 knight is threatened by the very e5 pawn that just captured, needing to move at once.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs. Les Blancs ont un pion net d'avance, et le cavalier f6 noir est menacé par le pion e5 qui vient de capturer, devant bouger aussitôt.
        plan:
          vi: Trắng chơi Nf3 và Bf4 hay Bg5, hoàn thiện phát triển và giữ vững con tốt thừa. Đen chơi Ng4 nhắm vào e5 và f2, hoặc Ne4, đặt cược vào hoạt động quân để đòi lại con tốt hoặc bù cho nó bằng thế trận.
          en: White plays Nf3 and Bf4 or Bg5, completing development and holding on to the extra pawn. Black plays Ng4, eyeing e5 and f2, or Ne4, betting on piece activity to win the pawn back or make up for it positionally.
          fr: Les Blancs jouent Nf3 et Bf4 ou Bg5, achevant leur développement et gardant le pion supplémentaire. Les Noirs jouent Ng4, visant e5 et f2, ou Ne4, misant sur l'activité des pièces pour regagner le pion ou le compenser positionnellement.
        basis:
          by: chan
          at: '2026-09-25'
