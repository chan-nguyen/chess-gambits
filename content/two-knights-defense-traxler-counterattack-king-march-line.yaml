tree:
  annotation:
    vi:
      Sau khi Đen thí tượng bằng Bxf2+ và ăn lại chiếu bằng Nxe4+, vua Trắng đã bị lùa ra khỏi vị trí
      an toàn hai lần liên tiếp và giờ phải chọn hướng đi tiếp.
    en:
      After Black sacrifices the bishop with Bxf2+ and follows up with the check Nxe4+, White's king
      has been dragged out of safety twice in a row and now has to choose where to go.
    fr:
      Après le sacrifice du fou par Bxf2+ et l'échec qui suit par Nxe4+, le roi blanc a été chassé de
      sa sécurité deux fois de suite et doit maintenant choisir où aller.
  dismissRest:
    reason:
      vi:
        Vua Trắng lùi về ô khác ngoài e3, ví dụ Kf3, Kg1, Kf1 hay Ke1, Ke2. Những nước lùi này thường an
        toàn hơn nhưng khiến vua kẹt lại gần trung tâm; đây là nhánh chọn riêng con đường tiến lên
        e3.
      en:
        White's king retreats to some other square than e3, for instance Kf3, Kg1, Kf1, or Ke1, Ke2.
        These retreats are usually safer but leave the king boxed in near the centre; this is the
        branch that specifically chooses the march to e3.
      fr: Le roi blanc recule sur une autre case que e3, par exemple Kf3, Kg1, Kf1, ou Ke1, Ke2. Ces
        reculs sont généralement plus sûrs mais laissent le roi coincé près du centre ; c'est ici la
        branche qui choisit spécifiquement la marche vers e3.
  children:
    - ply: Ke3
      replyQuality: good
      frequency: occasional
      annotation:
        vi:
          Thay vì lùi về g1 hay f1, vua Trắng tiến lên e3 — nước đi táo bạo và nổi tiếng đặt tên cho cả
          biến đấu này.
        en:
          Instead of retreating to g1 or f1, White's king steps forward to e3 — the bold, famous move that
          gives this whole line its name.
        fr:
          Au lieu de reculer en g1 ou f1, le roi blanc avance en e3 — le coup audacieux et célèbre qui
          donne son nom à toute cette ligne.
      outcome:
        type: position
        evaluation:
          vi:
            Trắng còn đủ hai tượng trong khi Đen chỉ còn một (đã thí tượng ở f2), nhưng đổi lại Đen đã ăn
            thêm hai tốt (Trắng còn 6, Đen còn 7) — tính chung Trắng nhỉnh hơn khoảng hai điểm vật
            chất, dù phải trả giá bằng việc vua đứng lộ ngay giữa bàn cờ ở e3.
          en:
            White still has both bishops while Black has only one left (having given up a bishop on f2), but
            in return Black has picked up two extra pawns (White down to 6, Black up to 7) — overall
            White is ahead by roughly two points of material, at the cost of a king standing exposed
            right in the middle of the board on e3.
          fr:
            Les Blancs ont encore leurs deux fous alors que les Noirs n'en ont plus qu'un (ayant cédé un fou
            en f2), mais en retour les Noirs ont gagné deux pions supplémentaires (les Blancs
            tombent à 6, les Noirs montent à 7) — au total les Blancs sont en avance d'environ deux
            points de matériel, au prix d'un roi exposé en plein milieu de l'échiquier en e3.
        plan:
          vi:
            Trắng cố gắng sống sót bằng Nf3 hoặc d4, che chắn cho vua trong lúc vẫn giữ con mã đang đứng ở
            f7. Đen chơi Qh4 hoặc d5, mở thêm đường và tiếp tục lùa vua Trắng, coi con mã bị mất là
            cái giá chấp nhận được cho cuộc truy đuổi này.
          en:
            White tries to survive with Nf3 or d4, shielding the king while still holding on to the knight
            sitting on f7. Black plays Qh4 or d5, opening more lines and continuing to chase the
            White king, treating the lost knight as an acceptable price for the hunt.
          fr:
            Les Blancs tentent de survivre avec Nf3 ou d4, protégeant le roi tout en gardant le cavalier
            posté en f7. Les Noirs jouent Qh4 ou d5, ouvrant encore des lignes et continuant à
            pourchasser le roi blanc, considérant le cavalier perdu comme un prix acceptable pour
            cette chasse.
        basis:
          by: chan
