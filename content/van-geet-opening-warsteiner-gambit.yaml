# Van Geet Opening: Warsteiner Gambit. Frozen defining line 1.Nc3 d5 2.f4 g5, which ends
# on Black's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
# Replayed with chess.js through the reply fxg5; searchMate at 3 moves from the resulting
# position returns no-mate, so no forced mate is claimed anywhere in this entry.
id: van-geet-opening-warsteiner-gambit
name: 'Van Geet Opening: Warsteiner Gambit'
eco: A00
category: gambit
side: black
definingLine: [Nc3, d5, f4, g5]
soundness:
  value: unsound
  reviewedAt: '2026-10-01'
  basis:
    by: chan
    at: '2026-10-01'
    source: >-
      A judgement. At the end of the defining line the pawn count is level, eight each, but
      White's f4 pawn is attacked by the g5 pawn and nothing defends it, while Black's g5 pawn
      is attacked by the f4 pawn and is undefended too; White can simply take with fxg5 and be
      a pawn up, and Black has not been shown to get anything concrete in return. No engine
      was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-10-01'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: 'Đen vừa chơi 2...g5, tấn công tốt f4 của Trắng. Tốt f4 bị tốt g5 tấn công mà không có quân nào bảo vệ, còn tốt g5 của Đen cũng bị tốt f4 tấn công và không được bảo vệ. Số tốt đang cân bằng, mỗi bên tám. Mục này đi theo nước Trắng ăn 3.fxg5.'
    en: "Black has just played 2...g5, attacking White's f4 pawn. The f4 pawn is attacked by the g5 pawn and nothing defends it, while Black's g5 pawn is attacked by the f4 pawn and is undefended too. The pawn count is level, eight each. This entry follows White taking 3.fxg5."
    fr: 'Les Noirs viennent de jouer 2...g5, attaquant le pion f4 blanc. Le pion f4 est attaqué par le pion g5 sans être défendu, et le pion g5 noir est lui aussi attaqué par le pion f4 sans être défendu. Le compte des pions est égal, huit chacun. Cette entrée suit la prise 3.fxg5 des Blancs.'
  dismissRest:
    reason:
      vi: 'Trắng chơi một nước khác thay vì 3.fxg5, nên tốt g5 chưa bị ăn ngay. Mục này chỉ đi theo nước ăn tốt.'
      en: 'White plays something other than 3.fxg5 here, so the g5 pawn is not taken at once. This entry follows only the capture.'
      fr: "Les Blancs jouent autre chose que 3.fxg5 ici, si bien que le pion g5 n'est pas pris tout de suite. Cette entrée ne suit que la prise."
  children:
    - ply: fxg5
      replyQuality: good
      frequency: common
      annotation:
        vi: 'Trắng ăn tốt g5 bằng tốt f. Tốt g5 mới không có quân nào bảo vệ, nhưng chưa quân Đen nào tấn công được nó.'
        en: "White takes the g5 pawn with the f-pawn. The new pawn on g5 is undefended, but none of Black's pieces attacks it yet."
        fr: "Les Blancs prennent le pion g5 avec le pion f. Le nouveau pion g5 n'est pas défendu, mais aucune pièce noire ne l'attaque encore."
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng tám, Đen bảy, nên Trắng hơn một tốt. Hai tốt g5 và g2 của Trắng bị chồng, và tốt g5 không được bảo vệ. Tuy vậy tốt g5 lấy mất các ô f6 và h6 khỏi mã g8, nên con mã đó không có ô nào tốt cho tới khi tốt e di chuyển.'
          en: "Count the pawns: White eight, Black seven, so White is a pawn up. White's pawns on g5 and g2 are doubled, and the g5 pawn is undefended. Even so, the g5 pawn takes the f6 and h6 squares away from the knight on g8, which has no good square until the e-pawn moves."
          fr: "Comptez les pions : huit pour les Blancs, sept pour les Noirs, donc les Blancs ont un pion de plus. Les pions blancs g5 et g2 sont doublés, et le pion g5 n'est pas défendu. Pourtant le pion g5 retire les cases f6 et h6 au cavalier g8, qui n'a aucune bonne case tant que le pion e n'a pas bougé."
        plan:
          vi: 'Đen chơi ...e6, mở đường chéo của hậu tới con tốt trên g5 không ai bảo vệ và nhường ô e7 cho mã, rồi ...Bg7 và ...d4 để đuổi mã c3. Trắng bảo vệ tốt g5 bằng h4 và Nf3 và chiếm trung tâm bằng d4 và e4.'
          en: "Black plays ...e6, which opens the queen's diagonal to the pawn on g5, which nothing defends, and frees the e7 square for the knight, then ...Bg7 and ...d4 to chase the knight on c3. White supports the g5 pawn with h4 and Nf3 and takes the centre with d4 and e4."
          fr: 'Les Noirs jouent ...e6, qui ouvre à la dame la diagonale vers le pion g5, que rien ne défend, et libère la case e7 pour le cavalier, puis ...Bg7 et ...d4 pour chasser le cavalier c3. Les Blancs soutiennent le pion g5 par h4 et Nf3 et prennent le centre par d4 et e4.'
        basis:
          by: chan
          at: '2026-10-01'
