tree:
  annotation:
    vi: Tốt c3 vừa đánh tượng b4 và dọn chỗ cho d4. Mục này đi sâu riêng vào 5...Ba5, cách giữ tốt tích cực nhất.
    en: The c3 pawn has just attacked the bishop on b4 and cleared the way for d4. This entry follows specifically 5...Ba5, the most active way to hold the pawn.
    fr: Le pion c3 vient d'attaquer le fou en b4 et de dégager la route de d4. Cette entrée suit spécifiquement 5...Fa5, la façon la plus active de garder le pion.
  dismissRest:
    reason:
      vi: Đen đáp lại 5.c3 bằng một nước khác ngoài 5...Ba5 — lui về c5 (McDonnell), e7 (Anderssen), d6 (Stone-Ware) hay f8 (Mayet), hay trả lại tốt bằng 5...d5. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 5.c3 with something other than 5...Ba5 — retreating to c5 (McDonnell), e7 (Anderssen), d6 (Stone-Ware) or f8 (Mayet), or giving the pawn back with 5...d5. Each is outside the scope of this entry.
      fr: Les Noirs répondent à 5.c3 par autre chose que 5...Fa5 — reculant en c5 (McDonnell), e7 (Anderssen), d6 (Stone-Ware) ou f8 (Mayet), ou rendant le pion par 5...d5. Chacun sort du cadre de cette entrée.
  children:
    - ply: Ba5
      replyQuality: best
      frequency: common
      annotation:
        vi: Nhánh chính. Tượng lui về a5, giữ áp lực lên tốt c3 dọc đường chéo a5-e1 và không chắn nước ...d6 hay ...Nf6.
        en: The main line. The bishop steps back to a5, keeping pressure on the c3 pawn along the a5-e1 diagonal and leaving ...d6 and ...Nf6 unobstructed.
        fr: La ligne principale. Le fou recule en a5, garde la pression sur le pion c3 le long de la diagonale a5-e1 et ne gêne ni ...d6 ni ...Nf6.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy — Đen vẫn hơn đúng một tốt. Đổi lại Trắng sắp có đôi tốt d4-e4 sau khi chơi d4, và con tượng a5 tuy vẫn ghim tốt c3 nhưng đã đứng ở rìa bàn cờ, xa hơn hẳn so với ô c5 ban đầu.
          en: Count the pawns and it is eight for Black, seven for White — Black is still exactly one pawn up. In exchange White is about to get the d4-e4 pawn duo after playing d4, and the bishop on a5, while still pinning the c3 pawn, now sits on the edge of the board, well away from its original c5 square.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs — les Noirs restent exactement un pion devant. En échange, les Blancs vont bientôt obtenir le duo de pions d4-e4 après avoir joué d4, et le fou en a5, tout en clouant encore le pion c3, se tient désormais au bord de l'échiquier, loin de sa case d'origine c5.
        plan:
          vi: Trắng chơi d4, rồi O-O và Qb3 hoặc Nc3, tận dụng trung tâm và nhịp phát triển để bù cho con tốt đã mất. Đen chơi d6 và Nf6, giữ tượng ở a5 hoặc lui về b6 khi bị đuổi, cố hoàn thiện phát triển trước khi Trắng kịp tấn công.
          en: White plays d4, then O-O and Qb3 or Nc3, using the centre and the development lead to make up for the lost pawn. Black plays d6 and Nf6, keeping the bishop on a5 or dropping it back to b6 when chased, trying to finish developing before White's attack gets going.
          fr: Les Blancs jouent d4, puis O-O et Qb3 ou Nc3, utilisant le centre et l'avance de développement pour compenser le pion perdu. Les Noirs jouent d6 et Nf6, gardant le fou en a5 ou le repliant en b6 quand il est chassé, essayant d'achever leur développement avant que l'attaque blanche ne démarre.
        basis:
          by: chan
          at: '2026-09-25'
