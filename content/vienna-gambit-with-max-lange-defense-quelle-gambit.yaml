tree:
  annotation:
    vi:
      Thay vì ăn tốt f4 ngay, Đen chơi 3...Bc5 từ chối, và Trắng đáp lại bằng 4.fxe5, ăn thẳng con tốt
      trung tâm để đổi lấy vị trí.
    en: Instead of taking the f4 pawn at once, Black plays 3...Bc5 declining, and White replies with
      4.fxe5, capturing the central pawn outright in exchange for the position.
    fr: Au lieu de prendre aussitôt le pion f4, les Noirs jouent 3...Bc5 en déclinant, et les Blancs
      répliquent par 4.fxe5, capturant tout net le pion central en échange de la position.
  dismissRest:
    reason:
      vi:
        Đen chơi nước khác ngoài d6, ví dụ Qh4+ chiếu trước hoặc Nf6. Con tốt e5 vẫn là mục tiêu chung,
        và đánh giá tổng thể — Trắng hơn một tốt tạm thời — không đổi nhiều.
      en: Black plays something other than d6, for instance Qh4+ to check first, or Nf6. The e5 pawn
        remains the shared target, and the overall assessment — White temporarily up a pawn — does
        not change much.
      fr:
        Les Noirs jouent autre chose que d6, par exemple Qh4+ pour faire échec d'abord, ou Nf6. Le pion
        e5 reste la cible commune, et l'évaluation générale — les Blancs temporairement en avance
        d'un pion — ne change guère.
  children:
    - ply: d6
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen chơi d6, mở đường tấn công ngay vào con tốt e5 mà Trắng vừa ăn được.
        en: Black plays d6, immediately attacking the e5 pawn that White has just won.
        fr: Les Noirs jouent d6, attaquant aussitôt le pion e5 que les Blancs viennent de gagner.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 8 còn Đen 7 — Trắng hơn đúng một tốt sạch.
          en: Count the pawns and it is 8 for White against 7 for Black — White is up one clean pawn.
          fr:
            "Comptez les pions : 8 pour les Blancs contre 7 pour les Noirs — les Blancs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng chơi exd6 trả lại tốt để giữ phát triển đơn giản, hoặc Nf3 củng cố thêm trước. Đen chơi
            Bxd6 hoặc Qxd6, đòi lại vật chất và hoàn thiện phát triển cho tượng còn lại.
          en:
            White plays exd6 to give the pawn back and keep development simple, or Nf3 to add support first.
            Black plays Bxd6 or Qxd6, winning the material back and finishing development for the
            remaining bishop.
          fr:
            Les Blancs jouent exd6 pour rendre le pion et garder un développement simple, ou Nf3 pour
            ajouter du soutien d'abord. Les Noirs jouent Bxd6 ou Qxd6, regagnant le matériel et
            achevant le développement du fou restant.
        basis:
          by: chan
          at: 2026-09-29
