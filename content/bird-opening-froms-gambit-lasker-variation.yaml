        en: 'White pushes the d-pawn to d4, which opens the diagonal for the bishop on c1 to g5. The g5 pawn is now attacked by both the knight on f3 and the bishop on c1, and only the queen defends it.'
        fr: 'Les Blancs poussent le pion d en d4, ce qui ouvre au fou c1 la diagonale vers g5. Le pion g5 est maintenant attaqué à la fois par le cavalier f3 et par le fou c1, et seule la dame le défend.'
      outcome:
