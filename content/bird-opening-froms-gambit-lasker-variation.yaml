        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen sáu, nên Đen kém một tốt. Tốt g5 bị tấn công hai lần và chỉ được bảo vệ một lần, nên Đen phải đẩy nó lên, bảo vệ thêm hoặc để mất nó; tượng d6 của Đen nhắm vào h2, tốt này được mã f3 và xe h1 bảo vệ.'
          en: "Count the pawns: White seven, Black six, so Black is a pawn down. The g5 pawn is attacked twice and defended once, so Black has to push it, defend it again or lose it, while Black's bishop on d6 aims at h2, which the knight on f3 and the rook on h1 defend."
          fr: 'Comptez les pions : sept pour les Blancs, six pour les Noirs, donc les Noirs ont un pion de moins. Le pion g5 est attaqué deux fois et défendu une fois, si bien que les Noirs doivent le pousser, le défendre encore ou le perdre, tandis que le fou noir d6 vise h2, que défendent le cavalier f3 et la tour h1.'
        plan:
          vi: 'Đen đẩy tốt bằng ...g4 để đuổi mã, rồi phát triển bằng ...Nc6 và ...Be6. Trắng dời mã đi khi tốt g đánh vào nó, phát triển bằng Nc3, e3 và Be2, nhập thành và giữ tốt thừa.'
          en: 'Black pushes the pawn with ...g4 to chase the knight, then develops with ...Nc6 and ...Be6. White moves the knight away when the g-pawn hits it, develops with Nc3, e3 and Be2, castles and keeps the extra pawn.'
          fr: "Les Noirs poussent le pion par ...g4 pour chasser le cavalier, puis se développent par ...Nc6 et ...Be6. Les Blancs écartent le cavalier quand le pion g l'attaque, se développent par Nc3, e3 et Be2, roquent et gardent le pion de plus."
