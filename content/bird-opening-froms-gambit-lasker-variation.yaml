tree:
  annotation:
    vi: 'Đen vừa chơi 4...g5. Tốt g5 bị mã f3 tấn công và được hậu d8 bảo vệ, còn tượng d6 nhắm vào h2, tốt này được mã f3 và xe h1 bảo vệ. Đen đang kém một tốt, sáu so với bảy. Mục này đi theo nước Trắng chơi 5.d4.'
    en: 'Black has just played 4...g5. The g5 pawn is attacked by the knight on f3 and defended by the queen on d8, and the bishop on d6 aims at h2, which the knight on f3 and the rook on h1 defend. Black is a pawn down, six pawns to seven. This entry follows White playing 5.d4.'
    fr: 'Les Noirs viennent de jouer 4...g5. Le pion g5 est attaqué par le cavalier f3 et défendu par la dame d8, et le fou d6 vise h2, que défendent le cavalier f3 et la tour h1. Les Noirs ont un pion de moins, six contre sept. Cette entrée suit le coup 5.d4 des Blancs.'
  dismissRest:
    reason:
      vi: 'Trắng chơi một nước khác thay vì 5.d4 ở đây. Mục này chỉ đi theo nước 5.d4.'
