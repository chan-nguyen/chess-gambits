tree:
  annotation:
    vi: Trắng vừa chơi 8.Qb5+, nước chiếu đồng thời tấn công tượng b4 và tốt b7, hai quân không có quân nào bảo vệ.
    en: White has just played 8.Qb5+, a check that also attacks the bishop on b4 and the pawn on b7, neither of which has a defender.
    fr: Les Blancs viennent de jouer 8.Qb5+, un échec qui attaque en même temps le fou b4 et le pion b7, qu'aucune pièce ne défend.
  dismissRest:
    reason:
      vi: Đen đáp lại nước chiếu bằng cách khác thay vì 8...Nc6. Trong mọi cách đó, tượng b4 đều không còn quân bảo vệ và hậu Trắng ăn được mà không quân nào ăn lại, vì vậy bài này đi theo 8...Nc6, nước duy nhất sau đó tượng còn được bảo vệ.
      en: Black answers the check some other way than 8...Nc6. In every one of those answers the bishop on b4 is left without a defender and the White queen can take it with nothing able to recapture, which is why this entry follows 8...Nc6, the only reply after which the bishop is defended.
      fr: Les Noirs répondent à l'échec autrement que par 8...Nc6. Dans chacune de ces réponses, le fou b4 n'a plus de défenseur et la dame blanche peut le prendre sans qu'aucune pièce reprenne ; c'est pourquoi cette fiche suit 8...Nc6, la seule réponse après laquelle le fou reste défendu.
  children:
    - ply: Nc6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen chặn nước chiếu bằng 8...Nc6. Con mã vừa chặn chiếu vừa bảo vệ tượng b4, nhưng nó bị ghim vào vua Đen bởi hậu b5.
        en: Black blocks the check with 8...Nc6. The knight both blocks the check and defends the bishop on b4, but it is pinned against the black king by the queen on b5.
        fr: Les Noirs interposent par 8...Nc6. Le cavalier bloque l'échec et défend le fou b4, mais il est cloué sur le roi noir par la dame b5.
      unsettled: Qxb7 is the capture going free, because nothing defends the b7 pawn. Playing it out leads to ...Bxc3+ and ...Qxd4 with both kings still in the centre, a melee that this entry does not map, so the evaluation counts the position as it stands and names the two pawns, b7 and d4, that hang.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt, dù hai tốt f của Đen bị chồng ở f7 và f6. Mã c6 bị hậu b5 ghim vào vua, tốt b7 không có quân bảo vệ và đang bị hậu ấy tấn công, còn tốt d4 bị hậu d8 tấn công mà không quân nào bảo vệ; vì vậy số tốt sắp đổi ngay khi một bên ăn.'
          en: "Count the pawns: White seven, Black eight, so White is a pawn down, although Black's f-pawns are doubled on f7 and f6. The knight on c6 is pinned to the king by the queen on b5, the pawn on b7 has no defender and is attacked by that queen, and the d4 pawn is attacked by the queen on d8 and defended by nothing; so the count changes as soon as either side captures."
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins, même si les pions f noirs sont doublés en f7 et f6. Le cavalier c6 est cloué sur le roi par la dame b5, le pion b7 n'a aucun défenseur et est attaqué par cette dame, et le pion d4 est attaqué par la dame d8 sans être défendu ; le compte des pions change donc dès que l'un des camps capture."
        plan:
          vi: Trắng có thể ăn tốt miễn phí bằng Qxb7, hoặc trước hết bảo vệ d4 bằng O-O-O hay Ne2 trong khi hậu b5 vẫn ghim mã. Nước ăn của Đen là ...Bxc3+ và ...Qxd4, nên bên nào đi trước cũng làm đổi số tốt.
          en: White can take the free pawn with Qxb7, or first defend d4 with O-O-O or Ne2 while the queen on b5 keeps the knight pinned. Black's own captures are ...Bxc3+ and ...Qxd4, so whichever side moves first changes the pawn count.
          fr: "Les Blancs peuvent prendre le pion gratuit par Qxb7, ou d'abord défendre d4 par O-O-O ou Ne2 tandis que la dame b5 garde le cavalier cloué. Les captures noires sont ...Bxc3+ et ...Qxd4 : quel que soit le camp qui joue le premier, le compte des pions change."
        basis:
          by: chan
          at: '2026-09-30'
