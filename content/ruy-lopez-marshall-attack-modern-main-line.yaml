# Ruy Lopez: Marshall Attack, Modern Main Line. Frozen defining line 1.e4 e5 2.Nf3 Nc6 3.Bb5 a6
# 4.Ba4 Nf6 5.O-O Be7 6.Re1 b5 7.Bb3 O-O 8.c3 d5 9.exd5 Nxd5 10.Nxe5 Nxe5 11.Rxe5 c6 12.d4 Bd6
# 13.Re1 Qh4 14.g3 Qh3, which ends on Black's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 15.Be3. searchMate at 3 moves from
# the resulting position returns no-mate, so no forced mate is claimed anywhere in this entry, and
# no capture is left going free at the leaf.
#
# #175 item 8 added 15.Bxd5 as a second reply, with the trap that follows it. The source
# (chesstrapguide's "Rombaua Trap"; thechesswebsite names it but the page is members-only, so
# nothing there could be checked) gives 15.Bxd5?? cxd5 16.Bf4?? Bg4 17.Re2 Bf3 18.Qf1 Bxf4
# 19.Qxh3. Replayed with chess.js the line is legal, and it ends with White taking Black's
# queen, so as written it wins nothing for Black: 18...Bxf4?? is the blunder. What replay does
# support is the idea one move earlier. 16.Bf4?? Bxf4! wins a piece, because the only retake
# is gxf4 and that tears the king's shield apart: 17...Bg4 hits the queen, and every White
# move then loses at least material. 15.Bxd5 itself is only an inaccuracy (it trades a bishop
# for the knight and gives Black the bishop pair), not the mistake the source's two question
# marks suggest. The branch is modelled as that: Bxd5 (inaccuracy), cxd5, Bf4 (blunder),
# Bxf4, gxf4, Bg4, with a position leaf there and not a mate claim: the refutation is a heavy
# loss of material, and the engine cross-check finds mates only against some of White's moves
# after 17...Bg4 (Qb3, Qc2, Re2), not against all of them. The source's 16...Bg4 is also good
# for Black, but 16...Bxf4 is simply stronger.
#
# Home of the branch: this entry, not the head entry `ruy-lopez-marshall-attack` (root 8...d5,
# a position leaf at 9.exd5). This entry's root is the position after 14...Qh3, exactly where
# 15.Bxd5 is White's move; the head entry would need a dozen plies of main line before it could
# even reach the trap, and that main line is the job of this entry and its siblings.
# The vendored Stockfish 19 (ADR-0012) was run locally as a cross-check on the reply
# qualities; none of its figures appears anywhere in the content.
