judgement:
  by: chan
  at: '2026-09-29'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa chơi 4.f3, mời Đen ăn lại tốt e4 để chuyển sang thế Accepted; ở đây Đen chọn không ăn (declined) và chơi cách khác. Trắng đã phát triển mã c3 và chuẩn bị mở đường cho tượng c1, đổi lại tạm thời chỉ kém một tốt trên bàn cờ (bảy so với tám) mà chưa lấy lại được.
    en: White has just played 4.f3, inviting Black to recapture on e4 and transpose to the Accepted lines; here Black declines that capture and plays something else instead. White has developed the knight to c3 and is preparing to open the diagonal for the c1-bishop, currently down one pawn on the board (seven against eight) with no recapture yet.
    fr: "Les Blancs viennent de jouer 4.f3, invitant les Noirs à reprendre en e4 pour transposer dans les lignes Accepted ; ici, les Noirs refusent cette capture et jouent autre chose. Les Blancs ont développé le cavalier en c3 et se préparent à ouvrir la diagonale du fou c1, actuellement un pion de moins sur l'échiquier (sept contre huit) sans reprise encore effectuée."
  dismissRest:
    reason:
      vi: 'Đen chơi cách khác thay vì ...Nc6 ở đây, kể cả việc ăn lại bằng ...exf3 để chuyển hẳn sang các thế Accepted đã biết. Đánh giá tương tự: Trắng luôn kém một tốt trên bàn tại thời điểm này nhưng bù lại bằng mã đã phát triển và trung tâm thoáng, bất kể Đen chọn hướng nào.'
      en: 'Black plays something other than ...Nc6 here, including recapturing with ...exf3 to transpose into the known Accepted lines. The assessment is similar throughout: White is always a pawn down on the board at this point but compensated by the developed knight and the open centre, whichever way Black goes.'
      fr: "Les Noirs jouent autre chose que ...Nc6 ici, y compris reprendre par ...exf3 pour transposer dans les lignes Accepted connues. L'évaluation reste similaire dans tous les cas : les Blancs sont toujours un pion de moins sur l'échiquier à ce stade, compensé par le cavalier développé et le centre ouvert, quelle que soit la direction choisie par les Noirs."
  children:
    - ply: Nc6
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Đen phát triển mã ra c6 để chuẩn bị ...e5, giữ tốt e4 thêm một nhịp trong khi vẫn đưa quân ra.
        en: Black develops the knight to c6, preparing ...e5 and holding the e4 pawn a little longer while still bringing a piece out.
        fr: Les Noirs développent le cavalier en c6, préparant ...e5 et gardant le pion e4 encore un temps tout en sortant une pièce.
      outcome:
        type: position
        evaluation:
          vi: Đen giữ tốt dư (tám so với bảy) và đã có một quân phát triển, nhưng Trắng cũng có mã trên c3 và sắp mở đường cho tượng c1 bằng fxe4.
          en: "Black holds the extra pawn (eight against seven) and has one piece developed, but White also has the knight on c3 and is about to open the c1-bishop's diagonal with fxe4."
          fr: "Les Noirs conservent le pion supplémentaire (huit contre sept) et ont une pièce développée, mais les Blancs ont aussi le cavalier en c3 et s'apprêtent à ouvrir la diagonale du fou c1 par fxe4."
        plan:
          vi: Trắng chơi fxe4 cân bằng vật chất và tiếp tục Bc4, O-O, khai thác việc vua Đen vẫn ở giữa bàn thêm vài nước. Đen chơi ...e5 tranh trung tâm rồi hoàn tất phát triển.
          en: "White plays fxe4, levelling material and continuing with Bc4 and O-O, exploiting that Black's king stays in the centre a little longer. Black plays ...e5 to contest the centre and then finishes developing."
          fr: Les Blancs jouent fxe4, égalisant le matériel et poursuivant par Bc4 et O-O, profitant du fait que le roi noir reste encore un moment au centre. Les Noirs jouent ...e5 pour contester le centre puis achèvent leur développement.
        basis:
          by: chan
          at: '2026-09-29'
