# King's Gambit Declined: Falkbeer Countergambit, Rubinstein Variation. One of a batch of
# entries authored for issue #148 (batch h), sharing the trunk `1.e4 e5 2.f4 d5` with
# `kings-gambit-declined-falkbeer-countergambit.yaml` and continuing past 3.exd5 e4, the
# countergambit's main push, matching the shape of its sibling
# `falkbeer-countergambit-charousek-gambit-old-line` one ply later. Defining line ends on
# Black's 2...d5 (invariant 5). Every ply below was replayed with chess.js before being
# written. The dataset's own line runs one move further, 6.Qe2; this entry stops at 5...Nf6
# instead, which is already a safe, quiet leaf, and mentions 6.Qe2 in prose only.
id: falkbeer-countergambit-rubinstein-variation
name: "King's Gambit Declined: Falkbeer Countergambit, Rubinstein Variation"
eco: C31
category: gambit
side: black
definingLine: [e4, e5, f4, d5]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      The same judgement the family head `kings-gambit-declined-falkbeer-countergambit.yaml`
      carries. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen vừa chơi 2...d5, Phản-gambit Falkbeer. Mục này đi sâu riêng vào việc Trắng ăn tốt bằng 3.exd5, và Đen đáp lại bằng nước đẩy tốt chính của cả phản-gambit, 3...e4.
    en: Black has just played 2...d5, the Falkbeer Countergambit. This entry follows specifically White capturing with 3.exd5, and Black answering with the countergambit's own main push, 3...e4.
    fr: Les Noirs viennent de jouer 2...d5, le Contre-gambit Falkbeer. Cette entrée suit spécifiquement la prise blanche 3.exd5, à laquelle les Noirs répondent par la poussée principale du contre-gambit, 3...e4.
  dismissRest:
    reason:
      vi: Trắng không ăn tốt bằng 3.exd5 — chơi 3.Nf3 (xem mục gốc của cả họ) hay 3.Nc3 (xem Biến Milner-Barry). Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: White does not capture with 3.exd5 — playing 3.Nf3 (see the family head) or 3.Nc3 (see the Milner-Barry Variation) instead. Each is outside the scope of this entry.
      fr: Les Blancs ne prennent pas par 3.exd5 — jouant 3.Cf3 (voir l'entrée de tête de la famille) ou 3.Cc3 (voir la Variante Milner-Barry). Chacun sort du cadre de cette entrée.
  children:
    - ply: exd5
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng nhận tốt, nhánh chính của cả họ khai cuộc này. Con tốt d5 giờ thuộc về Trắng, và Đen phải quyết định đòi lại nó ngay hay chơi tiếp theo cách khác.
        en: White accepts, the main branch of the whole family. The d5 pawn now belongs to White, and Black has to decide whether to win it back at once or play on differently.
        fr: Les Blancs acceptent, la branche principale de toute la famille. Le pion d5 appartient désormais aux Blancs, et les Noirs doivent décider de le regagner aussitôt ou de jouer autrement.
      children:
        - ply: e4
          annotation:
            vi: Nước đẩy tốt mang tên cho cả phản-gambit. Con tốt e5 của Đen tiến qua ô e4 vừa được tốt Trắng bỏ trống, giành đất và mở đường chéo cho tượng f8.
            en: The push that names the whole countergambit. Black's e5 pawn advances through the e4 square White's own pawn just vacated, grabbing space and opening the diagonal for the f8 bishop.
            fr: La poussée qui donne son nom à tout le contre-gambit. Le pion e5 noir avance sur la case e4 que le pion blanc vient de quitter, gagnant de l'espace et ouvrant la diagonale du fou f8.
          dismissRest:
            reason:
              vi: Trắng không chơi 4.Nc3 — chơi 4.d3 thay vào đó (xem Charousek Gambit, Old Line). Mỗi lựa chọn khác nằm ngoài phạm vi mục này.
              en: White does not play 4.Nc3 — playing 4.d3 instead (see the Charousek Gambit, Old Line). Any other choice is outside the scope of this entry.
              fr: Les Blancs ne jouent pas 4.Cc3 — jouant 4.d3 à la place (voir le Gambit Charousek, Old Line). Tout autre choix sort du cadre de cette entrée.
          children:
            - ply: Nc3
              replyQuality: best
              frequency: common
              annotation:
                vi: Trắng phát triển mã, chuẩn bị đánh vào con tốt e4 đang tiến xa và chưa được ai đỡ.
                en: White develops the knight, getting ready to attack the advanced and still-undefended e4 pawn.
                fr: Les Blancs développent le cavalier, se préparant à attaquer le pion e4 avancé et encore sans défenseur.
              children:
                - ply: Nf6
                  annotation:
                    vi: Biến Rubinstein. Đen phát triển mã, tấn công thẳng vào con tốt d5 của Trắng và không vội đòi lại con hậu vẫn còn ở nhà.
                    en: The Rubinstein Variation. Black develops the knight, attacking White's d5 pawn directly and in no hurry to bring the queen out to recapture yet.
                    fr: La Variante Rubinstein. Les Noirs développent le cavalier, attaquant directement le pion d5 blanc et sans hâte de sortir la dame pour reprendre.
                  outcome:
                    type: position
                    evaluation:
                      vi: Đếm tốt thì Trắng tám, Đen bảy — Trắng hơn đúng một tốt, con tốt d5 vẫn còn nguyên trên bàn. Đổi lại, con tốt e4 của Đen chiếm đất ngay trước mặt mã c3, và mã f6 vừa ra đã nhắm thẳng vào con tốt d5 ấy.
                      en: Count the pawns and it is eight for White, seven for Black — White is exactly one pawn up, the d5 pawn still standing. In exchange, Black's e4 pawn takes space right in front of the c3 knight, and the newly developed f6 knight already aims straight at that d5 pawn.
                      fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs — les Blancs ont exactement un pion de plus, le pion d5 étant toujours en place. En échange, le pion e4 noir prend de l'espace juste devant le cavalier c3, et le cavalier f6 tout juste développé vise déjà ce pion d5.
                    plan:
                      vi: Trắng chơi Qe2 ghim con tốt e4 vào vua Đen chưa nhập thành, rồi d3 hoặc Bb5+ để tháo gỡ căng thẳng theo hướng có lợi. Đen chơi Bc5 hay Bb4, nhập thành nhanh và tìm cách đòi lại con tốt d5 bằng Nxd5 hoặc Qxd5 khi có dịp.
                      en: White plays Qe2, pinning the e4 pawn against Black's uncastled king, then d3 or Bb5+ to untangle the tension favourably. Black plays Bc5 or Bb4, castles quickly and looks for a chance to win back the d5 pawn with Nxd5 or Qxd5.
                      fr: Les Blancs jouent Qe2, clouant le pion e4 contre le roi noir qui n'a pas roqué, puis d3 ou Bb5+ pour dénouer la tension favorablement. Les Noirs jouent Bc5 ou Bb4, roquent rapidement et cherchent une occasion de regagner le pion d5 par Nxd5 ou Qxd5.
                    basis:
                      by: chan
                      at: '2026-09-25'
