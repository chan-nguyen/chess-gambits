# Borg Defense: Borg Gambit. Frozen defining line 1.d4 g5, which ends on Black's own ply,
# so the root is an opponent node (docs/CONTEXT.md, invariant 5). Replayed with chess.js:
# 2.Bxg5 simply takes the offered pawn, since nothing of Black's recaptures on g5 for free,
# and nothing else is hanging afterwards. searchMate at 4 moves from this position returns
# unknown, which the stopping rule treats the same as no-mate, so no forced mate is
# claimed.
id: borg-defense-borg-gambit
name: 'Borg Defense: Borg Gambit'
eco: A40
category: gambit
side: black
definingLine: [d4, g5]
soundness:
  value: unsound
  reviewedAt: '2026-09-18'
  basis:
    by: chan
    at: '2026-09-18'
    source: >-
      A judgement. Black weakens the kingside from the very first move for a diagonal that
      is not even open yet, and the g5 pawn is simply hanging to the c1 bishop with nothing
      recapturing it, leaving White a clean pawn up with no compensation to show for it. No
      engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen chơi 1...g5 ngay từ nước đầu tiên, làm suy yếu cấu trúc tốt cánh vua để mời Trắng ăn nó bằng chính con tượng còn đang đứng ở nhà.
    en: Black plays 1...g5 as early as the first move, weakening the kingside pawn structure to invite White to take it with the bishop still sitting at home.
    fr: Les Noirs jouent 1...g5 dès le premier coup, affaiblissant la structure de pions à l'aile roi pour inviter les Blancs à le prendre avec le fou encore à sa case de départ.
  dismissRest:
    reason:
      vi: Trắng không ăn tốt g5. Các nước khác như c4 hay Nf3 để nguyên con tốt g5 chưa bị ăn, và Đen có thêm thời gian để quyết định xem có tiếp tục đẩy tốt hay không.
      en: White does not take the g5 pawn. Other moves such as c4 or Nf3 leave the g5 pawn untaken, and Black gets more time to decide whether to keep pushing the pawn or not.
      fr: Les Blancs ne prennent pas le pion g5. D'autres coups comme c4 ou Nf3 laissent le pion g5 non pris, et les Noirs ont plus de temps pour décider de continuer à pousser le pion ou non.
  children:
    - ply: Bxg5
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng ăn tốt ngay lập tức bằng tượng. Con tốt g5 không được quân nào của Đen bảo vệ, nên đây đơn giản chỉ là ăn một quân đang bị treo.
        en: White takes the pawn at once with the bishop. Nothing of Black's defends the g5 pawn, so this is simply taking a piece that is hanging.
        fr: Les Blancs prennent le pion tout de suite avec le fou. Rien du côté noir ne défend le pion g5, donc il s'agit simplement de prendre une pièce en prise.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng tám, Đen bảy, hơn đúng một tốt sạch. Cấu trúc tốt cánh vua của Đen đã bị suy yếu ngay từ đầu mà chẳng có gì cụ thể để bù lại con tốt đã mất.
          en: Count the pawns, eight for White, seven for Black, a clean extra pawn. Black's kingside pawn structure has been weakened right from the start with nothing concrete to show for the lost pawn.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs, un pion net de plus. La structure de pions à l'aile roi noire a été affaiblie dès le début sans rien de concret pour compenser le pion perdu.
        plan:
          vi: Trắng chơi e4, Nc3 và Nf3, hoàn thiện phát triển bình thường và giữ chắc con tốt thừa. Đen chơi Bg7, h6 hay Nf6, cố tận dụng đường chéo dài đã mở cho tượng g7 để bù lại phần nào con tốt đã mất.
          en: White plays e4, Nc3 and Nf3, completing ordinary development and holding onto the extra pawn. Black plays Bg7, h6 or Nf6, trying to make some use of the long diagonal now open for the g7 bishop to compensate for the lost pawn.
          fr: Les Blancs jouent e4, Nc3 et Nf3, achevant un développement ordinaire et gardant le pion supplémentaire. Les Noirs jouent Bg7, h6 ou Nf6, essayant de tirer un peu parti de la grande diagonale désormais ouverte pour le fou g7 afin de compenser le pion perdu.
        basis:
          by: chan
          at: '2026-09-18'
