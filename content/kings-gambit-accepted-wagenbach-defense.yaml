# King's Gambit Accepted, Wagenbach Defense. One of eighteen entries tracked by issue #111
# (group H), sharing the trunk `1.e4 e5 2.f4 exf4 3.Nf3` with `kings-gambit-accepted.yaml`
# and group G (#110). Defining line ends on White's 3.Nf3 (invariant 5). Every move replayed
# with a scratch chess.js script (deleted before commit).
#
# 3...h5 is a rare try that does not even achieve the Becker Defense's stated purpose of
# ruling out Ng5 — it neither develops a piece nor fights for the centre. A chess.js mobility
# check (after correcting an earlier side-to-move scripting error found while auditing this
# batch) showed Black's queenside and kingside minor pieces still retain reasonable squares
# a few moves later, so no clean, honestly-verified structural catastrophe could be
# established at short depth without an engine. The line stops at `unexplored` rather than
# assert a verdict this review could not stand behind.
