tree:
  annotation:
    vi:
      Trắng đã nhập thành và giờ chơi c3, chuẩn bị ăn lại con tốt d4 trong lúc vua đã an toàn — một
      cách xử lý Scotch Gambit thiên về phát triển và an toàn vua trước.
    en:
      White has already castled and now plays c3, preparing to win back the d4 pawn while the king is
      already safe — a way of handling the Scotch Gambit that puts development and king safety
      first.
    fr:
      Les Blancs ont déjà roqué et jouent maintenant c3, préparant à regagner le pion d4 le roi déjà
      en sécurité — une façon de traiter le Gambit Écossais qui privilégie développement et sécurité
      du roi.
  dismissRest:
    reason:
      vi:
        Đen chơi nước khác ngoài Bg4, ví dụ Nge7 hay Qf6 luôn. Đánh giá chung — Trắng kém một tốt, vua
        đã an toàn và trung tâm sắp mở — không đổi nhiều.
      en: Black plays something other than Bg4, for instance Nge7 or Qf6 right away. The overall
        assessment — White down a pawn, king already safe, centre about to open — does not change
        much.
      fr:
        Les Noirs jouent autre chose que Bg4, par exemple Nge7 ou Qf6 directement. L'évaluation générale
        — les Blancs à un pion de moins, roi déjà en sécurité, centre sur le point de s'ouvrir — ne
        change guère.
  children:
    - ply: Bg4
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen ghim mã f3 bằng Bg4, gây sức ép ngay khi Trắng vừa chơi c3 để chuẩn bị lấy lại tốt d4.
        en:
          Black pins the knight on f3 with Bg4, adding pressure just as White plays c3 to prepare winning
          back the d4 pawn.
        fr:
          Les Noirs clouent le cavalier f3 avec Bg4, ajoutant de la pression juste au moment où les Blancs
          jouent c3 pour préparer à regagner le pion d4.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 7 còn Đen 8 — Đen hơn đúng một tốt sạch.
          en: Count the pawns and it is 7 for White against 8 for Black — Black is up one clean pawn.
          fr:
            "Comptez les pions : 7 pour les Blancs contre 8 pour les Noirs — les Noirs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng chơi Qb3 hoặc cxd4, tranh thủ vua đã an toàn để mở trung tâm và đe doạ f7 cùng b7. Đen
            chơi Nge7 hoặc Qd7, hoàn thiện phát triển và tìm cách đổi bớt áp lực trước khi Trắng mở
            toang trung tâm.
          en:
            White plays Qb3 or cxd4, using the already-safe king to open the centre and threaten both f7 and
            b7. Black plays Nge7 or Qd7, finishing development and trying to trade off pressure
            before White blows the centre open.
          fr:
            Les Blancs jouent Qb3 ou cxd4, profitant de leur roi déjà en sécurité pour ouvrir le centre et
            menacer à la fois f7 et b7. Les Noirs jouent Nge7 ou Qd7, achevant leur développement et
            cherchant à échanger la pression avant que les Blancs n'ouvrent le centre.
        basis:
          by: chan
          at: 2026-09-29
