            already safe after castling, while Black's king is still in the centre.
          fr:
            Comptez les pions, 7 pour les Blancs, 8 pour les Noirs — les Noirs ont un pion net de plus. Le
            roi blanc est déjà en sécurité après le roque, tandis que le roi noir reste au centre.
        plan:
