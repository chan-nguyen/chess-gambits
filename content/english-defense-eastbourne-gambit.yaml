    source: >-
      A judgement. White simply takes the pawn with dxe5 and it stays taken — Black's whole
      case is the long diagonal behind the fianchettoed bishop, which is real but not
      enough on its own to call a clean pawn back yet. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Sau khi đã fianchetto tượng ở b7 nhắm vào đường chéo dài, Đen chơi 3...e5, mời Trắng ăn tốt trung tâm. Nếu Trắng ăn thì hàng tốt d4-c4 mất đi con tốt trung tâm và tượng b7 tạm thời có đường chéo thoáng hơn, đổi lại Đen chấp nhận đi sau về tốt.
    en: After fianchettoing the bishop on b7 aiming down the long diagonal, Black plays 3...e5, offering the central pawn. If White takes it, the d4-c4 pawn duo loses its central pawn and the b7 bishop briefly enjoys a more open diagonal, in exchange for Black falling a pawn behind.
    fr: Après avoir fianchetté le fou en b7 visant la grande diagonale, les Noirs jouent 3...e5, offrant le pion central. Si les Blancs le prennent, le duo de pions d4-c4 perd son pion central et le fou b7 profite brièvement d'une diagonale plus ouverte, en échange de quoi les Noirs se retrouvent un pion derrière.
  dismissRest:
    reason:
      vi: Trắng không ăn con tốt e5. Các nước khác như Nf3, e3 hay d5 đẩy tốt để nguyên con tốt e5 trên bàn cờ, và Đen tiếp tục phát triển bình thường với Nf6 hay Bb4, nghĩa là lời mời vẫn chưa hề được nhận.
      en: White does not take the e5 pawn. Anything else, such as Nf3, e3 or pushing with d5, leaves the e5 pawn sitting on the board and lets Black carry on developing normally with Nf6 or Bb4, meaning the offer has still not actually been accepted.
      fr: Les Blancs ne prennent pas le pion e5. Tout le reste, comme Nf3, e3 ou la poussée d5, laisse le pion e5 sur l'échiquier et permet aux Noirs de poursuivre leur développement normal par Nf6 ou Bb4, ce qui veut dire que l'offre n'a toujours pas été acceptée.
  children:
    - ply: dxe5
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng ăn con tốt ngay lập tức bằng tốt d, quân duy nhất có thể ăn tại đó. Không có gì phức tạp, con tốt e5 chỉ đơn giản là bị treo trước một con tốt đang tấn công nó.
        en: White takes the pawn at once with the d-pawn, the only piece that can capture there. There is nothing complicated here — the e5 pawn is simply hanging in front of the pawn attacking it.
        fr: Les Blancs prennent aussitôt le pion avec le pion d, la seule pièce pouvant capturer là. Il n'y a rien de compliqué ici, le pion e5 est simplement en prise devant le pion qui l'attaque.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy. Trắng hơn đúng một tốt sạch, con tốt e đã mất ngay từ nước 3, và chưa có gì đòi lại được nó. Cái Đen có để bù lại chỉ là tượng b7 đứng trên đường chéo dài, nhưng đường chéo ấy hiện vẫn bị chính con tốt e5 (nay đã đổi chủ) và quân Trắng che chắn, nên chưa phải mối đe dọa cụ thể nào.
          en: Count the pawns and it is eight for White, seven for Black. White is a clean pawn up, the e-pawn lost as early as move three, and nothing has won it back yet. What Black has to show for it is only the bishop sitting on the long diagonal, but that diagonal is still blocked by White's own pieces and the pawn that has just changed hands, so it is not yet a concrete threat.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs. Les Blancs ont un pion de plus bien réel, le pion e perdu dès le troisième coup, et rien ne l'a encore récupéré. Ce que les Noirs ont à montrer pour cela n'est que le fou posté sur la grande diagonale, mais cette diagonale reste bloquée par les propres pièces blanches et par le pion qui vient de changer de camp, donc ce n'est pas encore une menace concrète.
        plan:
          vi: Trắng chơi Nf3, e4 và Bd3 hay Be2, O-O, cố giữ vững con tốt thừa và bịt kín đường chéo dài trước khi Đen kịp mở nó ra. Đen chơi Nf6, e6 và Be7 hay Bb4, O-O, tìm cách ép Trắng nhượng lại tốt trung tâm hoặc mở đường chéo dài bằng d3-d4 về sau để tượng b7 phát huy tác dụng.
          en: White plays Nf3, e4 and Bd3 or Be2, castles, trying to hold the extra pawn and keep the long diagonal blocked before Black can open it. Black plays Nf6, e6 and Be7 or Bb4, castles, looking to pressure White into giving back the central pawn or into a later d3-d4 that would open the long diagonal for the b7 bishop.
          fr: Les Blancs jouent Nf3, e4 et Bd3 ou Be2, roquent, en essayant de garder le pion supplémentaire et de maintenir la grande diagonale fermée avant que les Noirs ne puissent l'ouvrir. Les Noirs jouent Nf6, e6 et Be7 ou Bb4, roquent, cherchant à pousser les Blancs à rendre le pion central ou vers un futur d3-d4 qui ouvrirait la grande diagonale pour le fou b7.
        basis:
          by: chan
          at: '2026-09-18'
