id: four-knights-game-scotch-variation-belgrade-gambit
name: 'Four Knights Game: Scotch Variation, Belgrade Gambit'
eco: C47
category: gambit
side: white
definingLine: [e4, e5, Nf3, Nc6, Nc3, Nf6, d4, exd4, Nd5]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. The knight jump comes with real short-term tricks — Nxc7+ or a quick Bg5
      pin — but does not win material outright, and best defence has never been shown to
      lose. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa nhảy mã lên d5, thay vì ăn lại tốt d4 ngay. Con mã ấy đe dọa Nxc7+ chĩa vào vua và xe, còn tốt d4 của Đen thì vẫn chưa bị đòi lại.
    en: White has just jumped the knight to d5 instead of recapturing the d4 pawn at once. The knight threatens Nxc7+, forking the king and rook, while Black's extra d4 pawn is still uncollected.
    fr: Les Blancs viennent de sauter le cavalier en d5 au lieu de reprendre aussitôt le pion d4. Ce cavalier menace Nxc7+, fourchette sur le roi et la tour, tandis que le pion d4 noir supplémentaire reste non repris.
  dismissRest:
    reason:
      vi: Đen không đáp lại mối đe dọa Nxc7+ bằng 5...Nxe4 — chơi Be7 hay Bc5 để hở nước nhập thành trước, hay một nước khác bỏ mặc con mã d5. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black does not answer the Nxc7+ threat with 5...Nxe4 — playing Be7 or Bc5 to clear a path to castle first, or something else that ignores the d5 knight. Each is outside the scope of this entry.
      fr: Les Noirs ne répondent pas à la menace Nxc7+ par 5...Cxe4 — jouant Be7 ou Bc5 pour dégager d'abord une voie de roque, ou autre chose ignorant le cavalier d5. Chacun sort du cadre de cette entrée.
  children:
    - ply: Nxe4
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen ăn thêm một tốt nữa bằng mã thay vì lo đối phó mối đe dọa Nxc7+, đặt cược rằng con mã e4 sẽ đủ nhanh để rút lui hoặc gây rối trước khi Trắng kịp thực hiện đòn ấy.
        en: Black grabs a second pawn with the knight instead of dealing with the Nxc7+ threat, betting that the knight on e4 will be quick enough to retreat or cause trouble before White can carry the threat out.
        fr: Les Noirs ramassent un second pion avec le cavalier au lieu de parer la menace Nxc7+, pariant que le cavalier en e4 sera assez rapide pour reculer ou créer des ennuis avant que les Blancs ne puissent exécuter la menace.
      children:
        - ply: Qe2
          annotation:
            vi: Trắng không vội ăn ở c7 và thay vào đó ghim con mã e4 vào vua Đen chưa nhập thành, buộc Đen phải giải quyết cả con mã lẫn quân hậu cùng lúc.
            en: White does not rush to take on c7 and instead pins the e4 knight against Black's uncastled king, forcing Black to deal with both the knight and the queen at once.
            fr: Les Blancs ne se précipitent pas pour prendre en c7 et clouent plutôt le cavalier e4 contre le roi noir qui n'a pas roqué, forçant les Noirs à gérer le cavalier et la dame à la fois.
          outcome:
            type: position
            evaluation:
              vi: Đếm tốt thì Đen tám, Trắng sáu — Đen hơn hai tốt sạch. Nhưng con mã e4 bị ghim vào vua chưa nhập thành, và Trắng vẫn còn đòn Nxc7+ trong tay nếu Đen xử lý không khéo, nên khoản vật chất ấy chưa hẳn đã yên.
              en: Count the pawns and it is eight for Black, six for White — Black is two clean pawns up. But the e4 knight is pinned against the uncastled king, and White still has Nxc7+ in hand if Black is not careful, so that material is not necessarily settled yet.
              fr: Comptez les pions, huit pour les Noirs, six pour les Blancs — les Noirs ont deux pions nets d'avance. Mais le cavalier e4 est cloué contre le roi qui n'a pas roqué, et les Blancs ont toujours Nxc7+ en réserve si les Noirs ne font pas attention, si bien que ce gain matériel n'est pas forcément stabilisé.
            plan:
              vi: Trắng chơi Nxc7+ nếu vua Đen còn ở e8, chĩa đôi vào vua và xe, hoặc trước tiên đẩy d3 buộc mã e4 phải lui. Đen chơi Be7 và O-O gấp để thoát khỏi ghim và mối đe dọa Nxc7+, chấp nhận trả lại một phần vật chất nếu cần để vua được an toàn.
              en: White plays Nxc7+ if Black's king is still on e8, forking king and rook, or first pushes d3 to force the e4 knight back. Black plays Be7 and castles urgently to escape both the pin and the Nxc7+ threat, accepting giving some material back if needed to get the king safe.
              fr: Les Blancs jouent Nxc7+ si le roi noir est encore en e8, fourchette sur le roi et la tour, ou poussent d'abord d3 pour forcer le cavalier e4 à reculer. Les Noirs jouent Be7 et roquent d'urgence pour échapper au clouage et à la menace Nxc7+, acceptant de rendre du matériel si besoin pour mettre le roi à l'abri.
            basis:
              by: chan
              at: '2026-09-25'
