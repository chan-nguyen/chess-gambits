tree:
  annotation:
    vi:
      Sau khi Đen đưa hậu ra b6 gây sức ép lên b2 và d4, Trắng chơi 7.Qd2, để ngỏ con tốt b2 như một
      cái bẫy có chủ đích.
    en:
      After Black brings the queen to b6 to pressure b2 and d4, White plays 7.Qd2, leaving the b2 pawn
      open as a deliberate trap.
    fr:
      Après que les Noirs ont amené la dame en b6 pour faire pression sur b2 et d4, les Blancs jouent
      7.Qd2, laissant le pion b2 ouvert comme un piège délibéré.
  dismissRest:
    reason:
      vi:
        Đen bỏ qua con tốt b2 và phát triển bình thường, ví dụ Nd7 hay Nf6. Con tốt ấy vẫn nằm trên bàn
        cờ và Trắng chưa có được nhịp độ phụ thêm mà việc bắt hậu mang lại.
      en:
        Black ignores the b2 pawn and develops normally, for instance Nd7 or Nf6. That pawn stays on the
        board and White does not get the extra tempo that chasing the queen brings.
      fr:
        Les Noirs ignorent le pion b2 et se développent normalement, par exemple Nd7 ou Nf6. Ce pion
        reste sur l'échiquier et les Blancs ne gagnent pas le temps supplémentaire qu'apporterait la
        chasse à la dame.
  children:
    - ply: Qxb2
      replyQuality: inaccuracy
      frequency: occasional
      annotation:
        vi: Đen tham lam ăn con tốt b2 đang không được bảo vệ, chấp nhận lời mời của Trắng.
        en: Black greedily grabs the undefended b2 pawn, taking White up on the offer.
        fr: Les Noirs prennent avidement le pion b2 non défendu, acceptant l'offre blanche.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 7 còn Đen 8 — Đen hơn đúng một tốt sạch.
          en: Count the pawns and it is 7 for White against 8 for Black — Black is up one clean pawn.
          fr:
            "Comptez les pions : 7 pour les Blancs contre 8 pour les Noirs — les Noirs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng chơi Rb1, đuổi hậu Đen và giành lại nhịp độ, tranh thủ đường phát triển và sự an toàn của
            vua để bù cho con tốt đã mất. Đen chơi Qa3 hoặc Qxc3+, tìm đường rút hậu về an toàn
            trong lúc vẫn giữ con tốt thừa.
          en:
            White plays Rb1, chasing the Black queen and winning back the tempo, relying on the development
            lead and king safety as compensation for the missing pawn. Black plays Qa3 or Qxc3+,
            looking for a way to bring the queen home safely while still holding the extra pawn.
          fr:
            Les Blancs jouent Rb1, chassant la dame noire et regagnant le temps perdu, s'appuyant sur
            l'avance de développement et la sécurité du roi en compensation du pion manquant. Les
            Noirs jouent Qa3 ou Qxc3+, cherchant à ramener la dame en sécurité tout en gardant le
            pion supplémentaire.
        basis:
          by: chan
          at: 2026-09-29
