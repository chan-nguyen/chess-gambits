    at: '2026-09-18'
    source: >-
      A judgement, and the same label the catalogue's family rule carries. Taking both
      pawns is the sternest test of the gambit — the Schlechter Defence giving one back with
      3...d5 is generally judged the safer path for Black, which is why the fully accepted
      line here is rated a notch below that declined line's own soundness. Below master
      level the two bishops are worth more than the arithmetic suggests. No engine was
      consulted and no database was queried.
