# Danish Gambit Accepted. Frozen defining line 1.e4 e5 2.d4 exd4 3.c3, which ends on
# White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
# Replayed with chess.js through 3...dxc3 4.Bc4 cxb2 5.Bxb2: White is two pawns down
# (three taken, one won back) for the two bishops aimed at f7 and g7 while Black has not developed a single piece.
#
# Extended for #175 with the queen sortie 5...Qg5, the trap chesstrapguide and
# thechesswebsite both list as 6.Nf3 Qxg2?? 7.Rg1 Bb4+ 8.Ke2 "and the queen is caught".
# Replayed, the queen is not caught: after 8.Ke2 it has one square, h3, and it survives
# there. What the line actually wins is the rook on h8 — 8...Qh3 9.Bxg7 and the rook,
# boxed in by its own knight on g8 and pawn on h7, cannot be saved. The move that makes
# that work is 7...Bb4+, which takes the f8 bishop off the defence of g7; with the bishop
# still on f8, 7...Qh3 8.Bxg7 is simply answered by ...Bxg7, and White's try there is
# 8.Bxf7+ instead. The catch-alls say so. No leaf here claims a mate, so no certificate is
# needed; every `position` leaf sits at a position with no check, no mate in one and no
# free capture.
