                              children:
                                - ply: Rg1
                                  annotation:
                                    vi: Xe lên g1, tấn công hậu. Mọi ô hậu có thể đi đều bị ăn ngay, trừ h3 — và cả hai con tượng Trắng đều đang chờ trên hai đường chéo dài.
                                    en: The rook comes to g1 and attacks the queen. Every square the queen can go to is captured at once, except h3 — and both white bishops are waiting on their long diagonals.
                                    fr: La tour vient en g1 et attaque la dame. Toutes les cases où la dame peut aller sont prises aussitôt, sauf h3 — et les deux fous blancs attendent sur leurs grandes diagonales.
                                  dismissRest:
                                    reason:
                                      vi: Đen chơi một nước khác. Mọi nước hậu khác đều bị ăn tại chỗ — ...Qxf3 bởi Qxf3, ...Qg3 bởi tốt hoặc xe, ...Qg4 và ...Qh1 bởi xe, ...Qg5 bởi mã hoặc xe, ...Qg6 bởi xe (hậu đổi lấy xe), ...Qxh2 bởi Nxh2, ...Qxg1+ bởi Nxg1, ...Qf1+ và ...Qxf2+ bởi vua — còn nước nào không phải nước hậu thì để hậu ở lại g2 cho Rxg2. Ô duy nhất cứu được hậu là ...Qh3, và khi tượng f8 vẫn còn canh g7 thì Trắng thử 8.Bxf7+, vì 8...Kxf7 9.Ng5+ bắt cả vua lẫn hậu, còn 8...Ke7 hay 8...Kd8 mất tốt f7 và quyền nhập thành.
                                      en: Black plays something else. Every other queen move is captured on the spot — ...Qxf3 by Qxf3, ...Qg3 by a pawn or the rook, ...Qg4 and ...Qh1 by the rook, ...Qg5 by the knight or the rook, ...Qg6 by the rook (the queen for a rook), ...Qxh2 by Nxh2, ...Qxg1+ by Nxg1, ...Qf1+ and ...Qxf2+ by the king — and any move that is not a queen move leaves the queen on g2 for Rxg2. The one square that saves the queen is ...Qh3, and with the f8 bishop still guarding g7 White tries 8.Bxf7+ there, since 8...Kxf7 9.Ng5+ forks the king and the queen, while 8...Ke7 or 8...Kd8 gives up the f7 pawn and the right to castle.
                                      fr: Les Noirs jouent autre chose. Tout autre coup de dame est pris sur place — ...Qxf3 par Qxf3, ...Qg3 par un pion ou la tour, ...Qg4 et ...Qh1 par la tour, ...Qg5 par le cavalier ou la tour, ...Qg6 par la tour (la dame contre une tour), ...Qxh2 par Nxh2, ...Qxg1+ par Nxg1, ...Qf1+ et ...Qxf2+ par le roi — et tout coup qui n'est pas un coup de dame laisse la dame en g2 pour Rxg2. La seule case qui sauve la dame est ...Qh3, et tant que le fou f8 garde encore g7, les Blancs y essaient 8.Bxf7+, car 8...Kxf7 9.Ng5+ fourche le roi et la dame, tandis que 8...Ke7 ou 8...Kd8 abandonne le pion f7 et le droit de roquer.
