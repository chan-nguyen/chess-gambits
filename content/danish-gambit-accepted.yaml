                                              fr: Les Noirs jouent autre chose. La tour attaque toujours la dame, et tout coup de dame sauf ...Qh3 est pris sur place — ...Qxf3+ Kxf3, ...Qg3, ...Qg4, ...Qg5 par la tour (ou le cavalier), ...Qg6 par la tour (la dame contre une tour), ...Qxh2 Nxh2, ...Qh1 Rxh1, ...Qxg1 par le cavalier ou la dame, ...Qf1+ et ...Qxf2+ par le roi. Tout coup qui n'est pas un coup de dame laisse la dame en g2 pour Rxg2 .
                                          children:
                                            - ply: Qh3
                                              replyQuality: best
                                              frequency: common
                                              annotation:
                                                vi: Hậu chạy về h3, ô duy nhất không bị ăn. Con hậu sống — nhưng g7 giờ không còn ai canh, và tượng b2 đang nhìn thẳng vào đó rồi xa hơn là xe h8.
                                                en: The queen runs to h3, the only square where it is not captured. The queen lives — but g7 is now guarded by nobody, and the b2 bishop is looking straight at it and, beyond it, at the rook on h8.
                                                fr: La dame fuit en h3, la seule case où elle n'est pas prise. La dame survit — mais g7 n'est plus gardée par personne, et le fou b2 la regarde droit et, au-delà, la tour h8.
                                              children:
                                                - ply: Bxg7
                                                  annotation:
                                                    vi: Tượng ăn tốt g7 và tấn công xe h8. Con xe không có ô nào để đi — mã g8 và tốt h7 của chính Đen vây kín nó — và không quân Đen nào có thể bảo vệ nó.
                                                    en: The bishop takes the g7 pawn and attacks the rook on h8. The rook has no square to go to — Black's own knight on g8 and pawn on h7 box it in — and no black piece can defend it.
                                                    fr: Le fou prend le pion g7 et attaque la tour h8. La tour n'a aucune case où aller — le propre cavalier noir g8 et le pion h7 l'enferment — et aucune pièce noire ne peut la défendre.
                                                  dismissRest:
                                                    reason:
                                                      vi: Đen chơi một nước khác. Xe h8 không thể đi và không thể được bảo vệ, nên Bxh8 theo sau bất kể Đen chơi gì — ba nước chiếu ...Qxf3+, ...Qf1+ và ...Qxf2+ chỉ hoãn nó lại một nhịp bằng cách dâng luôn con hậu. Vài nước còn mất thêm trước đó, ...Qxh2 vào Nxh2, ...Qg4 vào Rxg4, ...Qg2 vào Rxg2, ...Qh4 vào Nxh4, ...Qf5 vào exf5, ...Qg3 vào tốt hoặc xe, còn ...Bc3, ...Bd2, ...Be1 và ...Ba3 treo tượng.
                                                      en: Black plays something else. The rook on h8 cannot move and cannot be defended, so Bxh8 follows whatever Black plays — the three checks ...Qxf3+, ...Qf1+ and ...Qxf2+ only delay it by a move at the cost of the queen itself. Some replies lose even more first, ...Qxh2 to Nxh2, ...Qg4 to Rxg4, ...Qg2 to Rxg2, ...Qh4 to Nxh4, ...Qf5 to exf5, ...Qg3 to a pawn or the rook, and ...Bc3, ...Bd2, ...Be1 and ...Ba3 hang the bishop.
                                                      fr: Les Noirs jouent autre chose. La tour h8 ne peut ni bouger ni être défendue, donc Bxh8 suit quoi que jouent les Noirs — les trois échecs ...Qxf3+, ...Qf1+ et ...Qxf2+ ne le retardent que d'un coup au prix de la dame elle-même. Certaines réponses perdent encore davantage avant cela, ...Qxh2 sur Nxh2, ...Qg4 sur Rxg4, ...Qg2 sur Rxg2, ...Qh4 sur Nxh4, ...Qf5 sur exf5, ...Qg3 sur un pion ou la tour, et ...Bc3, ...Bd2, ...Be1 et ...Ba3 laissent le fou en prise.
                                                  children:
                                                    - ply: Nc6
                                                      replyQuality: good
                                                      frequency: common
                                                      annotation:
                                                        vi: Đen phát triển mã, chấp nhận mất xe và ít ra cũng đưa được một quân ra. Không có cách nào cứu con xe, nên đây là điều tốt nhất có thể làm với nhịp này.
                                                        en: Black develops the knight, accepting the loss of the rook and at least getting a piece out. There is no way to save the rook, so this is the best use of the tempo.
                                                        fr: Les Noirs développent le cavalier, acceptant la perte de la tour et sortant au moins une pièce. Il n'y a aucun moyen de sauver la tour, c'est donc le meilleur emploi de ce temps.
                                                      children:
                                                        - ply: Bxh8
                                                          annotation:
                                                            vi: Tượng ăn xe h8. Bàn cờ ngừng chuyển động ở đây — không quân nào bị treo và không bên nào bị chiếu — và mọi thứ đã có thể đếm được.
                                                            en: The bishop takes the rook on h8. The board stops moving here — nothing is hanging and nobody is in check — and everything can be counted.
                                                            fr: Le fou prend la tour h8. L'échiquier cesse de bouger ici — rien n'est en prise et personne n'est en échec — et tout peut se compter.
                                                          outcome:
                                                            type: position
                                                            evaluation:
                                                              vi: Trắng hơn một xe, kém hai tốt. Trắng còn hậu, hai xe, hai tượng, hai mã và bốn tốt; Đen còn hậu, một xe, hai tượng, hai mã và sáu tốt. Vua Trắng đứng ở e2 và đã mất quyền nhập thành, nhưng vua Đen ở e8 cũng không thể nhập thành ngắn nữa vì xe h8 đã biến mất, và tượng h8 của Trắng đang khống chế đường chéo dài.
                                                              en: White is a rook up for two pawns. White has a queen, two rooks, two bishops, two knights and four pawns; Black has a queen, one rook, two bishops, two knights and six pawns. White's king stands on e2 and has lost the right to castle, but Black's king on e8 can no longer castle short either, with the h8 rook gone, and White's bishop on h8 controls the long diagonal.
                                                              fr: Les Blancs ont une tour de plus contre deux pions. Les Blancs ont une dame, deux tours, deux fous, deux cavaliers et quatre pions ; les Noirs une dame, une tour, deux fous, deux cavaliers et six pions. Le roi blanc se tient en e2 et a perdu le droit de roquer, mais le roi noir e8 ne peut plus faire le petit roque non plus, la tour h8 ayant disparu, et le fou blanc h8 contrôle la grande diagonale.
                                                            plan:
                                                              vi: Trắng rút tượng về (Bd4 hay Bc3) trước khi nó bị ...Nf6 và ...Ng4 quấy rối, chơi Qd2 hoặc Qd3 và Nbd2, đưa vua về f1 hay dùng Rg3 để đuổi hậu, rồi đổi hậu ngay khi có thể — càng ít quân, con xe thừa càng có giá. Đen phải giữ hậu trên bàn bằng mọi giá, chơi ...Nf6 và ...d5 để mở đường cho tượng c8 nhắm vào vua e2, và tìm mọi nước chiếu có thể trước khi Trắng kịp phối hợp.
                                                              en: White brings the bishop back (Bd4 or Bc3) before ...Nf6 and ...Ng4 harass it, plays Qd2 or Qd3 and Nbd2, tucks the king away on f1 or uses Rg3 to chase the queen, and trades queens as soon as possible — the fewer pieces, the more the extra rook is worth. Black has to keep the queens on at all costs, play ...Nf6 and ...d5 to open the c8 bishop towards the king on e2, and look for every check available before White coordinates.
                                                              fr: Les Blancs ramènent le fou (Bd4 ou Bc3) avant que ...Nf6 et ...Ng4 ne le harcèlent, jouent Qd2 ou Qd3 et Nbd2, abritent le roi en f1 ou utilisent Rg3 pour chasser la dame, et échangent les dames dès que possible — moins il y a de pièces, plus la tour de plus vaut cher. Les Noirs doivent garder les dames à tout prix, jouer ...Nf6 et ...d5 pour ouvrir le fou c8 vers le roi e2, et chercher chaque échec disponible avant que les Blancs ne se coordonnent.
