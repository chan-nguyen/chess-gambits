                        en: Black plays ...d6, closing the b2-g7 diagonal with a pawn and opening the c8 bishop. A modest move, and it gives the two white bishops no immediate target at all.
                        fr: Les Noirs jouent ...d6, fermant la diagonale b2-g7 avec un pion et ouvrant le fou c8. Un coup modeste, et il n'offre aux deux fous blancs aucune cible immédiate.
                      outcome:
                        type: position
                        evaluation:
                          vi: Đếm tốt, Trắng năm, Đen bảy — Trắng kém hai tốt, sau khi lấy lại một trong ba. Đổi lại cả hai tượng Trắng đã ra và nhìn vào f7 và g7, còn Đen chưa đưa quân nào ra ngoài con tốt d6; cả hai vua đều chưa nhập thành, và không quân nào đang bị treo.
                          en: Count the pawns, five for White, seven for Black — White is two pawns down, having got one of the three back. In return both white bishops are out and looking at f7 and g7, while Black has moved nothing but the d-pawn; neither king has castled, and nothing is hanging.
                          fr: Comptez les pions, cinq pour les Blancs, sept pour les Noirs — les Blancs ont deux pions de moins, après en avoir récupéré un sur trois. En échange les deux fous blancs sont sortis et regardent f7 et g7, tandis que les Noirs n'ont bougé que le pion d ; aucun roi n'a roqué, et rien n'est en prise.
                        plan:
                          vi: Trắng chơi Nf3, Nc3 hoặc Qb3 nhắm vào f7 và b7, rồi O-O và Re1 hay e5 để mở đường chéo b2-g7 trở lại trước khi Đen kịp nhập thành. Đen chơi ...Nf6, ...Be7 và ...O-O càng nhanh càng tốt, giữ chặt f7 và không mở cột nào cho hai xe Trắng.
                          en: White plays Nf3, Nc3 or Qb3 against f7 and b7, then O-O and Re1 or e5 to reopen the b2-g7 diagonal before Black can castle. Black plays ...Nf6, ...Be7 and ...O-O as fast as possible, holding f7 and opening no file for White's rooks.
                          fr: Les Blancs jouent Nf3, Nc3 ou Qb3 contre f7 et b7, puis O-O et Re1 ou e5 pour rouvrir la diagonale b2-g7 avant que les Noirs ne roquent. Les Noirs jouent ...Nf6, ...Be7 et ...O-O aussi vite que possible, en tenant f7 et sans ouvrir de colonne aux tours blanches.
                        basis:
                          by: chan
                          at: '2026-09-30'
                    - ply: Qg5
                      replyQuality: inaccuracy
                      frequency: occasional
                      annotation:
                        vi: Hậu Đen ra g5, đe doạ tốt g2 và qua đó xe h1. Nước này đưa con hậu ra sớm khi chưa quân nào khác phát triển, và cái mối g2 chính là con tốt Trắng sẵn lòng cho.
                        en: Black's queen comes out to g5, threatening the g2 pawn and through it the rook on h1. It brings the queen out before any other piece, and the g2 bait is exactly the pawn White is happy to give.
                        fr: La dame noire sort en g5, menaçant le pion g2 et à travers lui la tour h1. Ce coup sort la dame avant toute autre pièce, et l'appât g2 est précisément le pion que les Blancs sont ravis de donner.
                      children:
                        - ply: Nf3
                          annotation:
                            vi: Trắng phớt lờ mối đe doạ vào g2, phát triển mã kèm tấn công hậu và mời con hậu ăn tốt. Nếu hậu ăn ở g2 thì cột g mở ra ngay sau lưng nó.
                            en: White ignores the threat to g2, develops the knight with an attack on the queen and invites it to take the pawn. If the queen takes on g2, the g-file opens right behind it.
                            fr: Les Blancs ignorent la menace sur g2, développent le cavalier avec attaque sur la dame et l'invitent à prendre le pion. Si la dame prend en g2, la colonne g s'ouvre juste derrière elle.
                          dismissRest:
                            reason:
                              vi: Đen không ăn ở g2. Nước nào để hậu ở lại g5 thì dâng nó cho Nxg5 — trừ ...Be7, ...f6 và ...h6 che nó, và ...Bb4+ là nước chiếu Trắng phải trả lời trước. Các nước lùi hậu — ...Qf6, ...Qe7, ...Qd8, ...Qg6, ...Qh6, ...Qh5, ...Qg4, ...Qf4, ...Qc5, ...Qa5+ — tránh con mã và để lại Trắng kém hai tốt với ba quân đã ra so với chưa quân nào của Đen. Còn ...Qh4, ...Qg3, ...Qe3+, ...Qd2+, ...Qc1, ...Qf5, ...Qe5, ...Qd5 và ...Qb5 đưa hậu vào chỗ bị ăn ngay.
                              en: Black does not take on g2. Any move that leaves the queen on g5 hands it to Nxg5 — except ...Be7, ...f6 and ...h6, which cover it, and ...Bb4+, a check White has to answer first. The queen's retreats — ...Qf6, ...Qe7, ...Qd8, ...Qg6, ...Qh6, ...Qh5, ...Qg4, ...Qf4, ...Qc5, ...Qa5+ — step out of the knight's way and leave White two pawns down with three pieces out against none of Black's. And ...Qh4, ...Qg3, ...Qe3+, ...Qd2+, ...Qc1, ...Qf5, ...Qe5, ...Qd5 and ...Qb5 put the queen where it is taken at once.
                              fr: Les Noirs ne prennent pas en g2. Tout coup qui laisse la dame en g5 l'offre à Nxg5 — sauf ...Be7, ...f6 et ...h6, qui la couvrent, et ...Bb4+, un échec auquel les Blancs doivent d'abord répondre. Les retraites de la dame — ...Qf6, ...Qe7, ...Qd8, ...Qg6, ...Qh6, ...Qh5, ...Qg4, ...Qf4, ...Qc5, ...Qa5+ — s'écartent du cavalier et laissent les Blancs avec deux pions de moins et trois pièces sorties contre aucune chez les Noirs. Et ...Qh4, ...Qg3, ...Qe3+, ...Qd2+, ...Qc1, ...Qf5, ...Qe5, ...Qd5 et ...Qb5 placent la dame là où elle est prise aussitôt.
