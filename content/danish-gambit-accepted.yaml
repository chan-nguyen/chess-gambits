      annotation:
        vi: Đen ăn nốt con tốt thứ hai, chấp nhận thử thách gắt gao nhất của gambit và giữ nguyên hai tốt thừa trong tay ít nhất là tạm thời.
        en: Black takes the second pawn as well, accepting the sternest test of the gambit and holding two extra pawns in hand, at least for the time being.
        fr: Les Noirs prennent aussi le second pion, acceptant le test le plus sévère du gambit et gardant deux pions supplémentaires en main, du moins pour l'instant.
      children:
        - ply: Bc4
          annotation:
            vi: Trắng chưa vội ăn lại tốt c3 mà đưa tượng ra c4 ngay, nhắm thẳng vào f7 trong khi Đen còn chưa phát triển quân nào. Con tốt c3 vẫn còn đó, và nó có thể ăn tiếp ở b2.
            en: White does not rush to recapture the c3 pawn but brings the bishop to c4 at once, aiming straight at f7 while Black has not developed a single piece yet. The c3 pawn is still there, and it can take once more on b2.
            fr: Les Blancs ne se pressent pas de reprendre le pion c3 mais amènent aussitôt le fou en c4, visant directement f7 alors que les Noirs n'ont encore développé aucune pièce. Le pion c3 est toujours là, et il peut prendre encore en b2.
          dismissRest:
            reason:
              vi: Đen để yên con tốt b2 — ...d6, ...Nf6, ...Nc6, ...Bb4, ...d5 hay một nước tương tự. Trắng ăn lại con tốt c3 bằng mã (hoặc bằng hậu, nếu nó chạy tiếp tới c2) và khi ấy chỉ còn kém đúng một tốt, với tượng c4 đã nằm trên đường chéo tới f7 và Đen còn phải đưa hầu hết quân ra. Cái bẫy bên dưới cần Đen ăn cả con tốt thứ ba, nên không nước nào trong số này rơi vào đó.
              en: Black leaves the b2 pawn alone — ...d6, ...Nf6, ...Nc6, ...Bb4, ...d5 or something similar. White takes the c3 pawn back with the knight (or with the queen, if it runs on to c2) and is then only a single pawn down, with the bishop on c4 already on the diagonal to f7 and Black still to bring out most of the pieces. The trap below needs Black to take the third pawn as well, so none of these run into it.
              fr: Les Noirs laissent le pion b2 tranquille — ...d6, ...Nf6, ...Nc6, ...Bb4, ...d5 ou un coup du même genre. Les Blancs reprennent le pion c3 du cavalier (ou de la dame, s'il file jusqu'en c2) et n'ont plus alors qu'un seul pion de moins, avec le fou c4 déjà sur la diagonale de f7 et les Noirs qui doivent encore sortir la plupart de leurs pièces. Le piège ci-dessous exige que les Noirs prennent aussi le troisième pion, donc aucune de ces réponses n'y tombe.
          children:
            - ply: cxb2
              replyQuality: good
              frequency: common
              annotation:
                vi: Đen ăn nốt con tốt thứ ba. Ba tốt cho hai đường chéo — đây là hình thức đầy đủ nhất của gambit Đan Mạch, và là hình thức mà cả hai tượng Trắng sẽ ra cùng lúc.
                en: Black takes the third pawn as well. Three pawns for two diagonals — this is the Danish in its fullest form, and the form in which both white bishops come out at once.
                fr: Les Noirs prennent aussi le troisième pion. Trois pions contre deux diagonales — c'est le Danois dans sa forme la plus complète, celle où les deux fous blancs sortent en même temps.
              children:
                - ply: Bxb2
                  annotation:
                    vi: Trắng ăn lại bằng tượng c1, và giờ hai tượng nhìn thẳng vào f7 và g7 qua hai đường chéo dài hoàn toàn trống. Đen có hai tốt thừa và chưa quân nào ra khỏi hàng cuối.
                    en: White recaptures with the c1 bishop, and now both bishops look straight at f7 and g7 down two completely empty long diagonals. Black has two extra pawns and not a piece off the back rank.
                    fr: Les Blancs reprennent du fou c1, et désormais les deux fous regardent droit vers f7 et g7 le long de deux grandes diagonales entièrement vides. Les Noirs ont deux pions de plus et pas une pièce sortie de la dernière rangée.
                  dismissRest:
                    reason:
                      vi: Đen chơi một nước khác. ...Be7, ...Bd6 và ...Bc5 rời tượng khỏi f8 và bỏ g7 cho Bxg7; ...g6 và ...g5 mở đường chéo dài tới xe h8 (Bxh8); ...Ba3 treo tượng (Bxa3 hay Nxa3), ...b5 treo tốt cho Bxb5 và ...f5 cho exf5. Những nước còn lại — ...Nc6, ...Nf6, ...Bb4+, ...Qe7, ...c6 và tương tự — phát triển bình thường, và Trắng, đang kém hai tốt, tiếp tục bằng Nf3, Nc3 và O-O để hai con tượng chứng minh giá trị của mình.
                      en: Black plays something else. ...Be7, ...Bd6 and ...Bc5 take the bishop off f8 and leave g7 to Bxg7; ...g6 and ...g5 open the long diagonal to the h8 rook (Bxh8); ...Ba3 hangs the bishop (Bxa3 or Nxa3), ...b5 hangs a pawn to Bxb5 and ...f5 to exf5. The rest — ...Nc6, ...Nf6, ...Bb4+, ...Qe7, ...c6 and the like — develop normally, and White, two pawns down, carries on with Nf3, Nc3 and O-O and asks the two bishops to earn their keep.
                      fr: Les Noirs jouent autre chose. ...Be7, ...Bd6 et ...Bc5 retirent le fou de f8 et abandonnent g7 à Bxg7 ; ...g6 et ...g5 ouvrent la grande diagonale jusqu'à la tour h8 (Bxh8) ; ...Ba3 laisse le fou en prise (Bxa3 ou Nxa3), ...b5 un pion sur Bxb5 et ...f5 sur exf5. Les autres — ...Nc6, ...Nf6, ...Bb4+, ...Qe7, ...c6 et consorts — se développent normalement, et les Blancs, avec deux pions de moins, poursuivent par Nf3, Nc3 et O-O en demandant aux deux fous de justifier l'investissement.
                  children:
                    - ply: d6
