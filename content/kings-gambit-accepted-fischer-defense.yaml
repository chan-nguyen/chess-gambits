# King's Gambit Accepted, Fischer Defense. One of eighteen entries tracked by issue #111
# (group H), sharing the trunk `1.e4 e5 2.f4 exf4 3.Nf3` with `kings-gambit-accepted.yaml`
# and group G (#110). Defining line ends on White's 3.Nf3 (invariant 5). Every move replayed
# with a scratch chess.js script (deleted before commit).
#
# 3...d6 is Bobby Fischer's own recommended try (from his 1961 article "A Bust to the King's
# Gambit") — a quiet move preparing ...g5 without allowing an early Ng5. It is widely
# regarded as one of Black's soundest tries. Under the stricter #107 bar a `position` leaf
# must be clearly decisive; no forced decisive continuation could be established by hand
# without an engine, so the line stops honestly at `unexplored`.
