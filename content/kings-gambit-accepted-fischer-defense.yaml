tree:
  annotation:
    vi: Trắng vừa đưa mã ra f3, Gambit Mã Vua. Mục này đi sâu riêng vào 3...d6, Phòng thủ Fischer.
    en: White has just played the knight to f3, the King's Knight Gambit. This entry follows specifically 3...d6, the Fischer Defense.
    fr: Les Blancs viennent de jouer le cavalier en f3, le Gambit du Cavalier du Roi. Cette entrée suit spécifiquement 3...d6, la Défense Fischer.
  dismissRest:
    reason:
      vi: Đen đáp lại 3.Nf3 bằng một nước khác ngoài 3...d6 — đánh trung tâm bằng 3...d5, tấn công cánh vua bằng 3...g5, hay phát triển mã bằng 3...Nf6. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 3.Nf3 with something other than 3...d6 — striking the centre with 3...d5, a kingside storm with 3...g5, or developing with 3...Nf6. Each is outside the scope of this entry.
      fr: Les Noirs répondent à 3.Nf3 par autre chose que 3...d6 — une frappe centrale par 3...d5, un assaut à l'aile roi par 3...g5, ou un développement par 3...Nf6. Chacun sort du cadre de cette entrée.
  children:
    - ply: d6
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Phòng thủ Fischer, đề xuất nổi tiếng của Bobby Fischer. Đen chuẩn bị ...g5 để giữ tốt f4 mà không cho Trắng cơ hội Ng5, và mở đường cho tượng c8.
        en: The Fischer Defense, Bobby Fischer's own famous recommendation. Black prepares ...g5 to hold the f4 pawn without giving White the chance of Ng5, and opens a path for the c8 bishop.
        fr: La Défense Fischer, la fameuse recommandation de Bobby Fischer lui-même. Les Noirs préparent ...g5 pour conserver le pion f4 sans laisser aux Blancs l'occasion de Ng5, et ouvrent une voie au fou c8.
      outcome:
        type: position
        evaluation:
          vi: Đen vẫn hơn đúng con tốt f4 ban đầu. Đã thử tiếp 4.d4 (dựng trung tâm) g5 (Đen giữ chắc con tốt như dự định), vật chất không đổi và cả hai vua đều chưa nhập thành. Nước d6 đã mở đường cho tượng c8 nhưng chưa quân nào của Đen thực sự phát triển — đây là một thế cờ cân bằng, đúng như Fischer từng đánh giá đây là cách chơi an toàn nhất chứ không phải cách giành lợi thế ngay lập tức.
          en: Black is still exactly one pawn up, the original f4 pawn. Continuing with 4.d4 (building the centre) g5 (Black holds the pawn as intended) was tried; material is unchanged and neither king has castled. The d6 move has opened a path for the c8 bishop, but Black has not actually developed a piece yet — this is a level position, matching Fischer's own assessment of it as the safest way to meet the gambit rather than a way to seize an immediate advantage.
          fr: Les Noirs restent exactement un pion devant, le pion f4 initial. Poursuivre par 4.d4 (bâtissant le centre) g5 (les Noirs conservent le pion comme prévu) a été essayé ; le matériel est inchangé et aucun roi n'a roqué. Le coup d6 a ouvert une voie pour le fou c8, mais les Noirs n'ont pas encore développé de pièce — c'est une position égale, conforme à l'évaluation de Fischer lui-même, qui y voyait la façon la plus sûre d'affronter le gambit plutôt qu'un moyen de saisir un avantage immédiat.
        plan:
          vi: Trắng chơi h4 để thách thức chuỗi tốt g5, hoặc Bc4 và O-O trước, tìm cách khai thác không gian trung tâm đã có. Đen chơi Bg7 và Ne7 hay Nf6, hoàn thiện phát triển và giữ con tốt thừa với thế cờ chắc chắn Fischer đã đề xuất.
          en: White plays h4 to challenge the g5 pawn chain, or Bc4 and castles first, looking to make use of the central space already gained. Black plays Bg7 and Ne7 or Nf6, completing development and holding the extra pawn with the solid setup Fischer recommended.
          fr: Les Blancs jouent h4 pour défier la chaîne de pions g5, ou Bc4 puis roquent d'abord, cherchant à exploiter l'espace central déjà acquis. Les Noirs jouent Bg7 et Ne7 ou Nf6, achevant leur développement et conservant le pion supplémentaire avec le dispositif solide que Fischer recommandait.
        basis:
          by: chan
          at: '2026-09-18'
