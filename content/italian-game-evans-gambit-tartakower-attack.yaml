tree:
  annotation:
    vi: Trắng vừa chơi 7.Qb3, đưa hậu ra sau tượng c4 và tấn công tốt b7, quân được tượng c8 bảo vệ. Trắng có bảy tốt, Đen tám tốt, tốt d4 bị tấn công hai lần và được bảo vệ hai lần, còn tốt c3 bị tượng a5 tấn công và được bảo vệ hai lần, bởi hậu và mã b1. Mục này đi theo nước 7...Qe7.
    en: White has just played 7.Qb3, bringing the queen behind the bishop on c4 and attacking the b7 pawn, which the bishop on c8 defends. White has seven pawns to Black's eight, the d4 pawn is attacked twice and defended twice, and the c3 pawn is attacked by the bishop on a5 and defended twice, by the queen and the knight on b1. This entry follows 7...Qe7.
    fr: Les Blancs viennent de jouer 7.Qb3, amenant la dame derrière le fou c4 et attaquant le pion b7, que le fou c8 défend. Les Blancs ont sept pions contre huit aux Noirs, le pion d4 est attaqué deux fois et défendu deux fois, et le pion c3 est attaqué par le fou a5 et défendu deux fois, par la dame et le cavalier b1. Cette entrée suit 7...Qe7.
  dismissRest:
    reason:
      vi: Đen chơi một nước khác thay vì 7...Qe7 ở đây, chẳng hạn 7...Qd7 hoặc 7...Nh6. Mục này chỉ mô hình hóa nước đi hậu lên e7.
      en: Black plays something other than 7...Qe7 here, for instance 7...Qd7 or 7...Nh6. This entry models only the queen move to e7.
      fr: Les Noirs jouent autre chose que 7...Qe7 ici, par exemple 7...Qd7 ou 7...Nh6. Cette entrée ne modélise que le coup de dame en e7.
  children:
    - ply: Qe7
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen đưa hậu lên e7, nơi nó bảo vệ cả tốt f7 lẫn tốt e5.
        en: Black develops the queen to e7, where it defends both the f7 pawn and the e5 pawn.
        fr: Les Noirs développent la dame en e7, où elle défend à la fois le pion f7 et le pion e5.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám — con tốt đã thí chưa lấy lại được, tốt a của Trắng bị cô lập và cột b bán mở cho Trắng. Hậu b3 tấn công b7, ô chỉ có tượng c8 bảo vệ, còn tượng c4 tấn công f7, ô được vua và hậu bảo vệ. Tốt d4 bị tấn công hai lần và được bảo vệ hai lần, và hai bên chưa nhập thành.'
          en: "Count the pawns: White seven, Black eight — the sacrificed pawn has not come back, White's a-pawn is isolated and the b-file is half-open for White. The queen on b3 attacks b7, which only the bishop on c8 defends, and the bishop on c4 attacks f7, which the king and the queen defend. The d4 pawn is attacked twice and defended twice, and neither side has castled."
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs — le pion sacrifié n'est pas revenu, le pion a blanc est isolé et la colonne b est semi-ouverte pour les Blancs. La dame b3 attaque b7, que seul le fou c8 défend, et le fou c4 attaque f7, que le roi et la dame défendent. Le pion d4 est attaqué deux fois et défendu deux fois, et aucun camp n'a roqué."
        plan:
          vi: Trắng chơi O-O và Bg5, tấn công hậu e7, hoặc d5 để đánh mã c6. Đen chơi ...Nf6 và ...O-O, giữ tốt e5 được bảo vệ.
          en: White plays O-O and Bg5, attacking the queen on e7, or d5 to hit the knight on c6. Black plays ...Nf6 and ...O-O, keeping the e5 pawn defended.
          fr: Les Blancs jouent O-O et Bg5, attaquant la dame e7, ou d5 pour frapper le cavalier c6. Les Noirs jouent ...Nf6 et ...O-O, gardant le pion e5 défendu.
        basis:
          by: chan
          at: 2026-09-30
