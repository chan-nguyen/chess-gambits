# Bird Opening: Williams Gambit. Frozen defining line 1.f4 d5 2.e4, which ends on White's
# own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). Replayed with
# chess.js through 2...dxe4: Black takes the pawn at once, the only piece that can capture
# there. Nothing is hanging at the resulting position. searchMate at 4 moves from this
# position returns no-mate, so no forced mate is claimed anywhere in this entry.
id: bird-opening-williams-gambit
name: 'Bird Opening: Williams Gambit'
eco: A03
category: gambit
side: white
definingLine: [f4, d5, e4]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. White offers the e-pawn on the second move for a central opening that
      Black can simply accept and hold, with no immediate way for White to make the sacrifice
      count. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đáp lại 1...d5 bằng 2.e4, Trắng mời Đen ăn con tốt trung tâm này, đổi lấy việc mở trung tâm và một số nhịp phát triển nào đó bù lại về sau.
    en: Answering 1...d5 with 2.e4, White invites Black to take the central pawn, in exchange for opening the centre and some development to show for it later.
    fr: En réponse à 1...d5 par 2.e4, les Blancs invitent les Noirs à prendre le pion central, en échange de l'ouverture du centre et d'un peu de développement à montrer plus tard.
  dismissRest:
    reason:
      vi: Đen không ăn con tốt e4. Các nước khác như Nf6 hay c6 để nguyên con tốt e4 trên bàn cờ, nghĩa là lời mời vẫn chưa hề được nhận.
      en: Black does not take the e4 pawn. Anything else, such as ...Nf6 or ...c6, leaves the e4 pawn sitting on the board, meaning the offer has still not actually been accepted.
      fr: Les Noirs ne prennent pas le pion e4. Tout le reste, comme ...Nf6 ou ...c6, laisse le pion e4 sur l'échiquier, ce qui veut dire que l'offre n'a toujours pas été acceptée.
  children:
    - ply: dxe4
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen ăn con tốt ngay lập tức, quân duy nhất có thể ăn tại đó. Con tốt d5 đã hoàn thành việc ăn quân và Đen giờ hơn hẳn một tốt.
        en: Black takes the pawn at once, the only piece that can capture there. The d5 pawn has done its capturing and Black is now a clean pawn up.
        fr: Les Noirs prennent aussitôt le pion, la seule pièce pouvant capturer là. Le pion d5 a fait sa capture et les Noirs ont maintenant un pion net d'avance.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy. Đen hơn đúng một tốt sạch, còn Trắng chưa có gì cụ thể để bù lại ngoài ý định đưa mã ra c3 hay f3 để nhắm lại vào con tốt e4.
          en: Count the pawns and it is eight for Black, seven for White. Black is a clean pawn up, and White has nothing concrete yet to show for it beyond the intention to bring a knight to c3 or f3 to take aim at the e4 pawn again.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs. Les Noirs ont un pion net d'avance, et les Blancs n'ont encore rien de concret à montrer, hormis l'intention d'amener un cavalier en c3 ou f3 pour reviser le pion e4.
        plan:
          vi: Trắng chơi Nc3, Nf3 và Bc4, cố ăn lại con tốt e4 và phát triển nhanh trước khi Đen kịp củng cố. Đen chơi Nf6, g6 hay e6, hoàn tất phát triển một cách chắc chắn và giữ vững con tốt thừa nếu có thể.
          en: White plays Nc3, Nf3 and Bc4, trying to win the e4 pawn back and develop quickly before Black can consolidate. Black plays ...Nf6, ...g6 or ...e6, completing development soundly and holding onto the extra pawn if possible.
          fr: Les Blancs jouent Nc3, Nf3 et Bc4, essayant de reprendre le pion e4 et de se développer rapidement avant que les Noirs ne consolident. Les Noirs jouent ...Nf6, ...g6 ou ...e6, achevant leur développement solidement et gardant le pion supplémentaire si possible.
        basis:
          by: chan
          at: '2026-09-25'
