    source: >-
      A judgement. Material is level at the end of the defining line. Black can take the e4
      pawn, but the knight on e5 attacks c6, d7 and f7, both kings have castled and the
      e-file is then open; that is treated as enough for the line to be labelled sound. No
      engine was consulted and no database was queried.
judgement:
