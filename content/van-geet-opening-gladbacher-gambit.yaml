# Van Geet Opening: Gladbacher Gambit. Frozen defining line 1.Nc3 e5 2.b3 d5 3.e4 dxe4
# 4.d3, which ends on White's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). Replayed with chess.js through the reply exd3; searchMate at 3 moves from
# the resulting position returns no-mate, so no forced mate is claimed anywhere in this
# entry.
id: van-geet-opening-gladbacher-gambit
name: 'Van Geet Opening: Gladbacher Gambit'
eco: A00
category: gambit
side: white
definingLine: [Nc3, e5, b3, d5, e4, dxe4, d3]
soundness:
  value: unsound
  reviewedAt: '2026-10-01'
  basis:
    by: chan
    at: '2026-10-01'
    source: >-
      A judgement. At the end of the defining line White is a pawn down, seven pawns to eight,
      and the pawn Black won on e4 is attacked by the knight on c3 and the pawn on d3; Black
      can take on d3 first and still be a pawn up after the recapture, and White has not been
      shown to get anything concrete in return. No engine was consulted and no database was
      queried.
judgement:
  by: chan
  at: '2026-10-01'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: 'Trắng vừa chơi 4.d3, tấn công tốt e4 của Đen. Tốt e4 bị mã c3 và tốt d3 tấn công mà không có quân nào bảo vệ, và Trắng đang kém một tốt, bảy tốt so với tám. Tốt d3 bị tốt e4 và hậu d8 tấn công dọc cột d, và được tốt c2, hậu và tượng f1 bảo vệ. Mục này đi theo nước Đen ăn 4...exd3.'
    en: "White has just played 4.d3, attacking Black's pawn on e4. That pawn is attacked by the knight on c3 and the pawn on d3 and nothing defends it, and White is a pawn down, seven pawns to eight. The d3 pawn is attacked by the e4 pawn and by the queen on d8 along the d-file, and is defended by the c2 pawn, the queen and the bishop on f1. This entry follows Black capturing 4...exd3."
    fr: 'Les Blancs viennent de jouer 4.d3, attaquant le pion e4 noir. Ce pion est attaqué par le cavalier c3 et par le pion d3 sans être défendu, et les Blancs ont un pion de moins, sept contre huit. Le pion d3 est attaqué par le pion e4 et par la dame d8 le long de la colonne d, et il est défendu par le pion c2, la dame et le fou f1. Cette entrée suit la prise 4...exd3 des Noirs.'
  dismissRest:
    reason:
      vi: 'Đen chơi một nước khác thay vì 4...exd3, chẳng hạn một nước phát triển quân để nguyên thế căng thẳng giữa e4 và d3. Mục này chỉ đi theo nước ăn tốt.'
      en: 'Black plays something other than 4...exd3 here, for example a developing move that leaves the tension between e4 and d3 in place. This entry follows only the capture.'
      fr: 'Les Noirs jouent autre chose que 4...exd3 ici, par exemple un coup de développement qui laisse en place la tension entre e4 et d3. Cette entrée ne suit que la prise.'
  children:
    - ply: exd3
      replyQuality: good
      frequency: common
      annotation:
        vi: 'Đen ăn tốt d3 bằng tốt từ e4. Tốt mới trên d3 bị tốt c2, hậu và tượng f1 tấn công mà chỉ có hậu d8 bảo vệ, nên Trắng sắp ăn lại.'
        en: 'Black takes the d3 pawn with the pawn from e4. The new pawn on d3 is attacked by the c2 pawn, the queen and the bishop on f1, and only the queen on d8 defends it, so White is about to recapture.'
        fr: 'Les Noirs prennent le pion d3 avec le pion venu de e4. Le nouveau pion d3 est attaqué par le pion c2, la dame et le fou f1, et seule la dame d8 le défend, si bien que les Blancs vont reprendre.'
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng sáu, Đen tám, và tốt d3 của Đen vẫn còn trên bàn. Tốt đó bị tấn công ba lần (tốt c2, hậu và tượng f1) mà chỉ có hậu d8 bảo vệ, nên Trắng ăn lại ngay và số tốt thành sáu so với bảy: Trắng vẫn kém một tốt. Lúc này Trắng cũng không có tốt nào trên cột d và cột e, trong khi Đen còn tốt e5.'
          en: "Count the pawns: White six, Black eight, with Black's pawn on d3 still on the board. That pawn is attacked three times (by the c2 pawn, the queen and the bishop on f1) and defended only by the queen on d8, so White takes it back at once and the count settles at six pawns against seven: White is still a pawn down. For the moment White also has no pawn on the d- or e-file, while Black keeps the pawn on e5."
          fr: "Comptez les pions : six pour les Blancs, huit pour les Noirs, le pion noir d3 étant encore sur l'échiquier. Ce pion est attaqué trois fois (par le pion c2, la dame et le fou f1) et défendu seulement par la dame d8, si bien que les Blancs le reprennent aussitôt et que le compte se règle à six pions contre sept : les Blancs ont toujours un pion de moins. Pour le moment, les Blancs n'ont de plus aucun pion sur les colonnes d et e, tandis que les Noirs gardent le pion e5."
        plan:
          vi: 'Trắng ăn lại trên d3, tự nhiên nhất là Bxd3 để phát triển tượng, rồi Bb2, Nf3 và O-O. Đen phát triển bằng ...Nc6 và ...Nf6, còn ...Bb4 ghim mã c3 vào vua.'
          en: 'White recaptures on d3, most naturally with Bxd3, which develops the bishop, then plays Bb2, Nf3 and O-O. Black develops with ...Nc6 and ...Nf6, and ...Bb4 pins the knight on c3 to the king.'
          fr: 'Les Blancs reprennent en d3, le plus naturellement par Bxd3, ce qui développe le fou, puis jouent Bb2, Nf3 et O-O. Les Noirs se développent par ...Nc6 et ...Nf6, et ...Bb4 cloue le cavalier c3 au roi.'
        basis:
          by: chan
          at: '2026-10-01'
