judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng thí tốt b4 ngay dưới mũi tượng c5. Mục này đi sâu riêng vào việc Đen nhận tốt.
    en: White offers the b-pawn right under the bishop on c5. This entry follows specifically Black accepting it.
    fr: Les Blancs offrent le pion b juste sous le fou en c5. Cette entrée suit spécifiquement l'acceptation du pion par les Noirs.
  dismissRest:
    reason:
      vi: Đen không ăn tốt b4 — lui tượng về b6 (Từ chối), đẩy tốt lên b5 hay d5 (hai phản-gambit), hay lui về nơi khác. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black does not take the b4 pawn — retreating the bishop to b6 (Declined), pushing b5 or d5 (the two countergambits), or falling back elsewhere. Each is outside the scope of this entry.
      fr: Les Noirs ne prennent pas le pion b4 — reculant le fou en b6 (Refusé), poussant b5 ou d5 (les deux contre-gambits), ou se repliant ailleurs. Chacun sort du cadre de cette entrée.
  children:
    - ply: Bxb4
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen nhận tốt. Con tượng rời c5, và Trắng sẽ có nhịp để chơi c3 rồi d4, dựng đôi tốt trung tâm.
        en: Black accepts. The bishop leaves c5, and White will have the tempo to play c3 and then d4, building the central pawn duo.
        fr: Les Noirs acceptent. Le fou quitte c5, et les Blancs auront le temps de jouer c3 puis d4, construisant le duo de pions central.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy — Đen hơn đúng một tốt sạch. Đổi lại, con tượng Đen vừa phải di chuyển lần thứ hai và đứng ở b4, ngoài vùng trung tâm, trong khi Trắng chưa mất một nhịp phát triển nào.
          en: Count the pawns and it is eight for Black, seven for White — Black is a clean pawn up. In exchange, Black's bishop has just moved a second time and stands on b4, away from the centre, while White has not spent a single developing tempo yet.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs — les Noirs ont un pion net d'avance. En échange, le fou noir vient de bouger une seconde fois et se tient en b4, loin du centre, alors que les Blancs n'ont encore dépensé aucun temps de développement.
        plan:
          vi: Trắng chơi c3 đuổi tượng lần nữa, rồi d4 dựng trung tâm và Nc3 hoặc O-O, đặt cược toàn bộ vào nhịp và không gian để bù cho con tốt đã mất. Đen lui tượng về a5 hoặc c5, rồi ...d6 và ...Nf6, cố giữ con tốt qua giai đoạn khai cuộc.
          en: White plays c3 to chase the bishop again, then d4 to build the centre and Nc3 or O-O, betting everything on tempo and space to make up for the lost pawn. Black drops the bishop back to a5 or c5, then plays ...d6 and ...Nf6, trying to hold the pawn through the opening.
          fr: Les Blancs jouent c3 pour chasser encore le fou, puis d4 pour bâtir le centre et Nc3 ou O-O, misant tout sur le temps et l'espace pour compenser le pion perdu. Les Noirs replient le fou en a5 ou c5, puis jouent ...d6 et ...Nf6, essayant de garder le pion durant l'ouverture.
        basis:
          by: chan
          at: '2026-09-25'
