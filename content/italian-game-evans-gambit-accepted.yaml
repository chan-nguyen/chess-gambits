# Italian Game, Evans Gambit Accepted. One of a batch of entries authored for issue #148
# (batch h), sharing the trunk `1.e4 e5 2.Nf3 Nc6 3.Bc4 Bc5 4.b4` with
# `italian-game-evans-gambit.yaml`, whose own root already models 4...Bxb4 as its main
# branch before continuing into 5.c3. This entry stops one ply earlier, right at the
# acceptance itself, for a learner who wants the bare material fact before the deeper
# c3/Ba5 theory. Defining line ends on White's 4.b4 (invariant 5). Every ply below was
# replayed with chess.js before being written.
id: italian-game-evans-gambit-accepted
name: 'Italian Game: Evans Gambit Accepted'
eco: C51
category: gambit
side: white
definingLine: [e4, e5, Nf3, Nc6, Bc4, Bc5, b4]
soundness:
  value: sound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      The same judgement the family head `italian-game-evans-gambit.yaml` carries. No engine
