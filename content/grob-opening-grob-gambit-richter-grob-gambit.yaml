judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa fianchetto tượng lên g2. Mục này đi sâu riêng vào 2...c6, chuẩn bị ...Qb6 hay ...Qa5 mà không vội ăn tốt g4.
    en: White has just fianchettoed the bishop to g2. This entry follows specifically 2...c6, preparing ...Qb6 or ...Qa5 without hurrying to take the g4 pawn.
    fr: Les Blancs viennent de fianchetter le fou en g2. Cette entrée suit spécifiquement 2...c6, préparant ...Db6 ou ...Da5 sans se presser de prendre le pion g4.
  dismissRest:
    reason:
      vi: Đen không chơi 2...c6 — ăn tốt bằng 2...Bxg4, phát triển bằng 2...Nf6, hay chơi 2...h5 (Basman) hay 2...e5 (Keres). Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black does not play 2...c6 — taking with 2...Bxg4, developing with 2...Nf6, or playing 2...h5 (Basman) or 2...e5 (Keres). Each is outside the scope of this entry.
      fr: Les Noirs ne jouent pas 2...c6 — prenant par 2...Fxg4, développant par 2...Cf6, ou jouant 2...h5 (Basman) ou 2...e5 (Keres). Chacun sort du cadre de cette entrée.
  children:
    - ply: c6
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Gambit Richter-Grob. Đen chưa vội ăn con tốt g4 và thay vào đó chuẩn bị đưa hậu ra b6 hay a5, để con tốt g4 làm mồi cho sau này.
        en: The Richter-Grob Gambit. Black is in no hurry to take the g4 pawn and instead prepares to bring the queen to b6 or a5, leaving the g4 pawn as bait for later.
        fr: Le Gambit Richter-Grob. Les Noirs ne sont pas pressés de prendre le pion g4 et préparent plutôt à amener la dame en b6 ou a5, laissant le pion g4 comme appât pour plus tard.
      children:
        - ply: c4
          annotation:
            vi: Trắng đẩy tốt lên c4, thí thêm một tốt nữa để mở đường chéo dài cho tượng g2 trước khi Đen kịp đưa hậu ra tấn công.
            en: White pushes c4, offering a second pawn to open the long diagonal for the g2 bishop before Black can bring the queen out to attack.
            fr: Les Blancs poussent c4, offrant un second pion pour ouvrir la grande diagonale au fou g2 avant que les Noirs ne puissent sortir la dame pour attaquer.
          dismissRest:
            reason:
              vi: Đen không ăn tốt c4 — đưa hậu ra b6 hay a5 như dự định, hay phát triển bằng 3...Nf6. Mỗi lựa chọn để nguyên con tốt c4 của Trắng trên bàn cờ, chưa bị đòi lại.
              en: Black does not take the c4 pawn — bringing the queen to b6 or a5 as planned, or developing with 3...Nf6. Each leaves White's c4 pawn sitting on the board, not yet won back.
              fr: Les Noirs ne prennent pas le pion c4 — amenant la dame en b6 ou a5 comme prévu, ou développant par 3...Cf6. Chacun laisse le pion c4 blanc sur l'échiquier, pas encore regagné.
          children:
            - ply: dxc4
              annotation:
                vi: Đen ăn tốt c4, giờ hơn đúng một tốt tính riêng về số lượng. Nhưng đường chéo g2-a8 giờ đã mở hoàn toàn, và con tốt g4 vẫn còn đó chưa ai đụng tới.
                en: Black takes the c4 pawn, now up exactly one pawn by count alone. But the g2-a8 diagonal is now fully open, and the g4 pawn is still sitting there untouched.
                fr: Les Noirs prennent le pion c4, désormais exactement un pion d'avance en nombre seulement. Mais la diagonale g2-a8 est maintenant totalement ouverte, et le pion g4 est toujours là, intact.
              outcome:
                type: position
                evaluation:
                  vi: Đếm tốt thì Đen tám, Trắng bảy — hơn đúng một tốt tính riêng, nhưng con tượng g2 giờ nhìn suốt một đường chéo dài không vướng gì, còn con tốt g4 vẫn đứng nguyên, một lời mời Đen chưa nhận. Đây là vật chất tạm thời chứ chưa phải bức tranh cuối cùng.
                  en: Count the pawns and it is eight for Black, seven for White — exactly one pawn up by count alone, but the g2 bishop now looks all the way down a completely clear long diagonal, and the g4 pawn is still standing, an invitation Black has not taken yet. This is temporary material, not the final picture.
                  fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs — exactement un pion d'avance en nombre seulement, mais le fou en g2 regarde désormais tout le long d'une grande diagonale totalement dégagée, et le pion g4 est toujours debout, une invitation que les Noirs n'ont pas encore acceptée. C'est un matériel provisoire, pas l'image finale.
                plan:
                  vi: Trắng chơi Qa4+ hay Nf3, dồn quân nhanh và tận dụng đường chéo dài cùng nhịp phát triển để bù cho hai tốt đã mất. Đen chơi Nd7 hay Qb6, hoàn thiện phát triển và giữ hai con tốt thừa làm vốn liếng, sẵn sàng ăn nốt tốt g4 nếu có dịp an toàn.
                  en: White plays Qa4+ or Nf3, developing quickly and using the long diagonal and the tempo to make up for the two pawns spent. Black plays Nd7 or Qb6, completing development and banking the two extra pawns, ready to take the g4 pawn too when it is safe.
                  fr: Les Blancs jouent Qa4+ ou Nf3, se développant rapidement et exploitant la grande diagonale et le temps pour compenser les deux pions dépensés. Les Noirs jouent Nd7 ou Qb6, achevant leur développement et conservant les deux pions supplémentaires, prêts à prendre aussi le pion g4 dès que ce sera sûr.
                basis:
                  by: chan
                  at: '2026-09-25'
