# King's Gambit Accepted, Orsini Gambit: 1.e4 e5 2.f4 exf4 3.b3. Every ply below was
# replayed with chess.js before being written (see docs/CONTEXT.md, invariant 1). The leaf
# is a decisive stop under the #107 bar: a clean extra pawn plus a king permanently stuck
# on e2 with no shield and no route to castling.
id: kings-gambit-accepted-orsini-gambit
name: Orsini Gambit
eco: C33
category: gambit
side: white
definingLine: [e4, e5, f4, exf4, b3]
soundness:
  value: unsound
  reviewedAt: '2026-09-18'
  basis:
    by: chan
    at: '2026-09-18'
    source: >-
      A judgement. 3.b3 prepares a queenside fianchetto but does nothing on the kingside,
      where the actual problem is — 3...Qh4+ exploits that immediately, and neither White
      reply avoids real damage. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng chơi 3.b3, dự định fianchetto tượng sang b2 để nhắm vào trung tâm. Nhưng nước đi này không giải quyết gì ở cánh vua, nơi Đen đã sẵn sàng khai thác ngay lập tức.
    en: White plays 3.b3, planning a bishop fianchetto to b2 aimed at the centre. But it does nothing to address the kingside, where Black is ready to exploit matters at once.
    fr: Les Blancs jouent 3.b3, prévoyant un fianchetto du fou en b2 visant le centre. Mais cela ne règle rien à l'aile roi, où les Noirs sont prêts à exploiter la situation sur-le-champ.
  dismissRest:
    reason:
      vi: Đen chơi một nước phát triển khác thay vì chiếu ngay. Bất kỳ nước nào cũng giữ nguyên một tốt hơn cho Đen, nhưng 3...Qh4+ là cách trực tiếp nhất buộc vua Trắng phải rời vị trí ban đầu.
      en: Black plays some other developing move instead of checking at once. Any of them keeps Black's extra pawn intact, but 3...Qh4+ is the most direct way to force White's king from its starting square.
      fr: Les Noirs jouent un autre coup de développement au lieu de mettre en échec immédiatement. Chacun d'eux conserve le pion supplémentaire des Noirs, mais 3...Qh4+ est le moyen le plus direct de forcer le roi blanc à quitter sa case de départ.
  children:
    - ply: Qh4+
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen chiếu ngay bằng Qh4+. Trắng chỉ có hai lựa chọn — 4.g3 mất thêm một tốt nữa sau fxg3, còn 4.Ke2 mất quyền nhập thành ngay lập tức nhưng không mất thêm quân. Ke2 là lựa chọn thực dụng hơn.
        en: Black checks at once with Qh4+. White has only two replies — 4.g3 drops a further pawn to fxg3, while 4.Ke2 forfeits castling immediately but loses no extra material. Ke2 is the more practical choice.
        fr: Les Noirs mettent en échec immédiatement par Qh4+. Les Blancs n'ont que deux réponses — 4.g3 cède un pion supplémentaire après fxg3, tandis que 4.Ke2 sacrifie immédiatement le roque sans perdre de matériel supplémentaire. Ke2 est le choix le plus pragmatique.
      children:
        - ply: Ke2
          annotation:
            vi: Trắng buộc phải đi Ke2, tránh mất thêm tốt nhưng từ bỏ quyền nhập thành vĩnh viễn. Ô f2 ngay bên cạnh vua hoàn toàn trống — Trắng đã mất tốt f ngay từ nước 2...exf4 — nên vua không còn một lá chắn tốt nào ở đó.
            en: White is forced into Ke2, avoiding a further pawn loss but giving up castling for good. The f2 square right beside the king is completely empty — White gave up its f-pawn all the way back at 2...exf4 — so there is no pawn shield left there at all.
            fr: Les Blancs sont contraints de jouer Ke2, évitant une perte de pion supplémentaire mais abandonnant le roque pour de bon. La case f2, juste à côté du roi, est totalement vide — les Blancs ont cédé leur pion f dès 2...exf4 — si bien qu'il n'y a plus aucun bouclier de pions à cet endroit.
          dismissRest:
            reason:
              vi: Đen chơi một nước khác thay vì giữ lại con tốt f4 bằng g5. Bất kỳ lựa chọn nào cũng để lại vị trí tương tự có lợi cho Đen, nhưng 4...g5 là cách đơn giản nhất để khóa chặt cả hai lợi thế mà không mở thêm đường cho quân Trắng.
              en: Black plays something other than locking in the f4 pawn with g5. Any choice leaves a broadly similar position in Black's favour, but 4...g5 is the simplest way to lock in both advantages without opening any more lines for White's pieces.
              fr: Les Noirs jouent autre chose que de verrouiller le pion f4 par g5. Tout autre choix laisse une position globalement semblable en faveur des Noirs, mais 4...g5 est le moyen le plus simple de verrouiller les deux avantages sans ouvrir davantage de lignes pour les pièces blanches.
          children:
            - ply: g5
              replyQuality: best
              frequency: common
              annotation:
                vi: Đen củng cố con tốt f4 bằng g5, khóa chặt cấu trúc tốt cánh vua. Thế cờ giờ đã ổn định hoàn toàn có lợi cho Đen, và nước b3 của Trắng vẫn chưa đóng góp gì cho cuộc chơi ở cánh vua.
                en: Black shores up the f4 pawn with g5, locking the kingside pawn structure. The position is now fully settled in Black's favour, and White's b3 still has not contributed anything to the fight on the kingside.
                fr: Les Noirs consolident le pion f4 par g5, verrouillant la structure de pions à l'aile roi. La position est désormais pleinement stabilisée en faveur des Noirs, et le coup b3 des Blancs n'a toujours rien apporté au combat à l'aile roi.
              outcome:
                type: position
                evaluation:
                  vi: Đen hơn đúng một tốt (f4, được g5 bảo vệ vĩnh viễn) mà không có bù đắp nào cho Trắng. Vua Trắng đứng tại e2 — mất quyền nhập thành vĩnh viễn — với ô f2 bên cạnh hoàn toàn trống, không một tốt nào che chắn, và tượng b2 tương lai của Trắng chẳng giúp ích gì cho sự an toàn của vua.
                  en: Black is a clean pawn up (the f4 pawn, permanently guarded by g5) with no compensation for White at all. White's king stands on e2 — castling gone for good — with the f2 square beside it completely bare of any pawn, and White's planned Bb2 does nothing at all to help the king's safety.
                  fr: Les Noirs ont un pion d'avance net (le pion f4, défendu à jamais par g5) sans la moindre compensation pour les Blancs. Le roi blanc se tient en e2 — le roque perdu pour de bon — avec la case f2 juste à côté totalement vide de tout pion, et le Bb2 prévu par les Blancs n'apporte absolument rien à la sécurité du roi.
                plan:
                  vi: Đen phát triển bình thường với Nc6, Nf6, Bc5 hoặc Bg7 sau khi chơi thêm d6, nhắm quân vào vua Trắng đang mắc kẹt ở giữa bàn cờ, và không có gì phải vội vì lợi thế đã vững chắc và lâu dài.
                  en: Black develops normally with Nc6, Nf6, and Bc5 or a Bg7 fianchetto after a further d6, aiming pieces at White's king stuck in the middle of the board, with nothing to rush since the advantage is solid and lasting.
                  fr: Les Noirs se développent normalement par Nc6, Nf6, et Bc5 ou un fianchetto Bg7 après un futur d6, en dirigeant leurs pièces vers le roi blanc bloqué au milieu de l'échiquier, sans rien à précipiter puisque l'avantage est solide et durable.
                basis:
                  by: chan
                  at: '2026-09-18'
