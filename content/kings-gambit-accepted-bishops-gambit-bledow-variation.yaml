# King's Gambit Accepted, Bishop's Gambit, Bledow Variation. One of eighteen entries tracked
# by issue #111 (group H), sharing the trunk `1.e4 e5 2.f4 exf4 3.Bc4` with
# `kings-gambit-accepted.yaml` and group G (#110). Defining line ends on White's 3.Bc4
# (invariant 5). Every move replayed with a scratch chess.js script (deleted before commit).
#
# 3...d5 strikes back at the bishop and the centre immediately, the same idea the Modern
# Defence uses against the King's Knight Gambit. Under the stricter #107 bar a `position`
# leaf must be clearly decisive; this central counter is genuinely double-edged and no forced
# decisive continuation could be established by hand without an engine, so the line stops at
# `unexplored` rather than asserting a verdict that is not actually there.
