tree:
  annotation:
    vi: Tốt c3 vừa đánh tượng b4 và dọn chỗ cho d4. Mục này đi sâu riêng vào 5...Bd6, một ô lui ít gặp hơn hẳn so với a5, c5 hay e7.
    en: The c3 pawn has just attacked the bishop on b4 and cleared the way for d4. This entry follows specifically 5...Bd6, a retreat square seen far less often than a5, c5 or e7.
    fr: Le pion c3 vient d'attaquer le fou en b4 et de dégager la route de d4. Cette entrée suit spécifiquement 5...Fd6, une case de repli bien plus rare que a5, c5 ou e7.
  dismissRest:
    reason:
      vi: Đen đáp lại 5.c3 bằng một nước khác ngoài 5...Bd6 — lui về a5 (nhánh chính), c5 (McDonnell), e7 (Anderssen) hay f8 (Mayet), hay trả lại tốt bằng 5...d5. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 5.c3 with something other than 5...Bd6 — retreating to a5 (the main line), c5 (McDonnell), e7 (Anderssen) or f8 (Mayet), or giving the pawn back with 5...d5. Each is outside the scope of this entry.
      fr: Les Noirs répondent à 5.c3 par autre chose que 5...Fd6 — reculant en a5 (la ligne principale), c5 (McDonnell), e7 (Anderssen) ou f8 (Mayet), ou rendant le pion par 5...d5. Chacun sort du cadre de cette entrée.
  children:
    - ply: Bd6
      replyQuality: inaccuracy
      frequency: rare
      annotation:
        vi: Biến Stone-Ware. Tượng lui về d6, một ô hiếm gặp vì nó chắn ngay con tốt d7, khiến Đen khó phát triển bằng ...d5 hay ...d6 sau này.
        en: The Stone-Ware Variation. The bishop drops back to d6, a rare choice because it blocks the d7 pawn directly, making it harder for Black to develop with ...d5 or ...d6 later.
        fr: La Variante Stone-Ware. Le fou recule en d6, un choix rare car il bloque directement le pion d7, rendant plus difficile un développement noir par ...d5 ou ...d6 plus tard.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy — Đen vẫn hơn đúng một tốt. Nhưng con tượng ở d6 chắn mất con tốt d7, khiến Đen khó đẩy tốt trung tâm ấy đi và khó đưa tượng c8 ra ngoài hơn hẳn so với các ô lui khác.
          en: Count the pawns and it is eight for Black, seven for White — Black is still exactly one pawn up. But the bishop on d6 blocks the d7 pawn, making that central pawn harder to push and the c8 bishop harder to develop than after any of the other retreat squares.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs — les Noirs restent exactement un pion devant. Mais le fou en d6 bloque le pion d7, rendant ce pion central plus difficile à pousser et le fou c8 plus difficile à développer qu'après n'importe quelle autre case de repli.
        plan:
          vi: Trắng chơi d4, rồi O-O và Bb2 hoặc Ba3, tận dụng trung tâm và sự chậm phát triển của Đen để bù cho con tốt đã mất. Đen chơi Nf6 và tìm cách chuyển tượng đi nơi khác hoặc chấp nhận chậm một nhịp, cố hoàn thiện phát triển trước khi Trắng kịp tấn công.
          en: White plays d4, then O-O and Bb2 or Ba3, using the centre and Black's slower development to make up for the lost pawn. Black plays Nf6 and looks for a way to reroute the bishop or accepts being a tempo slower, trying to finish developing before White's attack gets going.
          fr: Les Blancs jouent d4, puis O-O et Bb2 ou Ba3, utilisant le centre et le développement plus lent des Noirs pour compenser le pion perdu. Les Noirs jouent Nf6 et cherchent à reconvertir le fou ailleurs ou acceptent un temps de retard, essayant d'achever leur développement avant que l'attaque blanche ne démarre.
        basis:
          by: chan
          at: '2026-09-25'
