tree:
  annotation:
    vi: 'Đen vừa nhập thành bằng 6...O-O, kém một tốt sau 6.Nxe5. Trắng có tám tốt, Đen bảy tốt. Mã e5 tấn công các tốt d7 và f7, đều được bảo vệ, tượng a4 cũng tấn công d7, còn mã d4 của Đen tấn công tốt c2, quân được tượng a4 và hậu bảo vệ.'
    en: "Black has just castled with 6...O-O, a pawn down after 6.Nxe5. White has eight pawns to Black's seven. The knight on e5 attacks the pawns on d7 and f7, both defended, the bishop on a4 also attacks d7, and Black's knight on d4 attacks the pawn on c2, which the bishop and the queen defend."
    fr: 'Les Noirs viennent de roquer par 6...O-O, avec un pion de moins après 6.Nxe5. Les Blancs ont huit pions contre sept aux Noirs. Le cavalier e5 attaque les pions d7 et f7, tous deux défendus, le fou a4 attaque aussi d7, et le cavalier d4 des Noirs attaque le pion c2, que le fou et la dame défendent.'
  dismissRest:
    reason:
      vi: 'Trắng chơi nước khác 7.Nd3 ở đây, chẳng hạn 7.O-O. Mục này đi theo nước mã lên d3, tấn công tượng c5.'
      en: 'White plays something other than 7.Nd3 here, for instance 7.O-O. This entry follows the knight to d3, which attacks the bishop on c5.'
      fr: 'Les Blancs jouent autre chose que 7.Nd3 ici, par exemple 7.O-O. Cette entrée suit le cavalier en d3, qui attaque le fou c5.'
  children:
    - ply: 'Nd3'
      replyQuality: 'best'
      frequency: 'common'
      annotation:
        vi: 'Trắng đưa mã lên d3, nơi nó tấn công tượng c5, quân không có gì bảo vệ.'
        en: 'White moves the knight to d3, where it attacks the bishop on c5, which nothing defends.'
        fr: 'Les Blancs placent le cavalier en d3, où il attaque le fou c5, que rien ne défend.'
      children:
        - ply: 'Bb6'
          annotation:
            vi: 'Đen lùi tượng về b6, thoát khỏi đòn tấn công của mã.'
            en: "Black retreats the bishop to b6, out of the knight's attack."
            fr: 'Les Noirs replient le fou en b6, hors de portée du cavalier.'
          outcome:
            type: 'position'
            evaluation:
              vi: 'Đếm tốt: Trắng tám, Đen bảy, nghĩa là con tốt đã thí chưa lấy lại được. Mã d4 của Đen tấn công tốt c2, quân được tượng a4 và hậu bảo vệ, và mã f6 tấn công tốt e4, quân được mã c3 bảo vệ. Tượng a4 tấn công tốt d7, quân được ba quân bảo vệ.'
              en: "Count the pawns: White eight, Black seven, so the sacrificed pawn has not come back. Black's knight on d4 attacks the pawn on c2, which the bishop on a4 and the queen defend, and the knight on f6 attacks the pawn on e4, which the knight on c3 defends. The bishop on a4 attacks the pawn on d7, which three pieces defend."
              fr: "Comptez les pions : huit pour les Blancs, sept pour les Noirs, donc le pion sacrifié n'est pas revenu. Le cavalier d4 des Noirs attaque le pion c2, que le fou a4 et la dame défendent, et le cavalier f6 attaque le pion e4, que le cavalier c3 défend. Le fou a4 attaque le pion d7, que trois pièces défendent."
            plan:
              vi: 'Trắng đẩy e5 để tấn công mã f6. Đen lùi mã bằng ...Ne8.'
              en: 'White plays e5 to attack the knight on f6. Black retreats the knight with ...Ne8.'
              fr: 'Les Blancs jouent e5 pour attaquer le cavalier f6. Les Noirs replient le cavalier par ...Ne8.'
            basis:
              by: 'chan'
