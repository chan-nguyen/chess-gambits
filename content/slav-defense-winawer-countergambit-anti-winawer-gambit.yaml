tree:
  annotation:
    vi:
      Đen chơi 3...e5!?, một phản thí tốt ngay từ sớm để tranh chấp trung tâm thay vì đi theo lối chơi
      Slav thông thường.
    en: Black plays 3...e5!?, an early countergambit pawn offer to contest the centre instead of
      following the ordinary Slav setup.
    fr:
      Les Noirs jouent 3...e5!?, une offre précoce de contre-gambit pour contester le centre au lieu
      de suivre le dispositif habituel de la Slave.
  dismissRest:
    reason:
      vi: Trắng ăn tốt ngay bằng dxe5 hoặc chơi nước khác ngoài e4. Ăn tốt dẫn sang biến Winawer
        Countergambit chính với đánh giá khác; các nước khác thường ít sắc bén hơn ý tưởng phản thí
        e4 này.
      en:
        White captures at once with dxe5, or plays something other than e4. Capturing leads into the
        main Winawer Countergambit line with a different assessment; other tries are usually less
        sharp than this e4 countergambit idea.
      fr:
        Les Blancs capturent aussitôt par dxe5, ou jouent autre chose que e4. La capture mène à la ligne
        principale du Contre-gambit Winawer avec une évaluation différente ; les autres coups sont
        généralement moins tranchants que cette idée de contre-gambit e4.
  children:
    - ply: e4
      replyQuality: inaccuracy
      frequency: occasional
      annotation:
        vi:
          Thay vì ăn tốt bằng dxe5, Trắng đẩy luôn 4.e4, phản đòn lại chính con tốt phản thí của Đen bằng
          một con tốt phản thí của riêng mình.
        en:
          Instead of capturing with dxe5, White pushes 4.e4 at once, answering Black's own countergambit
          pawn with a countergambit pawn of their own.
        fr: Au lieu de capturer par dxe5, les Blancs poussent aussitôt 4.e4, répondant au pion du
          contre-gambit noir par un contre-gambit de leur côté.
      outcome:
        type: position
        evaluation:
          vi:
            Đếm tốt, hai bên vẫn đều có 8 — chưa quân nào bị ăn, nhưng cả tốt e5 của Đen lẫn tốt e4 mới đẩy
            của Trắng đều là những con tốt đang ở thế căng, có thể bị ăn bất cứ lúc nào.
          en:
            Count the pawns and both sides still have 8 — nothing has actually been captured yet, but both
            the pawn on e5 and the newly pushed pawn on e4 sit in tension, each capturable at any
            moment.
          fr:
            Comptez les pions, chaque camp en a encore 8 — rien n'a encore été réellement capturé, mais le
            pion noir en e5 et le pion blanc fraîchement poussé en e4 sont tous deux en tension,
            chacun capturable à tout instant.
        plan:
          vi:
            Trắng chơi Nxe4 tiếp theo nếu Đen không kịp phản ứng, hoặc dựa vào tốt e4 để mở đường cho tượng
            f1. Đen chơi dxe4 ăn lại hoặc Nf6 gây sức ép lên trung tâm, tìm cách khai thác căng
            thẳng đang có lợi cho mình.
          en:
            White plays Nxe4 next if Black does not react in time, or uses the e4 pawn to open a line for
            the bishop on f1. Black plays dxe4 to capture, or Nf6 to press the centre, trying to
            exploit the tension in their favour.
          fr:
            Les Blancs jouent Nxe4 ensuite si les Noirs ne réagissent pas à temps, ou utilisent le pion e4
            pour ouvrir une ligne au fou f1. Les Noirs jouent dxe4 pour capturer, ou Nf6 pour
            presser le centre, cherchant à exploiter la tension à leur avantage.
        basis:
          by: chan
          at: 2026-09-29
