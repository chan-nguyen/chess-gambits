# Italian Game: Scotch Gambit, Walbrodt-Baird Gambit. Defining line 1.e4 e5 2.Nf3 Nc6 3.Bc4
# Bc5 4.c3 Nf6 5.d4 exd4 6.O-O, which ends on White's own ply, so the root is an opponent
# node (docs/CONTEXT.md, invariant 5).
# Part of batch p of round 3 (#172). Every ply below was replayed with chess.js before it
