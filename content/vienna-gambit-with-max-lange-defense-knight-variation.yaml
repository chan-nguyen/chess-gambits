# Vienna Gambit, with Max Lange Defense: Knight Variation. Frozen defining line 1.e4 e5
# 2.Nc3 Nc6 3.f4 exf4 4.Nf3, which ends on White's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). The line below was replayed with chess.js before being
# annotated.
id: vienna-gambit-with-max-lange-defense-knight-variation
name: 'Vienna Gambit, with Max Lange Defense: Knight Variation'
eco: C25
category: gambit
side: white
definingLine: [e4, e5, Nc3, Nc6, f4, exf4, Nf3]
soundness:
  value: sound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. Black holds an extra pawn, but it is a doubled pawn on the f-file with no
      pawn of its own left to defend it, while White gets full, free development and a firm
      pawn on e4. 4...d5 challenges that pawn at once but does not solve Black's structural
      problem. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Sau 3...exf4, Trắng chơi 4.Nf3 để giữ ô h4 khỏi bị hậu Đen chiếu và chuẩn bị đưa quân ra tiếp. Thay vì cố giữ tốt thừa bằng ...g5, Đen chọn cách trực diện hơn là đánh ngay vào trung tâm bằng 4...d5.
    en: After 3...exf4, White plays 4.Nf3, covering h4 against a check from Black's queen and preparing to continue developing. Rather than trying to hold the extra pawn with ...g5, Black chooses the more direct 4...d5, striking straight at the centre.
    fr: Après 3...exf4, les Blancs jouent 4.Nf3, couvrant h4 contre un échec de la dame noire et se préparant à poursuivre leur développement. Plutôt que d'essayer de garder le pion supplémentaire par ...g5, les Noirs choisissent la voie plus directe de 4...d5, frappant droit au centre.
  dismissRest:
    reason:
      vi: Đen không chơi 4...d5. Nước ...g5 giữ chắc tốt thừa nhưng dẫn vào một nhánh sắc bén và tách biệt khác, còn các nước chậm hơn như ...d6 hay ...Bc5 đơn giản nhường cho Trắng toàn quyền hoàn tất phát triển mà chưa phải giải quyết gì ở trung tâm.
      en: Black does not play 4...d5. Holding the pawn with ...g5 leads into its own separate, sharper branch, while quieter tries such as ...d6 or ...Bc5 simply let White finish developing without yet having to settle anything in the centre.
      fr: Les Noirs ne jouent pas 4...d5. Garder le pion par ...g5 mène à une autre branche, séparée et plus tranchante, tandis que des essais plus tranquilles comme ...d6 ou ...Bc5 laissent simplement les Blancs achever leur développement sans avoir encore à régler quoi que ce soit au centre.
  children:
    - ply: d5
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen đánh thẳng vào trung tâm, tấn công tốt e4 và mở đường chéo cho tượng c8, thử thách trung tâm của Trắng ngay lập tức thay vì cố ôm giữ tốt thừa.
        en: Black strikes the centre at once, attacking the e4 pawn and opening the diagonal for the c8 bishop, testing White's centre immediately rather than clinging to the extra pawn.
        fr: Les Noirs frappent aussitôt au centre, attaquant le pion e4 et ouvrant la diagonale du fou c8, mettant à l'épreuve le centre blanc tout de suite plutôt que de s'accrocher au pion supplémentaire.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy, tức Đen đang hơn đúng một tốt. Nhưng con tốt ấy đứng chồng lên tốt f7 của chính Đen trên cùng cột f, một tốt chồng không thể gỡ dễ dàng, trong khi tốt e4 của Trắng vừa bị tấn công lại được chính mã c3 đỡ vững, chưa hề lung lay.
          en: Count the pawns and it is eight for Black, seven for White — Black is a clean pawn up. But that pawn is doubled with Black's own f7 pawn on the same file, a defect that is not easy to untangle, while White's e4 pawn, just attacked, is calmly held by the c3 knight and is not actually under any real pressure.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs — les Noirs ont un pion de plus. Mais ce pion est doublé avec le propre pion f7 des Noirs sur la même colonne, un défaut qui ne se répare pas facilement, tandis que le pion e4 blanc, tout juste attaqué, est tranquillement tenu par le cavalier c3 et ne subit en réalité aucune pression réelle.
        plan:
          vi: Trắng chơi exd5 rồi tiếp tục phát triển bằng Bc4 hay Bb5 và nhập thành, tính chuyện dùng g3 để vây bắt con tốt f4 chồng của Đen về sau. Đen ăn lại ở d5, đưa Nf6 và Bd6 hay Be7 ra, nhập thành nhanh, cố gắng để cặp tượng và các đường mở bù lại giá trị của con tốt chồng ấy.
          en: White plays exd5, then continues developing with Bc4 or Bb5 and castles, planning a later g3 to round up Black's doubled f4 pawn. Black recaptures on d5, brings out Nf6 and Bd6 or Be7, castles quickly, and tries to make the bishop pair and the open lines count for more than that doubled pawn is worth.
          fr: Les Blancs jouent exd5, puis poursuivent leur développement par Bc4 ou Bb5 et roquent, prévoyant un futur g3 pour encercler le pion f4 doublé des Noirs. Les Noirs reprennent en d5, sortent Nf6 et Bd6 ou Be7, roquent rapidement, et essaient de faire valoir la paire de fous et les lignes ouvertes pour compenser ce pion doublé.
        basis:
          by: chan
          at: '2026-09-25'
