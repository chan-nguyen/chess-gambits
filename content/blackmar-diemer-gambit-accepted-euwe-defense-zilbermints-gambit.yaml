tree:
  annotation:
    vi: Trắng đã nhập thành ngắn và vừa chơi 9.Kh1 sau khi mã Đen ăn ở d4. Trắng có năm tốt, Đen có bảy. Mã d4 bị mã f3 tấn công và được hậu d8 bảo vệ; vua Đen vẫn ở e8.
    en: White has castled short and has just played 9.Kh1 after Black's knight took on d4. White has five pawns to Black's seven. The knight on d4 is attacked by the knight on f3 and defended by the queen on d8; Black's king is still on e8.
    fr: Les Blancs ont roqué et viennent de jouer 9.Kh1 après la prise du cavalier noir en d4. Les Blancs ont cinq pions contre sept aux Noirs. Le cavalier d4 est attaqué par le cavalier f3 et défendu par la dame d8 ; le roi noir est encore en e8.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 9...O-O. Bài này chỉ đi theo nhánh nhập thành 9...O-O; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 9...O-O here. This entry follows the castling reply 9...O-O only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 9...O-O. Cette fiche ne suit que la réponse 9...O-O, le roque ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: O-O
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen nhập thành bằng 9...O-O, đưa vua lên g8 và xe ra f8; mã d4 vẫn được hậu bảo vệ.
        en: Black castles with 9...O-O, putting the king on g8 and the rook on f8; the knight on d4 is still defended by the queen.
        fr: Les Noirs roquent par 9...O-O, plaçant le roi en g8 et la tour en f8 ; le cavalier d4 reste défendu par la dame.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng năm, Đen bảy, nên Trắng kém hai tốt, và Trắng không còn tốt nào ở các cột d, e, f. Mã d4 của Đen bị mã f3 tấn công một lần và được hậu d8 bảo vệ một lần. Cả hai vua đã nhập thành.'
          en: "Count the pawns: White five, Black seven, so White is two pawns down, and White has no pawn left on the d-, e- or f-file. Black's knight on d4 is attacked once, by the knight on f3, and defended once, by the queen on d8. Both kings have castled."
          fr: "Comptez les pions : cinq pour les Blancs, sept pour les Noirs ; les Blancs sont donc deux pions en moins, et n'ont plus aucun pion sur les colonnes d, e et f. Le cavalier d4 noir est attaqué une fois, par le cavalier f3, et défendu une fois, par la dame d8. Les deux rois ont roqué."
        plan:
          vi: Trắng có thể đổi con mã đã tiến lên bằng Nxd4 hoặc đưa xe vào cột e bằng Re1. Đen bảo vệ mã bằng ...c5 và hoàn tất phát triển bằng ...Bd7.
          en: White can trade off the advanced knight with Nxd4 or bring a rook to the e-file with Re1. Black supports the knight with ...c5 and completes development with ...Bd7.
          fr: Les Blancs peuvent échanger le cavalier avancé par Nxd4 ou amener une tour sur la colonne e par Re1. Les Noirs soutiennent le cavalier par ...c5 et achèvent leur développement par ...Bd7.
