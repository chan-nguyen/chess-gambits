# Nimzo-Larsen Attack: Norfolk Gambit. Frozen defining line 1.Nf3 d5 2.b3 c5 3.e4, which
# ends on White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
# The line below was replayed with chess.js before being annotated.
id: nimzo-larsen-attack-norfolk-gambit
name: 'Nimzo-Larsen Attack: Norfolk Gambit'
eco: A06
category: gambit
side: white
definingLine: [Nf3, d5, b3, c5, e4]
soundness:
  value: dubious
  reviewedAt: '2026-09-18'
  basis:
