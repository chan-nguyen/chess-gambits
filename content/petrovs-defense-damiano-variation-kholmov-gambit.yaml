# Petrov's Defense: Damiano Variation, Kholmov Gambit. Frozen defining line 1.e4 e5 2.Nf3 Nf6
# 3.Nxe5 Nxe4 4.Qe2 Qe7 ends on Black's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Part of batch t of round 4 (#182). Every ply below was
# replayed with chess.js before it was annotated; searchMate at 3 moves from the leaf returns
# no-mate, so no forced mate is claimed anywhere in this entry, and no capture is left going
# free at the leaf.
id: 'petrovs-defense-damiano-variation-kholmov-gambit'
name: "Petrov's Defense: Damiano Variation, Kholmov Gambit"
eco: 'C42'
category: 'gambit'
side: 'black'
definingLine:
  - 'e4'
  - 'e5'
  - 'Nf3'
  - 'Nf6'
  - 'Nxe5'
  - 'Nxe4'
  - 'Qe2'
  - 'Qe7'
soundness:
  value: 'unsound'
  reviewedAt: '2026-10-01'
  basis:
    by: 'chan'
    at: '2026-10-01'
    source: "A judgement. At the end of the defining line the pawns are level, seven each, and each side has a knight attacked by the opposing queen with nothing defending it. It is White's move, so White can take the knight on e4 first, and Black's queen then has nothing safe to take on e5 because the queen on e4 defends that knight; the line is judged unsound. No engine was consulted and no database was queried."
judgement:
  by: 'chan'
  at: '2026-10-01'
  source: "Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement on one date, not engine output and not database statistics."
tree:
  annotation:
    vi: 'Đen vừa chơi 4...Qe7, đặt hậu lên cột e đối diện hậu Trắng. Mã e5 của Trắng bị hậu tấn công và không có gì bảo vệ, và mã e4 của Đen bị hậu Trắng tấn công và cũng không có gì bảo vệ. Số tốt hai bên bằng nhau, mỗi bên bảy.'
    en: "Black has just played 4...Qe7, putting the queen on the e-file against White's queen. White's knight on e5 is attacked by the queen and nothing defends it, and Black's knight on e4 is attacked by White's queen and nothing defends it either. The pawns are level, seven each."
    fr: 'Les Noirs viennent de jouer 4...Qe7, plaçant la dame sur la colonne e face à la dame blanche. Le cavalier e5 des Blancs est attaqué par la dame et rien ne le défend, et le cavalier e4 des Noirs est attaqué par la dame blanche et rien ne le défend non plus. Les pions sont à égalité, sept de chaque côté.'
  dismissRest:
    reason:
      vi: 'Trắng chơi nước khác 5.Qxe4 ở đây, chẳng hạn 5.Nf3, lùi mã về. Mục này đi theo nước ăn mã e4.'
      en: 'White plays something other than 5.Qxe4 here, for instance 5.Nf3, retreating the knight. This entry follows the capture of the knight on e4.'
      fr: 'Les Blancs jouent autre chose que 5.Qxe4 ici, par exemple 5.Nf3, en retirant le cavalier. Cette entrée suit la capture du cavalier e4.'
  children:
    - ply: 'Qxe4'
      replyQuality: 'best'
      frequency: 'common'
      annotation:
        vi: 'Trắng ăn mã e4 bằng hậu. Hậu giờ bảo vệ mã e5, nên hậu Đen không có gì ăn được một cách an toàn, và Trắng hơn một mã.'
        en: "White takes the knight on e4 with the queen. The queen now defends the knight on e5, so Black's queen has nothing safe to take, and White is a knight up."
        fr: "Les Blancs prennent le cavalier e4 avec la dame. La dame défend maintenant le cavalier e5, donc la dame noire n'a rien à prendre sans risque, et les Blancs ont un cavalier de plus."
      children:
        - ply: 'd6'
          annotation:
            vi: 'Đen tấn công mã e5 bằng tốt d, giờ cùng với hậu, nên mã bị tấn công hai lần và chỉ được hậu bảo vệ một lần.'
            en: 'Black attacks the knight on e5 with the d-pawn, which now attacks it together with the queen, so the knight is attacked twice and defended once, by the queen.'
            fr: "Les Noirs attaquent le cavalier e5 avec le pion d, qui l'attaque maintenant avec la dame, donc le cavalier est attaqué deux fois et défendu une fois, par la dame."
          outcome:
            type: 'position'
            evaluation:
              vi: 'Đếm quân: Trắng có hai mã so với một mã của Đen, tượng và xe bằng nhau, và số tốt bằng nhau, mỗi bên bảy, nên Trắng hơn một mã. Mã e5 bị tốt d6 và hậu e7 tấn công và chỉ được hậu e4 bảo vệ, nên Trắng phải dời mã, bảo vệ thêm hoặc đổi nó.'
              en: "Count the material: White has two knights to Black's one, the bishops and rooks are level, and the pawns are level at seven each, so White is a knight up. The knight on e5 is attacked by the d6 pawn and the queen on e7 and defended only by the queen on e4, so White has to move it, defend it again or trade it."
              fr: "Comptez le matériel : les Blancs ont deux cavaliers contre un seul aux Noirs, les fous et les tours sont à égalité, et les pions sont à égalité, sept de chaque côté, donc les Blancs ont un cavalier de plus. Le cavalier e5 est attaqué par le pion d6 et la dame e7 et défendu seulement par la dame e4, donc les Blancs doivent le déplacer, le défendre encore ou l'échanger."
            plan:
              vi: 'Trắng chơi d4, bảo vệ mã bằng một tốt; nếu Đen ăn ở e5, Trắng ăn lại bằng tốt d và hơn một tốt. Đen ăn mã bằng ...dxe5 và phát triển bằng ...Nc6.'
              en: 'White plays d4, defending the knight with a pawn; if Black takes on e5, White retakes with the d-pawn and ends a pawn up. Black takes the knight with ...dxe5 and develops with ...Nc6.'
              fr: 'Les Blancs jouent d4, défendant le cavalier avec un pion ; si les Noirs prennent en e5, les Blancs reprennent avec le pion d et finissent avec un pion de plus. Les Noirs prennent le cavalier par ...dxe5 et se développent par ...Nc6.'
            basis:
              by: 'chan'
              at: '2026-10-01'
