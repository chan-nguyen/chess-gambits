# Vienna Gambit, with Max Lange Defense: Hamppe-Allgaier Gambit, Thorold Variation. One
# entry in a batch authored for issue #148 (batch h). Defining line ends on White's 8.d4
# (invariant 5) — the dataset's own shortest line for this name already ends there, on
# White's own ply, so no ply needs to be trimmed out into a modelled reply. The single child
# below is this author's own choice of a natural, thematic continuation rather than a
# further named sub-variation, and it was replayed with chess.js like every other ply. Every
# ply below was replayed with chess.js before being written.
id: hamppe-allgaier-gambit-thorold-variation
name: 'Vienna Gambit, with Max Lange Defense: Hamppe-Allgaier Gambit, Thorold Variation'
eco: C25
category: gambit
side: white
definingLine: [e4, e5, f4, exf4, Nf3, Nc6, Nc3, g5, h4, g4, Ng5, h6, Nxf7, Kxf7, d4]
soundness:
  value: sound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      The same judgement the family head carries for the wider Hamppe-Allgaier complex — the
      knight sacrifice buys real, lasting play against the king that had to walk to f7, and
      objective analysis has never shown it insufficient. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa đẩy tốt lên d4 sau khi đã thí mã ở f7 và lôi vua Đen ra khỏi vị trí ban đầu. Con tốt d4 mở đường cho tượng c1 và chuẩn bị e5 dựng trung tâm lớn.
    en: White has just pushed the pawn to d4, after sacrificing the knight on f7 and dragging Black's king off its original square. The d4 pawn opens a diagonal for the c1 bishop and prepares e5 to build a big centre.
    fr: Les Blancs viennent de pousser le pion en d4, après avoir sacrifié le cavalier en f7 et attiré le roi noir hors de sa case d'origine. Le pion d4 ouvre une diagonale au fou c1 et prépare e5 pour bâtir un grand centre.
  dismissRest:
    reason:
      vi: Đen không chơi 8...d5 — phát triển bằng 8...Nf6 hay chơi 8...Bg7. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black does not play 8...d5 — developing with 8...Nf6, or playing 8...Bg7. Each is outside the scope of this entry.
      fr: Les Noirs ne jouent pas 8...d5 — développant par 8...Cf6, ou jouant 8...Bg7. Chacun sort du cadre de cette entrée.
  children:
    - ply: d5
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Đen đánh thẳng vào trung tâm ngay khi có dịp, tranh chấp lại khoảng không mà Trắng vừa chiếm được bằng d4.
        en: Black strikes back in the centre at the first chance, contesting the space White just grabbed with d4.
        fr: Les Noirs contre-attaquent aussitôt au centre à la première occasion, disputant l'espace que les Blancs viennent de prendre avec d4.
      children:
        - ply: Bxf4
          annotation:
            vi: Trắng ăn lại con tốt f4 đã thí từ nước hai, quân duy nhất còn có thể ăn tại đó vì đường chéo c1-h6 vừa được mở ra.
            en: White wins back the f4 pawn given up back on move two, the only piece that can capture there now that the c1-h6 diagonal has just opened up.
            fr: Les Blancs regagnent le pion f4 cédé au deuxième coup, la seule pièce pouvant capturer là maintenant que la diagonale c1-h6 vient de s'ouvrir.
          outcome:
            type: position
            evaluation:
              vi: Đếm tốt thì Trắng bảy, Đen sáu — Trắng hơn đúng một tốt. Vua Đen vẫn đứng ở f7, mất quyền nhập thành, còn Trắng đã đòi lại đúng con tốt f4 ban đầu và có thêm một con tượng hoạt động trên đường chéo dài.
              en: Count the pawns and it is seven for White, six for Black — White is exactly one pawn up. Black's king still sits on f7, castling rights gone, while White has won back exactly the original f4 pawn and gained an actively placed bishop on the long diagonal.
              fr: Comptez les pions, sept pour les Blancs, six pour les Noirs — les Blancs ont exactement un pion de plus. Le roi noir reste en f7, ayant perdu le droit de roquer, tandis que les Blancs ont regagné exactement le pion f4 initial et gagné un fou actif sur la grande diagonale.
            plan:
              vi: Trắng chơi Qd3 hay O-O-O, dồn quân vào cánh vua Đen còn yếu và tận dụng vua chưa an toàn. Đen chơi Kg8 hay Nf6, tìm chỗ trú cho vua và cố hoàn thiện phát triển trước khi Trắng kịp mở thêm đường tấn công.
              en: White plays Qd3 or O-O-O, massing pieces against Black's weakened kingside and using the unsafe king. Black plays Kg8 or Nf6, looking for shelter for the king and trying to finish developing before White can open further lines of attack.
              fr: Les Blancs jouent Qd3 ou O-O-O, massant les pièces contre l'aile roi noire affaiblie et exploitant l'insécurité du roi. Les Noirs jouent Kg8 ou Nf6, cherchant un abri pour le roi et essayant d'achever leur développement avant que les Blancs n'ouvrent encore plus de lignes d'attaque.
            basis:
              by: chan
              at: '2026-09-25'
