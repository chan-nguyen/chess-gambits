tree:
  annotation:
    vi: 'Trắng vừa chơi 3.g4 sau 2.Bf4 e6, hiến một tốt: tốt g4 không có quân bảo vệ và bị tốt f5 tấn công, còn tốt f5 được tốt e6 bảo vệ. Tượng f4 nhắm vào tốt c7, được hậu d8 bảo vệ.'
    en: 'White has just played 3.g4 after 2.Bf4 e6, offering a pawn: the g4 pawn has no defender and is attacked by the f5 pawn, which the e6 pawn defends. The bishop on f4 aims at the pawn on c7, which the queen on d8 defends.'
    fr: "Les Blancs viennent de jouer 3.g4 après 2.Bf4 e6, offrant un pion : le pion g4 n'a aucun défenseur et est attaqué par le pion f5, que le pion e6 défend. Le fou f4 vise le pion c7, que la dame d8 défend."
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 3...fxg4. Bài này chỉ đi theo nhánh ăn tốt 3...fxg4; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 3...fxg4 here. This entry follows the capture 3...fxg4 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 3...fxg4. Cette fiche ne suit que la prise 3...fxg4 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: fxg4
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen ăn tốt bằng 3...fxg4. Tốt g4 mới không có quân bảo vệ, nhưng cũng không bị quân Trắng nào tấn công.
        en: Black takes the pawn with 3...fxg4. The new pawn on g4 has no defender, but no White piece attacks it either.
        fr: Les Noirs prennent le pion par 3...fxg4. Le nouveau pion g4 n'a aucun défenseur, mais aucune pièce blanche ne l'attaque non plus.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt, và Đen có hai tốt trên cột g, ở g7 và g4. Trắng không còn tốt g nên cột g nửa mở cho quân Trắng. Tượng f4 nhắm vào tốt c7, được hậu d8 bảo vệ, và Trắng mới phát triển một tượng.'
          en: "Count the pawns: White seven, Black eight, so White is a pawn down, and Black has two pawns on the g-file, on g7 and g4. White has no g-pawn, so the g-file is half open for White's pieces. The bishop on f4 aims at the pawn on c7, which the queen on d8 defends, and White has developed only that bishop."
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins, et les Noirs ont deux pions sur la colonne g, en g7 et en g4. Les Blancs n'ont plus de pion g, si bien que la colonne g est semi-ouverte pour leurs pièces. Le fou f4 vise le pion c7, que la dame d8 défend, et les Blancs n'ont développé que ce fou."
        plan:
          vi: Trắng phát triển bằng Nc3 và Qd2 hoặc tấn công g4 bằng h3; Đen bảo vệ g4 bằng ...Nf6 và hoàn tất phát triển, giữ tốt thừa.
          en: White develops with Nc3 and Qd2 or attacks g4 with h3; Black defends g4 with ...Nf6 and completes development, keeping the extra pawn.
          fr: Les Blancs se développent par Nc3 et Qd2 ou attaquent g4 par h3 ; les Noirs défendent g4 par ...Nf6 et achèvent leur développement, en gardant le pion en plus.
        basis:
          by: chan
          at: '2026-09-30'
