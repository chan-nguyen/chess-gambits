# Benko Gambit, taught. The learner plays Black, and the defining line ends on Black's
# 3...b5 — the learner's own ply — so the root is an opponent node (invariant 5).
#
# The named declined lines the root catch-all answers rather than models: the Bishop Attack
# (4.Bg5), the Pseudo-Sämisch (4.f3), the Quiet Line (4.Nd2) and the Mutkin Countergambit
# (4.g4). They are real openings and deferred deliberately; depth accrues one content pull
# request at a time. Every line below was replayed with chess.js before it was annotated.
id: benko-gambit
name: Benko Gambit
eco: A57
category: gambit
side: black
definingLine: [d4, Nf6, c4, c5, d5, b5]
soundness:
  value: sound
  reviewedAt: '2026-09-16'
  basis:
    by: chan
    at: '2026-09-16'
    source: >-
      A judgement, not a measurement. The pawn buys structural pressure that survives every
      exchange, which is why Black is content to reach an endgame a pawn down — an unusual
      claim for a gambit, and the reason this one is played at every level. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-16'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date. Only positions and move legality are machine-checked.
tree:
  annotation:
    vi: Đen thí tốt b để lấy hai cột nửa mở a và b, không phải để lấy nhịp và cũng không phải để tấn công. Đây là một nước thí mang tính thế trận và lâu dài. Áp lực lên a2 và b2 không tan đi khi đổi quân, nên Đen sẵn lòng đi vào tàn cuộc dù kém một tốt.
    en: Black offers the b-pawn for the half-open a- and b-files, not for time and not for an attack. This is a long-term positional sacrifice. The pressure on a2 and b2 does not evaporate when pieces come off, so Black is happy to head for an endgame a pawn down.
    fr: Les Noirs offrent le pion b pour les colonnes a et b semi-ouvertes, ni pour le temps ni pour une attaque. C'est un sacrifice positionnel de longue haleine. La pression sur a2 et b2 ne s'évapore pas aux échanges, si bien que les Noirs vont volontiers en finale avec un pion de moins.
  dismissRest:
    reason:
      vi: Trắng chưa ăn tốt và cũng chưa tìm được cách làm Đen phải hối hận vì đã đem nó ra. Câu trả lời của Đen không đổi. Hoàn thành fianchetto bằng ...g6 và ...Bg7, chơi ...d6 rồi ...O-O, đỡ tốt b5 bằng ...a6, ...Bd7 hay ...Qb6 khi nó bị đánh, ăn bất cứ quân nào Trắng bỏ hớ, và ăn ở c4 khi điều đó có lợi vì nó lấy đi con tốt đứng sau d5 và mở cột b cho xe. Đến lúc Trắng ăn ở b5 thì ...a6 đưa ván cờ trở lại đúng gambit.
      en: White has neither taken the pawn nor found a way to make Black regret offering it. Black's answer does not change. Finish the fianchetto with ...g6 and ...Bg7, play ...d6 and ...O-O, hold b5 with ...a6, ...Bd7 or ...Qb6 when it is attacked, take anything White leaves hanging, and take on c4 when that suits, because it removes the pawn standing behind d5 and opens the b-file for the rooks. Whenever White does take on b5, ...a6 brings the game straight back to the gambit.
      fr: Les Blancs n'ont ni pris le pion ni trouvé comment faire regretter aux Noirs de l'avoir offert. La réponse noire ne change pas. Achever le fianchetto par ...g6 et ...Bg7, jouer ...d6 et ...O-O, tenir b5 par ...a6, ...Bd7 ou ...Qb6 quand il est attaqué, prendre tout ce que les Blancs laissent en prise, et prendre en c4 quand cela convient, car cela supprime le pion placé derrière d5 et ouvre la colonne b aux tours. Dès que les Blancs prennent en b5, ...a6 ramène la partie au gambit.
  children:
    - ply: cxb5
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng nhận tốt. Đây là nhánh chính và là lý do gambit này tồn tại.
        en: White accepts. This is the main branch and the reason the gambit exists.
        fr: Les Blancs acceptent. C'est la ligne principale et la raison d'être du gambit.
      children:
        - ply: a6
          annotation:
            vi: Nước thứ hai của đòn thí, và là nước quan trọng hơn. Đen mời Trắng ăn thêm lần nữa để mở nốt cột a. Nếu Trắng ăn thì hai cột a và b đều mở cho xe Đen; nếu Trắng không ăn thì Đen lấy lại tốt bằng ...axb5.
            en: The second half of the sacrifice, and the more important half. Black invites a second capture in order to open the a-file as well. If White takes, both the a- and b-files open for Black's rooks. If White does not, Black simply recovers the pawn with ...axb5.
            fr: La seconde moitié du sacrifice, et la plus importante. Les Noirs invitent une seconde prise afin d'ouvrir aussi la colonne a. Si les Blancs prennent, les colonnes a et b s'ouvrent pour les tours noires. Sinon, les Noirs reprennent simplement le pion par ...axb5.
          dismissRest:
            reason:
              vi: Trắng để nguyên tốt b5 và chơi chỗ khác. Đen ăn lại ...axb5 khi con tốt ấy không được ai đỡ, còn nếu Trắng kịp đỡ nó thì Đen cứ ...g6, ...Bg7, ...d6 và ...O-O. Không giải quyết b5 chính là điều cho Đen cả hai cột lẫn con tốt.
              en: White leaves the pawn on b5 and plays elsewhere. Black takes back with ...axb5 whenever that pawn is not defended, and where White does manage to hold it, Black simply continues with ...g6, ...Bg7, ...d6 and ...O-O. Refusing to resolve b5 is what gives Black both the files and the pawn.
              fr: Les Blancs laissent le pion en b5 et jouent ailleurs. Les Noirs reprennent par ...axb5 chaque fois que ce pion n'est pas défendu, et si les Blancs parviennent à le tenir, les Noirs continuent simplement par ...g6, ...Bg7, ...d6 et ...O-O. Refuser de trancher le sort de b5 est ce qui donne aux Noirs à la fois les colonnes et le pion.
          children:
            - ply: bxa6
              replyQuality: good
              frequency: common
              annotation:
                vi: Trắng ăn nốt. Đây là nhánh nhận hoàn toàn, và là thế cờ mà mọi ván Benko đều nhắm tới.
                en: White takes the second pawn too. This is the fully accepted branch, and the position every Benko game is aiming at.
                fr: Les Blancs prennent aussi le second pion. C'est la branche pleinement acceptée, et la position que toute partie Benko vise.
              children:
                - ply: Bxa6
                  annotation:
                    vi: Tượng ăn lại và đi thẳng ra a6, nơi nó nhìn vào tượng f1 của Trắng. Trắng sẽ phải đổi con tượng ấy hoặc chịu mất quyền nhập thành để giữ nó.
                    en: The bishop recaptures and lands on a6, where it stares at White's bishop on f1. White will either trade that bishop off or give up castling to keep it.
                    fr: Le fou reprend et se pose en a6, où il fixe le fou blanc en f1. Les Blancs devront soit échanger ce fou, soit renoncer au roque pour le garder.
                  dismissRest:
                    reason:
                      vi: Trắng không chơi Nc3. Câu hỏi về con tượng f1 vẫn treo đó và Đen không cần đổi cách chơi. Đen vẫn ...g6, ...Bg7, ...d6 và ...O-O, rồi ...Nbd7, ...Qa5 hoặc ...Qb6 và chồng xe ở cột a và b. Nước 6.d6 trả lại tốt để bịt đường chéo dài thì ...exd6 là xong, Đen hết kém tốt mà hai cột vẫn mở nguyên. Nước 6.Qa4 đưa hậu lên cột a nhắm con tượng a6, nhưng xe a8 đã đỡ sẵn con tượng ấy, và Đen có ...Qa5+ đề nghị đổi hậu kèm chiếu. Nước 6.e4 mà chưa Nc3 thì ...Bxf1 vẫn ăn tượng và vua Trắng vẫn phải đi bộ.
                      en: White does not play Nc3. The question about the f1 bishop is still hanging and Black has no reason to change anything. Black plays ...g6, ...Bg7, ...d6 and ...O-O, then ...Nbd7, ...Qa5 or ...Qb6, and doubles rooks on the a- and b-files. 6.d6, giving the pawn back to block the long diagonal, is answered by ...exd6 — Black is no longer a pawn down and both files are still open. 6.Qa4 puts the queen on the a-file against the bishop on a6, but the rook on a8 already defends it, and ...Qa5+ offers a queen trade with check. 6.e4 without Nc3 first still runs into ...Bxf1, and the white king still walks.
                      fr: Les Blancs ne jouent pas Nc3. La question du fou f1 reste posée et les Noirs n'ont aucune raison de changer quoi que ce soit. Ils jouent ...g6, ...Bg7, ...d6 et ...O-O, puis ...Nbd7, ...Qa5 ou ...Qb6, et doublent les tours sur les colonnes a et b. 6.d6, qui rend le pion pour boucher la grande diagonale, se traite par ...exd6 — les Noirs ne sont plus en retard d'un pion et les deux colonnes restent ouvertes. 6.Qa4 place la dame sur la colonne a face au fou a6, mais la tour a8 le défend déjà, et ...Qa5+ propose l'échange des dames avec échec. 6.e4 sans Nc3 permet toujours ...Bxf1, et le roi blanc marche quand même.
                  children:
                    - ply: Nc3
                      replyQuality: best
                      frequency: common
                      annotation:
                        vi: Trắng phát triển và chuẩn bị e4. Mã c3 giữ e4 trước khi con tốt ấy đi lên, và nó cũng canh hai ô b5 và d5. Đây là cách xếp quân chuẩn của Trắng trong nhánh nhận hoàn toàn.
                        en: White develops and prepares e4. The knight guards e4 before the pawn goes there, and it covers b5 and d5 as well. This is White's standard set-up in the fully accepted line.
                        fr: Les Blancs développent et préparent e4. Le cavalier garde e4 avant que le pion n'y aille, et il couvre aussi b5 et d5. C'est le dispositif blanc habituel dans la ligne pleinement acceptée.
                      children:
                        - ply: d6
                          annotation:
                            vi: Đen đóng cột d lại và chống nước d5-d6. Con tốt d6 đỡ c5, giữ ô e5 và để tượng a6 tiếp tục nhìn f1. Đen chưa vội ...g6 vì việc cần làm trước là buộc Trắng trả lời câu hỏi về con tượng.
                            en: Black shuts the d-file and stops d5-d6. The pawn on d6 props up c5, holds e5 and leaves the a6 bishop looking at f1. ...g6 can wait, because the first job is to make White answer the question about the bishop.
                            fr: Les Noirs ferment la colonne d et empêchent d5-d6. Le pion d6 étaie c5, tient e5 et laisse le fou a6 braqué sur f1. ...g6 peut attendre, car la première tâche est d'obliger les Blancs à répondre à la question du fou.
                          dismissRest:
                            reason:
                              vi: Trắng tránh e4 và do đó tránh luôn câu hỏi về con tượng f1. Đó là một lựa chọn thật, và cái giá là Trắng không có được trung tâm rộng. Đen cứ ...g6, ...Bg7, ...Nbd7, ...O-O rồi ...Qa5 hoặc ...Qb6, ...Rfb8 và ...Ra7-b7. Nước 7.Qa4+ chỉ có năm nước đáp và ...Qd7 hay ...Nbd7 là đủ, hậu Trắng sẽ phải rời cột a. Nước 7.Nf3 hoặc 7.g3 rồi Bg2 là cách chơi vững nhất của Trắng, giữ được quyền nhập thành, và đổi lại tượng a6 sống yên trên đường chéo của nó.
                              en: White sidesteps e4 and with it the question about the f1 bishop. That is a real choice and it has a price, which is that White does not get the big centre. Black carries on with ...g6, ...Bg7, ...Nbd7, ...O-O, then ...Qa5 or ...Qb6, ...Rfb8 and ...Ra7-b7. 7.Qa4+ has only five answers and ...Qd7 or ...Nbd7 is enough — the queen has to leave the a-file again. 7.Nf3 or 7.g3 followed by Bg2 is White's soundest handling, keeps the right to castle, and in exchange lets the a6 bishop live quietly on its diagonal.
                              fr: Les Blancs esquivent e4 et, avec lui, la question du fou f1. C'est un vrai choix, et il a un prix, celui de ne pas obtenir le grand centre. Les Noirs poursuivent par ...g6, ...Bg7, ...Nbd7, ...O-O, puis ...Qa5 ou ...Qb6, ...Rfb8 et ...Ra7-b7. 7.Qa4+ n'a que cinq réponses et ...Qd7 ou ...Nbd7 suffit — la dame devra de nouveau quitter la colonne a. 7.Nf3 ou 7.g3 suivi de Bg2 est le traitement le plus sain, conserve le droit de roquer et, en échange, laisse le fou a6 vivre tranquillement sur sa diagonale.
                          children:
                            - ply: e4
                              replyQuality: best
                              frequency: common
                              annotation:
                                vi: Trắng chiếm trung tâm và chấp nhận điều đi kèm. Hai con tốt d5 và e4 cho Trắng khoảng không, nhưng con tượng f1 bây giờ không còn ô nào an toàn để đi ra mà không bị đổi.
                                en: White takes the centre and accepts what comes with it. The pawns on d5 and e4 give White space, but the bishop on f1 now has no safe way out that does not end in a trade.
                                fr: Les Blancs prennent le centre et acceptent ce qui va avec. Les pions d5 et e4 leur donnent de l'espace, mais le fou f1 n'a plus de sortie sûre qui ne finisse pas par un échange.
                              children:
                                - ply: Bxf1
                                  annotation:
                                    vi: Đen đổi ngay, và đây là thời điểm duy nhất đúng. Trắng chỉ có một cách ăn lại là bằng vua, vì xe h1 bị mã g1 chắn. Đen đổi con tượng lấy quyền nhập thành của Trắng.
                                    en: Black trades at once, and this is the only right moment. White has exactly one way to take back — with the king, because the rook on h1 is shut in by the knight on g1. Black gives a bishop for White's right to castle.
                                    fr: Les Noirs échangent immédiatement, et c'est le seul bon moment. Les Blancs n'ont qu'une façon de reprendre, avec le roi, car la tour h1 est enfermée par le cavalier g1. Les Noirs donnent un fou contre le droit de roquer des Blancs.
                                  counts:
                                    legal: { count: legalReplies, expect: 36 }
                                  dismissRest:
                                    reason:
                                      vi: Trắng có {legal} nước đáp hợp lệ ở đây và chỉ một nước là nước cờ. Xe h1 không tới được f1 vì mã g1 chắn đường, nên mọi nước khác Kxf1 đều để Đen ăn không cả một con tượng, tức là Đen từ kém một tốt thành hơn hẳn một quân nhẹ. Không có nước nào trong nhóm này đáng gọi là phương án.
                                      en: White has {legal} legal answers here and only one of them is a move. The rook on h1 cannot reach f1 with the knight on g1 in the way, so everything except Kxf1 hands Black a whole bishop for nothing — one pawn down becomes a clear piece up. Nothing in this group is an alternative.
                                      fr: Les Blancs disposent de {legal} réponses légales et une seule est un coup. La tour h1 ne peut atteindre f1, le cavalier g1 barrant la route, si bien que tout sauf Kxf1 offre un fou entier aux Noirs — un pion de retard devient une pièce nette d'avance. Rien dans ce groupe n'est une option.
                                  children:
                                    - ply: Kxf1
                                      replyQuality: best
                                      frequency: common
                                      annotation:
                                        vi: Vua ăn lại và đứng ở f1. Trắng vẫn hơn một tốt, nhưng từ giờ vua phải tự đi bộ về chỗ an toàn và xe h1 phải chờ đến lúc đó mới ra được. Đây là thế cờ mà Đen nhắm tới từ nước thí đầu tiên.
                                        en: The king recaptures and sits on f1. White is still a pawn up, but from here the king has to walk to safety by hand and the h1 rook waits until it gets there. This is the position Black has been aiming at since the first sacrifice.
                                        fr: Le roi reprend et se tient en f1. Les Blancs ont toujours un pion de plus, mais le roi doit désormais marcher à pied vers un abri et la tour h1 attend qu'il y soit arrivé. C'est la position que les Noirs visent depuis le premier sacrifice.
                                      outcome:
                                        type: position
                                        evaluation:
                                          vi: Đếm tốt thì Trắng bảy, Đen sáu, đúng một tốt như lúc thí. Đổi lại, trên bàn cờ có ba thứ nhìn thấy được. Thứ nhất, Đen không còn tốt nào ở cột a và cột b, nên cả hai cột ấy là của xe Đen và chúng chĩa thẳng vào a2 và b2, hai con tốt Trắng đang đứng đó không ai đỡ ngoài quân. Thứ hai, vua Trắng ở f1 đã mất quyền nhập thành vĩnh viễn và phải mất hai nhịp g3 rồi Kg2 mới yên, trong lúc đó xe h1 không tham gia gì. Thứ ba, cấu trúc tốt Đen không có một điểm yếu nào, không tốt chồng, không tốt cô, nên áp lực ở hai cột kia không tan đi khi đổi quân. Tượng ô trắng đã đổi hết, mỗi bên còn một tượng ô đen.
                                          en: Count the pawns and it is seven to six, exactly the one Black gave up. In return there are three things on the board. First, Black has no pawn left on the a- or b-file, so both files belong to Black's rooks and both point at a2 and b2, which nothing but pieces can defend. Second, White's king on f1 has permanently lost the right to castle and needs two tempi, g3 and Kg2, to be safe, and the h1 rook does nothing until it gets there. Third, Black's pawn structure has no weakness in it at all — nothing doubled, nothing isolated — so the pressure on those two files survives every exchange. The light-squared bishops are gone; each side has one dark-squared bishop left.
                                          fr: Comptez les pions, sept contre six, exactement celui que les Noirs ont donné. En échange, trois choses sont visibles sur l'échiquier. D'abord, les Noirs n'ont plus de pion sur les colonnes a et b, si bien que les deux colonnes appartiennent à leurs tours et visent a2 et b2, que seules des pièces peuvent défendre. Ensuite, le roi blanc en f1 a définitivement perdu le droit de roquer et lui faut deux temps, g3 puis Kg2, pour être à l'abri, pendant lesquels la tour h1 ne sert à rien. Enfin, la structure de pions noire n'a pas la moindre faiblesse — rien de doublé, rien d'isolé — si bien que la pression sur ces deux colonnes survit à tous les échanges. Les fous de cases blanches ont disparu ; chaque camp garde un fou de cases noires.
                                        plan:
                                          vi: Đen chơi ...g6 và ...Bg7 để tượng ăn suốt đường chéo dài đến b2, rồi ...Nbd7, ...O-O, sau đó ...Qa5 hoặc ...Qb6, ...Rfb8 và ...Ra7-b7 chồng xe ở cột b. Ba quân nhắm vào b2 là con số cần đạt. Nước phá là ...c4 mở đường cho tượng g7 và cho mã vào ô c5, hoặc ...e6 đánh vào d5 khi Trắng đã phải dồn quân giữ cánh hậu. Đen không cần lấy lại tốt và cũng không nên cố. Trắng phải chơi g3 rồi Kg2 ngay, nối hai xe, giữ b2 bằng Ra3, Rb1 hoặc Qc2, rồi đổi càng nhiều quân nặng càng tốt và đẩy e5 hoặc f4 để giành lại thế chủ động ở cánh kia. Nếu Trắng đổi hết xe mà giữ được tốt thì tàn cuộc là của Trắng.
                                          en: Black plays ...g6 and ...Bg7 so the bishop rakes the long diagonal all the way to b2, then ...Nbd7 and ...O-O, and afterwards ...Qa5 or ...Qb6, ...Rfb8 and ...Ra7-b7 to double on the b-file. Three attackers on b2 is the number to reach. The breaks are ...c4, which clears the diagonal for the g7 bishop and gives a knight the c5 square, and ...e6 against d5 once White has tied pieces to the queenside. Black neither needs the pawn back nor should try for it. White must play g3 and Kg2 straight away to connect the rooks, hold b2 with Ra3, Rb1 or Qc2, then trade as many heavy pieces as possible and push e5 or f4 for counterplay on the other wing. If White gets the rooks off while keeping the pawn, the endgame belongs to White.
                                          fr: Les Noirs jouent ...g6 et ...Bg7 pour que le fou balaie la grande diagonale jusqu'en b2, puis ...Nbd7 et ...O-O, avant ...Qa5 ou ...Qb6, ...Rfb8 et ...Ra7-b7 pour doubler sur la colonne b. Trois attaquants sur b2 est le chiffre à atteindre. Les ruptures sont ...c4, qui dégage la diagonale du fou g7 et offre la case c5 à un cavalier, et ...e6 contre d5 une fois les pièces blanches liées à l'aile dame. Les Noirs n'ont pas besoin de reprendre le pion et ne doivent pas le chercher. Les Blancs doivent jouer g3 et Kg2 sans tarder pour relier les tours, tenir b2 par Ra3, Rb1 ou Qc2, puis échanger le plus de pièces lourdes possible et pousser e5 ou f4 pour du contre-jeu sur l'autre aile. Si les Blancs échangent les tours en gardant le pion, la finale leur appartient.
                                        basis:
                                          by: chan
                                          at: '2026-09-17'
            - ply: b6
              replyQuality: good
              frequency: occasional
              annotation:
                vi: Trắng trả lại tốt ngay lập tức thay vì ăn. Ý đồ rất rõ ràng. Không ăn ở a6 thì cột a không mở, và cả gambit mất đi một nửa lý do tồn tại.
                en: White gives the pawn straight back instead of taking. The idea is blunt and it works. Without a capture on a6 the a-file never opens, and the gambit loses half its point.
                fr: Les Blancs rendent le pion aussitôt au lieu de prendre. L'idée est brutale et efficace. Sans prise en a6, la colonne a ne s'ouvre jamais et le gambit perd la moitié de sa raison d'être.
              children:
                - ply: Qxb6
                  annotation:
                    vi: Hậu ăn tốt b6 và không để tốt a6 bị chồng. Đen lấy lại tốt, và con hậu đứng ở b6 nhòm thẳng vào b2 dọc cột b.
                    en: The queen takes on b6 rather than letting the a-pawn double. Black is level on material again, and the queen on b6 looks straight down the b-file at b2.
                    fr: La dame prend en b6 plutôt que de laisser le pion a se doubler. Les Noirs sont de nouveau à égalité matérielle, et la dame en b6 regarde b2 tout au long de la colonne b.
                  outcome:
                    type: position
                    evaluation:
                      vi: Quân số ngang nhau. Đen không còn con tốt để thí nhưng vẫn giữ được một phần thứ mình muốn, đó là cột b nửa mở và tốt a6 kiểm soát ô b5. Trắng có khoảng không nhờ tốt d5, đúng kiểu cấu trúc Benoni, và sẽ tìm cách đuổi con hậu b6 bằng Nc3-a4 hay Rb1. Hậu ra sớm là cái giá Đen phải trả cho việc lấy lại tốt.
                      en: Material is level. Black no longer has a sacrifice on the board but keeps part of what it was for, namely the half-open b-file and the a6 pawn covering b5. White has space thanks to the d5 pawn, a Benoni structure, and will look to chase the queen off b6 with Nc3-a4 or Rb1. The early queen sortie is the price Black pays for getting the pawn back.
                      fr: Le matériel est égal. Les Noirs n'ont plus de sacrifice sur l'échiquier mais conservent une part de ce qu'il visait, à savoir la colonne b semi-ouverte et le pion a6 qui couvre b5. Les Blancs ont l'espace grâce au pion d5, une structure de Benoni, et chercheront à chasser la dame de b6 par Nc3-a4 ou Rb1. La sortie précoce de la dame est le prix que les Noirs paient pour récupérer le pion.
                    plan:
                      vi: Đen chơi ...g6, ...Bg7, ...d6 và ...O-O như thường lệ, đưa hậu về a7 hay c7 khi bị đuổi, chồng xe ở cột b, và dùng ...e6 làm nước phá chính chống lại tốt d5. Ô c4 và b4 là chỗ cho mã Đen sau khi ...Nbd7-b6. Trắng chơi Nc3, e4, Nf3, Be2 và O-O, rồi Na4 đuổi hậu và đổi lấy áp lực ở cánh hậu, sau đó là nước phá e4-e5 hoặc f4 ở trung tâm và cánh vua. Ai giành được ô b5 và cột b sẽ quyết định ván cờ.
                      en: Black plays ...g6, ...Bg7, ...d6 and ...O-O as usual, drops the queen back to a7 or c7 when it is chased, doubles rooks on the b-file, and uses ...e6 as the main break against the d5 pawn. The c4 and b4 squares are outposts for a black knight after ...Nbd7-b6. White plays Nc3, e4, Nf3, Be2 and O-O, then Na4 to chase the queen and buy relief on the queenside, followed by the e4-e5 or f4 break in the centre and on the kingside. Whoever ends up owning b5 and the b-file decides the game.
                      fr: Les Noirs jouent ...g6, ...Bg7, ...d6 et ...O-O comme d'habitude, replient la dame en a7 ou c7 quand elle est chassée, doublent les tours sur la colonne b et utilisent ...e6 comme rupture principale contre le pion d5. Les cases c4 et b4 sont des avant-postes pour un cavalier noir après ...Nbd7-b6. Les Blancs jouent Nc3, e4, Nf3, Be2 et O-O, puis Na4 pour chasser la dame et soulager l'aile dame, avant la rupture e4-e5 ou f4 au centre et à l'aile roi. Celui qui finit par posséder b5 et la colonne b gagne la partie.
