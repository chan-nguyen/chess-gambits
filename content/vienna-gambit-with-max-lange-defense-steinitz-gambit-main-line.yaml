tree:
  annotation:
    vi: Trắng vừa chơi 5.Ke2, đáp lại nước chiếu bằng cách đưa vua lên e2, và từ bỏ quyền nhập thành. Trắng kém một tốt, bảy đối tám; tốt f4 của Đen bị tượng c1 tấn công và được hậu h4 bảo vệ.
    en: White has just played 5.Ke2, answering the check by walking the king to e2, and has given up the right to castle. White is a pawn down, seven to eight; Black's pawn on f4 is attacked by the bishop on c1 and defended by the queen on h4.
    fr: Les Blancs viennent de jouer 5.Ke2, répondant à l'échec en portant le roi en e2, et ont renoncé au roque. Les Blancs sont un pion en moins, sept contre huit ; le pion f4 noir est attaqué par le fou c1 et défendu par la dame h4.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 5...Nf6. Bài này chỉ đi theo nhánh 5...Nf6; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 5...Nf6 here. This entry follows the reply 5...Nf6 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 5...Nf6. Cette fiche ne suit que la réponse 5...Nf6 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Nf6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen phát triển bằng 5...Nf6, tấn công tốt e4, vốn được mã c3 bảo vệ.
        en: Black develops with 5...Nf6, attacking the pawn on e4, which the knight on c3 defends.
        fr: Les Noirs se développent par 5...Nf6, attaquant le pion e4, que le cavalier c3 défend.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt. Vua Trắng ở e2 đã mất cả hai quyền nhập thành còn Đen vẫn giữ cả hai. Tốt e4 bị mã f6 tấn công một lần và được mã c3 bảo vệ một lần; tốt h2 bị hậu h4 tấn công và được xe h1 bảo vệ.'
          en: "Count the pawns: White seven, Black eight, so White is a pawn down. White's king on e2 has lost both castling rights while Black keeps both. The pawn on e4 is attacked once, by the knight on f6, and defended once, by the knight on c3; the pawn on h2 is attacked by the queen on h4 and defended by the rook on h1."
          fr: 'Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins. Le roi blanc, en e2, a perdu les deux droits de roque, alors que les Noirs gardent les deux. Le pion e4 est attaqué une fois, par le cavalier f6, et défendu une fois, par le cavalier c3 ; le pion h2 est attaqué par la dame h4 et défendu par la tour h1.'
        plan:
          vi: Trắng đuổi hậu bằng Nf3 rồi chỉ lấy lại tốt bằng Bxf4 khi hậu không còn giữ tốt đó; Đen hoàn tất phát triển bằng ...Bb4 và ...d6, giữ tốt thừa.
          en: White drives the queen away with Nf3 and takes back on f4 with Bxf4 only once the queen no longer guards that pawn; Black completes development with ...Bb4 and ...d6, keeping the extra pawn.
          fr: Les Blancs chassent la dame par Nf3 puis ne reprennent en f4 par Bxf4 que lorsque la dame ne garde plus ce pion ; les Noirs achèvent leur développement par ...Bb4 et ...d6, en gardant le pion en plus.
        basis:
          by: chan
          at: '2026-09-30'
