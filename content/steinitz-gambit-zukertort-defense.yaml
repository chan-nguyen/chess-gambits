# Vienna Gambit, with Max Lange Defense: Steinitz Gambit, Zukertort Defense. Defining line 1.e4 e5 2.Nc3 Nc6 3.f4 exf4 4.d4 Qh4+ 5.Ke2 (the catalogue line runs one ply further; that ply is modelled below as the reply, so the line ends on the learner's own ply, invariant 5).
