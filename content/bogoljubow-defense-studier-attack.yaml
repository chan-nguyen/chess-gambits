tree:
  annotation:
    vi: Cả hai vua đã nhập thành và Trắng vừa chơi 8.Qe1. Hậu tấn công tốt e7, vốn được hậu Đen bảo vệ, và vì hậu đã rời d1 nên tốt d4 chỉ còn mã f3 bảo vệ trong khi hậu Đen tấn công nó.
    en: Both kings have castled and White has just played 8.Qe1. The queen attacks the pawn on e7, which Black's queen defends, and since it has left d1 the pawn on d4 is defended only by the knight on f3 while Black's queen attacks it.
    fr: Les deux rois ont roqué et les Blancs viennent de jouer 8.Qe1. La dame attaque le pion e7, que la dame noire défend, et comme elle a quitté d1, le pion d4 n'est plus défendu que par le cavalier f3 tandis que la dame noire l'attaque.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 8...Nc6. Bài này chỉ đi theo nhánh 8...Nc6; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 8...Nc6 here. This entry follows the reply 8...Nc6 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 8...Nc6. Cette fiche ne suit que la réponse 8...Nc6 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Nc6
      replyQuality: good
      frequency: common
      annotation:
        vi: 'Đen phát triển bằng 8...Nc6, thêm quân tấn công d4: tốt này giờ bị hậu và mã tấn công mà chỉ có mã f3 bảo vệ. Nc6 cũng bảo vệ thêm tốt e7.'
        en: 'Black develops with 8...Nc6, adding an attacker on d4: the pawn is now attacked by the queen and the knight and defended only by the knight on f3. The knight on c6 also defends the pawn on e7 a second time.'
        fr: 'Les Noirs se développent par 8...Nc6, ajoutant un attaquant sur d4 : le pion est désormais attaqué par la dame et le cavalier et défendu seulement par le cavalier f3. Le cavalier c6 défend aussi une seconde fois le pion e7.'
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng sáu, Đen bảy, nên Trắng kém một tốt. Tốt d4 bị hậu d8 và mã c6 tấn công hai lần mà chỉ có mã f3 bảo vệ một lần, nên Trắng phải bảo vệ nó ngay. Cả hai vua đã nhập thành.'
          en: 'Count the pawns: White six, Black seven, so White is a pawn down. The d4 pawn is attacked twice, by the queen on d8 and the knight on c6, and defended once, by the knight on f3, so White has to protect it at once. Both kings have castled.'
          fr: 'Comptez les pions : six pour les Blancs, sept pour les Noirs ; les Blancs sont donc un pion en moins. Le pion d4 est attaqué deux fois, par la dame d8 et le cavalier c6, et défendu une fois, par le cavalier f3 : les Blancs doivent le protéger aussitôt. Les deux rois ont roqué.'
        plan:
          vi: Trắng bảo vệ d4 bằng Be3 hoặc Ne2. Đen, nếu tốt d4 bị bỏ mặc, ăn nó bằng ...Nxd4; nếu không thì phát triển nốt bằng ...Bg4 hoặc ...Bf5.
          en: White protects d4 with Be3 or Ne2. Black, if the d4 pawn is left alone, takes it with ...Nxd4; otherwise Black finishes developing with ...Bg4 or ...Bf5.
          fr: Les Blancs protègent d4 par Be3 ou Ne2. Les Noirs, si le pion d4 est laissé seul, le prennent par ...Nxd4 ; sinon ils achèvent leur développement par ...Bg4 ou ...Bf5.
        basis:
          by: chan
