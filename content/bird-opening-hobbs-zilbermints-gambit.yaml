# Bird Opening: Hobbs-Zilbermints Gambit. Frozen defining line 1.f4 h6 2.Nf3 g5, which
# ends on Black's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant
# 5). Replayed with chess.js through 3.fxg5. searchMate at 3 moves from the resulting
# position returns no-mate, so no forced mate is claimed anywhere in this entry, and
# no capture is left going free at the leaf.
