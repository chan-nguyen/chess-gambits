tree:
  annotation:
    vi:
      Sau khi đổi tốt ở trung tâm (fxe5, Nxe4), Trắng chơi 6.Qf3, vừa đe doạ con mã e4 vừa nhắm vào
      cột f7 trên đường chéo dài.
    en:
      After the central pawn trade (fxe5, Nxe4), White plays 6.Qf3, both threatening the knight on e4
      and eyeing f7 along the long diagonal.
    fr:
      Après l'échange de pions au centre (fxe5, Nxe4), les Blancs jouent 6.Qf3, menaçant à la fois le
      cavalier e4 et visant f7 sur la grande diagonale.
  dismissRest:
    reason:
      vi:
        Đen chơi nước khác ngoài f5, ví dụ d4 đuổi mã Trắng trước hoặc Nc6. Đánh giá chung — vật chất
        cân bằng, con mã e4 là tâm điểm — không đổi nhiều.
      en:
        Black plays something other than f5, for instance d4 to chase the White knight first, or Nc6.
        The overall assessment — level material, the knight on e4 as the focal point — does not
        change much.
      fr:
        Les Noirs jouent autre chose que f5, par exemple d4 pour chasser d'abord le cavalier blanc, ou
        Nc6. L'évaluation générale — matériel égal, le cavalier e4 comme point focal — ne change
        guère.
  children:
    - ply: f5
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen chơi f5, bảo vệ chắc con mã e4 trước sức ép của hậu Trắng trên đường chéo f3-a8.
        en:
          Black plays f5, firmly defending the knight on e4 against the pressure of White's queen on the
          f3-a8 diagonal.
        fr:
          Les Noirs jouent f5, défendant fermement le cavalier e4 contre la pression de la dame blanche
          sur la diagonale f3-a8.
      outcome:
        type: position
        evaluation:
          vi:
            'Đếm tốt, hai bên đều có 7 — vật chất cân bằng: Trắng đã ăn tốt e5 nhưng đổi lại để Đen ăn tốt
            e4.'
          en:
            'Count the pawns and both sides have 7 — material is level: White captured the e5 pawn but let
            Black capture the e4 pawn in return.'
          fr:
            'Comptez les pions, chaque camp en a 7 — le matériel est égal : les Blancs ont capturé le pion
            e5 mais ont laissé les Noirs capturer le pion e4 en retour.'
        plan:
          vi:
            Trắng chơi d3 đuổi mã hoặc Nf3, tranh thủ hậu đang hoạt động trên đường chéo dài để gây sức ép.
            Đen chơi Nc6 hoặc c5, hoàn thiện phát triển và bảo vệ con mã tiền tiêu ở e4 lâu nhất có
            thể.
          en:
            White plays d3 to chase the knight, or Nf3, using the actively placed queen on the long diagonal
            to keep up pressure. Black plays Nc6 or c5, finishing development and defending the
            advanced knight on e4 for as long as possible.
          fr:
            Les Blancs jouent d3 pour chasser le cavalier, ou Nf3, utilisant la dame active sur la grande
            diagonale pour maintenir la pression. Les Noirs jouent Nc6 ou c5, achevant leur
            développement et défendant le cavalier avancé en e4 aussi longtemps que possible.
        basis:
          by: chan
          at: 2026-09-29
