  basis:
    by: 'chan'
    at: '2026-10-01'
    source: "A judgement. At the end of the defining line White has taken the pawn on f7 with the bishop after the d-pawns were traded, so White has seven pawns to Black's six, but the bishop is attacked by the king and nothing defends it, so White is giving a bishop for one pawn. The compensation is a king pulled to f7 without the right to castle and an isolated pawn on e5, which is a real target but not a certain gain, so the line is judged dubious. No engine was consulted and no database was queried."
judgement:
