# King's Gambit Accepted, Bonsch-Osmolovsky Variation. One of eighteen entries tracked by
# issue #111 (group H), sharing the trunk `1.e4 e5 2.f4 exf4 3.Nf3` with
# `kings-gambit-accepted.yaml` and group G (#110). Defining line ends on White's 3.Nf3
# (invariant 5). Every move replayed with a scratch chess.js script (deleted before commit).
#
# 3...Ne7 is a rare, passive try, the Nf3-trunk mirror of the Bishop's Gambit's Steinitz
# Defense. The same chess.js mobility check run for the Steinitz Defense entry (after
# correcting an earlier side-to-move scripting error) found the bishop and rook retain
# reasonable squares once the knight relocates to g6 — the tried continuation 4.d4 Ng6 named
# in the evaluation below, also replayed with chess.js — so no clean structural catastrophe
# can be honestly certified by hand without an engine. The leaf states the real, calmer
# position instead of reverting to `unexplored`.
id: kings-gambit-accepted-bonsch-osmolovsky-variation
name: "King's Gambit Accepted: Bonsch-Osmolovsky Variation"
eco: C34
category: gambit
