tree:
  annotation:
    vi: Trắng vừa chơi 4.Nc3, bảo vệ tốt e4 và tấn công tốt d5. Đen hơn một tốt, tám đối bảy, trong đó có hai tốt trên cột g, ở g7 và g4. Tốt d5 bị tốt e4 và mã c3 tấn công hai lần và chỉ có hậu bảo vệ.
    en: White has just played 4.Nc3, defending the pawn on e4 and attacking the pawn on d5. Black is a pawn up, eight to seven, with two pawns on the g-file, on g7 and g4. The pawn on d5 is attacked twice, by the e4 pawn and the knight on c3, and defended only by the queen.
    fr: Les Blancs viennent de jouer 4.Nc3, défendant le pion e4 et attaquant le pion d5. Les Noirs ont un pion de plus, huit contre sept, dont deux pions sur la colonne g, en g7 et en g4. Le pion d5 est attaqué deux fois, par le pion e4 et le cavalier c3, et défendu seulement par la dame.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 4...Nf6. Bài này chỉ đi theo nhánh 4...Nf6; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 4...Nf6 here. This entry follows the reply 4...Nf6 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 4...Nf6. Cette fiche ne suit que la réponse 4...Nf6 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Nf6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen bảo vệ d5 bằng 4...Nf6, đồng thời tấn công e4 lần thứ hai. Tốt g4 giờ được mã f6 và tượng c8 bảo vệ.
        en: Black defends d5 with 4...Nf6, which also attacks e4 a second time. The g4 pawn is now defended by the knight on f6 and the bishop on c8.
        fr: Les Noirs défendent d5 par 4...Nf6, qui attaque aussi e4 une seconde fois. Le pion g4 est maintenant défendu par le cavalier f6 et le fou c8.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt, dù Đen có hai tốt trên cột g, ở g7 và g4. Tốt e4 bị mã f6 và tốt d5 tấn công hai lần mà chỉ có mã c3 bảo vệ một lần, nên Trắng phải bảo vệ hoặc đẩy nó ngay, nếu không sẽ kém hai tốt. Tốt g4 bị hậu d1 tấn công và được tượng c8 cùng mã f6 bảo vệ.'
          en: 'Count the pawns: White seven, Black eight, so White is a pawn down, though Black has two pawns on the g-file, on g7 and g4. The pawn on e4 is attacked twice, by the knight on f6 and the d5 pawn, and defended once, by the knight on c3, so White has to defend or advance it at once or be two pawns down. The g4 pawn is attacked by the queen on d1 and defended by the bishop on c8 and the knight on f6.'
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins, même si les Noirs ont deux pions sur la colonne g, en g7 et en g4. Le pion e4 est attaqué deux fois, par le cavalier f6 et le pion d5, et défendu une fois, par le cavalier c3 : les Blancs doivent le défendre ou l'avancer aussitôt, sous peine d'avoir deux pions en moins. Le pion g4 est attaqué par la dame d1 et défendu par le fou c8 et le cavalier f6."
        plan:
          vi: Trắng hỗ trợ tốt e4 bằng f3, nước đi cũng tấn công g4, hoặc đẩy e5 để đánh vào mã; nếu không, Đen ăn bằng ...dxe4 hoặc ...Nxe4 và hơn hai tốt.
          en: White supports the e4 pawn with f3, which also attacks g4, or advances e5 to hit the knight; otherwise Black takes with ...dxe4 or ...Nxe4 and is two pawns up.
          fr: Les Blancs soutiennent le pion e4 par f3, qui attaque aussi g4, ou l'avancent en e5 pour attaquer le cavalier ; sinon les Noirs prennent par ...dxe4 ou ...Nxe4 et ont deux pions de plus.
        basis:
          by: chan
          at: '2026-09-30'
