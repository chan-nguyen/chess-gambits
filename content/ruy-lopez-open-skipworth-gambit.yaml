tree:
  annotation:
    vi:
      Sau khi Đen ăn tốt bằng Nxe4 trong biến Mở của Ruy Lopez, Trắng chơi 6.Re1 đưa xe ra tấn công
      con mã thay vì đòi lại tốt ngay bằng d4.
    en:
      After Black captures the e4 pawn with Nxe4 in the Open Ruy Lopez, White plays 6.Re1, bringing
      the rook out to attack the knight instead of immediately winning the pawn back with d4.
    fr:
      Après la prise du pion e4 par Nxe4 dans l'Espagnole Ouverte, les Blancs jouent 6.Re1, amenant la
      tour attaquer le cavalier au lieu de regagner immédiatement le pion par d4.
  dismissRest:
    reason:
      vi:
        Đen chơi nước khác ngoài d5, ví dụ Nc5 hay Nd6 rút mã ngay. Đánh giá chung thay đổi theo lựa
        chọn, nhưng ý tưởng của Trắng — dùng xe e1 gây sức ép lên con mã — luôn giữ nguyên.
      en:
        Black plays something other than d5, for instance Nc5 or Nd6 to retreat the knight at once. The
        overall assessment shifts with the choice, but White's idea — using the rook on e1 to
        pressure the knight — stays the same.
      fr:
        Les Noirs jouent autre chose que d5, par exemple Nc5 ou Nd6 pour reculer aussitôt le cavalier.
        L'évaluation générale varie selon le choix, mais l'idée des Blancs — utiliser la tour e1
        pour presser le cavalier — reste la même.
  children:
    - ply: d5
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen củng cố mã e4 bằng d5, cách đáp trả chắc chắn và tiêu chuẩn nhất trước 6.Re1.
        en: Black shores up the knight on e4 with d5, the soundest and most standard reply to 6.Re1.
        fr:
          Les Noirs consolident le cavalier e4 par d5, la réponse la plus solide et la plus classique à
          6.Re1.
      children:
        - ply: Nxe5
          annotation:
            vi:
              Thay vì rút tượng a4 hay chơi d4 thông thường, Trắng chơi luôn 7.Nxe5, ăn tốt trung tâm và giữ
              áp lực — nước đi định nghĩa Skipworth Gambit.
            en:
              Instead of the usual retreat of the bishop on a4 or playing d4, White plays 7.Nxe5 outright,
              grabbing the central pawn and keeping up the pressure — the move that defines the
              Skipworth Gambit.
            fr:
              Au lieu du repli habituel du fou en a4 ou du coup d4, les Blancs jouent directement 7.Nxe5,
              capturant le pion central et maintenant la pression — le coup qui définit le Gambit
              Skipworth.
          outcome:
            type: position
            evaluation:
              vi:
                'Đếm tốt, hai bên đều có 7 — vật chất cân bằng: Trắng ăn lại tốt e5 để bù cho tốt e4 đã mất
                trước đó. Con mã e4 của Đen và con tượng a4 của Trắng đều là những quân đang đứng
                khá xa, cần được chú ý trong các nước tiếp theo.'
              en:
                "Count the pawns and both sides have 7 — material is level: White has recaptured the e5 pawn to
                make up for the e4 pawn lost earlier. Black's knight on e4 and White's bishop on a4
                are both somewhat exposed pieces that need attention in the coming moves."
              fr:
                'Comptez les pions, chaque camp en a 7 — le matériel est égal : les Blancs ont repris le pion e5
                pour compenser le pion e4 perdu plus tôt. Le cavalier noir en e4 et le fou blanc en
                a4 sont tous deux des pièces un peu exposées à surveiller dans les coups suivants.'
            plan:
              vi:
                Trắng chơi Nxc6 đổi mã hoặc Bxc6+ trước, tranh thủ cặp tốt trung tâm nếu đổi được đúng quân. Đen
                chơi Nxe5 đổi lại hoặc Be6 hoàn thiện phát triển, cố gắng giữ vững trung tâm và tận
                dụng việc tượng Trắng còn kẹt ở a4.
              en:
                White plays Nxc6 to trade knights, or Bxc6+ first, hoping for a central pawn duo if the trades
                go the right way. Black plays Nxe5 to trade back, or Be6 to finish development,
                trying to hold the centre and make use of the fact that White's bishop is still
                stuck on a4.
              fr:
                Les Blancs jouent Nxc6 pour échanger les cavaliers, ou Bxc6+ d'abord, espérant un duo de pions
                centraux si les échanges tournent bien. Les Noirs jouent Nxe5 pour échanger en
                retour, ou Be6 pour achever leur développement, cherchant à tenir le centre et à
                profiter du fou blanc toujours coincé en a4.
            basis:
              by: chan
              at: 2026-09-29
