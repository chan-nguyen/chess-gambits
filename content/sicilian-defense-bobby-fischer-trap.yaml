                              en: White collects the a1 knight (Qxa1, or Nxc2 if Black takes the c2 pawn), tucks the king away with O-O, and uses the g7 pawn as a thorn beside the black king. This is Black's best defence, so the trap gives White a moderate edge here (the black king is still exposed, the g7 pawn still a thorn), not an immediate win.
                              fr: "Les Blancs récupèrent le cavalier a1 (Qxa1, ou Nxc2 si les Noirs prennent le pion c2), mettent le roi à l'abri par O-O et se servent du pion g7 comme d'une épine près du roi noir. C'est la meilleure défense des Noirs : le piège ne donne ici qu'un avantage modéré aux Blancs (le roi noir reste exposé, le pion g7 reste une épine), pas un gain immédiat."
