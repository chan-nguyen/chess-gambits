tree:
  annotation:
    vi: Trắng vừa lùi tượng về b3, nơi nó vẫn nhắm vào f7 trên đường chéo b3–g8 và tránh được ...d5. Nước đáp trông tự nhiên nhất của Đen là ...Na5, đánh luôn vào tượng.
    en: White has just retreated the bishop to b3, where it still aims at f7 along the b3–g8 diagonal and is out of the way of ...d5. Black's most natural-looking reply is ...Na5, attacking the bishop in turn.
    fr: Les Blancs viennent de reculer le fou en b3, où il vise toujours f7 sur la diagonale b3–g8 et évite ...d5. La réponse la plus naturelle des Noirs est ...Na5, qui attaque à son tour le fou.
  counts:
    legal:
      count: legalReplies
      expect: 30
  dismissRest:
    reason:
      vi: Đen có {legal} nước hợp lệ ở đây; trong những nước còn lại, Đen không chơi ...Na5, nên cái bẫy dưới đây không xuất hiện. Trắng cứ tiếp tục kế hoạch của mình (f3, Qd2, O-O-O) hoặc ăn những gì Đen để hở.
      en: Black has {legal} legal moves here; in the remaining ones Black does not play ...Na5, so the trap below does not arise. White simply carries on with the plan (f3, Qd2, O-O-O) or takes whatever Black leaves hanging.
      fr: Les Noirs ont {legal} coups légaux ici ; dans les autres, ils ne jouent pas ...Na5 et le piège ci-dessous n'apparaît pas. Les Blancs poursuivent simplement leur plan (f3, Qd2, O-O-O) ou prennent ce que les Noirs laissent en prise.
  dismissed:
    - ply: Bh6
      reason: '8...Bh6 9.Bxh6 wins a bishop outright: nothing recaptures on h6.'
    - ply: Nd5
      reason: '8...Nd5 9.exd5 (or 9.Nxd5) wins a knight outright: nothing recaptures on d5.'
    - ply: Nxe4
      reason: 8...Nxe4 9.Nxe4 gives a knight for a pawn.
  children:
    - ply: Na5
      replyQuality: mistake
      frequency: common
      annotation:
        vi: Mã c6 nhảy lên a5 đánh vào tượng b3, tưởng sẽ bắt được cặp tượng. Nhưng mã vừa rời c6, nơi nó giữ cả d4 lẫn e5 — hai ô mà Trắng sắp dùng đến.
        en: The c6 knight jumps to a5 attacking the b3 bishop, hoping to win the bishop pair. But it has just left c6, where it guarded both d4 and e5, the two squares White is about to use.
        fr: Le cavalier c6 saute en a5 et attaque le fou b3, dans l'espoir de gagner la paire de fous. Mais il vient de quitter c6, où il gardait à la fois d4 et e5, les deux cases dont les Blancs vont se servir.
      children:
        - ply: e5
          annotation:
            vi: 'Trắng bỏ mặc tượng b3: 9.e5! đẩy tốt đánh vào mã f6, mà không còn mã c6 nào để ăn lại trên d4 hay e5. Mã f6 đang chắn đường chéo g7–e5 của tượng Đen.'
            en: "White ignores the attacked bishop: 9.e5! pushes the pawn against the f6 knight, and there is no c6 knight left to take on d4 or e5. The f6 knight is also the piece blocking the g7 bishop's diagonal to e5."
            fr: "Les Blancs ignorent le fou attaqué : 9.e5! pousse le pion contre le cavalier f6, et il n'y a plus de cavalier c6 pour prendre en d4 ou en e5. Le cavalier f6 est aussi la pièce qui barre la diagonale g7–e5 du fou noir."
          dismissRest:
            reason:
              vi: 'Mỗi nước còn lại đều mất ít nhất một quân đổi lấy một tốt: có một quân Đen bị bỏ mặc, và Đen không lấy lại được tương xứng.'
              en: 'Every remaining move loses at least a piece for a pawn: a black piece is left hanging, and Black cannot win enough back.'
              fr: 'Chacun des autres coups perd au moins une pièce contre un pion : une pièce noire est laissée en prise, et les Noirs ne peuvent pas regagner assez.'
          dismissed:
            - ply: Nh5
              reason: '9...Nh5 10.g4 traps the knight: f4, g3 and f6 are all covered, so it is lost.'
          children:
            - ply: Nxb3
              replyQuality: best
              frequency: common
              annotation:
                vi: 'Đen ăn tượng b3. Đây là nước duy nhất giữ cho thiệt hại nhỏ: mã b3 bị tốt a2, tốt c2 và mã d4 cùng đánh, và mã f6 vẫn bị tốt e5 đánh, nhưng Đen đã lấy được tượng.'
                en: 'Black takes the b3 bishop. This is the only reply that keeps the damage small: the b3 knight is attacked by the a2 pawn, the c2 pawn and the d4 knight, and the f6 knight is still attacked by the e5 pawn, but Black has won the bishop.'
                fr: "Les Noirs prennent le fou b3. C'est le seul coup qui limite les dégâts : le cavalier b3 est attaqué par le pion a2, le pion c2 et le cavalier d4, et le cavalier f6 reste attaqué par le pion e5, mais les Noirs ont gagné le fou."
              children:
                - ply: exf6
                  annotation:
                    vi: 'Trắng không ăn lại mã b3 mà ăn luôn mã f6: tốt f6 giờ chĩa vào tượng g7 và ô e7. Trắng cho phép mã b3 ăn xe a1, để đổi lấy tốc độ.'
                    en: 'White does not take the b3 knight back but takes the f6 knight at once: the pawn on f6 now attacks the g7 bishop and the e7 square. White lets the b3 knight take the a1 rook, in exchange for speed.'
                    fr: 'Les Blancs ne reprennent pas le cavalier b3 mais prennent aussitôt le cavalier f6 : le pion f6 attaque maintenant le fou g7 et la case e7. Les Blancs laissent le cavalier b3 prendre la tour a1, en échange de la vitesse.'
                  dismissRest:
                    reason:
