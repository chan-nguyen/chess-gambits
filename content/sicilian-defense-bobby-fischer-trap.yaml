# The Bobby Fischer Trap, from White's side of the Sicilian Defense, Accelerated Dragon, Modern
# Bc4 Variation. The defining line is 1.e4 c5 2.Nf3 Nc6 3.d4 cxd4 4.Nxd4 g6 5.Nc3 Bg7 6.Be3
# Nf6 7.Bc4 O-O 8.Bb3 and it ends on White's own ply, so the root is an opponent node and
# Black's mistakes can carry a quality (docs/CONTEXT.md, invariant 5). The dataset row ends at
# 7.Bc4 (B35); 7...O-O 8.Bb3 are the two plies this entry adds.
#
# ECO is B35 and category is `trap`, matching `traps.yaml`: a trap carries the ECO of the
# opening it sits inside (ADR-0008).
#
# Sources are leads. The line 8...Na5 9.e5 Ne8 10.Bxf7+ Rxf7 11.Ne6 dxe6 12.Qxd8 is in lichess
# study 7ndvaGkp (chapter 18) and on thechesswebsite.com; the Chessgames reference list that fed
# issue #173 credits the same idea to Fischer-Reshevsky 1958 with 10...Kxf7 instead (not
# independently verified here). Everything was replayed ply by ply with chess.js before any prose
# was written. What the replay found, and the file now says:
#
# - The two sources disagree on move ten and both are playable: 10.Bxf7+ has exactly three legal
#   replies (Rxf7, Kxf7, Kh8) and 11.Ne6 wins the queen after each. The two real branches are
#   modelled; 10...Kh8 is dismissed with its reason.
# - The sources show only the losing reply 9...Ne8. They do not say that 9.e5 can be answered
#   by 9...Nxb3, which is Black's only move that does not lose a piece outright. It leads to
#   10.exf6 Nxa1 11.fxg7, where every other reply loses at least a piece and the three that do
#   not (...Re8, ...Kxg7, ...Nxc2+) leave White only a modest edge (about a pawn). So the trap
#   wins by force against 9...Ne8 and nothing else; against the best defence White keeps a clear
#   plus and not more. That branch is modelled and its evaluation says so.
# - The mechanism of the main trap is not the one the sources suggest. 9...Ne8 is not a
#   blunder because of what the knight does on e8, but because it stands between the rook on f8
#   and the queen on d8: once 10.Bxf7+ drags the rook (or the king) off the back rank, 11.Ne6
#   forks the queen and, after ...dxe6, the open d-file shows that nothing guards d8.
# - thechesswebsite.com adds that 11...Kxe6 (after 10...Kxf7) loses to 12.Qd5+ Kf5 13.g4+. The
#   prover's search depth in this repository cannot reach the mate the engine finds (six moves),
#   so the reply is covered by the catch-all and no mate is claimed.
#
# A private engine cross-check (the Stockfish build the analysis page ships, at moderate
# depth) was used to decide which replies deserve a branch. It is not the source of any claim
# in the lesson: every capture or count was read off the derived board.
