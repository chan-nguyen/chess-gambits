                              en: "Material on the board: White has a queen, a rook, two knights, a bishop and seven pawns (the g7 pawn included); Black has a queen, two rooks, a bishop, a knight and seven pawns, so Black is two points ahead. But Black's a1 knight is a piece with no good square: b3 and c2 are both attacked, so it can only be traded for the c2 pawn or taken by Qxa1, and then the material is roughly level."
                              fr: "Matériel sur l'échiquier : les Blancs ont une dame, une tour, deux cavaliers, un fou et sept pions (le pion g7 compris) ; les Noirs ont une dame, deux tours, un fou, un cavalier et sept pions, soit deux points d'avance pour les Noirs. Mais le cavalier a1 noir est une pièce sans bonne case : b3 et c2 sont attaquées, il ne peut donc qu'être échangé contre le pion c2 ou pris par Qxa1, et le matériel est alors à peu près égal."
