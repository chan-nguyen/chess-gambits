                      en: 'Every other move loses more than ...Nxa1: the b3 knight or the g7 bishop falls, and White gets a decisive advantage in each case.'
                      fr: 'Tout autre coup perd davantage que ...Nxa1 : le cavalier b3 ou le fou g7 tombe, et les Blancs obtiennent un avantage décisif dans chaque cas.'
