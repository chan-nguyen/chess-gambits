                                - ply: Qxd8
                                  annotation:
                                    vi: 'Hậu d1 ăn hậu d8. Không quân nào của Đen bảo vệ ô d8: xe f7 đã rời hàng cuối, còn xe a8 bị tượng c8 chắn.'
                                    en: 'The queen on d1 takes the queen on d8. No black piece protects d8: the rook on f7 has left the back rank and the a8 rook is blocked by the c8 bishop.'
                                    fr: 'La dame d1 prend la dame d8. Aucune pièce noire ne protège d8 : la tour f7 a quitté la dernière rangée et la tour a8 est bloquée par le fou c8.'
                                  unsettled: Black can take the e5 pawn for free with ...Bxe5, but that costs White one pawn, which leaves White three points ahead instead of four (the count below); the queen sits safely on d8 and the e8 knight still has no square, so playing it out adds nothing.
                                  outcome:
                                    type: position
                                    evaluation:
                                      vi: 'Quân số: Trắng có hậu, hai xe, một mã, một tượng và bảy tốt; Đen có hai xe, hai tượng, hai mã và sáu tốt. Trắng hơn bốn điểm (một hậu đổi hai quân nhẹ, và hơn một tốt). Mã e8 của Đen là quân không còn ô tốt: c7 và d6 bị hậu d8 đánh, f6 bị tốt e5 đánh, còn g7 có tượng nhà.'
                                      en: "Material count: White has a queen, two rooks, a knight, a bishop and seven pawns; Black has two rooks, two bishops, two knights and six pawns. White is four points ahead (a queen for two minor pieces, and a pawn more). Black's e8 knight is a piece with no good square: c7 and d6 are covered by the queen on d8, f6 by the e5 pawn, and g7 holds its own bishop."
                                      fr: "Décompte matériel : les Blancs ont une dame, deux tours, un cavalier, un fou et sept pions ; les Noirs deux tours, deux fous, deux cavaliers et six pions. Les Blancs ont quatre points d'avance (une dame contre deux pièces mineures, et un pion de plus). Le cavalier e8 noir est une pièce sans bonne case : c7 et d6 sont couvertes par la dame d8, f6 par le pion e5, et g7 abrite son propre fou."
                                    plan:
                                      vi: Trắng giữ hậu ở nơi an toàn (Qd3 hoặc Qd2), nhập thành dài rồi đổi lấy các quân Đen đang rối. Đen cố giải thoát mã e8 và mã a5, nhưng mỗi lần đổi quân đều làm cho ưu thế vật chất của Trắng rõ hơn.
                                      en: White keeps the queen somewhere safe (Qd3 or Qd2), castles long and trades off the tangled black pieces. Black tries to free the e8 and a5 knights, but each trade makes White's material edge clearer.
                                      fr: Les Blancs mettent la dame en sécurité (Qd3 ou Qd2), roquent long et échangent les pièces noires empêtrées. Les Noirs tentent de libérer les cavaliers e8 et a5, mais chaque échange rend l'avantage matériel blanc plus net.
