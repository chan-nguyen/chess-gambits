tree:
  annotation:
    vi: Trắng chơi 5.Bc4, hiến con tốt d4 để phát triển nhanh và nhắm vào f7 — cách chơi chuẩn của
      Scotch Gambit.
    en:
      White plays 5.Bc4, offering the d4 pawn to develop quickly and aim at f7 — the standard way of
      handling the Scotch Gambit.
    fr:
      Les Blancs jouent 5.Bc4, offrant le pion d4 pour se développer rapidement et viser f7 — la façon
      habituelle de traiter le Gambit Écossais.
  dismissRest:
    reason:
      vi:
        Đen chơi nước khác ngoài Bb4+, ví dụ Nf6 hay Bc5 phát triển bình thường. Mỗi lựa chọn dẫn tới
        một biến Scotch Gambit khác nhau, và đây là nhánh chọn riêng nước chiếu sớm.
      en:
        Black plays something other than Bb4+, for instance Nf6 or Bc5 developing normally. Each choice
        leads into a different Scotch Gambit line, and this is the branch that specifically chooses
        the early check.
      fr:
        Les Noirs jouent autre chose que Bb4+, par exemple Nf6 ou Bc5 se développant normalement. Chaque
        choix mène à une ligne différente du Gambit Écossais, et c'est ici la branche qui choisit
        spécifiquement l'échec précoce.
  children:
    - ply: Bb4+
      replyQuality: best
      frequency: common
      annotation:
        vi:
          Đen chiếu ngay bằng Bb4+ thay vì phát triển tự nhiên, buộc Trắng phải phản ứng trước khi tính
          đến việc ăn lại tốt d4.
        en:
          Black checks at once with Bb4+ instead of developing naturally, forcing White to react before
          worrying about winning back the d4 pawn.
        fr:
          Les Noirs font échec d'emblée par Bb4+ au lieu de se développer naturellement, forçant les
          Blancs à réagir avant de songer à regagner le pion d4.
      children:
        - ply: c3
          annotation:
            vi: Trắng chặn chiếu bằng c3, vừa đỡ vừa gây sức ép lên tượng b4 và con tốt d4 cùng lúc.
            en:
              White blocks the check with c3, defending while pressuring both the bishop on b4 and the pawn on
              d4 at once.
            fr:
              Les Blancs bloquent l'échec par c3, se défendant tout en faisant pression à la fois sur le fou
              b4 et le pion d4.
          outcome:
            type: position
            evaluation:
              vi:
                Đếm tốt, Trắng 7 còn Đen 8 — Trắng vẫn kém đúng một tốt sạch kể từ nước 4...exd4, chưa đòi lại
                được. Đổi lại, tượng b4 của Đen đang bị tốt c3 gây sức ép và con tốt d4 cũng đứng
                trước nguy cơ bị ăn tiếp.
              en:
                Count the pawns and it is 7 for White against 8 for Black — White is still down a clean pawn
                since 4...exd4, not yet won back. In exchange, Black's bishop on b4 is under
                pressure from the c3 pawn, and the pawn on d4 is also at risk of falling next.
              fr:
                Comptez les pions, 7 pour les Blancs contre 8 pour les Noirs — les Blancs restent en retard d'un
                pion net depuis 4...exd4, pas encore regagné. En échange, le fou noir en b4 subit la
                pression du pion c3, et le pion d4 risque aussi de tomber ensuite.
            plan:
              vi:
                Trắng chơi cxb4 nếu tượng lùi chậm, hoặc cxd4 ăn lại tốt ngay khi tượng đã rút, tranh thủ nhịp
                độ để phát triển nhanh. Đen chơi Ba5 hoặc Bd6 giữ tượng, rồi d6, cố giữ con tốt thừa
                và hoàn thiện phát triển.
              en:
                White plays cxb4 if the bishop is slow to retreat, or cxd4 to win the pawn back once the bishop
                has moved, using the tempo to develop quickly. Black plays Ba5 or Bd6 to keep the
                bishop, then d6, trying to hold the extra pawn and finish developing.
              fr:
                Les Blancs jouent cxb4 si le fou tarde à reculer, ou cxd4 pour regagner le pion une fois le fou
                déplacé, utilisant le temps gagné pour se développer rapidement. Les Noirs jouent
                Ba5 ou Bd6 pour garder le fou, puis d6, tentant de garder le pion supplémentaire et
                d'achever leur développement.
            basis:
              by: chan
              at: 2026-09-29
