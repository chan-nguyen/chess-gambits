# Ponziani Opening: Spanish Variation, Harrwitz Attack, Nikitin Gambit. Frozen defining line
# 1.e4 e5 2.Nf3 Nc6 3.c3 d5 4.Bb5 dxe4 5.Nxe5 Qd5 6.Qa4 ends on White's own ply, so the root
# is an opponent node (docs/CONTEXT.md, invariant 5). Part of batch t of round 4 (#182). Every
# ply below was replayed with chess.js before it was annotated; searchMate at 3 moves from the
# leaf returns no-mate, so no forced mate is claimed anywhere in this entry, and no capture is
# left going free at the leaf.
id: 'spanish-variation-harrwitz-attack-nikitin-gambit'
name: 'Ponziani Opening: Spanish Variation, Harrwitz Attack, Nikitin Gambit'
eco: 'C44'
category: 'gambit'
side: 'white'
definingLine:
  - 'e4'
  - 'e5'
  - 'Nf3'
