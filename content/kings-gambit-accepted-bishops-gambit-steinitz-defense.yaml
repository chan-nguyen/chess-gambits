# King's Gambit Accepted, Bishop's Gambit, Steinitz Defense. One of eighteen entries tracked
# by issue #111 (group H), sharing the trunk `1.e4 e5 2.f4 exf4 3.Bc4` with
# `kings-gambit-accepted.yaml` and group G (#110). Defining line ends on White's 3.Bc4
# (invariant 5). Every move replayed with a scratch chess.js script (deleted before commit).
#
# 3...Ne7 is a rare, passive try — the knight blocks the f8-bishop's natural diagonal to e7
# before relocating, at the cost of tempo. A first draft of this entry checked the resulting
# piece mobility with chess.js and initially misread it (a scripting error queried the wrong
# side to move); once corrected, the bishop and rook were found to retain reasonable squares
# a few moves later — e.g. after 4.Nf3 Ng6 named in the evaluation below, also replayed with
# chess.js — so no clean structural catastrophe can be honestly certified by hand without an
# engine. The leaf states the real, calmer position that is actually there instead of either
# asserting a verdict the reviewer could not stand behind or reverting to `unexplored`.
id: kings-gambit-accepted-bishops-gambit-steinitz-defense
name: "King's Gambit Accepted: Bishop's Gambit, Steinitz Defense"
eco: C33
