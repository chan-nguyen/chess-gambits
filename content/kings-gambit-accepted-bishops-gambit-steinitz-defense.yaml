tree:
  annotation:
    vi: Trắng vừa đưa tượng ra c4, Gambit Tượng. Mục này đi sâu riêng vào 3...Ne7, Phòng thủ Steinitz.
    en: White has just played the bishop to c4, the Bishop's Gambit. This entry follows specifically 3...Ne7, the Steinitz Defense.
    fr: Les Blancs viennent de jouer le fou en c4, le Gambit du Fou. Cette entrée suit spécifiquement 3...Ne7, la Défense Steinitz.
  dismissRest:
    reason:
      vi: Đen đáp lại 3.Bc4 bằng một nước khác ngoài 3...Ne7 — giữ tốt bằng 3...g5, đánh trung tâm bằng 3...d5, hay phát triển mã kia bằng 3...Nf6. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 3.Bc4 with something other than 3...Ne7 — holding the pawn with 3...g5, striking the centre with 3...d5, or developing the other knight with 3...Nf6. Each is outside the scope of this entry.
      fr: Les Noirs répondent à 3.Bc4 par autre chose que 3...Ne7 — conserver le pion par 3...g5, une frappe centrale par 3...d5, ou développer l'autre cavalier par 3...Nf6. Chacun sort du cadre de cette entrée.
  children:
    - ply: Ne7
      replyQuality: inaccuracy
      frequency: rare
      annotation:
        vi: Phòng thủ Steinitz. Đen đưa mã ra e7, một ô tạm thời và ít hoạt động, tạm thời án ngữ đường chéo của tượng f8 trong lúc chuẩn bị đưa mã ra vị trí tốt hơn như g6.
        en: The Steinitz Defense. Black places the knight on e7, a modest and inactive square that temporarily blocks the f8 bishop's own diagonal while preparing to reroute the knight to a better square such as g6.
        fr: La Défense Steinitz. Les Noirs placent le cavalier en e7, une case modeste et peu active qui bloque temporairement la diagonale du fou f8, en préparant un repositionnement du cavalier vers une meilleure case comme g6.
      outcome:
        type: unexplored
