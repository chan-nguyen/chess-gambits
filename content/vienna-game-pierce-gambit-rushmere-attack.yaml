tree:
  annotation:
    vi: Trắng vừa chơi 9.dxc6, dùng tốt ăn mã c6. Vật chất cân bằng, mỗi bên bảy tốt và cùng số quân, nhưng Đen có ba tốt trên cột f, ở f7, f4 và f3. Tốt c6 bị tốt b7 tấn công mà không có quân bảo vệ.
    en: White has just played 9.dxc6, taking the knight on c6 with a pawn. Material is level, with seven pawns each and the same pieces, but Black has three pawns on the f-file, on f7, f4 and f3. The pawn on c6 is attacked by the b7 pawn and has no defender.
    fr: Les Blancs viennent de jouer 9.dxc6, prenant le cavalier c6 avec un pion. Le matériel est égal, sept pions de chaque côté et les mêmes pièces, mais les Noirs ont trois pions sur la colonne f, en f7, f4 et f3. Le pion c6 est attaqué par le pion b7 et n'a aucun défenseur.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 9...bxc6. Bài này chỉ đi theo nhánh ăn lại 9...bxc6; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 9...bxc6 here. This entry follows the recapture 9...bxc6 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 9...bxc6. Cette fiche ne suit que la reprise 9...bxc6 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: bxc6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen ăn lại bằng tốt b, 9...bxc6, làm đôi tốt c (c7 và c6) và để tốt f4 bị tượng c1 tấn công mà không có quân bảo vệ.
        en: Black recaptures with the b-pawn, 9...bxc6, which doubles the c-pawns (c7 and c6) and leaves the pawn on f4 attacked by the bishop on c1 with no defender.
        fr: Les Noirs reprennent avec le pion b, 9...bxc6, ce qui double les pions c (c7 et c6) et laisse le pion f4 attaqué par le fou c1 sans défenseur.
      children:
        - ply: Bxf4
          annotation:
            vi: Trắng ăn tốt f4 bằng tượng, 10.Bxf4, đồng thời nhắm vào tốt c7.
            en: White takes the pawn on f4 with the bishop, 10.Bxf4, which also aims at the pawn on c7.
            fr: Les Blancs prennent le pion f4 avec le fou, 10.Bxf4, qui vise aussi le pion c7.
          outcome:
            type: position
            evaluation:
              vi: 'Đếm tốt: mỗi bên sáu tốt và cùng số quân, nên vật chất cân bằng. Đen bị hỏng thế tốt: hai tốt c ở c7 và c6, hai tốt f ở f7 và f3, và vua chưa nhập thành. Tốt f3 bị tốt g2, hậu và xe tấn công ba lần mà chỉ có tượng g4 bảo vệ một lần; vua Trắng đã nhập thành.'
              en: "Count the pawns: six each and the same pieces, so material is level. Black's structure is damaged: two c-pawns, on c7 and c6, two f-pawns, on f7 and f3, and the king has not castled. The pawn on f3 is attacked three times, by the g2 pawn, the queen and the rook, and defended once, by the bishop on g4; White's king has castled."
              fr: "Comptez les pions : six de chaque côté et les mêmes pièces, donc le matériel est égal. La structure noire est abîmée : deux pions c, en c7 et c6, deux pions f, en f7 et f3, et le roi n'a pas roqué. Le pion f3 est attaqué trois fois, par le pion g2, la dame et la tour, et défendu une fois, par le fou g4 ; le roi blanc a roqué."
            plan:
              vi: Trắng ăn f3 bằng gxf3, nước đi cũng tấn công tượng g4, hoặc bằng Qxf3. Đen thách thức tượng f4 bằng ...Bd6 và giữ tượng g4 tại chỗ để bảo vệ f3.
              en: White takes on f3 with gxf3, which also attacks the bishop on g4, or with Qxf3. Black challenges the bishop on f4 with ...Bd6 and keeps the bishop on g4 in place to guard f3.
              fr: Les Blancs prennent en f3 par gxf3, qui attaque aussi le fou g4, ou par Qxf3. Les Noirs défient le fou f4 par ...Bd6 et laissent le fou g4 en place pour garder f3.
