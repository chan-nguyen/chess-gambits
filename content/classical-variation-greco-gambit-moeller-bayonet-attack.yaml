    source: >-
      A judgement. White is a pawn down with an isolated pawn on d5; the open e-file and the
      advance of the g-pawn give play, but Black's pieces defend one another and Black's
      king can castle at once, so the pawn is not obviously repaid. No engine was consulted and no
