# Dutch Defense: Staunton Gambit, American Attack. Frozen defining line 1.d4 f5 2.e4
# fxe4 3.Nd2, which ends on White's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 3...Nf6. searchMate
# at 3 moves from the resulting position returns no-mate, so no forced mate is claimed
# anywhere in this entry, and no capture is left going free at the leaf.
id: dutch-defense-staunton-gambit-american-attack
name: 'Dutch Defense: Staunton Gambit, American Attack'
eco: A82
category: gambit
side: white
definingLine: [d4, f5, e4, fxe4, Nd2]
soundness:
