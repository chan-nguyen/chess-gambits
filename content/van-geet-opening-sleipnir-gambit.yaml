# Van Geet Opening: Sleipnir Gambit. Frozen defining line 1.Nc3 d5 2.e3 e5 3.d4 Bb4, which
# ends on Black's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
# The line below was replayed with chess.js before being annotated.
id: van-geet-opening-sleipnir-gambit
name: 'Van Geet Opening: Sleipnir Gambit'
eco: A00
category: gambit
side: black
definingLine: [Nc3, d5, e3, e5, d4, Bb4]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. Instead of simply taking on d4, Black pins the c3-knight with 3...Bb4,
      leaving the e5 pawn without a defender for the moment. White breaks the pin at once
      with Bd2, and material is still dead level — Black has not been shown to get
      anything concrete for leaving the e5 pawn unguarded. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Thay vì ăn tốt d4 đang bị đe doạ, Đen ghim mã c3 vào vua Trắng bằng 3...Bb4, chấp nhận để tốt e5 tạm thời không ai bảo vệ. Đây là ý tưởng của Sleipnir Gambit trong Van Geet Opening.
    en: Instead of taking the contested d4 pawn, Black pins the c3-knight to the White king with 3...Bb4, accepting that the e5 pawn is left temporarily undefended. This is the idea behind the Sleipnir Gambit in the Van Geet Opening.
    fr: Plutôt que de prendre le pion d4 disputé, les Noirs clouent le cavalier c3 au roi blanc par 3...Bb4, acceptant que le pion e5 reste temporairement sans défense. C'est l'idée du Gambit Sleipnir dans le Van Geet.
  dismissRest:
    reason:
      vi: Trắng không chặn đường ghim bằng tượng d2. Các nước khác — bảo vệ mã c3 bằng cách khác, ăn luôn tốt e5, hay phát triển quân nơi khác — đều không giải quyết thế ghim theo đúng cách đang được phân tích ở đây.
      en: White does not block the pin with the bishop on d2. Anything else — defending the c3-knight some other way, taking the e5 pawn outright, or developing elsewhere — does not resolve the pin the way examined here.
      fr: Les Blancs ne bloquent pas le clouage avec le fou en d2. Tout le reste — défendre le cavalier c3 autrement, prendre carrément le pion e5, ou se développer ailleurs — ne résout pas le clouage de la façon étudiée ici.
  children:
    - ply: Bd2
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng chặn đường chéo bằng tượng c1 ra d2, giải toả thế ghim lên mã c3 và chuẩn bị đổi tượng nếu Đen muốn. Căng thẳng ở trung tâm giữa tốt d4 và e5 vẫn còn nguyên, chưa ai ăn ai.
        en: White blocks the diagonal with the bishop from c1 to d2, breaking the pin on the c3-knight and offering to trade bishops if Black wants to. The central tension between the d4 and e5 pawns is still there, neither one having been taken yet.
        fr: Les Blancs bloquent la diagonale avec le fou de c1 en d2, brisant le clouage sur le cavalier c3 et proposant d'échanger les fous si les Noirs le souhaitent. La tension centrale entre les pions d4 et e5 est toujours là, aucun des deux n'ayant encore été pris.
      outcome:
        type: position
        evaluation:
          vi: Quân số hoàn toàn ngang nhau, tám tốt mỗi bên, chưa ai mất gì. Điều đáng chú ý là tốt e5 của Đen hiện không có quân nào bảo vệ, trong khi tốt d4 tương ứng của Trắng lại được tốt e3 chống lưng vững chắc — một sự bất cân xứng nhỏ mà Đen sẽ cần xử lý trước khi Trắng kịp khai thác.
          en: Material is completely level, eight pawns each, nothing lost on either side. What stands out is that Black's e5 pawn is currently undefended, while White's corresponding d4 pawn is solidly supported by the e3 pawn — a small asymmetry Black will need to address before White can exploit it.
          fr: Le matériel est parfaitement égal, huit pions de chaque côté, rien n'a encore été perdu. Ce qui ressort, c'est que le pion e5 des Noirs est actuellement indéfendu, tandis que le pion d4 blanc correspondant est solidement soutenu par le pion e3 — une petite asymétrie que les Noirs devront régler avant que les Blancs ne puissent l'exploiter.
        plan:
          vi: Trắng chơi a3 hay Qb3, cân nhắc đổi tượng hoặc dồn ép thế ghim, và để mắt tới khả năng ăn dxe5 nếu Đen không kịp bảo vệ. Đen chơi Nc6, Qe7 hay f6, củng cố tốt e5 và hoàn tất phát triển trước khi tính tới việc đổi tượng ở d2.
          en: White plays a3 or Qb3, weighing whether to trade the bishops or keep up the pin, and keeps an eye on dxe5 if Black is slow to defend it. Black plays Nc6, Qe7 or f6, shoring up the e5 pawn and completing development before deciding whether to trade off on d2.
          fr: Les Blancs jouent a3 ou Qb3, pesant s'il faut échanger les fous ou maintenir le clouage, et gardent un œil sur dxe5 si les Noirs tardent à le défendre. Les Noirs jouent Nc6, Qe7 ou f6, consolidant le pion e5 et achevant leur développement avant de décider d'échanger ou non en d2.
        basis:
          by: chan
          at: '2026-09-25'
