    source: >-
      A judgement. The Jaenisch setup leaves Black a pawn up, with the rook defending f7 from h7
      and the bishop defending f4, and after 8.Nc3 Nc6 White's knight on e5 is defended only by
      the d-pawn. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-30'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement
    on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa chơi 8.Nc3, hoàn tất phát triển mã cánh hậu. Mã bảo vệ e4, còn tượng c4 và mã e5 cùng nhắm vào f7, nơi vua và xe h7 đang bảo vệ.
    en: White has just played 8.Nc3, completing the development of the queenside knight. The knight defends e4, and the bishop on c4 and the knight on e5 both attack f7, which the king and the rook on h7 defend.
    fr: Les Blancs viennent de jouer 8.Nc3, achevant le développement du cavalier de l'aile dame. Le cavalier défend e4, et le fou c4 et le cavalier e5 attaquent tous deux f7, que le roi et la tour h7 défendent.
  dismissRest:
    reason:
      vi: 'Đen chơi một nước khác thay vì 8...Nc6, chẳng hạn 8...d6, dùng tốt tấn công mã e5, hoặc 8...Nf6. Không có nước nào bắt buộc: mọi quân Đen đang bị tấn công đều có quân bảo vệ.'
      en: 'Black plays something other than 8...Nc6, for example 8...d6, which attacks the knight on e5 with a pawn, or 8...Nf6. No reply is forced: every Black piece that is attacked is defended.'
      fr: "Les Noirs jouent autre chose que 8...Nc6, par exemple 8...d6, qui attaque le cavalier e5 avec un pion, ou 8...Nf6. Aucune réponse n'est forcée : toute pièce noire attaquée est défendue."
  children:
    - ply: Nc6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen phát triển mã lên c6, tấn công mã e5 và tốt d4. Mã e5 chỉ được tốt d4 bảo vệ, còn tốt d4 chỉ được hậu bảo vệ.
        en: Black develops the knight to c6, attacking the knight on e5 and the pawn on d4. The knight on e5 is defended only by the pawn on d4, and the pawn on d4 only by the queen.
        fr: Les Noirs développent le cavalier en c6, attaquant le cavalier e5 et le pion d4. Le cavalier e5 n'est défendu que par le pion d4, et le pion d4 que par la dame.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Đen hơn một tốt, và các tốt đã đẩy xa của Đen đều có quân giữ: tốt f4 được tượng h6 bảo vệ, tốt g4 được tốt h5 bảo vệ. Mã e5 của Trắng bị mã c6 tấn công và chỉ có tốt d4 bảo vệ, còn tốt d4 cũng bị mã c6 đánh và chỉ có hậu bảo vệ.'
          en: "Count the pawns: White seven, Black eight, so Black is a pawn up, and Black's advanced pawns are held: the pawn on f4 is defended by the bishop on h6 and the pawn on g4 by the pawn on h5. White's knight on e5 is attacked by the knight on c6 and defended only by the pawn on d4, which the same knight also attacks and only the queen defends."
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs, si bien que les Noirs ont un pion d'avance, et les pions avancés des Noirs sont tenus : le pion f4 est défendu par le fou h6 et le pion g4 par le pion h5. Le cavalier e5 des Blancs est attaqué par le cavalier c6 et défendu seulement par le pion d4, que le même cavalier attaque aussi et que seule la dame défend."
        plan:
          vi: Trắng phải giải quyết thế căng quanh e5 và d4, chẳng hạn bằng Nxc6. Đen muốn giữ các tốt đã đẩy xa có quân bảo vệ và thách thức mã e5 lần nữa bằng ...d6.
          en: White has to resolve the tension around e5 and d4, for example with Nxc6. Black wants to keep its advanced pawns defended and to challenge the knight on e5 again with ...d6.
          fr: Les Blancs doivent régler la tension autour de e5 et d4, par exemple par Nxc6. Les Noirs veulent garder leurs pions avancés défendus et contester de nouveau le cavalier e5 par ...d6.
        basis:
          by: chan
          at: '2026-09-30'
