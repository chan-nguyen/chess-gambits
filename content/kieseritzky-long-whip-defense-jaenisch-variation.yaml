# King's Gambit Accepted: Kieseritzky, Long Whip Defense, Jaenisch Variation, taught. Frozen
# defining line 1.e4 e5 2.f4 exf4 3.Nf3 g5 4.h4 g4 5.Ne5 h5 6.Bc4 Rh7 7.d4 Bh6 8.Nc3 ends on
# White's own 8.Nc3, so the root is an opponent node (docs/CONTEXT.md, invariant 5). Black's
# 8...Nc6 is modelled as the root's single reply, so the leaf has White to move. Every ply
# was replayed with chess.js; searchMate at 3 moves from the leaf returns no-mate, the leaf
# is not in check and no capture is going free.
id: kieseritzky-long-whip-defense-jaenisch-variation
name: "King's Gambit Accepted: Kieseritzky, Long Whip Defense, Jaenisch Variation"
eco: C39
category: gambit
side: white
definingLine: [e4, e5, f4, exf4, Nf3, g5, h4, g4, Ne5, h5, Bc4, Rh7, d4, Bh6, Nc3]
