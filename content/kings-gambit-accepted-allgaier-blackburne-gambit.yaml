# King's Gambit Accepted: Allgaier, Blackburne Gambit, taught. Frozen defining line 1.e4 e5
# 2.f4 exf4 3.Nf3 g5 4.h4 g4 5.Ng5 h6 6.Nxf7 Kxf7 7.Nc3 ends on White's own 7.Nc3, so the
# root is an opponent node (docs/CONTEXT.md, invariant 5). Black's 7...Nf6 is modelled as
# the root's single reply, so the leaf has White to move. Every ply was replayed with
# chess.js; searchMate at 3 moves from the leaf returns no-mate, the leaf is not in check
# and no capture is going free.
id: kings-gambit-accepted-allgaier-blackburne-gambit
name: "King's Gambit Accepted: Allgaier, Blackburne Gambit"
eco: C39
category: gambit
side: white
definingLine: [e4, e5, f4, exf4, Nf3, g5, h4, g4, Ng5, h6, Nxf7, Kxf7, Nc3]
soundness:
  value: dubious
  reviewedAt: '2026-09-30'
  basis:
    by: chan
    at: '2026-09-30'
    source: >-
      A judgement. 7.Nc3 develops a piece and guards e4, but it does nothing about the knight
      White gave on f7, and 7...Nf6 answers it by defending g4 and attacking e4 in a single move.
      No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-30'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement
    on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa chơi 7.Nc3, phát triển mã và bảo vệ e4. Trắng đang kém một mã, số tốt ngang nhau ở mức bảy mỗi bên, và tốt g4 vẫn bị hậu tấn công mà không có ai bảo vệ.
    en: White has just played 7.Nc3, developing the knight and guarding e4. White is a knight down, the pawns are level at seven each, and the pawn on g4 is still attacked by the queen and defended by nothing.
    fr: Les Blancs viennent de jouer 7.Nc3, développant le cavalier et gardant e4. Les Blancs sont en moins un cavalier, les pions sont à égalité, sept de chaque côté, et le pion g4 est toujours attaqué par la dame sans être défendu.
  dismissRest:
    reason:
      vi: Đen chơi một nước khác thay vì 7...Nf6, chẳng hạn 7...d6 hoặc 7...h5, cả hai cũng bảo vệ được tốt g4.
      en: Black plays something other than 7...Nf6 here, such as 7...d6 or 7...h5, both of which also defend the pawn on g4.
      fr: Les Noirs jouent autre chose que 7...Nf6, par exemple 7...d6 ou 7...h5, qui défendent tous deux aussi le pion g4.
  children:
    - ply: Nf6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen phát triển mã. Mã bảo vệ tốt g4 và tấn công e4, nơi mã c3 đang bảo vệ.
        en: Black develops the knight. It defends the pawn on g4 and attacks e4, which the knight on c3 defends.
        fr: Les Noirs développent le cavalier. Il défend le pion g4 et attaque e4, que le cavalier c3 défend.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm quân: mỗi bên bảy tốt, và Trắng kém một mã vì con mã đã đưa ra ở f7 chưa lấy lại được. Vua Đen đứng ở f7 và không còn quyền nhập thành, nhưng hiện chưa có quân nào tấn công nó, còn tốt f4 thì không có ai bảo vệ.'
          en: "Count the material: seven pawns each, and White is a knight down because the piece given on f7 has not come back. Black's king stands on f7 and can no longer castle, but nothing attacks it at the moment, and the pawn on f4 has no defender."
          fr: "Comptez le matériel : sept pions de chaque côté, et les Blancs sont en moins un cavalier, car la pièce donnée en f7 n'a pas été récupérée. Le roi noir est en f7 et ne peut plus roquer, mais rien ne l'attaque pour le moment, et le pion f4 n'a aucun défenseur."
        plan:
          vi: Trắng chuẩn bị d4 để mở tượng c1 nhắm vào tốt f4 không có ai bảo vệ, và giữ Bc4+ làm nước chiếu dọc đường chéo tới f7. Đen muốn chơi ...d5 thách thức e4 và ...Kg7 đưa vua ra khỏi đường chéo.
          en: White prepares d4, which opens the c1 bishop against the undefended pawn on f4, and keeps Bc4+ in hand as a check along the diagonal to f7. Black wants ...d5 to challenge e4 and ...Kg7 to take the king off the diagonal.
          fr: Les Blancs préparent d4, qui ouvre le fou c1 contre le pion f4 sans défense, et gardent Bc4+ en réserve comme échec sur la diagonale vers f7. Les Noirs veulent jouer ...d5 pour contester e4 et ...Kg7 pour sortir le roi de la diagonale.
        basis:
          by: chan
          at: '2026-09-30'
