# Grob Opening, Grob Gambit, Basman Gambit. One entry in a batch authored for issue #148
# (batch h), sharing the trunk `1.g4 d5 2.Bg2` with `grob-opening-grob-gambit`. Defining line
# ends on White's 2.Bg2 (invariant 5). Every ply below was replayed with chess.js before
# being written.
id: grob-opening-grob-gambit-basman-gambit
name: 'Grob Opening: Grob Gambit, Basman Gambit'
eco: A00
category: gambit
side: white
definingLine: [g4, d5, Bg2]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      The same judgement the family head `grob-opening-grob-gambit.yaml` carries. No engine
      was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa fianchetto tượng lên g2. Mục này đi sâu riêng vào 2...h5, một nước đẩy tốt cột h thay vì ăn tốt g4 ngay.
    en: White has just fianchettoed the bishop to g2. This entry follows specifically 2...h5, a rook-pawn push instead of taking the g4 pawn at once.
    fr: Les Blancs viennent de fianchetter le fou en g2. Cette entrée suit spécifiquement 2...h5, une poussée du pion tour au lieu de prendre aussitôt le pion g4.
  dismissRest:
    reason:
      vi: Đen không chơi 2...h5 — ăn tốt bằng 2...Bxg4, phát triển bằng 2...Nf6, hay chơi 2...c6 (Richter-Grob) hay 2...e5 (Keres). Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black does not play 2...h5 — taking with 2...Bxg4, developing with 2...Nf6, or playing 2...c6 (Richter-Grob) or 2...e5 (Keres). Each is outside the scope of this entry.
      fr: Les Noirs ne jouent pas 2...h5 — prenant par 2...Fxg4, développant par 2...Cf6, ou jouant 2...c6 (Richter-Grob) ou 2...e5 (Keres). Chacun sort du cadre de cette entrée.
  children:
    - ply: h5
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Gambit Basman. Đen đánh thẳng vào con tốt g4 bằng tốt của mình thay vì dùng tượng, mời Trắng đổi tốt và mở cột h cho xe.
        en: The Basman Gambit. Black strikes at the g4 pawn with a pawn of its own rather than the bishop, inviting a trade that opens the h-file for the rook.
        fr: Le Gambit Basman. Les Noirs frappent le pion g4 avec leur propre pion plutôt qu'avec le fou, invitant à un échange qui ouvre la colonne h pour la tour.
      children:
        - ply: gxh5
          annotation:
            vi: Trắng ăn tốt h5, đưa quân số về ngang nhau. Nhưng con tốt ấy giờ đứng một mình trên cột h đang mở, đúng nơi xe Đen sắp nhòm tới.
            en: White captures the h5 pawn, levelling material. But that pawn now stands alone on the newly open h-file, exactly where Black's rook is about to look.
            fr: Les Blancs prennent le pion h5, rétablissant l'égalité matérielle. Mais ce pion se retrouve seul sur la colonne h désormais ouverte, exactement là où la tour noire va bientôt regarder.
          dismissRest:
            reason:
              vi: Đen không ăn lại tốt h5 ngay bằng xe — phát triển bằng 4...Nf6 hay chơi 4...c6. Mỗi lựa chọn để nguyên con tốt h5 của Trắng trên bàn cờ, chưa bị đòi lại.
              en: Black does not recapture the h5 pawn with the rook at once — developing with 4...Nf6, or playing 4...c6. Each leaves White's h5 pawn sitting on the board, not yet won back.
              fr: Les Noirs ne reprennent pas aussitôt le pion h5 avec la tour — développant par 4...Cf6, ou jouant 4...c6. Chacun laisse le pion h5 blanc sur l'échiquier, pas encore regagné.
          children:
            - ply: Rxh5
              annotation:
                vi: Đen ăn lại con tốt bằng xe ngay lập tức, quân duy nhất có thể ăn tại đó. Quân số trở lại hoàn toàn ngang nhau, và xe Đen đã đứng hoạt động trên cột h mở.
                en: Black recaptures the pawn with the rook at once, the only piece that can capture there. Material is fully level again, and Black's rook already stands active on the open h-file.
                fr: Les Noirs reprennent aussitôt le pion avec la tour, la seule pièce pouvant capturer là. Le matériel est de nouveau parfaitement égal, et la tour noire est déjà active sur la colonne h ouverte.
              outcome:
                type: position
                evaluation:
                  vi: Đếm tốt thì mỗi bên đều còn bảy, quân số hoàn toàn ngang nhau — con tốt h Đen mất đã đổi đúng lấy con tốt g Trắng mất. Xe Đen đứng ở h5 khá năng động, nhưng vua Đen cũng đã mất quyền nhập thành cánh vua vì xe vừa rời góc bàn cờ.
                  en: Count the pawns and each side has seven, material is completely level — the h-pawn Black lost is traded exactly for the g-pawn White lost. Black's rook stands fairly actively on h5, but Black's king has also lost the right to castle kingside since the rook has left its corner.
                  fr: Comptez les pions, chaque camp en a sept, le matériel est parfaitement égal — le pion h perdu par les Noirs s'échange exactement contre le pion g perdu par les Blancs. La tour noire est assez active en h5, mais le roi noir a aussi perdu le droit de roquer côté roi puisque la tour a quitté son coin.
                plan:
                  vi: Trắng chơi Nf3 hoặc c4, phát triển nhanh và tận dụng việc Đen chưa thể nhập thành cánh vua. Đen chơi Rh8 lui về hoặc giữ xe ở h5 thêm một lúc, rồi Nf6 và e6, hoàn thiện phát triển và nhập thành cánh hậu nếu cần.
                  en: White plays Nf3 or c4, developing quickly and using the fact that Black cannot castle kingside yet. Black plays Rh8 to retreat or keeps the rook on h5 a little longer, then Nf6 and e6, completing development and castling queenside if needed.
                  fr: Les Blancs jouent Nf3 ou c4, se développant rapidement et profitant du fait que les Noirs ne peuvent pas encore roquer côté roi. Les Noirs jouent Rh8 pour reculer ou gardent la tour en h5 un peu plus longtemps, puis Nf6 et e6, achevant leur développement et roquant côté dame si besoin.
                basis:
                  by: chan
                  at: '2026-09-25'
