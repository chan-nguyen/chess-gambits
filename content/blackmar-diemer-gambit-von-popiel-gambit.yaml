tree:
  annotation:
    vi: Trắng vừa chơi 4.Bg5, tấn công mã f6, quân đang bảo vệ tốt thừa e4. Mã được hai tốt e7 và g7 bảo vệ.
    en: White has just played 4.Bg5, attacking the knight on f6, the piece that defends the extra pawn on e4. The knight is defended by the pawns on e7 and g7.
    fr: Les Blancs viennent de jouer 4.Bg5, attaquant le cavalier f6, la pièce qui défend le pion e4 en trop. Le cavalier est défendu par les pions e7 et g7.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 4...Nc6. Bài này chỉ đi theo nhánh 4...Nc6; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 4...Nc6 here. This entry follows 4...Nc6 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 4...Nc6. Cette fiche ne suit que 4...Nc6 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Nc6
      replyQuality: good
      frequency: common
      annotation:
        vi: 'Đen phát triển bằng 4...Nc6, thêm quân thứ hai tấn công tốt d4: tốt này giờ bị hậu và mã tấn công mà chỉ có hậu Trắng bảo vệ.'
        en: "Black develops with 4...Nc6, adding a second attacker on the d4 pawn: it is now attacked by the queen and the knight and defended only by White's queen."
        fr: 'Les Noirs se développent par 4...Nc6, ajoutant un second attaquant sur le pion d4 : il est désormais attaqué par la dame et le cavalier et défendu seulement par la dame blanche.'
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt. Tốt d4 của Trắng bị hậu d8 và mã c6 tấn công hai lần mà chỉ có hậu d1 bảo vệ một lần, nên Trắng phải bảo vệ hoặc giải quyết nó ngay. Tốt e4 của Đen bị mã c3 tấn công và được mã f6 bảo vệ.'
          en: "Count the pawns: White seven, Black eight, so White is a pawn down. White's d4 pawn is attacked twice, by the queen on d8 and the knight on c6, and defended once, by the queen on d1, so White has to defend or resolve it at once. Black's pawn on e4 is attacked by the knight on c3 and defended by the knight on f6."
          fr: 'Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins. Le pion d4 blanc est attaqué deux fois, par la dame d8 et le cavalier c6, et défendu une fois, par la dame d1 : les Blancs doivent le défendre ou le régler aussitôt. Le pion e4 noir est attaqué par le cavalier c3 et défendu par le cavalier f6.'
        plan:
          vi: Trắng bảo vệ d4 bằng Nge2, nước đi để tượng g5 tiếp tục đè lên mã f6, hoặc bằng Be3. Đen hơn một tốt nên hoàn tất phát triển bằng ...Bf5 hoặc ...e6.
          en: White defends d4 with Nge2, which leaves the bishop on g5 pressing the knight on f6, or with Be3. Black, a pawn up, completes development with ...Bf5 or ...e6.
          fr: Les Blancs défendent d4 par Nge2, qui laisse le fou g5 presser le cavalier f6, ou par Be3. Les Noirs, un pion de plus, achèvent leur développement par ...Bf5 ou ...e6.
        basis:
          by: chan
          at: '2026-09-30'
