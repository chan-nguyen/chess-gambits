# King's Gambit Accepted: Double Muzio Gambit, Paulsen Defense, taught. Frozen defining line
# 1.e4 e5 2.f4 exf4 3.Nf3 g5 4.Bc4 g4 5.O-O gxf3 6.Qxf3 Qf6 7.e5 Qxe5 8.d3 Bh6 9.Nc3 Ne7
# 10.Bd2 Nbc6 11.Rae1 ends on White's own 11.Rae1, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Black's 11...Qf6 is modelled as the root's single reply,
# so the leaf has White to move. Every ply was replayed with chess.js; searchMate at 3 moves
# from the leaf returns no-mate, the leaf is not in check and no capture is going free in
# the machine's sense.
