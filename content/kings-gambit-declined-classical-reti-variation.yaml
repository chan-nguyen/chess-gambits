# King's Gambit Declined: Classical, Réti Variation, taught. Frozen defining line 1.e4 e5
# 2.f4 Bc5 3.Nf3 d6 4.c3 f5 5.fxe5 dxe5 6.d4 exd4 7.Bc4 ends on White's own 7.Bc4, so the
# root is an opponent node (docs/CONTEXT.md, invariant 5). Black's 7...Nc6 is modelled as
# the root's single reply, so the leaf has White to move. Every ply was replayed with
# chess.js; searchMate at 3 moves from the leaf returns no-mate, the leaf is not in check
# and no capture is going free.
id: kings-gambit-declined-classical-reti-variation
name: "King's Gambit Declined: Classical, Réti Variation"
eco: C30
category: gambit
side: white
definingLine: [e4, e5, f4, Bc5, Nf3, d6, c3, f5, fxe5, dxe5, d4, exd4, Bc4]
soundness:
  value: dubious
  reviewedAt: '2026-09-30'
  basis:
    by: chan
    at: '2026-09-30'
    source: >-
      A judgement. After 7.Bc4 Nc6 Black is a pawn up with the pawn on d4 defended as many times
      as it is attacked, and White's pawn on e4 hangs to ...fxe4, so White cannot look after both
      at once. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-30'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement
    on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa chơi 7.Bc4, đưa tượng ra đánh vào mã g8, con mã được xe h8 bảo vệ. Tốt e4 của Trắng bị tốt f5 tấn công mà không có ai bảo vệ, còn tốt d4 của Đen bị đánh ba lần và chỉ được bảo vệ hai lần.
    en: White has just played 7.Bc4, bringing the bishop out to attack the knight on g8, which the rook on h8 defends. White's pawn on e4 is attacked by the pawn on f5 and defended by nothing, and Black's pawn on d4 is attacked three times and defended twice.
    fr: Les Blancs viennent de jouer 7.Bc4, sortant le fou pour attaquer le cavalier g8, que la tour h8 défend. Le pion e4 des Blancs est attaqué par le pion f5 et défendu par rien, et le pion d4 des Noirs est attaqué trois fois et défendu deux fois.
  dismissRest:
    reason:
      vi: Đen chơi một nước khác thay vì 7...Nc6, chẳng hạn 7...Qe7 hoặc 7...Bb6. Tốt d4 bị đánh ba lần và chỉ có hai quân bảo vệ, nên phần lớn các nước khác để Trắng thắng được quân.
      en: Black plays something other than 7...Nc6, for example 7...Qe7 or 7...Bb6. The pawn on d4 is attacked three times and defended twice, so most other moves let White win material.
      fr: Les Noirs jouent autre chose que 7...Nc6, par exemple 7...Qe7 ou 7...Bb6. Le pion d4 est attaqué trois fois et défendu deux fois, si bien que la plupart des autres coups permettent aux Blancs de gagner du matériel.
  children:
    - ply: Nc6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen phát triển mã lên c6, thêm quân bảo vệ thứ ba cho tốt d4.
        en: Black develops the knight to c6, adding a third defender to the pawn on d4.
        fr: Les Noirs développent le cavalier en c6, ajoutant un troisième défenseur au pion d4.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng sáu, Đen bảy, nên Đen hơn một tốt. Tốt d4 bị đánh ba lần, bởi tốt c3, mã f3 và hậu d1, và cũng được bảo vệ ba lần, bởi hậu d8, mã c6 và tượng c5, còn tốt e4 của Trắng bị tốt f5 đánh mà không có ai bảo vệ.'
          en: "Count the pawns: White six, Black seven, so Black is a pawn up. The pawn on d4 is attacked three times, by the pawn on c3, the knight on f3 and the queen on d1, and defended three times, by the queen on d8, the knight on c6 and the bishop on c5, and White's pawn on e4 is attacked by the pawn on f5 and defended by nothing."
          fr: "Comptez les pions : six pour les Blancs, sept pour les Noirs, si bien que les Noirs ont un pion d'avance. Le pion d4 est attaqué trois fois, par le pion c3, le cavalier f3 et la dame d1, et défendu trois fois, par la dame d8, le cavalier c6 et le fou c5, et le pion e4 des Blancs est attaqué par le pion f5 et défendu par rien."
        plan:
          vi: 'Trắng phải quyết định về thế căng: cxd4 ăn tốt d4 bằng tốt c, còn exf5 đưa tốt e4 ra khỏi tầm đánh bằng cách ăn f5. Đen sẽ ăn e4 bằng ...fxe4 nếu con tốt bị bỏ lại, và phát triển bằng ...Nf6.'
          en: 'White has to decide about the tension: cxd4 takes the pawn on d4 with the c-pawn, while exf5 takes the pawn on f5 and so takes the pawn on e4 out of its reach. Black will take on e4 with ...fxe4 if that pawn is left alone, and develops with ...Nf6.'
          fr: 'Les Blancs doivent décider de la tension : cxd4 prend le pion d4 avec le pion c, tandis que exf5 prend le pion f5 et met ainsi le pion e4 hors de sa portée. Les Noirs prendront en e4 par ...fxe4 si ce pion est laissé seul, et se développent par ...Nf6.'
        basis:
          by: chan
          at: '2026-09-30'
