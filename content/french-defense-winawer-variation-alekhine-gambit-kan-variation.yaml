    fr: Voici la position après 1.e4 e6 2.d4 d5 3.Nc3 Bb4 4.Ne2 dxe4 5.a3 Bxc3+ 6.Nxc3, où c'est aux
      Noirs de choisir un plan. Cette entrée suit spécifiquement Nc6, la Kan Variation.
