                tác dụng.
              en:
                Black completes development and looks to prove the extra tempo was worth it. White continues
                natural development, aiming to open the position where the gambit's activity can
                tell.
              fr:
                Les Noirs terminent leur développement et cherchent à prouver que le temps investi en valait la
                peine. Les Blancs poursuivent un développement naturel, cherchant à ouvrir la
                position là où l'activité du gambit peut se faire sentir.
