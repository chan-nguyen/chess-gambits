            evaluation:
              vi:
                'Đếm quân: Đen thừa 1 mã, Trắng thừa 1 tượng. Cộng thêm tốt (Trắng 7, Đen 7), tính ra hai bên
                ngang nhau. Cả hai vua đều chưa nhập thành, vẫn còn đứng giữa bàn cờ.'
              en:
                'Counting the pieces: Black has an extra knight, White has an extra bishop. With the pawns at 7
                for White and 7 for Black, that is a level position. Neither king has castled yet;
                both are still in the centre.'
              fr:
                "En comptant les pièces : les Noirs ont un cavalier de plus et les Blancs ont un fou de plus.
                Avec les pions (7 pour les Blancs, 7 pour les Noirs), cela fait une position égale.
                Aucun des deux rois n'a encore roqué ; tous deux restent au centre."
