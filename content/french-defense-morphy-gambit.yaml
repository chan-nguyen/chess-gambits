id: french-defense-morphy-gambit
name: 'French Defense: Morphy Gambit'
eco: C00
category: gambit
side: white
definingLine: [e4, e6, d4, d5, Nh3]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. The knight develops to the rim and does nothing to defend e4, so Black is
      simply better for taking a clean pawn. No engine was consulted and no database was
      queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa đưa mã ra h3 thay vì bảo vệ tốt e4 bằng Nc3 hay Nd2 như thường lệ. Con tốt e4 giờ không còn ai đỡ.
    en: White has just developed the knight to h3 instead of defending the e4 pawn with the usual Nc3 or Nd2. The e4 pawn is now defended by nothing.
    fr: Les Blancs viennent de développer le cavalier en h3 au lieu de défendre le pion e4 par les habituels Nc3 ou Nd2. Le pion e4 n'est désormais plus défendu.
  dismissRest:
    reason:
      vi: Đen không ăn tốt e4 — phát triển bằng 3...Nf6 hay chơi 3...c5. Mỗi lựa chọn để nguyên con tốt e4 trên bàn cờ, nghĩa là lời mời vẫn chưa hề được nhận.
      en: Black does not take the e4 pawn — developing with 3...Nf6 or playing 3...c5. Each leaves the e4 pawn sitting on the board, meaning the invitation has still not actually been accepted.
      fr: Les Noirs ne prennent pas le pion e4 — développant par 3...Cf6 ou jouant 3...c5. Chacun laisse le pion e4 sur l'échiquier, ce qui veut dire que l'invitation n'a toujours pas été acceptée.
  children:
    - ply: dxe4
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen ăn con tốt ngay lập tức bằng tốt d, quân duy nhất có thể ăn tại đó. Không có gì phức tạp, con tốt e4 chỉ đơn giản là bị treo.
        en: Black takes the pawn at once with the d-pawn, the only piece that can capture there. There is nothing complicated here — the e4 pawn is simply hanging.
        fr: Les Noirs prennent aussitôt le pion avec le pion d, la seule pièce pouvant capturer là. Il n'y a rien de compliqué ici, le pion e4 est simplement en prise.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy. Đen hơn đúng một tốt sạch, và con mã h3 của Trắng đứng ở rìa bàn cờ, chưa làm được gì để bù lại.
          en: Count the pawns and it is eight for Black, seven for White. Black is a clean pawn up, and White's knight on h3 stands on the rim of the board, with nothing to show for the pawn yet.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs. Les Noirs ont un pion de plus bien réel, et le cavalier blanc en h3 reste au bord de l'échiquier, sans rien à montrer pour le pion.
        plan:
          vi: Trắng chơi Nc3 hoặc f3 để đòi lại con tốt e4, rồi Bxh3 nếu cần đổi con mã lệch lạc ấy, cố tận dụng nhịp còn lại để bù cho vật chất đã mất. Đen chơi Nf6 và Be7 hay Bb4+, hoàn thiện phát triển và giữ con tốt thừa làm vốn liếng lâu dài.
          en: White plays Nc3 or f3 to win the e4 pawn back, then may trade off the awkward knight if needed, trying to use whatever tempo is left to justify the material spent. Black plays Nf6 and Be7 or Bb4+, completing development and banking the extra pawn as a long-term asset.
          fr: Les Blancs jouent Nc3 ou f3 pour regagner le pion e4, puis peuvent échanger ce cavalier maladroit si besoin, essayant d'utiliser le temps qui reste pour justifier le matériel dépensé. Les Noirs jouent Nf6 et Be7 ou Bb4+, achevant leur développement et conservant le pion supplémentaire comme atout durable.
        basis:
          by: chan
          at: '2026-09-25'
