id: ruy-lopez-schliemann-defense-tartakower-variation
name: 'Ruy Lopez: Schliemann Defense, Tartakower Variation'
eco: C63
category: gambit
side: black
definingLine: [e4, e5, Nf3, Nc6, Bb5, f5, Nc3, fxe4, Nxe4, Nf6]
soundness:
