tree:
  annotation:
    vi: Tốt c3 vừa đánh tượng b4 và dọn chỗ cho d4. Mục này đi sâu riêng vào 5...Bc5, lui về đúng ô ban đầu.
    en: The c3 pawn has just attacked the bishop on b4 and cleared the way for d4. This entry follows specifically 5...Bc5, retreating to the very square it started on.
    fr: Le pion c3 vient d'attaquer le fou en b4 et de dégager la route de d4. Cette entrée suit spécifiquement 5...Fc5, qui recule sur la case même d'où il était parti.
  dismissRest:
    reason:
      vi: Đen đáp lại 5.c3 bằng một nước khác ngoài 5...Bc5 — lui về a5 (nhánh chính), e7 (Anderssen), d6 (Stone-Ware) hay f8 (Mayet), hay trả lại tốt bằng 5...d5. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 5.c3 with something other than 5...Bc5 — retreating to a5 (the main line), e7 (Anderssen), d6 (Stone-Ware) or f8 (Mayet), or giving the pawn back with 5...d5. Each is outside the scope of this entry.
      fr: Les Noirs répondent à 5.c3 par autre chose que 5...Fc5 — reculant en a5 (la ligne principale), e7 (Anderssen), d6 (Stone-Ware) ou f8 (Mayet), ou rendant le pion par 5...d5. Chacun sort du cadre de cette entrée.
  children:
    - ply: Bc5
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Phòng thủ McDonnell. Tượng lui thẳng về c5, ô nó xuất phát, giữ đường chéo nhắm vào f2 và không để mình bị đẩy đi xa hơn nữa.
        en: The McDonnell Defense. The bishop drops straight back to c5, the square it started on, keeping the diagonal aimed at f2 and refusing to be pushed any further.
        fr: La Défense McDonnell. Le fou recule directement en c5, la case d'où il était parti, gardant la diagonale visant f2 et refusant d'être repoussé davantage.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy — Đen vẫn hơn đúng một tốt. Con tượng đã trở lại đúng vị trí ban đầu của nó, coi như mất một nhịp so với việc đi thẳng ...Bc5-a5 hay -e7, nhưng bù lại nó vẫn nhắm chắc vào f2 mà không phải lo bị đuổi thêm lần nữa.
          en: Count the pawns and it is eight for Black, seven for White — Black is still exactly one pawn up. The bishop is back on its original square, effectively a tempo behind going straight to a5 or e7, but in exchange it still aims firmly at f2 without having to worry about being chased again.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs — les Noirs restent exactement un pion devant. Le fou est revenu sur sa case d'origine, un temps de retard par rapport à un aller direct en a5 ou e7, mais en échange il vise toujours fermement f2 sans craindre d'être encore chassé.
        plan:
          vi: Trắng chơi d4, rồi O-O và tận dụng trung tâm cùng nhịp phát triển để bù cho con tốt đã mất, có thể tính thêm cxd4 mở đường cho cả hai xe. Đen chơi d6 và Nf6, hoàn thiện phát triển và giữ con tốt f4 làm vốn liếng lâu dài.
          en: White plays d4, then O-O, using the centre and the development lead to make up for the lost pawn, with cxd4 later opening lines for both rooks. Black plays d6 and Nf6, completing development and banking the extra pawn as a long-term asset.
          fr: Les Blancs jouent d4, puis O-O, utilisant le centre et l'avance de développement pour compenser le pion perdu, avec cxd4 plus tard pour ouvrir des lignes aux deux tours. Les Noirs jouent d6 et Nf6, achevant leur développement et conservant le pion supplémentaire comme atout durable.
        basis:
          by: chan
          at: '2026-09-25'
