# Scandinavian Defense: Boehnke Gambit. Frozen defining line 1.e4 d5 2.exd5 e5 3.dxe6 Bxe6,
# which ends on Black's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). The line below was replayed with chess.js before being annotated.
id: scandinavian-defense-boehnke-gambit
name: 'Scandinavian Defense: Boehnke Gambit'
eco: B01
category: gambit
side: black
definingLine: [e4, d5, exd5, e5, dxe6, Bxe6]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. Black offers a second pawn with 2...e5, and after the en passant capture
      and recapture Black is simply down a pawn with an open position and a developed bishop
      to show for it — real activity, but not shown to be worth the pawn, and known
      assessment holds that White keeps the extra material with accurate play. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Sau 2.exd5, thay vì đòi lại tốt ngay bằng Qxd5 hay Nf6, Đen chơi 2...e5!?, mời Trắng ăn thêm một tốt nữa qua đường để đổi lấy tượng phát triển sớm và các đường mở.
    en: After 2.exd5, instead of winning the pawn straight back with Qxd5 or Nf6, Black plays 2...e5!?, inviting White to take yet another pawn en passant in exchange for an early developed bishop and open lines.
    fr: Après 2.exd5, au lieu de reprendre aussitôt le pion par Qxd5 ou Nf6, les Noirs jouent 2...e5!?, invitant les Blancs à prendre un pion de plus en passant en échange d'un fou développé tôt et de lignes ouvertes.
  dismissRest:
    reason:
      vi: Trắng không đẩy tốt lên d4. Các nước khác như Nf3 hay Nc3 phát triển trước và để nguyên tình huống trung tâm, và Đen vẫn tiếp tục phát triển bình thường mà không gặp vấn đề gì đặc biệt.
      en: White does not push the pawn to d4. Anything else, such as Nf3 or Nc3 developing first, leaves the central situation as it is, and Black simply continues developing normally without any particular problem.
      fr: Les Blancs ne poussent pas le pion en d4. Tout le reste, comme Nf3 ou Nc3 qui développent d'abord, laisse la situation centrale telle quelle, et les Noirs poursuivent simplement leur développement normal sans problème particulier.
  children:
    - ply: d4
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng đẩy tốt lên d4, chiếm thêm không gian trung tâm và chuẩn bị phát triển các quân nhẹ, y hệt cách xử lý một tốt thừa bình thường.
        en: White pushes the pawn to d4, grabbing extra central space and preparing to develop the minor pieces, handling the extra pawn just like an ordinary one.
        fr: Les Blancs poussent le pion en d4, gagnant de l'espace central supplémentaire et se préparant à développer les pièces mineures, traitant ce pion supplémentaire comme n'importe quel autre.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 38 còn Đen 37 — Trắng hơn đúng một tốt sạch. Đen cũng không còn tốt d hay tốt e nào nữa, nghĩa là các ô d5 và e5 sẽ không bao giờ còn được một con tốt Đen nào kiểm soát lại, trong khi con tốt d4 vừa đẩy của Trắng chiếm trung tâm mà chẳng bị tranh chấp.
          en: Count the pawns, 38 for White against 37 for Black — White is a clean pawn up. Black also no longer has a d-pawn or an e-pawn at all, meaning the d5 and e5 squares can never be covered by a black pawn again, while White's newly pushed d4 pawn claims the centre completely uncontested.
          fr: Comptez les pions, 38 pour les Blancs contre 37 pour les Noirs — les Blancs ont un pion de plus tout net. Les Noirs n'ont plus non plus de pion d ni de pion e, ce qui signifie que les cases d5 et e5 ne pourront plus jamais être couvertes par un pion noir, tandis que le pion d4 blanc, tout juste avancé, occupe le centre sans la moindre contestation.
        plan:
          vi: Trắng chơi Nf3, Nc3 và Bd3 hay Be2, hoàn tất phát triển đằng sau trung tâm vững chắc và giữ nguyên con tốt thừa. Đen chơi Nf6, Nd7 hay c6, dựa vào tượng e6 đã phát triển cùng lối chơi thoáng đãng để tìm bù đắp phần nào cho con tốt đã mất.
          en: White plays Nf3, Nc3 and Bd3 or Be2, finishing development behind a solid centre and holding on to the extra pawn. Black plays Nf6, Nd7 or c6, relying on the already-developed bishop on e6 and open piece play to look for some compensation for the lost pawn.
          fr: Les Blancs jouent Nf3, Nc3 et Bd3 ou Be2, achevant leur développement derrière un centre solide et conservant le pion supplémentaire. Les Noirs jouent Nf6, Nd7 ou c6, comptant sur le fou déjà développé en e6 et un jeu dégagé pour chercher une certaine compensation au pion perdu.
        basis:
          by: chan
          at: '2026-09-25'
