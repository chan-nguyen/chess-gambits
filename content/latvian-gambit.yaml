    - ply: d4
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Phản gambit Mason. Trắng đánh vào con tốt e5 bằng tốt d4 thay vì ăn nó bằng mã, và giữ nguyên căng thẳng ở cả hai ô e5 và f5. Đây là cách chơi theo nguyên tắc, đó là trả lời một đòn đánh ở cánh bằng một đòn ở trung tâm.
        en: The Mason Countergambit. White hits the e5 pawn with d4 instead of taking it with the knight, keeping the tension on both e5 and f5. It is the principled treatment — answer a flank thrust with a blow in the centre.
        fr: Le Contre-gambit Mason. Les Blancs frappent le pion e5 par d4 au lieu de le prendre du cavalier, en maintenant la tension sur e5 et f5. C'est le traitement de principe — répondre à une poussée d'aile par un coup au centre.
      children:
        - ply: fxe4
          annotation:
            vi: Đen ăn ở e4 và mở cột f. Con tốt e5 bây giờ bị cả mã f3 lẫn tốt d4 đánh, nên nó sẽ rơi ngay ở nước sau, và vật chất trở lại cân bằng sau Nxe5.
            en: Black takes on e4 and opens the f-file. The e5 pawn is now attacked by both the knight on f3 and the d4 pawn, so it falls next move and the material is level again after Nxe5.
            fr: Les Noirs prennent en e4 et ouvrent la colonne f. Le pion e5 est désormais attaqué par le cavalier f3 et le pion d4, il tombera donc au coup suivant et le matériel redeviendra égal après Nxe5.
          unsettled: >-
            Nxe5 and dxe5 are going free, and the evaluation says Black is a pawn up for exactly one move because e5 is attacked twice and defended not at all. The recapture is forced in practice and the leaf describes the position after it.
          outcome:
            type: position
            evaluation:
              vi: Đen hơn một tốt trong đúng một nước, vì con tốt e5 bị đánh hai lần và không ai đỡ. Sau Nxe5 thì vật chất cân bằng, Trắng có con mã đứng ở e5 và một trung tâm với tốt d4, còn Đen có con tốt e4 cắm sâu mà không có tốt nào đỡ cùng một cột f mở nhìn vào vua mình. Đây là dạng thế cờ mà Gambit Latvia thua dần chứ không thua ngay.
              en: Black is a pawn up for exactly one move, because the e5 pawn is attacked twice and defended not at all. After Nxe5 the material is level, White has a knight on e5 and a centre with the d4 pawn, while Black has an unsupported pawn on e4 and an open f-file pointing at his own king. This is the sort of position in which the Latvian loses slowly rather than quickly.
              fr: Les Noirs ont un pion de plus pendant exactement un coup, car le pion e5 est attaqué deux fois et défendu pas du tout. Après Nxe5, le matériel est égal, les Blancs ont un cavalier en e5 et un centre avec le pion d4, tandis que les Noirs ont un pion e4 sans soutien et une colonne f ouverte braquée sur leur propre roi. C'est le genre de position où le Gambit letton perd lentement plutôt que vite.
            plan:
              vi: Đen chơi Nf6 hoặc d6 để đuổi con mã e5, rồi Nc6 ép vào d4, Be7, Be6 và O-O, và cố giữ con tốt e4 bằng d5. Nếu con tốt e4 rơi mà không được gì thì Đen chỉ còn một cột f hỏng. Trắng chơi Nxe5 rồi Nc3 đánh vào e4, Bf4 hay Be3, Qd2 hoặc Be2 và nhập thành, và nước phá là d5 hay f3 để mở thêm đường vào vua Đen.
              en: Black plays ...Nf6 or ...d6 to chase the knight off e5, then ...Nc6 to press d4, ...Be7, ...Be6 and castles, and tries to hold the e4 pawn with ...d5. If the e4 pawn falls for nothing, all Black has left is a damaged f-file. White plays Nxe5, then Nc3 against e4, Bf4 or Be3, Qd2 or Be2 and castles, and the break is d5 or f3 to open more lines at the black king.
              fr: Les Noirs jouent ...Nf6 ou ...d6 pour chasser le cavalier d'e5, puis ...Nc6 pour peser sur d4, ...Be7, ...Be6 et roquent, en tentant de tenir le pion e4 par ...d5. Si le pion e4 tombe pour rien, il ne reste aux Noirs qu'une colonne f abîmée. Les Blancs jouent Nxe5, puis Nc3 contre e4, Bf4 ou Be3, Qd2 ou Be2 et roquent, la rupture étant d5 ou f3 pour ouvrir davantage de lignes vers le roi noir.
