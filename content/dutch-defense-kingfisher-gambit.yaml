tree:
  annotation:
    vi: 'Trắng vừa chơi 3.e4, hiến một tốt: tốt e4 bị tốt d5 và tốt f5 tấn công và chỉ có mã c3 bảo vệ, còn nó tấn công cả d5 lẫn f5.'
    en: 'White has just played 3.e4, offering a pawn: the e4 pawn is attacked by the d5 and f5 pawns and defended only by the knight on c3, while it attacks both d5 and f5.'
    fr: "Les Blancs viennent de jouer 3.e4, offrant un pion : le pion e4 est attaqué par les pions d5 et f5 et défendu seulement par le cavalier c3, tandis qu'il attaque à la fois d5 et f5."
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 3...fxe4. Bài này chỉ đi theo nhánh ăn tốt 3...fxe4; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 3...fxe4 here. This entry follows the capture 3...fxe4 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 3...fxe4. Cette fiche ne suit que la prise 3...fxe4 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: fxe4
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen ăn tốt bằng 3...fxe4. Tốt mới ở e4 bị mã c3 tấn công và được tốt d5 bảo vệ.
        en: Black takes the pawn with 3...fxe4. The new pawn on e4 is attacked by the knight on c3 and defended by the d5 pawn.
        fr: Les Noirs prennent le pion par 3...fxe4. Le nouveau pion e4 est attaqué par le cavalier c3 et défendu par le pion d5.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt mà chưa có gì bù lại. Tốt e4 bị mã c3 tấn công và được tốt d5 bảo vệ, còn tốt d5 bị cùng con mã đó tấn công và được hậu d8 bảo vệ, nên cả Nxe4 lẫn Nxd5 đều chỉ đổi mã lấy một tốt.'
          en: 'Count the pawns: White seven, Black eight, so White is a pawn down with nothing yet to show for it. The pawn on e4 is attacked by the knight on c3 and defended by the d5 pawn, and the pawn on d5 is attacked by the same knight and defended by the queen on d8, so both Nxe4 and Nxd5 would only trade the knight for a pawn.'
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins sans rien avoir en échange pour l'instant. Le pion e4 est attaqué par le cavalier c3 et défendu par le pion d5, et le pion d5 est attaqué par ce même cavalier et défendu par la dame d8 : Nxe4 comme Nxd5 n'échangeraient le cavalier que contre un pion."
        plan:
          vi: Trắng tấn công e4 lần thứ hai bằng f3 hoặc phát triển bằng Bg5; Đen thêm quân bảo vệ bằng ...Nf6 hoặc ...Bf5 và giữ tốt.
          en: White attacks e4 a second time with f3 or develops with Bg5; Black adds a defender with ...Nf6 or ...Bf5 and keeps the pawn.
          fr: Les Blancs attaquent e4 une seconde fois par f3 ou se développent par Bg5 ; les Noirs ajoutent un défenseur par ...Nf6 ou ...Bf5 et gardent le pion.
        basis:
          by: chan
          at: '2026-09-30'
