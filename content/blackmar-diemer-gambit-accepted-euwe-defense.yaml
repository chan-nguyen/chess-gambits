# Blackmar-Diemer Gambit Accepted: Euwe Defense. Frozen defining line 1.d4 d5 2.e4 dxe4
# 3.Nc3 Nf6 4.f3 exf3 5.Nxf3, which ends on White's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 5...e6: Black opens a line
# for the dark-squared bishop and shields the kingside solidly. Nothing is hanging at the
# resulting position. searchMate at 4 moves from this position returns no-mate, so no forced
# mate is claimed anywhere in this entry.
id: blackmar-diemer-gambit-accepted-euwe-defense
name: 'Blackmar-Diemer Gambit Accepted: Euwe Defense'
eco: D00
category: gambit
side: white
definingLine: [d4, d5, e4, dxe4, Nc3, Nf6, f3, exf3, Nxf3]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement, and the same label the catalogue's family rule carries. White has real,
      fast development for the pawn once both pieces have recaptured on f3, but Euwe's solid
      ...e6 gives Black a sound, well-tested way to hold the extra material. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Sau khi ăn cả hai lần rồi để mã ăn lại ở f3, Trắng đã đổi hẳn con tốt lấy nhịp phát triển. Đen chọn cách phòng thủ chắc chắn nhất trong tất cả các cách đáp lại.
    en: Having recaptured twice and let the knight take back on f3, White has fully traded the pawn for development. Black chooses the most solid of all the ways to answer it.
    fr: Après avoir repris deux fois et laissé le cavalier reprendre en f3, les Blancs ont pleinement échangé le pion contre du développement. Les Noirs choisissent la plus solide de toutes les réponses possibles.
  dismissRest:
    reason:
      vi: Đen không chơi 5...e6. Các nước như g6 theo lối Bogoljubow Defense hay Bf5 theo lối Vienna Defense cũng giữ được con tốt thừa nhưng theo cách khác, mỗi cách có trang riêng của nó.
      en: Black does not play 5...e6. Moves such as ...g6 in Bogoljubow Defense style or ...Bf5 in Vienna Defense style also keep the extra pawn but in a different way, each with its own page.
      fr: Les Noirs ne jouent pas 5...e6. Des coups comme ...g6 à la manière de la Défense Bogoljubow ou ...Bf5 à la manière de la Défense Vienna gardent eux aussi le pion supplémentaire mais d'une autre façon, chacun avec sa propre page.
  children:
    - ply: e6
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen chơi nước phòng thủ chắc chắn và ít rủi ro nhất, mở đường cho tượng f8 và không tạo ra điểm yếu nào ở cánh vua.
        en: Black plays the soundest and least risky of all the defences, opening a line for the f8 bishop without creating any weakness on the kingside.
        fr: Les Noirs jouent la défense la plus solide et la moins risquée de toutes, ouvrant une ligne pour le fou f8 sans créer la moindre faiblesse à l'aile roi.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen bảy, Trắng sáu, Trắng kém một tốt. Đổi lại, cả hai mã Trắng đã ra ngoài và tượng c1 sẵn sàng phát triển, trong khi Đen mới chỉ đưa ra một mã và chưa nhập thành. Cấu trúc tốt của Đen hoàn toàn lành lặn, không có điểm yếu nào để Trắng nhắm vào ngay lập tức.
          en: Count the pawns and it is seven for Black, six for White, White a pawn down. In return both white knights are already out and the c1 bishop is ready to develop, while Black has only the one knight out and has not castled yet. Black's pawn structure is completely sound, with no weakness for White to aim at right away.
          fr: Comptez les pions, sept pour les Noirs, six pour les Blancs, les Blancs ont un pion de moins. En échange, les deux cavaliers blancs sont déjà sortis et le fou c1 est prêt à se développer, tandis que les Noirs n'ont sorti qu'un seul cavalier et n'ont pas encore roqué. La structure de pions noire est parfaitement saine, sans la moindre faiblesse à viser tout de suite pour les Blancs.
        plan:
          vi: Trắng chơi Bc4 hoặc Bd3, Bg5 hay Bf4, O-O và Qe1 hoặc Qe2, dồn quân nhanh vào trung tâm và cánh vua trước khi Đen kịp củng cố hoàn toàn. Đen chơi Be7, O-O và c5 hay b6, hoàn tất phát triển một cách chắc chắn và tìm cách đổi bớt quân để giữ vững con tốt thừa vào tàn cuộc.
          en: White plays Bc4 or Bd3, Bg5 or Bf4, castles and Qe1 or Qe2, throwing pieces at the centre and kingside quickly before Black fully consolidates. Black plays ...Be7, ...O-O and ...c5 or ...b6, completing development soundly and looking to trade pieces to carry the extra pawn into the endgame.
          fr: Les Blancs jouent Bc4 ou Bd3, Bg5 ou Bf4, roquent et Qe1 ou Qe2, jetant rapidement leurs pièces sur le centre et l'aile roi avant que les Noirs ne consolident complètement. Les Noirs jouent ...Be7, ...O-O et ...c5 ou ...b6, achevant leur développement solidement et cherchant à échanger des pièces pour porter le pion supplémentaire jusqu'à la finale.
        basis:
          by: chan
          at: '2026-09-25'
