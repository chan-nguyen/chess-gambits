    source: >-
      A judgement. Black offers a queenside pawn for the fianchetto bishop's diagonal and a
      Benko-style lead in development, and the compensation has never been shown short at
      club level. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen vừa đẩy tốt lên b5, thí một tốt cánh hậu để mời Trắng ăn, giống ý tưởng của Benko Gambit nhưng chuyển vào một trật tự nước đi khác của Ấn Độ chống Grünfeld.
    en: Black has just pushed the pawn to b5, offering a queenside pawn for White to take, the same idea as the Benko Gambit transplanted into an Anti-Grünfeld move order.
    fr: Les Noirs viennent de pousser le pion en b5, offrant un pion à l'aile dame que les Blancs peuvent prendre, la même idée que le Gambit Benko transposée dans un ordre de coups anti-Grünfeld.
  dismissRest:
    reason:
      vi: Trắng không ăn tốt b5 — phát triển bằng 4.Nc3 hay chơi 4.e4. Mỗi lựa chọn để nguyên con tốt b5 trên bàn cờ, nghĩa là lời mời vẫn chưa hề được nhận.
      en: White does not take the b5 pawn — developing with 4.Nc3, or playing 4.e4. Each leaves the b5 pawn sitting on the board, meaning the invitation has still not actually been accepted.
      fr: Les Blancs ne prennent pas le pion b5 — développant par 4.Cc3, ou jouant 4.e4. Chacun laisse le pion b5 sur l'échiquier, ce qui veut dire que l'invitation n'a toujours pas été acceptée.
  children:
    - ply: cxb5
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng nhận tốt, quân duy nhất có thể ăn tại đó. Cột b của Đen giờ đã nửa mở, và tượng g7 sắp fianchetto sẽ nhìn suốt đường chéo dài không vướng gì.
        en: White accepts, the only piece that can capture there. Black's b-file is now half-open, and the soon-to-be-fianchettoed g7 bishop will rake an unobstructed long diagonal.
        fr: Les Blancs acceptent, la seule pièce pouvant capturer là. La colonne b noire est désormais semi-ouverte, et le fou g7, bientôt fianchetté, balaiera une grande diagonale sans obstacle.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy — Trắng hơn đúng một tốt. Đổi lại, Đen có cột b nửa mở cho xe và đường chéo dài a1-h8 mở sẵn cho tượng g7 sắp ra, một sự đánh đổi rất giống Benko Gambit.
          en: Count the pawns and it is eight for White, seven for Black — White is exactly one pawn up. In exchange, Black has the half-open b-file for a rook and the a1-h8 diagonal already open for the soon-to-develop g7 bishop, a trade very much in the Benko Gambit spirit.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs — les Blancs ont exactement un pion de plus. En échange, les Noirs ont la colonne b semi-ouverte pour une tour et la diagonale a1-h8 déjà ouverte pour le fou g7 bientôt développé, un échange bien dans l'esprit du Gambit Benko.
        plan:
          vi: Trắng chơi Nc3 và e4, xây dựng trung tâm lớn và giữ vững con tốt thừa trước khi Đen kịp gây sức ép. Đen chơi Bg7 hoàn tất fianchetto, rồi O-O và a6, mở tiếp cột a và tranh chấp lại con tốt trên đường chéo dài.
          en: White plays Nc3 and e4, building a big centre and holding on to the extra pawn before Black can build pressure. Black plays Bg7 to finish the fianchetto, then O-O and a6, opening the a-file too and contesting the pawn along the long diagonal.
          fr: Les Blancs jouent Nc3 et e4, bâtissant un grand centre et gardant le pion supplémentaire avant que les Noirs ne puissent faire pression. Les Noirs jouent Bg7 pour achever le fianchetto, puis O-O et a6, ouvrant aussi la colonne a et disputant le pion le long de la grande diagonale.
        basis:
          by: chan
          at: '2026-09-25'
