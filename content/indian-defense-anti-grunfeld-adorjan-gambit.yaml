# being written.
id: indian-defense-anti-grunfeld-adorjan-gambit
name: 'Indian Defense: Anti-Grünfeld, Adorjan Gambit'
eco: E60
category: gambit
side: black
definingLine: [d4, Nf6, c4, g6, d5, b5]
soundness:
  value: dubious
