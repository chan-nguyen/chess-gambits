tree:
  annotation:
    vi: Trắng vừa chơi 4.Bg5, đưa quân tượng thứ hai ra. Tượng g5 tấn công mã f6, được các tốt e7 và g7 bảo vệ, còn tượng d3 tấn công h7, được xe và mã bảo vệ. Trắng thiếu một tốt.
    en: White has just played 4.Bg5, bringing the second bishop out. The bishop on g5 attacks the f6 knight, which the e7 and g7 pawns defend, and the bishop on d3 attacks h7, which the rook and the knight defend. White is a pawn down.
    fr: Les Blancs viennent de jouer 4.Bg5, sortant le second fou. Le fou g5 attaque le cavalier f6, que les pions e7 et g7 défendent, et le fou d3 attaque h7, que la tour et le cavalier défendent. Les Blancs sont un pion en moins.
  dismissRest:
    reason:
      vi: Đen chơi nước khác thay vì 4...e6 ở đây. Mục này chỉ đi theo 4...e6; các nước còn lại dẫn tới những biến chưa được lập bản đồ ở đây.
      en: Black plays something other than 4...e6 here. This entry follows 4...e6 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 4...e6 ici. Cette entrée ne suit que 4...e6 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: e6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen chơi 4...e6, mở đường chéo cho tượng f8. Mã f6 vẫn được bảo vệ, giờ bằng hậu và tốt g7.
        en: Black plays 4...e6, opening the diagonal of the f8 bishop. The f6 knight is still defended, now by the queen and the g7 pawn.
        fr: Les Noirs jouent 4...e6, ouvrant la diagonale du fou f8. Le cavalier f6 reste défendu, maintenant par la dame et le pion g7.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng thiếu một tốt. Trắng đã đưa cả hai tượng ra so với một quân đã phát triển của Đen; tượng d3 tấn công h7, được xe và mã bảo vệ, còn tượng g5 tấn công f6, được hậu và tốt g7 bảo vệ.'
          en: 'Count the pawns: White seven, Black eight, so White is a pawn down. White has both bishops out against one developed Black piece; the bishop on d3 attacks h7, which the rook and the knight defend, and the bishop on g5 attacks f6, which the queen and the g7 pawn defend.'
          fr: 'Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins. Les Blancs ont sorti leurs deux fous contre une seule pièce noire développée ; le fou d3 attaque h7, que la tour et le cavalier défendent, et le fou g5 attaque f6, que la dame et le pion g7 défendent.'
        plan:
          vi: Trắng chơi Nf3 và O-O, giữ sức ép lên h7. Đen hỏi tượng g5 bằng ...h6, rồi phát triển bằng ...Be7 và ...d5.
          en: White plays Nf3 and O-O, keeping the pressure on h7. Black asks the g5 bishop what it intends with ...h6, then develops with ...Be7 and ...d5.
          fr: Les Blancs jouent Nf3 et O-O, gardant la pression sur h7. Les Noirs interrogent le fou g5 par ...h6, puis se développent par ...Be7 et ...d5.
        basis:
          by: chan
          at: 2026-10-01
