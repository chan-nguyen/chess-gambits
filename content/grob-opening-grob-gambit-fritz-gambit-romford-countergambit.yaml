      annotation:
        vi: Romford Countergambit. Đen chơi Qxa8, ăn tượng trên a8.
        en: The Romford Countergambit. Black plays Qxa8, capturing the bishop on a8.
        fr: Le Romford Countergambit. Les Noirs jouent Qxa8, en prenant le fou en a8.
      outcome:
        type: position
        evaluation:
          vi:
            'Đếm quân: Đen thừa 1 tượng, Trắng thừa 1 xe. Cộng thêm tốt (Trắng 7, Đen 7), tính ra Trắng hơn
            khoảng 2 tốt quy đổi. Cả hai vua đều chưa nhập thành, vẫn còn đứng giữa bàn cờ.'
          en:
            "Counting the pieces: Black has an extra bishop, White has an extra rook. With the pawns at 7
            for White and 7 for Black, that is White ahead by roughly 2 pawns' worth of material.
            Neither king has castled yet; both are still in the centre."
          fr:
            "En comptant les pièces : les Noirs ont un fou de plus et les Blancs ont une tour de plus. Avec
            les pions (7 pour les Blancs, 7 pour les Noirs), cela fait les Blancs en avance
            d'environ 2 pions de matériel. Aucun des deux rois n'a encore roqué ; tous deux restent
            au centre."
        plan:
          vi:
            Trắng tìm cách giữ vững phần quân vừa giành được và hoàn thiện phát triển mà không để đối phương
            lấy lại thế chủ động. Đen tìm cách chơi tích cực với các quân còn lại để gây khó khăn dù
            đang kém quân.
          en:
            White looks to consolidate the material just won and complete development without handing back
            the initiative. Black looks for active piece play to create practical problems despite
            being down material.
          fr:
            Les Blancs cherchent à consolider le matériel tout juste gagné et à terminer leur développement
            sans rendre l'initiative. Les Noirs cherchent un jeu de pièces actif pour créer des
            problèmes pratiques malgré leur déficit de matériel.
        basis:
          by: chan
          at: 2026-09-29
