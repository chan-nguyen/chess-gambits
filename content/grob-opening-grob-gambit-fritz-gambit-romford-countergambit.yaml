    fr: Voici la position après 1.g4 d5 2.Bg2 Bxg4 3.c4 d4 4.Bxb7 Nd7 5.Bxa8, où c'est aux Noirs de
      choisir un plan. Cette entrée suit spécifiquement Qxa8, le Romford Countergambit.
  dismissRest:
    reason:
      vi:
        Đen đáp lại bằng nước khác ngoài Qxa8 — chẳng hạn đưa quân khác ra hoặc nhập thành — dẫn sang
        một nhánh có tên riêng khác của khai cuộc này. Tương quan lực lượng tại đây không đổi dù
