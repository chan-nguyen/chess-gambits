tree:
  annotation:
    vi: Trắng vừa chơi 4.f3, tấn công tốt e4 lần thứ hai. Tốt này bị mã c3 và tốt f3 tấn công mà chỉ có mã f6 bảo vệ; Trắng có bảy tốt, Đen có tám.
    en: White has just played 4.f3, attacking the pawn on e4 a second time. It is attacked by the knight on c3 and the f3 pawn and defended only by the knight on f6; White has seven pawns, Black eight.
    fr: Les Blancs viennent de jouer 4.f3, attaquant le pion e4 une seconde fois. Il est attaqué par le cavalier c3 et le pion f3 et défendu seulement par le cavalier f6 ; les Blancs ont sept pions, les Noirs huit.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 4...d5. Bài này chỉ đi theo nhánh 4...d5; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 4...d5 here. This entry follows the reply 4...d5 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 4...d5. Cette fiche ne suit que la réponse 4...d5 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: d5
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen hỗ trợ tốt e4 bằng 4...d5, nên tốt này được bảo vệ hai lần, bởi mã f6 và tốt d5, trước hai quân tấn công.
        en: Black supports the e4 pawn with 4...d5, so it is defended twice, by the knight on f6 and the d5 pawn, against two attackers.
        fr: 'Les Noirs soutiennent le pion e4 par 4...d5 : il est ainsi défendu deux fois, par le cavalier f6 et le pion d5, face à deux attaquants.'
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt. Tốt e4 của Đen bị mã c3 và tốt f3 tấn công hai lần và được mã f6 và tốt d5 bảo vệ hai lần. Đen có hai tốt trên cột e, ở e7 và e4, còn Trắng không còn tốt e.'
          en: "Count the pawns: White seven, Black eight, so White is a pawn down. Black's pawn on e4 is attacked twice, by the knight on c3 and the f3 pawn, and defended twice, by the knight on f6 and the pawn on d5. Black has two pawns on the e-file, on e7 and e4, while White has no e-pawn."
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins. Le pion e4 noir est attaqué deux fois, par le cavalier c3 et le pion f3, et défendu deux fois, par le cavalier f6 et le pion d5. Les Noirs ont deux pions sur la colonne e, en e7 et en e4, alors que les Blancs n'ont plus de pion e."
        plan:
          vi: Trắng có thể ăn e4 bằng fxe4 hoặc phát triển bằng Bg5, đánh vào mã đang bảo vệ tốt. Đen có thể ăn lại bằng ...exf3, hoặc phát triển bằng ...Bf5 hay ...e6 và giữ tốt.
          en: White can take on e4 with fxe4 or develop with Bg5, hitting the knight that defends the pawn. Black can take again with ...exf3, or develop with ...Bf5 or ...e6 and keep the pawn.
          fr: Les Blancs peuvent prendre en e4 par fxe4 ou se développer par Bg5, attaquant le cavalier qui défend le pion. Les Noirs peuvent reprendre par ...exf3, ou se développer par ...Bf5 ou ...e6 en gardant le pion.
        basis:
          by: chan
          at: '2026-09-30'
