# Carr Defense: Zilbermints Gambit. Frozen defining line 1.e4 h6 2.d4 e5, which ends on
# Black's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). The line
# below was replayed with chess.js before being annotated.
id: carr-defense-zilbermints-gambit
name: 'Carr Defense: Zilbermints Gambit'
eco: B00
category: gambit
side: black
definingLine: [e4, h6, d4, e5]
soundness:
  value: unsound
  reviewedAt: '2026-09-18'
  basis:
    by: chan
    at: '2026-09-18'
    source: >-
      A judgement. White simply takes the pawn with dxe5 and it stays taken — the extra tempo
      spent on 1...h6 has bought Black nothing concrete in return. No engine was consulted
      and no database was queried.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Sau nước đi lạ 1...h6, Đen chơi tiếp 2...e5, một con tốt không được quân nào đỡ, mời Trắng ăn nó dù chưa có sự chuẩn bị nào bù lại ngoài nước h6 đã bỏ ra.
    en: After the odd 1...h6, Black follows up with 2...e5, an undefended pawn, offering it with no real preparation to show for it beyond the tempo already spent on h6.
    fr: Après l'insolite 1...h6, les Noirs enchaînent avec 2...e5, un pion non défendu, l'offrant sans véritable préparation à montrer en retour, hormis le temps déjà dépensé sur h6.
  dismissRest:
    reason:
      vi: Trắng không ăn con tốt e5. Các nước khác như Nf3 hay Nc3 để nguyên con tốt e5 trên bàn cờ, nghĩa là lời mời vẫn chưa hề được nhận.
      en: White does not take the e5 pawn. Anything else, such as Nf3 or Nc3, leaves the e5 pawn sitting on the board, meaning the offer has still not actually been accepted.
      fr: Les Blancs ne prennent pas le pion e5. Tout le reste, comme Nf3 ou Nc3, laisse le pion e5 sur l'échiquier, ce qui veut dire que l'offre n'a toujours pas été acceptée.
  children:
    - ply: dxe5
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng ăn con tốt ngay lập tức bằng tốt d, quân duy nhất có thể ăn tại đó. Con tốt e5 không được quân Đen nào đỡ nên đây đơn giản là ăn một tốt miễn phí.
        en: White takes the pawn at once with the d-pawn, the only piece that can capture there. The e5 pawn is defended by nothing of Black's, so this is simply picking up a free pawn.
        fr: Les Blancs prennent aussitôt le pion avec le pion d, la seule pièce pouvant capturer là. Le pion e5 n'est défendu par rien du côté noir, il s'agit donc simplement de ramasser un pion gratuit.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy. Trắng hơn đúng một tốt sạch, và ngoài ra Đen còn phải bỏ ra một nhịp cho nước h6 không phục vụ mục đích gì cụ thể ở đây. Chưa có gì bù lại được cả vật chất lẫn nhịp độ đã mất.
          en: Count the pawns and it is eight for White, seven for Black. White is a clean pawn up, and on top of that Black has spent a tempo on h6 that serves no concrete purpose here. Nothing has compensated for either the material or the tempo lost.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs. Les Blancs ont un pion de plus bien réel, et en plus les Noirs ont dépensé un temps sur h6 qui ne sert ici aucun but concret. Rien n'a compensé ni le matériel ni le temps perdus.
        plan:
          vi: Trắng chơi Nf3, Nc3 và Bc4 hay Bb5+, phát triển nhanh và giữ vững con tốt thừa trước khi Đen kịp tổ chức lại. Đen chơi Nc6 hay Bc5, Nf6 và d6, cố gây sức ép lên con tốt e5 và bắt kịp phát triển sau khi đã mất một nhịp vào h6.
          en: White plays Nf3, Nc3 and Bc4 or Bb5+, developing quickly and holding the extra pawn before Black can regroup. Black plays Nc6 or Bc5, Nf6 and d6, trying to pressure the e5 pawn and catch up in development after having spent a tempo on h6.
          fr: Les Blancs jouent Nf3, Nc3 et Bc4 ou Bb5+, se développant rapidement et gardant fermement le pion supplémentaire avant que les Noirs ne puissent se réorganiser. Les Noirs jouent Nc6 ou Bc5, Nf6 et d6, en essayant de faire pression sur le pion e5 et de rattraper leur développement après avoir dépensé un temps sur h6.
        basis:
          by: chan
          at: '2026-09-18'
