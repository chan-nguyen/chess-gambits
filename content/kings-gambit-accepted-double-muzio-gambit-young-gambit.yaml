            vi: Trắng đơn giản ăn tốt đang bỏ trống trên e3 bằng Qxe3, vì không còn quân nào bảo vệ nó.
            en: White simply picks up the loose pawn on e3 with Qxe3, since nothing was left to defend it.
            fr:
              Les Blancs ramassent tout simplement le pion laissé sans défense en e3 par Qxe3, puisque plus
