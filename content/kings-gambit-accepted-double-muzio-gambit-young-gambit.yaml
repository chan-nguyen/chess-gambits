          outcome:
            type: position
            evaluation:
              vi:
                'Đếm quân: Đen thừa 1 mã, Đen thừa 2 tượng. Cộng thêm tốt (Trắng 6, Đen 5), tính ra Đen hơn
                khoảng 8 tốt quy đổi. Vua Trắng đã an toàn sau khi nhập thành, trong khi vua Đen đã
                rời trung tâm tới f7 mà chưa nhập thành.'
              en:
                "Counting the pieces: Black has an extra knight, Black has 2 extra bishops. With the pawns at 6
                for White and 5 for Black, that is Black ahead by roughly 8 pawns' worth of
                material. White's king is already safe after castling, while Black's king has
                already moved to f7, without castling."
              fr:
                "En comptant les pièces : les Noirs ont un cavalier de plus et les Noirs ont 2 fous de plus.
                Avec les pions (6 pour les Blancs, 5 pour les Noirs), cela fait les Noirs en avance
                d'environ 8 pions de matériel. Le roi blanc est déjà en sécurité après le roque,
                tandis que le roi noir a déjà bougé en f7 sans avoir roqué."
            plan:
              vi:
                Đen tìm cách giữ vững phần vật chất hơn, đổi quân khi thuận lợi và hoàn thiện phát triển mà
                không mạo hiểm. Trắng chơi vì tốc độ phát triển và các đường mở nhắm vào vua Đen, cố
                gắng chứng minh giá trị của quân đã thí trước khi đối phương kịp gỡ rối.
              en:
                Black looks to consolidate the extra material, trade pieces when it is convenient, and finish
                development without taking risks. White plays for rapid development and open lines
                toward the black king, trying to make the sacrifice count before Black untangles.
              fr:
                Les Noirs cherchent à consolider le surplus de matériel, échanger les pièces quand cela les
                arrange, et terminer leur développement sans prendre de risques. Les Blancs jouent
                pour un développement rapide et des lignes ouvertes vers le roi noir, essayant de
                rentabiliser le sacrifice avant que les Noirs ne se démêlent.
