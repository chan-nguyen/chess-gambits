# Englund Gambit: Felbecker Gambit. Frozen defining line 1.d4 e5 2.dxe5 Nc6 3.Nf3 Bc5,
# which ends on Black's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5). The line below was replayed with chess.js before being annotated.
id: englund-gambit-felbecker-gambit
name: 'Englund Gambit: Felbecker Gambit'
eco: A40
category: gambit
side: black
definingLine: [d4, e5, dxe5, Nc6, Nf3, Bc5]
soundness:
  value: dubious
  reviewedAt: '2026-09-21'
  basis:
    by: chan
    at: '2026-09-21'
    source: >-
      A judgement. The bishop eyes f2 rather than the e5 pawn, which is a real idea against
      careless play, but a calm defensive move takes the sting out of it and leaves Black a
      clean pawn down. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-21'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Thay vì đưa hậu ra e7 để đòi lại tốt e5, Đen chơi 3...Bc5, nhắm thẳng vào ô f2 và chuẩn bị doạ những mánh khoé chiến thuật nếu Trắng bất cẩn.
    en: Instead of bringing the queen to e7 to press on the e5 pawn, Black plays 3...Bc5, aiming straight at the f2 square and setting up tactical tricks if White is careless.
    fr: Au lieu d'amener la dame en e7 pour presser le pion e5, les Noirs jouent 3...Bc5, visant directement la case f2 et préparant des pièges tactiques en cas d'imprudence blanche.
  dismissRest:
    reason:
      vi: Trắng không chơi một nước vừa an toàn vừa loại bỏ mọi mánh khoé trên đường chéo b8-h2. Các nước khác ở đây, như Nc3 hay Bf4, cũng phát triển hợp lý nhưng để lại ít nhiều khả năng cho Đen tận dụng đường chéo đó, nên không rõ ràng bằng nước được chọn.
      en: White does not play a move that is both safe and removes every trick on the b8-h2 diagonal. The alternatives here, such as Nc3 or Bf4, also develop reasonably but leave some scope for Black to use that diagonal, so they are less clear-cut than the chosen move.
      fr: Les Blancs ne jouent pas un coup à la fois sûr et qui élimine toute combinaison sur la diagonale b8-h2. Les alternatives ici, comme Nc3 ou Bf4, se développent aussi raisonnablement mais laissent une certaine marge aux Noirs sur cette diagonale, et sont donc moins nettes que le coup choisi.
  children:
    - ply: e3
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng chơi e3, mở đường cho tượng f1 và đồng thời khoá hẳn mọi ý đồ của Đen nhắm vào f2 bằng cách cho vua có thêm một ô lánh nạn và giữ vững cấu trúc tốt.
        en: White plays e3, opening the diagonal for the f1 bishop and at the same time shutting down any of Black's ideas aimed at f2 by giving the king an extra escape square and keeping the pawn structure solid.
        fr: Les Blancs jouent e3, ouvrant la diagonale du fou f1 et fermant du même coup toute idée noire visant f2, en donnant au roi une case de fuite supplémentaire et en gardant la structure de pions solide.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy, đúng một tốt Trắng đang giữ từ 2.dxe5. Con tượng c5 của Đen vẫn đứng đẹp nhưng không còn mánh khoé cụ thể nào vì e3 đã lấp lỗ hổng ở f2, và Trắng sắp phát triển xong toàn bộ cánh hậu.
          en: Count the pawns and it is eight for White, seven for Black, exactly the one White has held since 2.dxe5. Black's bishop on c5 still looks nice but has no concrete trick left now that e3 has plugged the hole on f2, and White is about to finish developing the queenside.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs, exactement celui que les Blancs tiennent depuis 2.dxe5. Le fou noir en c5 reste bien placé mais n'a plus de combinaison concrète maintenant que e3 a bouché la case f2, et les Blancs sont sur le point d'achever le développement de l'aile dame.
        plan:
          vi: Đen chơi Qe7, Nf6 và O-O, tiếp tục gây sức ép lên con tốt e5 và tìm cách phát triển nhanh để bù cho con tốt đã mất. Trắng chơi Be2 hoặc Bd3, O-O, Nc3 và b3 hay c3, hoàn tất phát triển an toàn và cố giữ con tốt thừa vào tàn cuộc.
          en: Black plays Qe7, Nf6 and O-O, continuing to pressure the e5 pawn and looking for quick development to make up for the lost pawn. White plays Be2 or Bd3, O-O, Nc3 and b3 or c3, finishing development safely and trying to carry the extra pawn into the endgame.
          fr: Les Noirs jouent Qe7, Nf6 et O-O, continuant à faire pression sur le pion e5 et cherchant un développement rapide pour compenser le pion perdu. Les Blancs jouent Be2 ou Bd3, O-O, Nc3 et b3 ou c3, achevant leur développement en toute sécurité et essayant de porter le pion supplémentaire jusqu'à la finale.
        basis:
          by: chan
          at: '2026-09-21'
