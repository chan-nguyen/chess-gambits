tree:
  annotation:
    vi:
      Sau khi cả hai bên đã phát triển tượng theo lối fianchetto và cổ điển, Đen chơi 5...d5!?, thí
      ngay một tốt để mở trung tâm và tranh chấp thế chủ động.
    en: After both sides develop their bishops, one via fianchetto and one classically, Black plays
      5...d5!?, offering a pawn outright to open the centre and fight for the initiative.
    fr:
      Après que les deux camps ont développé leurs fous, l'un par fianchetto et l'autre classiquement,
      les Noirs jouent 5...d5!?, offrant d'emblée un pion pour ouvrir le centre et disputer
      l'initiative.
  dismissRest:
    reason:
      vi:
        Trắng bỏ qua con tốt d5 và chơi nước khác, ví dụ d3 hay O-O ngay. Con tốt ấy vẫn nằm trên bàn cờ
        và Đen chưa có được nhịp độ mà việc Trắng ăn tốt mang lại.
      en:
        White ignores the d5 pawn and plays something else, for instance d3 or O-O right away. That pawn
        stays on the board and Black does not get the extra tempo that White capturing it would
        bring.
      fr:
        Les Blancs ignorent le pion d5 et jouent autre chose, par exemple d3 ou O-O tout de suite. Ce
        pion reste sur l'échiquier et les Noirs ne gagnent pas le temps supplémentaire
        qu'apporterait sa capture par les Blancs.
  children:
    - ply: exd5
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng ăn luôn con tốt d5 mà Đen vừa hiến ra, nhận lời thí ngay giữa khai cuộc.
        en:
          White simply takes the d5 pawn that Black has just offered, accepting the gambit right in the
          opening.
        fr:
          Les Blancs prennent tout simplement le pion d5 que les Noirs viennent d'offrir, acceptant le
          gambit en plein cœur de l'ouverture.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 8 còn Đen 7 — Trắng hơn đúng một tốt sạch.
          en: Count the pawns and it is 8 for White against 7 for Black — White is up one clean pawn.
          fr:
            "Comptez les pions : 8 pour les Blancs contre 7 pour les Noirs — les Blancs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng chơi d3 hoặc O-O, củng cố thế trận và giữ vững con tốt thừa trong lúc vẫn theo dõi trung
            tâm. Đen chơi Nxd5 đổi mã lấy lại một phần hoạt động, hoặc Bg4 gây sức ép nhanh để bù
            cho tốt đã mất.
          en:
            White plays d3 or O-O, consolidating the position and holding the extra pawn while keeping an
            eye on the centre. Black plays Nxd5 to trade a knight and get back some activity, or Bg4
            to add quick pressure as compensation for the missing pawn.
          fr:
            Les Blancs jouent d3 ou O-O, consolidant la position et gardant le pion supplémentaire tout en
            surveillant le centre. Les Noirs jouent Nxd5 pour échanger un cavalier et regagner un
            peu d'activité, ou Bg4 pour ajouter rapidement de la pression en compensation du pion
            perdu.
        basis:
          by: chan
          at: 2026-09-29
