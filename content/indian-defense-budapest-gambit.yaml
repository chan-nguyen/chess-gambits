    - ply: d5
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Trắng đẩy tốt qua và đóng trung tâm lại. Không có gambit nào nữa, con tốt e5 của Đen vẫn còn nguyên, và ván cờ trở thành một thế trận kiểu Ấn Độ cổ với cấu trúc đóng.
        en: White pushes past and closes the centre. There is no gambit any more, Black's e5 pawn stays on the board, and the game becomes an Old Indian sort of structure.
        fr: Les Blancs poussent et ferment le centre. Il n'y a plus de gambit, le pion noir e5 reste sur l'échiquier, et la partie prend la tournure d'une structure de type vieille indienne.
      children:
        - ply: Bc5
          annotation:
            vi: Đen đưa tượng ra trước khi chơi d6, vì một khi tốt đã ở d6 thì con tượng f8 sẽ bị chôn sau dãy tốt. Đây là chi tiết nhỏ nhưng nó quyết định cả thế cờ về sau.
            en: Black gets the bishop out before playing ...d6, because once the pawn sits on d6 the f8 bishop is buried behind the chain. It is a small detail that decides the character of the whole game.
            fr: Les Noirs sortent le fou avant de jouer ...d6, car une fois le pion en d6, le fou f8 se retrouve enterré derrière la chaîne. C'est un petit détail qui décide du caractère de toute la partie.
          outcome:
            type: position
            evaluation:
              vi: Quân số ngang nhau và trung tâm đã đóng. Trắng có không gian ở cánh hậu nhờ tốt c4 và d5, còn Đen có thế trận chắc chắn với tốt e5 và con tượng đã ra ngoài dãy tốt. Đây là kiểu cờ chậm, ai hiểu cấu trúc đóng hơn thì bên đó chơi tốt hơn, và Đen hoàn toàn không có gì phải phàn nàn.
              en: Material is level and the centre is closed. White has queenside space thanks to the c4 and d5 pawns; Black is solid with the e5 pawn and the bishop already outside the chain. This is slow chess, whoever understands closed structures better plays it better, and Black has nothing to complain about.
              fr: Le matériel est égal et le centre est fermé. Les Blancs ont de l'espace à l'aile dame grâce aux pions c4 et d5 ; les Noirs sont solides avec le pion e5 et le fou déjà sorti de la chaîne. C'est un jeu lent, celui qui comprend le mieux les structures fermées le joue le mieux, et les Noirs n'ont rien à redire.
            plan:
              vi: Đen chơi d6, O-O, a5 để chặn b4, Nbd7 hoặc Na6 rồi Nc5, và nước phá là f5 ở cánh vua. Con tượng c5 nên giữ chứ đừng đổi. Trắng chơi Nc3, e4, Be2 hoặc g3 và Bg2, O-O, rồi b4 để đẩy tượng c5 đi và chiếm cánh hậu. Ai thực hiện được nước phá của mình trước thì bên đó cầm thế chủ động.
              en: Black plays ...d6, castles, ...a5 to stop b4, ...Nbd7 or ...Na6 followed by ...Nc5, and the break is ...f5 on the kingside. The bishop on c5 should be kept, not traded. White plays Nc3, e4, Be2 or g3 and Bg2, castles, then b4 to drive the c5 bishop away and take over the queenside. Whoever gets their break in first holds the initiative.
              fr: Les Noirs jouent ...d6, roquent, ...a5 pour empêcher b4, ...Nbd7 ou ...Na6 puis ...Nc5, la rupture étant ...f5 à l'aile roi. Le fou c5 doit être conservé, non échangé. Les Blancs jouent Nc3, e4, Be2 ou g3 et Bg2, roquent, puis b4 pour chasser le fou c5 et prendre l'aile dame. Celui qui réalise sa rupture le premier tient l'initiative.
            basis:
              by: chan
              at: '2026-09-17'
    - ply: e3
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Trắng đỡ con tốt d4 bằng tốt và mời Đen tự quyết định. Đây là cách từ chối điềm tĩnh nhất, và nó cho thấy người chơi Trắng không muốn dính vào bất cứ thứ gì có tên riêng.
        en: White supports the d4 pawn and leaves Black to decide. It is the calmest way to decline, and it says that the White player wants nothing to do with anything that has a name.
        fr: Les Blancs soutiennent le pion d4 et laissent les Noirs décider. C'est la façon la plus calme de refuser, et elle indique que le joueur blanc ne veut avoir affaire à rien qui porte un nom.
      children:
        - ply: exd4
          annotation:
            vi: Đen đổi ở d4 và ép Trắng ăn lại bằng tốt e3. Kết quả là Trắng có tốt cô ở d4 và cột e nửa mở, một cấu trúc quen thuộc mà Đen biết cách chơi chống lại.
            en: Black takes on d4 and makes White recapture with the e3 pawn. The result is an isolated d4 pawn for White and a half-open e-file, a familiar structure that Black knows how to play against.
            fr: Les Noirs prennent en d4 et obligent les Blancs à reprendre du pion e3. Il en résulte un pion isolé en d4 pour les Blancs et une colonne e semi-ouverte, une structure familière que les Noirs savent combattre.
          unsettled: >-
            exd4 is going free and the evaluation opens by saying so — material is level once White recaptures. What the leaf is about is the isolated d4 pawn the recapture leaves behind, which is a feature of the position after it, not before.
          outcome:
            type: position
            evaluation:
              vi: Quân số ngang nhau sau khi Trắng ăn lại bằng exd4. Trắng sẽ có một con tốt cô ở d4 cùng với tốt c4, tức là nhiều không gian và một điểm yếu lâu dài. Đen không thí gì cả và có một mục tiêu rõ ràng để nhắm vào. Đây là kết quả dễ chịu nhất mà Đen có thể mong từ một nước từ chối.
              en: Material is level once White recaptures with exd4. White will have an isolated pawn on d4 alongside the c4 pawn, which means space and a long-term weakness in the same package. Black has sacrificed nothing and has a clear target to aim at. This is the most pleasant result Black can hope for from a decline.
              fr: Le matériel est égal une fois que les Blancs reprennent par exd4. Les Blancs auront un pion isolé en d4 à côté du pion c4, c'est-à-dire de l'espace et une faiblesse durable dans le même paquet. Les Noirs n'ont rien sacrifié et disposent d'une cible claire. C'est le résultat le plus agréable que les Noirs puissent espérer d'un refus.
            plan:
              vi: Đen chơi d5 để chặn con tốt cô, hoặc Bb4+ rồi d6 và O-O, sau đó Nc6, Bg4 và Re8 để ép vào d4. Kế hoạch là đổi hết quân nhẹ rồi tấn công con tốt cô ở tàn cuộc. Trắng chơi Nf3, Nc3, Bd3, O-O và Re1, giữ quân trên bàn cờ và tìm cách đẩy d5 để đổi con tốt cô đi đúng lúc. Ai đổi được đúng những quân mình muốn thì bên đó thắng thế cờ này.
              en: Black plays ...d5 to blockade the isolated pawn, or ...Bb4+ followed by ...d6 and ...O-O, then ...Nc6, ...Bg4 and ...Re8 to press d4. The plan is to trade the minor pieces off and attack the isolated pawn in the endgame. White plays Nf3, Nc3, Bd3, O-O and Re1, keeps the pieces on and looks to push d5 at the right moment to liquidate the weakness. Whoever gets the exchanges they want wins this kind of position.
              fr: Les Noirs jouent ...d5 pour bloquer le pion isolé, ou ...Bb4+ suivi de ...d6 et ...O-O, puis ...Nc6, ...Bg4 et ...Re8 pour peser sur d4. Le plan est d'échanger les pièces mineures et d'attaquer le pion isolé en finale. Les Blancs jouent Nf3, Nc3, Bd3, O-O et Re1, gardent les pièces et cherchent d5 au bon moment pour liquider la faiblesse. Celui qui obtient les échanges qu'il souhaite gagne ce type de position.
            basis:
              by: chan
              at: '2026-09-17'
