name: 'French Defense: Carlson Gambit'
eco: C00
category: gambit
side: white
definingLine: [e4, e6, d4, d5, Nf3, dxe4, Ne5]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. The knight jumps into the centre banking on activity, but Black simply
      challenges it at once and White has not won the pawn back or shown a concrete follow-up
      that outweighs it. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa nhảy mã lên e5 thay vì đòi lại con tốt e4 ngay bằng Nxe4 hay Bxe4. Con mã ấy đứng năng động nhưng chưa được quân nào đỡ.
    en: White has just jumped the knight to e5 instead of winning the e4 pawn back at once with Nxe4 or Bxe4. The knight stands actively but is defended by nothing.
    fr: Les Blancs viennent de sauter le cavalier en e5 au lieu de regagner aussitôt le pion e4 par Nxe4 ou Bxe4. Ce cavalier est actif mais n'est défendu par rien.
  dismissRest:
    reason:
      vi: Đen không thách thức con mã e5 — phát triển bằng 4...Nf6 hay chơi 4...Bd6. Mỗi lựa chọn để nguyên con mã e5 đứng yên, chưa bị hỏi tới.
      en: Black does not challenge the e5 knight — developing with 4...Nf6 or playing 4...Bd6. Each leaves the e5 knight standing untouched, unquestioned.
      fr: Les Noirs ne défient pas le cavalier e5 — développant par 4...Cf6 ou jouant 4...Bd6. Chacun laisse le cavalier e5 en place, sans être interrogé.
  children:
    - ply: Nd7
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen thách thức con mã e5 ngay bằng mã của mình, buộc Trắng phải đổi quân hoặc lui về nếu không muốn mất nhịp.
        en: Black challenges the e5 knight at once with a knight of its own, forcing White to trade or retreat if there is no wish to lose more time.
        fr: Les Noirs défient aussitôt le cavalier e5 avec leur propre cavalier, forçant les Blancs à échanger ou à reculer s'ils ne veulent pas perdre davantage de temps.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy — Đen vẫn hơn đúng một tốt, và con mã e5 của Trắng giờ phải đổi lấy mã d7 hoặc lui đi mà chưa đòi lại được gì. Trắng chưa có gì cụ thể để bù cho con tốt đã mất ngoài một quân đang bị hỏi tới.
          en: Count the pawns and it is eight for Black, seven for White — Black is still exactly one pawn up, and White's e5 knight now has to trade for the d7 knight or retreat without having won anything back. White has nothing concrete yet to show for the lost pawn beyond a piece that is being questioned.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs — les Noirs restent exactement un pion devant, et le cavalier e5 blanc doit désormais s'échanger contre le cavalier d7 ou reculer sans avoir rien regagné. Les Blancs n'ont rien de concret à montrer pour le pion perdu, hormis une pièce mise en question.
        plan:
          vi: Trắng chơi Nxd7 đổi quân rồi Bxe4 đòi lại tốt, hoặc lui mã về f3 hay c4 và chấp nhận kém một tốt để đổi lấy phát triển. Đen chơi Bxd7 hay Nxd7 tùy hoàn cảnh, rồi Nf6 và Be7, hoàn thiện phát triển và giữ con tốt thừa làm vốn liếng lâu dài.
          en: White plays Nxd7 to trade off, then Bxe4 to win the pawn back, or retreats the knight to f3 or c4 and accepts being a pawn down in exchange for development. Black plays Bxd7 or Nxd7 depending on the position, then Nf6 and Be7, completing development and banking the extra pawn as a long-term asset.
          fr: Les Blancs jouent Nxd7 pour échanger, puis Bxe4 pour regagner le pion, ou reculent le cavalier en f3 ou c4 et acceptent d'avoir un pion de moins en échange du développement. Les Noirs jouent Bxd7 ou Nxd7 selon la position, puis Nf6 et Be7, achevant leur développement et conservant le pion supplémentaire comme atout durable.
        basis:
          by: chan
          at: '2026-09-25'
