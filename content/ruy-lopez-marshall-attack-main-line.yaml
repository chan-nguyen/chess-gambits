tree:
  annotation:
    vi:
      Sau loạt đổi quân ở trung tâm kết thúc bằng 11...c6, Đen đã thí hẳn một tốt để đổi lấy thế công
      kéo dài nhắm vào nhà vua Trắng — đây là tabiya chính của toàn bộ hệ thống Marshall Attack.
    en: After the central exchanges ending in 11...c6, Black has given up a clean pawn for a lasting
      attack on the White king — this is the main tabiya of the whole Marshall Attack.
    fr:
      Après les échanges au centre se terminant par 11...c6, les Noirs ont cédé un pion net pour une
      attaque durable contre le roi blanc — c'est la tabiya principale de tout le système Marshall
      Attack.
  dismissRest:
    reason:
      vi:
        Trắng chơi nước khác ngoài 12.d4, ví dụ Qf3 hay Bc2 ngay lập tức. Ý tưởng củng cố mã e5 hoặc gỡ
        rối cánh hậu vẫn tương tự, và đánh giá chung — Đen kém một tốt, bù lại có thế công — không
        đổi.
      en:
        White plays something other than 12.d4, for instance Qf3 or Bc2 right away. The idea of shoring
        up the e5 knight or untangling the queenside is similar, and the overall assessment — Black
        down a pawn, compensated by the attack — does not change.
      fr: Les Blancs jouent autre chose que 12.d4, par exemple Qf3 ou Bc2 immédiatement. L'idée de
        soutenir le cavalier e5 ou de dénouer l'aile dame reste semblable, et l'évaluation générale
        — les Noirs à un pion de moins, compensés par l'attaque — ne change pas.
  children:
    - ply: d4
      replyQuality: best
      frequency: common
      annotation:
        vi:
          Trắng chơi 12.d4, củng cố mã e5 và chuẩn bị hoàn thiện đội hình cánh hậu trước khi Đen kịp dồn
          quân tấn công.
        en:
          12.d4 shores up the knight on e5 and prepares to finish developing the queenside before Black
          can pile up on the kingside.
        fr:
          12.d4 soutient le cavalier e5 et prépare à achever le développement de l'aile dame avant que les
          Noirs ne puissent masser leurs pièces à l'attaque.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 7 còn Đen 6 — Trắng hơn đúng một tốt sạch.
          en: Count the pawns and it is 7 for White against 6 for Black — White is up one clean pawn.
          fr:
            "Comptez les pions : 7 pour les Blancs contre 6 pour les Noirs — les Blancs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng chơi Nd2-f1-g3 hoặc Qf3 để gỡ rối cánh hậu càng nhanh càng tốt, cố sống sót qua giai đoạn
            nguy hiểm nhất trong lúc vẫn giữ tốt thừa. Đen chơi Bd6 nhắm vào mã e5 và chuẩn bị Qh4
            hoặc Qc7, dồn toàn bộ lực lượng còn lại vào cánh vua Trắng.
          en:
            White plays Nd2-f1-g3 or Qf3 to untangle the queenside as fast as possible, trying to survive
            the most dangerous stretch of the game while still holding the extra pawn. Black plays
            Bd6 to pressure the knight on e5 and prepares Qh4 or Qc7, throwing the remaining pieces
            at White's king.
          fr:
            Les Blancs jouent Nd2-f1-g3 ou Qf3 pour dénouer l'aile dame le plus vite possible, essayant de
            survivre au passage le plus dangereux de la partie tout en gardant le pion
            supplémentaire. Les Noirs jouent Bd6 pour presser le cavalier e5 et préparent Qh4 ou
            Qc7, jetant le reste de leurs pièces sur le roi blanc.
        basis:
          by: chan
          at: 2026-09-29
