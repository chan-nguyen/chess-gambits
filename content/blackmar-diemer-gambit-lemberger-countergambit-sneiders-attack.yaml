tree:
  annotation:
    vi: Trắng vừa chơi 4.Qh5, đưa hậu ra ngay. Hậu tấn công tốt e5, vốn cũng đang bị tốt d4 tấn công, và tốt f7, chỉ có vua bảo vệ; ngoài ra mã c3 tấn công tốt e4.
    en: White has just played 4.Qh5, bringing the queen out at once. It attacks the pawn on e5, which the d4 pawn attacks as well, and the pawn on f7, which only the king defends; the knight on c3 also attacks the pawn on e4.
    fr: Les Blancs viennent de jouer 4.Qh5, sortant aussitôt la dame. Elle attaque le pion e5, que le pion d4 attaque aussi, et le pion f7, que seul le roi défend ; le cavalier c3 attaque en outre le pion e4.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 4...exd4. Bài này chỉ đi theo nhánh ăn tốt d4; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 4...exd4 here. This entry follows the capture on d4 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 4...exd4. Cette fiche ne suit que la prise en d4 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: exd4
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen ăn tốt d4 bằng 4...exd4. Tốt e5, vốn bị tấn công hai lần, đã thoát nguy, và tốt d4 giờ tấn công mã c3 — cũng là quân Trắng duy nhất đang tấn công tốt e4.
        en: Black takes on d4 with 4...exd4. The e5 pawn, attacked twice, is out of danger, and the pawn on d4 now attacks the knight on c3, which is also the only White piece attacking the pawn on e4.
        fr: Les Noirs prennent en d4, 4...exd4. Le pion e5, attaqué deux fois, est hors de danger, et le pion d4 attaque maintenant le cavalier c3, qui est aussi la seule pièce blanche à attaquer le pion e4.
      children:
        - ply: Nxe4
          annotation:
            vi: Trắng ăn tốt e4, 5.Nxe4, đồng thời đưa mã thoát khỏi đòn tấn công của tốt d4. Mã và hậu lúc này đều hoạt động, nhưng Trắng vẫn kém một tốt.
            en: White takes the pawn on e4, 5.Nxe4, which also moves the knight out of the d4 pawn's attack. The knight and the queen are now both active, but White is still a pawn down.
            fr: Les Blancs prennent le pion e4, 5.Nxe4, ce qui met aussi le cavalier à l'abri de l'attaque du pion d4. Le cavalier et la dame sont maintenant actifs, mais les Blancs restent un pion en moins.
          outcome:
            type: position
            evaluation:
              vi: 'Đếm tốt: Trắng sáu, Đen bảy, nên Trắng kém một tốt; Trắng không còn tốt nào ở trung tâm còn Đen có một tốt ở d4. Hậu h5 tấn công f7 và h7, nhưng vua bảo vệ f7 còn xe h8 bảo vệ h7, nên chưa thu được gì. Hậu và mã của Trắng là hai quân duy nhất đã ra quân ở cả hai bên.'
              en: "Count the pawns: White six, Black seven, so White is a pawn down; White has no pawn left in the centre while Black has one on d4. The queen on h5 attacks f7 and h7, but the king defends the first and the rook on h8 the second, so nothing is won yet. White's queen and knight are the only pieces out on either side."
              fr: "Comptez les pions : six pour les Blancs, sept pour les Noirs ; les Blancs sont donc un pion en moins, n'ont plus de pion au centre alors que les Noirs en ont un en d4. La dame h5 attaque f7 et h7, mais le roi défend le premier et la tour h8 le second : rien n'est encore gagné. La dame et le cavalier blancs sont les seules pièces sorties des deux côtés."
            plan:
              vi: Trắng đưa tượng ra c4 để tăng gấp đôi sức ép lên f7, hoặc chơi Nf3 để tấn công tốt d4. Đen đuổi hậu bằng ...g6 hoặc ...Nf6 rồi mới hoàn tất phát triển.
              en: White brings the bishop to c4 to double the pressure on f7, or plays Nf3 to attack the d4 pawn. Black chases the queen with ...g6 or ...Nf6 and only then completes development.
              fr: Les Blancs amènent le fou en c4 pour doubler la pression sur f7, ou jouent Nf3 pour attaquer le pion d4. Les Noirs chassent la dame par ...g6 ou ...Nf6 et n'achèvent leur développement qu'ensuite.
