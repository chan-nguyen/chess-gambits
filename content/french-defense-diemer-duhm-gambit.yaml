    at: '2026-09-25'
    source: >-
      A judgement. White offers a second central pawn for rapid development and open lines,
      a genuine Queen's Gambit-style idea transplanted into the French, without a shown
      refutation but without a shown edge either. No engine was consulted and no database was
      queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
