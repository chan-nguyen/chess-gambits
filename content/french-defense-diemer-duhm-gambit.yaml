tree:
  annotation:
    vi: Trắng vừa chơi 3.c4, thí thêm một tốt nữa cạnh tốt d4 để mở đường và đổi lấy phát triển nhanh, giống ý tưởng của Gambit Hậu nhưng chuyển sang Phòng thủ Pháp.
    en: White has just played 3.c4, offering a second central pawn alongside d4 for open lines and quick development, the same idea as the Queen's Gambit transplanted into the French Defense.
    fr: Les Blancs viennent de jouer 3.c4, offrant un second pion central aux côtés de d4 pour ouvrir des lignes et développer rapidement, la même idée que le Gambit Dame transposée dans la Défense française.
  dismissRest:
    reason:
      vi: Đen không ăn tốt e4 — chơi 3...Nf6 hay 3...c5, hay đổi tốt bằng 3...dxc4 trước. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black does not take the e4 pawn — playing 3...Nf6 or 3...c5, or trading with 3...dxc4 first. Each is outside the scope of this entry.
      fr: Les Noirs ne prennent pas le pion e4 — jouant 3...Cf6 ou 3...c5, ou échangeant par 3...dxc4 d'abord. Chacun sort du cadre de cette entrée.
  children:
    - ply: dxe4
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen nhận tốt bằng cách ăn ở e4, giữ nguyên áp lực lên tốt c4 để tính sau. Đây là Gambit Diemer-Duhm Đã Nhận, xem mục riêng để đi sâu vào những gì xảy ra tiếp theo.
        en: Black accepts by taking on e4, leaving the pressure on the c4 pawn for later. This is the Diemer-Duhm Gambit Accepted; see the dedicated entry for what follows.
        fr: Les Noirs acceptent en prenant en e4, laissant la pression sur le pion c4 pour plus tard. C'est le Gambit Diemer-Duhm Accepté ; voir l'entrée dédiée pour la suite.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy — Đen hơn đúng một tốt trong chốc lát. Trắng vẫn còn tốt c4 làm bàn đạp để mở cột và đường chéo trước khi tính đến việc đòi lại tốt e4.
          en: Count the pawns and it is eight for Black, seven for White — Black is a clean pawn up for the moment. White still has the c4 pawn as a lever to open files and diagonals before worrying about winning the e4 pawn back.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs — les Noirs ont un pion net d'avance pour l'instant. Les Blancs disposent encore du pion c4 comme levier pour ouvrir colonnes et diagonales avant de songer à regagner le pion e4.
        plan:
          vi: Trắng chơi Nc3 hoặc Qa4+ để tranh nhịp, rồi Nxe4 hoặc Bxe4 nếu có dịp, tận dụng lối chơi thoáng để bù cho con tốt đã thí. Đen chơi Nf6 và c6 hay Nc6, hoàn thiện phát triển và giữ con tốt e4 làm vốn liếng lâu dài.
          en: White plays Nc3 or Qa4+ to fight for tempo, then Nxe4 or Bxe4 when the chance comes, using the open play to justify the pawn offered. Black plays Nf6 and c6 or Nc6, completing development and banking the e4 pawn as a long-term asset.
          fr: Les Blancs jouent Nc3 ou Qa4+ pour lutter pour le temps, puis Nxe4 ou Bxe4 à l'occasion, utilisant le jeu ouvert pour justifier le pion offert. Les Noirs jouent Nf6 et c6 ou Nc6, achevant leur développement et conservant le pion e4 comme atout durable.
        basis:
          by: chan
          at: '2026-09-25'
