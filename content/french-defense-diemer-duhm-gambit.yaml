# French Defense, Diemer-Duhm Gambit. One entry in a batch authored for issue #148 (batch
# h). Defining line ends on White's 3.c4 (invariant 5). Every ply below was replayed with
# chess.js before being written. Stops at 3...dxe4, the acceptance itself; the deeper theory
# of what follows has its own entry, `french-defense-diemer-duhm-gambit-accepted`.
id: french-defense-diemer-duhm-gambit
name: 'French Defense: Diemer-Duhm Gambit'
eco: C00
category: gambit
side: white
definingLine: [e4, e6, d4, d5, c4]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
