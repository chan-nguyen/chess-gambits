tree:
  annotation:
    vi: Trắng vừa đẩy tốt lên g4, đánh thẳng vào con tượng f5 của Đen. Con tượng ấy phải nhúc nhích hoặc chịu đổi.
    en: White has just pushed the pawn to g4, striking directly at Black's bishop on f5. That bishop has to move or accept a trade.
    fr: Les Blancs viennent de pousser le pion en g4, frappant directement le fou noir en f5. Ce fou doit bouger ou accepter l'échange.
  dismissRest:
    reason:
      vi: Đen không đưa tượng f5 vào tình huống bị đánh — thay vào đó chơi 7...Nbd7 hay 7...Bg6 sớm hơn, hoặc một trật tự nước đi khác trước khi Trắng kịp chơi g4. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black avoids putting the f5 bishop where it can be hit — playing 7...Nbd7 or 7...Bg6 earlier instead, or a different move order before White gets to play g4. Each is outside the scope of this entry.
      fr: Les Noirs évitent de placer le fou f5 là où il peut être attaqué — jouant plutôt 7...Cbd7 ou 7...Fg6 plus tôt, ou un ordre de coups différent avant que les Blancs ne puissent jouer g4. Chacun sort du cadre de cette entrée.
  children:
    - ply: Be4
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Biến Stader. Đen không lui tượng mà đẩy nó lên e4, một ô hoạt động nhìn thẳng qua ô g2 bỏ trống tới tận xe h1 của Trắng, thay vì lùi lại an toàn.
        en: The Stader Variation. Rather than retreating, Black pushes the bishop forward to e4, an active square that looks straight through the empty g2 square all the way to White's rook on h1, instead of dropping back to safety.
        fr: La Variante Stader. Plutôt que de reculer, les Noirs poussent le fou en avant vers e4, une case active qui regarde tout droit à travers la case g2 vide jusqu'à la tour blanche en h1, au lieu de se replier en sécurité.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng sáu, Đen bảy — Đen hơn đúng một tốt, con tốt Blackmar-Diemer ban đầu vẫn chưa đòi lại được. Quan trọng hơn số tốt, con tượng e4 đang chĩa thẳng vào xe h1 không ai đỡ dọc đường chéo b1-h7 vừa mở ra sau 8.g4, nên Trắng phải xử lý ngay chứ không thể coi đây là một thế cờ yên ổn.
          en: Count the pawns and it is six for White, seven for Black — Black is exactly one pawn up, the original Blackmar-Diemer pawn still not won back. More important than the pawn count, the bishop on e4 aims straight down the b1-h7 diagonal that 8.g4 just opened at an undefended rook on h1, so White has to deal with this at once rather than treat the position as settled.
          fr: Comptez les pions, six pour les Blancs, sept pour les Noirs — les Noirs ont exactement un pion de plus, le pion initial du Blackmar-Diemer n'ayant toujours pas été regagné. Plus important que le compte de pions, le fou en e4 vise tout droit, le long de la diagonale b1-h7 que 8.g4 vient d'ouvrir, une tour en h1 non défendue, si bien que les Blancs doivent s'en occuper immédiatement plutôt que de considérer la position comme stabilisée.
        plan:
          vi: Trắng chơi Nxe4 ngay để loại bỏ mối đe dọa bằng cách đổi mã lấy tượng, và Nf6 của Đen ăn lại đúng chỗ đó, đưa quân số trở lại ngang nhau trừ tốt Blackmar-Diemer ban đầu; Trắng có thể chọn thay vào đó Qf3 phòng thủ ô h1 rồi tính tiếp. Đen ăn lại bằng Nxe4 nếu Trắng ăn tượng, rồi Nbd7 đổi bớt con mã e5 phiền phức, hoàn thiện phát triển và giữ con tốt thừa làm vốn liếng lâu dài.
          en: White plays Nxe4 at once to remove the threat by trading the knight for the bishop, and Black's Nf6 recaptures right there, bringing material back level apart from the original Blackmar-Diemer pawn; White could instead choose Qf3 to defend h1 and take stock. Black recaptures with Nxe4 if White takes the bishop, then plays Nbd7 to trade off the troublesome e5 knight, completing development and banking the extra pawn as a long-term asset.
          fr: Les Blancs jouent Nxe4 aussitôt pour éliminer la menace en échangeant le cavalier contre le fou, et le Cf6 noir reprend à cet endroit même, ramenant le matériel à l'égalité hormis le pion initial du Blackmar-Diemer ; les Blancs pourraient choisir à la place Qf3 pour défendre h1 et faire le point. Les Noirs reprennent par Nxe4 si les Blancs prennent le fou, puis jouent Nbd7 pour échanger le cavalier e5 gênant, achevant leur développement et conservant le pion supplémentaire comme atout durable.
