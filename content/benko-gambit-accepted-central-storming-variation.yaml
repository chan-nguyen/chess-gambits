tree:
  annotation:
    vi: 'Đen đã ăn lại tốt qua ngả ...g6 rồi ...Bxa6, đạt cấu trúc Benko tiêu chuẩn: kém một tốt (bảy so với sáu, nghiêng về Trắng) nhưng có tượng đang hoạt động mạnh trên đường chéo dài và cột a sẵn sàng mở cho xe. Trắng phải chọn cách triển khai tiếp.'
    en: "Black has recaptured the pawn via ...g6 and ...Bxa6, reaching the standard Benko structure: down one pawn (seven against six in White's favour) but with the bishop already active on the long diagonal and the a-file ready to open for the rook. White must choose how to continue."
    fr: "Les Noirs ont repris le pion par ...g6 puis ...Bxa6, atteignant la structure Benko standard : un pion de moins (sept contre six en faveur des Blancs) mais avec le fou déjà actif sur la grande diagonale et la colonne a prête à s'ouvrir pour la tour. Les Blancs doivent choisir comment poursuivre."
  dismissRest:
    reason:
      vi: 'Trắng chọn cách phát triển khác thay vì 7.f4 ở đây, ví dụ Nf3 theo hướng thông thường hơn. Đánh giá tương tự: Trắng giữ đúng một tốt dư trong khi Đen luôn có đền bù nhờ tượng hoạt động và cột a mở, bất kể Trắng chọn hướng nào.'
      en: 'White develops some other way instead of 7.f4 here, for instance the more usual Nf3. The assessment is similar throughout: White holds exactly one extra pawn while Black always has compensation from the active bishop and the open a-file, whichever way White goes.'
      fr: "Les Blancs se développent autrement qu'avec 7.f4 ici, par exemple par le plus habituel Nf3. L'évaluation reste similaire : les Blancs ont exactement un pion de plus tandis que les Noirs disposent toujours d'une compensation grâce au fou actif et à la colonne a ouverte, quelle que soit la voie choisie par les Blancs."
  children:
    - ply: f4
      replyQuality: inaccuracy
      frequency: occasional
      annotation:
        vi: Trắng chơi 7.f4, một cách tiếp cận bốc lửa nhằm chiếm thêm không gian trung tâm và cánh vua ngay lập tức thay vì hoàn tất phát triển thông thường bằng Nf3.
        en: White plays 7.f4, a fiery approach grabbing extra space in the centre and on the kingside right away instead of the usual developing Nf3.
        fr: "Les Blancs jouent 7.f4, une approche fougueuse gagnant immédiatement de l'espace au centre et à l'aile roi au lieu du Nf3 habituel."
      outcome:
        type: position
        evaluation:
          vi: 'Vật chất không đổi: Trắng bảy tốt, Đen sáu. Tốt f4 mở đường cho tượng c1 và chiếm không gian, nhưng cũng làm suy yếu ô e3 và e4, đồng thời trì hoãn việc phát triển mã g1.'
          en: 'Material is unchanged: White seven pawns, Black six. The f4 pawn opens a diagonal for the c1-bishop and grabs space, but it also weakens the e3 and e4 squares and delays developing the g1-knight.'
          fr: "Le matériel est inchangé : sept pions pour les Blancs, six pour les Noirs. Le pion f4 ouvre une diagonale pour le fou c1 et gagne de l'espace, mais il affaiblit aussi les cases e3 et e4 et retarde le développement du cavalier g1."
        plan:
          vi: Trắng tiếp tục Nf3 và Bd3, cố tận dụng không gian vừa chiếm được trước khi Đen kịp phản công. Đen chơi ...Bg7 và ...O-O, rồi nhắm vào các ô yếu e3/e4 bằng ...Nfd7 hoặc ...Qb6 sau này.
          en: White continues with Nf3 and Bd3, trying to make use of the space just gained before Black can counterattack. Black plays ...Bg7 and ...O-O, then targets the weak e3/e4 squares with ...Nfd7 or ...Qb6 later.
          fr: "Les Blancs poursuivent par Nf3 et Bd3, essayant de tirer parti de l'espace gagné avant que les Noirs ne contre-attaquent. Les Noirs jouent ...Bg7 et ...O-O, puis visent les cases faibles e3/e4 par ...Nfd7 ou ...Qb6 plus tard."
        basis:
          by: chan
          at: '2026-09-29'
