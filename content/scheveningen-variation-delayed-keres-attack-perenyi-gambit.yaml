# Sicilian Defense: Scheveningen Variation, Delayed Keres Attack, Perenyi Gambit. Frozen defining
# line 1.e4 c5 2.Nf3 d6 3.d4 cxd4 4.Nxd4 Nf6 5.Nc3 a6 6.Be3 e6 7.g4 e5 8.Nf5 g6 9.g5, which ends on
# White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). Replayed with
# chess.js through 9...gxf5 10.gxf6 Qxf6 11.Qd2. The leaf has Black to move, but every capture open
# to Black there is answered by a recapture. searchMate at 3 moves from the resulting position
# returns no-mate, so no forced mate is claimed anywhere in this entry.
id: scheveningen-variation-delayed-keres-attack-perenyi-gambit
