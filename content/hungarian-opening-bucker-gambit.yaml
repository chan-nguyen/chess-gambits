# Hungarian Opening, Bucker Gambit. One entry in a batch authored for issue #148 (batch h).
# Defining line ends on White's 3.b4 (invariant 5) — the dataset's own shortest line for
# this name already ends there, on White's own ply, so no ply needs to be trimmed out into a
# modelled reply. The single child below is this author's own choice of the natural,
# thematic reply rather than a further named sub-variation, and it was replayed with
# chess.js like every other ply. Every ply below was replayed with chess.js before being
# written.
id: hungarian-opening-bucker-gambit
name: 'Hungarian Opening: Bücker Gambit'
eco: A00
category: gambit
side: white
definingLine: [g3, d5, Bg2, e5, b4]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. The pawn buys queenside space and a long diagonal for the g2 bishop, but
      nothing here has been shown to make up for a pawn against accurate play. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa đẩy tốt lên b4, chiếm đất cánh hậu và chuẩn bị Bb2 nhìn suốt đường chéo dài vào tốt e5 của Đen.
    en: White has just pushed the pawn to b4, grabbing queenside space and preparing Bb2 to rake the long diagonal all the way to Black's e5 pawn.
    fr: Les Blancs viennent de pousser le pion en b4, prenant de l'espace à l'aile dame et préparant Bb2 pour balayer la grande diagonale jusqu'au pion e5 noir.
  dismissRest:
    reason:
      vi: Đen phớt lờ con tốt b4 — phát triển bằng 3...Nf6 hay chơi 3...Nc6. Mỗi lựa chọn để nguyên con tốt b4 trên bàn cờ, chưa bị hỏi tới.
      en: Black ignores the b4 pawn — developing with 3...Nf6, or playing 3...Nc6. Each leaves the b4 pawn sitting on the board, unquestioned.
      fr: Les Noirs ignorent le pion b4 — développant par 3...Cf6, ou jouant 3...Cc6. Chacun laisse le pion b4 sur l'échiquier, sans être interrogé.
  children:
    - ply: a5
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Đen đánh thẳng vào con tốt b4 ngay lập tức, đặt câu hỏi cho Trắng trước khi con tốt ấy kịp được củng cố bằng a3 hay Bb2.
        en: Black strikes at the b4 pawn at once, asking White a question before it can be shored up with a3 or Bb2.
        fr: Les Noirs frappent aussitôt le pion b4, posant une question aux Blancs avant qu'il ne puisse être consolidé par a3 ou Bb2.
      outcome:
        type: position
        evaluation:
          vi: Quân số hoàn toàn ngang nhau, mỗi bên còn đủ tám tốt. Con tốt b4 của Trắng đang bị hỏi tới ngay lập tức, và Trắng phải chọn giữa giữ nó bằng a3 hay c3, hay đổi nó bằng bxa5.
          en: Material is completely level, each side still has all eight pawns. White's b4 pawn is being questioned at once, and White has to choose between holding it with a3 or c3, or trading it off with bxa5.
          fr: Le matériel est parfaitement égal, chaque camp a encore ses huit pions. Le pion b4 blanc est immédiatement remis en question, et les Blancs doivent choisir entre le tenir par a3 ou c3, ou l'échanger par bxa5.
        plan:
          vi: Trắng chơi a3 hay c3 giữ tốt b4, rồi Bb2 nhìn vào tốt e5, hoặc đổi bằng bxa5 và chấp nhận mất đất để đơn giản hoá. Đen chơi axb4 nếu Trắng không giữ kịp, hoặc Nf6 và Nc6, hoàn thiện phát triển và tranh chấp trung tâm.
          en: White plays a3 or c3 to hold the b4 pawn, then Bb2 to eye the e5 pawn, or trades with bxa5 and accepts giving up the space to simplify. Black plays axb4 if White cannot hold it in time, or Nf6 and Nc6, completing development and contesting the centre.
          fr: Les Blancs jouent a3 ou c3 pour tenir le pion b4, puis Bb2 pour viser le pion e5, ou échangent par bxa5 et acceptent de céder l'espace pour simplifier. Les Noirs jouent axb4 si les Blancs ne peuvent le tenir à temps, ou Nf6 et Nc6, achevant leur développement et disputant le centre.
        basis:
          by: chan
          at: '2026-09-25'
