    at: 2026-10-01
    source: "A judgement, and the same label `traps.yaml` carries. It is about Black's play: 5...Bb4+ is a normal move in this line, and against the correct 6.Bd2 Black is level, so nothing in this entry depends on the opponent cooperating. The trap itself wins at most a pawn against best play and the entry says so. An engine was used privately at moderate depth to find the replies worth modelling and is not the source of any claim."
judgement:
  by: chan
