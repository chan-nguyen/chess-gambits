  source: Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement on one date. Every material count was read off the derived board.
tree:
  annotation:
    vi: 'Đen vừa chiếu bằng 5...Bb4+. Trắng có {legal} cách đỡ: Bd2 (tượng), Nbd2, Nfd2 hoặc Nc3 (mã), hay Qd2 (hậu). Chỉ có 6.Bd2 giữ được cân bằng; các nước chặn bằng mã d2 đều đặt mã vào thế bị ghim vào vua e1.'
    en: 'Black has just given check with 5...Bb4+. White has {legal} ways to meet it: Bd2 (the bishop), Nbd2, Nfd2 or Nc3 (a knight), or Qd2 (the queen). Only 6.Bd2 keeps the balance; the knight blocks on d2 all leave the knight pinned against the king on e1.'
    fr: "Les Noirs viennent de donner échec par 5...Bb4+. Les Blancs ont {legal} façons d'y répondre : Bd2 (le fou), Nbd2, Nfd2 ou Nc3 (un cavalier), ou Qd2 (la dame). Seul 6.Bd2 conserve l'équilibre ; les interpositions de cavalier en d2 laissent toutes le cavalier cloué sur le roi e1."
  counts:
    legal:
      count: legalReplies
      expect: 5
  dismissed:
    - ply: Nc3
      reason: '6.Nc3 Bxc3+ 7.Bd2 Bxa1 wins a rook for a bishop: the c1 bishop stands between the queen and a1, so the a1 bishop is not taken back at once.'
    - ply: Qd2
      reason: 6.Qd2 Bxd2+ wins the queen for a bishop.
  children:
    - ply: Bd2
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng chặn bằng tượng c1, và đây là nước đúng. Tượng b4 của Đen bị tượng d2 đánh mà không có quân nào bảo vệ, nên Đen phải đổi tượng, lùi, hoặc đỡ bằng ...c5.
        en: White blocks with the c1 bishop, and this is the correct move. Black's b4 bishop is attacked by the d2 bishop and protected by nothing, so Black must trade it, retreat it, or support it with ...c5.
        fr: "Les Blancs interposent avec le fou c1, et c'est le bon coup. Le fou b4 noir est attaqué par le fou d2 et protégé par rien : les Noirs doivent l'échanger, le reculer ou le soutenir par ...c5."
      outcome:
        type: position
        evaluation:
          vi: 'Quân số cân bằng: mỗi bên có tám tốt và cùng số quân. Đây là cách đỡ đúng của Trắng và cái bẫy không có hiệu lực: tượng d2 có thể ăn ngay tượng b4 trên chính đường chéo ấy, và không quân nào của Trắng bị đòn chĩa.'
          en: "Material is level: each side has eight pawns and the same pieces. This is the correct block for White and the trap has no force: the d2 bishop can take the b4 bishop at once along the very same diagonal, and nothing of White's is forked."
          fr: "Le matériel est égal : chaque camp a huit pions et les mêmes pièces. C'est la bonne interposition des Blancs et le piège n'a aucune force : le fou d2 peut prendre aussitôt le fou b4 sur cette même diagonale, et rien n'est fourché côté blanc."
        plan:
          vi: Đen thường đổi tượng bằng 6...Bxd2+ hoặc đỡ tượng bằng 6...c5, rồi đưa tượng a6 hoặc b7 vào chơi. Trắng phát triển bằng Bg2 và O-O. Hai bên cân bằng.
          en: Black usually trades with 6...Bxd2+ or supports the bishop with 6...c5, then develops the a6 or b7 bishop. White develops with Bg2 and O-O. The game is balanced.
          fr: Les Noirs échangent d'ordinaire par 6...Bxd2+ ou soutiennent le fou par 6...c5, puis développent le fou a6 ou b7. Les Blancs se développent par Bg2 et O-O. La partie est équilibrée.
        basis:
          by: chan
          at: 2026-10-01
    - ply: Nbd2
      replyQuality: mistake
      frequency: common
      annotation:
        vi: Trắng chặn bằng mã b1. Mã d2 giờ bị tượng b4 ghim vào vua e1, và ô c3 trống để tượng ấy nhảy xuống. Đây là cú vấp mà cái bẫy chờ.
        en: White blocks with the b1 knight. The d2 knight is now pinned against the king on e1 by the b4 bishop, and c3 is empty for that bishop to jump to. This is the slip the trap waits for.
        fr: Les Blancs interposent avec le cavalier b1. Le cavalier d2 est maintenant cloué sur le roi e1 par le fou b4, et c3 est libre pour que ce fou y saute. C'est la faute qu'attend le piège.
      children:
        - ply: Bc3
          annotation:
            vi: 'Tượng b4 nhảy xuống c3 và cùng lúc đánh xe a1 lẫn mã d2. Mã d2 có bốn quân bảo vệ, nhưng xe a1 thì không có ai: hậu d1 bị chính tượng c1 chắn đường.'
            en: 'The b4 bishop drops to c3, attacking the a1 rook and the d2 knight at once. The d2 knight has four defenders, but the a1 rook has none: the queen on d1 is blocked by the c1 bishop.'
            fr: "Le fou b4 descend en c3 et attaque à la fois la tour a1 et le cavalier d2. Le cavalier d2 a quatre défenseurs, mais la tour a1 n'en a aucun : la dame d1 est bloquée par le fou c1."
          counts:
            legal:
              count: legalReplies
              expect: 21
          dismissRest:
            reason:
              vi: 'Trong {legal} nước hợp lệ của Trắng, mọi nước ngoài Rb1, Bb2 và Ba3 đều để mất trắng xe a1: 7...Bxa1 ăn xe mà không có quân nào ăn lại được, vì tượng c1 vẫn chắn đường hậu d1.'
              en: "Of White's {legal} legal moves, every one except Rb1, Bb2 and Ba3 loses the a1 rook for nothing: 7...Bxa1 takes it and nothing can retake, because the c1 bishop still blocks the d1 queen."
              fr: 'Sur les {legal} coups légaux des Blancs, tous sauf Rb1, Bb2 et Ba3 perdent la tour a1 pour rien : 7...Bxa1 la prend et rien ne peut reprendre, car le fou c1 bloque toujours la dame d1.'
          dismissed:
            - ply: Bb2
              reason: '7.Bb2 Bxa1 8.Bxa1 gives the exchange: a rook for a bishop.'
            - ply: Ba3
              reason: '7.Ba3 Bxa1 8.Qxa1 gives the exchange: a rook for a bishop (the c1 square is clear now, so the queen can retake).'
          children:
            - ply: Rb1
              replyQuality: best
              frequency: common
              annotation:
                vi: Xe lùi về b1, nước duy nhất cứu xe mà không mất chất. Mã d2 vẫn bị ghim, và Đen đã có lợi thế nhỏ.
                en: The rook steps back to b1, the only move that saves it without losing material. The d2 knight is still pinned and Black already has a small edge.
                fr: La tour recule en b1, le seul coup qui la sauve sans perdre de matériel. Le cavalier d2 reste cloué et les Noirs ont déjà un petit avantage.
              children:
                - ply: Bb7
                  annotation:
                    vi: 'Tượng a6 sang b7, nhắm dọc đường chéo dài b7–h1. Mã f3 giờ không đi đâu được: nếu nó rời f3, Bxh1 ăn xe, vì ô g2 còn trống. Tốt d4 chỉ còn đúng mã f3 bảo vệ.'
                    en: 'The a6 bishop goes to b7, aiming down the long b7–h1 diagonal. The f3 knight now cannot go anywhere: if it leaves f3, Bxh1 takes the rook, since g2 is still empty. The d4 pawn is protected only by that knight.'
                    fr: "Le fou a6 va en b7 et vise toute la grande diagonale b7–h1. Le cavalier f3 ne peut plus aller nulle part : s'il quitte f3, Bxh1 prend la tour, car g2 est encore vide. Le pion d4 n'est protégé que par ce cavalier."
                  counts:
                    legal:
                      count: legalReplies
                      expect: 22
                  dismissRest:
                    reason:
                      vi: Trong {legal} nước hợp lệ của Trắng, những nước chưa nêu ở trên không mất quân ngay, nhưng không nước nào giải quyết được vấn đề của Trắng và Đen vẫn có lợi thế nhỏ trong từng nước.
                      en: Of White's {legal} legal moves, the ones not named above do not lose a piece at once, but none solves White's problems and Black keeps a small edge in each.
                      fr: Sur les {legal} coups légaux des Blancs, ceux qui ne sont pas cités plus haut ne perdent pas de pièce tout de suite, mais aucun ne résout les problèmes blancs et les Noirs gardent un petit avantage dans chacun.
                  dismissed:
                    - ply: Ne5
                      reason: 8.Ne5 leaves f3, so 8...Bxh1 wins the rook for nothing.
                    - ply: Ng5
                      reason: 8.Ng5 leaves f3, so 8...Bxh1 wins the rook for nothing.
                    - ply: Nh4
                      reason: 8.Nh4 leaves f3, so 8...Bxh1 wins the rook for nothing.
                    - ply: Ng1
                      reason: 8.Ng1 leaves f3, so 8...Bxh1 wins the rook for nothing.
                    - ply: Ra1
                      reason: 8.Ra1 walks back into 8...Bxa1, which nothing retakes.
                    - ply: Rb2
                      reason: '8.Rb2 Bxb2 9.Bxb2 gives the exchange: a rook for a bishop.'
