# The Queen Amidala Trap, from Black's side of the Queen's Indian Defense, Fianchetto
# Variation, Check Variation. The defining line is 1.d4 Nf6 2.c4 e6 3.Nf3 b6 4.g3 Ba6 5.b3 Bb4+
# and it ends on Black's own ply, so the root is an opponent node and White's mistakes can carry
# a quality (docs/CONTEXT.md, invariant 5). It is exactly the dataset row "Queen's Indian
# Defense: Fianchetto Variation, Check Variation" (E15).
#
# ECO is E15 and category is `trap`, matching `traps.yaml`: a trap carries the ECO of the
# opening it sits inside (ADR-0008).
#
# Sources are leads. The line 6.Nbd2 Bc3 7.Rb1 Bb7 8.Bg2 Be4 9.Nh4 Bxg2 10.Nxg2 Bxd4 is in
# lichess study 7ndvaGkp (chapter 21) and thechesswebsite.com describes the idea in prose
# (blocking the check with a knight); the Chessgames reference list that fed issue #173
# credits the position to Shirazi-Benjamin 1984, which went 8.Bb2 Ne4. All of it was replayed
# ply by ply with chess.js before any prose was written. What the replay found, and the file
# now says:
#
# - The trap is real but modest. 6.Nbd2? is not a blunder: after 6...Bc3! 7.Rb1 Bb7 White is
#   worse by roughly half a pawn, not lost. 6.Bd2 is the correct reply and is modelled with its
#   own assessment. 6.Nfd2 is the same mistake with the other knight (the d2 knight is pinned
#   and the bishop on b7 immediately hits the h1 rook), and is modelled too.
# - The source's "8.Bg2??" does not survive replay as a blunder. 8.Bg2 is one of White's
#   reasonable moves there; what it concedes is the d4 pawn. And 8...Be4, the source's reply,
#   is not Black's best: 8...Bxd4 is, because the f3 knight is tied to the h1 rook, so 9.Nxd4
#   runs into 9...Bxg2 and the bishop retreats with a pawn gained. The entry teaches 8...Bxd4
#   and its evaluation says "a pawn", not a win.
# - 8.Bb2 Ne4 (the Shirazi game) is not a blunder either. It is modelled as a level position in
#   which Black has the more active pieces, which is what the game showed.
# - The tempting alternatives 6.Nc3 (6...Bxc3+ wins the exchange, since the c1 bishop blocks the
#   queen's way to a1) and 6.Qd2 (the queen is simply captured) are dismissed with their
#   reasons. None of this needs a mate and none is claimed.
#
# A private engine cross-check (the Stockfish build the analysis page ships, at moderate
# depth) was used to decide which replies deserve a branch. It is not the source of any claim
# in the lesson: every capture or count was read off the derived board.
