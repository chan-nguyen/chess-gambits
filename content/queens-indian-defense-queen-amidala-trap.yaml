                              en: Black keeps the extra pawn by trading pieces and castling (after ...Bxg2 comes ...Bb7 or ...O-O). White tries to win it back with pressure on the d-file and the long diagonal, but Black's edge is a single pawn, not an immediate win.
                              fr: Les Noirs gardent le pion de plus en échangeant des pièces et en roquant (après ...Bxg2 viennent ...Bb7 ou ...O-O). Les Blancs tentent de le regagner par la pression sur la colonne d et la grande diagonale, mais l'avantage noir n'est qu'un pion, pas un gain immédiat.
