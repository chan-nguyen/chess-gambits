                            en: The c3 bishop takes the d4 pawn. If White recaptures with the f3 knight, 9...Bxg2 takes the g2 bishop and attacks the h1 rook, and after 10.Rg1 Bb7 Black is still a pawn up. If White does not recapture, Black is a pawn up as well.
                            fr: Le fou c3 prend le pion d4. Si les Blancs reprennent avec le cavalier f3, 9...Bxg2 prend le fou g2 et attaque la tour h1, et après 10.Rg1 Bb7 les Noirs ont toujours un pion de plus. Si les Blancs ne reprennent pas, les Noirs ont aussi un pion de plus.
                          unsettled: 'White can take the d4 bishop for free with Nxd4, but that is the line the evaluation describes: ...Bxg2 and ...Bb7 follow and Black keeps the pawn, so playing it out adds nothing to the count below.'
