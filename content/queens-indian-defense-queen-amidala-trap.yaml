                              en: "Material count: Black is a pawn up (eight pawns to seven), because White's d4 pawn is gone. Even if White takes the d4 bishop with Nxd4, Bxg2 followed by Rg1 Bb7 leaves the same single pawn, and no white piece can win that pawn back at once."
                              fr: 'Décompte matériel : les Noirs ont un pion de plus (huit pions contre sept), car le pion d4 blanc a disparu. Même si les Blancs prennent le fou d4 par Nxd4, Bxg2 suivi de Rg1 Bb7 laisse le même unique pion, et aucune pièce blanche ne peut le regagner aussitôt.'
