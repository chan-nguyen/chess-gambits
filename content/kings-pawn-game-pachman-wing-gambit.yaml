          vi: 'Đếm tốt thì Trắng bảy, Đen tám, Trắng kém đúng một tốt sạch. Đổi lại Trắng có ý định c3 và d4 để đẩy tượng đi và dựng trung tâm lớn, nhưng chưa có gì cụ thể ngay lúc này.'
          en: 'Count the pawns and it is seven for White, eight for Black, White a clean pawn down. In return White intends c3 and d4 to chase the bishop and build a big centre, but nothing concrete exists yet.'
          fr: "Comptez les pions, sept pour les Blancs, huit pour les Noirs, les Blancs ont un pion de retard. En échange, les Blancs comptent jouer c3 et d4 pour chasser le fou et bâtir un grand centre, mais rien de concret n'existe encore."
