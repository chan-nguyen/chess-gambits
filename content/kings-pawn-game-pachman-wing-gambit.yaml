    vi: 'Trắng chơi 3.b4!?, một gambit cánh hậu sớm, mời Đen ăn tốt để đổi lấy nhịp và cột b mở sau này.'
    en: 'White plays 3.b4!?, an early wing gambit, inviting Black to take the pawn in exchange for a tempo and a later open b-file.'
    fr: "Les Blancs jouent 3.b4!?, un gambit d'aile précoce, invitant les Noirs à prendre le pion en échange d'un temps et d'une colonne b ouverte plus tard."
  dismissRest:
    reason:
      vi: 'Đen không ăn tốt b4. Các nước như d5 hay Nf6 phát triển bình thường và để nguyên con tốt ấy, khiến Trắng phải tự tìm cách biện minh cho b4 mà chưa có gì đổi lại ngay.'
      en: 'Black does not take the b4 pawn. Moves such as d5 or Nf6 develop normally and leave that pawn alone, leaving White to justify b4 without anything immediate in return.'
      fr: 'Les Noirs ne prennent pas le pion b4. Des coups comme d5 ou Nf6 se développent normalement et laissent ce pion tranquille, obligeant les Blancs à justifier b4 sans contrepartie immédiate.'
  children:
