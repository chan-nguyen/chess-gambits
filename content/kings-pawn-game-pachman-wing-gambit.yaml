id: kings-pawn-game-pachman-wing-gambit
name: "King's Pawn Game: Pachman Wing Gambit"
eco: C44
category: gambit
side: white
definingLine: [e4, e5, Nf3, Nc6, b4]
soundness:
  value: dubious
  reviewedAt: '2026-09-22'
  basis:
    by: chan
    at: '2026-09-22'
    source: >-
      A judgement. White offers a wing pawn for a tempo on the bishop that would otherwise
      go to c5, plus an open b-file later, but a wing pawn bought this early rarely pays for
      itself against accurate defence, and Black keeps a clean extra pawn with no structural
      damage. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-22'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
