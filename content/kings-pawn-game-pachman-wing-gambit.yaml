          en: 'White plays c3 then d4, chasing the bishop off b4 and grabbing the centre to make up for the lost pawn. Black plays Ba5 or Bc5 to keep the bishop, then d6 and Nf6, completing development with the extra pawn.'
          fr: 'Les Blancs jouent c3 puis d4, chassant le fou de b4 et prenant le centre pour compenser le pion perdu. Les Noirs jouent Ba5 ou Bc5 pour garder le fou, puis d6 et Nf6, achevant leur développement avec le pion supplémentaire.'
