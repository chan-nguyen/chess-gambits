                                type: position
                                evaluation:
                                  vi: Đếm tốt — bảy đều đối với các quân còn lại, nhưng Đen vẫn giữ con tốt d4 mà chưa ai đòi lại được, vì con mã c6 vẫn canh đúng ô ấy y như từ đầu. Quân nhẹ ngang nhau về số lượng dù đã đổi khác loại, và không bên nào có điểm yếu cấu trúc nào cả. Nói ngắn gọn, Đen hơn đúng một tốt sạch.
                                  en: Count the pawns — level everywhere else, but Black still holds the d4 pawn, which nothing has managed to win back, because the c6 knight still guards that square exactly as it did from the start. The minor pieces are equal in number even though their types have swapped, and neither side has a structural weakness. In short, Black is up one clean pawn.
                                  fr: Comptez les pions — à égalité partout ailleurs, mais les Noirs conservent le pion d4, que rien n'est parvenu à reprendre, car le cavalier c6 garde toujours cette case exactement comme au départ. Les pièces mineures sont égales en nombre même si leur nature a changé, et aucun camp n'a de faiblesse structurelle. En bref, les Noirs ont exactement un pion propre de plus.
                                plan:
                                  vi: Trắng phải giải quyết con mã c6 trước khi mơ tới việc đòi lại con tốt d4 — Nf3 tấn công nó, hoặc Bb5 ghim nó, là hai cách thường dùng — rồi mới tính Qxd4. Song song đó Trắng nhập thành và đưa xe ra cột trung tâm để bù lại nhịp đã mất. Đen nên hoàn tất phát triển bằng O-O và Re8 thay vì cố ôm chặt con tốt d4 bằng mọi giá, chấp nhận trả lại tốt nếu điều đó giúp hoàn thành phát triển an toàn hơn.
                                  en: White has to deal with the c6 knight before dreaming of the d4 pawn — Nf3 attacking it, or Bb5 pinning it, are the usual ways — and only then think about Qxd4. Alongside that, White castles and brings a rook to a central file to make up for the lost tempo. Black should finish developing with O-O and Re8 rather than clinging to the d4 pawn at all costs, and should be ready to give it back if that buys a smoother, safer development.
                                  fr: Les Blancs doivent régler le cavalier c6 avant de songer au pion d4 — Nf3 pour l'attaquer, ou Bb5 pour le clouer, sont les deux méthodes habituelles — et ce n'est qu'ensuite qu'ils pensent à Qxd4. En parallèle, les Blancs roquent et amènent une tour sur une colonne centrale pour compenser le temps perdu. Les Noirs devraient achever leur développement par O-O et Re8 plutôt que de s'accrocher au pion d4 à tout prix, quitte à le rendre si cela permet un développement plus sûr.
                                basis:
                                  by: chan
