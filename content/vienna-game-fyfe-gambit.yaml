# The Vienna Game: Fyfe Gambit. Frozen defining line 1.e4 e5 2.Nc3 Nc6 3.d4, which ends on
# White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
#
# The trap after 4...Nf6 5.Bg5 Nxd5?? 6.Bxd8 wins a queen for a bishop and a pawn outright,
# not by mating, so every leaf here is an assessment; nothing claims a mate (ADR-0005).
id: vienna-game-fyfe-gambit
name: 'Vienna Game: Fyfe Gambit'
eco: C25
category: gambit
side: white
definingLine: [e4, e5, Nc3, Nc6, d4]
soundness:
  value: dubious
  reviewedAt: '2026-09-18'
  basis:
    by: chan
    at: '2026-09-18'
    source: >-
      A judgement, not a database label. The gambit's real trap only bites if Black plays the
      natural-looking 4...Nf6 5.Bg5 Nxd5?? without noticing the pin behind its own knight — a
      genuine practical chance, and a costly one if it lands, since 6.Bxd8 wins a queen for a
      bishop and a pawn. But accurate defence exists and is not hard to find: 5...Be7 breaks
      the pin cleanly, and after 6.Bxf6 Black recaptures either way and keeps a clean extra
      pawn, with White's only real compensation appearing in the sharper 6...gxf6 structure.
      That is the profile of a dubious gambit rather than a sound one — real venom against an
      unprepared opponent, none against a prepared one. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
