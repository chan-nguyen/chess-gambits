tree:
  annotation:
    vi: Trắng vừa chơi d4, thách thức con tốt e5 của Đen ngay từ nước thứ ba. Đây chưa phải là Gambit Fyfe — cái tên đó chỉ xuất hiện nếu Đen ăn tốt và Trắng đáp lại bằng Nd5. Nếu Đen bỏ qua con tốt d4 thì ván cờ đơn giản trở lại thành một cuộc đổi tốt bình thường.
    en: White has just played d4, challenging Black's e5 pawn on move three. This is not yet the Fyfe Gambit — that name only applies once Black takes the pawn and White answers with Nd5. If Black ignores the tension, the game simply settles into an ordinary pawn trade.
    fr: Les Blancs viennent de jouer d4, défiant le pion e5 noir dès le troisième coup. Ce n'est pas encore le Gambit Fyfe — ce nom ne s'applique qu'une fois que les Noirs prennent le pion et que les Blancs répondent par Nd5. Si les Noirs ignorent la tension, la partie se réduit simplement à un échange de pions ordinaire.
  dismissRest:
    reason:
      vi: Đen không ăn bằng tốt. Nước 3...Nxd4 cũng ăn luôn con tốt d4 và hiện tại chưa quân Trắng nào bắt lại được nó, nên đó chỉ là một cách khác để thắng chính con tốt ấy, không dẫn tới Gambit Fyfe. Mọi nước còn lại — phát triển, đẩy tốt cánh, chiếu bằng Bb4+ hay Qh4 — đều để nguyên thế găng ở trung tâm, và Trắng đơn giản đổi bằng dxe5, đưa ván cờ về một thế cờ cân bằng, phẳng lặng mà không có nội dung lý thuyết đặc biệt. Mục này chỉ nói về những gì xảy ra sau 3...exd4.
      en: Black does not take with the pawn. 3...Nxd4 also wins the d4 pawn, and nothing White has can recapture it right now, so it is simply another way to win the same pawn rather than a route into the Fyfe Gambit. Everything else — developing, pushing a wing pawn, checking with Bb4+ or Qh4 — leaves the central tension on the board, and White simply trades with dxe5, reaching a level, quiet position with no special theory. This entry is only about what follows 3...exd4.
      fr: Les Noirs ne prennent pas du pion. 3...Nxd4 gagne lui aussi le pion d4, et rien chez les Blancs ne peut le reprendre pour l'instant, si bien que c'est simplement une autre façon de gagner ce même pion plutôt qu'une entrée dans le Gambit Fyfe. Tout le reste — développer, pousser un pion d'aile, faire échec par Bb4+ ou Qh4 — laisse la tension centrale sur l'échiquier, et les Blancs échangent simplement par dxe5, aboutissant à une position égale et calme, sans théorie particulière. Cette entrée ne traite que de ce qui suit 3...exd4.
  children:
    - ply: exd4
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen nhận con tốt tự do. Không có gì bắt lại được ngay — nếu Trắng thử Qxd4 thì con mã c6 ăn đứt hậu, nên Trắng phải tìm cách khác để lấy lại quân, và đó chính là điều Gambit Fyfe định làm.
        en: Black takes the free pawn. Nothing recaptures it at once — if White tries Qxd4, the knight on c6 simply wins the queen — so White has to find another way to get compensation, and that is exactly what the Fyfe Gambit tries to do.
        fr: Les Noirs prennent le pion libre. Rien ne le reprend aussitôt — si les Blancs tentent Qxd4, le cavalier en c6 gagne tout simplement la dame — les Blancs doivent donc trouver une autre voie vers la compensation, et c'est précisément ce que tente le Gambit Fyfe.
      children:
        - ply: Nd5
          annotation:
            vi: Đây là Gambit Fyfe. Thay vì lấy lại tốt ngay (điều không an toàn vì mã c6 canh giữ ô d4), Trắng nhảy mã vào d5, một ô mạnh mà không tốt nào của Đen đuổi được. Ý đồ chưa lộ ra ngay — nếu Đen đưa mã ra f6 để đuổi con mã d5, Trắng sẽ đáp Bg5 ghim con mã ấy vào hậu d8.
            en: This is the Fyfe Gambit. Rather than recapture the pawn at once, which is unsafe because the c6 knight guards d4, White jumps the knight to d5, a strong square no black pawn can ever challenge. The idea is not obvious yet — if Black chases the knight away with 4...Nf6, White answers Bg5, pinning that knight to the queen on d8.
            fr: Voici le Gambit Fyfe. Plutôt que de reprendre aussitôt le pion, ce qui n'est pas sûr puisque le cavalier c6 garde la case d4, les Blancs sautent le cavalier en d5, une case forte qu'aucun pion noir ne pourra jamais contester. L'idée n'est pas encore visible — si les Noirs chassent le cavalier par 4...Nf6, les Blancs répondent Bg5, clouant ce cavalier contre la dame en d8.
          dismissRest:
            reason:
              vi: Đen không đuổi mã bằng ...Nf6. Nước ...Bb4+ chỉ ép Trắng chặn bằng c3, được đúng thế trận Trắng muốn mà lại bỏ luôn cơ hội gặp thế ghim sau này. Nước ...d3 đẩy tốt đi tiếp thì Trắng ăn lại bất cứ lúc nào bằng cxd3 hay Qxd3, chẳng thiệt gì. Các nước phát triển khác như ...Nge7, ...Bc5 hay ...Nb4 không đụng đến con mã d5 và không ngăn được Bg5 xuất hiện ở nước sau; Trắng cứ tiếp tục phát triển với con mã trung tâm mạnh mẽ ấy và tính chuyện đòi lại con tốt sau. Chỉ có ...Nf6 mới thực sự chạm vào ý tưởng của gambit.
              en: Black does not chase the knight with ...Nf6. ...Bb4+ only forces c3 in reply, giving White exactly the pawn structure it wants while giving up the chance to meet ...Nf6 with the pin later. ...d3, pushing the pawn on, is met by cxd3 or Qxd3 whenever White likes, at no cost. Other developing tries such as ...Nge7, ...Bc5 or ...Nb4 do not touch the knight on d5 and do not stop Bg5 appearing next; White simply continues developing behind that strong central knight and looks to win the pawn back later. Only ...Nf6 actually meets the gambit's real idea.
              fr: Les Noirs ne chassent pas le cavalier par ...Nf6. ...Bb4+ ne fait que forcer c3 en réponse, donnant aux Blancs exactement la structure de pions qu'ils souhaitent tout en renonçant à répondre plus tard à ...Nf6 par le clouage. ...d3, qui pousse le pion plus loin, se traite par cxd3 ou Qxd3 quand les Blancs le souhaitent, sans aucun coût. D'autres tentatives de développement comme ...Nge7, ...Bc5 ou ...Nb4 ne touchent pas au cavalier en d5 et n'empêchent pas Bg5 d'apparaître au coup suivant ; les Blancs continuent simplement leur développement derrière ce cavalier central puissant et cherchent à regagner le pion plus tard. Seul ...Nf6 répond réellement à l'idée du gambit.
          children:
            - ply: Nf6
              replyQuality: good
              frequency: common
              annotation:
                vi: Nước tự nhiên và cũng là nước phổ biến nhất — Đen đuổi con mã mạnh ở d5 bằng chính con mã của mình. Nhưng đây cũng chính là nước duy nhất mở ra ý đồ thật sự của Trắng.
                en: The natural move and also the most common one — Black chases the strong knight on d5 with a knight of its own. But this is also the one move that opens the door to White's real idea.
                fr: Le coup naturel et aussi le plus fréquent — les Noirs chassent le cavalier fort en d5 avec leur propre cavalier. Mais c'est aussi le seul coup qui ouvre la porte à la véritable idée des Blancs.
              children:
                - ply: Bg5
                  annotation:
                    vi: Trắng không lùi mã, không đổi mã, mà đưa tượng ra g5. Đường chéo g5-d8 đi qua đúng ô f6, nên con mã Đen ở đó bị ghim vào hậu. Nếu Đen bất cẩn đổi mã bằng ...Nxd5, đường chéo ấy mở ra ngay và Trắng ăn hậu bằng Bxd8.
                    en: White neither retreats nor trades the knight, but brings the bishop to g5 instead. The diagonal from g5 to d8 runs straight through f6, so Black's knight there is pinned to the queen. If Black carelessly trades on d5 with ...Nxd5, that diagonal opens at once and White wins the queen with Bxd8.
                    fr: Les Blancs ne reculent ni n'échangent le cavalier, mais amènent le fou en g5. La diagonale de g5 à d8 passe justement par f6, si bien que le cavalier noir qui s'y trouve est cloué contre la dame. Si les Noirs échangent imprudemment en d5 par ...Nxd5, cette diagonale s'ouvre aussitôt et les Blancs gagnent la dame par Bxd8.
                  dismissRest:
                    reason:
                      vi: Đen không phá ghim bằng ...Be7. Con mã f6 đang bị ghim vào hậu d8, nên bất cứ nước nào tự di chuyển chính con mã ấy đi nơi khác — không chỉ ...Nxd5 mà cả ...Nxe4, ...Ng4, ...Nh5 và ...Ng8 — đều mở toang đường chéo và thua hậu vào Bxd8 giống hệt nhau, vì con mã chính là thứ duy nhất đang chắn đường chéo đó. Nước ...h6 hay ...Rg8 gây sức ép lên tượng nhưng không di chuyển con mã nên chưa thua ngay — Trắng chỉ cần lùi tượng về h4 và áp lực vẫn còn y như cũ. Mọi nước khác không đụng đến con mã f6 (đưa mã kia đi, đẩy tốt, đi hậu hay xe) cũng chưa thua ngay vì lý do tương tự, nhưng cũng chẳng giải quyết được gì. Chỉ có ...Be7 mới thực sự phá được thế ghim.
                      en: Black does not break the pin with ...Be7. The knight on f6 is pinned to the queen on d8, so any move that moves that very knight away — not just ...Nxd5 but also ...Nxe4, ...Ng4, ...Nh5 and ...Ng8 — opens the diagonal wide and loses the queen to Bxd8 in exactly the same way, because the knight is the one thing blocking that diagonal. ...h6 and ...Rg8 pressure the bishop without moving the knight, so they do not lose outright — White simply retreats to h4 and the pressure is unchanged. Everything else that leaves the f6 knight alone (moving the other knight, a pawn push, a queen or rook move) does not lose outright either, for the same reason, but it does not solve anything either. Only ...Be7 actually breaks the pin for good.
                      fr: Les Noirs ne brisent pas le clouage par ...Be7. Le cavalier en f6 est cloué contre la dame en d8, donc tout coup qui déplace ce même cavalier — pas seulement ...Nxd5 mais aussi ...Nxe4, ...Ng4, ...Nh5 et ...Ng8 — ouvre grand la diagonale et perd la dame par Bxd8 exactement de la même façon, car ce cavalier est la seule chose qui bloque cette diagonale. ...h6 et ...Rg8 pressent le fou sans déplacer le cavalier, donc ils ne perdent pas sur-le-champ — les Blancs reculent simplement en h4 et la pression reste la même. Tout le reste qui laisse le cavalier f6 tranquille (déplacer l'autre cavalier, une poussée de pion, un coup de dame ou de tour) ne perd pas non plus sur-le-champ, pour la même raison, mais ne règle rien non plus. Seul ...Be7 brise réellement le clouage.
                  children:
