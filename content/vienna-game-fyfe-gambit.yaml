                              annotation:
                                vi: Đen ăn lại bằng tốt g, giữ được cặp tượng nhưng phải trả giá bằng cấu trúc tốt cánh vua. Đây là lựa chọn tham vọng hơn, đổi sự an toàn của vua lấy hai con tượng.
                                en: Black recaptures with the g-pawn, keeping the bishop pair at the cost of the kingside pawn structure. This is the more ambitious choice, trading king safety for the two bishops.
                                fr: Les Noirs reprennent du pion g, conservant la paire de fous au prix de la structure de pions du roque. C'est le choix le plus ambitieux, échangeant la sécurité du roi contre les deux fous.
                              outcome:
                                type: position
                                evaluation:
                                  vi: Đen vẫn hơn một tốt sạch giống hệt nhánh kia, nhưng lần này phải trả một cái giá thấy rõ trên bàn cờ — hai tốt f chồng lên nhau ở f6 và f7, cột g mở toang, và nếu Đen còn định nhập thành cánh vua thì trước mặt vua sẽ chẳng còn tốt g để che. Đổi lại Đen giữ được cặp tượng, nhưng cấu trúc bị hỏng là thứ không sửa được.
                                  en: Black is still up the same clean pawn as in the other branch, but this time at a cost that is plainly visible on the board — doubled f-pawns on f6 and f7, a wide-open g-file, and no g-pawn left to shelter the king if Black still means to castle short. In exchange Black keeps the bishop pair, but the broken structure is not something that can be repaired.
                                  fr: Les Noirs conservent le même pion propre de plus que dans l'autre branche, mais cette fois au prix d'un défaut bien visible sur l'échiquier — des pions f doublés en f6 et f7, une colonne g grande ouverte, et plus aucun pion g pour abriter le roi si les Noirs comptent toujours roquer du petit côté. En échange, les Noirs gardent la paire de fous, mais la structure abîmée ne se répare pas.
                                plan:
                                  vi: Trắng nhắm ngay vào cột g và vua Đen — Qd3 hoặc Qh5 rồi O-O-O và g4-g5 mở thêm đường, hoặc đơn giản là Nf3-h4 nhắm ô f5 và g6. Trắng cũng chưa quên món nợ ở d4, và Nf3 vẫn là bước chuẩn bị hợp lý cho Qxd4 sau này. Đen nên tránh nhập thành cánh vua khi cột g đã mở sẵn cho đối phương, chơi Rg8 để phòng thủ cột ấy, và tìm cách đổi bớt quân nặng trước khi vua phải quyết định về đâu.
                                  en: White aims straight at the g-file and Black's king — Qd3 or Qh5, then O-O-O and g4-g5 to prise things open further, or simply Nf3-h4 eyeing f5 and g6. White has not forgotten the debt on d4 either, and Nf3 is still a sensible way to prepare Qxd4 later. Black should avoid castling into the open g-file, play ...Rg8 to defend it, and look to trade off some heavy pieces before the king has to decide where to go.
                                  fr: Les Blancs visent directement la colonne g et le roi noir — Qd3 ou Qh5, puis O-O-O et g4-g5 pour ouvrir davantage, ou tout simplement Nf3-h4 en direction de f5 et g6. Les Blancs n'ont pas non plus oublié la dette en d4, et Nf3 reste une préparation raisonnable pour Qxd4 plus tard. Les Noirs devraient éviter de roquer du côté où la colonne g est déjà ouverte, jouer ...Rg8 pour la défendre, et chercher à échanger quelques pièces lourdes avant que le roi ne doive choisir où aller.
