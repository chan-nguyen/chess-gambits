                              children:
                                - ply: exd5
                                  annotation:
                                    vi: Trắng ăn nốt con mã lạc lõng ấy bằng chính con tốt e4. Cả cuộc phiêu lưu của Đen — đổi mã, mất hậu, mất mã — kết thúc ở đây.
                                    en: White scoops up the stray knight with the e4 pawn. Black's whole adventure — trading the knight, losing the queen, losing the knight as well — ends right here.
                                    fr: Les Blancs ramassent le cavalier égaré avec le pion e4. Toute l'aventure noire — échanger le cavalier, perdre la dame, perdre aussi le cavalier — s'arrête ici.
                                  outcome:
                                    type: position
                                    evaluation:
                                      vi: Đếm quân — Trắng có hậu, hai xe, một tượng và một mã; Đen có hai xe, hai tượng và một mã nhưng không còn hậu. Nói cách khác Trắng có nguyên một hậu đổi lấy một tượng và một tốt, một khoản lời quyết định và không gì bù lại được cho Đen.
                                      en: Count the material — White has a queen, two rooks, a bishop and a knight; Black has two rooks, two bishops and a knight but no queen at all. In other words White has a whole queen for a bishop and a pawn — a decisive material gain with nothing on the board to compensate Black for it.
                                      fr: Comptez le matériel — les Blancs ont une dame, deux tours, un fou et un cavalier ; les Noirs ont deux tours, deux fous et un cavalier, mais plus aucune dame. Autrement dit, les Blancs ont une dame entière contre un fou et un pion — un gain matériel décisif, sans rien sur l'échiquier pour compenser les Noirs.
                                    plan:
                                      vi: Trắng chỉ cần chơi những nước đơn giản — Nf3, Bc4 hay Be2, rồi nhập thành — giữ chặt khoản lời vật chất và tránh mọi biến phức tạp không cần thiết vì phần thắng đã nằm chắc trong tay. Đen có thể thử kiếm chác bằng cặp tượng và một chút hoạt động của xe, nhưng không có kế hoạch nào bù lại được một con hậu, và mục tiêu thực tế nhất của Đen chỉ còn là cầm cự.
                                      en: White simply needs to play natural moves — Nf3, Bc4 or Be2, then castle — banking the material gain and avoiding needless complications, because the win is already secured. Black can try to generate some activity with the bishop pair and the rooks, but no plan makes up for a missing queen, and the most realistic aim left is simply to hold on.
                                      fr: Les Blancs n'ont qu'à jouer des coups naturels — Nf3, Bc4 ou Be2, puis roquer — en engrangeant le gain matériel et en évitant toute complication inutile, la victoire étant déjà acquise. Les Noirs peuvent tenter de créer un peu d'activité avec la paire de fous et les tours, mais aucun plan ne compense une dame manquante, et le seul objectif réaliste qui reste est de tenir le coup.
