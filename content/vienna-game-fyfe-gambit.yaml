                          annotation:
                            vi: Trắng ăn hậu ngay lập tức. Đây không phải chiếu — vua Đen ở e8 không nằm trên đường chéo của tượng — nên Đen được chọn cách ăn lại, nhưng dù chọn cách nào thì con mã Đen vừa đứng ở d5 cũng không còn ai giữ.
                            en: White wins the queen at once. It is not check — the king on e8 is not on the bishop's diagonal — so Black gets to choose how to recapture, but whichever way Black chooses, the knight now sitting on d5 is left with nothing defending it.
                            fr: Les Blancs gagnent la dame sur-le-champ. Ce n'est pas échec — le roi en e8 n'est pas sur la diagonale du fou — les Noirs choisissent donc comment reprendre, mais quel que soit leur choix, le cavalier désormais en d5 se retrouve sans aucune défense.
                          dismissRest:
                            reason:
                              vi: Đen ăn lại tượng bằng cách khác, ví dụ ...Nxd8 bằng con mã c6, hoặc không ăn lại chút nào. Đổi bằng mã cũng dẫn tới đúng nước 7.exd5 tiếp theo và mất y hệt con mã ấy. Không ăn lại thì Đen mất trắng cả một con hậu mà chẳng được gì bù lại. Không có cách nào vừa lấy lại con tượng vừa cứu được con mã đang bị bỏ rơi ở d5.
                              en: Black recaptures the bishop some other way, for instance ...Nxd8 with the c6 knight, or does not recapture at all. Recapturing with the knight walks into the very same 7.exd5 next and loses that knight all the same. Not recapturing at all leaves Black down a whole queen for nothing in return. There is no way to win the bishop back and also save the knight abandoned on d5.
                              fr: Les Noirs reprennent le fou autrement, par exemple ...Nxd8 avec le cavalier c6, ou ne reprennent pas du tout. Reprendre du cavalier tombe sur ce même 7.exd5 au coup suivant et perd ce cavalier tout autant. Ne pas reprendre laisse les Noirs avec une dame de moins sans aucune contrepartie. Il n'existe aucun moyen de regagner le fou tout en sauvant le cavalier abandonné en d5.
