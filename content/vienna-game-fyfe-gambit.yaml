                        en: A serious mistake. Black trades the knight and forgets that the f6 knight was the one thing holding the diagonal shut in front of its own queen. The moment the knight leaves f6, the bishop on g5 looks straight down to d8.
                        fr: Une erreur grave. Les Noirs échangent le cavalier en oubliant que ce cavalier en f6 était ce qui tenait fermée la diagonale devant leur propre dame. Dès que le cavalier quitte f6, le fou en g5 voit directement jusqu'en d8.
