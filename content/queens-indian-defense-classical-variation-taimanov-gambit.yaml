    source: >-
      A judgement. White is a pawn down after 7...exd5, and the c4 pawn is attacked by the
      d5 pawn with nothing defending it. White's hope is the bishop on g2, which would
      attack the undefended bishop on b7 if the d5 pawn left the diagonal. That is a trap
      more than a plan, so the label is dubious. No engine was consulted and no database was
      queried.
