# King's Gambit Accepted: Allgaier Gambit, taught. Frozen defining line 1.e4 e5 2.f4 exf4
# 3.Nf3 g5 4.h4 g4 5.Ng5 ends on White's own 5.Ng5, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). The modelled line is 5...h6 6.Nxf7 Kxf7 7.Qxg4 Qf6:
# Black's reply, White's knight sacrifice as the learner's move, the recapture, White's
# queen taking the loose pawn on g4, and Black defending f4. The leaf has White to move, and
# it is played out one capture past the bare 6...Kxf7 position so that Qxg4 is not left
# going free. Every ply was replayed with chess.js; searchMate at 3 moves from the leaf
# returns no-mate, the leaf is not in check and no capture is going free.
id: kings-gambit-accepted-allgaier-gambit
name: "King's Gambit Accepted: Allgaier Gambit"
eco: C39
category: gambit
side: white
definingLine: [e4, e5, f4, exf4, Nf3, g5, h4, g4, Ng5]
soundness:
  value: dubious
  reviewedAt: '2026-09-30'
  basis:
    by: chan
    at: '2026-09-30'
    source: >-
      A judgement. The knight on g5 is defended by the pawn on h4 and eyes f7 and h7, but the
      sacrifice on f7 that follows costs a knight, and what White gets in return is an enemy king
      that can no longer castle and a pawn count of seven to six. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-09-30'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement
    on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa chơi 5.Ng5. Mã được tốt h4 bảo vệ và nhắm cả f7 lẫn h7, trong khi tốt g4 của Đen không có ai đỡ còn hậu d8 thì đang đánh vào con mã.
    en: White has just played 5.Ng5. The knight is defended by the pawn on h4 and attacks both f7 and h7, while Black's pawn on g4 has no defender and the queen on d8 attacks the knight.
    fr: Les Blancs viennent de jouer 5.Ng5. Le cavalier est défendu par le pion h4 et attaque à la fois f7 et h7, tandis que le pion noir en g4 n'a aucun défenseur et que la dame d8 attaque le cavalier.
  dismissRest:
    reason:
      vi: Đen chơi một nước khác thay vì 5...h6, chẳng hạn 5...Nf6 hoặc 5...d6, phát triển thay vì đuổi mã ngay lập tức.
      en: Black plays something other than 5...h6 here, for example 5...Nf6 or 5...d6, developing instead of chasing the knight at once.
      fr: Les Noirs jouent autre chose que 5...h6, par exemple 5...Nf6 ou 5...d6, en se développant au lieu de chasser tout de suite le cavalier.
  children:
    - ply: h6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen đuổi mã bằng tốt h. Lúc này mã bị đánh hai lần, bởi tốt h6 và hậu d8, và chỉ có tốt h4 bảo vệ.
        en: Black chases the knight with the h-pawn. The knight is now attacked twice, by the pawn on h6 and by the queen on d8, and defended only by the pawn on h4.
        fr: Les Noirs chassent le cavalier avec le pion h. Le cavalier est maintenant attaqué deux fois, par le pion h6 et par la dame d8, et défendu seulement par le pion h4.
      children:
        - ply: Nxf7
          annotation:
            vi: Trắng hy sinh mã để ăn tốt f7. Mã đánh cùng lúc hậu d8 và xe h8, và vua có thể ăn nó.
            en: White gives up the knight for the pawn on f7. The knight attacks the queen on d8 and the rook on h8 at the same time, and the king can take it.
            fr: Les Blancs sacrifient le cavalier contre le pion f7. Le cavalier attaque en même temps la dame d8 et la tour h8, et le roi peut le prendre.
          dismissRest:
            reason:
              vi: Đen chơi một nước khác thay vì Kxf7, nên lúc này mã f7 vẫn còn trên bàn cờ, đang chiếu đồng thời hậu d8 và xe h8.
              en: Black plays something other than Kxf7, so the knight on f7 stays on the board for the moment, forking the queen on d8 and the rook on h8.
              fr: Les Noirs jouent autre chose que Kxf7, si bien que le cavalier f7 reste sur l'échiquier pour le moment, en fourchette sur la dame d8 et la tour h8.
          children:
            - ply: Kxf7
              replyQuality: good
              frequency: common
              annotation:
                vi: Đen dùng vua ăn mã. Vua giờ đứng ở f7 và đã mất quyền nhập thành, còn Đen vừa được một mã đổi lấy một tốt. Tốt g4 vẫn chưa có ai bảo vệ.
                en: Black takes the knight with the king. The king now stands on f7 and has lost the right to castle, and Black has won a knight for a pawn. The pawn on g4 still has no defender.
                fr: Les Noirs prennent le cavalier avec le roi. Le roi se trouve maintenant en f7 et a perdu le droit de roquer, et les Noirs ont gagné un cavalier contre un pion. Le pion g4 n'a toujours aucun défenseur.
              children:
                - ply: Qxg4
                  annotation:
                    vi: Trắng ăn tốt g4 bằng hậu. Hậu đánh mã g8, tốt d7 và tốt f4, còn tốt h4 được hậu và xe bảo vệ.
                    en: White takes the pawn on g4 with the queen. The queen attacks the knight on g8, the pawn on d7 and the pawn on f4, while the pawn on h4 is defended by the queen and the rook.
                    fr: Les Blancs prennent le pion g4 avec la dame. La dame attaque le cavalier g8, le pion d7 et le pion f4, tandis que le pion h4 est défendu par la dame et la tour.
                  dismissRest:
                    reason:
                      vi: Đen chơi một nước khác thay vì 7...Qf6, chẳng hạn 7...Bd6, cũng bảo vệ f4. Phần lớn các nước còn lại để tốt f4 cho Qxf4.
                      en: Black plays something other than 7...Qf6, for example 7...Bd6, which also defends f4. Most other moves leave the pawn on f4 to Qxf4.
                      fr: Les Noirs jouent autre chose que 7...Qf6, par exemple 7...Bd6, qui défend aussi f4. La plupart des autres coups laissent le pion f4 à Qxf4.
                  children:
                    - ply: Qf6
                      replyQuality: good
                      frequency: common
                      annotation:
                        vi: Hậu Đen bảo vệ tốt f4 và đánh vào tốt h4 cùng tốt b2, cả hai đều có quân bảo vệ.
                        en: The black queen defends the pawn on f4 and attacks the pawns on h4 and b2, both of which are defended.
                        fr: La dame noire défend le pion f4 et attaque les pions h4 et b2, qui sont tous deux défendus.
                      outcome:
                        type: position
                        evaluation:
                          vi: 'Đếm quân: Trắng bảy tốt, Đen sáu, nhưng Trắng kém một mã, nên Đen hơn một mã đổi lấy một tốt. Vua Đen đứng ở f7 và không còn quyền nhập thành. Hậu g4 của Trắng đánh mã g8 và tốt d7, cả hai đều có quân bảo vệ, còn tốt f4 được hậu f6 bảo vệ.'
                          en: "Count the material: White has seven pawns to Black's six, but White is a knight down, so Black is ahead by a knight for a pawn. Black's king stands on f7 and can no longer castle. White's queen on g4 attacks the knight on g8 and the pawn on d7, both of them defended, and the pawn on f4 is defended by the queen on f6."
                          fr: "Comptez le matériel : les Blancs ont sept pions contre six, mais il leur manque un cavalier, si bien que les Noirs ont un cavalier contre un pion d'avance. Le roi noir est en f7 et ne peut plus roquer. La dame blanche g4 attaque le cavalier g8 et le pion d7, tous deux défendus, et le pion f4 est défendu par la dame f6."
                        plan:
                          vi: Trắng có thể chiếu bằng Bc4+ rồi phát triển bằng Nc3. Đen chắn bằng ...d5 hoặc đi vua, rồi hoàn tất phát triển bằng ...Nc6 và tìm cách củng cố con mã hơn.
                          en: White can check with Bc4+ and then develop with Nc3. Black blocks with ...d5 or steps the king aside, then completes development with ...Nc6 and looks to consolidate the extra knight.
                          fr: Les Blancs peuvent donner échec par Bc4+ puis se développer par Nc3. Les Noirs interposent par ...d5 ou écartent le roi, puis achèvent leur développement par ...Nc6 et cherchent à consolider le cavalier de plus.
                        basis:
                          by: chan
                          at: '2026-09-30'
