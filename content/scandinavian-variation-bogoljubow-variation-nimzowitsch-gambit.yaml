# Nimzowitsch Defense: Scandinavian Variation, Bogoljubow Variation, Nimzowitsch Gambit.
# Frozen defining line 1.e4 Nc6 2.d4 d5 3.Nc3 dxe4 4.d5 Ne5 ends on Black's ply, which is the
# opponent's, so the authored defining line stops one ply earlier, at 1.e4 Nc6 2.d4 d5 3.Nc3
# dxe4 4.d5 (docs/CONTEXT.md, invariant 5), and the dropped ply Ne5 is modelled below as the
# first reply; the shortened line is a prefix of the catalogue line, which the catalogue build
# accepts. Part of batch t of round 4 (#182). Every ply below was replayed with chess.js
# before it was annotated; searchMate at 3 moves from the leaf returns no-mate, so no forced
# mate is claimed anywhere in this entry, and no capture is left going free at the leaf.
id: 'scandinavian-variation-bogoljubow-variation-nimzowitsch-gambit'
name: 'Nimzowitsch Defense: Scandinavian Variation, Bogoljubow Variation, Nimzowitsch Gambit'
eco: 'B00'
