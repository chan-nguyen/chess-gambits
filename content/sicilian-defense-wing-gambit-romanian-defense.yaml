tree:
  annotation:
    vi: Sau một loạt thí tốt liên tiếp (b4, exd5, giờ thêm c4 đuổi hậu), Trắng đổi vật chất lấy cặp
      tượng và các đường mở, còn Đen đã giữ được một tốt thừa sau khi ăn ở d5.
    en:
      After a string of pawn sacrifices in a row (b4, exd5, now c4 chasing the queen), White trades
      material for the bishop pair and open lines, while Black has kept an extra pawn since
      capturing on d5.
    fr: Après une série de sacrifices de pions (b4, exd5, puis c4 chassant la dame), les Blancs
      échangent du matériel contre la paire de fous et des colonnes ouvertes, tandis que les Noirs
      ont conservé un pion supplémentaire depuis la prise en d5.
  dismissRest:
    reason:
      vi:
        Hậu Đen lui về ô khác ngoài e6, ví dụ Qd6 hay Qd8. Ý tưởng của Trắng — dùng cặp tượng và các
        đường mở bù cho vật chất — và đánh giá chung không đổi nhiều theo ô hậu lui về.
      en:
        Black's queen retreats to some other square than e6, for instance Qd6 or Qd8. White's idea —
        using the bishop pair and open lines as compensation — and the overall assessment do not
        change much depending on the retreat square.
      fr:
        La dame noire recule sur une autre case que e6, par exemple Qd6 ou Qd8. L'idée des Blancs —
        utiliser la paire de fous et les colonnes ouvertes en compensation — et l'évaluation
        générale ne changent guère selon la case de repli.
  children:
    - ply: Qe6
      replyQuality: best
      frequency: common
      annotation:
        vi: Bị tốt c4 đuổi, hậu Đen lui về e6, vẫn giữ áp lực lên trung tâm và đường chéo a2-g8.
        en:
          Chased by the c4 pawn, Black's queen retreats to e6, still eyeing the centre and the a2-g8
          diagonal.
        fr:
          Chassée par le pion c4, la dame noire recule en e6, gardant un œil sur le centre et la diagonale
          a2-g8.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 6 còn Đen 7 — Đen hơn đúng một tốt sạch.
          en: Count the pawns and it is 6 for White against 7 for Black — Black is up one clean pawn.
          fr:
            "Comptez les pions : 6 pour les Blancs contre 7 pour les Noirs — les Noirs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng chơi Bxe5 hoặc Nxe5 ăn thêm tốt, tranh thủ cặp tượng và các đường mở để bù cho vật chất đã
            thí. Đen chơi Nf6 hoặc Bd6, hoàn thiện phát triển và cố giữ vững tốt thừa cùng trung
            tâm.
          en:
            White plays Bxe5 or Nxe5 to win back a pawn, leaning on the bishop pair and the open lines as
            compensation for the sacrificed material. Black plays Nf6 or Bd6, finishing development
            and trying to hold the extra pawn along with the centre.
          fr:
            Les Blancs jouent Bxe5 ou Nxe5 pour regagner un pion, s'appuyant sur la paire de fous et les
            colonnes ouvertes en compensation du matériel sacrifié. Les Noirs jouent Nf6 ou Bd6,
            achevant leur développement et tentant de garder le pion supplémentaire ainsi que le
            centre.
        basis:
          by: chan
          at: 2026-09-29
