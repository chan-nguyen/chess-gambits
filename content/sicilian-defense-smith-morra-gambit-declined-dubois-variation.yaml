# Sicilian Defense: Smith-Morra Gambit Declined, Dubois Variation. Frozen defining line 1.e4 c5
# 2.d4 cxd4 3.c3 d3 4.c4, which ends on White's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 4...Nf6 5.Bxd3 Nc6. searchMate at 3
# moves from the resulting position returns no-mate, so no forced mate is claimed anywhere in this
# entry, and no capture is left going free at the leaf.
id: sicilian-defense-smith-morra-gambit-declined-dubois-variation
name: 'Sicilian Defense: Smith-Morra Gambit Declined, Dubois Variation'
eco: B21
category: gambit
side: white
definingLine: [e4, c5, d4, cxd4, c3, d3, c4]
soundness:
  value: dubious
