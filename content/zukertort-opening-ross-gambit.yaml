# Zukertort Opening: Ross Gambit. Frozen defining line 1.Nf3 e5, which ends on Black's own
# ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). The line below was
# replayed with chess.js before being annotated.
id: zukertort-opening-ross-gambit
name: 'Zukertort Opening: Ross Gambit'
eco: A04
category: gambit
side: black
definingLine: [Nf3, e5]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. Black hangs the e5 pawn in the hope of a tempo later, but White simply
      takes it with Nxe5 and the pawn is just gone; nothing about the resulting position
      forces White's knight anywhere yet, so the gambit has not shown anything for the
      pawn. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen chơi 1...e5, mời Trắng ăn ngay con tốt này, hy vọng một nước sau như ...Qe7 hay ...Nc6 đuổi mã sẽ lấy lại nhịp đã mất.
    en: Black plays 1...e5, inviting White to take the pawn at once, hoping a later ...Qe7 or ...Nc6 chasing the knight will win back the tempo.
    fr: Les Noirs jouent 1...e5, invitant les Blancs à prendre aussitôt le pion, en espérant qu'un futur ...Qe7 ou ...Nc6 chassant le cavalier permette de regagner le temps perdu.
  dismissRest:
    reason:
      vi: Trắng không ăn tốt e5. Các nước khác như e4, d4 hay g3 để nguyên con tốt ấy trên bàn cờ, và Đen giữ được trung tâm mà không cần phải chứng minh gì thêm.
      en: White does not take the e5 pawn. Anything else, such as e4, d4 or g3, leaves that pawn sitting on the board, and Black keeps the centre without having to prove anything further.
      fr: Les Blancs ne prennent pas le pion e5. Tout le reste, comme e4, d4 ou g3, laisse ce pion sur l'échiquier, et les Noirs gardent le centre sans avoir à prouver quoi que ce soit de plus.
  children:
    - ply: Nxe5
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng ăn thẳng con tốt đang bỏ ngỏ, cách trực diện nhất để kiểm chứng xem Đen có thật sự bù đắp được hay không.
        en: White simply takes the undefended pawn, the most direct way to test whether Black really has enough to show for it.
        fr: Les Blancs prennent simplement le pion sans défenseur, la façon la plus directe de tester si les Noirs ont vraiment de quoi compenser.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy — Trắng hơn đúng một tốt sạch mà chưa mất gì để đổi lại. Cột e của Đen giờ đã nửa mở ngay trước mặt vua e8 của chính mình, và hiện tại chính con mã Trắng đang chiếm giữ ô duy nhất đáng kể trên cột ấy.
          en: Count the pawns and it is eight for White, seven for Black — White is a clean pawn up with nothing given back for it. Black's own e-file is now half-open right in front of his king on e8, and at the moment it is White's own knight that sits on the one square on it that matters.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs — les Blancs ont un pion de plus, sans rien avoir cédé en retour. La colonne e des Noirs est maintenant semi-ouverte juste devant leur propre roi en e8, et c'est justement le cavalier blanc qui occupe pour l'instant la seule case qui compte sur cette colonne.
        plan:
          vi: Trắng chơi d4, Bc4 hay g3 và Bg2, phát triển bình thường và đơn giản giữ vững con tốt thừa vì chưa có gì bắt buộc con mã phải rời đi. Đen chơi ...Nc6 hay ...Qe7 để giành lại một nhịp bằng cách đuổi mã, rồi ...Nf6 hay ...d6, cố lấy lại chút phát triển bù cho con tốt đã mất.
          en: White plays d4, Bc4 or g3 and Bg2, developing normally and simply holding the extra pawn since nothing yet forces the knight to move again. Black plays ...Nc6 or ...Qe7 to win back a tempo by chasing the knight, then ...Nf6 or ...d6, trying to get some development back to make up for the missing pawn.
          fr: Les Blancs jouent d4, Bc4 ou g3 et Bg2, se développant normalement et gardant simplement le pion supplémentaire, rien ne forçant encore le cavalier à rebouger. Les Noirs jouent ...Nc6 ou ...Qe7 pour regagner un temps en chassant le cavalier, puis ...Nf6 ou ...d6, essayant de récupérer un peu de développement pour compenser le pion manquant.
        basis:
          by: chan
          at: '2026-09-25'
