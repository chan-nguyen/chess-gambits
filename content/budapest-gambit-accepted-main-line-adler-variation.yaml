# Budapest Gambit Accepted: Main Line, Adler Variation. Frozen defining line 1.d4 Nf6 2.c4
# e5 3.dxe5 Ng4, which ends on Black's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 4.Nf3: White develops and
# defends e5 with a piece rather than a pawn. Nothing is hanging at the resulting position.
# searchMate at 4 moves from this position returns no-mate, so no forced mate is claimed
# anywhere in this entry.
id: budapest-gambit-accepted-main-line-adler-variation
name: 'Budapest Gambit Accepted: Main Line, Adler Variation'
eco: A52
category: gambit
side: black
definingLine: [d4, Nf6, c4, e5, dxe5, Ng4]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement, and the same label the catalogue's family rule carries. Defending e5 with
      a piece rather than trying to hold it with a pawn move is White's simplest and soundest
      answer to the whole gambit, so this is judged White's most testing try. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Sau khi ăn tốt e5, Đen đáp lại bằng 3...Ng4, tấn công ngay con tốt e5 và dọa ăn lại nó bằng mã trước khi Trắng kịp phát triển.
    en: After the e5 pawn is taken, Black answers with 3...Ng4, attacking the e5 pawn at once and threatening to win it back with the knight before White can develop.
    fr: Après la prise du pion e5, les Noirs répondent par 3...Ng4, attaquant aussitôt le pion e5 et menaçant de le reprendre avec le cavalier avant que les Blancs ne se développent.
  dismissRest:
    reason:
      vi: Trắng không chơi 4.Nf3. Cố giữ tốt bằng f4 để lại điểm yếu lớn ở e3 và đường chéo a7-g1, còn Bf4 hay e4 giữ tốt theo cách khác, mỗi cách có trang riêng của nó.
      en: White does not play 4.Nf3. Trying to hold the pawn with f4 leaves a serious weakness on e3 and the a7-g1 diagonal, while Bf4 or e4 hold the pawn in a different way, each with its own page.
      fr: Les Blancs ne jouent pas 4.Nf3. Essayer de garder le pion par f4 laisse une faiblesse sérieuse en e3 et sur la diagonale a7-g1, tandis que Bf4 ou e4 gardent le pion d'une autre façon, chacun avec sa propre page.
  children:
    - ply: Nf3
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng phát triển mã để đỡ thêm cho tốt e5, đơn giản và vững chắc hơn mọi cách giữ tốt bằng tốt. Đây là nước được đánh giá cao nhất trong toàn bộ biến đã nhận.
        en: White develops the knight to add a second defender to e5, simpler and sounder than any way of holding the pawn with a pawn move. This is rated the best try in the whole accepted line.
        fr: Les Blancs développent le cavalier pour ajouter un second défenseur à e5, plus simple et plus sain que toute façon de garder le pion par un coup de pion. C'est le coup le mieux considéré de toute la ligne acceptée.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy, Trắng hơn đúng một tốt sạch. Con tốt e5 giờ có hai quân đỡ, mã f3 và tốt f2 nếu cần đẩy lên, còn con mã Đen ở g4 đứng khá xa trung tâm và sẽ cần thêm vài nhịp để tạo ra áp lực thật sự bù cho con tốt đã mất.
          en: Count the pawns, eight for White, seven for Black — White is a clean pawn up. The e5 pawn now has two defenders, the f3 knight and, if it ever pushes, the f2 pawn, while Black's knight on g4 sits some way from the centre and will need a few more moves to build any real pressure to compensate for the lost pawn.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs — les Blancs ont un pion net d'avance. Le pion e5 a désormais deux défenseurs, le cavalier f3 et, s'il avance un jour, le pion f2, tandis que le cavalier noir en g4 se trouve assez loin du centre et aura besoin de plusieurs coups de plus pour créer une vraie pression compensant le pion perdu.
        plan:
          vi: Đen chơi Bc5 hay Nc6, nhắm vào f2 và chuẩn bị Ngxe5 khi có dịp, cùng O-O sớm để đưa vua vào nơi an toàn. Trắng chơi Bf4, e3 và Be2, hoàn tất phát triển một cách chắc chắn và giữ vững con tốt thừa, tránh mọi cạm bẫy quanh f2 và h2.
          en: Black plays ...Bc5 or ...Nc6, aiming at f2 and preparing ...Ngxe5 when the chance comes, along with early castling to get the king to safety. White plays Bf4, e3 and Be2, completing development soundly and holding the extra pawn, steering clear of every trick around f2 and h2.
          fr: Les Noirs jouent ...Bc5 ou ...Nc6, visant f2 et préparant ...Ngxe5 à l'occasion, avec un roque précoce pour mettre le roi à l'abri. Les Blancs jouent Bf4, e3 et Be2, achevant leur développement solidement et gardant le pion supplémentaire, en évitant tous les pièges autour de f2 et h2.
        basis:
          by: chan
          at: '2026-09-25'
