# King's Gambit Accepted, Stamma Gambit: 1.e4 e5 2.f4 exf4 3.h4. Every ply below was
# replayed with chess.js before being written (see docs/CONTEXT.md, invariant 1). Checked
# 3...Qxh4+, which is a straight blunder (4.Rxh4 wins the queen, verified), and 3...g5,
# which invites 4.hxg5 Qxg5 trading straight back to the original one-pawn edge with
# Black's queen slightly exposed. Simply developing keeps the pawn with nothing else proven
# yet, so the leaf here is honestly `unexplored`.
id: kings-gambit-accepted-stamma-gambit
name: Stamma Gambit
eco: C33
category: gambit
side: white
definingLine: [e4, e5, f4, exf4, h4]
soundness:
  value: dubious
  reviewedAt: '2026-09-18'
  basis:
    by: chan
    at: '2026-09-18'
    source: >-
      A judgement. 3.h4 stops Black from ever safely locking in the pawn with ...g5 (that
      trade favours White, verified: 4.hxg5 Qxg5 just returns to the original one-pawn
      deficit with Black's queen exposed), but it attacks nothing itself. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
