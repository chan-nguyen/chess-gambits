tree:
  annotation:
    vi: Trắng chơi 3.h4, một nước tốt lạ nhằm ngăn Đen chơi ...g5 để khóa chặt con tốt thừa một cách an toàn — nếu Đen thử điều đó, 4.hxg5 Qxg5 chỉ đơn giản đưa quân số về đúng như ban đầu với quân hậu Đen hơi lộ liễu. Nhưng bản thân 3.h4 không tấn công gì cả.
    en: White plays 3.h4, an unusual pawn move meant to stop Black from safely locking in the extra pawn with ...g5 — if Black tries that, 4.hxg5 Qxg5 simply returns to the original material count with Black's queen a little exposed. But 3.h4 itself attacks nothing.
    fr: Les Blancs jouent 3.h4, un coup de pion inhabituel destiné à empêcher les Noirs de verrouiller sans risque le pion supplémentaire par ...g5 — si les Noirs tentent cela, 4.hxg5 Qxg5 ramène simplement le matériel à son niveau initial, la dame noire étant un peu exposée. Mais 3.h4 lui-même n'attaque rien.
  dismissRest:
    reason:
      vi: Đen chơi một nước khác thay vì phát triển mã ra c6. Bất kỳ nước phát triển bình thường nào cũng giữ nguyên một tốt hơn cho Đen mà không rơi vào cái bẫy đổi tốt g5, nên 3...Nc6 chỉ là ví dụ đơn giản nhất.
      en: Black plays something other than developing the knight to c6. Any ordinary developing move keeps Black's extra pawn without walking into the g5 trade, so 3...Nc6 is simply the plainest example.
      fr: Les Noirs jouent autre chose que de développer le cavalier en c6. Tout coup de développement ordinaire conserve le pion supplémentaire des Noirs sans tomber dans le piège de l'échange en g5, donc 3...Nc6 n'en est que l'exemple le plus simple.
  children:
    - ply: Nc6
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen phát triển bình thường bằng Nc6, không vội giữ con tốt f4 bằng g5 vì điều đó chỉ mời gọi 4.hxg5 Qxg5. Không có quân Trắng nào tấn công tốt f4 lúc này, nên nó vẫn an toàn mà không cần phòng thủ thêm. Đây là điểm dừng cụ thể nhất có thể chứng minh — Đen hơn một tốt, nhưng nước h4 của Trắng, dù hạn chế một kế hoạch của Đen, vẫn chưa tạo ra điểm yếu cụ thể nào để khai thác ngay.
        en: Black develops normally with Nc6, in no hurry to hold the f4 pawn with g5 since that only invites 4.hxg5 Qxg5. No White piece attacks the f4 pawn right now, so it stays safe without needing extra defence. This is as concrete a stopping point as can honestly be shown — Black is a pawn up, but White's h4, while it does restrict one of Black's plans, has not yet created a concrete weakness to target.
        fr: Les Noirs se développent normalement par Nc6, sans se presser de conserver le pion f4 par g5, car cela ne ferait qu'inviter 4.hxg5 Qxg5. Aucune pièce blanche n'attaque le pion f4 pour l'instant, donc il reste en sécurité sans défense supplémentaire. C'est un point d'arrêt aussi concret qu'on puisse honnêtement le démontrer — les Noirs ont un pion d'avance, mais le h4 des Blancs, bien qu'il restreigne l'un des plans noirs, n'a pas encore créé de faiblesse concrète à cibler.
      outcome:
        type: unexplored
