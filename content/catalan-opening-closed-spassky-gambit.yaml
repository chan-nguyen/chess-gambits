    source: >-
      A judgement. 10...b5 offers a pawn that the c4 pawn and the knight on c3 attack twice
      and only the c6 pawn defends, and White's queen on c2 already attacks the h7 pawn. The
      pawn is a real investment, so the label is dubious. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-10-01'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
