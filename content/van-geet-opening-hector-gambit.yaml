# Van Geet Opening: Hector Gambit. Frozen defining line 1.Nc3 d5 2.e4 dxe4 3.Bc4, which
# ends on White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
# The line below was replayed with chess.js before being annotated.
id: van-geet-opening-hector-gambit
name: 'Van Geet Opening: Hector Gambit'
eco: A00
category: gambit
side: white
definingLine: [Nc3, d5, e4, dxe4, Bc4]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. White answers 2...dxe4 with 3.Bc4, aiming the bishop at f7 rather than
      trying to win the pawn back at once. Black simply develops with 3...Nf6, and that
      same knight now defends the e4 pawn, so White is not close to getting it back —
      a pawn down with a diagonal that is not hitting anything real yet. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Thay vì đòi lại con tốt e4 ngay, Trắng đưa tượng ra c4, nhắm vào đường chéo a2-g8 hướng thẳng tới ô f7. Đây là ý tưởng của Hector Gambit trong Van Geet Opening — chấp nhận chịu thiệt tốt để đổi lấy áp lực tiềm năng lên cánh vua Đen.
    en: Rather than trying to win the e4 pawn back immediately, White develops the bishop to c4, aiming down the a2-g8 diagonal straight at f7. This is the idea behind the Hector Gambit in the Van Geet Opening — accepting the pawn deficit for potential pressure on Black's kingside.
    fr: Plutôt que de chercher à regagner immédiatement le pion e4, les Blancs développent le fou en c4, visant la diagonale a2-g8 droit vers f7. C'est l'idée du Gambit Hector dans le Van Geet — accepter le déficit de pion pour une pression potentielle sur l'aile roi noire.
  dismissRest:
    reason:
      vi: Đen không phát triển mã ra f6. Các nước khác — giữ tốt e4 bằng cách khác, phát triển quân theo hướng khác, hay đẩy tốt cánh hậu — đều không đặt đúng con mã vào vị trí vừa phát triển vừa bảo vệ tốt e4 như đang xét ở đây.
      en: Black does not develop the knight to f6. Anything else — protecting the e4 pawn some other way, developing in a different direction, or pushing a queenside pawn — does not put the knight on the exact square that both develops and defends the e4 pawn, as examined here.
      fr: Les Noirs ne développent pas le cavalier en f6. Tout le reste — protéger le pion e4 autrement, se développer dans une autre direction, ou pousser un pion à l'aile dame — ne place pas le cavalier sur la case précise qui développe et défend à la fois le pion e4, comme étudié ici.
  children:
    - ply: Nf6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen phát triển mã ra f6, vừa đưa quân ra vừa bảo vệ chắc chắn con tốt e4 đã ăn được, không hề vội trả lại nó.
        en: Black develops the knight to f6, both developing a piece and firmly defending the e4 pawn already won, in no hurry to give it back.
        fr: Les Noirs développent le cavalier en f6, développant une pièce tout en défendant fermement le pion e4 déjà gagné, sans se presser de le rendre.
      outcome:
        type: position
        evaluation:
          vi: Đếm điểm thì Đen 39, Trắng 38 — Đen hơn đúng một tốt, và giờ tốt e4 đã có mã f6 bảo vệ nên không còn là mục tiêu ăn miễn phí nữa. Bù lại, tượng c4 của Trắng đã nằm sẵn trên đường chéo a2-g8 nhắm vào ô f7, dù hiện tại chưa có quân nào khác của Trắng phối hợp để biến nó thành mối đe doạ cụ thể.
          en: Count the points and it is 39 for Black, 38 for White — Black is a clean pawn up, and the e4 pawn is now defended by the f6-knight, so it is no longer a free target. In return, White's bishop on c4 already sits on the a2-g8 diagonal aiming at f7, though nothing else of White's is yet coordinated to turn that into a concrete threat.
          fr: En comptant les points, 39 pour les Noirs, 38 pour les Blancs — les Noirs ont un pion net de plus, et le pion e4 est désormais défendu par le cavalier f6, il n'est donc plus une cible gratuite. En contrepartie, le fou blanc en c4 se trouve déjà sur la diagonale a2-g8 visant f7, bien que rien d'autre chez les Blancs ne soit encore coordonné pour transformer cela en menace concrète.
        plan:
          vi: Trắng chơi Nge2 hoặc Qe2, d3 và O-O, cố hoàn tất phát triển và tìm cách phối hợp thêm quân vào đường chéo a2-g8 trước khi Đen kịp che chắn f7 bằng O-O. Đen chơi e6 hoặc g6, Be7/Bg7 và O-O, che chắn vua nhanh chóng và giữ vững con tốt thừa.
          en: White plays Nge2 or Qe2, d3 and O-O, trying to finish development and bring another piece to bear on the a2-g8 diagonal before Black can shield f7 with O-O. Black plays e6 or g6, Be7/Bg7 and O-O, tucking the king away quickly and holding on to the extra pawn.
          fr: Les Blancs jouent Nge2 ou Qe2, d3 et O-O, essayant d'achever leur développement et d'amener une autre pièce sur la diagonale a2-g8 avant que les Noirs ne mettent f7 à l'abri par O-O. Les Noirs jouent e6 ou g6, Be7/Bg7 et O-O, mettant le roi à l'abri rapidement et gardant le pion supplémentaire.
        basis:
          by: chan
          at: '2026-09-25'
