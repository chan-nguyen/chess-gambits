              vi: Trắng kém hai tốt và đó là một con số lớn. Đổi lại Trắng có toàn bộ quân nhẹ trừ mã g1 đã ra, vua đã nhập thành dài, xe d1 đứng trên cột mở nhắm vào vua Đen còn ở e8, cột f cũng mở, và Đen mới chỉ có một con mã f6 cùng một con hậu sắp phải chạy. Khách quan mà nói Đen đứng hơn nếu phòng thủ đúng, và đó chính là lý do nhãn của gambit này là đáng ngờ.
              en: White is two pawns down, which is a lot. In return every white minor piece but the g1 knight is developed, the king has castled queenside, the rook on d1 sits on an open file pointing at a black king still on e8, the f-file is open too, and Black has one knight out and a queen that is about to run. Objectively Black is better with accurate defence, and that is exactly why this gambit is labelled dubious.
              fr: Les Blancs ont deux pions de moins, ce qui est beaucoup. En échange, toutes leurs pièces mineures sauf le cavalier g1 sont développées, le roi a roqué du grand côté, la tour d1 occupe une colonne ouverte braquée sur un roi noir encore en e8, la colonne f est ouverte elle aussi, et les Noirs n'ont qu'un cavalier sorti et une dame sur le point de fuir. Objectivement les Noirs sont mieux avec une défense précise, et c'est précisément pourquoi ce gambit est étiqueté douteux.
            plan:
              vi: Trắng đuổi hậu bằng a3, rồi Bd4 đánh mã f6 với xe d1 đỡ sau lưng, Nge2 hoặc Nh3 đưa nốt con mã cuối ra, và tìm cách mở thêm đường bằng Rhe1 hay Bc4 sau khi con hậu Đen đã rời hàng bốn. Với Đen thì việc duy nhất quan trọng là đưa vua ra khỏi cột d và e, nghĩa là e6, Be7 và O-O càng nhanh càng tốt, trả lại một tốt nếu cần. Nếu Đen nhập thành xong mà vẫn hơn tốt thì Đen thắng.
              en: White chases the queen with a3, then Bd4 against the f6 knight with the rook behind it, Nge2 or Nh3 to bring the last piece out, and looks to open more lines with Rhe1 or Bc4 once the black queen has left the fourth rank. For Black the only thing that matters is getting the king off the d- and e-files — ...e6, ...Be7 and ...O-O as fast as possible, giving a pawn back if that is what it takes. If Black castles and is still a pawn up, Black wins.
              fr: Les Blancs chassent la dame par a3, puis Bd4 contre le cavalier f6 avec la tour derrière, Nge2 ou Nh3 pour sortir la dernière pièce, et cherchent à ouvrir d'autres lignes par Rhe1 ou Bc4 une fois la dame noire partie de la quatrième rangée. Pour les Noirs, la seule chose qui compte est de sortir le roi des colonnes d et e — ...e6, ...Be7 et ...O-O au plus vite, quitte à rendre un pion. Si les Noirs roquent en gardant un pion de plus, ils gagnent.
