# The Halosar Trap, in the Ryder Gambit of the Blackmar-Diemer. The defining line is the one
# the catalogue has frozen for this id — 1.d4 d5 2.e4 dxe4 3.Nc3 Nf6 4.f3 exf3 5.Qxf3 Qxd4
# 6.Be3 Qb4 7.O-O-O — and it ends on White's own ply, so the root is an opponent node and
# 8...Bxf3 can carry `blunder` (invariant 5).
#
# ECO is D00 and category is `trap`, which is what `tools/catalogue/source/traps.yaml`
# records: a trap carries the ECO of the opening it sits inside (ADR-0008), and the Halosar
# is not in the dataset under this name.
#
# The mate after 8...Bxf3 is claimed with `type: trap` and nothing else. The move count, the
# line and the certificate are produced by `npm run prove:mates` and replayed by
# `npm run verify:mates` (ADR-0005). Every other line here was replayed with chess.js.
id: halosar-trap
name: Halosar Trap
eco: D00
category: trap
side: white
definingLine: [d4, d5, e4, dxe4, Nc3, Nf6, f3, exf3, Qxf3, Qxd4, Be3, Qb4, 'O-O-O']
soundness:
  value: dubious
  reviewedAt: '2026-09-17'
  basis:
    by: chan
    at: '2026-09-17'
    source: >-
      A judgement, not a measurement, and the same label `traps.yaml` carries. It is about
      the Ryder Gambit that produces the position, not about the trap springing. White is
      two pawns down at the root and the compensation is entirely in development and in the
      open d- and f-files, which is real but not enough against a defender who knows the
      position. The trap itself is not a matter of opinion — it is proved. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-17'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date. The mate is not — it is machine-proved and replayed by CI.
tree:
  annotation:
    vi: Trắng đã cho đi hai con tốt và vừa nhập thành dài. Hậu Đen ở b4 là quân duy nhất của Đen đã ra khỏi hàng cuối, và nó đang đứng ở chỗ bị hỏi. Cả cái bẫy nằm ở ô c7, vì mã Trắng đi c3 tới b5 rồi tới c7 là chiếu bí nếu vua Đen không có ô nào để chạy.
    en: White has given away two pawns and just castled queenside. Black's queen on b4 is the only piece off the back rank, and it is standing somewhere it will be asked about. The whole trap lives on c7 — the knight travels c3 to b5 to c7, and that is mate if the black king has nowhere to run.
    fr: Les Blancs ont donné deux pions et viennent de roquer du grand côté. La dame noire en b4 est la seule pièce sortie de la rangée initiale, et elle se tient là où on l'interrogera. Tout le piège vit sur c7 — le cavalier voyage de c3 en b5 puis en c7, et c'est mat si le roi noir n'a aucune case de fuite.
  dismissRest:
    reason:
      vi: Đen chơi một nước khác. Kế hoạch của Trắng không đổi, đó là a3 để hỏi con hậu b4, Bd4 đánh vào mã f6 với xe d1 đỡ phía sau, và Nb5 ngay khi ô c7 không được canh. Các nước ăn tốt tiếp như 7...Qxb2+ và 7...Qxc3 chỉ mất hậu sau Kxb2 và bxc3. Những nước phát triển bình thường như 7...e6, 7...Bf5 hay 7...Nc6 đều chơi được và giữ Đen hơn hai tốt, nhưng chúng cũng không làm gì với cột d và cột f đang mở thẳng vào vua Đen. Chỉ có 7...Bg4 là bước vào cái bẫy, và nó lại chính là nước tự nhiên nhất.
      en: Black plays something else. White's plan does not change — a3 to ask the queen on b4 where it is going, Bd4 against the f6 knight with the rook on d1 behind it, and Nb5 the moment c7 is unguarded. Grabbing more with 7...Qxb2+ or 7...Qxc3 simply loses the queen to Kxb2 and bxc3. Ordinary developing moves such as 7...e6, 7...Bf5 and 7...Nc6 are all playable and keep Black two pawns up, but none of them does anything about the d- and f-files pointing at the black king. Only 7...Bg4 walks into the trap — and it is the most natural move on the board.
      fr: Les Noirs jouent autre chose. Le plan des Blancs ne change pas — a3 pour demander à la dame de b4 où elle va, Bd4 contre le cavalier f6 avec la tour d1 derrière, et Nb5 dès que c7 n'est plus gardée. Prendre davantage par 7...Qxb2+ ou 7...Qxc3 perd simplement la dame après Kxb2 et bxc3. Des coups de développement ordinaires comme 7...e6, 7...Bf5 ou 7...Nc6 sont jouables et gardent deux pions d'avance, mais aucun ne s'occupe des colonnes d et f braquées sur le roi noir. Seul 7...Bg4 tombe dans le piège, et c'est le coup le plus naturel de la position.
