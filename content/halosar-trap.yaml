            en: White does not save the queen. The knight jumps to b5 and threatens Nxc7 mate, because the black king on e8 has no square — d8 and d7 are covered by the rook on d1, and e7 and f7 are blocked by Black's own pawns. The queen on f3 is still attacked, and the offer is real in the sense that taking it is legal, but taking it loses on the spot.
            fr: Les Blancs ne sauvent pas la dame. Le cavalier saute en b5 et menace Nxc7 mat, car le roi noir en e8 n'a aucune case — d8 et d7 sont couvertes par la tour d1, et e7 et f7 sont bloquées par ses propres pions. La dame f3 est toujours attaquée, et l'offre est réelle au sens où la prise est légale, mais la prendre perd immédiatement.
          dismissRest:
