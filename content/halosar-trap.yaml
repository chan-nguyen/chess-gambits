              en: Black plays something else, and most of it is not enough. {Mated} of the {legal} legal replies here leave c7 alone and are mated at once by Nxc7#. {Stops} replies do stop the mate. Of those, only 8...Qxb5 defends the b7 pawn, and it loses the queen at once to Bxb5+; the other sixteen leave b7 bare, so Qxb7 arrives hitting the rook on a8 as well. The two other captures, 8...Qd2+ and 8...Qxb2+, lose the queen to Rxd2 and Kxb2. Nothing here lets Black take the queen on f3 safely, because Bxf3 is mate for White.
              fr: Les Noirs jouent autre chose, et la plupart du temps cela ne suffit pas. {Mated} des {legal} réponses légales ici délaissent c7 et sont matées aussitôt par Nxc7#. {Stops} réponses parent le mat. Parmi elles, seule 8...Qxb5 défend le pion b7, et elle perd aussitôt la dame après Bxb5+ ; les seize autres laissent b7 à nu, si bien que Qxb7 arrive en frappant aussi la tour a8. Les deux autres prises, 8...Qd2+ et 8...Qxb2+, perdent la dame après Rxd2 et Kxb2. Rien ici ne permet aux Noirs de prendre la dame f3 en sécurité, car Bxf3 est mat pour les Blancs.
