tree:
  annotation:
    vi: Trắng vừa chơi 8.g4, với ý đồ g5 đánh vào mã f6. Nhưng tốt d4 đã mất quân bảo vệ và hậu Đen đang tấn công nó, nên Đen ăn được mà không quân Trắng nào ăn lại.
    en: White has just played 8.g4, with the idea of g5 against the knight on f6. But the pawn on d4 has lost its defender and Black's queen attacks it, so Black can take it with no White piece able to recapture.
    fr: "Les Blancs viennent de jouer 8.g4, avec l'idée de g5 contre le cavalier f6. Mais le pion d4 a perdu son défenseur et la dame noire l'attaque : les Noirs peuvent le prendre sans qu'aucune pièce blanche puisse reprendre."
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 8...Qxd4. Bài này chỉ đi theo nhánh ăn tốt 8...Qxd4; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 8...Qxd4 here. This entry follows the capture 8...Qxd4 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 8...Qxd4. Cette fiche ne suit que la prise 8...Qxd4 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Qxd4
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen ăn tốt bằng 8...Qxd4. Hậu giờ đứng giữa bàn cờ, tấn công mã c3 (được hậu f3 và tốt b2 bảo vệ) và tốt g4 (được hậu f3 và tốt h3 bảo vệ).
        en: Black takes the pawn with 8...Qxd4. The queen now stands in the centre, attacking the knight on c3 (defended by the queen on f3 and the b2 pawn) and the pawn on g4 (defended by the queen on f3 and the h3 pawn).
        fr: Les Noirs prennent le pion par 8...Qxd4. La dame se trouve maintenant au centre, attaquant le cavalier c3 (défendu par la dame f3 et le pion b2) et le pion g4 (défendu par la dame f3 et le pion h3).
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng năm, Đen bảy, nên Trắng kém hai tốt và không còn tốt nào ở các cột d, e, f. Vua Đen vẫn ở e8 với cả hai quyền nhập thành, còn Trắng có hai tượng chưa ra quân cùng mã c3 và hậu f3 đã hoạt động.'
          en: "Count the pawns: White five, Black seven, so White is two pawns down and has no pawn left on the d-, e- or f-file. Black's king is still on e8 with both castling rights, while White has two bishops still at home alongside the active knight on c3 and queen on f3."
          fr: "Comptez les pions : cinq pour les Blancs, sept pour les Noirs ; les Blancs sont donc deux pions en moins et n'ont plus aucun pion sur les colonnes d, e et f. Le roi noir est encore en e8 avec les deux droits de roque, tandis que les Blancs ont deux fous encore sur leur case initiale, à côté du cavalier c3 et de la dame f3 actifs."
        plan:
          vi: Trắng phát triển có nhịp bằng Be3 tấn công hậu, cố bù hai tốt bằng thế chủ động. Đen đưa hậu về chỗ an toàn khi bị đánh và hoàn tất phát triển bằng ...e6 và ...Nbd7.
          en: White develops with tempo by Be3, hitting the queen, and tries to make up for the two pawns with activity. Black moves the queen to safety when it is hit and finishes development with ...e6 and ...Nbd7.
          fr: Les Blancs se développent avec tempo par Be3, attaquant la dame, et cherchent à compenser les deux pions par l'activité. Les Noirs mettent la dame à l'abri quand elle est attaquée et achèvent leur développement par ...e6 et ...Nbd7.
        basis:
          by: chan
          at: '2026-09-30'
