# Benko Gambit Accepted: Modern Variation. Frozen defining line 1.d4 Nf6 2.c4 c5 3.d5
# b5 4.cxb5 a6, which ends on Black's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 9.e3 9...axb5
# 10.Bxb5. White's own move leaves the b5 pawn en prise, so Black's forced axb5
# recaptures it, and White recaptures in turn with Bxb5. searchMate at 3 moves from
# the resulting position returns no-mate, so no forced mate is claimed anywhere in
# this entry, and no capture is left going free at the leaf.
id: benko-gambit-accepted-modern-variation
name: 'Benko Gambit Accepted: Modern Variation'
eco: A57
category: gambit
side: black
definingLine: [d4, Nf6, c4, c5, d5, b5, cxb5, a6]
soundness:
  value: sound
  reviewedAt: '2026-09-29'
  basis:
    by: chan
    at: '2026-09-29'
    source: >-
      Long-established opening theory, one of the main gambits Black has against 1.d4: the
      queenside pawn majority and open files provide durable practical compensation for the
      pawn. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-29'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: 'Đen vừa chơi 8...a6, thách thức đặc trưng của Benko Gambit Accepted: tấn công tốt b5 của Trắng để đổi lấy sự đền bù lâu dài — cột a và b mở, tượng hoạt động mạnh, sức ép cánh hậu — vốn là ý tưởng cốt lõi của cả ván gambit này. Trắng phải quyết định cách đáp trả.'
    en: "Black has just played 8...a6, the defining challenge of the Benko Gambit Accepted: attacking White's pawn on b5 in exchange for the long-term compensation — open a- and b-files, an active bishop, queenside pressure — that is the whole point of the gambit. White must decide how to answer."
    fr: "Les Noirs viennent de jouer 8...a6, le défi caractéristique du Gambit Benko Accepté : attaquer le pion blanc en b5 en échange de la compensation à long terme — colonnes a et b ouvertes, fou actif, pression à l'aile dame — qui fait tout l'intérêt du gambit. Les Blancs doivent décider comment répondre."
  dismissRest:
    reason:
      vi: 'Trắng chọn cách khác thay vì 9.e3 ở đây. Đánh giá tương tự: Đen luôn có đền bù nhất định cho tốt đã mất — cột mở, tượng hoạt động, sức ép cánh hậu — bất kể Trắng chọn cách nào để đối phó với đòn ...a6.'
      en: 'White plays something other than 9.e3 here. The assessment is similar throughout: Black always gets some compensation for the pawn — open files, an active bishop, queenside pressure — whichever way White chooses to meet the ...a6 attack.'
      fr: "Les Blancs jouent autre chose que 9.e3 ici. L'évaluation reste similaire dans tous les cas : les Noirs obtiennent toujours une certaine compensation pour le pion — colonnes ouvertes, fou actif, pression à l'aile dame — quelle que soit la façon dont les Blancs répondent à l'attaque ...a6."
  children:
    - ply: e3
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Trắng chơi 9.e3, một nước khiêm tốn củng cố trung tâm và mở đường cho tượng f1 thay vì ăn lại ngay, chấp nhận Đen sẽ lấy lại tốt trên b5.
        en: White plays 9.e3, a modest move firming up the centre and opening a diagonal for the f1-bishop instead of recapturing at once, accepting that Black will win the b5 pawn back.
        fr: Les Blancs jouent 9.e3, un coup modeste consolidant le centre et ouvrant une diagonale pour le fou f1 au lieu de reprendre tout de suite, acceptant que les Noirs regagnent le pion b5.
      children:
        - ply: axb5
          annotation:
            vi: Đen ăn lại tốt b5, biết rằng Trắng sẽ ăn lại ngay bằng tượng f1 vừa được mở đường bởi nước e3.
            en: Black recaptures the b5 pawn, knowing White will recapture in turn with the f1-bishop whose diagonal e3 just opened.
            fr: "Les Noirs reprennent le pion b5, sachant que les Blancs reprendront à leur tour avec le fou f1 dont la diagonale vient d'être ouverte par e3."
          dismissRest:
            reason:
              vi: 'Trắng chọn cách khác thay vì ăn lại ngay bằng 10.Bxb5 ở đây, ví dụ tạm thời bỏ qua và phát triển bằng Nf3. Đánh giá tương tự: nếu Trắng không ăn lại ngay, Đen giữ tạm thời một tốt dư (bảy so với sáu) cho đến khi tượng f1 tìm được dịp ăn lại.'
              en: 'White plays something other than recapturing with 10.Bxb5 here, for instance developing with Nf3 and leaving the pawn for now. The assessment is similar: if White does not recapture immediately, Black temporarily holds an extra pawn (seven against six) until the f1-bishop finds the chance to take it.'
              fr: "Les Blancs jouent autre chose que reprendre par 10.Bxb5 ici, par exemple se développer par Nf3 et laisser le pion pour l'instant. L'évaluation reste similaire : si les Blancs ne reprennent pas immédiatement, les Noirs gardent temporairement un pion de plus (sept contre six) jusqu'à ce que le fou f1 trouve l'occasion de le reprendre."
          children:
            - ply: Bxb5
              annotation:
                vi: Tượng f1 ăn lại trên b5, hoàn tất một đợt đổi tốt sòng phẳng và đứng ở vị trí khá tích cực.
                en: The f1-bishop recaptures on b5, completing a clean pawn trade and landing on a fairly active square.
                fr: Le fou f1 reprend en b5, achevant un échange de pions net et se plaçant sur une case assez active.
              outcome:
                type: position
                evaluation:
                  vi: 'Đếm tốt: Trắng bảy, Đen sáu — Trắng giữ đúng một tốt dư sau đợt đổi tốt vừa rồi, cũng là trạng thái vật chất tiêu biểu của Benko Gambit Accepted. Tượng Trắng trên b5 khá tích cực nhưng chưa gây áp lực cụ thể, trong khi Đen vẫn còn nguyên tượng c8 và cột a mở để khai thác về sau.'
                  en: "Count the pawns: White seven, Black six — White holds exactly one extra pawn after that exchange, again the typical Benko material state. White's bishop on b5 is reasonably placed but creates no concrete threat yet, while Black still has the untouched c8-bishop and the open a-file to work with later."
                  fr: "Comptez les pions : sept pour les Blancs, six pour les Noirs — les Blancs ont exactement un pion de plus après cet échange, à nouveau l'état matériel type du Benko. Le fou blanc en b5 est raisonnablement placé mais ne crée aucune menace concrète pour l'instant, tandis que les Noirs gardent leur fou c8 intact et la colonne a ouverte à exploiter plus tard."
                plan:
                  vi: Trắng tiếp tục Nf3 và O-O, cố giữ tốt dư trong khi hoàn tất phát triển. Đen chơi ...g6 và ...Bg7, hoặc ...Qa5+ tranh thủ thời gian, rồi đưa xe ra cột a gây sức ép cánh hậu.
                  en: White continues with Nf3 and O-O, trying to hold the extra pawn while finishing development. Black plays ...g6 and ...Bg7, or ...Qa5+ to gain a tempo, then brings a rook to the a-file for queenside pressure.
                  fr: "Les Blancs poursuivent par Nf3 et O-O, essayant de garder le pion supplémentaire tout en achevant leur développement. Les Noirs jouent ...g6 et ...Bg7, ou ...Qa5+ pour gagner un tempo, puis amènent une tour sur la colonne a pour la pression à l'aile dame."
                basis:
                  by: chan
                  at: '2026-09-29'
