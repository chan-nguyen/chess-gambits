tree:
  annotation:
    vi: 'Trắng vừa nhập thành bằng 6.O-O, hiến một mã: mã f3 bị tốt g4 tấn công và được bảo vệ ba lần, bởi tốt g2, hậu và xe. Trắng kém một tốt, bảy đối tám, và tượng c4 tấn công f7, chỉ có vua bảo vệ.'
    en: 'White has just castled with 6.O-O, offering a knight: the knight on f3 is attacked by the g4 pawn and defended three times, by the g2 pawn, the queen and the rook. White is a pawn down, seven to eight, and the bishop on c4 attacks f7, which only the king defends.'
    fr: 'Les Blancs viennent de roquer par 6.O-O, offrant un cavalier : le cavalier f3 est attaqué par le pion g4 et défendu trois fois, par le pion g2, la dame et la tour. Les Blancs sont un pion en moins, sept contre huit, et le fou c4 attaque f7, que seul le roi défend.'
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 6...Nf6. Bài này chỉ đi theo nhánh 6...Nf6; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 6...Nf6 here. This entry follows the reply 6...Nf6 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 6...Nf6. Cette fiche ne suit que la réponse 6...Nf6 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Nf6
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Đen chưa ăn mã mà phát triển bằng 6...Nf6, tấn công tốt e4 (được mã c3 bảo vệ) trong khi tốt g4 vẫn tấn công mã f3.
        en: Black does not take the knight yet but develops with 6...Nf6, attacking the e4 pawn (which the knight on c3 defends) while the g4 pawn still attacks the knight on f3.
        fr: Les Noirs ne prennent pas encore le cavalier mais se développent par 6...Nf6, attaquant le pion e4 (que le cavalier c3 défend) tandis que le pion g4 attaque toujours le cavalier f3.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt. Mã f3 bị tốt g4 tấn công và được bảo vệ ba lần, nên Trắng phải quyết định xử lý nó thế nào. Tốt e4 bị mã f6 tấn công một lần và được mã c3 bảo vệ một lần; tượng c4 tấn công f7, chỉ có vua bảo vệ.'
          en: 'Count the pawns: White seven, Black eight, so White is a pawn down. The knight on f3 is attacked by the g4 pawn and defended three times, so White has to decide what to do with it. The pawn on e4 is attacked once, by the knight on f6, and defended once, by the knight on c3; the bishop on c4 attacks f7, which only the king defends.'
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins. Le cavalier f3 est attaqué par le pion g4 et défendu trois fois : les Blancs doivent décider ce qu'ils en font. Le pion e4 est attaqué une fois, par le cavalier f6, et défendu une fois, par le cavalier c3 ; le fou c4 attaque f7, que seul le roi défend."
        plan:
          vi: Trắng đưa mã bị tấn công lên g5, nơi nó cùng tượng c4 tấn công f7 hai lần và không quân Đen nào tấn công nó. Đen đánh vào trung tâm bằng ...d5 hoặc củng cố bằng ...d6.
          en: White moves the attacked knight to g5, where it joins the bishop on c4 in attacking f7 twice and no Black piece attacks it. Black strikes in the centre with ...d5 or firms up with ...d6.
          fr: Les Blancs portent le cavalier attaqué en g5, où il rejoint le fou c4 pour attaquer f7 deux fois et où aucune pièce noire ne l'attaque. Les Noirs frappent au centre par ...d5 ou se consolident par ...d6.
        basis:
          by: chan
          at: '2026-09-30'
