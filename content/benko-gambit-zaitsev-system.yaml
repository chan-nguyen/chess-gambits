# Benko Gambit Accepted: Zaitsev System. Frozen defining line 1.d4 Nf6 2.c4 c5 3.d5 b5
# 4.cxb5 a6, which ends on Black's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 9.Nc3. searchMate at
# 3 moves from the resulting position returns no-mate, so no forced mate is claimed
# anywhere in this entry, and no capture is left going free at the leaf.
id: benko-gambit-zaitsev-system
name: 'Benko Gambit: Zaitsev System'
