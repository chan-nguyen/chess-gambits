name: 'Vienna Gambit, with Max Lange Defense: Hamppe-Allgaier Gambit, Alapin Variation'
eco: C25
category: gambit
side: white
definingLine: [e4, e5, Nc3, Nc6, f4, exf4, Nf3, g5, h4, g4, Ng5]
soundness:
  value: sound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement, matching the family-level label the King's Gambit complex already carries
      in this catalogue for its sharpest attacking tries. The knight sacrifice on f7 that
      follows in the main line has never been shown to fall short of full compensation, and
      objectively it holds its own even where Black declines to win the piece. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa nhảy mã lên g5, con mã trông như bị treo vì tốt g4 vừa đuổi nó đi, nhưng thực ra nó đang chuẩn bị hy sinh ở f7. Mục này đi sâu riêng vào việc Đen không ăn mã ngay mà chơi 6...d6.
    en: White has just jumped the knight to g5, which looks like it is hanging since the g4 pawn just chased it there, but it is actually preparing a sacrifice on f7. This entry follows specifically Black not taking the knight and instead playing 6...d6.
    fr: Les Blancs viennent de sauter le cavalier en g5, qui semble en prise puisque le pion g4 vient de le chasser là, mais qui prépare en réalité un sacrifice en f7. Cette entrée suit spécifiquement les Noirs qui ne prennent pas le cavalier et jouent plutôt 6...d6.
  dismissRest:
    reason:
      vi: Đen không chơi 6...d6 — ăn tốt bằng 6...hxg5 hay phát triển bằng 6...Nf6. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black does not play 6...d6 — capturing with 6...hxg5, or developing with 6...Nf6. Each is outside the scope of this entry.
      fr: Les Noirs ne jouent pas 6...d6 — capturant par 6...hxg5, ou développant par 6...Cf6. Chacun sort du cadre de cette entrée.
  children:
    - ply: d6
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Biến Alapin. Đen mở đường cho tượng c8 và không vội quyết định số phận con mã g5, để dành việc ăn nó hay không cho sau.
        en: The Alapin Variation. Black opens a diagonal for the c8 bishop and is in no hurry to decide the fate of the g5 knight, leaving whether to take it for later.
        fr: La Variante Alapin. Les Noirs ouvrent une diagonale pour le fou c8 et ne sont pas pressés de trancher le sort du cavalier g5, laissant pour plus tard la décision de le prendre ou non.
      outcome:
        type: position
        evaluation:
          vi: Quân số hoàn toàn ngang nhau, mỗi bên còn đủ hai mã và hai tượng. Con mã g5 của Trắng đứng khá lộ liễu, nhưng nó đang nhắm vào f7 và h7, hai ô ngay cạnh vua Đen vẫn còn ở nhà, chưa hề nhập thành.
          en: Material is completely level, each side still has both knights and both bishops. White's knight on g5 stands rather exposed, but it aims at f7 and h7, two squares right next to Black's king, which has not castled and is still sitting at home.
          fr: Le matériel est parfaitement égal, chaque camp a encore ses deux cavaliers et ses deux fous. Le cavalier blanc en g5 est plutôt exposé, mais il vise f7 et h7, deux cases juste à côté du roi noir, qui n'a pas roqué et se tient encore chez lui.
        plan:
          vi: Trắng chơi Nxf7 hy sinh mã để lôi vua Đen ra ngoài, hoặc Bc4 trước để chuẩn bị đòn ấy kỹ hơn, tận dụng cột f và cột h mở. Đen chơi Nf6 hay Bg7, cố phát triển nhanh và tìm cách giữ vững con tốt f4 lẫn g4 đã có.
          en: White plays Nxf7 to sacrifice the knight and drag Black's king out, or Bc4 first to prepare that blow more thoroughly, using the open f- and h-files. Black plays Nf6 or Bg7, trying to develop quickly and hold on to both the f4 and g4 pawns already won.
          fr: Les Blancs jouent Nxf7 pour sacrifier le cavalier et attirer le roi noir au dehors, ou Bc4 d'abord pour préparer ce coup plus soigneusement, exploitant les colonnes f et h ouvertes. Les Noirs jouent Nf6 ou Bg7, essayant de se développer rapidement et de tenir à la fois les pions f4 et g4 déjà gagnés.
        basis:
          by: chan
          at: '2026-09-25'
