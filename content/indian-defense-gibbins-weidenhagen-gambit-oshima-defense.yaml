# Indian Defense, Gibbins-Weidenhagen Gambit, Oshima Defense. One entry in a batch authored
# for issue #148 (batch h), sharing the trunk `1.d4 Nf6 2.g4` with its sibling
# `indian-defense-gibbins-weidenhagen-gambit-accepted` (2...Nxg4 instead of this entry's
# 2...e5). Defining line ends on White's 2.g4 (invariant 5). Every ply below was replayed
# with chess.js before being written.
id: indian-defense-gibbins-weidenhagen-gambit-oshima-defense
name: 'Indian Defense: Gibbins-Weidenhagen Gambit, Oshima Defense'
eco: A45
category: gambit
side: white
definingLine: [d4, Nf6, g4]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      The same judgement the sibling `indian-defense-gibbins-weidenhagen-gambit-accepted`
      carries. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa đẩy tốt lên g4, tấn công thẳng vào mã f6. Mục này đi sâu riêng vào việc Đen phớt lờ đòn tấn công ấy và phản công ngay ở trung tâm bằng 2...e5.
    en: White has just pushed the pawn to g4, attacking the f6 knight directly. This entry follows specifically Black ignoring that attack and counterattacking in the centre at once with 2...e5.
    fr: Les Blancs viennent de pousser le pion en g4, attaquant directement le cavalier f6. Cette entrée suit spécifiquement les Noirs qui ignorent cette attaque et contre-attaquent aussitôt au centre par 2...e5.
  dismissRest:
    reason:
      vi: Đen không chơi 2...e5 — ăn tốt bằng 2...Nxg4 (xem mục Gambit Đã Nhận), hay lui mã về d5. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black does not play 2...e5 — taking with 2...Nxg4 (see the Gambit Accepted entry), or dropping the knight back to d5. Each is outside the scope of this entry.
      fr: Les Noirs ne jouent pas 2...e5 — prenant par 2...Cxg4 (voir l'entrée du Gambit Accepté), ou reculant le cavalier en d5. Chacun sort du cadre de cette entrée.
  children:
    - ply: e5
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Phòng thủ Oshima. Đen bỏ mặc con mã f6 đang bị đánh và phản công ngay vào tốt d4, cược rằng nhịp trung tâm đáng giá hơn việc lo cho con mã.
        en: The Oshima Defense. Black leaves the attacked f6 knight to fend for itself and counterattacks the d4 pawn at once, betting that the central tempo is worth more than worrying about the knight.
        fr: La Défense Oshima. Les Noirs laissent le cavalier f6 attaqué se débrouiller seul et contre-attaquent aussitôt le pion d4, pariant que le temps central vaut plus que le souci du cavalier.
      children:
        - ply: dxe5
          annotation:
            vi: Trắng ăn tốt e5, quân duy nhất còn có thể ăn tại đó, đồng thời vẫn còn đe dọa ăn nốt mã f6 bằng tốt g4.
            en: White takes the e5 pawn, the only piece that can capture there, while the g4 pawn still threatens to take the f6 knight as well.
            fr: Les Blancs prennent le pion e5, la seule pièce pouvant capturer là, tandis que le pion g4 menace toujours de prendre aussi le cavalier f6.
          dismissRest:
            reason:
              vi: Đen không ăn lại tốt g4 ngay — lui mã về d5 hay e4, hay phát triển bằng 4...Bc5. Mỗi lựa chọn để nguyên con tốt g4 của Trắng trên bàn cờ, chưa bị đòi lại.
              en: Black does not recapture the g4 pawn at once — dropping the knight back to d5 or e4, or developing with 4...Bc5. Each leaves White's g4 pawn sitting on the board, not yet won back.
              fr: Les Noirs ne reprennent pas aussitôt le pion g4 — repliant le cavalier en d5 ou e4, ou développant par 4...Fc5. Chacun laisse le pion g4 blanc sur l'échiquier, pas encore regagné.
          children:
            - ply: Nxg4
              annotation:
                vi: Đen ăn lại con tốt g4 ban đầu bằng chính con mã đang bị đe dọa, giành lại quân số ngang nhau ngay khi có dịp.
                en: Black takes back the original g4 pawn with the very knight that was under threat, restoring material equality at the first opportunity.
                fr: Les Noirs reprennent le pion g4 initial avec le cavalier même qui était menacé, rétablissant l'égalité matérielle à la première occasion.
              outcome:
                type: position
                evaluation:
                  vi: Đếm tốt thì mỗi bên còn bảy, quân số hoàn toàn ngang nhau — con tốt e5 Trắng ăn được đã đổi đúng lấy con tốt g4 Đen ăn lại. Mã Đen đứng lại ở g4, khá lộ liễu, nhưng Trắng cũng chưa có gì cụ thể để khai thác điều đó ngay.
                  en: Count the pawns and each side has seven, material is completely level — the e5 pawn White won is traded exactly for the g4 pawn Black won back. Black's knight sits on g4 again, rather exposed, but White has nothing concrete yet to exploit it with right away.
                  fr: Comptez les pions, chaque camp en a sept, le matériel est parfaitement égal — le pion e5 gagné par les Blancs s'échange exactement contre le pion g4 regagné par les Noirs. Le cavalier noir se retrouve de nouveau en g4, plutôt exposé, mais les Blancs n'ont encore rien de concret pour l'exploiter tout de suite.
                plan:
                  vi: Trắng chơi h3 đuổi mã lần nữa, rồi Nf3 và Bg2, tận dụng đường chéo dài và việc Đen còn chậm phát triển. Đen lui mã về f6 hay e5, rồi Nc6 và Bc5, cố hoàn thiện phát triển sau khi đã giành lại quân số ngang nhau.
                  en: White plays h3 to chase the knight again, then Nf3 and Bg2, using the long diagonal and Black's slower development. Black drops the knight back to f6 or e5, then plays Nc6 and Bc5, trying to finish developing now that material is level again.
                  fr: Les Blancs jouent h3 pour chasser à nouveau le cavalier, puis Cf3 et Bg2, exploitant la grande diagonale et le développement plus lent des Noirs. Les Noirs replient le cavalier en f6 ou e5, puis jouent Cc6 et Bc5, essayant d'achever leur développement maintenant que le matériel est de nouveau égal.
                basis:
                  by: chan
                  at: '2026-09-25'
