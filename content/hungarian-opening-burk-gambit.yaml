# Hungarian Opening: Burk Gambit. Frozen defining line 1.g3 e5 2.a3 d5 3.Nf3 e4 4.Nh4 Be7 5.d3
# ends on White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
# Part of batch t of round 4 (#182). Every ply below was replayed with chess.js before it was
# annotated; searchMate at 3 moves from the leaf returns no-mate, so no forced mate is claimed
# anywhere in this entry, and no capture is left going free at the leaf.
id: 'hungarian-opening-burk-gambit'
name: 'Hungarian Opening: Burk Gambit'
eco: 'A00'
category: 'gambit'
side: 'white'
definingLine:
  - 'g3'
  - 'e5'
  - 'a3'
  - 'd5'
  - 'Nf3'
  - 'e4'
  - 'Nh4'
  - 'Be7'
  - 'd3'
soundness:
  value: 'unsound'
  reviewedAt: '2026-10-01'
  basis:
    by: 'chan'
    at: '2026-10-01'
    source: "A judgement. At the end of the defining line the pawns are level, eight each, but White's knight on h4 stands on the edge of the board, attacked by the bishop on e7 and defended only by the g3 pawn, while Black's pawn on e4 is attacked by the d3 pawn and defended by the d5 pawn. White has spent moves on a3 and g3 and has no centre pawn on the fourth rank, so the line is judged unsound. No engine was consulted and no database was queried."
judgement:
  by: 'chan'
  at: '2026-10-01'
  source: "Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement on one date, not engine output and not database statistics."
tree:
  annotation:
    vi: 'Trắng vừa chơi 5.d3, tấn công tốt e4. Số tốt hai bên bằng nhau, mỗi bên tám. Mã h4 của Trắng bị tượng e7 tấn công và được tốt g3 bảo vệ, còn tốt e4 của Đen bị tốt d3 tấn công và được tốt d5 bảo vệ.'
    en: "White has just played 5.d3, attacking the e4 pawn. The pawns are level, eight each. White's knight on h4 is attacked by the bishop on e7 and defended by the g3 pawn, and Black's pawn on e4 is attacked by the d3 pawn and defended by the d5 pawn."
    fr: 'Les Blancs viennent de jouer 5.d3, attaquant le pion e4. Les pions sont à égalité, huit de chaque côté. Le cavalier h4 des Blancs est attaqué par le fou e7 et défendu par le pion g3, et le pion e4 des Noirs est attaqué par le pion d3 et défendu par le pion d5.'
  dismissRest:
    reason:
      vi: 'Đen chơi nước khác 5...f5 ở đây, chẳng hạn 5...Bxh4, đổi tượng lấy mã ở rìa bàn cờ. Mục này đi theo nước tốt hỗ trợ tốt e4.'
      en: 'Black plays something other than 5...f5 here, for instance 5...Bxh4, which trades the bishop for the knight on the edge. This entry follows the pawn move that supports the e4 pawn.'
      fr: 'Les Noirs jouent autre chose que 5...f5 ici, par exemple 5...Bxh4, qui échange le fou contre le cavalier du bord. Cette entrée suit le coup de pion qui soutient le pion e4.'
  children:
    - ply: 'f5'
      replyQuality: 'best'
      frequency: 'common'
      annotation:
        vi: 'Đen bảo vệ tốt e4 lần thứ hai bằng tốt f. Tốt f5 bị mã h4 tấn công và được tượng c8 bảo vệ.'
        en: 'Black defends the pawn on e4 a second time with the f-pawn. The f5 pawn is attacked by the knight on h4 and defended by the bishop on c8.'
        fr: 'Les Noirs défendent le pion e4 une seconde fois avec le pion f. Le pion f5 est attaqué par le cavalier h4 et défendu par le fou c8.'
      outcome:
        type: 'position'
        evaluation:
          vi: 'Đếm tốt: mỗi bên tám, nghĩa là chưa có tốt nào bị mất. Mã h4 đứng ở rìa bàn cờ, bị tượng e7 tấn công và chỉ được tốt g3 bảo vệ, và trong các ô nó có thể đến, f3 bị tốt e4 khống chế, g6 bị tốt h7 khống chế và f5 được tượng c8 bảo vệ, nên chỉ có g2 là ô không bị Đen tấn công. Nxf5 sẽ mất mã lấy một tốt, còn dxe4 chỉ đổi tốt.'
          en: 'Count the pawns: eight each, so no pawn has been lost yet. The knight on h4 stands on the edge of the board, attacked by the bishop on e7 and defended only by the g3 pawn, and of the squares it can reach, f3 is covered by the e4 pawn, g6 by the h7 pawn and f5 is defended by the bishop on c8, so g2 is the only one Black does not attack. Nxf5 would lose the knight for a pawn, and dxe4 only trades pawns.'
          fr: "Comptez les pions : huit de chaque côté, donc aucun pion n'a encore été perdu. Le cavalier h4 se trouve au bord de l'échiquier, attaqué par le fou e7 et défendu seulement par le pion g3, et parmi les cases qu'il peut atteindre, f3 est contrôlée par le pion e4, g6 par le pion h7 et f5 est défendue par le fou c8, donc g2 est la seule que les Noirs n'attaquent pas. Nxf5 perdrait le cavalier pour un pion, et dxe4 ne ferait qu'échanger des pions."
        plan:
          vi: 'Trắng lùi mã bằng Ng2 và đẩy c4 để tấn công tốt d5. Đen phát triển bằng ...Nf6 và nhập thành bằng ...O-O.'
          en: 'White retreats the knight with Ng2 and plays c4 to attack the d5 pawn. Black develops with ...Nf6 and castles with ...O-O.'
          fr: 'Les Blancs replient le cavalier par Ng2 et jouent c4 pour attaquer le pion d5. Les Noirs se développent par ...Nf6 et roquent par ...O-O.'
        basis:
          by: 'chan'
          at: '2026-10-01'
