tree:
  annotation:
    vi: Trắng chơi 3.f4 ngay từ đầu, hiến con tốt f để mở cột f và đường chéo cho tượng c1, tấn công
      thẳng vào trung tâm Đen.
    en:
      White plays 3.f4 right from the start, offering the f-pawn to open the f-file and the diagonal
      for the bishop on c1, striking straight at Black's centre.
    fr:
      Les Blancs jouent 3.f4 dès le début, offrant le pion f pour ouvrir la colonne f et la diagonale
      du fou c1, frappant directement le centre noir.
  dismissRest:
    reason:
      vi:
        Đen chơi nước khác ngoài d5, ví dụ exf4 ăn tốt ngay hoặc d6. Mỗi lựa chọn dẫn tới một hệ thống
        Vienna Gambit khác nhau, và đây là nhánh chọn riêng đòn phản công trung tâm bằng d5.
      en:
        Black plays something other than d5, for instance exf4 to take the pawn at once, or d6. Each
        choice leads into a different Vienna Gambit system, and this is the branch that specifically
        chooses the central counter with d5.
      fr:
        Les Noirs jouent autre chose que d5, par exemple exf4 pour prendre aussitôt le pion, ou d6.
        Chaque choix mène à un système différent du Gambit Vienne, et c'est ici la branche qui
        choisit spécifiquement la contre-attaque centrale par d5.
  children:
    - ply: d5
      replyQuality: best
      frequency: common
      annotation:
        vi:
          Đen phản công ngay ở trung tâm bằng d5, cách đáp trả sắc bén và phổ biến nhất trước Vienna
          Gambit.
        en:
          Black strikes back in the centre at once with d5, the sharpest and most common reply to the
          Vienna Gambit.
        fr:
          Les Noirs frappent aussitôt le centre par d5, la réponse la plus tranchante et la plus courante
          au Gambit Vienne.
      children:
        - ply: fxe5
          annotation:
            vi:
              Trắng ăn tốt e5 thay vì đổi ở d5 trước, giữ đúng tinh thần thí tốt để mở đường tấn công của
              Vienna Gambit.
            en:
              White captures on e5 rather than trading on d5 first, staying true to the pawn-sacrificing,
              attacking spirit of the Vienna Gambit.
            fr:
              Les Blancs capturent en e5 plutôt que d'échanger d'abord en d5, restant fidèles à l'esprit
              sacrificiel et offensif du Gambit Vienne.
          outcome:
            type: position
            evaluation:
              vi: Đếm tốt, Trắng 8 còn Đen 7 — Trắng hơn đúng một tốt sạch.
              en: Count the pawns and it is 8 for White against 7 for Black — White is up one clean pawn.
              fr:
                "Comptez les pions : 8 pour les Blancs contre 7 pour les Noirs — les Blancs sont en avance d'un
                pion net."
            plan:
              vi:
                Trắng chơi Nf3 hoặc Qf3, tranh thủ tốt thừa và các đường mở quanh vua Đen còn ở giữa bàn. Đen
                chơi Nxe4 đòi lại vật chất hoặc d4, phản công vào mã c3 trước khi Trắng kịp hoàn
                thiện phát triển.
              en:
                White plays Nf3 or Qf3, relying on the extra pawn and the open lines around Black's king still
                in the centre. Black plays Nxe4 to win material back, or d4, counterattacking the
                knight on c3 before White can finish developing.
              fr:
                Les Blancs jouent Nf3 ou Qf3, s'appuyant sur le pion supplémentaire et les colonnes ouvertes
                autour du roi noir resté au centre. Les Noirs jouent Nxe4 pour regagner du matériel,
                ou d4, contre-attaquant le cavalier c3 avant que les Blancs n'achèvent leur
                développement.
            basis:
              by: chan
              at: 2026-09-29
