# Zukertort Opening: Lisitsyn Gambit. Frozen defining line 1.Nf3 f5 2.e4, which ends on
# White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). The line
# below was replayed with chess.js before being annotated.
id: zukertort-opening-lisitsyn-gambit
name: 'Zukertort Opening: Lisitsyn Gambit'
eco: A04
category: gambit
side: white
definingLine: [Nf3, f5, e4]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. White throws in e4 against the Dutch-style 1...f5, but nothing here is
      defended: the pawn is simply hanging, and after 2...fxe4 White has only a
      half-developed knight and no immediate way to prove the pawn was worth it. No engine
      was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Sau 1...f5 kiểu Hà Lan, Trắng chơi ngay 2.e4, thí tốt để phá vỡ thế cờ trước khi Đen kịp củng cố nước tốt cánh vua vừa chơi.
    en: After the Dutch-style 1...f5, White immediately plays 2.e4, offering the pawn to rip the position open before Black's kingside pawn move can settle in.
    fr: Après le 1...f5 de style hollandais, les Blancs jouent aussitôt 2.e4, offrant le pion pour ouvrir la position avant que le coup de pion à l'aile roi des Noirs ne puisse s'installer.
  dismissRest:
    reason:
      vi: Đen không ăn tốt e4. Các nước khác như ...d6, ...e6 hay ...Nf6 để nguyên con tốt ấy, và Trắng vẫn có thể đẩy tiếp e5 hoặc giữ nguyên sức căng ở trung tâm.
      en: Black does not take the e4 pawn. Anything else, such as ...d6, ...e6 or ...Nf6, leaves that pawn alone, and White can still push on with e5 or simply keep the central tension as it stands.
      fr: Les Noirs ne prennent pas le pion e4. Tout le reste, comme ...d6, ...e6 ou ...Nf6, laisse ce pion tranquille, et les Blancs peuvent encore pousser e5 ou simplement garder la tension centrale telle quelle.
  children:
    - ply: fxe4
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen ăn tốt e4 đang bỏ ngỏ bằng chính tốt f, cách trực diện nhất để kiểm chứng xem Trắng có thật sự bù đắp được hay không.
        en: Black takes the undefended e4 pawn with the f-pawn, the most direct way to test whether White really has enough to show for it.
        fr: Les Noirs prennent le pion e4 sans défenseur avec le pion f, la façon la plus directe de tester si les Blancs ont vraiment de quoi compenser.
      outcome:
        type: position
        evaluation:
          vi: Đếm quân thì Trắng 38, Đen 39 — Trắng kém đúng một tốt sạch. Con tốt Đen vừa ăn được lại đứng chồng lên tốt e7 còn nguyên của chính Đen trên cùng cột e, nhưng đó chỉ là một điểm trừ nhỏ, không đáng để bù cho việc Trắng chưa có gì cụ thể nhắm vào nó.
          en: Count the pieces and it is 38 for White, 39 for Black — White is a clean pawn down. Black's newly won pawn is doubled with the still-unmoved e7 pawn on the same file, a minor blemish, but nowhere near enough to make up for the fact that White has nothing concrete yet aimed at it.
          fr: Comptez les pièces, 38 pour les Blancs, 39 pour les Noirs — les Blancs sont en retard d'un pion net. Le pion noir tout juste gagné se retrouve doublé avec le pion e7 encore intact des Noirs sur la même colonne, un défaut mineur, mais loin de suffire à compenser le fait que rien du côté blanc ne le vise encore concrètement.
        plan:
          vi: Trắng chơi Ng5 hoặc Nc3 và Bc4, cố nhanh chóng gây sức ép lên tốt e4 và f7 để biện minh cho con tốt đã mất. Đen chơi ...Nf6 hoặc ...d5, củng cố tốt thừa và hoàn tất phát triển bình thường.
          en: White plays Ng5 or Nc3 and Bc4, trying to build quick pressure on the e4 pawn and f7 to justify the lost pawn. Black plays ...Nf6 or ...d5, consolidating the extra pawn and finishing development normally.
          fr: Les Blancs jouent Ng5 ou Nc3 et Bc4, essayant de créer rapidement de la pression sur le pion e4 et sur f7 pour justifier le pion perdu. Les Noirs jouent ...Nf6 ou ...d5, consolidant le pion supplémentaire et achevant leur développement normalement.
        basis:
          by: chan
          at: '2026-09-25'
