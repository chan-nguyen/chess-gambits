tree:
  annotation:
    vi:
      Đen chơi ngay 3...f5, phản kích trung tâm bằng tốt f thay vì phát triển quân bình thường — kiểu
      chơi mạo hiểm và thiên về chiến thuật ngay từ đầu.
    en: Black plays 3...f5 immediately, striking at the centre with the f-pawn instead of developing
      normally — a sharp, tactical try from the very first moves.
    fr: Les Noirs jouent immédiatement 3...f5, frappant le centre avec le pion f au lieu de se
      développer normalement — un choix tranchant et tactique dès les premiers coups.
  dismissRest:
    reason:
      vi:
        Trắng chơi nước khác ngoài 4.exf5, ví dụ Nc3 hay d3, để lại con tốt f5 trên bàn cờ. Đánh giá
        tổng thể thay đổi rõ rệt tuỳ nước đi, nhưng đây luôn là lựa chọn giữa ăn tốt ngay hay phát
        triển trước.
      en:
        White plays something other than 4.exf5, for instance Nc3 or d3, leaving the f5 pawn on the
        board. The overall assessment shifts clearly depending on the move, but it is always a
        choice between grabbing the pawn at once or developing first.
      fr: Les Blancs jouent autre chose que 4.exf5, par exemple Nc3 ou d3, laissant le pion f5 sur
        l'échiquier. L'évaluation générale varie nettement selon le coup, mais il s'agit toujours du
        choix entre prendre le pion tout de suite ou se développer d'abord.
  children:
    - ply: exf5
      replyQuality: best
      frequency: common
      annotation:
        vi:
          Trắng ăn luôn con tốt f5, nhận lời thách của Đen và chấp nhận đi vào biến chính của Jaenisch
          Gambit.
        en:
          White simply takes the f5 pawn, accepting Black's challenge and heading into the main line of
          the Jaenisch Gambit.
        fr:
          Les Blancs prennent tout simplement le pion f5, acceptant le défi et entrant dans la ligne
          principale du Gambit Jaenisch.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 8 còn Đen 7 — Trắng hơn đúng một tốt sạch.
          en: Count the pawns and it is 8 for White against 7 for Black — White is up one clean pawn.
          fr:
            "Comptez les pions : 8 pour les Blancs contre 7 pour les Noirs — les Blancs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng giữ tốt thừa với d4 và Nc3, phát triển nhanh trong lúc vua Đen còn ở giữa bàn. Đen chơi e4
            đuổi mã hoặc Nf6, thí thêm nhịp độ để dồn quân tấn công bù cho con tốt đã mất.
          en:
            White holds on to the extra pawn with d4 and Nc3, developing quickly while Black's king is still
            in the centre. Black plays e4 to chase the knight, or Nf6, spending more tempo to build
            an attack as compensation for the missing pawn.
          fr:
            Les Blancs conservent le pion supplémentaire avec d4 et Nc3, se développant rapidement pendant
            que le roi noir reste au centre. Les Noirs jouent e4 pour chasser le cavalier, ou Nf6,
            dépensant du temps pour construire une attaque en compensation du pion perdu.
        basis:
          by: chan
          at: 2026-09-29
