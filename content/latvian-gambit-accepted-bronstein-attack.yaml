# Latvian Gambit Accepted, Bronstein Attack, taught. Frozen defining line 1.e4 e5 2.Nf3 f5
# 3.Nxe5 Qf6 4.d4 d6 5.Nc4 fxe4, which ends on Black's own 5...fxe4 — the learner's ply — so
# the root is an opponent node (docs/CONTEXT.md, invariant 5). White's 6.Be2 is modelled as
# the root's single reply. Every ply was replayed with chess.js, and the leaf was checked
# with `searchMate` (bounded to 2 moves): no-mate, not in check, no free capture. `e4` was
# independently confirmed attacked by neither side at the root with `chess.js`'s
# `isAttacked`, which is why White develops instead of trying to win it back at once.
id: latvian-gambit-accepted-bronstein-attack
name: 'Latvian Gambit Accepted: Bronstein Attack'
eco: C40
category: gambit
side: black
definingLine: [e4, e5, Nf3, f5, Nxe5, Qf6, d4, d6, Nc4, fxe4]
soundness:
  value: unsound
  reviewedAt: '2026-09-29'
  basis:
    by: chan
    at: '2026-09-29'
    source: >-
      A judgement. Black's early queen sortie and weakened kingside give White a lasting
      lead in development for no lasting material deficit — a well-known practical trap for
      the unprepared, not a sound equaliser for Black. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-09-29'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen vừa ăn lại tốt e4, đưa vật chất về thế cân bằng, và giờ Trắng đơn giản phát triển tượng ra e2 thay vì vội vàng đòi lại con tốt này ngay.
    en: Black has just recaptured the e4 pawn, bringing material back to level, and White now simply develops the bishop to e2 instead of rushing to win that pawn straight back.
    fr: Les Noirs viennent de reprendre le pion e4, ramenant le matériel à l'égalité, et les Blancs se contentent maintenant de développer le fou en e2 plutôt que de se précipiter pour regagner ce pion.
  dismissRest:
    reason:
      vi: Trắng chơi khác 6.Be2 — chẳng hạn phát triển bằng Nc3 hay Be3. Mỗi cách nằm ngoài phạm vi mục này.
      en: White plays something other than 6.Be2 — for instance developing with Nc3 or Be3. Each is outside the scope of this entry.
      fr: Les Blancs jouent autre chose que 6.Be2 — par exemple se développer par Nc3 ou Be3. Chacun sort du cadre de cette entrée.
  children:
    - ply: Be2
      replyQuality: good
      frequency: occasional
      annotation:
        vi: Trắng đưa tượng ra e2, chuẩn bị nhập thành và bỏ qua việc đòi lại con tốt e4 ngay lập tức, vì con tốt ấy hiện chẳng bị bên nào tấn công.
        en: White develops the bishop to e2, preparing to castle and letting the e4 pawn be for now, since it is currently attacked by neither side.
        fr: Les Blancs développent le fou en e2, préparant le roque et laissant pour l'instant le pion e4, qui n'est actuellement attaqué par aucun des deux camps.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì hai bên bằng nhau, mỗi bên bảy — con tốt Đen thí ban đầu đã được Trắng lấy lại qua nước Nxe5, và con tốt e4 hiện tại chỉ là kết quả đổi chác chứ không phải phần thừa. Đen chưa phát triển được quân nhẹ nào, trong khi Trắng chỉ còn một nước nữa (O-O) là hoàn tất nhập thành.
          en: Count the pawns and the two sides are level, seven each — the pawn Black originally offered was won back by White's Nxe5, and the current e4 pawn is simply the product of an exchange rather than a genuine extra. Black has not developed a single minor piece yet, while White is just one move (O-O) from completing castling.
          fr: Comptez les pions, les deux camps sont à égalité, sept de chaque côté — le pion initialement offert par les Noirs a été regagné par le Nxe5 blanc, et le pion e4 actuel n'est que le résultat d'un échange plutôt qu'un véritable surplus. Les Noirs n'ont encore développé aucune pièce mineure, tandis que les Blancs ne sont qu'à un coup (O-O) d'achever le roque.
        plan:
          vi: Trắng chơi O-O rồi Re1, tận dụng việc phát triển nhanh hơn hẳn và con hậu Đen đứng lộ trên f6 để gây sức ép. Đen chơi ...Nf6 hoặc ...Be7 gấp để bắt kịp phát triển và tìm chỗ an toàn cho vua trước khi bị Trắng khai thác quá đà.
          en: White plays O-O then Re1, using the much faster development and Black's exposed queen on f6 to build pressure. Black plays ...Nf6 or ...Be7 urgently to catch up on development and find safety for the king before White can exploit the lead too far.
          fr: Les Blancs jouent O-O puis Re1, exploitant leur développement bien plus rapide et la dame noire exposée en f6 pour créer de la pression. Les Noirs jouent ...Nf6 ou ...Be7 en urgence pour rattraper leur développement et mettre le roi en sécurité avant que les Blancs n'en profitent davantage.
        basis:
          by: chan
          at: '2026-09-29'
