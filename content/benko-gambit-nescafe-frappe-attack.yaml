# Benko Gambit: Nescafe Frappe Attack. Frozen defining line 1.d4 Nf6 2.c4 c5 3.d5 b5
# 4.cxb5 a6 5.Nc3 axb5 6.e4 b4 7.Nb5 d6, which ends on Black's own ply, so the root is
# an opponent node (docs/CONTEXT.md, invariant 5). Replayed with chess.js through
# 8.Bc4 Nxe4 — White's own e4 pawn is still left undefended. searchMate at 3 moves
# from the resulting position returns no-mate, so no forced mate is claimed anywhere
# in this entry, and no capture is left going free at the leaf.
id: benko-gambit-nescafe-frappe-attack
name: 'Benko Gambit: Nescafe Frappe Attack'
eco: A57
category: gambit
side: black
definingLine: [d4, Nf6, c4, c5, d5, b5, cxb5, a6, Nc3, axb5, e4, b4, Nb5, d6]
