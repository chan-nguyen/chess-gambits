    by: chan
    at: '2026-09-30'
    source: >-
      A judgement. White is a pawn down but has built a full centre on d4 and e4, with the
      d4 pawn defended three times, and the bishop on g5 bears on the queen along the d8-h4
      diagonal; that is treated as enough compensation for the line to be labelled sound. No
      engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-30'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa chơi 7.Bg5, tấn công hậu d8, quân được vua và mã c6 bảo vệ. Trắng có bảy tốt, Đen tám tốt, tốt d4 bị tấn công hai lần và được bảo vệ ba lần, còn tốt c3 bị tượng a5 tấn công và được mã b1 bảo vệ. Mục này đi theo nước 7...Nge7.
    en: White has just played 7.Bg5, attacking the queen on d8, which the king and the knight on c6 defend. White has seven pawns to Black's eight, the d4 pawn is attacked twice and defended three times, and the c3 pawn is attacked by the bishop on a5 and defended by the knight on b1. This entry follows 7...Nge7.
    fr: Les Blancs viennent de jouer 7.Bg5, attaquant la dame d8, que le roi et le cavalier c6 défendent. Les Blancs ont sept pions contre huit aux Noirs, le pion d4 est attaqué deux fois et défendu trois fois, et le pion c3 est attaqué par le fou a5 et défendu par le cavalier b1. Cette entrée suit 7...Nge7.
  dismissRest:
    reason:
      vi: Đen chơi một nước khác thay vì 7...Nge7 ở đây, chẳng hạn 7...Nf6. Mục này chỉ mô hình hóa nước đi mã lên e7.
      en: Black plays something other than 7...Nge7 here, for instance 7...Nf6. This entry models only the knight move to e7.
      fr: Les Noirs jouent autre chose que 7...Nge7 ici, par exemple 7...Nf6. Cette entrée ne modélise que le coup de cavalier en e7.
  children:
    - ply: Nge7
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen chặn đường chéo bằng mã từ g8, quân mà tượng g5 giờ tấn công; mã e7 được bảo vệ ba lần, bởi hậu, vua và mã c6.
        en: Black blocks the diagonal with the knight from g8, which the bishop on g5 now attacks; the knight on e7 is defended three times, by the queen, the king and the knight on c6.
        fr: Les Noirs bloquent la diagonale avec le cavalier de g8, que le fou g5 attaque maintenant ; le cavalier e7 est défendu trois fois, par la dame, le roi et le cavalier c6.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám — con tốt đã thí chưa lấy lại được, tốt a của Trắng bị cô lập và cột b bán mở cho Trắng. Tốt d4 bị tấn công hai lần và được bảo vệ ba lần, còn tốt c3, bị tượng a5 tấn công, chỉ có mã b1 bảo vệ. Hai bên chưa nhập thành, và tượng c4 tấn công f7, ô chỉ có vua bảo vệ.'
          en: "Count the pawns: White seven, Black eight — the sacrificed pawn has not come back, White's a-pawn is isolated and the b-file is half-open for White. The d4 pawn is attacked twice and defended three times, while the c3 pawn, attacked by the bishop on a5, has only the knight on b1 to defend it. Neither side has castled, and the bishop on c4 attacks f7, which only the king defends."
          fr: "Comptez les pions : sept pour les Blancs, huit pour les Noirs — le pion sacrifié n'est pas revenu, le pion a blanc est isolé et la colonne b est semi-ouverte pour les Blancs. Le pion d4 est attaqué deux fois et défendu trois fois, tandis que le pion c3, attaqué par le fou a5, n'a que le cavalier b1 pour le défendre. Aucun camp n'a roqué, et le fou c4 attaque f7, que seul le roi défend."
        plan:
          vi: Trắng chơi Qb3, bảo vệ tốt c3 và tấn công b7, rồi O-O. Đen chơi ...O-O và ...Bg4 để tấn công mã f3.
          en: White plays Qb3, which defends the c3 pawn and attacks b7, and then O-O. Black plays ...O-O and ...Bg4 to attack the knight on f3.
          fr: Les Blancs jouent Qb3, qui défend le pion c3 et attaque b7, puis O-O. Les Noirs jouent ...O-O et ...Bg4 pour attaquer le cavalier f3.
        basis:
          by: chan
          at: 2026-09-30
