# English Opening: Wade Gambit. Frozen defining line 1.c4 f5 2.g4, which ends on White's own
# ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). Replayed with
# chess.js through 2...fxg4: Black takes the pawn at once, the only piece that can capture
# there. Nothing is hanging at the resulting position. searchMate at 4 moves from this
# position returns no-mate, so no forced mate is claimed anywhere in this entry.
id: english-opening-wade-gambit
name: 'English Opening: Wade Gambit'
eco: A10
category: gambit
side: white
definingLine: [c4, f5, g4]
soundness:
  value: unsound
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. White offers a wing pawn to open the g-file and pull the f5 pawn off its
      post, but the king's own cover is weakened first and Black keeps the pawn with no
      immediate way for White to make it count. No engine was consulted and no database was
      queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
