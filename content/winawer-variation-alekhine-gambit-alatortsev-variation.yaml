tree:
  annotation:
    vi: Sau khi đổi tốt trung tâm và Trắng ăn lại bằng mã trên e4 rồi đưa quân thứ hai ra g3, Đen đã
      nhập thành và Trắng chơi tiếp 9.Be2, chuẩn bị nhập thành ở lượt sau.
    en:
      After the central pawn trade and White recaptures with the knight on e4 before bringing a second
      knight to g3, Black has castled and White continues with 9.Be2, preparing to castle next.
    fr: Après l'échange de pions au centre et la reprise par le cavalier en e4 suivie d'un second
      cavalier en g3, les Noirs ont roqué et les Blancs poursuivent par 9.Be2, préparant à roquer au
      coup suivant.
  dismissRest:
    reason:
      vi:
        Đen chơi nước khác ngoài Nc6, ví dụ b6 chuẩn bị fianchetto hoặc c5 ngay. Đánh giá chung — vật
        chất cân bằng, Đen đã nhập thành trước — không đổi nhiều.
      en:
        Black plays something other than Nc6, for instance b6 preparing a fianchetto, or c5 right away.
        The overall assessment — level material, Black having castled first — does not change much.
      fr:
        Les Noirs jouent autre chose que Nc6, par exemple b6 préparant un fianchetto, ou c5 tout de
        suite. L'évaluation générale — matériel égal, les Noirs ayant roqué en premier — ne change
        guère.
  children:
    - ply: Nc6
      replyQuality: good
      frequency: common
      annotation:
        vi:
          Đen phát triển mã ra c6, hoàn thiện đội hình sau khi đã nhập thành trong lúc Trắng còn chưa làm
          vậy.
        en:
          Black develops the knight to c6, completing the setup having already castled while White has not
          yet done so.
        fr:
          Les Noirs développent le cavalier en c6, complétant le dispositif après avoir déjà roqué alors
          que les Blancs ne l'ont pas encore fait.
      outcome:
        type: position
        evaluation:
          vi:
            Đếm tốt, hai bên đều có 7 — vật chất cân bằng sau loạt đổi tốt ở trung tâm. Đen đã nhập thành
            trong khi Trắng vẫn chưa làm vậy.
          en:
            Count the pawns and both sides have 7 — material is level after the central pawn trade. Black
            has already castled while White has not.
          fr:
            Comptez les pions, chaque camp en a 7 — le matériel est égal après l'échange de pions au centre.
            Les Noirs ont déjà roqué alors que les Blancs ne l'ont pas encore fait.
        plan:
          vi:
            Trắng chơi O-O hoặc c3, hoàn thiện an toàn cho vua và tận dụng cặp mã e4-g3 khá hoạt động. Đen
            chơi b6 hoặc Nd5, hoàn thiện phát triển cho tượng c8 và tìm cách đổi bớt con mã e4 đang
            hoạt động của Trắng.
          en:
            White plays O-O or c3, finishing king safety and relying on the fairly active e4-g3 knight duo.
            Black plays b6 or Nd5, finishing development for the bishop on c8 and looking to trade
            off White's active knight on e4.
          fr:
            Les Blancs jouent O-O ou c3, achevant la sécurité du roi et s'appuyant sur le duo de cavaliers
            e4-g3 assez actif. Les Noirs jouent b6 ou Nd5, achevant le développement du fou c8 et
            cherchant à échanger le cavalier actif blanc en e4.
        basis:
          by: chan
          at: 2026-09-29
