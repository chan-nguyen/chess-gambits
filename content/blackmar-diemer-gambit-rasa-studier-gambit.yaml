tree:
  annotation:
    vi: Trắng vừa chơi 4.Be3. Tượng và hậu giờ cùng bảo vệ tốt d4, vốn bị hậu Đen tấn công dọc cột d. Tốt e4 bị tấn công một lần, bởi mã c3, và được bảo vệ một lần, bởi mã f6.
    en: White has just played 4.Be3. The bishop and the queen now both defend the d4 pawn, which Black's queen attacks down the d-file. The pawn on e4 is attacked once, by the knight on c3, and defended once, by the knight on f6.
    fr: Les Blancs viennent de jouer 4.Be3. Le fou et la dame défendent maintenant tous deux le pion d4, que la dame noire attaque le long de la colonne d. Le pion e4 est attaqué une fois, par le cavalier c3, et défendu une fois, par le cavalier f6.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 4...Bf5. Bài này chỉ đi theo nhánh phát triển tượng ra f5; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 4...Bf5 here. This entry follows the development of the bishop to f5 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 4...Bf5. Cette fiche ne suit que le développement du fou en f5 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Bf5
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen phát triển tượng ra f5, 4...Bf5, nơi nó bảo vệ tốt e4 lần thứ hai.
        en: Black develops the bishop to f5, 4...Bf5, where it defends the pawn on e4 a second time.
        fr: Les Noirs développent le fou en f5, 4...Bf5, où il défend une seconde fois le pion e4.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt. Tốt thừa e4 bị tấn công một lần, bởi mã c3, và được bảo vệ hai lần, bởi mã f6 và tượng f5, nên Trắng chưa thể lấy lại ngay. Mỗi bên đã phát triển một mã và một tượng.'
          en: 'Count the pawns: White seven, Black eight, so White is a pawn down. The extra pawn on e4 is attacked once, by the knight on c3, and defended twice, by the knight on f6 and the bishop on f5, so White cannot win it back at once. Each side has a knight and a bishop developed.'
          fr: 'Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins. Le pion en trop e4 est attaqué une fois, par le cavalier c3, et défendu deux fois, par le cavalier f6 et le fou f5 : les Blancs ne peuvent pas le reprendre tout de suite. Chaque camp a un cavalier et un fou développés.'
        plan:
          vi: Trắng thêm quân tấn công e4 bằng f3 và phát triển bằng Qd2, chuẩn bị nhập thành dài; Đen củng cố tốt bằng ...e6 hoặc ...c6 và tiếp tục phát triển.
          en: White adds a second attacker on e4 with f3 and develops with Qd2, preparing to castle long; Black supports the pawn with ...e6 or ...c6 and keeps developing.
          fr: Les Blancs ajoutent un deuxième attaquant sur e4 par f3 et se développent par Qd2, préparant le grand roque ; les Noirs soutiennent le pion par ...e6 ou ...c6 et poursuivent leur développement.
        basis:
          by: chan
          at: '2026-09-30'
