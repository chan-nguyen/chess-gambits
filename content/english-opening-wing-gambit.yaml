# English Opening: Wing Gambit. Frozen defining line 1.c4 c5 2.b4, which ends on White's
# own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). The line below
# was replayed with chess.js before being annotated.
id: english-opening-wing-gambit
name: 'English Opening: Wing Gambit'
eco: A30
category: gambit
side: white
definingLine: [c4, c5, b4]
soundness:
  value: dubious
  reviewedAt: '2026-09-21'
  basis:
    by: chan
    at: '2026-09-21'
    source: >-
      A judgement, borrowed from the same idea in the Sicilian Wing Gambit. White gives up
      the b-pawn to open the long diagonal for a fianchettoed bishop and pull the c5 pawn
      off its post, but Black can simply keep the pawn with careful play. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-21'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng chơi 2.b4, mời Đen ăn con tốt để đổi lấy việc mở đường chéo dài cho tượng fianchetto và kéo tốt c5 của Đen ra khỏi vị trí, giống hệt ý tưởng của Wing Gambit trong Phòng thủ Sicilian.
    en: White plays 2.b4, inviting Black to take the pawn in exchange for opening the long diagonal for a fianchettoed bishop and pulling Black's c5 pawn off its post, exactly the same idea as the Wing Gambit in the Sicilian Defense.
    fr: Les Blancs jouent 2.b4, invitant les Noirs à prendre le pion en échange de l'ouverture de la grande diagonale pour un fou fianchetté et du déplacement du pion c5 noir de son poste, exactement la même idée que le Gambit de l'Aile dans la Défense sicilienne.
  dismissRest:
    reason:
      vi: Đen không ăn con tốt b4. Các nước khác như Nf6 hay g6 để nguyên con tốt b4 trên bàn cờ, nghĩa là lời mời vẫn chưa hề được nhận.
      en: Black does not take the b4 pawn. Anything else, such as Nf6 or g6, leaves the b4 pawn sitting on the board, meaning the offer has still not actually been accepted.
      fr: Les Noirs ne prennent pas le pion b4. Tout le reste, comme Nf6 ou g6, laisse le pion b4 sur l'échiquier, ce qui veut dire que l'offre n'a toujours pas été acceptée.
  children:
    - ply: cxb4
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen ăn con tốt ngay lập tức, quân duy nhất có thể ăn tại đó. Con tốt c5 đã hoàn thành việc ăn quân và Đen giờ hơn hẳn một tốt.
        en: Black takes the pawn at once, the only piece that can capture there. The c5 pawn has done its capturing and Black is now a clean pawn up.
        fr: Les Noirs prennent aussitôt le pion, la seule pièce pouvant capturer là. Le pion c5 a fait sa capture et les Noirs ont maintenant un pion net d'avance.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy. Đen hơn đúng một tốt sạch, còn Trắng chưa có gì cụ thể để bù lại ngoài ý định mở đường chéo a1-h8 bằng Bb2 hay g3 và Bg2 sau này.
          en: Count the pawns and it is eight for Black, seven for White. Black is a clean pawn up, and White has nothing concrete yet to show for it beyond the intention to open the a1-h8 diagonal with Bb2 or g3 and Bg2 later.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs. Les Noirs ont un pion net d'avance, et les Blancs n'ont encore rien de concret à montrer, hormis l'intention d'ouvrir la diagonale a1-h8 par Bb2 ou g3 et Bg2 plus tard.
        plan:
          vi: Trắng chơi Bb2 hoặc g3 rồi Bg2, Nf3 và e3, phát triển nhanh và gây sức ép lên đường chéo dài cùng cột b nửa mở, cố tạo đủ hoạt động để bù cho con tốt đã mất. Đen chơi Nc6, d5 hay e5, hoàn tất phát triển một cách chắc chắn và tìm cách đổi bớt quân để giữ vững con tốt thừa vào tàn cuộc.
          en: White plays Bb2 or g3 and Bg2, Nf3 and e3, developing quickly and pressuring the long diagonal and the half-open b-file, trying to create enough activity to make up for the lost pawn. Black plays Nc6, d5 or e5, completing development soundly and looking to trade pieces to carry the extra pawn into the endgame.
          fr: Les Blancs jouent Bb2 ou g3 puis Bg2, Nf3 et e3, se développant rapidement et faisant pression sur la grande diagonale et la colonne b semi-ouverte, essayant de créer assez d'activité pour compenser le pion perdu. Les Noirs jouent Nc6, d5 ou e5, achevant leur développement solidement et cherchant à échanger des pièces pour porter le pion supplémentaire jusqu'à la finale.
        basis:
          by: chan
          at: '2026-09-21'
