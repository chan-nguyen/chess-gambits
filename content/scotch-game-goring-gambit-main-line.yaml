tree:
  annotation:
    vi: Sau khi Trắng thí hai tốt (d4 rồi c3) và ăn lại bằng Nxc3, Trắng đã có một mã phát triển và
      trung tâm thoáng để đổi lấy hai tốt.
    en: After White gives up two pawns (d4, then c3) and recaptures with Nxc3, White has a developed
      knight and an open centre in exchange for the two pawns.
    fr: Après avoir cédé deux pions (d4 puis c3) et repris avec Nxc3, les Blancs ont un cavalier
      développé et un centre ouvert en échange des deux pions.
  dismissRest:
    reason:
      vi:
        Đen chơi nước khác ngoài Bb4, ví dụ d6 hay Nf6 luôn. Ý tưởng của Trắng — phát triển nhanh, nhắm
        vào f7 — và đánh giá chung không đổi nhiều theo lựa chọn ấy.
      en: Black plays something other than Bb4, for instance d6 or Nf6 right away. White's idea —
        developing quickly, eyeing f7 — and the overall assessment do not change much with that
        choice.
      fr:
        Les Noirs jouent autre chose que Bb4, par exemple d6 ou Nf6 directement. L'idée des Blancs — se
        développer vite, viser f7 — et l'évaluation générale ne changent guère selon ce choix.
  children:
    - ply: Bb4
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen ghim mã c3 bằng Bb4, cách đáp trả tiêu chuẩn nhất trước Göring Gambit.
        en: Black pins the knight on c3 with Bb4, the most standard reply to the Göring Gambit.
        fr: Les Noirs clouent le cavalier c3 avec Bb4, la réponse la plus classique au Gambit Göring.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 6 còn Đen 7 — Đen hơn đúng một tốt sạch.
          en: Count the pawns and it is 6 for White against 7 for Black — Black is up one clean pawn.
          fr:
            "Comptez les pions : 6 pour les Blancs contre 7 pour les Noirs — les Noirs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng chơi Bc4 và O-O, tranh thủ đưa quân ra nhanh và nhắm vào f7 trong lúc mã c3 tạm thời bị
            ghim. Đen chơi Nf6 hoặc d6, hoàn thiện phát triển và tìm cách đổi bớt quân tấn công của
            Trắng.
          en:
            White plays Bc4 and O-O, rushing pieces into play and eyeing f7 while the knight on c3 is
            temporarily pinned. Black plays Nf6 or d6, finishing development and looking to trade
            off some of White's attacking pieces.
          fr:
            Les Blancs jouent Bc4 et O-O, développant rapidement leurs pièces et visant f7 pendant que le
            cavalier c3 est momentanément cloué. Les Noirs jouent Nf6 ou d6, achevant leur
            développement et cherchant à échanger certaines pièces d'attaque blanches.
        basis:
          by: chan
          at: 2026-09-29
