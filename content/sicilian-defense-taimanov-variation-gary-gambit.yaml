                vi: Trắng đổi mã lấy mã ở d5. Mã d5 của Trắng bị hậu d8 và tốt e6 tấn công và có tốt e4 cùng hậu d1 bảo vệ.
                en: White trades knights on d5. White's knight on d5 is attacked by the queen on d8 and the e6 pawn and defended by the e4 pawn and the queen on d1.
                fr: Les Blancs échangent les cavaliers en d5. Le cavalier d5 des Blancs est attaqué par la dame d8 et le pion e6 et défendu par le pion e4 et la dame d1.
              children:
                - ply: exd5
