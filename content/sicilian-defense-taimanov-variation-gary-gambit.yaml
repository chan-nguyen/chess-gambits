                    vi: 'Đen ăn lại bằng tốt e: tốt d5 mới tấn công tốt e4, tốt mà không quân nào bảo vệ.'
                    en: 'Black recaptures with the e-pawn: the new pawn on d5 attacks the e4 pawn, which nothing defends.'
                    fr: 'Les Noirs reprennent avec le pion e : le nouveau pion d5 attaque le pion e4, que rien ne défend.'
                  dismissRest:
                    reason:
                      vi: Trắng chơi nước khác thay vì 11.exd5, chẳng hạn 11.e5 hoặc 11.Bc4. Đánh giá trong mục này dành cho nhánh Trắng ăn tốt d5.
                      en: White plays something other than 11.exd5, for example 11.e5 or 11.Bc4. The assessment in this entry is for the line where White takes the d5 pawn.
                      fr: Les Blancs jouent autre chose que 11.exd5, par exemple 11.e5 ou 11.Bc4. L'évaluation de cette fiche porte sur la ligne où les Blancs prennent le pion d5.
                  children:
                    - ply: exd5
                      replyQuality: good
                      frequency: common
                      annotation:
                        vi: 'Trắng ăn tốt d5 bằng tốt e: Trắng hơn một tốt, sáu so với năm, và tốt d5 tấn công mã c6.'
                        en: 'White takes the d5 pawn with the e-pawn: White is a pawn up, six to five, and the d5 pawn attacks the knight on c6.'
                        fr: 'Les Blancs prennent le pion d5 avec le pion e : les Blancs ont un pion de plus, six contre cinq, et le pion d5 attaque le cavalier c6.'
                      outcome:
                        type: position
                        evaluation:
                          vi: 'Đếm tốt: Trắng sáu, Đen năm — Đen kém một tốt. Bù lại, tốt d5 của Trắng bị cô lập, hai cột c và e mở hoàn toàn bên cạnh nó, và hậu d8 của Đen nhắm vào nó trên cột d nửa mở, một quân tấn công đối một quân bảo vệ là hậu d1. Mã c6 của Đen bị tốt d5 tấn công và chỉ có tốt b7 bảo vệ.'
                          en: "Count the pawns: White six, Black five — Black is a pawn down. In return White's d5 pawn is isolated, the c- and e-files beside it are completely open, and Black's queen on d8 bears on it on the half-open d-file, one attacker against one defender, the queen on d1. Black's knight on c6 is attacked by the d5 pawn and defended only by the b7 pawn."
                          fr: 'Comptons les pions : six pour les Blancs, cinq pour les Noirs — les Noirs ont un pion de moins. En contrepartie, le pion d5 blanc est isolé, les colonnes c et e à côté de lui sont entièrement ouvertes, et la dame d8 noire le vise sur la colonne d semi-ouverte, un attaquant contre un défenseur, la dame d1. Le cavalier c6 noir est attaqué par le pion d5 et défendu seulement par le pion b7.'
                        plan:
                          vi: Đen dời mã đi với nước có lợi, chẳng hạn ...Nb4 để tấn công d5 lần thứ hai, rồi phát triển nốt tượng và nhập thành. Trắng bảo vệ tốt d5 bằng Bc4, rồi Be3 và nhập thành, mang mã a3 về chơi.
                          en: Black moves the knight with a useful move, for example ...Nb4 to attack d5 a second time, then develops the bishops and castles. White defends the d5 pawn with Bc4, then plays Be3 and castles, bringing the knight on a3 back into play.
                          fr: Les Noirs déplacent le cavalier avec un coup utile, par exemple ...Nb4 pour attaquer d5 une seconde fois, puis développent les fous et roquent. Les Blancs défendent le pion d5 par Bc4, puis jouent Be3 et roquent, remettant en jeu le cavalier a3.
