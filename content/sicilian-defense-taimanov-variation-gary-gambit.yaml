# Sicilian Defense: Taimanov Variation, Gary Gambit. Frozen defining line 1.e4 c5 2.Nf3 e6 3.d4
# cxd4 4.Nxd4 Nc6 5.Nb5 d6 6.c4 Nf6 7.N1c3 a6 8.Na3 d5, which ends on Black's own ply, so the root is
# an opponent node (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 9.cxd5 Nxd5 10.Nxd5
