    source: "A judgement. At the leaf Black is a pawn down, five pawns to six, and Black's only compensation is structural: White's d5 pawn is isolated, with the c- and e-files open beside it, and the queen on d8 faces it on the half-open d-file, defended once against one attacker. The knight on c6 is attacked by that pawn and defended only by the b7 pawn. No engine was consulted and no database was queried."
judgement:
  by: chan
  at: '2026-09-30'
  source: Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: 'Đen vừa chơi 8...d5, thí một tốt: tốt d5 bị bốn quân tấn công (tốt c4, tốt e4, mã c3 và hậu d1) và có ba quân bảo vệ (hậu d8, tốt e6 và mã f6). Số tốt hai bên bằng nhau, bảy mỗi bên.'
    en: 'Black has just played 8...d5, offering a pawn: the d5 pawn is attacked four times (by the c4 pawn, the e4 pawn, the knight on c3 and the queen on d1) and defended three times (by the queen on d8, the e6 pawn and the knight on f6). The pawn count is level, seven each.'
    fr: 'Les Noirs viennent de jouer 8...d5, offrant un pion : le pion d5 est attaqué quatre fois (par le pion c4, le pion e4, le cavalier c3 et la dame d1) et défendu trois fois (par la dame d8, le pion e6 et le cavalier f6). Le compte de pions est égal, sept de chaque côté.'
  dismissRest:
    reason:
      vi: Trắng chọn nước khác thay vì 9.cxd5, chẳng hạn 9.exd5 hoặc 9.Nxd5. Đánh giá trong mục này dành cho nhánh Trắng ăn tốt d5 bằng tốt c.
      en: White plays something other than 9.cxd5, for example 9.exd5 or 9.Nxd5. The assessment in this entry is for the line where White takes on d5 with the c-pawn.
      fr: Les Blancs jouent autre chose que 9.cxd5, par exemple 9.exd5 ou 9.Nxd5. L'évaluation de cette fiche porte sur la ligne où les Blancs prennent en d5 avec le pion c.
  children:
    - ply: cxd5
      replyQuality: good
      frequency: common
      annotation:
        vi: 'Trắng ăn tốt d5 bằng tốt c: Trắng hơn một tốt, bảy so với sáu, và tốt d5 mới tấn công mã c6, con mã chỉ có tốt b7 bảo vệ.'
        en: 'White takes the d5 pawn with the c-pawn: White is a pawn up, seven to six, and the new pawn on d5 attacks the knight on c6, which only the b7 pawn defends.'
        fr: 'Les Blancs prennent le pion d5 avec le pion c : les Blancs ont un pion de plus, sept contre six, et le nouveau pion d5 attaque le cavalier c6, que seul le pion b7 défend.'
      children:
        - ply: Nxd5
          annotation:
            vi: 'Đen ăn lại tốt d5 bằng mã f6: số tốt về bằng nhau, sáu mỗi bên. Mã d5 bị tốt e4, mã c3 và hậu d1 tấn công và có hậu d8 cùng tốt e6 bảo vệ.'
            en: 'Black takes back on d5 with the knight from f6: the pawn count is level again, six each. The knight on d5 is attacked by the e4 pawn, the knight on c3 and the queen on d1 and defended by the queen on d8 and the e6 pawn.'
            fr: 'Les Noirs reprennent en d5 avec le cavalier de f6 : le compte de pions est de nouveau égal, six de chaque côté. Le cavalier d5 est attaqué par le pion e4, le cavalier c3 et la dame d1 et défendu par la dame d8 et le pion e6.'
          dismissRest:
            reason:
              vi: Trắng chơi nước khác thay vì 10.Nxd5, chẳng hạn 10.exd5 hoặc 10.Nab5. Đánh giá trong mục này dành cho nhánh Trắng đổi mã ở d5.
              en: White plays something other than 10.Nxd5, for example 10.exd5 or 10.Nab5. The assessment in this entry is for the line where White trades knights on d5.
              fr: Les Blancs jouent autre chose que 10.Nxd5, par exemple 10.exd5 ou 10.Nab5. L'évaluation de cette fiche porte sur la ligne où les Blancs échangent les cavaliers en d5.
