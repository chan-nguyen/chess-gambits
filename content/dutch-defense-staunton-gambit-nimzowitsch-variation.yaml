# Dutch Defense: Staunton Gambit, Nimzowitsch Variation. Frozen defining line 1.d4 f5
# 2.e4 fxe4 3.Nc3 Nf6 4.Bg5, which ends on White's own ply, so the root is an opponent
# node (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 4...b6.
# searchMate at 3 moves from the resulting position returns no-mate, so no forced mate
# is claimed anywhere in this entry, and no capture is left going free at the leaf.
