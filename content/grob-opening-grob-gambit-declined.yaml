# Grob Opening: Grob Gambit Declined. Frozen defining line 1.g4 d5 2.Bg2 c6, which ends on
# Black's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5). The line
# below was replayed with chess.js before being annotated.
id: grob-opening-grob-gambit-declined
name: 'Grob Opening: Grob Gambit Declined'
eco: A00
category: gambit
side: black
definingLine: [g4, d5, Bg2, c6]
soundness:
  value: dubious
  reviewedAt: '2026-09-21'
  basis:
    by: chan
    at: '2026-09-21'
    source: >-
      A judgement. Black leaves the g4 pawn where it is rather than grabbing it with Bxg4,
      choosing a solid centre instead of a pawn that could come with practical dangers on
      the long light-squared diagonal. Not taking a free pawn needs a real reason, and a
      quiet centre is a reasonable if modest one. No engine was consulted and no database
      was queried.
judgement:
  by: chan
  at: '2026-09-21'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen chơi 2...c6 thay vì ăn con tốt g4 bằng Bxg4. Đây là cách chơi thận trọng, chuẩn bị d5-c6 kiểu Slav, tránh việc đưa tượng ra sớm rồi có thể bị Trắng tranh thủ h3 và c4 tấn công.
    en: Black plays 2...c6 instead of grabbing the g4 pawn with Bxg4. This is the cautious approach, setting up a Slav-like d5-c6 centre and avoiding an early bishop sortie that White could later hit with h3 and c4.
    fr: Les Noirs jouent 2...c6 au lieu de ramasser le pion g4 par Bxg4. C'est l'approche prudente, mettant en place un centre à la Slave avec d5-c6 et évitant une sortie précoce du fou que les Blancs pourraient plus tard attaquer par h3 et c4.
  dismissRest:
    reason:
      vi: Trắng không chơi một nước vừa an toàn vừa đỡ chắc con tốt g4. Các nước khác ở đây, như c4 hay Nf3, phát triển hợp lý nhưng để con tốt g4 tiếp tục treo trước tượng c8, kém rõ ràng hơn nước được chọn.
      en: White does not play a move that is both safe and defends the g4 pawn. The alternatives here, such as c4 or Nf3, develop reasonably but leave the g4 pawn still hanging to the c8 bishop, less clear-cut than the chosen move.
      fr: Les Blancs ne jouent pas un coup à la fois sûr et qui défend le pion g4. Les alternatives ici, comme c4 ou Nf3, se développent raisonnablement mais laissent le pion g4 toujours en prise au fou c8, moins net que le coup choisi.
  children:
    - ply: h3
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng chơi h3, đỡ chắc con tốt g4 bằng tốt h và hoàn tất việc lập cấu trúc tốt cánh vua kiểu Grob, dù có phần làm yếu các ô đen quanh vua.
        en: White plays h3, defending the g4 pawn with the h-pawn and completing the typical Grob kingside pawn setup, even though it does somewhat weaken the dark squares around the king.
        fr: Les Blancs jouent h3, défendant le pion g4 avec le pion h et achevant la structure de pions typique du Grob à l'aile roi, même si cela affaiblit un peu les cases noires autour du roi.
      outcome:
        type: position
        evaluation:
          vi: Quân số ngang nhau, mỗi bên tám tốt. Trắng có thêm khoảng không ở cánh vua nhờ g4 và chuẩn bị Bg2 ngắm vào đường chéo dài, nhưng cấu trúc tốt g4-h3 để lại một số ô yếu quanh vua nếu Trắng nhập thành ngắn sau này. Đen có trung tâm chắc chắn với d5-c6 và chưa có điểm yếu nào.
          en: Material is level at eight pawns each. White has extra kingside space thanks to g4 and is aiming Bg2 down the long diagonal, but the g4-h3 pawn structure leaves some weak squares around the king if White later castles short. Black has a solid centre with d5-c6 and no weaknesses yet.
          fr: Le matériel est égal, huit pions de chaque côté. Les Blancs ont un espace supplémentaire à l'aile roi grâce à g4 et visent la grande diagonale avec Bg2, mais la structure de pions g4-h3 laisse quelques cases faibles autour du roi si les Blancs roquent côté roi plus tard. Les Noirs ont un centre solide avec d5-c6 et aucune faiblesse pour l'instant.
        plan:
          vi: Đen chơi Bg7 kiểu fianchetto để tranh chấp đường chéo dài, hay Nf6 và Bg4 gián tiếp, cùng với e5 hoặc e6 để hoàn tất phát triển và tấn công vào cấu trúc tốt cánh vua lỏng lẻo của Trắng. Trắng chơi Bg2, Nf3 hay Nh3, và d3 hay c4, cố tận dụng đường chéo dài và khoảng không đã có được để bù cho những ô yếu ở cánh vua.
          en: Black plays Bg7 with a fianchetto to contest the long diagonal, or Nf6 and later Bg4, together with e5 or e6 to complete development and target White's loose kingside structure. White plays Bg2, Nf3 or Nh3, and d3 or c4, trying to make use of the long diagonal and the space already gained to compensate for the weak kingside squares.
          fr: Les Noirs jouent Bg7 en fianchetto pour disputer la grande diagonale, ou Nf6 puis Bg4, avec e5 ou e6 pour achever leur développement et viser la structure lâche des Blancs à l'aile roi. Les Blancs jouent Bg2, Nf3 ou Nh3, et d3 ou c4, essayant d'exploiter la grande diagonale et l'espace déjà gagné pour compenser les cases faibles à l'aile roi.
        basis:
          by: chan
          at: '2026-09-21'
