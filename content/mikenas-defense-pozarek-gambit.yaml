# Mikenas Defense: Pozarek Gambit. Frozen defining line 1.d4 Nc6 2.c4 e5 3.dxe5 Nxe5 4.Nc3
# Nxc4, which ends on Black's own ply — the capture that gives the line its name — so the root
# is an opponent node with White to move (docs/CONTEXT.md, invariant 5). Side is black here:
# it is Black's knight that does the grabbing, and invariant 5 requires the defining line to end
# on the taught side's own move, which fixes which side this entry teaches regardless of how
# the source dataset happened to label the variation.
#
# White has a real development lead (Nc3, e4) for the pawn Black has grabbed, but "real lead"
# is not the same as "shown compensation" — nothing concrete (no open line at the black king,
# no immediate threat) has actually appeared on the board by the point this entry stops
# looking, so the leaf below names what is actually there (a clean extra pawn) rather than
# crediting White with an edge that has not yet materialised.
id: mikenas-defense-pozarek-gambit
name: 'Mikenas Defense: Pozarek Gambit'
eco: A40
category: gambit
side: black
definingLine: [d4, Nc6, c4, e5, dxe5, Nxe5, Nc3, Nxc4]
soundness:
  value: dubious
  reviewedAt: '2026-09-18'
  basis:
    by: chan
    at: '2026-09-18'
    source: >-
      A judgement, no engine consulted. Black nets a clean pawn by grabbing on c4, but the
      knight has now moved three times while White is ready to play e4 with a real
      development lead — real enough that the extra pawn is not simply free, even though
      nothing concrete has been shown for it yet either.
judgement:
  by: chan
  at: '2026-09-18'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen vừa ăn tốt c4 bằng mã, con mã đã nhảy ba lần liên tiếp (c6-e5-c4) để lấy một tốt. Đây là Pozarek Gambit trong Mikenas Defense — thí tốt c4 để đổi lấy quyền phát triển nhanh cho Trắng.
    en: Black has just taken the c4 pawn with the knight, which has now jumped three times in a row (c6-e5-c4) to win one pawn. This is the Pozarek Gambit inside the Mikenas Defense — White gives up the c4 pawn in exchange for a free run at rapid development.
    fr: Les Noirs viennent de prendre le pion c4 du cavalier, qui a désormais sauté trois fois de suite (c6-e5-c4) pour gagner un pion. C'est le Gambit Pozarek à l'intérieur de la Défense Mikenas — les Blancs cèdent le pion c4 contre un développement rapide sans entrave.
  dismissRest:
    reason:
      vi: Trắng không đuổi mã ngay bằng e4. Các nước khác (phát triển tượng, đưa hậu ra, nhập thành sớm) đều hợp lý nhưng để con mã Đen tiếp tục đứng ở c4 thêm một nhịp, tức là bỏ lỡ cách thử thách thức nhất và tự nhiên nhất đối với con mã đã đi ba lần.
      en: White does not chase the knight at once with e4. The other tries (developing a bishop, bringing the queen out, castling early) are reasonable but let Black's knight sit on c4 for another move, which passes up the most natural and most testing way to challenge a knight that has already moved three times.
      fr: Les Blancs ne chassent pas le cavalier tout de suite par e4. Les autres essais (développer un fou, sortir la dame, roquer tôt) sont raisonnables mais laissent le cavalier noir rester en c4 un coup de plus, ce qui renonce à la façon la plus naturelle et la plus exigeante de mettre à l'épreuve un cavalier qui a déjà bougé trois fois.
  children:
    - ply: e4
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng đẩy tốt lên, chiếm trung tâm và đồng thời đuổi con mã đang đứng ở c4. Con mã đã ăn tốt giờ phải tìm đường về.
        en: White pushes the pawn up, taking the centre and chasing the knight sitting on c4 in the same move. The knight that grabbed the pawn now has to find its way home.
        fr: Les Blancs poussent le pion, prenant le centre tout en chassant le cavalier posté en c4. Le cavalier qui a pris le pion doit maintenant trouver le chemin du retour.
      children:
        - ply: Nb6
          annotation:
            vi: Mã lùi về một ô an toàn và vẫn giữ được con tốt đã ăn. Trắng giờ có trung tâm c4 (đã mất) đổi lấy e4 và Nc3, một quyền phát triển nhanh thật sự chứ không phải suông — nhưng vẫn chỉ là tiềm năng cho tới khi nó tạo ra được điều gì đó cụ thể.
            en: The knight retreats to a safe square and keeps the pawn it grabbed. White now has e4 and Nc3 in place of the lost c4 pawn — a real development lead, not an empty one — but it is still only potential until it produces something concrete.
            fr: Le cavalier recule sur une case sûre et garde le pion gagné. Les Blancs disposent désormais de e4 et Nc3 à la place du pion c4 perdu — une réelle avance de développement, pas une avance creuse — mais ce n'est encore qu'un potentiel tant qu'elle n'a rien produit de concret.
          outcome:
            type: position
            evaluation:
              vi: Đen hơn đúng một tốt sạch — tốt c4 ăn được từ nước bốn và chưa hề bị đòi lại, mã đã về chỗ an toàn ở b6. Đổi lại, Trắng có tốt e4 và mã c3 kiểm soát trung tâm tốt hơn, còn Đen mới chỉ phát triển đúng một mã (dù đã đi ba lần) và chưa động đến tượng hay nhập thành. Nhưng đó chỉ là tiềm năng — chưa có đường mở nào nhắm vào vua Đen, chưa có quân nào bị ghim hay bị đe doạ, và Đen hoàn toàn có thể bắt kịp phát triển ở những nước tiếp theo. Một tốt sạch cộng với một khoảng cách phát triển chưa gây ra hậu quả gì là bức tranh trung thực nhất ở đây.
              en: Black is a clean pawn up — the c4 pawn taken on move four and never recovered, with the knight now safely home on b6. In return, White's e4 pawn and c3 knight hold the centre better, and Black has developed only one piece so far (even after three of its moves) with the bishops and castling still to come. But that is only potential — no line is open toward the black king, nothing is pinned or under threat, and Black can perfectly well catch up on development over the next few moves. A clean pawn plus a development gap that has not yet caused any actual damage is the honest picture here.
              fr: Les Noirs ont un pion net d'avance — le pion c4 pris au quatrième coup et jamais repris, le cavalier étant désormais en sécurité en b6. En échange, le pion e4 et le cavalier c3 blancs tiennent mieux le centre, et les Noirs n'ont développé qu'une seule pièce jusqu'ici (même après trois de ses coups), les fous et le roque restant à venir. Mais ce n'est qu'un potentiel — aucune ligne n'est ouverte vers le roi noir, rien n'est cloué ni menacé, et les Noirs peuvent parfaitement rattraper leur développement dans les coups suivants. Un pion net plus un retard de développement qui n'a encore causé aucun dommage réel, voilà le tableau honnête ici.
            plan:
              vi: Trắng chơi Nf3, Bc4 hoặc Be2, O-O và Re1, cố dùng lợi thế phát triển để gây sức ép trước khi Đen kịp hoàn thiện, và có thể nhắm vào con mã b6 hơi lệch bằng a4-a5 sau này. Đen chơi e6 hoặc g6 để đưa tượng ra, d6 nếu cần, rồi O-O, và chỉ cần hoàn thiện phát triển an toàn để con tốt thừa bắt đầu có ý nghĩa về sau — không có gì bắt buộc phải phòng thủ ngay lập tức.
              en: White plays Nf3, Bc4 or Be2, castles and Re1, trying to use the development edge for pressure before Black finishes catching up, and may later aim at the slightly offside b6 knight with a4-a5. Black plays ...e6 or ...g6 to bring out the bishop, ...d6 if needed, then castles, and only needs to finish development safely for the extra pawn to start counting later — there is nothing urgent to defend against yet.
              fr: Les Blancs jouent Nf3, Bc4 ou Be2, roquent et Re1, tentant d'exploiter leur avance de développement pour faire pression avant que les Noirs ne rattrapent leur retard, et peuvent viser plus tard le cavalier b6 légèrement excentré par a4-a5. Les Noirs jouent ...e6 ou ...g6 pour sortir le fou, ...d6 si nécessaire, puis roquent, et n'ont qu'à achever leur développement en sécurité pour que le pion supplémentaire commence à compter plus tard — rien d'urgent à défendre pour l'instant.
            basis:
              by: chan
              at: '2026-09-18'
