id: grunfeld-defense-brinckmann-attack-grunfeld-gambit-accepted
name: 'Grünfeld Defense: Brinckmann Attack, Grünfeld Gambit Accepted'
eco: D84
category: gambit
side: black
definingLine: [d4, Nf6, c4, g6, Nc3, d5, Bf4, Bg7, e3, O-O, cxd5, Nxd5, Nxd5, Qxd5]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. Black hands back the sacrificed centre pawn to draw White's queen's rook's
      pawn forward and win time on a queen that will be chased again, and the resulting
      structure has never been shown bad for either side. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen vừa ăn lại quân bằng hậu trên d5, sau một loạt đổi mã ở trung tâm. Con hậu ấy đứng khá lộ liễu ngay giữa bàn cờ.
    en: Black has just recaptured with the queen on d5, after a run of knight trades in the centre. That queen stands rather exposed right in the middle of the board.
    fr: Les Noirs viennent de reprendre avec la dame en d5, après une série d'échanges de cavaliers au centre. Cette dame se tient plutôt exposée au beau milieu de l'échiquier.
  dismissRest:
    reason:
      vi: Trắng không ăn tốt c7 ngay — phát triển bằng 9.Nf3 hay 9.Rc1 trước, để con tốt c7 lại cho sau. Mỗi lựa chọn để nguyên con tốt c7 trên bàn cờ, nghĩa là lời mời vẫn chưa hề được nhận.
      en: White does not take the c7 pawn at once — developing with 9.Nf3 or 9.Rc1 first, leaving the c7 pawn for later. Each leaves the c7 pawn sitting on the board, meaning the invitation has still not actually been accepted.
      fr: Les Blancs ne prennent pas aussitôt le pion c7 — développant par 9.Cf3 ou 9.Rc1 d'abord, laissant le pion c7 pour plus tard. Chacun laisse le pion c7 sur l'échiquier, ce qui veut dire que l'invitation n'a toujours pas été acceptée.
  children:
    - ply: Bxc7
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng ăn thẳng tốt c7 bằng tượng, quân duy nhất có thể ăn tại đó vì nó không được ai đỡ sau khi con hậu Đen vừa rời cột d.
        en: White grabs the c7 pawn directly with the bishop, the only piece that can capture there since nothing defends it now that Black's queen has just left the d-file behind it.
        fr: Les Blancs ramassent directement le pion c7 avec le fou, la seule pièce pouvant capturer là puisque rien ne le défend, la dame noire ayant quitté la colonne d juste derrière lui.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng bảy, Đen sáu — Trắng hơn đúng một tốt. Nhưng con tượng vừa ăn ở c7 đứng khá xa nơi phần còn lại của quân Trắng, và Đen sắp có nhịp để đuổi cả hậu lẫn tượng cùng lúc.
          en: Count the pawns and it is seven for White, six for Black — White is exactly one pawn up. But the bishop that just captured on c7 stands well away from the rest of White's army, and Black is about to get a tempo to chase both the queen and that bishop at once.
          fr: Comptez les pions, sept pour les Blancs, six pour les Noirs — les Blancs ont exactement un pion de plus. Mais le fou qui vient de prendre en c7 se tient loin du reste de l'armée blanche, et les Noirs vont bientôt gagner un temps pour chasser à la fois la dame et ce fou.
        plan:
          vi: Trắng chơi Nf3 rồi Be2 và O-O, cố đưa quân về an toàn trước khi Đen kịp tổ chức phản công quanh con tượng lạc lõng ở c7. Đen chơi Nc6 hay Qa5 đuổi cả hậu và tượng cùng lúc, rồi Rd8 và e5, tận dụng nhịp phát triển để bù cho con tốt đã mất.
          en: White plays Nf3 then Be2 and O-O, trying to get the pieces to safety before Black can organise counterplay around the stray bishop on c7. Black plays Nc6 or Qa5, chasing both the queen and the bishop at once, then Rd8 and e5, using the development tempo to make up for the lost pawn.
          fr: Les Blancs jouent Nf3 puis Be2 et O-O, essayant de mettre les pièces à l'abri avant que les Noirs n'organisent un contre-jeu autour du fou égaré en c7. Les Noirs jouent Nc6 ou Qa5, chassant à la fois la dame et le fou, puis Rd8 et e5, utilisant le temps de développement pour compenser le pion perdu.
        basis:
          by: chan
          at: '2026-09-25'
