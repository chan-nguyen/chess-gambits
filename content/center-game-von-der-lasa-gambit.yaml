# Center Game: von der Lasa Gambit. Frozen defining line 1.e4 e5 2.d4 exd4 3.Bc4, which ends
# on White's own ply, so the root is an opponent node (docs/CONTEXT.md, invariant 5).
# Replayed with chess.js through 3...Nc6: Black develops and holds onto the extra pawn
# rather than rushing to defend it further. Nothing is hanging at the resulting position.
# searchMate at 4 moves from this position returns no-mate, so no forced mate is claimed
# anywhere in this entry.
id: center-game-von-der-lasa-gambit
name: 'Center Game: von der Lasa Gambit'
eco: C21
category: gambit
side: white
definingLine: [e4, e5, d4, exd4, Bc4]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. Aiming the bishop at f7 before recapturing the pawn is a real practical
      idea, but it leaves d4 uncollected for a while and Black's simplest reply holds
      everything together. No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Thay vì ăn lại ngay bằng 3.Qxd4 theo lối Center Game thông thường, Trắng chơi 3.Bc4, nhắm thẳng vào f7 trước và để dành việc đòi lại con tốt d4 cho sau này.
    en: Instead of recapturing at once with 3.Qxd4, the usual Center Game way, White plays 3.Bc4, aiming straight at f7 first and saving the recapture on d4 for later.
    fr: Au lieu de reprendre tout de suite par 3.Qxd4, comme dans le Center Game habituel, les Blancs jouent 3.Bc4, visant d'abord directement f7 et gardant la reprise en d4 pour plus tard.
  dismissRest:
    reason:
      vi: Đen không phát triển bằng 3...Nc6. Các nước như Nf6 hay Qh4 cũng giữ được con tốt thừa nhưng theo cách khác, còn con tốt d4 vẫn chưa ai đỡ thêm.
      en: Black does not develop with 3...Nc6. Moves such as ...Nf6 or ...Qh4 also keep the extra pawn but in a different way, and the d4 pawn still has no extra defender.
      fr: Les Noirs ne développent pas par 3...Nc6. Des coups comme ...Nf6 ou ...Qh4 gardent eux aussi le pion supplémentaire mais d'une autre façon, et le pion d4 n'a toujours pas de défenseur supplémentaire.
  children:
    - ply: Nc6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen phát triển mã tự nhiên và giữ vững con tốt thừa, chưa cần vội vàng làm gì thêm vì chưa quân Trắng nào đe dọa được nó.
        en: Black develops the knight naturally and simply keeps the extra pawn, with no need to do anything more urgent yet since no white piece threatens it.
        fr: Les Noirs développent naturellement le cavalier et gardent simplement le pion supplémentaire, sans rien devoir faire de plus urgent puisqu'aucune pièce blanche ne le menace.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy, Đen hơn đúng một tốt sạch và con tốt ấy chưa hề bị đe dọa. Tượng c4 của Trắng đã nhắm vào f7 nhưng chưa có quân nào hỗ trợ thêm, còn Đen thì đã phát triển được một quân mà chưa phải nhượng bộ gì.
          en: Count the pawns and it is eight for Black, seven for White — Black is a clean pawn up and that pawn is not under any threat. White's bishop on c4 already aims at f7 but has no support yet, while Black has already developed a piece without conceding anything.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs — les Noirs ont un pion net d'avance et ce pion n'est sous aucune menace. Le fou blanc en c4 vise déjà f7 mais n'a encore aucun soutien, tandis que les Noirs ont déjà développé une pièce sans avoir rien concédé.
        plan:
          vi: Trắng chơi Qh5 hay Nf3, cố tạo áp lực cụ thể lên f7 và đòi lại con tốt d4 trước khi Đen kịp củng cố hoàn toàn. Đen chơi Nf6 hay g6, hoàn tất phát triển một cách chắc chắn và giữ vững con tốt thừa vào tàn cuộc.
          en: White plays Qh5 or Nf3, trying to create concrete pressure on f7 and win the d4 pawn back before Black fully consolidates. Black plays ...Nf6 or ...g6, completing development soundly and holding the extra pawn for the endgame.
          fr: Les Blancs jouent Qh5 ou Nf3, cherchant à créer une pression concrète sur f7 et à reprendre le pion d4 avant que les Noirs ne consolident complètement. Les Noirs jouent ...Nf6 ou ...g6, achevant leur développement solidement et gardant le pion supplémentaire pour la finale.
        basis:
          by: chan
          at: '2026-09-25'
