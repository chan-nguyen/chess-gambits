    vi: 'Trắng vừa chơi 4.Nc3, tấn công hậu d5. Số tốt hai bên bằng nhau, mỗi bên bảy, và tốt d4 của Trắng bị hậu và mã c6 tấn công mà chỉ có hậu d1 bảo vệ.'
    en: "White has just played 4.Nc3, attacking the queen on d5. The pawns are level, seven each, and White's pawn on d4 is attacked by the queen and the knight on c6 and defended only by the queen on d1."
    fr: 'Les Blancs viennent de jouer 4.Nc3, attaquant la dame d5. Les pions sont à égalité, sept de chaque côté, et le pion d4 blanc est attaqué par la dame et le cavalier c6 et défendu seulement par la dame d1.'
  dismissRest:
