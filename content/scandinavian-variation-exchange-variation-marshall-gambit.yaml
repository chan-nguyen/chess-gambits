          en: 'White attacks the queen with Be3, then develops with Nf3 and Bd3. Black moves the queen away with ...Qb4.'
          fr: 'Les Blancs attaquent la dame par Be3, puis se développent par Nf3 et Bd3. Les Noirs écartent la dame par ...Qb4.'
