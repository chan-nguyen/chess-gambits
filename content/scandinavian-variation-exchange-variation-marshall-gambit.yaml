      frequency: 'common'
      annotation:
        vi: 'Đen ăn tốt d4 bằng hậu. Hậu bị hậu d1 tấn công và được mã c6 bảo vệ, và nó tấn công mã c3 cùng tốt f2.'
        en: 'Black takes the pawn on d4 with the queen. The queen is attacked by the queen on d1 and defended by the knight on c6, and it attacks the knight on c3 and the pawn on f2.'
        fr: 'Les Noirs prennent le pion d4 avec la dame. La dame est attaquée par la dame d1 et défendue par le cavalier c6, et elle attaque le cavalier c3 et le pion f2.'
      outcome:
        type: 'position'
        evaluation:
          vi: 'Đếm tốt: Trắng sáu, Đen bảy, nên Trắng kém một tốt. Cột d đã mở và hậu Đen đang đứng trên đó, bị hậu d1 tấn công và chỉ có mã c6 bảo vệ. Trắng mới phát triển mã c3; Đen đã đưa ra hậu và mã c6, còn hai tượng và mã g8 vẫn ở nhà. Qxd4 Nxd4 sẽ đổi hậu và để Trắng kém một tốt.'
          en: "Count the pawns: White six, Black seven, so White is a pawn down. The d-file is open and Black's queen stands on it, attacked by the queen on d1 and defended only by the knight on c6. White has developed the knight on c3; Black has the queen and the knight on c6 out, and both bishops and the knight on g8 are still at home. Qxd4 Nxd4 would trade the queens and leave White a pawn down."
          fr: "Comptez les pions : six pour les Blancs, sept pour les Noirs, donc les Blancs ont un pion de moins. La colonne d est ouverte et la dame noire s'y trouve, attaquée par la dame d1 et défendue seulement par le cavalier c6. Les Blancs ont développé le cavalier c3 ; les Noirs ont sorti la dame et le cavalier c6, et les deux fous et le cavalier g8 sont encore à la maison. Qxd4 Nxd4 échangerait les dames et laisserait les Blancs avec un pion de moins."
        plan:
