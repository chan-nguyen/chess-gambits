      vi: 'Đen chơi nước khác 4...Qxd4 ở đây. Mục này đi theo nước hậu ăn tốt d4, thứ mà gambit của Trắng dâng ra.'
      en: "Black plays something other than 4...Qxd4 here. This entry follows the queen taking the pawn on d4, which White's gambit offers."
      fr: 'Les Noirs jouent autre chose que 4...Qxd4 ici. Cette entrée suit la dame qui prend le pion d4, ce que le gambit des Blancs offre.'
