tree:
  annotation:
    vi: Trắng vừa ăn lại bằng 5.fxe4, nên mỗi bên có bảy tốt và Trắng có tốt ở cả d4 lẫn e4. Tốt e4 bị mã f6 tấn công và được mã c3 bảo vệ.
    en: White has just recaptured with 5.fxe4, so each side has seven pawns and White has pawns on both d4 and e4. The pawn on e4 is attacked by the knight on f6 and defended by the knight on c3.
    fr: 'Les Blancs viennent de reprendre par 5.fxe4 : chaque camp a donc sept pions et les Blancs ont des pions en d4 et en e4. Le pion e4 est attaqué par le cavalier f6 et défendu par le cavalier c3.'
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 5...Bb4. Bài này chỉ đi theo nhánh ghim mã 5...Bb4; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 5...Bb4 here. This entry follows the pinning reply 5...Bb4 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 5...Bb4. Cette fiche ne suit que la réponse 5...Bb4, qui cloue ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Bb4
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen ghim mã c3 vào vua bằng 5...Bb4, nên con mã không còn bảo vệ được tốt e4 trên thực tế.
        en: Black pins the knight on c3 against the king with 5...Bb4, so the knight can no longer defend the pawn on e4 in practice.
        fr: 'Les Noirs clouent le cavalier c3 sur le roi par 5...Bb4 : le cavalier ne peut donc plus, en pratique, défendre le pion e4.'
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: mỗi bên bảy tốt, nên vật chất cân bằng. Mã c3 bị tượng b4 ghim vào vua e1, còn tốt e4 bị mã f6 tấn công và chỉ có chính con mã bị ghim đó bảo vệ, nên Trắng phải bảo vệ e4 bằng cách khác.'
          en: 'Count the pawns: seven each, so material is level. The knight on c3 is pinned against the king on e1 by the bishop on b4, and the pawn on e4 is attacked by the knight on f6 and defended only by that pinned knight, so White has to protect e4 some other way.'
          fr: 'Comptez les pions : sept de chaque côté, donc le matériel est égal. Le cavalier c3 est cloué sur le roi e1 par le fou b4, et le pion e4 est attaqué par le cavalier f6 et défendu seulement par ce cavalier cloué : les Blancs doivent protéger e4 autrement.'
        plan:
          vi: Trắng bảo vệ e4 bằng Bd3 hoặc Qd3, hoặc phá thế ghim bằng Bd2. Đen đe dọa ...Nxe4 và có thể đánh vào d4 bằng ...c5.
          en: White protects e4 with Bd3 or Qd3, or breaks the pin with Bd2. Black threatens ...Nxe4 and can strike at d4 with ...c5.
          fr: Les Blancs protègent e4 par Bd3 ou Qd3, ou brisent le clouage par Bd2. Les Noirs menacent ...Nxe4 et peuvent attaquer d4 par ...c5.
        basis:
          by: chan
          at: '2026-09-30'
