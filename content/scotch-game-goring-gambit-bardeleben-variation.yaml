tree:
  annotation:
    vi: Trắng đổi thứ tự nước đi so với biến chính, phát triển Bc4 trước khi ăn lại tốt c3 bằng mã —
      cùng ý tưởng thí hai tốt lấy phát triển và trung tâm thoáng.
    en:
      White swaps the move order compared with the main line, developing Bc4 before recapturing the c3
      pawn with the knight — the same idea of trading two pawns for development and an open centre.
    fr:
      Les Blancs inversent l'ordre des coups par rapport à la ligne principale, développant Bc4 avant
      de reprendre le pion c3 avec le cavalier — la même idée d'échanger deux pions contre le
      développement et un centre ouvert.
  dismissRest:
    reason:
      vi:
        Đen chơi nước khác ngoài Bb4, ví dụ d6 hay Nf6 luôn. Đánh giá chung — Trắng kém hai tốt nhưng có
        phát triển và trung tâm bù lại — không đổi nhiều.
      en:
        Black plays something other than Bb4, for instance d6 or Nf6 right away. The overall assessment
        — White down two pawns but compensated by development and the centre — does not change much.
      fr:
        Les Noirs jouent autre chose que Bb4, par exemple d6 ou Nf6 directement. L'évaluation générale —
        les Blancs à deux pions de moins mais compensés par le développement et le centre — ne
        change guère.
  children:
    - ply: Bb4
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen ghim mã c3 bằng Bb4, giống ý tưởng chính của Göring Gambit dù Trắng đã đổi thứ tự nước đi.
        en:
          Black pins the knight on c3 with Bb4, the same core idea as the main Göring Gambit even though
          White has swapped the move order.
        fr:
          Les Noirs clouent le cavalier c3 avec Bb4, la même idée centrale que le Gambit Göring principal,
          malgré l'inversion de l'ordre des coups blancs.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt, Trắng 6 còn Đen 7 — Đen hơn đúng một tốt sạch.
          en: Count the pawns and it is 6 for White against 7 for Black — Black is up one clean pawn.
          fr:
            "Comptez les pions : 6 pour les Blancs contre 7 pour les Noirs — les Noirs sont en avance d'un
            pion net."
        plan:
          vi:
            Trắng đã nhập cuộc với Bc4 trước rồi mới ăn lại tốt, và giờ chơi O-O, tranh thủ nhịp độ để bù
            cho hai tốt đã mất. Đen chơi d6 hoặc Ne5 đổi bớt áp lực, tìm cách giữ vững con tốt thừa
            qua giai đoạn khai cuộc.
          en:
            White has already brought the bishop to c4 before recapturing, and now plays O-O, using the
            extra tempo as compensation for the two missing pawns. Black plays d6 or Ne5 to trade
            off some pressure, trying to hold on to the extra pawns through the opening.
          fr:
            Les Blancs ont déjà amené le fou en c4 avant de reprendre le pion, et jouent maintenant O-O,
            utilisant le temps gagné en compensation des deux pions manquants. Les Noirs jouent d6
            ou Ne5 pour échanger une partie de la pression, cherchant à conserver les pions
            supplémentaires pendant l'ouverture.
        basis:
          by: chan
          at: 2026-09-29
