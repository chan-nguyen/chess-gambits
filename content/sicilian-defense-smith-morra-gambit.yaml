# The Smith-Morra Gambit. Frozen defining line 1.e4 c5 2.d4, which ends on White's own ply,
# so the root is an opponent node (docs/CONTEXT.md, invariant 5).
#
# No mate is claimed anywhere. The Morra is a development gambit and its famous trap — the
# Siberian, ...Qc7 and ...Nd4 — wins the queen rather than mating, so it is described in a
# plan and not asserted as a forced line.
id: sicilian-defense-smith-morra-gambit
name: 'Sicilian Defense: Smith-Morra Gambit'
eco: B21
category: gambit
side: white
definingLine: [e4, c5, d4]
soundness:
  value: dubious
  reviewedAt: '2026-09-17'
  basis:
    by: chan
    at: '2026-09-17'
    source: >-
      A judgement, and the same label the catalogue's family rule carries. Black has
      several ways to reach a sound extra pawn — the Chicago and Siberian set-ups, or
      simply returning the pawn with 3...d3 — so the gambit does not hold against a
      prepared opponent. Against an unprepared one it is among the most effective openings
      in club chess, which is why it is taught rather than dismissed. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-17'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng đẩy d4 ngay ở nước thứ hai. Nếu Đen ăn thì Trắng sẽ chơi c3 và mời thêm một con tốt nữa, để đổi lấy hai cột nửa mở c và d cùng một thế trận phát triển rất nhanh. Người chơi Sicily quen với việc Trắng chơi Nf3 rồi mới d4, nên nước này tự nó đã là một bất ngờ.
    en: White plays d4 on move two. If Black takes, White follows with c3 and offers a second pawn, in exchange for the half-open c- and d-files and a very fast development scheme. Sicilian players expect Nf3 before d4, so the move order alone is already a surprise.
    fr: Les Blancs jouent d4 dès le deuxième coup. Si les Noirs prennent, les Blancs enchaînent c3 et offrent un second pion, contre les colonnes c et d semi-ouvertes et un schéma de développement très rapide. Les joueurs de sicilienne attendent Nf3 avant d4, si bien que l'ordre de coups est à lui seul une surprise.
  dismissRest:
    reason:
      vi: Đen không ăn ở d4 và cũng không chơi d6. Trắng không bắt buộc phải thí gì cả, con tốt d4 giữ được bằng Nf3 và c3 theo nhịp của Trắng, và ván cờ trở lại thành Sicily bình thường. Nước 2...c4 thì đơn giản là mất tốt sau Bxc4. Nước 2...Qa5+ có vẻ khó chịu nhưng Trắng chỉ việc chắn bằng Nc3 hay Bd2 rồi đuổi con hậu sau đó. Không nước nào ở đây bác bỏ gambit, chúng chỉ tránh nó.
      en: Black neither takes on d4 nor plays ...d6. White is under no obligation to sacrifice anything — the d4 pawn can be held with Nf3 and c3 in White's own time and the game returns to ordinary Sicilian paths. 2...c4 simply drops a pawn to Bxc4. 2...Qa5+ looks annoying but White just blocks with Nc3 or Bd2 and chases the queen later. Nothing here refutes the gambit; these moves avoid it.
      fr: Les Noirs ne prennent pas en d4 et ne jouent pas ...d6. Les Blancs ne sont tenus à aucun sacrifice, le pion d4 se garde par Nf3 et c3 au rythme des Blancs et la partie revient à une sicilienne ordinaire. 2...c4 perd simplement un pion après Bxc4. 2...Qa5+ semble gênant, mais les Blancs bloquent par Nc3 ou Bd2 et chassent la dame plus tard. Rien ici ne réfute le gambit, ces coups l'évitent.
  children:
    - ply: cxd4
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen ăn, đúng như bình thường. Đây không phải sai lầm, đây là nước mà mọi người chơi Sicily sẽ chơi, và nó là điểm bắt đầu thật sự của gambit.
        en: Black takes, as one normally would. This is not a mistake — it is what every Sicilian player plays, and it is where the gambit actually begins.
        fr: Les Noirs prennent, comme il est normal. Ce n'est pas une faute, c'est ce que joue tout joueur de sicilienne, et c'est là que le gambit commence réellement.
      children:
        - ply: c3
          annotation:
            vi: Đây là Gambit Smith-Morra. Trắng mời con tốt thứ hai để lấy cột c. Nếu Đen ăn thì mã Trắng vào c3 và con tốt c bay mất, cột c mở thẳng tới c7, còn cột d thì mở sẵn từ trước. Trắng sẽ dựng đúng một thế trận giống nhau trong hầu hết các nhánh, đó là Nc3, Nf3, Bc4, O-O, Qe2, Rfd1 và Rac1.
            en: This is the Smith-Morra. White offers the second pawn for the c-file. If Black takes, the knight comes to c3, White's c-pawn is gone and the c-file runs straight to c7, while the d-file is already open. White builds the same set-up in almost every line — Nc3, Nf3, Bc4, O-O, Qe2, rooks to d1 and c1.
            fr: Voici le Smith-Morra. Les Blancs offrent le second pion pour la colonne c. Si les Noirs prennent, le cavalier va en c3, le pion c blanc disparaît et la colonne c file droit sur c7, tandis que la colonne d est déjà ouverte. Les Blancs construisent presque toujours le même dispositif — Nc3, Nf3, Bc4, O-O, Qe2, tours en d1 et c1.
          dismissRest:
            reason:
              vi: Đen từ chối theo một cách khác và tạm giữ con tốt d4. Nước 3...d5 4.exd5 Qxd5 5.cxd4 trả trung tâm lại cho Trắng và Nc3 sẽ đuổi con hậu ngay sau đó. Các nước 3...e5 và 3...Qa5 giữ được tốt thêm một lúc nhưng để Đen chậm phát triển. Còn 3...Nc6, 3...e6 hay 3...d6 thì phần lớn chỉ là đổi thứ tự nước đi, vì Đen vẫn sẽ ăn ở c3 một nước sau. Trong mọi trường hợp Trắng lấy lại ở c3 hoặc d4 và vẫn có đúng hai cột nửa mở mà gambit cần.
              en: Black declines in another way and hangs on to the d4 pawn for now. 3...d5 4.exd5 Qxd5 5.cxd4 gives White the centre back and Nc3 will hit the queen next. 3...e5 and 3...Qa5 keep the pawn a little longer at the cost of Black's development. 3...Nc6, 3...e6 and 3...d6 are mostly move-order, because Black still takes on c3 a move later. In every case White recaptures on c3 or d4 and still has the two half-open files the gambit is played for.
              fr: Les Noirs refusent autrement et conservent pour l'instant le pion d4. 3...d5 4.exd5 Qxd5 5.cxd4 rend le centre aux Blancs et Nc3 frappera la dame ensuite. 3...e5 et 3...Qa5 gardent le pion un peu plus longtemps au prix du développement noir. 3...Nc6, 3...e6 et 3...d6 relèvent surtout de l'ordre des coups, car les Noirs prendront en c3 un coup plus tard. Dans tous les cas les Blancs reprennent en c3 ou en d4 et disposent toujours des deux colonnes semi-ouvertes pour lesquelles le gambit se joue.
          children:
            - ply: dxc3
              replyQuality: good
              frequency: common
              annotation:
                vi: Đen nhận con tốt thứ hai. Đây là Gambit Smith-Morra được chấp nhận, và cũng là nhánh chiếm phần lớn các ván cờ thật.
                en: Black accepts the second pawn. This is the Smith-Morra Accepted, and it is the branch most real games go down.
                fr: Les Noirs acceptent le second pion. C'est le Smith-Morra accepté, et c'est la branche que suivent la plupart des parties réelles.
              children:
                - ply: Nxc3
                  annotation:
                    vi: Lấy lại bằng mã chứ không bằng tốt. Mã ra c3 là một nhịp phát triển, và quan trọng hơn là cột c của Trắng bây giờ trống hoàn toàn. Trắng kém một tốt và có đổi lại ba nhịp phát triển cùng hai cột.
                    en: Recapture with the knight, not the pawn. Nc3 is a developing move, and more to the point White's c-file is now completely empty. White is one pawn down for three tempi and two files.
                    fr: Reprendre du cavalier, non du pion. Nc3 est un coup de développement et, plus important encore, la colonne c blanche est désormais entièrement dégagée. Les Blancs ont un pion de moins contre trois temps et deux colonnes.
                  counts:
                    legal: { count: legalReplies, expect: 21 }
                  dismissRest:
                    reason:
                      vi: Đen có {legal} nước đáp hợp lệ ở đây và Trắng xếp quân giống nhau trước gần hết. Nf3, Bc4, O-O, Qe2, rồi Rfd1 và Rac1. Các nước ...e6, ...d6, ...a6 và ...Nf6 đều dẫn về cùng một kiểu thế và thường chỉ đổi thứ tự. Nước ...e5 bịt cột d nhưng để lại ô d5 vĩnh viễn cho mã Trắng. Nước ...d5 phản công ngay giữa bàn là cách từ chối lành nhất, exd5 rồi Qxd5 và Đen trả lại tốt để hết bị ép. Không nước nào trong nhóm này ăn thêm được gì, và ăn thêm là đúng thứ Trắng muốn Đen làm.
                      en: Black has {legal} legal answers here and White sets up the same way against nearly all of them — Nf3, Bc4, castle, Qe2, then rooks to d1 and c1. ...e6, ...d6, ...a6 and ...Nf6 all lead to the same kind of position and usually only change the move order. ...e5 shuts the d-file but concedes the d5 square to a white knight for good. ...d5, hitting back in the centre at once, is the healthiest way to decline — exd5 and ...Qxd5 give the pawn back and end the pressure. None of these moves wins more material, and winning more material is exactly what White wants Black to try.
                      fr: Les Noirs disposent de {legal} réponses légales et les Blancs se déploient de la même façon contre presque toutes — Nf3, Bc4, roque, Qe2, puis les tours en d1 et c1. ...e6, ...d6, ...a6 et ...Nf6 mènent au même type de position et ne changent en général que l'ordre des coups. ...e5 ferme la colonne d mais concède définitivement la case d5 à un cavalier blanc. ...d5, qui contre-attaque aussitôt au centre, est la façon la plus saine de refuser — exd5 et ...Qxd5 rendent le pion et mettent fin à la pression. Aucun de ces coups ne gagne davantage de matériel, et gagner davantage de matériel est précisément ce que les Blancs veulent voir.
                  children:
                    - ply: Nc6
                      replyQuality: best
                      frequency: common
                      annotation:
                        vi: Đen phát triển và giữ ô d4. Đây là nước tự nhiên nhất và cũng là nước đúng. Mã c6 chặn cột c của Trắng ở một mức nào đó và chuẩn bị ...d6 cùng ...Nf6.
                        en: Black develops and takes the d4 square. It is the most natural move and it is also the right one. The knight on c6 gets in the way of White's c-file to some degree and prepares ...d6 and ...Nf6.
                        fr: Les Noirs développent et prennent la case d4. C'est le coup le plus naturel et c'est aussi le bon. Le cavalier c6 gêne dans une certaine mesure la colonne c blanche et prépare ...d6 et ...Nf6.
                      children:
                        - ply: Nf3
                          annotation:
                            vi: Trắng phát triển theo thứ tự đúng. Mã f3 giữ d4 và e5, và nó ra trước tượng để Trắng còn được chọn ô cho tượng sau khi biết Đen làm gì.
                            en: White develops in the right order. The knight on f3 holds d4 and e5, and it comes out before the bishop so that White still gets to choose the bishop's square once Black has shown a plan.
                            fr: Les Blancs développent dans le bon ordre. Le cavalier f3 tient d4 et e5, et il sort avant le fou pour que les Blancs choisissent encore la case du fou une fois le plan noir dévoilé.
                          dismissRest:
                            reason:
                              vi: Đen chơi một nước khác. Điều đó không đổi được gì vì kế hoạch của Trắng không phụ thuộc vào nước cụ thể của Đen. Bc4, O-O, Qe2, Rfd1 và Rac1 vẫn thế. Nước ...e5 lấy mất ô d4 của mã nhưng cho Trắng ô d5 mãi mãi. Nước ...Nf6 đánh vào e4 thì Trắng đáp e5 hoặc Bd3 và tiếp tục. Nước ...d5 vẫn là cách trả tốt để thoát. Điều Trắng sợ duy nhất là Đen đổi hết quân, nên mỗi nước Đen không đổi được quân nào là một nước Trắng hài lòng.
                              en: Black plays something else. It changes little, because White's plan does not depend on which move that is — Bc4, castle, Qe2, then rooks to d1 and c1. ...e5 takes d4 away from the knight but hands White the d5 square for good. ...Nf6 hits e4 and is met by e5 or Bd3 and White carries on. ...d5 is still the way to give the pawn back and get out. The only thing White fears is a general exchange of pieces, so every move that trades nothing is a move White is content to see.
                              fr: Les Noirs jouent autre chose. Cela ne change pas grand-chose, car le plan blanc ne dépend pas du coup choisi — Bc4, roque, Qe2, puis les tours en d1 et c1. ...e5 retire d4 au cavalier mais offre définitivement la case d5 aux Blancs. ...Nf6 attaque e4 et se traite par e5 ou Bd3, et les Blancs continuent. ...d5 reste le moyen de rendre le pion et de s'en sortir. La seule chose que craignent les Blancs est un échange général des pièces, si bien que chaque coup qui n'échange rien leur convient.
                          children:
                            - ply: d6
                              replyQuality: best
                              frequency: common
                              annotation:
                                vi: Đen đóng ô e5 và mở đường cho tượng c8. Nước này gần như bắt buộc, và nó cũng chính là nước tạo ra điểm yếu lâu dài mà cả gambit nhắm vào, đó là con tốt d6 lùi lại trên cột d nửa mở.
                                en: Black shuts the e5 square and opens a path for the c8 bishop. It is close to necessary, and it is also the move that creates the long-term weakness the whole gambit is aimed at — a backward d6 pawn on a half-open file.
                                fr: Les Noirs ferment la case e5 et dégagent le fou c8. C'est presque obligatoire, et c'est aussi le coup qui crée la faiblesse durable que vise tout le gambit — un pion d6 arriéré sur une colonne semi-ouverte.
                              children:
                                - ply: Bc4
                                  annotation:
                                    vi: Tượng vào đường chéo a2-g8, nhắm f7 và cản ...d5 mãi mãi. Chừng nào tượng còn đứng ở c4 thì nước giải thoát ...d5 của Đen còn mất một tốt.
                                    en: The bishop takes the a2-g8 diagonal, aims at f7 and rules out ...d5 for good. While the bishop stands on c4, Black's freeing ...d5 costs a pawn.
                                    fr: Le fou prend la diagonale a2-g8, vise f7 et interdit ...d5 pour de bon. Tant que le fou se tient en c4, la libération ...d5 coûte un pion aux Noirs.
                                  dismissRest:
                                    reason:
                                      vi: Đen đi một nước khác trước khi chơi ...e6. Trắng cứ O-O, Qe2, Rfd1 và Rac1, và câu trả lời hầu như không đổi. Nước ...Nf6 để ngỏ f7 nên e5 hoặc Ng5 trở thành ý tưởng thật. Nước ...a6 chuẩn bị ...b5 đuổi tượng thì Trắng chơi a4 chặn lại. Nước ...Bg4 ghim mã thì Be3 hoặc h3 là đủ. Phải nhớ một điều, nếu Đen chơi ...Qc7 rồi ...Ng4 thì đừng chơi h3, vì ...Nd4 sau đó bắt hậu. Đó là bẫy Siberia và nó có thật.
                                      en: Black plays something before ...e6. White castles, plays Qe2 and brings rooks to d1 and c1, and the answer barely changes. ...Nf6 leaves f7 unguarded, so e5 and Ng5 become real ideas. ...a6 prepares ...b5 to chase the bishop and is met by a4. ...Bg4 pins the knight and Be3 or h3 is enough. One thing has to be remembered — if Black plays ...Qc7 and then ...Ng4, do not play h3, because ...Nd4 wins the queen. That is the Siberian Trap and it is real.
                                      fr: Les Noirs jouent autre chose avant ...e6. Les Blancs roquent, jouent Qe2 et amènent les tours en d1 et c1, et la réponse ne change guère. ...Nf6 laisse f7 sans garde, si bien que e5 et Ng5 deviennent de vraies idées. ...a6 prépare ...b5 pour chasser le fou et se traite par a4. ...Bg4 cloue le cavalier et Be3 ou h3 suffit. Une chose est à retenir — si les Noirs jouent ...Qc7 puis ...Ng4, ne jouez pas h3, car ...Nd4 gagne la dame. C'est le piège sibérien et il est bien réel.
                                  children:
                                    - ply: e6
                                      replyQuality: best
                                      frequency: common
                                      annotation:
                                        vi: Đen bịt đường chéo của tượng c4 và chuẩn bị ...Nf6 cùng ...Be7. Cái giá là ô d6 và ô d5 mềm đi, và con tượng c8 bị chính con tốt của mình chặn.
                                        en: Black blocks the c4 bishop's diagonal and prepares ...Nf6 and ...Be7. The price is that d6 and d5 go soft and the c8 bishop is shut in behind its own pawn.
                                        fr: Les Noirs bouchent la diagonale du fou c4 et préparent ...Nf6 et ...Be7. Le prix est que d6 et d5 s'amollissent et que le fou c8 reste enfermé derrière son propre pion.
                                      children:
                                        - ply: O-O
                                          annotation:
                                            vi: Trắng nhập thành và bộ khung đã xong. Đây là thế cờ mọi ván Smith-Morra nhắm tới, và từ đây hai con xe chỉ việc đi vào c1 và d1.
                                            en: White castles and the set-up is complete. This is the position every Smith-Morra is aiming at, and from here the rooks simply go to c1 and d1.
                                            fr: Les Blancs roquent et le dispositif est achevé. C'est la position que vise toute Smith-Morra, et à partir d'ici les tours n'ont plus qu'à rejoindre c1 et d1.
                                          outcome:
                                            type: position
                                            evaluation:
                                              vi: Đếm tốt thì Trắng sáu, Đen bảy. Trắng kém đúng con tốt c đã thí, và trên bàn cờ có ba thứ nhìn thấy được thay cho nó. Thứ nhất, không bên nào còn tốt ở cột c, nên cột c mở hoàn toàn, và nó sẽ là của Trắng. Cả hai con tượng hậu vẫn còn đứng ở c1 và c8 chắn đường xe, nhưng Trắng chỉ cần một nước Bf4, Bg5 hay Be3 là xe a1 vào được c1, trong khi con tượng c8 của Đen bị chính hai con tốt d6 và e6 nhốt lại, không có ô nào để đi. Thứ hai, Trắng không còn tốt d, Đen còn tốt d6, nên cột d nửa mở cho Trắng và con tốt d6 là quân đứng cuối cùng chắn nó, không có tốt nào đỡ được. Thứ ba, Trắng đã nhập thành xong còn vua Đen vẫn ở e8 với tượng f8 chưa ra. Thêm vào đó, tốt e6 vừa chơi đã nhốt tượng c8 lại. Đen hơn một tốt và thế cờ vẫn chơi được, nhưng mọi quân Trắng đều có ô sẵn còn Đen thì phải tìm.
                                              en: Count the pawns and it is six to seven. White is exactly the sacrificed c-pawn down, and three things stand on the board in its place. First, neither side has a pawn on the c-file, so the file is fully open, and it is going to be White who owns it. Both queen's bishops still stand on c1 and c8 in the rooks' way, but White clears the square in one move with Bf4, Bg5 or Be3 and follows with Rac1, while Black's bishop on c8 is shut in by its own pawns on d6 and e6 and has nowhere to go. Second, White has no d-pawn and Black has one on d6, so the d-file is half-open for White and that pawn is the last thing standing on it, with no pawn able to defend it. Third, White has castled while the black king is still on e8 with the f8 bishop at home. On top of that, the ...e6 just played has shut the c8 bishop in. Black is a pawn up and the position is playable, but every white piece has a square waiting for it and every black piece has to be found one.
                                              fr: Comptez les pions, six contre sept. Les Blancs ont exactement le pion c sacrifié de retard, et trois choses le remplacent sur l'échiquier. D'abord, aucun camp n'a de pion sur la colonne c, qui est donc entièrement ouverte, et ce sont les Blancs qui finiront par la posséder. Les deux fous de dame se tiennent encore en c1 et c8 devant les tours, mais les Blancs dégagent la case en un coup par Bf4, Bg5 ou Be3 et enchaînent par Rac1, tandis que le fou noir en c8 est enfermé par ses propres pions d6 et e6 et n'a aucune case. Ensuite, les Blancs n'ont plus de pion d et les Noirs en ont un en d6, si bien que la colonne d est semi-ouverte pour les Blancs et que ce pion est la dernière chose qui s'y tient, sans qu'aucun pion puisse le défendre. Enfin, les Blancs ont roqué alors que le roi noir est encore en e8 et le fou f8 à la maison. Par-dessus le marché, le ...e6 qui vient d'être joué enferme le fou c8. Les Noirs ont un pion de plus et la position est jouable, mais chaque pièce blanche a une case qui l'attend et chaque pièce noire doit s'en trouver une.
                                            plan:
                                              vi: Trắng chơi Qe2 giữ e4 rồi Rfd1 và Rac1, một xe ép d6 và một xe ép c7 hoặc c6. Sau đó Bf4 đánh thẳng vào d6, hoặc Bg5 ghim mã f6 nếu nó ra. Hai ô cần nhớ là d5 và b5, vì mã c3 nhảy vào đó mỗi khi Đen bỏ trống. Trắng không được đổi quân nặng, vì mỗi lần đổi là con tốt thừa của Đen lại gần tàn cuộc hơn. Đen chơi ...Nf6, ...Be7, ...O-O và ...a6 để cắt ô b5, rồi tìm cách đổi hậu và đổi xe trên cột c. Nước phá của Đen là ...d5 khi đã đủ quân đỡ, và ...b5 đuổi tượng c4 sau khi đã có ...a6. Ai xong việc trước thì thắng, Trắng cần khoảng mười nước, Đen cần đổi khoảng hai cặp quân nặng.
                                              en: White plays Qe2 to hold e4, then Rfd1 and Rac1, one rook pressing d6 and one pressing c7 or c6. Then Bf4 straight at d6, or Bg5 to pin the f6 knight once it appears. The two squares to remember are d5 and b5, because the c3 knight jumps into whichever Black leaves loose. White must not trade heavy pieces — every exchange brings Black's extra pawn a step closer to mattering. Black plays ...Nf6, ...Be7, ...O-O and ...a6 to take b5 away, then looks to trade queens and to trade rooks on the c-file. Black's breaks are ...d5 once enough pieces defend it, and ...b5 to chase the c4 bishop after ...a6. Whoever finishes first wins the argument — White needs roughly ten moves, Black needs to trade about two pairs of heavy pieces.
                                              fr: Les Blancs jouent Qe2 pour tenir e4, puis Rfd1 et Rac1, une tour pesant sur d6 et l'autre sur c7 ou c6. Vient ensuite Bf4 droit sur d6, ou Bg5 pour clouer le cavalier f6 dès qu'il paraît. Les deux cases à retenir sont d5 et b5, car le cavalier c3 saute dans celle que les Noirs laissent libre. Les Blancs ne doivent pas échanger les pièces lourdes — chaque échange rapproche le pion noir en plus du moment où il comptera. Les Noirs jouent ...Nf6, ...Be7, ...O-O et ...a6 pour retirer b5, puis cherchent à échanger les dames et les tours sur la colonne c. Leurs ruptures sont ...d5 une fois assez de pièces pour l'étayer, et ...b5 pour chasser le fou c4 après ...a6. Celui qui finit le premier a raison — il faut une dizaine de coups aux Blancs, et aux Noirs d'échanger environ deux paires de pièces lourdes.
                                            basis:
                                              by: chan
                                              at: '2026-09-17'
            - ply: d3
              replyQuality: good
              frequency: occasional
              annotation:
                vi: Đen đẩy con tốt đi tiếp thay vì ăn. Đây là cách từ chối gọn gàng nhất, gọi là biến Push. Đen trả lại con tốt ngay và không cho Trắng có cột c, đổi lại Trắng được một nhịp phát triển miễn phí.
                en: Black pushes the pawn on instead of taking. This is the tidiest way to decline, the Push Variation. Black gives the pawn straight back and denies White the c-file; in exchange White gets a free developing move.
                fr: Les Noirs poussent le pion au lieu de prendre. C'est la façon la plus nette de refuser, la variante Push. Les Noirs rendent le pion aussitôt et privent les Blancs de la colonne c ; en échange, les Blancs obtiennent un coup de développement gratuit.
              children:
                - ply: Bxd3
                  annotation:
                    vi: Trắng ăn bằng tượng. Con tượng đứng ngay ở d3, một ô rất tự nhiên, nên Trắng coi như đã phát triển miễn phí một quân. Cấu trúc tốt bây giờ là e4 và c3 của Trắng chống lại d7 và e7 của Đen, tức là gần giống biến Alapin.
                    en: White takes with the bishop. It lands on d3, a square it wanted anyway, so White has developed a piece for free. The structure is now White's e4 and c3 against Black's d7 and e7, which is close to an Alapin.
                    fr: Les Blancs prennent du fou. Il arrive en d3, une case qu'il visait de toute façon, si bien que les Blancs ont développé une pièce gratuitement. La structure oppose désormais e4 et c3 blancs à d7 et e7 noirs, ce qui ressemble fort à une Alapin.
                  outcome:
                    type: position
                    evaluation:
                      vi: Quân số ngang nhau và không còn gambit nào cả. Trắng có tượng ở d3, con tốt e4 và con tốt c3 giữ ô d4, tức là thêm một chút không gian và một nhịp phát triển. Đen hoàn toàn khoẻ mạnh và không có điểm yếu nào, chỉ là ván cờ không còn sắc như Sicily thường. Đây là kết quả tốt nhất mà Đen có thể đòi hỏi từ một nước đi duy nhất.
                      en: Material is level and there is no gambit left. White has the bishop on d3, a pawn on e4 and a pawn on c3 covering d4, which amounts to a little space and one tempo. Black is perfectly healthy with no weakness; the game is simply less sharp than a normal Sicilian. This is the best result Black can ask of a single move.
                      fr: Le matériel est égal et il n'y a plus de gambit. Les Blancs ont le fou en d3, un pion en e4 et un pion en c3 qui couvre d4, soit un peu d'espace et un temps. Les Noirs sont parfaitement sains, sans faiblesse ; la partie est simplement moins tranchante qu'une sicilienne ordinaire. C'est le meilleur résultat que les Noirs puissent tirer d'un seul coup.
                    plan:
                      vi: Trắng chơi Nf3, O-O, Qe2 hoặc Re1, Bc2 và Nbd2, rồi chuẩn bị đẩy e5 hoặc chơi Bf4 và Rad1. Kế hoạch là dùng không gian chứ không phải tấn công. Đen chơi Nc6, d6 hoặc g6, Nf6, Bg7 hoặc e6 với Be7 và O-O, rồi phá bằng d5 khi đã phát triển xong. Ai hiểu cấu trúc Alapin hơn thì bên đó chơi dễ hơn.
                      en: White plays Nf3, castles, Qe2 or Re1, Bc2 and Nbd2, and prepares e5 or Bf4 with Rad1. The plan is to use the space, not to attack. Black plays ...Nc6, ...d6 or ...g6, ...Nf6, ...Bg7 or ...e6 with ...Be7 and ...O-O, and breaks with ...d5 once developed. Whoever understands the Alapin structure better has the easier game.
                      fr: Les Blancs jouent Nf3, roquent, Qe2 ou Re1, Bc2 et Nbd2, et préparent e5 ou Bf4 avec Rad1. Le plan est d'exploiter l'espace, non d'attaquer. Les Noirs jouent ...Nc6, ...d6 ou ...g6, ...Nf6, ...Bg7 ou ...e6 avec ...Be7 et ...O-O, et cassent par ...d5 une fois développés. Celui qui comprend le mieux la structure Alapin a le jeu le plus facile.
                    basis:
                      by: chan
                      at: '2026-09-17'
            - ply: Nf6
              replyQuality: good
              frequency: occasional
              annotation:
                vi: Đen phát triển và đánh vào e4 thay vì ăn tốt. Đây là cách từ chối theo kiểu Alapin, và nó buộc Trắng phải làm gì đó với con tốt e4 ngay lập tức.
                en: Black develops and hits e4 instead of taking. This is the Alapin way of declining, and it forces White to do something about the e4 pawn at once.
                fr: Les Noirs se développent et frappent e4 au lieu de prendre. C'est la manière Alapin de refuser, et elle oblige les Blancs à s'occuper immédiatement du pion e4.
              children:
                - ply: e5
                  annotation:
                    vi: Trắng đẩy tốt lên và đuổi con mã. Mã phải đi d5, và sau đó Trắng lấy lại con tốt d4 bằng cxd4. Thế cờ vừa chuyển thẳng sang biến Alapin của Sicily, nơi Trắng không thí gì hết.
                    en: White pushes past and chases the knight. It has to go to d5, and White then wins the d4 pawn back with cxd4. The game has transposed straight into the Alapin Sicilian, where White has sacrificed nothing.
                    fr: Les Blancs poussent et chassent le cavalier. Il doit aller en d5, et les Blancs récupèrent ensuite le pion d4 par cxd4. La partie a transposé directement dans la sicilienne Alapin, où les Blancs n'ont rien sacrifié.
                  outcome:
                    type: position
                    evaluation:
                      vi: Đen đang hơn một con tốt nhưng chỉ trong một nước, vì con tốt d4 sẽ rơi sau cxd4. Con mã f6 bị đánh và phải lui về d5, ở đó nó sẽ bị Nf3 và c4 hoặc Bc4 quấy rối. Kết quả là một thế cờ Alapin bình thường, Trắng có chút không gian nhờ tốt e5 và Đen chơi ngược lại bằng d6 hoặc e6 cùng d6.
                      en: Black is a pawn up, but only for one move, because the d4 pawn falls to cxd4. The knight on f6 is attacked and must retreat to d5, where Nf3 and c4, or Bc4, will keep asking it questions. The result is an ordinary Alapin, White with a little space thanks to the e5 pawn and Black hitting back with ...d6, or ...e6 and ...d6.
                      fr: Les Noirs ont un pion de plus, mais pour un coup seulement, car le pion d4 tombera après cxd4. Le cavalier f6 est attaqué et doit reculer en d5, où Nf3 et c4, ou Bc4, continueront de le harceler. Il en résulte une Alapin ordinaire, les Blancs avec un peu d'espace grâce au pion e5 et les Noirs contre-attaquant par ...d6, ou ...e6 et ...d6.
                    plan:
                      vi: Trắng chơi cxd4 lấy lại tốt, rồi Nf3, Bc4 đánh vào mã d5, Nc3 hoặc O-O, và giữ con tốt e5 càng lâu càng tốt vì nó là toàn bộ không gian của Trắng. Đen chơi Nd5 rồi d6 hoặc e6, Nc6 ép vào d4, Be7 và O-O, và nước phá là d6 để xoá con tốt e5. Nếu con tốt e5 biến mất mà Trắng chưa làm được gì thì Đen đứng thoải mái.
                      en: White plays cxd4 to recover the pawn, then Nf3, Bc4 against the d5 knight, Nc3 or castling, and keeps the e5 pawn as long as possible because it is all of White's space. Black plays ...Nd5, then ...d6 or ...e6, ...Nc6 to press d4, ...Be7 and ...O-O, and the break is ...d6 to remove the e5 pawn. If that pawn disappears before White has achieved anything, Black is comfortable.
                      fr: Les Blancs jouent cxd4 pour reprendre le pion, puis Nf3, Bc4 contre le cavalier d5, Nc3 ou le roque, et gardent le pion e5 le plus longtemps possible car il constitue tout leur espace. Les Noirs jouent ...Nd5, puis ...d6 ou ...e6, ...Nc6 pour peser sur d4, ...Be7 et ...O-O, la rupture étant ...d6 pour supprimer le pion e5. Si ce pion disparaît avant que les Blancs n'aient rien obtenu, les Noirs sont à l'aise.
                    basis:
                      by: chan
                      at: '2026-09-17'
    - ply: d6
      replyQuality: good
      frequency: rare
      annotation:
        vi: Đen tránh gambit bằng cách không ăn gì cả và chấp nhận đổi hậu. Nước này ít gặp nhưng hoàn toàn chơi được, và nó là cách nhanh nhất để đưa ván cờ ra khỏi lý thuyết mà Trắng đã học.
        en: Black sidesteps the gambit by taking nothing and agreeing to a queen trade. It is uncommon but entirely playable, and it is the quickest way to take the game out of the theory White has studied.
        fr: Les Noirs esquivent le gambit en ne prenant rien et en acceptant l'échange des dames. C'est peu courant mais tout à fait jouable, et c'est le moyen le plus rapide de sortir la partie de la théorie que les Blancs ont apprise.
      children:
        - ply: dxc5
          annotation:
            vi: Trắng ăn và mời đổi hậu. Đen chơi dxc5 rồi Qxd8+ Kxd8, vua Đen mất quyền nhập thành nhưng bàn cờ cũng không còn hậu để trừng phạt điều đó. Trắng không được gì ngoài một nhịp.
            en: White takes and invites the queen trade. Black replies ...dxc5 and after Qxd8+ Kxd8 the black king has lost the right to castle, but there is no queen left on the board to punish that. White has gained nothing but a tempo.
            fr: Les Blancs prennent et proposent l'échange des dames. Les Noirs répondent ...dxc5 et après Qxd8+ Kxd8, le roi noir a perdu le droit de roquer, mais il ne reste plus de dame pour le lui faire payer. Les Blancs n'ont gagné qu'un temps.
          unsettled: >-
            dxc5 is going free and the evaluation is written from the position after it — its first clause says so. The recapture is not a choice and the queen trade that follows is the whole content of the line, so stopping here and describing what follows is the honest shape.
          outcome:
            type: position
            evaluation:
              vi: Quân số ngang nhau sau khi Đen ăn lại ở c5. Hậu sẽ được đổi ngay và vua Đen phải đứng ở d8 một lúc, đó là phiền toái duy nhất của Đen. Không bên nào có điểm yếu tốt, và cấu trúc hoàn toàn đối xứng ở cánh vua. Đây là một thế cờ hoà nhiều hơn là một ván cờ, và với một người chơi Morra thì đó chính là điều khó chịu nhất.
              en: Material is level once Black recaptures on c5. Queens come off immediately and the black king stands on d8 for a while, which is Black's only inconvenience. Neither side has a pawn weakness and the kingside is symmetrical. This is closer to a draw than to a game, and for a Morra player that is the most annoying thing about it.
              fr: Le matériel est égal une fois que les Noirs reprennent en c5. Les dames s'échangent aussitôt et le roi noir reste un moment en d8, ce qui est le seul désagrément noir. Aucun camp n'a de faiblesse de pions et l'aile roi est symétrique. C'est plus proche d'une nulle que d'une partie, et pour un joueur de Morra c'est bien là le plus agaçant.
            plan:
              vi: Trắng chơi Qxd8+ rồi Nc3, Bf4 hoặc Be3 và O-O-O, dùng cột d và tìm cách ép vào ô d6 cùng con tốt c5 hay b7. Đen chơi dxc5 rồi Kxd8, sau đó Nc6, Nf6, Be6 hoặc e5 để chiếm trung tâm, đưa vua về c7 và nối hai xe. Nước phá của Trắng là e5 hoặc f4 rồi e5, còn Đen thì muốn đổi hết quân nhẹ và về một tàn cuộc cân bằng.
              en: White plays Qxd8+, then Nc3, Bf4 or Be3 and O-O-O, uses the d-file and looks to press d6, c5 or b7. Black recaptures with ...dxc5 and ...Kxd8, then ...Nc6, ...Nf6, ...Be6 or ...e5 for the centre, walks the king to c7 and connects the rooks. White's break is e5, or f4 and then e5; Black simply wants to trade the minor pieces off and reach a level endgame.
              fr: Les Blancs jouent Qxd8+, puis Nc3, Bf4 ou Be3 et O-O-O, exploitent la colonne d et cherchent à peser sur d6, c5 ou b7. Les Noirs reprennent par ...dxc5 et ...Kxd8, puis ...Nc6, ...Nf6, ...Be6 ou ...e5 pour le centre, conduisent le roi en c7 et relient les tours. La rupture blanche est e5, ou f4 puis e5 ; les Noirs veulent simplement échanger les pièces mineures et atteindre une finale égale.
            basis:
              by: chan
              at: '2026-09-17'
