    - ply: d6
      replyQuality: good
      frequency: rare
      annotation:
        vi: Đen tránh gambit bằng cách không ăn gì cả và chấp nhận đổi hậu. Nước này ít gặp nhưng hoàn toàn chơi được, và nó là cách nhanh nhất để đưa ván cờ ra khỏi lý thuyết mà Trắng đã học.
        en: Black sidesteps the gambit by taking nothing and agreeing to a queen trade. It is uncommon but entirely playable, and it is the quickest way to take the game out of the theory White has studied.
        fr: Les Noirs esquivent le gambit en ne prenant rien et en acceptant l'échange des dames. C'est peu courant mais tout à fait jouable, et c'est le moyen le plus rapide de sortir la partie de la théorie que les Blancs ont apprise.
      children:
        - ply: dxc5
          annotation:
            vi: Trắng ăn và mời đổi hậu. Đen chơi dxc5 rồi Qxd8+ Kxd8, vua Đen mất quyền nhập thành nhưng bàn cờ cũng không còn hậu để trừng phạt điều đó. Trắng không được gì ngoài một nhịp.
            en: White takes and invites the queen trade. Black replies ...dxc5 and after Qxd8+ Kxd8 the black king has lost the right to castle, but there is no queen left on the board to punish that. White has gained nothing but a tempo.
            fr: Les Blancs prennent et proposent l'échange des dames. Les Noirs répondent ...dxc5 et après Qxd8+ Kxd8, le roi noir a perdu le droit de roquer, mais il ne reste plus de dame pour le lui faire payer. Les Blancs n'ont gagné qu'un temps.
          outcome:
            type: position
            evaluation:
              vi: Quân số ngang nhau sau khi Đen ăn lại ở c5. Hậu sẽ được đổi ngay và vua Đen phải đứng ở d8 một lúc, đó là phiền toái duy nhất của Đen. Không bên nào có điểm yếu tốt, và cấu trúc hoàn toàn đối xứng ở cánh vua. Đây là một thế cờ hoà nhiều hơn là một ván cờ, và với một người chơi Morra thì đó chính là điều khó chịu nhất.
              en: Material is level once Black recaptures on c5. Queens come off immediately and the black king stands on d8 for a while, which is Black's only inconvenience. Neither side has a pawn weakness and the kingside is symmetrical. This is closer to a draw than to a game, and for a Morra player that is the most annoying thing about it.
              fr: Le matériel est égal une fois que les Noirs reprennent en c5. Les dames s'échangent aussitôt et le roi noir reste un moment en d8, ce qui est le seul désagrément noir. Aucun camp n'a de faiblesse de pions et l'aile roi est symétrique. C'est plus proche d'une nulle que d'une partie, et pour un joueur de Morra c'est bien là le plus agaçant.
            plan:
              vi: Trắng chơi Qxd8+ rồi Nc3, Bf4 hoặc Be3 và O-O-O, dùng cột d và tìm cách ép vào ô d6 cùng con tốt c5 hay b7. Đen chơi dxc5 rồi Kxd8, sau đó Nc6, Nf6, Be6 hoặc e5 để chiếm trung tâm, đưa vua về c7 và nối hai xe. Nước phá của Trắng là e5 hoặc f4 rồi e5, còn Đen thì muốn đổi hết quân nhẹ và về một tàn cuộc cân bằng.
              en: White plays Qxd8+, then Nc3, Bf4 or Be3 and O-O-O, uses the d-file and looks to press d6, c5 or b7. Black recaptures with ...dxc5 and ...Kxd8, then ...Nc6, ...Nf6, ...Be6 or ...e5 for the centre, walks the king to c7 and connects the rooks. White's break is e5, or f4 and then e5; Black simply wants to trade the minor pieces off and reach a level endgame.
              fr: Les Blancs jouent Qxd8+, puis Nc3, Bf4 ou Be3 et O-O-O, exploitent la colonne d et cherchent à peser sur d6, c5 ou b7. Les Noirs reprennent par ...dxc5 et ...Kxd8, puis ...Nc6, ...Nf6, ...Be6 ou ...e5 pour le centre, conduisent le roi en c7 et relient les tours. La rupture blanche est e5, ou f4 puis e5 ; les Noirs veulent simplement échanger les pièces mineures et atteindre une finale égale.
