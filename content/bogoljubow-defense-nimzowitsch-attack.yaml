tree:
  annotation:
    vi: Trắng vừa chơi 7.Ne5, đưa mã nhắm vào f7. Tượng c4 cũng tấn công f7, nên tốt này bị tấn công hai lần mà chỉ có vua bảo vệ.
    en: White has just played 7.Ne5, aiming the knight at f7. The bishop on c4 also attacks f7, so that pawn is attacked twice and defended only by the king.
    fr: 'Les Blancs viennent de jouer 7.Ne5, dirigeant le cavalier vers f7. Le fou c4 attaque aussi f7 : ce pion est donc attaqué deux fois et défendu seulement par le roi.'
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 7...O-O. Bài này chỉ đi theo nhánh nhập thành 7...O-O; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 7...O-O here. This entry follows the castling reply 7...O-O only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 7...O-O. Cette fiche ne suit que la réponse 7...O-O, le roque ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: O-O
      replyQuality: good
      frequency: common
      annotation:
        vi: 'Đen nhập thành bằng 7...O-O, đưa xe ra f8 để cùng vua bảo vệ f7: tốt này giờ bị mã và tượng tấn công hai lần và được xe và vua bảo vệ hai lần.'
        en: 'Black castles with 7...O-O, which brings the rook to f8 to defend f7 alongside the king: the pawn is now attacked twice, by the knight and the bishop, and defended twice, by the rook and the king.'
        fr: 'Les Noirs roquent par 7...O-O, ce qui amène la tour en f8 pour défendre f7 avec le roi : le pion est désormais attaqué deux fois, par le cavalier et le fou, et défendu deux fois, par la tour et le roi.'
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng sáu, Đen bảy, nên Trắng kém một tốt. Đen đã nhập thành, còn vua Trắng vẫn ở e1 với cả hai quyền nhập thành. Tốt f7, mục tiêu của mã e5 và tượng c4, được xe f8 và vua g8 bảo vệ hai lần.'
          en: "Count the pawns: White six, Black seven, so White is a pawn down. Black has castled, while White's king is still on e1 with both castling rights. The pawn on f7, the target of the knight on e5 and the bishop on c4, is defended twice, by the rook on f8 and the king on g8."
          fr: 'Comptez les pions : six pour les Blancs, sept pour les Noirs ; les Blancs sont donc un pion en moins. Les Noirs ont roqué, alors que le roi blanc est encore en e1 avec les deux droits de roque. Le pion f7, cible du cavalier e5 et du fou c4, est défendu deux fois, par la tour f8 et le roi g8.'
        plan:
          vi: Trắng nhập thành rồi thêm Bg5 hoặc Qd3 vào đòn tấn công cánh vua; Đen thách thức mã e5 bằng ...Nc6 hoặc ...Nfd7, cố đổi con quân đang nhắm vào f7.
          en: White castles, then adds Bg5 or Qd3 to the kingside pressure; Black challenges the knight on e5 with ...Nc6 or ...Nfd7, trying to trade off the piece that eyes f7.
          fr: Les Blancs roquent, puis ajoutent Bg5 ou Qd3 à la pression sur l'aile roi ; les Noirs défient le cavalier e5 par ...Nc6 ou ...Nfd7, cherchant à échanger la pièce qui vise f7.
