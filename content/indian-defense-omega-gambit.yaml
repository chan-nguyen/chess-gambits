# Indian Defense, Omega Gambit. One entry in a batch authored for issue #148 (batch h).
# Defining line ends on White's 2.e4 (invariant 5) — the dataset's own shortest line for
# this name already ends there, on White's own ply, so no ply needs to be trimmed out into a
# modelled reply. The single child below is this author's own choice of the natural,
# thematic reply rather than a further named sub-variation, and it was replayed with
# chess.js like every other ply. Every ply below was replayed with chess.js before being
# written.
id: indian-defense-omega-gambit
name: 'Indian Defense: Omega Gambit'
eco: A45
category: gambit
side: white
definingLine: [d4, Nf6, e4]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. The pawn buys a full centre and open lines toward the knight that captures
      it, and the resulting position has never been shown worse than roughly level for White.
      No engine was consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Trắng vừa đẩy tốt lên e4, dựng một trung tâm rộng ngay lập tức thay vì đi Nf3 hay c4 như thường lệ. Con tốt e4 chưa được ai đỡ và mã f6 có thể ăn nó ngay.
    en: White has just pushed the pawn to e4, building a big centre at once instead of the usual Nf3 or c4. The e4 pawn is defended by nothing yet, and the f6 knight can take it right away.
    fr: Les Blancs viennent de pousser le pion en e4, bâtissant tout de suite un grand centre au lieu des habituels Cf3 ou c4. Le pion e4 n'est pas encore défendu, et le cavalier f6 peut le prendre immédiatement.
  dismissRest:
    reason:
      vi: Đen không ăn tốt e4 — chơi 2...d6 hay 2...g6. Mỗi lựa chọn để nguyên con tốt e4 trên bàn cờ, nghĩa là lời mời vẫn chưa hề được nhận.
      en: Black does not take the e4 pawn — playing 2...d6, or 2...g6. Each leaves the e4 pawn sitting on the board, meaning the invitation has still not actually been accepted.
      fr: Les Noirs ne prennent pas le pion e4 — jouant 2...d6, ou 2...g6. Chacun laisse le pion e4 sur l'échiquier, ce qui veut dire que l'invitation n'a toujours pas été acceptée.
  children:
    - ply: Nxe4
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen nhận tốt ngay lập tức bằng mã, quân duy nhất có thể ăn tại đó. Con mã ấy giờ đứng khá xa, không được tốt nào của Đen bảo vệ.
        en: Black accepts at once with the knight, the only piece that can capture there. That knight now stands rather far out, protected by no Black pawn.
        fr: Les Noirs acceptent aussitôt avec le cavalier, la seule pièce pouvant capturer là. Ce cavalier se retrouve assez avancé, protégé par aucun pion noir.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy. Đen hơn đúng một tốt sạch, nhưng con mã e4 đứng khá đơn độc và Trắng còn cả tốt d4 lẫn cột f để mở đường tấn công nó.
          en: Count the pawns and it is eight for Black, seven for White. Black is a clean pawn up, but the e4 knight stands fairly alone, and White still has the d4 pawn and the f-file to open lines against it.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs. Les Noirs ont un pion net d'avance, mais le cavalier e4 se retrouve plutôt seul, et les Blancs disposent encore du pion d4 et de la colonne f pour ouvrir des lignes contre lui.
        plan:
          vi: Trắng chơi Bd3 hay Nd2 đuổi mã, rồi f3 nếu cần, tận dụng trung tâm rộng và nhịp phát triển để bù cho con tốt đã mất. Đen chơi Nf6 hay d5, hoàn thiện phát triển và giữ con tốt thừa làm vốn liếng lâu dài.
          en: White plays Bd3 or Nd2 to chase the knight, then f3 if needed, using the big centre and the development tempo to make up for the lost pawn. Black plays Nf6 or d5, completing development and banking the extra pawn as a long-term asset.
          fr: Les Blancs jouent Bd3 ou Cd2 pour chasser le cavalier, puis f3 si besoin, utilisant le grand centre et le temps de développement pour compenser le pion perdu. Les Noirs jouent Cf6 ou d5, achevant leur développement et conservant le pion supplémentaire comme atout durable.
        basis:
          by: chan
          at: '2026-09-25'
