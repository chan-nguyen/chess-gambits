# Italian Game: Classical Variation, Greco Gambit, Anderssen Variation. Frozen
# defining line 1.e4 e5 2.Nf3 Nc6 3.Bc4 Bc5 4.c3 Nf6 5.d4 exd4 6.e5 d5 7.Bb5 Ne4
# 8.cxd4, which ends on White's own ply, so the root is an opponent node
# (docs/CONTEXT.md, invariant 5). Replayed with chess.js through 8...Bb4+ 9.Nc3 — the
# check along the now-open c1-h6 diagonal is blocked by developing the b1-knight.
# searchMate at 3 moves from the resulting position returns no-mate, so no forced mate
# is claimed anywhere in this entry, and no capture is left going free at the leaf.
