# Queen's Gambit Declined, Albin Countergambit, Modern Line, taught. Frozen defining line
# 1.d4 d5 2.c4 e5 3.dxe5 d4 4.Nf3 Nc6, which ends on Black's own 4...Nc6 — the learner's ply —
# so the root is an opponent node (docs/CONTEXT.md, invariant 5), and White's 5.Nbd2, the
# move that gives this entry its name, is modelled as the root's own reply rather than folded
# into the defining line. Every ply was replayed with chess.js, and the leaf was checked with
# `searchMate` (bounded to 2 moves): no-mate.
id: queens-gambit-declined-albin-countergambit-modern-line
name: "Queen's Gambit Declined: Albin Countergambit, Modern Line"
eco: D08
category: gambit
side: black
definingLine: [d4, d5, c4, e5, dxe5, d4, Nf3, Nc6]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. Black keeps the d4 wedge and develops naturally, and White answers by
      routing the knight to d2 rather than fighting for c3 or e4 with a pawn. No engine was
      consulted and no database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Đen vừa phát triển mã ra c6, giữ nguyên con tốt d4 làm nêm. Mục này theo dõi 5.Nbd2, cách xử lý hiện đại nhất — đưa mã vòng qua d2 thay vì tranh chấp trực tiếp.
    en: Black has just developed the knight to c6, keeping the d4 pawn as a wedge. This entry follows 5.Nbd2, the most modern handling — routing the knight via d2 instead of contesting the wedge directly.
    fr: Les Noirs viennent de développer le cavalier en c6, conservant le pion d4 comme un coin. Cette entrée suit 5.Nbd2, le traitement le plus moderne — faisant passer le cavalier par d2 plutôt que de disputer directement le coin.
  dismissRest:
    reason:
      vi: Trắng đáp lại 4...Nc6 bằng một nước khác ngoài 5.Nbd2 — chẳng hạn g3 chuẩn bị fianchetto hay a3 chuẩn bị b4. Mỗi cách nằm ngoài phạm vi mục này.
      en: White meets 4...Nc6 with something other than 5.Nbd2 — for instance g3 preparing a fianchetto, or a3 preparing b4. Each is outside the scope of this entry.
      fr: Les Blancs répondent à 4...Nc6 par autre chose que 5.Nbd2 — par exemple g3 préparant un fianchetto, ou a3 préparant b4. Chacune sort du cadre de cette entrée.
  children:
    - ply: Nbd2
      annotation:
        vi: Trắng đưa mã sang d2, chuẩn bị đổi nó lên b3 hoặc c4 để tấn công con tốt d4 mà không chặn đường tốt c của mình.
        en: White develops the knight to d2, preparing to swing it to b3 or c4 to attack the d4 pawn without blocking the c-pawn.
        fr: Les Blancs développent le cavalier en d2, se préparant à le faire passer en b3 ou c4 pour attaquer le pion d4 sans bloquer leur propre pion c.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Trắng tám, Đen bảy — Đen kém một tốt kể từ 3.dxe5. Con tốt d4 vẫn được tốt c5 hoặc quân khác chống lưng và tiếp tục cấm ô c3, còn con mã d2 của Trắng phải mất thêm một nhịp nữa mới tới được ô hoạt động của nó.
          en: Count the pawns and it is eight for White, seven for Black — Black is a pawn down since 3.dxe5. The d4 pawn is still propped up by c5 or another piece and keeps banning the c3 square, while White's knight on d2 needs a further tempo before it reaches an active square.
          fr: Comptez les pions, huit pour les Blancs, sept pour les Noirs — les Noirs sont en retard d'un pion depuis 3.dxe5. Le pion d4 reste étayé par c5 ou une autre pièce et continue d'interdire la case c3, tandis que le cavalier d2 blanc a besoin d'un temps de plus avant d'atteindre une case active.
        plan:
          vi: Trắng chơi Nb3 hoặc Nc4 tấn công con tốt d4, g3 và Bg2 hoàn tất phát triển, tận dụng nhịp để dần dần vây bắt cái nêm. Đen chơi ...Bg4 gây sức ép lên mã f3, ...Bc5 phát triển nhanh, và giữ vững con tốt d4 càng lâu càng tốt để duy trì lợi thế không gian.
          en: White plays Nb3 or Nc4 to attack the d4 pawn, g3 and Bg2 to finish developing, using the tempo to slowly surround the wedge. Black plays ...Bg4 to pressure the f3 knight, ...Bc5 to develop quickly, and holds onto the d4 pawn as long as possible to keep the space advantage.
          fr: Les Blancs jouent Nb3 ou Nc4 pour attaquer le pion d4, g3 et Bg2 pour achever leur développement, utilisant le temps pour encercler peu à peu le coin. Les Noirs jouent ...Bg4 pour faire pression sur le cavalier f3, ...Bc5 pour se développer vite, et gardent le pion d4 aussi longtemps que possible pour conserver l'avantage d'espace.
        basis:
          by: chan
          at: '2026-09-25'
