# Italian Game: Scotch Gambit, Anderssen Attack, Main Line. Defining line 1.e4 e5 2.Nf3 Nc6
# 3.Bc4 Nf6 4.d4 exd4 5.O-O Nxe4 6.Re1 d5 7.Bxd5 Qxd5 8.Nc3 Qa5 9.Nxe4 Be6 10.Bd2 Qd5
# 11.Bg5, which ends on White's own ply, so the root is an opponent node (docs/CONTEXT.md,
# invariant 5).
