    source: >-
      A judgement. The pieces are level again after the exchanges on d5 and e4, White is a
      pawn down, but White's king is castled while Black's king is still on e8 and the
      e-file is open; that is treated as enough compensation for the line to be labelled
      sound. No engine was consulted and no database was queried.
judgement:
