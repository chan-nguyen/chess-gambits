tree:
  annotation:
    vi: 'Đen vừa chơi 4...b5, hiến một tốt: tốt b5 bị tượng c4 và mã c3 tấn công mà không có quân bảo vệ, và nó tấn công tượng c4, vốn cũng không có quân bảo vệ.'
    en: 'Black has just played 4...b5, offering a pawn: the b5 pawn is attacked by the bishop on c4 and the knight on c3 and has no defender, and it attacks the bishop on c4, which has no defender either.'
    fr: "Les Noirs viennent de jouer 4...b5, offrant un pion : le pion b5 est attaqué par le fou c4 et le cavalier c3 et n'a aucun défenseur, et il attaque le fou c4, qui n'a pas non plus de défenseur."
  dismissRest:
    reason:
      vi: Trắng chọn một nước khác thay vì 5.Bxb5. Bài này chỉ đi theo nhánh ăn tốt 5.Bxb5; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: White plays something other than 5.Bxb5 here. This entry follows the capture 5.Bxb5 only; other moves lead to lines that are not mapped here.
      fr: Les Blancs jouent autre chose que 5.Bxb5. Cette fiche ne suit que la prise 5.Bxb5 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Bxb5
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng ăn tốt bằng tượng, 5.Bxb5, thoát khỏi đòn tấn công của tốt b5 và hơn một tốt, tám đối bảy.
        en: White takes the pawn with the bishop, 5.Bxb5, which steps out of the b5 pawn's attack and leaves White a pawn up, eight to seven.
        fr: Les Blancs prennent le pion avec le fou, 5.Bxb5, qui échappe à l'attaque du pion b5 et laisse les Blancs un pion de plus, huit contre sept.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng tám, Đen bảy, nên con tốt Đen hiến chưa được lấy lại. Đen không còn tốt b nên cột b nửa mở cho quân Đen. Trắng đã phát triển ba quân (tượng b5, mã c3 và mã e2) còn Đen có hai (mã f6 và tượng c5). Tốt e4 bị mã f6 tấn công và được mã c3 bảo vệ; tốt f2 bị tượng c5 tấn công và chỉ có vua bảo vệ.'
          en: "Count the pawns: White eight, Black seven, so the pawn Black offered has not come back. Black has no b-pawn, so the b-file is half open for Black's pieces. White has developed three pieces (the bishop on b5 and the knights on c3 and e2) to Black's two (the knight on f6 and the bishop on c5). The pawn on e4 is attacked by the knight on f6 and defended by the knight on c3; the pawn on f2 is attacked by the bishop on c5 and defended only by the king."
          fr: "Comptez les pions : huit pour les Blancs, sept pour les Noirs ; le pion offert par les Noirs n'est donc pas récupéré. Les Noirs n'ont plus de pion b, si bien que la colonne b est semi-ouverte pour leurs pièces. Les Blancs ont développé trois pièces (le fou b5 et les cavaliers c3 et e2) contre deux aux Noirs (le cavalier f6 et le fou c5). Le pion e4 est attaqué par le cavalier f6 et défendu par le cavalier c3 ; le pion f2 est attaqué par le fou c5 et défendu seulement par le roi."
        plan:
          vi: Đen thách thức tượng bằng ...c6 hoặc nhập thành; Trắng nhập thành và hoàn tất phát triển bằng d3, giữ tốt thừa.
          en: Black challenges the bishop with ...c6 or castles; White castles and completes development with d3, keeping the extra pawn.
          fr: Les Noirs défient le fou par ...c6 ou roquent ; les Blancs roquent et achèvent leur développement par d3, en gardant le pion en plus.
