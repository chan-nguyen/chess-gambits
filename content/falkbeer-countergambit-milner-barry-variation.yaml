# King's Gambit Declined: Falkbeer Countergambit, Milner-Barry Variation. One of a batch of
# entries authored for issue #148 (batch h), sharing the trunk `1.e4 e5 2.f4 d5` with
# `kings-gambit-declined-falkbeer-countergambit.yaml`, whose own root models the quiet
# 3.Nf3 and cross-refers to 3.exd5 (`kings-gambit-declined-falkbeer-countergambit-accepted`).
# This entry follows the third try, 3.Nc3. Defining line ends on Black's 2...d5 (invariant
# 5). Every ply below was replayed with chess.js before being written.
#
# The leaf stops right after 3.Nc3, where Black's exf4 is going free (the f4 pawn is
# defended by nothing, confirmed by a scratch chess.js check) — but that capture is not the
# point of this named variation, which is about the tension White leaves unresolved rather
# than about that one pawn, so the leaf is marked `unsettled` instead of forcing a verdict
# on a capture Black has simply not made yet (docs/CONTEXT.md, invariant 14).
id: falkbeer-countergambit-milner-barry-variation
name: "King's Gambit Declined: Falkbeer Countergambit, Milner-Barry Variation"
eco: C31
