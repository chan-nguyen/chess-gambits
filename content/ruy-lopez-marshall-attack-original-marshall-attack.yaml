tree:
  annotation:
    vi: Đen vừa chơi 11...Nf6, lùi mã khỏi d5. Xe e5 của Trắng tấn công tượng e7 (có hậu d8 bảo vệ) và tốt b5 (có tốt a6 bảo vệ), còn tượng b3 nhắm vào f7. Đen đang kém một tốt, sáu so với bảy.
    en: Black has just played 11...Nf6, pulling the knight back from d5. White's rook on e5 attacks the bishop on e7 (defended by the queen on d8) and the pawn on b5 (defended by the a6 pawn), and the bishop on b3 bears on f7. Black is a pawn down, six to seven.
    fr: Les Noirs viennent de jouer 11...Nf6, ramenant le cavalier de d5. La tour e5 des Blancs attaque le fou e7 (défendu par la dame d8) et le pion b5 (défendu par le pion a6), et le fou b3 vise f7. Les Noirs ont un pion de moins, six contre sept.
  dismissRest:
    reason:
      vi: Trắng chọn nước khác thay vì 12.d4, chẳng hạn 12.d3 hoặc 12.Re1. Đánh giá trong mục này dành cho nhánh Trắng chơi d4 ngay.
      en: White plays something other than 12.d4, for example 12.d3 or 12.Re1. The assessment in this entry is for the line where White plays d4 at once.
      fr: Les Blancs jouent autre chose que 12.d4, par exemple 12.d3 ou 12.Re1. L'évaluation de cette fiche porte sur la ligne où les Blancs jouent d4 tout de suite.
  children:
    - ply: d4
      replyQuality: good
      frequency: common
      annotation:
        vi: Trắng chơi d4, dùng tốt này bảo vệ xe e5 và chiếm trung tâm, đồng thời tạo điểm tựa cho tốt c3.
        en: White plays d4, using the pawn to defend the rook on e5 and take the centre, with the c3 pawn behind it.
        fr: Les Blancs jouent d4, utilisant le pion pour défendre la tour e5 et prendre le centre, avec le pion c3 derrière lui.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen sáu — con tốt Marshall chưa lấy lại được. Cột d nửa mở cho Đen: hậu d8 nhìn thẳng vào tốt d4, vốn được tốt c3 và hậu d1 bảo vệ, còn mã b1, tượng c1 và xe a1 của Trắng vẫn chưa rời ô xuất phát. Xe e5 tấn công tượng e7 và tốt b5 nhưng cả hai đều có quân bảo vệ.'
          en: "Count the pawns: White seven, Black six — the Marshall pawn has not come back. The d-file is half-open for Black: the queen on d8 looks straight at the d4 pawn, which the c3 pawn and the queen on d1 defend, and White's knight on b1, bishop on c1 and rook on a1 have not yet left their starting squares. The rook on e5 attacks the bishop on e7 and the pawn on b5, but each has a defender."
          fr: "Comptons les pions : sept pour les Blancs, six pour les Noirs — le pion Marshall n'est pas revenu. La colonne d est semi-ouverte pour les Noirs : la dame d8 regarde droit vers le pion d4, que le pion c3 et la dame d1 défendent, et le cavalier b1, le fou c1 et la tour a1 des Blancs n'ont pas encore quitté leur case de départ. La tour e5 attaque le fou e7 et le pion b5, mais chacun a un défenseur."
        plan:
          vi: Trắng chơi Re1 khi tượng d6 tấn công xe, rồi Be3 và Nd2 để phát triển nốt. Đen chơi ...Bd6, ...Bg4 hoặc ...Re8 để tăng áp lực lên trung tâm và cánh vua Trắng.
          en: White plays Re1 once the bishop on d6 attacks the rook, then Be3 and Nd2 to finish developing. Black plays ...Bd6, then ...Bg4 or ...Re8 to build up pressure on the centre and on White's kingside.
          fr: Les Blancs jouent Re1 lorsque le fou d6 attaque la tour, puis Be3 et Nd2 pour achever leur développement. Les Noirs jouent ...Bd6, puis ...Bg4 ou ...Re8 pour accroître la pression sur le centre et sur l'aile roi blanche.
        basis:
          by: chan
          at: '2026-09-30'
