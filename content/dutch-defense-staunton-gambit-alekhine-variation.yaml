tree:
  annotation:
    vi: Trắng vừa chơi 5.h4, dùng tốt bảo vệ tượng g5 và chuẩn bị h5. Tượng g5 tấn công mã f6, chỉ có tốt e7 bảo vệ. Tốt thừa e4 của Đen bị mã c3 tấn công và được mã f6 bảo vệ.
    en: White has just played 5.h4, supporting the bishop on g5 with a pawn and preparing h5. The bishop attacks the knight on f6, which only the e7 pawn defends. Black's extra pawn on e4 is attacked by the knight on c3 and defended by the knight on f6.
    fr: Les Blancs viennent de jouer 5.h4, soutenant le fou g5 par un pion et préparant h5. Le fou attaque le cavalier f6, que seul le pion e7 défend. Le pion e4 en trop des Noirs est attaqué par le cavalier c3 et défendu par le cavalier f6.
  dismissRest:
    reason:
      vi: Đen chọn một nước khác thay vì 5...Bg7. Bài này chỉ đi theo nhánh 5...Bg7; các nước còn lại dẫn tới những biến khác chưa được lập bản đồ ở đây.
      en: Black plays something other than 5...Bg7 here. This entry follows the reply 5...Bg7 only; other moves lead to lines that are not mapped here.
      fr: Les Noirs jouent autre chose que 5...Bg7. Cette fiche ne suit que la réponse 5...Bg7 ; les autres coups mènent à des lignes qui ne sont pas cartographiées ici.
  children:
    - ply: Bg7
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen phát triển bằng 5...Bg7, thêm quân thứ hai bảo vệ mã f6 (tốt e7 và tượng g7) và chuẩn bị nhập thành.
        en: Black develops with 5...Bg7, adding a second defender to the knight on f6 (the e7 pawn and the bishop on g7) and preparing to castle.
        fr: Les Noirs se développent par 5...Bg7, ajoutant un second défenseur au cavalier f6 (le pion e7 et le fou g7) et préparant le roque.
      outcome:
        type: position
        evaluation:
          vi: 'Đếm tốt: Trắng bảy, Đen tám, nên Trắng kém một tốt, và Đen có hai tốt trên cột e, ở e7 và e4. Tốt e4 bị mã c3 tấn công một lần và được mã f6 bảo vệ một lần; mã f6 bị tượng g5 tấn công nhưng được tốt e7 và tượng g7 bảo vệ.'
          en: 'Count the pawns: White seven, Black eight, so White is a pawn down, and Black has two pawns on the e-file, on e7 and e4. The pawn on e4 is attacked once, by the knight on c3, and defended once, by the knight on f6; the knight on f6 is attacked by the bishop on g5 but defended by the e7 pawn and the bishop on g7.'
          fr: 'Comptez les pions : sept pour les Blancs, huit pour les Noirs ; les Blancs sont donc un pion en moins, et les Noirs ont deux pions sur la colonne e, en e7 et en e4. Le pion e4 est attaqué une fois, par le cavalier c3, et défendu une fois, par le cavalier f6 ; le cavalier f6 est attaqué par le fou g5 mais défendu par le pion e7 et le fou g7.'
        plan:
          vi: Trắng đẩy h5 để mở cột h nhắm vào g6 hoặc tăng lực bằng Qd2; Đen giữ trung tâm bằng ...d5 hoặc ...c5 và nhập thành.
          en: White pushes h5 to open the h-file against g6 or adds force with Qd2; Black holds the centre with ...d5 or ...c5 and castles.
          fr: Les Blancs poussent h5 pour ouvrir la colonne h contre g6 ou renforcent avec Qd2 ; les Noirs tiennent le centre par ...d5 ou ...c5 et roquent.
