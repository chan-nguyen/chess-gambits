# Bishop's Opening: Urusov Gambit, Panov Variation. Frozen defining line 1.e4 e5 2.Bc4
# Nf6 3.d4 exd4 4.Nf3 d5 5.exd5 Bb4+ 6.c3, which ends on White's own ply, so the root
# is an opponent node (docs/CONTEXT.md, invariant 5). Replayed with chess.js through
# 6...Qe7+ 7.Be3 — the check along the fully open e-file is blocked by developing the
# c1-bishop. searchMate at 3 moves from the resulting position returns no-mate, so no
# forced mate is claimed anywhere in this entry, and no capture is left going free at
# the leaf.
