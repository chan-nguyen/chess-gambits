tree:
  annotation:
    vi:
      Đen chơi ngay 3...f5, phản kích trung tâm bằng tốt f thay vì phát triển quân bình thường — kiểu
      chơi mạo hiểm và thiên về chiến thuật ngay từ đầu.
    en: Black plays 3...f5 immediately, striking at the centre with the f-pawn instead of developing
      normally — a sharp, tactical try from the very first moves.
    fr: Les Noirs jouent immédiatement 3...f5, frappant le centre avec le pion f au lieu de se
      développer normalement — un choix tranchant et tactique dès les premiers coups.
  dismissRest:
    reason:
      vi:
        Trắng chơi nước khác ngoài 4.Nc3, ví dụ Bxc6 đổi tượng lấy mã trước, hoặc d3. Ý tưởng chung —
        khai thác trung tâm mà Đen vừa làm suy yếu — không đổi nhiều theo thứ tự nước đi.
      en:
        White plays something other than 4.Nc3, for instance Bxc6 trading the bishop for the knight
        first, or d3. The general idea — exploiting the centre Black has just loosened — does not
        change much with the move order.
      fr:
        Les Blancs jouent autre chose que 4.Nc3, par exemple Bxc6 échangeant d'abord le fou contre le
        cavalier, ou d3. L'idée générale — exploiter le centre que les Noirs viennent de relâcher —
        ne change guère selon l'ordre des coups.
  children:
    - ply: Nc3
      replyQuality: best
      frequency: common
      annotation:
        vi: Trắng phát triển mã lên c3, chống lại áp lực lên e4 trước khi tính đến việc ăn tốt f5.
        en:
          White develops the knight to c3, meeting the pressure on e4 before worrying about the pawn on
          f5.
        fr:
          Les Blancs développent le cavalier en c3, répondant à la pression sur e4 avant de s'occuper du
          pion f5.
      outcome:
        type: position
        evaluation:
          vi:
            Đếm tốt, hai bên đều có 8 — vật chất vẫn cân bằng ở đây, con tốt f5 chưa mất mà chỉ mới được đẩy
            lên.
          en:
            Count the pawns and both sides still have 8 — material is level here, since the f5 pawn has only
            advanced, not been lost.
          fr:
            Comptez les pions, chaque camp en a encore 8 — le matériel est égal ici, le pion f5 n'a fait
            qu'avancer, il n'a pas été perdu.
        plan:
          vi:
            Trắng tiếp tục với d3 hoặc exf5, khai thác việc Đen đã làm suy yếu ô e6 và trung tâm để đổi lấy
            hoạt động của tượng f8. Đen chơi fxe4 hoặc Nf6, chấp nhận cấu trúc tốt phức tạp và tìm
            phản công nhanh trước khi Trắng kịp củng cố.
          en:
            White continues with d3 or exf5, exploiting the weakened e6 square and centre that Black
            accepted in exchange for activity for the bishop on f8. Black plays fxe4 or Nf6, living
            with a messy pawn structure and looking for quick counterplay before White can
            consolidate.
          fr:
            Les Blancs poursuivent avec d3 ou exf5, exploitant la case e6 affaiblie et le centre que les
            Noirs ont accepté en échange de l'activité du fou f8. Les Noirs jouent fxe4 ou Nf6,
            acceptant une structure de pions compliquée et cherchant un contre-jeu rapide avant que
            les Blancs ne consolident.
        basis:
          by: chan
          at: 2026-09-29
