# King's Gambit Declined: Classical Variation, Euwe Attack, taught. Frozen defining line
# 1.e4 e5 2.f4 Bc5 3.Nf3 d6 4.c3 Bg4 5.fxe5 dxe5 6.Qa4+ ends on White's own 6.Qa4+, so the
# root is an opponent node, and it is in check (docs/CONTEXT.md, invariant 5). The modelled
# line is 6...c6 7.Nxe5 Be6, so the leaf has White to move; the capture on e5 is played out
# as the learner's move so that it is not left going free. The root's eight legal replies
# are a declared count (ADR-0011). Every ply was replayed with chess.js; searchMate at 3
# moves from the leaf returns no-mate, the leaf is not in check and no capture is going
# free.
id: kings-gambit-declined-classical-variation-euwe-attack
name: "King's Gambit Declined: Classical Variation, Euwe Attack"
eco: C30
category: gambit
side: white
definingLine: [e4, e5, f4, Bc5, Nf3, d6, c3, Bg4, fxe5, dxe5, Qa4+]
soundness:
  value: dubious
  reviewedAt: '2026-09-30'
  basis:
    by: chan
    at: '2026-09-30'
    source: >-
      A judgement. After 6.Qa4+ every Black reply leaves Nxe5 available with nothing able to
      recapture on e5, and after 6...c6 7.Nxe5 Be6 White is a pawn up with the knight centralised
      on e5 and the pawn on c6 pinned to the king. No engine was consulted and no database was
      queried.
judgement:
  by: chan
  at: '2026-09-30'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's judgement
    on one date, not engine output and not database statistics.
tree:
  counts:
    legal:
      count: legalReplies
      expect: 8
  annotation:
    vi: Trắng vừa chơi 6.Qa4+, chiếu theo đường chéo a4–e8, đồng thời đánh vào tốt a7. Tốt e5 của Đen bị mã f3 tấn công mà không có ai bảo vệ, trong khi tượng g4 của Đen đang đánh vào mã f3.
    en: White has just played 6.Qa4+, checking along the diagonal from a4 to e8 and attacking the pawn on a7 at the same time. Black's pawn on e5 is attacked by the knight on f3 and defended by nothing, while Black's bishop on g4 attacks the knight on f3.
    fr: Les Blancs viennent de jouer 6.Qa4+, donnant échec le long de la diagonale de a4 à e8 et attaquant en même temps le pion a7. Le pion e5 des Noirs est attaqué par le cavalier f3 et défendu par rien, tandis que le fou g4 des Noirs attaque le cavalier f3.
  dismissRest:
    reason:
      vi: Đen có {legal} nước hợp lệ để đáp lại nước chiếu, và nước nào cũng để Trắng chơi Nxe5 mà không quân nào ăn lại được trên e5. Ngoài 6...c6 được mô hình ở đây, còn có các cách chắn và các nước đi vua.
      en: Black has {legal} legal replies to the check, and every one of them leaves White able to play Nxe5 with nothing able to recapture on e5. Besides 6...c6, modelled here, there are other blocks and king moves.
      fr: Les Noirs ont {legal} réponses légales à l'échec, et chacune laisse aux Blancs la possibilité de jouer Nxe5 sans que rien puisse reprendre en e5. Outre 6...c6, modélisée ici, il y a d'autres interpositions et des coups de roi.
  children:
    - ply: c6
      replyQuality: good
      frequency: common
      annotation:
        vi: Đen chắn nước chiếu bằng tốt. Tốt c6 bị hậu đánh và được mã b8 cùng tốt b7 bảo vệ, nhưng tốt e5 vẫn bị đánh mà không có ai bảo vệ.
        en: Black blocks the check with the pawn. The pawn on c6 is attacked by the queen and defended by the knight on b8 and the pawn on b7, but the pawn on e5 is still attacked and undefended.
        fr: Les Noirs interposent le pion. Le pion c6 est attaqué par la dame et défendu par le cavalier b8 et le pion b7, mais le pion e5 est toujours attaqué et sans défense.
      children:
        - ply: Nxe5
          annotation:
            vi: Trắng ăn tốt e5 bằng mã, đánh vào tượng g4, tốt c6 và tốt f7. Tượng g4 không có quân nào bảo vệ.
            en: White takes the pawn on e5 with the knight, which attacks the bishop on g4, the pawn on c6 and the pawn on f7. The bishop on g4 is defended by nothing.
            fr: Les Blancs prennent le pion e5 avec le cavalier, qui attaque le fou g4, le pion c6 et le pion f7. Le fou g4 est défendu par rien.
          dismissRest:
            reason:
              vi: Đen chơi một nước khác thay vì 7...Be6, chẳng hạn 7...Bd7 hoặc 7...Nf6. Tượng g4 đang bị đánh mà không có ai bảo vệ, nên phần lớn các nước không đưa nó đi hay bảo vệ nó sẽ mất nó vì Nxg4.
              en: Black plays something other than 7...Be6, for example 7...Bd7 or 7...Nf6. The bishop on g4 is attacked and undefended, so most moves that neither move it nor defend it lose it to Nxg4.
              fr: Les Noirs jouent autre chose que 7...Be6, par exemple 7...Bd7 ou 7...Nf6. Le fou g4 est attaqué et sans défense, si bien que la plupart des coups qui ne le déplacent pas et ne le défendent pas le perdent après Nxg4.
          children:
            - ply: Be6
              replyQuality: good
              frequency: common
              annotation:
                vi: Đen đưa tượng về e6, nơi không quân nào tấn công nó và nơi nó bảo vệ f7.
                en: Black moves the bishop to e6, where nothing attacks it and where it defends f7.
                fr: Les Noirs mettent le fou en e6, où rien ne l'attaque et où il défend f7.
              outcome:
                type: position
                evaluation:
                  vi: 'Đếm tốt: Trắng bảy, Đen sáu, nên Trắng hơn một tốt, và mã e5 đứng giữa bàn cờ mà không quân nào của Đen tấn công. Tốt c6 của Đen bị ghim vào vua e8 bởi hậu a4 nên không có nước đi nào.'
                  en: "Count the pawns: White seven, Black six, so White is a pawn up, and the knight on e5 stands in the centre with nothing of Black's attacking it. Black's pawn on c6 is pinned to the king on e8 by the queen on a4 and has no move."
                  fr: "Comptez les pions : sept pour les Blancs, six pour les Noirs, si bien que les Blancs ont un pion d'avance, et le cavalier e5 se tient au centre sans que rien chez les Noirs ne l'attaque. Le pion c6 des Noirs est cloué contre le roi e8 par la dame a4 et n'a aucun coup."
                plan:
                  vi: Trắng có thể phát triển bằng d4, đánh vào tượng c5, hoặc Bd3. Đen có thể chiếu bằng ...Qh4+, nước cũng đánh vào tốt e4, hoặc phát triển bằng ...Nf6.
                  en: White can develop with d4, which attacks the bishop on c5, or Bd3. Black can check with ...Qh4+, which also attacks the pawn on e4, or develop with ...Nf6.
                  fr: Les Blancs peuvent se développer par d4, qui attaque le fou c5, ou par Bd3. Les Noirs peuvent donner échec par ...Qh4+, qui attaque aussi le pion e4, ou se développer par ...Nf6.
                basis:
                  by: chan
                  at: '2026-09-30'
