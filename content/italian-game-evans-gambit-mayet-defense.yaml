tree:
  annotation:
    vi: Tốt c3 vừa đánh tượng b4 và dọn chỗ cho d4. Mục này đi sâu riêng vào 5...Bf8, ô lui khiêm tốn nhất trong mọi lựa chọn.
    en: The c3 pawn has just attacked the bishop on b4 and cleared the way for d4. This entry follows specifically 5...Bf8, the most modest retreat of all the choices.
    fr: Le pion c3 vient d'attaquer le fou en b4 et de dégager la route de d4. Cette entrée suit spécifiquement 5...Ff8, le repli le plus modeste de tous les choix possibles.
  dismissRest:
    reason:
      vi: Đen đáp lại 5.c3 bằng một nước khác ngoài 5...Bf8 — lui về a5 (nhánh chính), c5 (McDonnell), e7 (Anderssen) hay d6 (Stone-Ware), hay trả lại tốt bằng 5...d5. Mỗi lựa chọn nằm ngoài phạm vi mục này.
      en: Black meets 5.c3 with something other than 5...Bf8 — retreating to a5 (the main line), c5 (McDonnell), e7 (Anderssen) or d6 (Stone-Ware), or giving the pawn back with 5...d5. Each is outside the scope of this entry.
      fr: Les Noirs répondent à 5.c3 par autre chose que 5...Ff8 — reculant en a5 (la ligne principale), c5 (McDonnell), e7 (Anderssen) ou d6 (Stone-Ware), ou rendant le pion par 5...d5. Chacun sort du cadre de cette entrée.
  children:
    - ply: Bf8
      replyQuality: inaccuracy
      frequency: rare
      annotation:
        vi: Phòng thủ Mayet. Tượng lui hẳn về ô xuất phát của nó, từ bỏ mọi hoạt động để giữ tốt bằng cách an toàn nhất có thể.
        en: The Mayet Defense. The bishop drops all the way back to its home square, giving up all activity to hold the pawn in the safest way possible.
        fr: La Défense Mayet. Le fou recule complètement sur sa case de départ, renonçant à toute activité pour garder le pion de la façon la plus sûre possible.
      outcome:
        type: position
        evaluation:
          vi: Đếm tốt thì Đen tám, Trắng bảy — Đen vẫn hơn đúng một tốt. Nhưng con tượng đã mất hai nhịp chỉ để quay lại đúng chỗ cũ, không còn tham gia gì vào ván cờ, trong khi Trắng đã có Bc4 phát triển và sắp có cả trung tâm d4-e4.
          en: Count the pawns and it is eight for Black, seven for White — Black is still exactly one pawn up. But the bishop has spent two tempi only to return to its starting square, taking no further part in the game for now, while White already has Bc4 developed and is about to get the d4-e4 centre as well.
          fr: Comptez les pions, huit pour les Noirs, sept pour les Blancs — les Noirs restent exactement un pion devant. Mais le fou a dépensé deux temps pour revenir sur sa case de départ, ne participant plus à la partie pour l'instant, tandis que les Blancs ont déjà Bc4 développé et vont bientôt obtenir aussi le centre d4-e4.
        plan:
          vi: Trắng chơi d4, rồi Nc3 và O-O, dựng trung tâm lớn và tấn công nhanh trong khi con tượng Đen còn đứng yên ở f8. Đen chơi Nf6, cố đưa tượng ra lại bằng ...d6 và ...Be7 hay ...g6, Bg7, chấp nhận chậm phát triển để đổi lấy con tốt.
          en: White plays d4, then Nc3 and O-O, building a big centre and attacking quickly while Black's bishop still sits idle on f8. Black plays Nf6, trying to get the bishop back out with ...d6 and ...Be7 or ...g6 and Bg7, accepting slower development in exchange for the pawn.
          fr: Les Blancs jouent d4, puis Nc3 et O-O, bâtissant un grand centre et attaquant rapidement pendant que le fou noir reste inactif en f8. Les Noirs jouent Nf6, essayant de ressortir le fou par ...d6 et ...Be7 ou ...g6 et Bg7, acceptant un développement plus lent en échange du pion.
        basis:
          by: chan
          at: '2026-09-25'
