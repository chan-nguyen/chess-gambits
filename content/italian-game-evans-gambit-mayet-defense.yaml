# Italian Game, Evans Gambit, Mayet Defense. One of a batch of entries authored for issue
# #148 (batch h), sharing the trunk `1.e4 e5 2.Nf3 Nc6 3.Bc4 Bc5 4.b4 Bxb4 5.c3` with
# `italian-game-evans-gambit.yaml` and its siblings `italian-game-evans-gambit-main-line`
# (5...Ba5), `-mcdonnell-defense` (5...Bc5), `-anderssen-variation` (5...Be7) and
# `-stone-ware-variation` (5...Bd6). Defining line ends on White's 5.c3 (invariant 5). Every
# ply below was replayed with chess.js before being written.
id: italian-game-evans-gambit-mayet-defense
name: 'Italian Game: Evans Gambit, Mayet Defense'
eco: C51
category: gambit
side: white
definingLine: [e4, e5, Nf3, Nc6, Bc4, Bc5, b4, Bxb4, c3]
soundness:
