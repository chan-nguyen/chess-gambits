# Semi-Slav Defense: Noteboom Variation, Anti-Noteboom Gambit. Frozen defining line 1.d4 d5
# 2.c4 e6 3.Nc3 c6 4.Nf3 dxc4 5.g3, which ends on White's own ply, so the root is an
# opponent node (docs/CONTEXT.md, invariant 5). Every ply below was replayed with chess.js.
id: semi-slav-defense-noteboom-variation-anti-noteboom-gambit
name: 'Semi-Slav Defense: Noteboom Variation, Anti-Noteboom Gambit'
eco: D31
category: gambit
side: white
definingLine: [d4, d5, c4, e6, Nc3, c6, Nf3, dxc4, g3]
soundness:
  value: dubious
  reviewedAt: '2026-09-25'
  basis:
    by: chan
    at: '2026-09-25'
    source: >-
      A judgement. White lets Black keep the c4 pawn for now and instead fianchettoes with
      5.g3, aiming the bishop at the long diagonal and preparing quick, harmonious
      development rather than spending a tempo chasing the pawn back at once. Black ends up
      a genuine, clean pawn up once ...b5 defends c4 a second time, and White's
      compensation is only the diagonal and a lead in piece activity, real but not yet
      concrete, so the try is fair but no more than dubious. No engine was consulted and no
      database was queried.
judgement:
  by: chan
  at: '2026-09-25'
  source: >-
    Reply qualities, frequencies, evaluations and plans in this entry are one author's
    judgement on one date, not engine output and not database statistics.
tree:
  annotation:
    vi: Sau khi ăn tốt c4, Trắng không vội đòi lại ngay mà chơi 5.g3, chuẩn bị fianchetto tượng lên đường chéo dài thay vì tốn nhịp bắt tốt. Đây chính là ý tưởng Anti-Noteboom — Trắng chấp nhận tạm thời kém một tốt để đổi lấy phát triển nhanh và áp lực lên cặp tốt cánh hậu của Đen.
    en: After Black takes the c4 pawn, White does not rush to win it back and instead plays 5.g3, preparing to fianchetto the bishop onto the long diagonal rather than spending a tempo chasing the pawn. This is the Anti-Noteboom idea — White accepts being a temporary pawn down in exchange for quick development and pressure on Black's queenside pawn duo.
    fr: Après la prise du pion c4 par les Noirs, les Blancs ne se précipitent pas pour le regagner et jouent 5.g3, préparant à fianchetter le fou sur la grande diagonale plutôt que de perdre un temps à chasser le pion. C'est l'idée Anti-Noteboom — les Blancs acceptent d'être temporairement un pion en moins en échange d'un développement rapide et d'une pression sur le duo de pions à l'aile dame noire.
  dismissRest:
    reason:
      vi: Đen không chơi tiếp b5 để bảo vệ thêm cho tốt c4. Các nước khác như Nf6 hay Be7 để con tốt ấy đứng một mình, và Trắng chỉ cần Bg2 hay Qc2 là lấy lại được ngay, quay về một ván cờ cân bằng bình thường.
      en: Black does not follow up with b5 to add a second defender to the c4 pawn. Anything else, such as Nf6 or Be7, leaves that pawn standing on its own, and White simply wins it back with Bg2 or Qc2, returning to a perfectly normal, balanced game.
      fr: Les Noirs ne poursuivent pas par b5 pour ajouter un second défenseur au pion c4. Tout le reste, comme Nf6 ou Be7, laisse ce pion livré à lui-même, et les Blancs le regagnent simplement par Bg2 ou Qc2, revenant à une partie parfaitement normale et équilibrée.
  children:
    - ply: b5
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen chơi b5, bảo vệ thêm cho tốt c4 và giành không gian cánh hậu, quyết tâm giữ trọn con tốt thừa thay vì trả lại ngay. Đây chính là cấu trúc tốt kiểu Noteboom mà cả hệ thống này lấy tên.
        en: Black plays b5, adding a second defender to the c4 pawn and grabbing queenside space, committing to keep the extra pawn rather than hand it straight back. This is exactly the Noteboom-style pawn duo the whole system is named after.
        fr: Les Noirs jouent b5, ajoutant un second défenseur au pion c4 et gagnant de l'espace à l'aile dame, décidés à garder le pion supplémentaire plutôt que de le rendre aussitôt. C'est exactement le duo de pions à la Noteboom qui donne son nom à tout ce système.
      outcome:
        type: position
        evaluation:
          vi: Đếm điểm quân thì Trắng 38, Đen 39 — Đen hơn đúng một tốt sạch. Bù lại, tốt của Đen giờ bị chồng trên cột c, một tốt ở c4 và một tốt ở c6, một nhược điểm cấu trúc lâu dài mà Trắng có thể nhắm tới bằng a4 hay Bg2 nhắm vào đường chéo dài.
          en: Count the point values and it is 38 for White, 39 for Black — Black is a clean pawn up. In return, Black's pawns are now doubled on the c-file, one on c4 and one on c6, a lasting structural defect that White can aim at with a4 or with Bg2 bearing down the long diagonal.
          fr: En comptant les points, cela donne 38 pour les Blancs, 39 pour les Noirs — les Noirs ont un pion net d'avance. En contrepartie, les pions noirs sont désormais doublés sur la colonne c, l'un en c4 et l'autre en c6, une faiblesse structurelle durable que les Blancs peuvent viser par a4 ou par Bg2 sur la grande diagonale.
        plan:
          vi: Trắng chơi Bg2, O-O và a4, gây sức ép lên cặp tốt cánh hậu và khai thác đường chéo dài trong khi hoàn tất phát triển. Đen chơi Bb7, Nf6 và a6, củng cố tốt thừa và bảo vệ cấu trúc tốt trước khi nó bị nhắm tới.
          en: White plays Bg2, O-O and a4, pressuring the queenside pawn duo and putting the long diagonal to use while completing development. Black plays Bb7, Nf6 and a6, consolidating the extra pawn and shoring up the pawn structure before it comes under fire.
          fr: Les Blancs jouent Bg2, O-O et a4, faisant pression sur le duo de pions à l'aile dame et exploitant la grande diagonale tout en achevant leur développement. Les Noirs jouent Bb7, Nf6 et a6, consolidant le pion supplémentaire et renforçant la structure de pions avant qu'elle ne soit attaquée.
        basis:
          by: chan
          at: '2026-09-25'
