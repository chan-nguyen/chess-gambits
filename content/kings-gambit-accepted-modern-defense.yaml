# King's Gambit Accepted, Modern Defense. One of eighteen entries tracked by issue #111
# (group H), sharing the trunk `1.e4 e5 2.f4 exf4 3.Nf3` with `kings-gambit-accepted.yaml`
# and group G (#110). Defining line ends on White's 3.Nf3 (invariant 5). Every move replayed
# with a scratch chess.js script (deleted before commit).
#
# 3...d5 is the very line `kings-gambit-accepted.yaml` itself follows in depth, all the way
# to a resolved position it calls fully level. `transposesTo` cannot express a link into a
# different entry's tree — it is scoped to plies measured from one entry's own root
# (docs/CONTEXT.md, invariant 12, "scoped within one gambit"; `tools/content/schema.ts`) — so
# that resolution cannot simply be pointed to from here. Republishing it here would also not
# survive the stricter #107 bar on its own terms: the sibling entry's own leaf is exactly the
# kind of "material is level" stopping point #107 was written to raise the bar past. Rather
# than either duplicate that leaf or invent a decisive verdict this well-regarded main line
# does not actually have, this entry stops at `unexplored` after the defining reply.
