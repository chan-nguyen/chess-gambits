tree:
  annotation:
    vi: Trắng chơi 3.c3, hiến con tốt d4 để mở đường phát triển và các cột nửa mở cho quân — nước đi
      định nghĩa toàn bộ Smith-Morra Gambit.
    en:
      White plays 3.c3, offering the d4 pawn to open development and half-open files for the pieces —
      the move that defines the whole Smith-Morra Gambit.
    fr: Les Blancs jouent 3.c3, offrant le pion d4 pour ouvrir le développement et des colonnes
      semi-ouvertes pour leurs pièces — le coup qui définit tout le Gambit Smith-Morra.
  dismissRest:
    reason:
      vi:
        Đen từ chối ăn tốt và chơi nước khác ngoài dxc3, ví dụ e5 hay Nf6. Con tốt d4 vẫn ở lại trên bàn
        cờ theo cách nào đó, và ván cờ chuyển sang một biến Smith-Morra từ chối với đánh giá khác.
      en:
        Black declines the pawn and plays something other than dxc3, for instance e5 or Nf6. The d4 pawn
        stays on the board one way or another, and the game shifts into a Smith-Morra Declined line
        with a different assessment.
      fr:
        Les Noirs déclinent le pion et jouent autre chose que dxc3, par exemple e5 ou Nf6. Le pion d4
        reste d'une façon ou d'une autre sur l'échiquier, et la partie bascule vers une ligne du
        Smith-Morra décliné avec une évaluation différente.
  children:
    - ply: dxc3
      replyQuality: best
      frequency: common
      annotation:
        vi: Đen ăn luôn con tốt c3, nhận lời thí và bước vào tabiya chính của Smith-Morra Gambit.
        en:
          Black simply takes the c3 pawn, accepting the gambit and stepping into the Smith-Morra Gambit's
          main tabiya.
        fr:
          Les Noirs prennent tout simplement le pion c3, acceptant le gambit et entrant dans la tabiya
          principale du Gambit Smith-Morra.
      children:
        - ply: Nxc3
          annotation:
            vi: Trắng ăn lại ngay bằng mã, hoàn tất việc thí tốt để đổi lấy phát triển nhanh và các đường mở.
            en:
              White recaptures at once with the knight, completing the pawn sacrifice in exchange for quick
              development and open lines.
            fr:
              Les Blancs reprennent aussitôt avec le cavalier, complétant le sacrifice de pion en échange d'un
              développement rapide et de colonnes ouvertes.
          outcome:
            type: position
            evaluation:
              vi: Đếm tốt, Trắng 6 còn Đen 7 — Đen hơn đúng một tốt sạch.
              en: Count the pawns and it is 6 for White against 7 for Black — Black is up one clean pawn.
              fr:
                "Comptez les pions : 6 pour les Blancs contre 7 pour les Noirs — les Noirs sont en avance d'un
                pion net."
            plan:
              vi:
                Trắng triển khai tự nhiên với Qe2, Rd1 (hoặc Rfd1 nếu đã nhập thành) và đôi khi Bf4/Bg5, dồn
                quân vào các đường mở và cánh hậu Đen đổi lại con tốt đã mất. Đen tranh thủ hoàn
                thiện phát triển, nhập thành cho an toàn, và cố giữ con tốt thừa qua giai đoạn khai
                cuộc nguy hiểm nhất.
              en:
                White develops naturally with Qe2, Rd1 (or Rfd1 once castled) and sometimes Bf4/Bg5, aiming
                pieces down the open lines and at Black's queenside in exchange for the missing
                pawn. Black uses the tempo to finish development, castle to safety, and try to hold
                on to the extra pawn through the sharpest part of the opening.
              fr:
                Les Blancs se développent normalement avec Qe2, Rd1 (ou Rfd1 après le roque) et parfois Bf4/Bg5,
                dirigeant leurs pièces vers les colonnes ouvertes et l'aile dame noire en échange du
                pion manquant. Les Noirs profitent du temps gagné pour achever leur développement,
                roquer et tenter de conserver le pion supplémentaire pendant la phase la plus
                périlleuse de l'ouverture.
            basis:
              by: chan
              at: 2026-09-29
